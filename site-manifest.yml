name: Update site-files.json

on:
  push:
    branches: [main, master]
    paths-ignore:
      - site-files.json

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build file list
        run: node build-site-manifest.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site-files.json
          git diff --staged --quiet || (git commit -m "Update site-files.json" && git push)
