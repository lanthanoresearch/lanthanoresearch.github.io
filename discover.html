<script type="module">

/* =========================================================
   DISCOVER YOUR RESEARCH
   Fully data-driven quiz built from descriptions.json.
   No paper, category, or claim is hardcoded — everything
   below is derived at runtime from the archive's own data.
   ========================================================= */

let descriptions = {};
let pendingPdf = null;
let pendingPaperTitle = null;

const CATEGORY_EMOJI = {
biblical:"📖",
historical:"🏛️",
political:"🏳️",
scientific:"🧪",
medical:"⚕️",
astronomy:"🚀",
technology:"💻",
philosophy:"🧠"
};

function emojiFor(cat){
return CATEGORY_EMOJI[cat] || "🔎";
}

/* Curiosity hooks — these describe what's actually inside each category
   without naming it outright, so the opening question feels different
   from the plain category grid on the homepage. The category itself is
   only revealed once a result is shown. New categories that don't have
   a hand-written hook yet still work via the generic fallback below. */

const CATEGORY_HOOKS = {
biblical: [
"Scripture, examined closely — doctrine, prophecy, and everything argued about in between",
"What the Bible actually says, once assumptions get set aside",
"The debates believers still haven't settled",
"Faith questions worth digging into properly"
],
historical: [
"History, re-examined without the textbook filter",
"Where the official record gets shaky",
"Timelines, disasters, and events worth a second look",
"The past, and the questions still hanging over it"
],
political: [
"What power doesn't want closely examined",
"Where politics and propaganda blur together",
"Power, conflict, and the stories told about both",
"Control, secrecy, and who benefits"
],
scientific: [
"Scientific \"facts\" that are really just assumptions",
"What the data actually shows, once you look closely",
"Long-held claims, tested against the evidence",
"The stuff textbooks present as settled — but isn't"
],
astronomy: [
"What's actually up there — from ancient skies to modern missions",
"Space missions, old cosmologies, and the doubts raised about each",
"How the sky has been pictured, described, and questioned over time",
"Photos, missions, and older ideas about what's overhead"
],
medical: [
"What your body's being told — and what's left out",
"Health claims that deserve a second look",
"Health advice's track record, warts and all",
"Substances, safety, and the studies behind the claims"
],
technology: [
"The systems running quietly in the background of daily life",
"From what's tracking you to what's flying overhead",
"Where surveillance and space technology both live",
"The tech shaping your world — on the ground and off it"
],
philosophy: [
"The big question sitting underneath everything else",
"What reality actually is, once you ask hard enough",
"Meaning, existence, and the frameworks we use to explain them"
]
};

const GENERIC_HOOK_TEMPLATES = [
"Something in the {cat} files",
"A closer look at {cat}",
"What's turned up in the {cat} research"
];

function hookFor(cat){
if(CATEGORY_HOOKS[cat] && CATEGORY_HOOKS[cat].length){
return pickRandom(CATEGORY_HOOKS[cat]);
}
return pickRandom(GENERIC_HOOK_TEMPLATES).replace("{cat}", cat);
}

function titleCase(str){
return str.charAt(0).toUpperCase() + str.slice(1);
}

function shuffle(arr){
const a = arr.slice();
for(let i = a.length - 1; i > 0; i--){
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}

function pickRandom(arr){
return arr[Math.floor(Math.random() * arr.length)];
}

function getVisibleImages(images){
return (images || []).filter(image =>
typeof image === "string" &&
!image.trim().startsWith("#$")
);
}

/* ---------------- Sensitive-content gating ----------------
   A handful of papers in the archive deal with real atrocity, violence,
   or graphic imagery (the site already marks individual graphic images
   with a "#$" filename prefix, and has a per-paper "warning" flag for
   graphic PDFs). Those signals are honored automatically. On top of
   that, a short curated list below covers papers whose SUBJECT MATTER
   is heavy even when no single image is marked graphic — right now
   that's 9/11, the Israel piece, the nuclear one, and the Nazi one.
   All four happen to be tagged "political", which is what makes the
   gating rule below workable: they only enter the recommendation pool
   once the person has actually signaled interest in that angle, either
   by picking it as their starting point or by explicitly opting into
   "political" during a narrowing question. If a future paper this
   heavy doesn't share that tag, add its key here and adjust the gate
   condition to match how it should be unlocked. */

const HEAVY_TOPIC_KEYS = new Set(["911", "godless_israel", "nuclear_scare", "real_nazis"]);

function isHeavyPaper(paper){
if(HEAVY_TOPIC_KEYS.has(paper.key)) return true;
if(paper.warning) return true;
if((paper.images || []).some(img => typeof img === "string" && img.trim().startsWith("#$"))) return true;
return false;
}

function heavyContentUnlocked(){
return primaryCategory === "political" ||
history.some(h => h.type === "category" && h.answer === "yes" && h.value === "political");
}

function sanitizePool(pool){
if(heavyContentUnlocked()) return pool;
return pool.filter(p => !isHeavyPaper(p));
}

/* ---------------- Quiz state ---------------- */

let poolAll = [];               // every paper, as {key, ...fields}
let currentPool = [];           // papers still matching answers so far
let primaryCategory = null;
let history = [];               // [{type, value, answer}]
let usedDims = new Set();
let questionCount = 0;          // total questions asked so far (incl. category pick)
const MAX_QUESTIONS = 3;

const stage = document.getElementById("quizStage");
const progressTrack = document.getElementById("progressTrack");
const headerEl = document.getElementById("discoverHeader");
const headerSub = document.getElementById("headerSub");

const INTRO_SUBS = [
"Answer a couple of quick questions and we'll surface something from the archive worth reading.",
"A few quick taps, then a paper picked just for where your curiosity is pointing.",
"No wrong answers — just tell us where your attention wants to go.",
"Two or three questions. One paper. Let's see what fits."
];

function setHeader(mode, text){
if(mode === "compact"){
headerEl.classList.add("compact");
}else{
headerEl.classList.remove("compact");
if(text) headerSub.textContent = text;
}
}

setHeader("full", pickRandom(INTRO_SUBS));

/* ---------------- Load data ----------------
   Page counts come exclusively from page-counts.json — it's kept
   perfectly current, unlike the "pages" field inside descriptions.json,
   which can go stale. Every paper's page count below is overwritten
   with whatever page-counts.json says, full stop. */

Promise.all([
fetch("descriptions.json").then(r => r.json()),
fetch("page-counts.json").then(r => r.json())
])
.then(([data, pageCounts]) => {
descriptions = data;
poolAll = Object.entries(data).map(([key, p]) => ({
key,
...p,
pages: Number(pageCounts[key]) || 0
}));

let returning = false;
try{
returning = sessionStorage.getItem(RETURN_FLAG_KEY) === "yes";
sessionStorage.removeItem(RETURN_FLAG_KEY);
}catch(e){}

const saved = returning ? loadResultState() : null;

if(saved){
restoreResult(saved);
}else{
startQuiz();
}
})
.catch(() => {
stage.innerHTML = `<div class="quiz-loading">Couldn't load the research archive. Please try again shortly.</div>`;
});

/* ---------------- Category question ---------------- */

const CATEGORY_INTROS = [
"Which of these itches at you the most?",
"What's got your attention right now?",
"Pick the one you can't stop thinking about.",
"Which thread do you want to pull on first?",
"What's worth a closer look today?",
"Where should we start digging?"
];

function getAllCategories(){
const set = new Set();
poolAll.forEach(p => (p.category || []).forEach(c => set.add(c)));
return [...set];
}

function startQuiz(){
currentPool = [];
primaryCategory = null;
history = [];
usedDims = new Set();
questionCount = 1;

setHeader("full", pickRandom(INTRO_SUBS));

// Draw from every category in the archive, not just the biggest ones,
// so repeat visits surface different subjects over time. Still only
// show a handful at once so it doesn't overwhelm.
const all = getAllCategories();
const showFour = all.length >= 4 && Math.random() < 0.3;
const chosen = shuffle(all).slice(0, showFour ? 4 : Math.min(3, all.length));

resetProgress();
addProgressStep("question");

renderCard({
icon: "🧭",
question: pickRandom(CATEGORY_INTROS),
options: shuffle(chosen).map(cat => ({
label: hookFor(cat),
icon: emojiFor(cat),
onClick: () => chooseCategory(cat)
}))
});
}

function chooseCategory(cat){
primaryCategory = cat;
history.push({ type: "category-root", value: cat });
currentPool = poolAll.filter(p => (p.category || []).includes(cat));
advance();
}

/* ---------------- Narrowing questions ---------------- */

const CATEGORY_TEMPLATES = [
"Are you also curious about the {cat} side of this?",
"Would the {cat} angle interest you too?",
"Does {cat} factor into what you're looking for?",
"Should this also touch on {cat}?",
"Is there a {cat} thread you'd want pulled in as well?",
"Want us to bring {cat} into it too?",
"Does the {cat} connection matter to you here?",
"Should {cat} be part of the mix?"
];

const CATEGORY_YES_LABELS = ["Yes, that too", "Definitely", "Sounds right", "Yes, include that", "That angle too", "Bring it in", "Yes, go for it"];
const CATEGORY_NO_LABELS = ["Not really", "Keep it separate", "Not this time", "Skip that angle", "No, just the one", "Leave that out", "No thanks"];

const LENGTH_TEMPLATES = [
"Would you rather start with something quick to get through?",
"Looking for something you can finish in one sitting?",
"Do you want a shorter read to start with?",
"Should we keep this brief?",
"Would a quick one suit you better right now?",
"Short and to the point, or willing to go longer?"
];

const LENGTH_YES_LABELS = ["Something quick", "Keep it short", "Yes, brief is good", "Short and sweet", "Quick one, please"];
const LENGTH_NO_LABELS = ["I want depth", "No, go deep", "Length doesn't matter", "Give me the full thing", "I've got time"];

const RECENCY_TEMPLATES = [
"Are you interested in one of the newer additions to the archive?",
"Do you want something that was added more recently?",
"Should this lean toward the newer material?",
"Interested in what's been added lately?",
"Do you want something from the more recent additions?",
"Does it matter if this has been in the archive a while?"
];

const RECENCY_YES_LABELS = ["Something recent", "Yes, newest first", "Fresh research", "The newer stuff"];
const RECENCY_NO_LABELS = ["Doesn't matter", "No preference", "Classic is fine", "Age doesn't matter"];

function bestSecondarySplit(pool){
const catCounts = {};
pool.forEach(p => {
(p.category || []).forEach(c => {
if(c !== primaryCategory) catCounts[c] = (catCounts[c] || 0) + 1;
});
});

let best = null;
Object.keys(catCounts).forEach(c => {
const dimKey = "cat:" + c;
if(usedDims.has(dimKey)) return;
const yes = pool.filter(p => (p.category || []).includes(c));
const no = pool.filter(p => !(p.category || []).includes(c));
if(yes.length === 0 || no.length === 0) return;
const balance = Math.abs(0.5 - yes.length / pool.length);
if(!best || balance < best.balance){
best = { dimKey, type: "category", value: c, yes, no, balance };
}
});
return best;
}

function lengthSplit(pool){
const dimKey = "length";
if(usedDims.has(dimKey)) return null;

// A plain median split will happily ask "short or long?" even when
// everything in the pool is roughly the same length — a lone 20-page
// outlier next to five 15-pagers isn't a meaningful choice. Only offer
// this question when the pool actually contains something genuinely
// short AND something genuinely long; otherwise it's not a real fork.
const SHORT_MAX = 8;
const LONG_MIN = 20;
const threshold = (SHORT_MAX + LONG_MIN) / 2;

const hasShort = pool.some(p => (Number(p.pages) || 0) <= SHORT_MAX);
const hasLong = pool.some(p => (Number(p.pages) || 0) >= LONG_MIN);
if(!hasShort || !hasLong) return null;

const yes = pool.filter(p => (Number(p.pages) || 0) <= threshold);
const no = pool.filter(p => (Number(p.pages) || 0) > threshold);
if(yes.length === 0 || no.length === 0) return null;

const balance = Math.abs(0.5 - yes.length / pool.length);
return { dimKey, type: "length", value: threshold, yes, no, balance };
}

function recencySplit(pool){
const dimKey = "recency";
if(usedDims.has(dimKey)) return null;
const now = new Date();
const cutoff = new Date(now);
cutoff.setMonth(cutoff.getMonth() - 18);
const yes = pool.filter(p => p.updated && new Date(p.updated) >= cutoff);
const no = pool.filter(p => !p.updated || new Date(p.updated) < cutoff);
if(yes.length === 0 || no.length === 0) return null;
const balance = Math.abs(0.5 - yes.length / pool.length);
return { dimKey, type: "recency", value: cutoff, yes, no, balance };
}

function pickSplit(pool){
const candidates = [bestSecondarySplit(pool), lengthSplit(pool), recencySplit(pool)].filter(Boolean);
if(!candidates.length) return null;
candidates.sort((a, b) => a.balance - b.balance);
const top = candidates.slice(0, Math.min(3, candidates.length));
return pickRandom(top);
}

function advance(){
questionCount++;

if(questionCount > MAX_QUESTIONS){
return showResult();
}

if(currentPool.length <= 1){
return showResult();
}

const split = pickSplit(currentPool);

if(!split){
return showResult();
}

const askedNarrowing = questionCount - 1;
if(currentPool.length <= 3 && askedNarrowing >= 2){
return showResult();
}
if(askedNarrowing >= 2 && Math.random() < 0.55){
return showResult();
}

addProgressStep("question");
askSplitQuestion(split);
}

function askSplitQuestion(split){
let questionText, yesLabel, noLabel, icon;

if(split.type === "category"){
questionText = pickRandom(CATEGORY_TEMPLATES).replace("{cat}", split.value);
yesLabel = pickRandom(CATEGORY_YES_LABELS);
noLabel = pickRandom(CATEGORY_NO_LABELS);
icon = emojiFor(split.value);
}else if(split.type === "length"){
questionText = pickRandom(LENGTH_TEMPLATES);
yesLabel = pickRandom(LENGTH_YES_LABELS);
noLabel = pickRandom(LENGTH_NO_LABELS);
icon = "📄";
}else{
questionText = pickRandom(RECENCY_TEMPLATES);
yesLabel = pickRandom(RECENCY_YES_LABELS);
noLabel = pickRandom(RECENCY_NO_LABELS);
icon = "🕒";
}

setHeader("compact");

const options = shuffle([
{
label: yesLabel,
extraClass: "yes-lean",
onClick: () => {
usedDims.add(split.dimKey);
history.push({ type: split.type, value: split.value, answer: "yes" });
currentPool = split.yes;
advance();
}
},
{
label: noLabel,
extraClass: "no-lean",
onClick: () => {
usedDims.add(split.dimKey);
history.push({ type: split.type, value: split.value, answer: "no" });
currentPool = split.no;
advance();
}
}
]);

renderCard({ icon, question: questionText, options });
}

/* ---------------- Rendering ---------------- */

/* ---------------- Progress dots ----------------
   Dynamic and append-only: one dot for the start, one for each
   question actually asked (however many that turns out to be), and
   one for the final result. A new question always gets its own new
   dot — nothing is reused or skipped. Once the result is shown, every
   dot (including the last) is filled solid; nothing is left looking
   "in progress" once you've reached a paper. */

let progressDots = [];

function resetProgress(){
progressTrack.innerHTML = "";
progressDots = [];
}

function addProgressStep(type){
if(progressDots.length){
const prev = progressDots[progressDots.length - 1];
prev.el.classList.remove("current");
prev.el.classList.add("filled");
}
const dot = document.createElement("div");
dot.className = "progress-dot current" + (type !== "question" ? " endpoint" : "");
progressTrack.appendChild(dot);
progressDots.push({ type, el: dot });
}

function completeProgress(){
progressDots.forEach(d => {
d.el.classList.remove("current");
d.el.classList.add("filled");
});
}

function renderCard({ icon, question, options }){
const card = document.createElement("div");
card.className = "quiz-card";

const iconEl = document.createElement("div");
iconEl.className = "quiz-icon";
iconEl.textContent = icon || "🔎";

const qEl = document.createElement("div");
qEl.className = "quiz-question";
qEl.textContent = question;

const optWrap = document.createElement("div");
optWrap.className = "quiz-options";

options.forEach(opt => {
const btn = document.createElement("button");
btn.type = "button";
btn.className = "quiz-option" + (opt.extraClass ? " " + opt.extraClass : "");

if(opt.icon){
btn.classList.add("has-icon");
const iconSpan = document.createElement("span");
iconSpan.className = "opt-emoji";
iconSpan.textContent = opt.icon;
const textSpan = document.createElement("span");
textSpan.className = "opt-text";
textSpan.textContent = opt.label;
btn.appendChild(iconSpan);
btn.appendChild(textSpan);
}else{
btn.textContent = opt.label;
}

btn.addEventListener("click", () => {
transitionOut(card, () => opt.onClick());
});
optWrap.appendChild(btn);
});

card.appendChild(iconEl);
card.appendChild(qEl);
card.appendChild(optWrap);

stage.innerHTML = "";
stage.appendChild(card);
}

function transitionOut(el, next){
if(el){
el.classList.add("leaving");
setTimeout(next, 160);
}else{
next();
}
}

/* ---------------- Result ---------------- */

const RESULT_INTROS = [
"We found something you might be interested in.",
"Here's something from the archive that fits.",
"This one matches where your answers pointed.",
"Found it — take a look."
];

const WHY_INTROS = [
"You pointed toward {cat} research",
"Your answers led toward {cat}",
"This matches the {cat} thread you were pulling on",
"Rooted in the {cat} category"
];

function formatDate(dateStr){
if(!dateStr) return null;
const d = new Date(dateStr);
if(isNaN(d)) return null;
return d.toLocaleDateString(undefined, { month: "long", year: "numeric" });
}

function buildWhyClauses(paper){
const clauses = [];

history.forEach(h => {
if(h.type === "category-root") return;

if(h.type === "category"){
if(h.answer === "yes"){
clauses.push(`touches on ${h.value}`);
}else{
clauses.push(`stays focused without wandering into ${h.value}`);
}
}else if(h.type === "length"){
const pages = Number(paper.pages) || 0;
if(h.answer === "yes"){
clauses.push(pages ? `a shorter read at ${pages} page${pages === 1 ? "" : "s"}` : "a short read");
}else{
clauses.push(pages ? `a deeper dive at ${pages} pages` : "a more thorough piece");
}
}else if(h.type === "recency"){
const dateLabel = formatDate(paper.updated);
if(h.answer === "yes"){
clauses.push(dateLabel ? `one of the newer additions to the archive (added ${dateLabel})` : "one of the newer additions to the archive");
}else{
clauses.push(dateLabel ? `a longer-standing piece in the archive (added ${dateLabel})` : "an established piece in the archive");
}
}
});

return clauses;
}

function pickPaper(pool){
const key = "discoverLastPaper";
const lastKey = sessionStorage.getItem(key);
let candidates = pool;

if(pool.length > 1 && lastKey){
const filtered = pool.filter(p => p.key !== lastKey);
if(filtered.length){
candidates = filtered;
}
}

const choice = pickRandom(candidates);
sessionStorage.setItem(key, choice.key);
return choice;
}

function buildMediaElement(paper, sources){
const wrapper = document.createElement("div");
wrapper.className = "result-media";

const img = document.createElement("img");
img.className = "result-img";
img.alt = paper.title;
img.loading = "lazy";

let idx = 0;
function tryNext(){
if(idx >= sources.length){
wrapper.innerHTML = `<div class="result-icon">📄</div>`;
return;
}
img.src = sources[idx];
idx++;
}

img.addEventListener("error", tryNext);
tryNext();

wrapper.appendChild(img);
return wrapper;
}

/* Builds the actual result card DOM from a fully-resolved payload.
   Shared by a fresh recommendation (showResult) and a restored one
   (restoreResult), so a paper reopened via the browser's back button
   looks exactly like it did when the person left. */

function renderResultCard(paper, payload){
const wrap = document.createElement("div");
wrap.className = "result-card-wrap";

const inner = document.createElement("div");
inner.className = "result-card";

const media = buildMediaElement(paper, payload.mediaSources);

const body = document.createElement("div");
body.className = "result-body";

const catLine = document.createElement("div");
catLine.className = "result-category";
catLine.textContent = payload.catText;

const titleLine = document.createElement("div");
titleLine.className = "result-title";
titleLine.textContent = paper.title;

const descLine = document.createElement("div");
descLine.className = "result-description";
descLine.textContent = paper.description || "";

const whyBox = document.createElement("div");
whyBox.className = "result-why";
whyBox.innerHTML = payload.whyHtml;

const readBtn = document.createElement("button");
readBtn.type = "button";
readBtn.className = "result-read";
readBtn.textContent = "Read Research";
readBtn.addEventListener("click", () => openPaper(paper));

body.appendChild(catLine);
body.appendChild(titleLine);
body.appendChild(descLine);
body.appendChild(whyBox);
body.appendChild(readBtn);

inner.appendChild(media);
inner.appendChild(body);

const actions = document.createElement("div");
actions.className = "result-actions";

const againBtn = document.createElement("button");
againBtn.type = "button";
againBtn.className = "result-secondary";
againBtn.textContent = "Try a different topic";
againBtn.addEventListener("click", () => transitionOut(wrap, startQuiz));

const rerollBtn = document.createElement("button");
rerollBtn.type = "button";
rerollBtn.className = "result-secondary";
rerollBtn.textContent = "Show me another";
rerollBtn.addEventListener("click", () => transitionOut(wrap, showResult));

actions.appendChild(rerollBtn);
actions.appendChild(againBtn);

wrap.appendChild(inner);
wrap.appendChild(actions);

stage.innerHTML = "";
stage.appendChild(wrap);
}

/* ---------------- Remembering where you left off ----------------
   The only place this page links away from itself is the "Read
   Research" button on a result card, so that's the only state worth
   persisting. Right before navigating to the PDF we save exactly what
   was on screen and set a one-time flag; if the person comes straight
   back (browser back button), that flag tells this page to rebuild the
   identical card — same paper, same image, same "why this one" text —
   instead of rolling a brand new one. Any other way of arriving here
   (a fresh visit, clicking Discover from the homepage) starts clean. */

const RESULT_STATE_KEY = "discoverResultState";
const RETURN_FLAG_KEY = "discoverReturnPending";

function saveResultState(paper, payload){
try{
sessionStorage.setItem(RESULT_STATE_KEY, JSON.stringify({
paperKey: paper.key,
catText: payload.catText,
whyHtml: payload.whyHtml,
mediaSources: payload.mediaSources,
introText: payload.introText,
progressDotsTypes: progressDots.map(d => d.type),
primaryCategory,
history
}));
}catch(e){
// Storage can fail in private-browsing modes — the page just falls
// back to starting fresh on return, which is a safe default.
}
}

function loadResultState(){
try{
const raw = sessionStorage.getItem(RESULT_STATE_KEY);
return raw ? JSON.parse(raw) : null;
}catch(e){
return null;
}
}

function replayHistoryIntoPool(){
currentPool = poolAll.filter(p => (p.category || []).includes(primaryCategory));

history.forEach(h => {
if(h.type === "category"){
currentPool = currentPool.filter(p =>
h.answer === "yes"
? (p.category || []).includes(h.value)
: !(p.category || []).includes(h.value)
);
}else if(h.type === "length"){
currentPool = currentPool.filter(p =>
h.answer === "yes"
? (Number(p.pages) || 0) <= h.value
: (Number(p.pages) || 0) > h.value
);
}else if(h.type === "recency"){
const cutoff = new Date(h.value);
currentPool = currentPool.filter(p =>
h.answer === "yes"
? (p.updated && new Date(p.updated) >= cutoff)
: (!p.updated || new Date(p.updated) < cutoff)
);
}
});

usedDims = new Set(
history
.filter(h => h.type !== "category-root")
.map(h => (h.type === "category" ? "cat:" + h.value : h.type))
);

questionCount = 1 + history.filter(h => h.type !== "category-root").length;
}

function restoreResult(saved){
const paper = poolAll.find(p => p.key === saved.paperKey);

if(!paper){
startQuiz();
return;
}

primaryCategory = saved.primaryCategory || null;
history = saved.history || [];
replayHistoryIntoPool();

resetProgress();
(saved.progressDotsTypes || ["question", "end"]).forEach(t => addProgressStep(t));
completeProgress();

setHeader("full", saved.introText);

const sources = saved.mediaSources && saved.mediaSources.length
? saved.mediaSources
: [`covers/${paper.key}.png`];

renderResultCard(paper, {
catText: saved.catText,
whyHtml: saved.whyHtml,
mediaSources: sources
});
}

function showResult(){
// currentPool should never be empty here — every split is constructed
// so both branches keep at least one paper (see bestSecondarySplit /
// lengthSplit / recencySplit above), and the category pool itself is
// never empty since we only ever offer categories that exist in the
// data. These fallbacks are defensive only, and — if ever triggered —
// stay as relevant as possible rather than jumping to a random paper:
// first try anything sharing a category touched during this session,
// then anything in the starting category, and only as an absolute
// last resort, anything in the archive at all.
let pool = sanitizePool(currentPool);

if(!pool.length){
const touchedCategories = new Set(
[primaryCategory, ...history.filter(h => h.type === "category").map(h => h.value)]
);
pool = sanitizePool(poolAll.filter(p => (p.category || []).some(c => touchedCategories.has(c))));
}

if(!pool.length){
pool = sanitizePool(poolAll.filter(p => (p.category || []).includes(primaryCategory)));
}

if(!pool.length){
pool = sanitizePool(poolAll);
}

if(!pool.length){
// Only reachable if literally every remaining candidate were heavy
// content the person never opted into — rather than force one of
// those through, fall back to the full archive as an absolute last
// resort so the experience never dead-ends.
pool = poolAll;
}

const paper = pickPaper(pool);

if(!progressDots.length || progressDots[progressDots.length - 1].type !== "end"){
addProgressStep("end");
}
completeProgress();

const introText = pickRandom(RESULT_INTROS);
setHeader("full", introText);

const catText = (paper.category || []).map(titleCase).join(" • ");

const whyIntro = pickRandom(WHY_INTROS).replace("{cat}", titleCase(primaryCategory));
const clauses = shuffle(buildWhyClauses(paper)).slice(0, 2);
let whyText = whyIntro;
if(clauses.length){
whyText += " — " + clauses.join(", and ");
}
whyText += ".";
const whyHtml = `<b>Why this one:</b> ${whyText}`;

const visible = getVisibleImages(paper.images);
const mediaSources = [];
if(visible.length) mediaSources.push(pickRandom(visible));
mediaSources.push(`covers/${paper.key}.png`);

const payload = { introText, catText, whyHtml, mediaSources };

renderResultCard(paper, payload);
saveResultState(paper, payload);
}

/* ---------------- Opening a paper (respects content warnings) ---------------- */

function openPaper(paper){
if(paper.warning){
pendingPdf = paper.url;
pendingPaperTitle = paper.title;
document.getElementById("discoverWarningOverlay").style.display = "flex";
return;
}
goToPdf(paper.url, paper.title);
}

function goToPdf(url, title){
try{
sessionStorage.setItem(RETURN_FLAG_KEY, "yes");
}catch(e){}

window.location.href =
"pdf.html?file=" + encodeURIComponent(url) +
"&paper=" + encodeURIComponent(title) +
"&return=" + encodeURIComponent(window.location.href);
}

window.closeDiscoverWarning = function(){
document.getElementById("discoverWarningOverlay").style.display = "none";
pendingPdf = null;
pendingPaperTitle = null;
};

window.continueDiscoverWarning = function(){
document.getElementById("discoverWarningOverlay").style.display = "none";
if(pendingPdf){
goToPdf(pendingPdf, pendingPaperTitle);
}
};

/* ---------------- Share ----------------
   Mirrors the homepage's shareSite() exactly: native share sheet
   first, clipboard copy as the fallback, then a prompt as the last
   resort. Just pointed at this page instead. */

window.shareDiscoverPage = function(){

const url =
"https://lanthanoresearch.com/discover.html";

if(navigator.share){

navigator.share({

title:"Lanthano Research",

text:"Explore Discover Your Rabbit Hole",

url:url

});

return;

}

if(navigator.clipboard){

navigator.clipboard
.writeText(url)
.then(()=>{

alert(
"Link copied to clipboard."
);

})
.catch(()=>{

prompt(
"Copy this link:",
url
);

});

}
else{

prompt(
"Copy this link:",
url
);

}

};
