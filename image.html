<script>
/* A picture from a PDF needs the PDF viewer's files: ask for them all at once, right
   away, instead of one after another as each one is found. */
(function(){
  try{
    if(!new URLSearchParams(location.search).get("pdf")) return;
    ["./pdf-compat.js", "./pdf-lib.mjs", "./pdfjs/build/pdf.mjs", "./pdf-worker.mjs", "./pdfjs/build/pdf.worker.mjs"].forEach(function(u){
      var l = document.createElement("link");
      l.rel = "modulepreload";
      l.href = u;
      document.head.appendChild(l);
    });
  }catch(e){}
})();
</script>
<script>
/* Opened for a browser's bare picture (an installed app's "Open in Browser"): none
   of this viewer is shown, only a plain loading line, until the browser is sent to
   the picture itself. */
(function(){
  try{
    if(new URLSearchParams(location.search).get("raw") !== "1") return;
    var st = document.createElement("style");
    st.textContent = "html.lt-raw body{display:none!important}html.lt-raw{background:#111!important}" +
      "html.lt-raw::before{content:'Loading image...';position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#111;color:#bbb;font:16px sans-serif;z-index:2147483647}";
    document.documentElement.appendChild(st);
    document.documentElement.classList.add("lt-raw");
    // Never a loading line that does not end: after a while the viewer shows.
    setTimeout(function(){ document.documentElement.classList.remove("lt-raw"); }, 45000);
  }catch(e){}
})();
</script>

   TOAST

   A brief, non-blocking status message (e.g. "Downloading...")

  position:fixed;

  bottom:calc(var(--titlebar-h) + var(--float-gap));

<script>
/* Wire up Back immediately (before the rest of the page finishes loading),
   so pressing it early still returns to the page you came from. */
(function(){
  var link = document.getElementById("homeButton");
  if(!link) return;

  /* Go back to where we came from. When that page is the one just before
     this one in the browser's history, step back through the history
     instead of opening it again - that restores the page exactly as it was
     and keeps the phone's own back button working normally. Otherwise
     (opened in a new tab, direct link...) open the page. */
  function norm(p){ return p.replace(/index\.html$/, ""); }

  // The same address can be written two ways (a space as %20 or as +), and the
  // PDF viewer's page number moves as it is read. Neither means "a different
  // page", so stepping back (instead of opening the page again as a new step)
  // still works.
  function sameQuery(a, b, path){
    function key(s){
      var p = new URLSearchParams(s), out = [];
      if(/pdf\.html$/i.test(path)) p.delete("page");
      p.forEach(function(v, k){ out.push(k + "=" + v); });
      return out.sort().join("&");
    }
    try{ return key(a) === key(b); }catch(e){ return a === b; }
  }

  function goBackTo(dest, before){
    try{ if(before) before(); }catch(e){}

    var canStep = false;
    try{
      if(history.length > 1 && document.referrer){
        var r = new URL(document.referrer), t = new URL(dest, location.href);
        canStep = r.origin === t.origin &&
          norm(r.pathname) === norm(t.pathname) &&
          sameQuery(r.search, t.search, t.pathname);
      }
    }catch(e){}

    if(!canStep){
      location.assign(dest);
      return;
    }

    var fallback = setTimeout(function(){ location.assign(dest); }, 1200);
    window.addEventListener("pagehide", function(){ clearTimeout(fallback); }, {once:true});
    history.back();
  }

  function sameSite(v){
    try{
      var u = new URL(v, location.href);
      return u.origin === location.origin ? u.href : "";
    }catch(e){ return ""; }
  }

  function resolve(raw){
    if(raw){
      var v = raw;
      for(var i = 0; i < 3; i++){
        if(/^(https?:)?\/\//i.test(v)) break;
        try{
          var d = decodeURIComponent(v);
          if(d === v) break;
          v = d;
        }catch(e){ break; }
      }
      var ok = sameSite(v);
      if(ok) return ok;
    }
    try{
      if(document.referrer){
        var ref = new URL(document.referrer);
        if(ref.origin === location.origin && ref.pathname !== location.pathname){
          return ref.href;
        }
      }
    }catch(e){}
    if(window.__pdfRef) return window.__pdfBackUrl();
    return "index.html";
  }

  /* A picture taken out of a PDF is named by its address: the PDF, the page, the
     picture's place on that page, its pixel size and (once known) a fingerprint.
     With no other idea where you came from, Back goes to that PDF on that page. */
  window.__pdfRef = (function(){
    var q = new URLSearchParams(location.search), f = q.get("pdf");
    if(!f) return null;
    function num(k){ var v = parseInt(q.get(k), 10); return v > 0 ? v : 0; }
    var sz = /^(\d+)x(\d+)$/.exec(q.get("sz") || "");
    return {file: f, paper: q.get("paper") || "", page: num("pg") || 1, index: num("idx") || 1,
            w: sz ? +sz[1] : 0, h: sz ? +sz[2] : 0, hash: q.get("hx") || "", n: num("n")};
  })();
  /* Getting the PDF reader and opening the PDF takes the longest, so it starts
     right now, while the rest of the page is still being set up. Only the parts
     of the PDF that are needed are fetched (not the whole file). */
  if(window.__pdfRef){
    try{
      window.__pdfLib = import("./pdf-lib.mjs").then(function(lib){
        lib.GlobalWorkerOptions.workerSrc = "./pdf-worker.mjs";
        return lib;
      });
      window.__pdfDoc = window.__pdfLib.then(function(lib){
        return lib.getDocument({ url: window.__pdfRef.file, disableAutoFetch: true, rangeChunkSize: 1048576 }).promise;
      });
      window.__pdfLib.catch(function(){});
      window.__pdfDoc.catch(function(){});
    }catch(e){}
  }
  window.__pdfBackUrl = function(){
    var r = window.__pdfRef; if(!r) return "";
    var name = r.paper || r.file.split("/").pop().replace(/\.[^.]*$/, "");
    return "pdf.html?file=" + encodeURIComponent(encodeURIComponent(r.file)) +
      "&paper=" + encodeURIComponent(encodeURIComponent(name)) + "&page=" + r.page;
  };

  var raw = new URLSearchParams(location.search).get("return");
  var storeKey = "viewerReturn:" + location.pathname + location.search;
  var target = resolve(raw);

  /* If nothing says where we came from (e.g. the browser dropped the
     referrer on a refresh), fall back to what was remembered the first
     time this viewer opened - so refreshing a viewer never changes where
     Back goes. */
  try{
    var cameFromSomewhere = !!raw || !!(document.referrer &&
      new URL(document.referrer).origin === location.origin &&
      new URL(document.referrer).pathname !== location.pathname);
    if(cameFromSomewhere){
      sessionStorage.setItem(storeKey, target);
    }else{
      var remembered = sessionStorage.getItem(storeKey);
      if(remembered && sameSite(remembered)) target = remembered;
    }
  }catch(e){}

  window.__returnTarget = target;
  link.href = target;

  window.__goBack = function(){
    goBackTo(target, function(){
      sessionStorage.setItem("restoreSearch", "yes");
    });
  };

  link.addEventListener("click", function(e){
    e.preventDefault();
    window.__goBack();
  });
})();

<script>
/* Runs as soon as the header, toolbar and title bar exist, so the layout is right from the
   first paint (even before this page's main script has loaded): the loading screen stops at
   the real bottom of the toolbar and above the title bar, and the file name shows right away. */
(function(){
  var d = document, h = d.querySelector("header"), tb = d.getElementById("toolbar"),
      ov = d.getElementById("loadingOverlay"), bar = d.getElementById("titleBar"), ti = d.getElementById("title");
  function sync(){
    var b = d.body.classList;
    if(b.contains("reading-mode") || b.contains("video-fullscreen")){ if(ov) ov.style.bottom = ""; return; }
    if(h && tb){
      var t = Math.ceil(h.getBoundingClientRect().height + tb.getBoundingClientRect().height);
      d.documentElement.style.setProperty("--viewer-top", t + "px");
      if(ov) ov.style.top = t + "px";
    }
    if(ov && bar) ov.style.bottom = Math.ceil(bar.getBoundingClientRect().height) + "px";
  }
  sync();
  window.addEventListener("resize", sync);
  if(window.ResizeObserver){ var ro = new ResizeObserver(sync); [h, tb, bar].forEach(function(e){ if(e) ro.observe(e); }); }
  try{
    var p = new URLSearchParams(location.search), name = "";
    name = decodeURIComponent((p.get("image") || "").split("/").pop()).replace(/\.[^/.]+$/, "").replace(/[-_]+/g, " ").replace(/\b\w/g, function(c){ return c.toUpperCase(); });
    if(window.__pdfRef){
      var r0 = window.__pdfRef;
      name = (r0.paper || r0.file.split("/").pop().replace(/\.[^.]*$/, "")) + " image" + (r0.n ? " #" + r0.n : "");
    }
    if(name && ti && /^\s*Loading/.test(ti.textContent)){
      var s = d.createElement("span"); s.className = "title-text"; s.textContent = name;
      ti.textContent = ""; ti.appendChild(s);
    }
  }catch(e){}
})();
</script>

/* ---------- Disable Native/Browser Zoom ----------

    The viewport meta tag and the page-wide
    touch-action:none rule stop most pinch and
    double-tap zooming. Safari still fires its own
    gesture events for pinch zoom, and desktop
    browsers zoom on ctrl+wheel (trackpad pinch),
    so both are explicitly blocked here as well.
    The viewer's own pinch/wheel handlers (below)
    remain the only way to zoom.
*/

["gesturestart", "gesturechange", "gestureend"].forEach(
    function(eventName){

        document.addEventListener(
            eventName,
            function(event){

                event.preventDefault();

            },
            {
                passive:false
            }
        );

    }
);


document.addEventListener(
    "wheel",
    function(event){

        if(event.ctrlKey){

            event.preventDefault();

        }

    },
    {
        passive:false
    }
);


let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function(event){

        const now =
            Date.now();

        if(now - lastTouchEnd <= 300){

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    {
        passive:false
    }
);


/* ---------- URL Parameters ---------- */

const p =
    new URLSearchParams(
        location.search
    );


const img =
    document.getElementById("img");


const viewer =
    document.getElementById("viewer");


const title =
    document.getElementById("title");


const fitButton =
    document.getElementById("fit");


const lockButton =
    document.getElementById("lock");


const minusButton =
    document.getElementById("minus");


const plusButton =
    document.getElementById("plus");


const rotateButton =
    document.getElementById("rotate");


const menu =
    document.getElementById("menu");


const menuButton =
    document.getElementById("menuBtn");

    document.getElementById("zoomPercent");

}


/* =========================================================
   TOAST

   Brief, self-dismissing status messages (e.g. "Downloading...")
   shown near the bottom of the screen - see #toast in the CSS.
   Re-showing the toast while one is already visible just resets
   its dismiss timer rather than stacking messages, since only
   one is ever shown at a time.
   ========================================================= */

let toastHideTimer =
    null;

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    if(toastHideTimer){

        clearTimeout(
            toastHideTimer
        );

    }

    toastHideTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

                toastHideTimer =
                    null;

            },
            1500
        );

}


const src =
    decodeURIComponent(

/* Where "Back" goes: the page this one was opened from. Uses the
   "return" address when one was passed along, otherwise the page the
   visitor came from inside this site (document.referrer), otherwise
   (e.g. someone opened a direct link) the home page. */
function resolveReturnPage(raw){

    const sameSite = (value) => {
        try{
            const u = new URL(value, window.location.href);
            return u.origin === window.location.origin ? u.href : "";
        }catch(e){
            return "";
        }
    };

    if(raw){

        let v = raw;

        // Links can arrive encoded once or twice; peel until it reads
        // like an address (an absolute URL is left exactly as it is).
        for(let i = 0; i < 3; i++){
            if(/^(https?:)?\/\//i.test(v)) break;
            try{
                const d = decodeURIComponent(v);
                if(d === v) break;
                v = d;
            }catch(e){
                break;
            }
        }

        const ok = sameSite(v);
        if(ok) return ok;
    }

    try{
        if(document.referrer){
            const ref = new URL(document.referrer);
            if(
                ref.origin === window.location.origin &&
                ref.pathname !== window.location.pathname
            ){
                return ref.href;
            }
        }
    }catch(e){}

    return "index.html";

}

const returnPage =
    window.__returnTarget || resolveReturnPage(p.get("return"));


/* ---------- Chrome Height Sync ---------- */

function syncViewerTop(){

    if(
        document.body.classList.contains(
            "reading-mode"
        )
    ){

        return;

    }

    const headerHeight =
        header.getBoundingClientRect()
            .height;

    const toolbarHeight =
        toolbar.getBoundingClientRect()
            .height;

    const total =
        Math.ceil(
            headerHeight +
            toolbarHeight
        );

    document.documentElement.style.setProperty(
        "--viewer-top",
        `${total}px`
    );

    layout.style.top =
        `${total}px`;

    loadingOverlay.style.top =
        `${total}px`;

}


/* ---------- Back Button ---------- */

const homeButton =
    document.getElementById("homeButton");


homeButton.href =
    returnPage;


/* (The Back button's click is wired up early - see the small script in
   the header - so it also works before this file has finished loading.) */


/* ---------- Find PDF ---------- */

const pdfButtonEl =
    document.getElementById("pdfButton");


/*
    The button's own label doubles as an on-screen status
    indicator, since checking the console isn't practical
    on mobile. It should read one of:

      "Looking for PDF…"  - still checking descriptions.json
      "No Parent PDF"     - checked, nothing referenced this image
      "PDF Unavailable"   - descriptions.json couldn't be loaded
      "Open Parent PDF"   - match found, button is live
*/

pdfButtonEl.textContent =
    "Looking for PDF…";


/*
    While disabled, clicking the button must not navigate
    anywhere (it has no href yet, or an href left over
    from a previous state). pointer-events:none on the
    .disabled class already blocks mouse clicks, but this
    guard also blocks keyboard-triggered activation
    (Enter/Space on a focused link). Once it's live, a
    click navigates away to pdf.html, so tuck the menu
    away first the same way the other menu actions do.
*/

pdfButtonEl.addEventListener(
    "click",
    event => {

        if(
            pdfButtonEl.classList.contains("disabled")
        ){

            event.preventDefault();

            return;

        }

        menu.style.display =
            "none";

    }
);


fetch("descriptions.json")
.then(response => {

    if(!response.ok){

        throw new Error(
            `descriptions.json responded with ${response.status}`
        );

    }

    return response.json();

})
.then(data => {

    let paper = null;

    if(window.__pdfRef){

        /* A picture from a PDF: the parent is that PDF. */

        const found =
            Object.values(data).find(
                item => item && item.url === window.__pdfRef.file
            );

        if(found){

            window.__pdfRef.paper =
                found.title || window.__pdfRef.paper;

            if(window.__pdfImageRefreshTitle){
                window.__pdfImageRefreshTitle();
            }

        }

        return;

    }

    /*
        Match by filename only, not the full path/string.

        The "image" URL param may include a folder prefix
        (e.g. "papername/Some Image.png") while
        descriptions.json's "images" arrays list bare
        filenames only ("Some Image.png"). An exact-string
        match would silently fail in that case and never
        show the PDF button, with no visible error.
    */

    const srcName =
        src
            .split("/")
            .pop();


    Object.values(data).forEach(p => {

        if(!p.images)
            return;


        const match =
            p.images.some(
                image =>
                    image.split("/").pop() === srcName
            );


        if(match){

            paper = p;

        }

    });


    if(!paper){

        console.warn(
            "PDF button: no descriptions.json entry references image",
            src
        );

        pdfButtonEl.textContent =
            "No Parent PDF";

        pdfButtonEl.title =
            `No matching PDF found for "${srcName}"`;

        return;

    }


    /*
        Build the link to pdf.html.

        file/paper/return are each wrapped in
        encodeURIComponent twice, since pdf.html
        reads them with a URLSearchParams .get()
        (one automatic decode) followed by an
        explicit decodeURIComponent() call (a
        second decode) - matching the same
        double-encode/double-decode convention
        used for the "image"/"return" params on
        this page.

        The "return" value is this page's own
        current URL (image + return params and
        all), so that pressing Back inside
        pdf.html lands right back on this exact
        image.
    */

    const pdfUrl =
        "pdf.html?file=" +
        encodeURIComponent(
            encodeURIComponent(paper.url)
        ) +
        "&paper=" +
        encodeURIComponent(
            encodeURIComponent(paper.title)
        ) +
        "&return=" +
        encodeURIComponent(
            encodeURIComponent(location.href)
        );

    pdfButtonEl.href =
        pdfUrl;

    pdfButtonEl.classList.remove(
        "disabled"
    );

    pdfButtonEl.removeAttribute(
        "aria-disabled"
    );

    pdfButtonEl.textContent =
        "Open Parent PDF";

    pdfButtonEl.title =
        `Open ${paper.title} PDF`;

})
.catch(error => {

    console.warn(
        "PDF button: could not load descriptions.json",
        error
    );

    pdfButtonEl.textContent =
        "PDF Unavailable";

    pdfButtonEl.title =
        "Could not check for a matching PDF: " +
        (error?.message || "unknown error");

});


/* ---------- Image ---------- */

img.onload =
    () => {

        loadingOverlay.style.display =
            "none";

        fit();

    };


const loadingText =
    loadingOverlay.querySelector(".loadingText");


/* Same behavior as the video viewer: with no image specified, or one that
   can't be loaded, the loading screen stays up with a message. */
img.onerror =
    () => {

        if(loadingText){
            loadingText.textContent =
                "Unable to load image.";
        }

        loadingOverlay.style.display =
            "flex";

    };


const pdfRef =
    window.__pdfRef;


if(pdfRef){

    /* A picture taken out of a PDF: it is drawn from the PDF itself (see
       "PICTURE FROM A PDF" at the bottom of this script). */

    if(loadingText){
        loadingText.textContent =
            "Loading image...";
    }

}else if(!src){

    if(loadingText){
        loadingText.textContent =
            "No image specified.";
    }

    loadingOverlay.style.display =
        "flex";

}else{

    img.src =
        src;

}


const filename =
    src
        .split("/")
        .pop();


const displayName =
    filename
        .replace(/\.[^/.]+$/, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, function(char){

            return char.toUpperCase();

        });


if(!pdfRef){

    title.textContent =
        displayName;


    document.title =
        displayName;

}else{

    const early =
        (pdfRef.paper || pdfRef.file.split("/").pop().replace(/\.[^.]*$/, "")) +
        " image" +
        (pdfRef.n ? " #" + pdfRef.n : "");

    title.textContent =
        early;

    document.title =
        early;

}


/* =========================================================
   IMAGE MOVEMENT / ZOOM
   ========================================================= */


let base = 1;

let zoom = 1;

let offsetX = 0;

let offsetY = 0;


let rotation = 0;


/*
    Movement modes:

    free       = left/right + up/down
    vertical   = up/down only
    horizontal = left/right only
*/

let movementMode = "free";


const pointers =
    new Map();


let pinchDistance = 0;

let pinchZoom = 1;


/* ---------- Zoom Limits ---------- */

function clampZoom(){

    if(zoom < 0.05){

        zoom = 0.05;

    }


    if(zoom > 50){

        zoom = 50;

    }

}


/* ---------- Keep The Image Reachable ----------
   The image can be moved freely, right up until it is just off the edge
   of the screen, and no further. It can never be pushed away into
   nowhere, so it is always right there next to the screen. The limit is
   worked out from the image's own size at the current zoom, so it holds
   for any size or shape of image: tiny, huge, very wide or very tall.
   It applies to every way of moving or zooming: dragging, pinching, the
   wheel, the buttons and the % box. */

function clampOffset(){

    if(!img.naturalWidth || !img.naturalHeight)
        return;


    const scale =
        base * zoom;

    const w =
        img.naturalWidth * scale;

    const h =
        img.naturalHeight * scale;

    const angle =
        rotation * Math.PI / 180;

    const cos =
        Math.abs(Math.cos(angle));

    const sin =
        Math.abs(Math.sin(angle));

    // half of the space the (possibly rotated) image covers
    const halfW =
        (w * cos + h * sin) / 2;

    const halfH =
        (w * sin + h * cos) / 2;


    // image centre may travel until the image just clears the screen
    const maxX =
        viewer.clientWidth / 2 + halfW;

    const maxY =
        viewer.clientHeight / 2 + halfH;


    if(!isFinite(offsetX)) offsetX = 0;

    if(!isFinite(offsetY)) offsetY = 0;


    offsetX =
        Math.max(-maxX, Math.min(maxX, offsetX));

    offsetY =
        Math.max(-maxY, Math.min(maxY, offsetY));

}


/* ---------- Draw ---------- */

function draw(){

    clampZoom();

    clampOffset();


    img.style.transform =

        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        rotate(${rotation}deg)
        scale(${base * zoom})`;


    zoomPercent.value =
        Math.round(zoom * 100) + "%";

}


/* ---------- Fit / Reset ---------- */

function fit(){

    if(!img.naturalWidth)
        return;


    /*
        A 90/270 degree rotation swaps which of the
        image's natural dimensions maps to the
        viewer's width vs height, so fitting has to
        swap them too or the image would be sized as
        if it were never rotated.
    */
    const rotated =
        rotation % 180 !== 0;

    const naturalW =
        rotated ? img.naturalHeight : img.naturalWidth;

    const naturalH =
        rotated ? img.naturalWidth : img.naturalHeight;


    base = Math.min(

        viewer.clientWidth /
        naturalW,

        viewer.clientHeight /
        naturalH

    );


    zoom = 1;


    offsetX = 0;

    offsetY = 0;


    img.style.transition =
        "transform .22s";


    draw();


    setTimeout(
        () => {

            img.style.transition = "";

        },
        220
    );

}


window.addEventListener(
    "resize",
    () => {

        syncViewerTop();

        /*
            Only resize/reset when the viewer itself
            is actually resized.

            Reading Mode toggling does NOT call fit().
        */

        if(!document.body.classList.contains("reading-mode")){

            fit();

        }

    }
);


/* ---------- Zoom Buttons ---------- */

minusButton.onclick =
    () => {

        zoom /= 1.1;

        draw();

    };


plusButton.onclick =
    () => {

        zoom *= 1.1;

        draw();

    };


fitButton.onclick =
    fit;


/* ---------- Rotate ---------- */

rotateButton.onclick =
    () => {

        rotation =
            (rotation + 90) % 360;

        fit();

    };


/* ---------- Manual Zoom ---------- */

zoomPercent.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Enter"
        ){

            return;

        }

        let value =
            parseFloat(
                zoomPercent.value.replace(
                    "%",
                    ""
                )
            );

        if(
            Number.isNaN(value)
        ){

            value =
                100;

        }

        value =
            Math.max(
                5,

                Math.min(
                    5000,
                    value
                )
            );

        zoom =
            value / 100;

        draw();

    }
);


/* =========================================================
   MOVEMENT MODE
========================================================= */

const LOCK_ICON_FREE = "<svg class=\"lock-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:14px;height:14px;margin-right:5px;flex-shrink:0\"><path d=\"M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3\"/></svg>";
const LOCK_ICON_VERTICAL = "<svg class=\"lock-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:14px;height:14px;margin-right:5px;flex-shrink:0\"><path d=\"M12 3v18M12 3l-4 4M12 3l4 4M12 21l-4-4M12 21l4-4\"/></svg>";
const LOCK_ICON_HORIZONTAL = "<svg class=\"lock-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:14px;height:14px;margin-right:5px;flex-shrink:0\"><path d=\"M3 12h18M3 12l4-4M3 12l4 4M21 12l-4-4M21 12l-4 4\"/></svg>";

lockButton.onclick = () => {

    if(movementMode === "free"){

        movementMode = "vertical";

        lockButton.innerHTML =
            LOCK_ICON_VERTICAL + "Vertical";

    }else if(movementMode === "vertical"){

        movementMode = "horizontal";

        lockButton.innerHTML =
            LOCK_ICON_HORIZONTAL + "Horizontal";

    }else{

        movementMode = "free";

        lockButton.innerHTML =
            LOCK_ICON_FREE + "Free";

    }

};


/* =========================================================
   POINTER EVENTS
========================================================= */


/* ---------- Pointer Down ---------- */

viewer.onpointerdown =
    e => {

        viewer.setPointerCapture(
            e.pointerId
        );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        if(pointers.size === 2){

            const pts =
                [...pointers.values()];


            pinchDistance =
                Math.hypot(

                    pts[0].x -
                    pts[1].x,

                    pts[0].y -
                    pts[1].y

                );


            pinchZoom =
                zoom;

        }

    };


/* ---------- Pointer Move ---------- */

viewer.onpointermove =
    e => {

        if(!pointers.has(e.pointerId))
            return;


        const previous =
            pointers.get(
                e.pointerId
            );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        /* ---------- One Finger ---------- */

        if(pointers.size === 1){

            const dx =
                e.clientX -
                previous.x;


            const dy =
                e.clientY -
                previous.y;


            /*
                Free:
                move both directions.

                Vertical:
                only up/down.

                Horizontal:
                only left/right.
            */

            if(movementMode === "free"){

                offsetX += dx;

                offsetY += dy;

            }else if(movementMode === "vertical"){

                offsetY += dy;

            }else if(movementMode === "horizontal"){

                offsetX += dx;

            }


            draw();


            return;

        }


        /* ---------- Two Finger Pinch ---------- */

        const pts =
            [...pointers.values()];


        const distance =
            Math.hypot(

                pts[0].x -
                pts[1].x,

                pts[0].y -
                pts[1].y

            );


        const oldScale =
            base * zoom;


        zoom =
            pinchZoom *
            (
                distance /
                pinchDistance
            );


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX *= ratio;

        offsetY *= ratio;


        pinchDistance =
            distance;


        pinchZoom =
            zoom;


        draw();

    };


/* ---------- Pointer Up ---------- */

viewer.onpointerup =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(pointers.size < 2){

            pinchDistance = 0;

        }

    };


/* ---------- Pointer Cancel ---------- */

viewer.onpointercancel =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(pointers.size < 2){

            pinchDistance = 0;

        }

    };


/* ---------- Double Tap / Double Click ----------
   Double tap zooms in on the spot that was tapped. Double tap again
   zooms back out so the whole image fits. Works with a finger, a pen
   and a mouse. A drag, a pinch, or a slow second tap does not count. */

const DOUBLE_TAP_ZOOM = 2.5;

let tapStart = null;

let lastTap = null;


viewer.addEventListener(
    "pointerdown",
    e => {

        if(pointers.size > 1){

            tapStart = null;

            lastTap = null;

            return;

        }

        tapStart = {
            x:e.clientX,
            y:e.clientY,
            time:Date.now()
        };

    }
);


viewer.addEventListener(
    "pointerup",
    e => {

        if(!tapStart || !img.naturalWidth)
            return;


        const moved =
            Math.hypot(
                e.clientX - tapStart.x,
                e.clientY - tapStart.y
            );

        const held =
            Date.now() - tapStart.time;

        tapStart = null;


        if(moved > 12 || held > 350){

            lastTap = null;

            return;

        }


        const now =
            Date.now();

        const isDouble =
            lastTap &&
            now - lastTap.time < 400 &&
            Math.hypot(
                e.clientX - lastTap.x,
                e.clientY - lastTap.y
            ) < 40;


        if(!isDouble){

            lastTap = {
                x:e.clientX,
                y:e.clientY,
                time:now
            };

            return;

        }


        lastTap = null;


        if(zoom > 1.05){

            fit();

            return;

        }


        const rect =
            viewer.getBoundingClientRect();

        const px =
            e.clientX -
            rect.left -
            rect.width / 2;

        const py =
            e.clientY -
            rect.top -
            rect.height / 2;

        const ratio =
            DOUBLE_TAP_ZOOM / zoom;

        offsetX =
            px - (px - offsetX) * ratio;

        offsetY =
            py - (py - offsetY) * ratio;

        zoom =
            DOUBLE_TAP_ZOOM;


        img.style.transition =
            "transform .22s";

        draw();

        setTimeout(
            () => {

                img.style.transition = "";

            },
            220
        );

    }
);


viewer.addEventListener(
    "pointercancel",
    () => {

        tapStart = null;

        lastTap = null;

    }
);


/* ---------- Initial Draw ---------- */

draw();


/* =========================================================
   READING MODE
========================================================= */

let readingMode =
    false;


function setReadingMode(
    enabled
){

    readingMode =
        Boolean(
            enabled
        );

    if(
        readingMode
    ){

        document.body.classList.add(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "×";

        readingModeFloat.title =
            "Exit Reading Mode";

        menu.style.display =
            "none";

        layout.style.top =
            "0px";

        loadingOverlay.style.top =
            "0px";

    }else{

        document.body.classList.remove(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "▣";

        readingModeFloat.title =
            "Reading Mode";

        syncViewerTop();

    }

    /*
        IMPORTANT:

        Do NOT call fit() here.

        fit() resets:

            zoom = 1
            offsetX = 0
            offsetY = 0

        Reading Mode should only change the
        interface around the image.

        The current zoom and image position
        are therefore preserved.
    */

    draw();


}


readingModeFloat.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        setReadingMode(
            !readingMode
        );

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

viewer.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;


        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;


        const oldScale =
            base * zoom;


        if(e.deltaY < 0){

            zoom *= 1.12;

        }else{

            zoom /= 1.12;

        }


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX =

            mouseX -
            (
                mouseX -
                offsetX
            ) * ratio;


        offsetY =

            mouseY -
            (
                mouseY -
                offsetY
            ) * ratio;


        draw();

    },
    {
        passive:false
    }
);

/* =========================================================
   NEW TAB
========================================================= */

document
    .getElementById("newTabBtn")
    .onclick = () => {

        menu.style.display =
            "none";


        if(pdfRef){

            if(!window.__pdfImageUrl){

                showToast(
                    "Still opening this image..."
                );

                return;

            }

            // The website's own link to this picture (what Share sends).
            const webLink = new URL(location.href);
            webLink.searchParams.delete("return");
            webLink.hash = "";

            // The page opened in the browser finds the picture by its page and place
            // (the PDF there is the very same one), so the fingerprint isn't needed.
            webLink.searchParams.delete("hx");
            webLink.searchParams.delete("n");
            webLink.searchParams.set("raw", "1");   // the browser gets the bare picture

            // On the website this is a normal new tab. In an installed app the
            // picture (which exists only in here) is handed to the computer's own
            // viewer, or its website page to the phone's browser.
            const asPng = window.__pdfImageBlob && window.__pdfImageBlob.type === "image/png";

            if(!(window.LT && LT.openTab && LT.openTab({
                url: window.__pdfImageUrl,
                fileUrl: window.__pdfImageUrl,
                blob: true,
                filename: ((document.getElementById("title") || {}).textContent || "image").trim() + (asPng ? ".png" : ".jpg"),
                webUrl: webLink.href
            }))){
                window.open(
                    window.__pdfImageUrl,
                    "_blank"
                );
            }

            return;

        }


        // Inside an installed app the picture opens in the default browser.
        if(!(window.LT && LT.openTab && LT.openTab({
            url: new URL(src, location.href).href,
            webUrl: src,
            filename: decodeURIComponent(String(src).split("?")[0].split("/").pop() || "image")
        }))){
            window.open(
                src,
                "_blank"
            );
        }

    };

   DOWNLOAD
========================================================= */

document
    .getElementById("downloadBtn")
    .onclick = () => {

        if(pdfRef && !window.__pdfImageUrl){

            menu.style.display =
                "none";

            showToast(
                "Still opening this image..."
            );

            return;

        }


        if(pdfRef && window.__pdfImageBlob && window.__pdfImageBlob.type !== "image/png"){

            menu.style.display =
                "none";

            showToast(
                "Preparing the download..."
            );

            const pic = new Image();

            pic.onload = () => {
                const c = document.createElement("canvas");
                c.width = pic.naturalWidth;
                c.height = pic.naturalHeight;
                c.getContext("2d").drawImage(pic, 0, 0);
                c.toBlob(png => {
                    if(!png){ showToast("Couldn't prepare the download."); return; }
                    const url = URL.createObjectURL(png);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = (title.textContent || "image").replace(/[\\/:*?"<>|]+/g, " ").trim() + ".png";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 60000);
                }, "image/png");
            };

            pic.onerror = () => showToast("Couldn't prepare the download.");

            pic.src = window.__pdfImageUrl;

            return;

        }


        showToast(
            "Downloading..."
        );


        const a =
            document.createElement("a");


        a.href =
            pdfRef ? window.__pdfImageUrl : src;


        a.download =
            pdfRef
                ? (title.textContent || "image").replace(/[\\/:*?"<>|]+/g, " ").trim() + ".png"
                : src.split("/").pop();


        document.body.appendChild(a);


        a.click();


        a.remove();


        menu.style.display =
            "none";

    };

document
    .getElementById("shareBtn")
    .addEventListener(
        "click",
        async () => {

            let shareFrom =
                window.location.href;

            if(pdfRef){

                /* The link to a PDF picture should open the picture, not
                   send the visitor back to whatever page you were on. */

                const clean =
                    new URL(window.location.href);

                clean.searchParams.delete("return");

                clean.hash = "";

                shareFrom =
                    clean.href;

            }

            const url =
                (window.LT && LT.siteUrl) ? LT.siteUrl(shareFrom) : shareFrom;


            menu.style.display =
                "none";


            /* Native share */

            if(navigator.share){

                try{

                    await navigator.share({

                        title:
                            title.textContent,

                        text:
                            title.textContent,

                        url:
                            url

                    });


                    return;

                }catch(err){

                    if(
                        err &&
                        err.name ===
                        "AbortError"
                    ){

                        return;

                    }

                }

            }


            /* Clipboard fallback */

            if(
                navigator.clipboard &&
                typeof navigator.clipboard.writeText ===
                "function"
            ){

                try{

                    await navigator.clipboard.writeText(
                        url
                    );


                    alert(
                        "Link copied to clipboard!"
                    );


                    return;

                }catch(err){

                    /* Continue to final fallback */

                }

            }


            /* Manual fallback */

            window.prompt(
                "Copy this link:",
                url
            );

        }
    );

/* =========================================================
   PICTURE FROM A PDF

   Opened from the PDF viewer's "View Image", or from a copied link.
   The address names the PDF, the page, the picture's place on that
   page (1 = the first picture), its pixel size and, once known, a
   fingerprint of the picture itself. The picture is then drawn
   straight from the PDF at full detail.

   If the PDF has been edited since a link was made (pages added or
   removed, pictures moved) the fingerprint is used to find the very
   same picture wherever it is now. If it is gone, the picture at the
   same place is shown instead, with a note. "image #N" is the
   picture's number counting every picture in the PDF in reading
   order, worked out from the PDF as it is now.
   ========================================================= */

if(pdfRef){

    (async () => {

        const fail = (message) => {

            // Opened for the browser's bare picture and it could not be made: show the
            // viewer, with the reason, instead of a loading line that never ends.
            document.documentElement.classList.remove("lt-raw");

            if(loadingText){
                loadingText.textContent = message;
            }

            const spinner = loadingOverlay.querySelector(".spinner");

            if(spinner){
                spinner.style.display = "none";
            }

            loadingOverlay.style.display = "flex";

        };

        const prettyFile =
            pdfRef.file.split("/").pop().replace(/\.[^.]*$/, "");

        window.__pdfImageRefreshTitle = () => {

            const name =
                (pdfRef.paper || prettyFile) +
                " image" +
                (pdfRef.n ? " #" + pdfRef.n : "");

            title.textContent = name;

            document.title = name;

            window.__pdfImageTitle = name;

        };

        window.__pdfImageRefreshTitle();


        /* "Open Parent PDF" goes to the PDF at this picture's page. */

        const updatePdfButton = () => {

            pdfButtonEl.href =
                "pdf.html?file=" +
                encodeURIComponent(encodeURIComponent(pdfRef.file)) +
                "&paper=" +
                encodeURIComponent(encodeURIComponent(pdfRef.paper || prettyFile)) +
                "&page=" + pdfRef.page +
                "&return=" +
                encodeURIComponent(encodeURIComponent(location.href));

            pdfButtonEl.classList.remove("disabled");

            pdfButtonEl.removeAttribute("aria-disabled");

            pdfButtonEl.textContent = "Open Parent PDF";

            pdfButtonEl.title =
                "Open " + (pdfRef.paper || prettyFile) + " PDF";

        };

        updatePdfButton();


        /* Keep the address true to what is on screen, so a copied or
           shared link always finds this picture. */

        const syncAddress = () => {

            try{

                const u = new URL(location.href);

                u.searchParams.set("pg", String(pdfRef.page));
                u.searchParams.set("idx", String(pdfRef.index));

                if(pdfRef.w && pdfRef.h){
                    u.searchParams.set("sz", pdfRef.w + "x" + pdfRef.h);
                }

                if(pdfRef.hash){
                    u.searchParams.set("hx", pdfRef.hash);
                }

                if(pdfRef.n){
                    u.searchParams.set("n", String(pdfRef.n));
                }

                history.replaceState(history.state, "", u.pathname + u.search + u.hash);

            }catch(error){}

            updatePdfButton();

        };


        let pdfjs;

        try{

            pdfjs = await (window.__pdfLib || import("./pdf-lib.mjs"));

            pdfjs.GlobalWorkerOptions.workerSrc = "./pdf-worker.mjs";

        }catch(error){

            console.warn("PDF image: could not load the PDF reader", error);

            fail("This device can't open pictures from a PDF.");

            return;

        }

        const OPS = pdfjs.OPS;


/* LT-PICS-BEGIN  (one shared copy: kept identical in pdf.html and image.html)

   Pictures inside a PDF page.

   find()    walks the page's drawing list the way the page is drawn (saves,
             moves, pictures-inside-forms, clipping) and returns every picture
             that is really visible, as it is cut off by the page and by any
             frame it sits in. Pictures that were cut into strips or tiles by
             the program that made the PDF are joined back into one.
   extract() makes the picture itself: the PDF's own pixels, one for one, turned
             the way the page shows them. No page drawing, no resizing, no white
             edges. (A picture that is tilted at an odd angle is drawn from the
             page instead, at its own detail.) */
const LTPics = (function(){

    const mul = (a, b) => [
        a[0]*b[0] + a[1]*b[2],
        a[0]*b[1] + a[1]*b[3],
        a[2]*b[0] + a[3]*b[2],
        a[2]*b[1] + a[3]*b[3],
        a[4]*b[0] + a[5]*b[2] + b[4],
        a[4]*b[1] + a[5]*b[3] + b[5]
    ];

    const arr6 = (m) => [Number(m[0]), Number(m[1]), Number(m[2]), Number(m[3]), Number(m[4]), Number(m[5])];

    const apply = (m, x, y) => [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];

    function boxOf(m, r){
        const p = [apply(m, r[0], r[1]), apply(m, r[2], r[1]), apply(m, r[0], r[3]), apply(m, r[2], r[3])];
        const xs = p.map(v => v[0]);
        const ys = p.map(v => v[1]);
        return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
    }

    function cut(a, b){
        if(!a) return b ? b.slice() : null;
        if(!b) return a.slice();
        const r = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])];
        return (r[2] > r[0] && r[3] > r[1]) ? r : [0, 0, 0, 0];
    }

    function invert(m){
        const d = m[0]*m[3] - m[1]*m[2];
        if(!d) return null;
        return [
            m[3]/d, -m[1]/d, -m[2]/d, m[0]/d,
            (m[2]*m[5] - m[3]*m[4])/d, (m[1]*m[4] - m[0]*m[5])/d
        ];
    }

    /* ---------- finding the pictures ---------- */

    function find(opList, OPS, view){

        const fns = opList?.fnArray || [];
        const args = opList?.argsArray || [];

        let matrix = [1, 0, 0, 1, 0, 0];
        let clip = (view && view.length === 4) ? [Number(view[0]), Number(view[1]), Number(view[2]), Number(view[3])] : null;
        const stack = [];
        let pendingClip = false;

        const raw = [];

        const add = (m, objId, inline, w, h) => {
            const full = boxOf(m, [0, 0, 1, 1]);
            const vis = cut(full, clip);
            if(!vis || vis[2] - vis[0] < 1 || vis[3] - vis[1] < 1) return;
            raw.push({ m, full, vis, objId, inline, w, h });
        };

        for(let i = 0; i < fns.length; i++){

            const fn = fns[i];
            const a = args[i];

            if(fn === OPS.save){ stack.push([matrix, clip]); continue; }

            if(fn === OPS.restore){
                const s = stack.pop();
                if(s){ matrix = s[0]; clip = s[1]; }
                continue;
            }

            if(fn === OPS.transform){ matrix = mul(arr6(a), matrix); continue; }

            if(fn === OPS.paintFormXObjectBegin){
                stack.push([matrix, clip]);
                if(a && a[0]) matrix = mul(arr6(a[0]), matrix);
                if(a && a[1]) clip = cut(clip, boxOf(matrix, [Number(a[1][0]), Number(a[1][1]), Number(a[1][2]), Number(a[1][3])]));
                continue;
            }

            if(fn === OPS.paintFormXObjectEnd){
                const s = stack.pop();
                if(s){ matrix = s[0]; clip = s[1]; }
                continue;
            }

            if(fn === OPS.beginGroup){
                stack.push([matrix, clip]);
                const g = a && a[0];
                if(g && g.bbox){
                    const gm = g.matrix ? mul(arr6(g.matrix), matrix) : matrix;
                    clip = cut(clip, boxOf(gm, [Number(g.bbox[0]), Number(g.bbox[1]), Number(g.bbox[2]), Number(g.bbox[3])]));
                }
                continue;
            }

            if(fn === OPS.endGroup){
                const s = stack.pop();
                if(s){ matrix = s[0]; clip = s[1]; }
                continue;
            }

            if(fn === OPS.clip || fn === OPS.eoClip){ pendingClip = true; continue; }

            if(fn === OPS.constructPath){
                if(pendingClip){
                    pendingClip = false;
                    const mm = a && a[2];
                    if(mm && mm[0] !== undefined){
                        clip = cut(clip, boxOf(matrix, [Number(mm[0]), Number(mm[1]), Number(mm[2]), Number(mm[3])]));
                    }
                }
                continue;
            }

            if(fn === OPS.paintImageXObject){
                add(matrix, a && a[0], null, Number(a && a[1]) || 0, Number(a && a[2]) || 0);
                continue;
            }

            if(fn === OPS.paintInlineImageXObject){
                const d = a && a[0];
                add(matrix, "", d, Number(d && d.width) || 0, Number(d && d.height) || 0);
                continue;
            }

            if(fn === OPS.paintImageXObjectRepeat){
                const sx = Number(a[1]), sy = Number(a[2]), pos = a[3] || [];
                for(let k = 0; k + 1 < pos.length; k += 2){
                    add(mul([sx, 0, 0, sy, Number(pos[k]), Number(pos[k + 1])], matrix), a[0], null, 0, 0);
                }
                continue;
            }
        }

        /* Pictures the maker cut into strips or tiles are one picture again. */
        let groups = raw.map(p => ({ parts: [p], vis: p.vis.slice() }));

        const kind = (p) => {
            const m = p.m;
            const s = Math.abs(m[0]) + Math.abs(m[1]) + Math.abs(m[2]) + Math.abs(m[3]);
            if(Math.abs(m[1]) + Math.abs(m[2]) < 1e-4 * s) return "s" + (m[0] > 0 ? "+" : "-") + (m[3] > 0 ? "+" : "-");
            if(Math.abs(m[0]) + Math.abs(m[3]) < 1e-4 * s) return "r" + (m[1] > 0 ? "+" : "-") + (m[2] > 0 ? "+" : "-");
            return "";
        };

        const density = (p) => {
            const w = p.w || 1, h = p.h || 1;
            return [Math.hypot(p.m[0], p.m[1]) / w, Math.hypot(p.m[2], p.m[3]) / h];
        };

        const joins = (A, B) => {
            const p = A.parts[0], q = B.parts[0];
            if(!p.w || !q.w) return false;
            const k = kind(p);
            if(!k || k !== kind(q)) return false;
            const dp = density(p), dq = density(q);
            if(Math.abs(dp[0] - dq[0]) > 0.02 * dp[0] || Math.abs(dp[1] - dq[1]) > 0.02 * dp[1]) return false;
            const a = A.vis, b = B.vis, t = 1.0;
            const sameY = Math.abs(a[1] - b[1]) <= t && Math.abs(a[3] - b[3]) <= t;
            const sameX = Math.abs(a[0] - b[0]) <= t && Math.abs(a[2] - b[2]) <= t;
            if(sameY && (Math.abs(a[2] - b[0]) <= t || Math.abs(b[2] - a[0]) <= t)) return true;
            if(sameX && (Math.abs(a[3] - b[1]) <= t || Math.abs(b[3] - a[1]) <= t)) return true;
            return false;
        };

        if(groups.length > 1 && groups.length <= 300){

            let again = true;

            while(again){

                again = false;

                outer:
                for(let i = 0; i < groups.length; i++){
                    for(let j = i + 1; j < groups.length; j++){
                        if(joins(groups[i], groups[j])){
                            const A = groups[i], B = groups[j];
                            A.parts = A.parts.concat(B.parts);
                            A.vis = [Math.min(A.vis[0], B.vis[0]), Math.min(A.vis[1], B.vis[1]), Math.max(A.vis[2], B.vis[2]), Math.max(A.vis[3], B.vis[3])];
                            groups.splice(j, 1);
                            again = true;
                            break outer;
                        }
                    }
                }
            }
        }

        const out = [];

        for(const g of groups){

            if(g.vis[2] - g.vis[0] < 20 || g.vis[3] - g.vis[1] < 20) continue;

            const first = g.parts[0];

            let w = first.w, h = first.h;

            if(g.parts.length > 1){
                const d = density(first);
                w = Math.round((g.vis[2] - g.vis[0]) / (d[0] || 1));
                h = Math.round((g.vis[3] - g.vis[1]) / (d[1] || 1));
            }

            out.push({
                rect: g.vis,
                parts: g.parts,
                objId: first.objId,
                inline: first.inline,
                w, h
            });
        }

        return out;
    }

    /* ---------- the picture's own pixels ---------- */

    function getObject(page, id){

        return new Promise(resolve => {

            let done = false;

            const timer = setTimeout(() => { if(!done){ done = true; resolve(null); } }, 8000);

            try{

                const store = /^g_/.test(id) ? page.commonObjs : page.objs;

                store.get(id, value => {
                    if(!done){ done = true; clearTimeout(timer); resolve(value || null); }
                });

            }catch(error){
                clearTimeout(timer);
                resolve(null);
            }
        });
    }

    function drawable(d){

        if(!d) return null;

        if(d.bitmap){
            const b = d.bitmap;
            const w = Number(b.width || b.displayWidth || b.codedWidth || d.width) || 0;
            const h = Number(b.height || b.displayHeight || b.codedHeight || d.height) || 0;
            return w && h ? { src: b, w, h } : null;
        }

        if(d.data && d.width && d.height){

            const w = d.width, h = d.height;
            const px = new Uint8ClampedArray(w * h * 4);
            const s = d.data;

            if(d.kind === 3 || s.length >= w * h * 4){
                px.set(s.subarray ? s.subarray(0, w * h * 4) : s.slice(0, w * h * 4));
            }else if(d.kind === 1){
                const row = (w + 7) >> 3;
                for(let y = 0, o = 0; y < h; y++){
                    for(let x = 0; x < w; x++, o += 4){
                        const v = (s[y * row + (x >> 3)] >> (7 - (x & 7))) & 1 ? 255 : 0;
                        px[o] = px[o + 1] = px[o + 2] = v;
                        px[o + 3] = 255;
                    }
                }
            }else{
                for(let i = 0, o = 0; o < px.length; i += 3, o += 4){
                    px[o] = s[i]; px[o + 1] = s[i + 1]; px[o + 2] = s[i + 2]; px[o + 3] = 255;
                }
            }

            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            c.getContext("2d").putImageData(new ImageData(px, w, h), 0, 0);

            return { src: c, w, h };
        }

        return null;
    }

    /* Pixels of one picture that is shown straight or turned a quarter. */
    function place(part, src, vt, vis){

        const P = mul(mul([1 / src.w, 0, 0, -1 / src.h, 0, 1], part.m), vt);

        const s = Math.abs(P[0]) + Math.abs(P[1]) + Math.abs(P[2]) + Math.abs(P[3]);

        let turned;

        if(Math.abs(P[1]) + Math.abs(P[2]) < 1e-4 * s) turned = false;
        else if(Math.abs(P[0]) + Math.abs(P[3]) < 1e-4 * s) turned = true;
        else return null;

        const inv = invert(P);
        if(!inv) return null;

        const box = boxOf(vt, vis);

        const c = boxOf(inv, box);

        const x0 = Math.max(0, Math.min(src.w, Math.round(c[0])));
        const x1 = Math.max(0, Math.min(src.w, Math.round(c[2])));
        const y0 = Math.max(0, Math.min(src.h, Math.round(c[1])));
        const y1 = Math.max(0, Math.min(src.h, Math.round(c[3])));

        if(x1 <= x0 || y1 <= y0) return { empty: true };

        return { P, turned, x0, x1, y0, y1, box };
    }

    async function extract(page, pic, options){

        options = options || {};

        const maxPixels = options.maxPixels || 24000000;

        try{ await page.getOperatorList(); }catch(error){}

        const viewport = page.getViewport({ scale: 1 });
        const vt = viewport.transform;

        const placed = [];

        let ok = true;

        for(const part of pic.parts){

            const data = part.inline || await getObject(page, part.objId);
            const src = drawable(data);

            if(!src){ ok = false; break; }

            const p = place(part, src, vt, part.vis);

            if(!p){ ok = false; break; }
            if(p.empty) continue;

            p.src = src;
            p.part = part;
            placed.push(p);
        }

        if(ok && placed.length) try{

            const first = placed[0];

            // Where each piece goes in the finished picture, in its own pixels.
            const ptPerU = first.turned ? Math.abs(first.P[2]) : Math.abs(first.P[0]);
            const ptPerV = first.turned ? Math.abs(first.P[1]) : Math.abs(first.P[3]);

            const union = [Infinity, Infinity, -Infinity, -Infinity];

            for(const p of placed){
                union[0] = Math.min(union[0], p.box[0]);
                union[1] = Math.min(union[1], p.box[1]);
                union[2] = Math.max(union[2], p.box[2]);
                union[3] = Math.max(union[3], p.box[3]);
            }

            let W = 0, H = 0;

            for(const p of placed){

                p.cw = p.turned ? p.y1 - p.y0 : p.x1 - p.x0;
                p.ch = p.turned ? p.x1 - p.x0 : p.y1 - p.y0;

                p.u0 = placed.length === 1 ? 0 : Math.round((p.box[0] - union[0]) / ptPerU);
                p.v0 = placed.length === 1 ? 0 : Math.round((p.box[1] - union[1]) / ptPerV);

                W = Math.max(W, p.u0 + p.cw);
                H = Math.max(H, p.v0 + p.ch);
            }

            let f = 1;

            if(W * H > maxPixels) f = Math.sqrt(maxPixels / (W * H));

            const canvas = document.createElement("canvas");

            canvas.width = Math.max(1, Math.round(W * f));
            canvas.height = Math.max(1, Math.round(H * f));

            const ctx = canvas.getContext("2d");

            ctx.imageSmoothingEnabled = f < 1;

            for(const p of placed){

                const P = p.P;

                let A = 0, B = 0, C = 0, D = 0, E = 0, F = 0;

                if(!p.turned){

                    D = P[3] > 0 ? 1 : -1;  F = P[3] > 0 ? 0 : sh;
                }else{
                    C = P[2] > 0 ? 1 : -1;  E = P[2] > 0 ? 0 : sh;
                    B = P[1] > 0 ? 1 : -1;  F = P[1] > 0 ? 0 : sw;

                ctx.setTransform(A * f, B * f, C * f, D * f, (E + p.u0) * f, (F + p.v0) * f);

            console.warn("Picture: drawing from its own pixels failed", error);

        const rect = pic.rect;
        const wPt = rect[2] - rect[0];
        const hPt = rect[3] - rect[1];

        let scale = pic.w ? pic.w / wPt : 3;

        scale = Math.max(1, Math.min(scale, 8, 8000 / Math.max(wPt, hPt), Math.sqrt(maxPixels / (wPt * hPt))));

        const vp = page.getViewport({ scale });

        const b = boxOf(vp.transform, rect);

        const left = Math.floor(b[0] + 1e-6);
        const top = Math.floor(b[1] + 1e-6);

        const canvas = document.createElement("canvas");

        canvas.width = Math.max(1, Math.ceil(b[2] - 1e-6) - left);
        canvas.height = Math.max(1, Math.ceil(b[3] - 1e-6) - top);

        await page.render({
            canvasContext: canvas.getContext("2d", { alpha: false }),
            viewport: vp,
            transform: [1, 0, 0, 1, -left, -top]
        }).promise;

        return { canvas, exact: false };

        /* ----- the pictures on a page (same rules as the PDF viewer) ----- */

        function pictures(opList, page){

            return LTPics.find(opList, OPS, page && page.view);

        }


        /* ----- a fingerprint of the picture's own pixels ----- */

        const mix = (h, v) => Math.imul(h ^ v, 16777619) >>> 0;

        async function fingerprint(page, region){

            try{

                let data = region.inline || null;

                if(!data && region.objId){

                    data = await LTPics.getObject(page, region.objId);

                }

                if(!data) return "";

                let h = 2166136261;

                h = mix(h, data.width || region.w || 0);

                h = mix(h, data.height || region.h || 0);

                if(data.data && data.data.length){

                    const n = data.data.length;

                    const step = Math.max(1, Math.floor(n / 6000));

                    for(let i = 0; i < n; i += step){
                        h = mix(h, data.data[i]);
                    }

                }else if(data.bitmap){

                    const tiny = document.createElement("canvas");

                    tiny.width = 24;
                    tiny.height = 24;

                    const t = tiny.getContext("2d", { willReadFrequently: true });

                    t.drawImage(data.bitmap, 0, 0, 24, 24);

                    const px = t.getImageData(0, 0, 24, 24).data;

                    for(let i = 0; i < px.length; i++){
                        h = mix(h, px[i] >> 3);
                    }

                }else{

                    return "";

                }

                return h.toString(16).padStart(8, "0");

            }catch(error){

                return "";

            }

        }


        /* ----- open the PDF ----- */


        let doc;

        try{

            doc = await (window.__pdfDoc || pdfjs.getDocument({ url: pdfRef.file, disableAutoFetch: true, rangeChunkSize: 1048576 }).promise);

        }catch(error){

            console.warn("PDF image: could not open the PDF", error);

            fail("Couldn't open the PDF this picture is from.");

            return;

        }

        const hadHash = !!pdfRef.hash;

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        const cache = new Map();

        const onPage = (n) => {

            if(!cache.has(n)){

                cache.set(n, (async () => {

                    const page = await doc.getPage(n);

                    const opList = await page.getOperatorList();

                    return { page, list: pictures(opList, page) };

                })());

            }

            return cache.get(n);

        };

        const sameSize = (r) =>
            !pdfRef.w || !pdfRef.h || !r.w || !r.h || (r.w === pdfRef.w && r.h === pdfRef.h);


        /* ----- find the picture ----- */

        async function locate(){

            let spot = null;

            if(pdfRef.page <= doc.numPages){

                const here = await onPage(pdfRef.page);

                const r = here.list[pdfRef.index - 1];

                if(r){

                    if(sameSize(r)){

                        if(!pdfRef.hash){
                            return { page: pdfRef.page, index: pdfRef.index, here, exact: true };
                        }

                        const h = await fingerprint(here.page, r);

                        if(!h || h === pdfRef.hash){
                            return { page: pdfRef.page, index: pdfRef.index, here, exact: true };
                        }

                    }

                    spot = { page: pdfRef.page, index: pdfRef.index, here, exact: false };

                }

            }

            /* Not where the link says: look through the PDF, nearest pages first. */

            const order = [];

            for(let n = 1; n <= doc.numPages; n++){ order.push(n); }

            order.sort((a, b) => Math.abs(a - pdfRef.page) - Math.abs(b - pdfRef.page) || a - b);

            let sizeOnly = null;

            // A long PDF (a scanned book, say) must not be gone through page by
            // page for ever: after a few seconds the best guess is used.
            const giveUp = Date.now() + 20000;

            for(const n of order){

                if(Date.now() > giveUp) break;

                let here;

                try{ here = await onPage(n); }catch(error){ continue; }

                // Pages that are only being looked at are let go of right after, so
                // their pictures don't pile up in memory.
                const looked = here;
                const letGo = () => {
                    if(!spot || spot.here !== looked){
                        cache.delete(n);
                        try{ looked.page.cleanup(); }catch(error){}
                    }
                };

                for(let i = 0; i < here.list.length; i++){

                    const r = here.list[i];

                    if(!r.w || !r.h || !sameSize(r)){
                        continue;
                    }

                    if(pdfRef.hash){

                        const h = await fingerprint(here.page, r);

                        if(h && h === pdfRef.hash){
                            return { page: n, index: i + 1, here, exact: true, moved: true };
                        }

                    }else if(!sizeOnly){

                        sizeOnly = { page: n, index: i + 1, here, exact: false };

                    }

                }

                if(!(sizeOnly && sizeOnly.here === here)) letGo();

            }

            return spot || sizeOnly || null;

        }

        let where;

        try{

            where = await locate();

        }catch(error){

            console.warn("PDF image: search failed", error);

            fail("Couldn't find this picture in the PDF.");

            return;

        }

        if(!where){

            fail("This picture is no longer in the PDF.");

            return;

        }

        pdfRef.page = where.page;

        pdfRef.index = where.index;

        const region = where.here.list[where.index - 1];

        if(region.w && region.h){

            pdfRef.w = region.w;

            pdfRef.h = region.h;

        }


        /* ----- the picture itself: the PDF's own pixels, one for one ----- */

        try{

            const made = await LTPics.extract(where.here.page, region);

            const canvas = made.canvas;

            // Always lossless: a PNG of the picture's own pixels.
            const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

            if(!blob){
                throw new Error("could not make the image");
            }

            window.__pdfImageBlob = blob;

            window.__pdfImageUrl = URL.createObjectURL(blob);

            // Opened by an installed app's "Open in Browser": the browser is sent to
            // the bare picture, so it shows it in its own image viewer.
            img.src = window.__pdfImageUrl;

            try{
                if(new URLSearchParams(location.search).get("raw") === "1"){
                    location.replace(window.__pdfImageUrl);
                    // Still here a moment later: the browser did not go to it. The
                    // viewer, with the picture in it, is shown instead.
                    setTimeout(() => document.documentElement.classList.remove("lt-raw"), 4000);
                    return;
                }
            }catch(error){}

        }catch(error){

            console.warn("PDF image: drawing failed", error);

            fail("Couldn't draw this picture from the PDF.");

            return;

        }

        syncAddress();

        if(!where.exact){

            showToast("The PDF has changed since this link was made.");

        }else if(where.moved){

            showToast("Found this picture on page " + where.page + ".");

        }


        /* ----- the picture's number in the PDF, and its fingerprint ----- */

        // Counting the pictures on every earlier page means reading those pages,
        // and a scanned book has a big picture on each one. So it is done one page
        // at a time, in the background, letting go of each page afterwards, and the
        // picture is already on screen before it starts.
        void (async () => {

            try{

                if(!pdfRef.hash){

                    pdfRef.hash = await fingerprint(where.here.page, region);

                }

                // The page that is showing is finished with.
                try{ where.here.page.cleanup(); }catch(error){}

                syncAddress();

                // A link that already had its number, and whose picture is still
                // where it was, is trusted: nothing needs counting.
                if(hadHash && where.exact && !where.moved && pdfRef.n){
                    window.__pdfImageRefreshTitle();
                    return;
                }

                // The number of pictures on each page is remembered on this device (for
                // this exact PDF), so the next picture from it is numbered at once.
                const counts = new Map();

                const memoryKey = "lt_picc:" + ((doc.fingerprints && doc.fingerprints[0]) || pdfRef.file);

                try{

                    const saved = JSON.parse(localStorage.getItem(memoryKey) || "null");

                    if(saved && saved.pages === doc.numPages && Array.isArray(saved.c)){
                        saved.c.forEach((v, i) => { if(typeof v === "number") counts.set(i + 1, v); });
                    }

                }catch(error){}

                const remember = () => {

                    try{

                        const c = [];

                        for(let n = 1; n <= doc.numPages; n++){ c.push(counts.has(n) ? counts.get(n) : null); }

                        localStorage.setItem(memoryKey, JSON.stringify({ pages: doc.numPages, c }));

                    }catch(error){}

                };

                const countPage = async (n) => {

                    if(counts.has(n)) return counts.get(n);

                    let c = 0;

                    if(cache.has(n)){

                        c = (await cache.get(n)).list.length;

                    }else{

                        const page = await doc.getPage(n);

                        c = pictures(await page.getOperatorList(), page).length;

                        try{ page.cleanup(); }catch(error){}

                    }

                    counts.set(n, c);

                    return c;

                };

                const need = [];

                for(let n = 1; n < where.page; n++){ if(!counts.has(n)) need.push(n); }

                // A few pages at a time (each is let go of straight after), nearest the
                // picture last so the number settles in order.
                for(let i = 0; i < need.length; i += 3){

                    while(document.hidden){ await sleep(700); }

                    await Promise.all(need.slice(i, i + 3).map(n => countPage(n).catch(() => 0)));

                    if(i % 30 === 27) remember();

                }

                if(need.length) remember();

                let before = 0;

                for(let n = 1; n < where.page; n++){ before += counts.get(n) || 0; }

                pdfRef.n = before + where.index;

                window.__pdfImageRefreshTitle();

                syncAddress();

            }catch(error){

                console.warn("PDF image: could not number the picture", error);

                syncAddress();

            }

        })();

    })();
