<!DOCTYPE html>
<html lang="en">
<head>

<link
    rel="icon"
    type="image/png"
    href="file_000000000c40722f92b1fe6758cb4855.png"
>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Advanced Image Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{

    --bg:#111;

    --panel:#1b1b1b;

    --panel2:#242424;

    --text:#eee;

    --muted:#aaa;

}

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    background:var(--bg);

    color:var(--text);

    font-family:Arial,sans-serif;

    overflow:hidden;

}

body{

    display:flex;

    flex-direction:column;

}


/* ============================================================
   HEADER
   Modeled after PDF header
============================================================ */

header{

    min-height:58px;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 14px;

    background:#181818;

    border-bottom:1px solid #2d2d2d;

    flex-shrink:0;

    z-index:6000;

}

.top{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

}


/* ============================================================
   HEADER BUTTONS
============================================================ */

.headerButton{

    width:42px;

    height:38px;

    padding:0;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    background:#333;

    color:#fff;

    border:none;

    border-radius:7px;

    text-decoration:none;

    cursor:pointer;

    font-family:inherit;

    font-size:20px;

    line-height:1;

    white-space:nowrap;

}

.headerButton:hover{

    background:#353535;

}

.headerButton:active{

    background:#414141;

}


/* ============================================================
   HEADER CONTROLS
============================================================ */

.controls{

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;

}


/* ============================================================
   STANDARD BUTTON
   Modeled after PDF .btn
============================================================ */

.btn{

    background:#333;

    color:#fff;

    border:none;

    border-radius:7px;

    padding:9px 12px;

    text-decoration:none;

    cursor:pointer;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    white-space:nowrap;

    font-family:inherit;

    font-size:14px;

    line-height:normal;

}

.btn:hover{

    background:#353535;

}

.btn:active{

    background:#414141;

}


/* ============================================================
   PDF BUTTON
============================================================ */

#pdfButton{

    display:none;

}


/* ============================================================
   VIEWER
============================================================ */

#viewer{

    flex:1;

    position:relative;

    width:100%;

    min-height:0;

    overflow:hidden;

    background:#111;

    touch-action:none;

}

#img{

    position:absolute;

    left:50%;

    top:50%;

    transform-origin:center center;

    max-width:none;

    user-select:none;

    -webkit-user-select:none;

    -webkit-user-drag:none;

}


/* ============================================================
   TITLE BAR
   Modeled after PDF #titleBar
============================================================ */

.title{

    flex-shrink:0;

    width:100%;

    background:rgba(24,24,24,.92);

    padding:12px 18px;

    text-align:center;

    border-top:1px solid #333;

    backdrop-filter:blur(6px);

    -webkit-backdrop-filter:blur(6px);

    z-index:3000;

}

#title{

    display:flex;

    justify-content:center;

    align-items:center;

    width:100%;

    text-align:center;

    font-size:1.2rem;

    font-weight:bold;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

}


/* ============================================================
   ZOOM BAR
   Visually modeled after PDF toolbar
   Existing control positions preserved
============================================================ */

#zoomBar{

    flex-shrink:0;

    min-height:46px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    padding:6px 8px;

    background:#1b1b1b;

    border-top:1px solid #2d2d2d;

    flex-wrap:wrap;

    z-index:5500;

}


/* ============================================================
   IMAGE ZOOM DISPLAY
============================================================ */

#zoom{

    width:58px;

    height:27px;

    padding:2px 4px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:#1d1d1d;

    border:0;

    border-radius:4px;

    color:#fff;

    font-size:12px;

}


/* ============================================================
   IMAGE TOOL BUTTONS
   Same compact sizing language as PDF
============================================================ */

#zoomBar .btn{

    height:32px;

    min-height:32px;

    padding:0 10px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    white-space:nowrap;

    font-size:13px;

    border-radius:6px;

}


/* ============================================================
   MENU
   Modeled directly after PDF menu
============================================================ */

#menu{

    position:fixed;

    right:10px;

    top:58px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    padding:8px;

    display:none;

    min-width:220px;

    z-index:7000;

}

#menu button{

    width:100%;

    text-align:left;

    margin:3px 0;

    background:#292929;

    color:#fff;

    border:1px solid #383838;

    border-radius:6px;

    padding:6px 9px;

    font:inherit;

    cursor:pointer;

    outline:none;

}

#menu button:hover{

    background:#353535;

}

#menu button:active{

    background:#414141;

}


/* ============================================================
   FLOATING READING MODE
   Exact visual model of PDF
============================================================ */

#readingModeFloat{

    position:fixed;

    right:18px;

    bottom:86px;

    width:48px;

    height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    border-radius:50%;

    background:rgba(40,40,40,.94);

    border:1px solid #555;

    color:#fff;

    font-size:18px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.45);

    z-index:9000;

    cursor:pointer;

    backdrop-filter:blur(6px);

    -webkit-backdrop-filter:blur(6px);

    transition:
        transform .15s ease,
        background .15s ease;

}

#readingModeFloat:hover{

    background:#3a3a3a;

    transform:scale(1.05);

}

#readingModeFloat:active{

    transform:scale(.96);

}


/* ============================================================
   READING MODE
   Modeled after PDF body.reading-mode
============================================================ */

body.reading-mode header,
body.reading-mode #zoomBar,
body.reading-mode .title,
body.reading-mode #menu{

    display:none !important;

    height:0 !important;

    min-height:0 !important;

    max-height:0 !important;

    margin:0 !important;

    padding:0 !important;

    border:0 !important;

    overflow:hidden !important;

}

body.reading-mode{

    display:block;

}

body.reading-mode #viewer{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

}

body.reading-mode #readingModeFloat{

    right:16px;

    bottom:16px;

    background:rgba(40,40,40,.88);

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:768px){

    header{

        padding:0 8px;

    }

    .headerButton{

        width:42px;

        height:38px;

    }

    #zoomBar{

        gap:4px;

        padding:5px;

    }

    #zoomBar .btn{

        height:30px;

        min-height:30px;

        padding:0 8px;

        font-size:12px;

    }

    #zoom{

        height:25px;

        width:53px;

    }

    #menu{

        top:58px;

        right:8px;

    }

    .title{

        padding:10px 14px;

    }

    #title{

        font-size:1.2rem;

    }

    #readingModeFloat{

        right:14px;

        bottom:88px;

        width:46px;

        height:46px;

        font-size:16px;

    }

    body.reading-mode #readingModeFloat{

        right:12px;

        bottom:12px;

    }

}

</style>

</head>


<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header>

    <div class="top">


        <a
            class="headerButton"
            id="homeButton"
            href="index.html"
            aria-label="Back"
            title="Back"
        >
            ☰
        </a>


        <div class="controls">


            <a
                class="btn"
                id="pdfButton"
                target="_blank"
                rel="noopener"
            >
                PDF
            </a>


            <button
                class="headerButton"
                id="menuBtn"
                type="button"
                aria-label="Menu"
                title="Menu"
            >
                ☰
            </button>


        </div>

    </div>

</header>


<!-- ==========================================================
     MENU
========================================================== -->

<div id="menu">

    <button
        id="downloadBtn"
        type="button"
    >
        Download Image
    </button>

    <button
        id="newTabBtn"
        type="button"
    >
        Open in New Tab
    </button>

    <button
        id="shareBtn"
        type="button"
    >
        Share Image
    </button>

    <button
        id="fullscreenBtn"
        type="button"
    >
        Fullscreen
    </button>

</div>


<!-- ==========================================================
     IMAGE VIEWER
========================================================== -->

<div id="viewer">

    <img
        id="img"
        alt=""
    >

</div>


<!-- ==========================================================
     FLOATING READING MODE
========================================================== -->

<button
    id="readingModeFloat"
    type="button"
    aria-label="Toggle Reading Mode"
    title="Reading Mode"
>
    ▣
</button>


<!-- ==========================================================
     TITLE
========================================================== -->

<div
    class="title"
    id="title"
>
    Loading...
</div>


<!-- ==========================================================
     CONTROLS
========================================================== -->

<div id="zoomBar">


    <button
        class="btn"
        id="minus"
        type="button"
        aria-label="Zoom out"
        title="Zoom out"
    >
        −
    </button>


    <div id="zoom">
        100%
    </div>


    <button
        class="btn"
        id="plus"
        type="button"
        aria-label="Zoom in"
        title="Zoom in"
    >
        +
    </button>


    <button
        class="btn"
        id="fit"
        type="button"
    >
        Reset
    </button>


    <button
        class="btn"
        id="lock"
        type="button"
    >
        ✣ Free
    </button>


</div>


<script>


/* =========================================================
   URL PARAMETERS
========================================================= */

const p =
    new URLSearchParams(
        location.search
    );


const img =
    document.getElementById(
        "img"
    );


const viewer =
    document.getElementById(
        "viewer"
    );


const title =
    document.getElementById(
        "title"
    );


const fitButton =
    document.getElementById(
        "fit"
    );


const lockButton =
    document.getElementById(
        "lock"
    );


const minusButton =
    document.getElementById(
        "minus"
    );


const plusButton =
    document.getElementById(
        "plus"
    );


const menu =
    document.getElementById(
        "menu"
    );


const menuButton =
    document.getElementById(
        "menuBtn"
    );


const readModeButton =
    document.getElementById(
        "readingModeFloat"
    );


const src =
    decodeURIComponent(
        p.get("image") || ""
    );


const returnPage =
    decodeURIComponent(
        p.get("return") ||
        "index.html"
    );


/* =========================================================
   BACK BUTTON
========================================================= */

const homeButton =
    document.getElementById(
        "homeButton"
    );


homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );

        location.href =
            returnPage;

    }
);


/* =========================================================
   FIND PDF
========================================================= */

fetch("descriptions.json")
.then(
    r => r.json()
)
.then(
    data => {

        let paper = null;


        Object.values(data).forEach(
            p => {

                if(!p.images)
                    return;


                if(
                    p.images.includes(src)
                ){

                    paper = p;

                }

            }
        );


        if(!paper)
            return;


        document.getElementById(
            "pdfButton"
        ).href =
            paper.url;

    }
)
.catch(
    error => {

        console.warn(
            "Could not load descriptions.json:",
            error
        );

    }
);


/* =========================================================
   IMAGE INFORMATION
========================================================= */

img.src =
    src;


const filename =
    src
        .split("/")
        .pop();


const displayName =
    filename
        .replace(
            /\.[^/.]+$/,
            ""
        )
        .replace(
            /[-_]+/g,
            " "
        )
        .replace(
            /\b\w/g,
            function(char){

                return char.toUpperCase();

            }
        );


title.textContent =
    displayName;


document.title =
    displayName;


/* =========================================================
   MOVEMENT / ZOOM STATE
========================================================= */

let base = 1;

let zoom = 1;

let offsetX = 0;

let offsetY = 0;


/*
    Existing movement modes are deliberately
    preserved.

    free       = left/right + up/down
    vertical   = up/down only
    horizontal = left/right only
*/

let movementMode =
    "free";


const zoomLabel =
    document.getElementById(
        "zoom"
    );


const pointers =
    new Map();


let pinchDistance = 0;

let pinchZoom = 1;


/* =========================================================
   ZOOM LIMITS
========================================================= */

function clampZoom(){

    if(
        zoom < 0.05
    ){

        zoom = 0.05;

    }


    if(
        zoom > 50
    ){

        zoom = 50;

    }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    clampZoom();


    img.style.transform =

        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${base * zoom})`;


    zoomLabel.textContent =
        Math.round(
            zoom * 100
        ) + "%";

}


/* =========================================================
   FIT / RESET
========================================================= */

function fit(){

    if(
        !img.naturalWidth
    ){

        return;

    }


    base = Math.min(

        viewer.clientWidth /
        img.naturalWidth,

        viewer.clientHeight /
        img.naturalHeight

    );


    zoom = 1;


    offsetX = 0;

    offsetY = 0;


    img.style.transition =
        "transform .22s";


    draw();


    setTimeout(
        () => {

            img.style.transition =
                "";

        },
        220
    );

}


img.onload =
    fit;


window.addEventListener(
    "resize",
    () => {

        /*
            Preserve the image state while
            Reading Mode is active.

            Normal mode retains the original
            fit behavior.
        */

        if(
            document.body.classList.contains(
                "reading-mode"
            )
        ){

            draw();

        }else{

            fit();

        }

    }
);


/* =========================================================
   ZOOM BUTTONS
========================================================= */

minusButton.onclick =
    () => {

        zoom /= 1.1;

        draw();

    };


plusButton.onclick =
    () => {

        zoom *= 1.1;

        draw();

    };


fitButton.onclick =
    fit;


/* =========================================================
   MOVEMENT MODE
========================================================= */

lockButton.onclick =
    () => {

        if(
            movementMode ===
            "free"
        ){

            movementMode =
                "vertical";

            lockButton.textContent =
                "↕ Vertical";


        }else if(
            movementMode ===
            "vertical"
        ){

            movementMode =
                "horizontal";

            lockButton.textContent =
                "↔ Horizontal";


        }else{

            movementMode =
                "free";

            lockButton.textContent =
                "✣ Free";

        }

    };


/* =========================================================
   READING MODE
   Modeled directly after PDF
========================================================= */

let readingMode =
    false;


function setReadingMode(
    enabled
){

    readingMode =
        Boolean(
            enabled
        );


    if(
        readingMode
    ){

        document.body.classList.add(
            "reading-mode"
        );


        readModeButton.textContent =
            "×";


        readModeButton.title =
            "Exit Reading Mode";


        readModeButton.setAttribute(
            "aria-label",
            "Exit Reading Mode"
        );


        menu.style.display =
            "none";


    }else{

        document.body.classList.remove(
            "reading-mode"
        );


        readModeButton.textContent =
            "▣";


        readModeButton.title =
            "Reading Mode";


        readModeButton.setAttribute(
            "aria-label",
            "Reading Mode"
        );

    }

}


readModeButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        setReadingMode(
            !readingMode
        );

    }
);


/* =========================================================
   POINTER EVENTS
========================================================= */

viewer.onpointerdown =
    e => {

        viewer.setPointerCapture(
            e.pointerId
        );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        if(
            pointers.size === 2
        ){

            const pts =
                [...pointers.values()];


            pinchDistance =
                Math.hypot(

                    pts[0].x -
                    pts[1].x,

                    pts[0].y -
                    pts[1].y

                );


            pinchZoom =
                zoom;

        }

    };


viewer.onpointermove =
    e => {

        if(
            !pointers.has(
                e.pointerId
            )
        ){

            return;

        }


        const previous =
            pointers.get(
                e.pointerId
            );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        /* =================================================
           ONE FINGER
        ================================================= */

        if(
            pointers.size === 1
        ){

            const dx =
                e.clientX -
                previous.x;


            const dy =
                e.clientY -
                previous.y;


            if(
                movementMode ===
                "free"
            ){

                offsetX += dx;

                offsetY += dy;


            }else if(
                movementMode ===
                "vertical"
            ){

                offsetY += dy;


            }else if(
                movementMode ===
                "horizontal"
            ){

                offsetX += dx;

            }


            draw();


            return;

        }


        /* =================================================
           TWO FINGER PINCH
        ================================================= */

        if(
            pinchDistance <= 0
        ){

            return;

        }


        const pts =
            [...pointers.values()];


        const distance =
            Math.hypot(

                pts[0].x -
                pts[1].x,

                pts[0].y -
                pts[1].y

            );


        const oldScale =
            base * zoom;


        zoom =
            pinchZoom *
            (
                distance /
                pinchDistance
            );


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX *= ratio;

        offsetY *= ratio;


        pinchDistance =
            distance;


        pinchZoom =
            zoom;


        draw();

    };


viewer.onpointerup =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(
            pointers.size < 2
        ){

            pinchDistance =
                0;

        }

    };


viewer.onpointercancel =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(
            pointers.size < 2
        ){

            pinchDistance =
                0;

        }

    };


/* =========================================================
   INITIAL DRAW
========================================================= */

draw();

fit();


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

viewer.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;


        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;


        const oldScale =
            base * zoom;


        if(
            e.deltaY < 0
        ){

            zoom *= 1.12;

        }else{

            zoom /= 1.12;

        }


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX =

            mouseX -
            (
                mouseX -
                offsetX
            ) * ratio;


        offsetY =

            mouseY -
            (
                mouseY -
                offsetY
            ) * ratio;


        draw();

    },
    {
        passive:false
    }
);


/* =========================================================
   MENU
========================================================= */

menuButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();


        menu.style.display =

            menu.style.display ===
            "block"

                ? "none"

                : "block";

    }
);


menu.addEventListener(
    "click",
    e => {

        e.stopPropagation();

    }
);


document.addEventListener(
    "click",
    () => {

        menu.style.display =
            "none";

    }
);


/* =========================================================
   NEW TAB
========================================================= */

document
    .getElementById(
        "newTabBtn"
    )
    .onclick =
    () => {

        menu.style.display =
            "none";


        window.open(
            src,
            "_blank"
        );

    };


/* =========================================================
   DOWNLOAD
========================================================= */

document
    .getElementById(
        "downloadBtn"
    )
    .onclick =
    () => {

        const a =
            document.createElement(
                "a"
            );


        a.href =
            src;


        a.download =
            src
                .split("/")
                .pop();


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        menu.style.display =
            "none";

    };


/* =========================================================
   SHARE IMAGE
========================================================= */

document
    .getElementById(
        "shareBtn"
    )
    .addEventListener(
        "click",
        async () => {

            const url =
                window.location.href;


            menu.style.display =
                "none";


            if(
                navigator.share
            ){

                try{

                    await navigator.share({

                        title:
                            title.textContent,

                        text:
                            title.textContent,

                        url:
                            url

                    });


                    return;

                }catch(error){

                    if(
                        error &&
                        error.name ===
                        "AbortError"
                    ){

                        return;

                    }

                }

            }


            if(
                navigator.clipboard &&
                typeof
                navigator.clipboard.writeText ===
                "function"
            ){

                try{

                    await navigator.clipboard.writeText(
                        url
                    );


                    return;

                }catch(error){

                    /* Continue to fallback */

                }

            }


            window.prompt(
                "Copy this link:",
                url
            );

        }
    );


/* =========================================================
   DONE
========================================================= */

</script>

</body>
</html>
