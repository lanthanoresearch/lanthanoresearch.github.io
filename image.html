<!DOCTYPE html>
<html lang="en">
<head>

    <link
        rel="icon"
        type="image/png"
        href="file_000000000c40722f92b1fe6758cb4855.png"
    >

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Advanced Image Viewer</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            height:100%;
            background:#111;
            color:#eee;
            font-family:Arial,sans-serif;
            overflow:hidden;
        }

        body{
            display:flex;
            flex-direction:column;
        }


        /* ---------- Header ---------- */

        header{
            background:#1b1b1b;
            border-bottom:1px solid #333;
            padding:8px;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
        }


        /* ---------- Menu ---------- */

        #menu{
            position:absolute;
            right:10px;
            top:58px;
            background:#222;
            border:1px solid #333;
            border-radius:10px;
            padding:8px;
            display:none;
            min-width:220px;
            z-index:1000;
        }

        #menu button{
            width:100%;
            text-align:left;
            margin:3px 0;
            background:#333;
            color:#fff;
            border:none;
            border-radius:7px;
            padding:9px 12px;
            cursor:pointer;
        }

        #menu button:hover{
            background:#444;
        }


        /* ---------- PDF Button ---------- */

        #pdfButton{
            display:none;
        }


        /* ---------- Title ---------- */

        .title{

            padding:12px 18px;

            text-align:center;

            font-weight:bold;

            font-size:1.2rem;

            white-space:nowrap;

            overflow:hidden;

            text-overflow:ellipsis;

            background:rgba(24,24,24,.92);

            border-top:1px solid #333;

            backdrop-filter:blur(6px);

        }


        /* ---------- Controls ---------- */

        .controls{
            display:flex;
            gap:6px;
            flex-wrap:wrap;
        }

        .btn{
            background:#333;
            color:#fff;
            border:none;
            border-radius:7px;
            padding:9px 12px;
            text-decoration:none;
            cursor:pointer;
        }

        .btn:hover{
            background:#444;
        }


        /* ---------- Viewer ---------- */

        #viewer{
            flex:1;
            position:relative;
            overflow:hidden;
            touch-action:none;
        }

        #img{
            position:absolute;
            left:50%;
            top:50%;
            transform-origin:center center;
            user-select:none;
            -webkit-user-drag:none;
            max-width:none;
        }


        /* ---------- Zoom Bar ---------- */

        #zoomBar{
            display:flex;
            justify-content:center;
            gap:8px;
            padding:8px;
            background:#181818;
        }

        #zoom{

            display:flex;

            align-items:center;

            position:relative;

            top:3px;

            min-width:60px;

            justify-content:center;

        }


        /* ---------- Mobile ---------- */

        @media(max-width:700px){

            .top{
                align-items:flex-start;
            }

            .controls .btn{
                padding:8px 10px;
                font-size:.9rem;
            }

            .title{
                font-size:1.2rem;
                padding:10px 14px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="top">

        <a
            class="btn"
            id="homeButton"
            href="index.html"
        >
            ◀ Back
        </a>


        <div class="controls">

            <a
                class="btn"
                id="pdfButton"
                target="_blank"
            >
                PDF
            </a>


            <button
                class="btn"
                id="menuBtn"
            >
                ☰
            </button>

        </div>

    </div>

</header>


<!-- ---------- Menu ---------- -->

<div id="menu">

    <button id="downloadBtn">
        Download Image
    </button>

    <button id="newTabBtn">
        Open in New Tab
    </button>

    <button id="shareBtn">
        Share
    </button>

    <button id="fullscreenBtn">
        Fullscreen
    </button>

</div>


<!-- ---------- Image Viewer ---------- -->

<div id="viewer">

    <img
        id="img"
        alt=""
    >

</div>


<!-- ---------- File Name ---------- -->

<div
    class="title"
    id="title"
>
    Loading...
</div>


<!-- ---------- Zoom Controls ---------- -->

<div id="zoomBar">

    <button
        class="btn"
        id="minus"
    >
        −
    </button>


    <div id="zoom">
        100%
    </div>


    <button
        class="btn"
        id="plus"
    >
        +
    </button>


    <button
        class="btn"
        id="fit"
    >
        Reset
    </button>


    <button
        class="btn"
        id="lock"
    >
        ✣ Free
    </button>

</div>


<script>


/* =========================================================
   IMAGE VIEWER
   ========================================================= */


/* ---------- URL Parameters ---------- */

const p =
    new URLSearchParams(
        location.search
    );


const img =
    document.getElementById("img");


const viewer =
    document.getElementById("viewer");


const title =
    document.getElementById("title");


const fitButton =
    document.getElementById("fit");


const lockButton =
    document.getElementById("lock");


const minusButton =
    document.getElementById("minus");


const plusButton =
    document.getElementById("plus");


const menu =
    document.getElementById("menu");


const menuButton =
    document.getElementById("menuBtn");


const src =
    decodeURIComponent(
        p.get("image") || ""
    );


const returnPage =
    decodeURIComponent(
        p.get("return") || "index.html"
    );


/* ---------- Back Button ---------- */

const homeButton =
    document.getElementById("homeButton");


homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();


        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );


        location.href =
            returnPage;

    }
);


/* ---------- Find PDF ---------- */

fetch("descriptions.json")
.then(r => r.json())
.then(data => {

    let paper = null;


    Object.values(data).forEach(p => {

        if(!p.images)
            return;


        if(p.images.includes(src)){

            paper = p;

        }

    });


    if(!paper)
        return;


    document.getElementById(
        "pdfButton"
    ).href =
        paper.url;

});


/* ---------- Image ---------- */

img.src =
    src;


const filename =
    src
        .split("/")
        .pop();


const displayName =
    filename
        .replace(/\.[^/.]+$/, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, function(char){

            return char.toUpperCase();

        });


title.textContent =
    displayName;


document.title =
    displayName;


/* =========================================================
   IMAGE MOVEMENT / ZOOM
   ========================================================= */


let base = 1;

let zoom = 1;

let offsetX = 0;

let offsetY = 0;


/*
    Movement modes:

    free       = left/right + up/down
    vertical   = up/down only
    horizontal = left/right only
*/

let movementMode = "free";


const zoomLabel =
    document.getElementById("zoom");


const pointers =
    new Map();


let pinchDistance = 0;

let pinchZoom = 1;


/* ---------- Zoom Limits ---------- */

function clampZoom(){

    if(zoom < 0.05){

        zoom = 0.05;

    }


    if(zoom > 50){

        zoom = 50;

    }

}


/* ---------- Draw ---------- */

function draw(){

    clampZoom();


    img.style.transform =

        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${base * zoom})`;


    zoomLabel.textContent =
        Math.round(zoom * 100) + "%";

}


/* ---------- Fit / Reset ---------- */

function fit(){

    if(!img.naturalWidth)
        return;


    base = Math.min(

        viewer.clientWidth /
        img.naturalWidth,

        viewer.clientHeight /
        img.naturalHeight

    );


    zoom = 1;


    offsetX = 0;

    offsetY = 0;


    img.style.transition =
        "transform .22s";


    draw();


    setTimeout(
        () => {

            img.style.transition = "";

        },
        220
    );

}


img.onload =
    fit;


window.addEventListener(
    "resize",
    fit
);


/* ---------- Zoom Buttons ---------- */

minusButton.onclick =
    () => {

        zoom /= 1.1;

        draw();

    };


plusButton.onclick =
    () => {

        zoom *= 1.1;

        draw();

    };


fitButton.onclick =
    fit;


/* =========================================================
   MOVEMENT MODE
   ========================================================= */

lockButton.onclick = () => {

    if(movementMode === "free"){

        movementMode = "vertical";

        lockButton.textContent =
            "↕ Vertical";

    }else if(movementMode === "vertical"){

        movementMode = "horizontal";

        lockButton.textContent =
            "↔ Horizontal";

    }else{

        movementMode = "free";

        lockButton.textContent =
            "✣ Free";

    }

};


/* =========================================================
   POINTER EVENTS
   ========================================================= */


/* ---------- Pointer Down ---------- */

viewer.onpointerdown =
    e => {

        viewer.setPointerCapture(
            e.pointerId
        );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        if(pointers.size === 2){

            const pts =
                [...pointers.values()];


            pinchDistance =
                Math.hypot(

                    pts[0].x -
                    pts[1].x,

                    pts[0].y -
                    pts[1].y

                );


            pinchZoom =
                zoom;

        }

    };


/* ---------- Pointer Move ---------- */

viewer.onpointermove =
    e => {

        if(!pointers.has(e.pointerId))
            return;


        const previous =
            pointers.get(
                e.pointerId
            );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        /* ---------- One Finger ---------- */

        if(pointers.size === 1){

            const dx =
                e.clientX -
                previous.x;


            const dy =
                e.clientY -
                previous.y;


            /*
                Free:
                move both directions.

                Vertical:
                only up/down.

                Horizontal:
                only left/right.
            */

            if(movementMode === "free"){

                offsetX += dx;

                offsetY += dy;

            }else if(movementMode === "vertical"){

                offsetY += dy;

            }else if(movementMode === "horizontal"){

                offsetX += dx;

            }


            draw();


            return;

        }


        /* ---------- Two Finger Pinch ---------- */

        const pts =
            [...pointers.values()];


        const distance =
            Math.hypot(

                pts[0].x -
                pts[1].x,

                pts[0].y -
                pts[1].y

            );


        const oldScale =
            base * zoom;


        zoom =
            pinchZoom *
            (
                distance /
                pinchDistance
            );


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX *= ratio;

        offsetY *= ratio;


        pinchDistance =
            distance;


        pinchZoom =
            zoom;


        draw();

    };


/* ---------- Pointer Up ---------- */

viewer.onpointerup =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(pointers.size < 2){

            pinchDistance = 0;

        }

    };


/* ---------- Pointer Cancel ---------- */

viewer.onpointercancel =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(pointers.size < 2){

            pinchDistance = 0;

        }

    };


/* ---------- Initial Draw ---------- */

draw();

fit();


/* =========================================================
   FULLSCREEN
   ========================================================= */

document
    .getElementById("fullscreenBtn")
    .onclick = () => {

        menu.style.display =
            "none";


        if(document.fullscreenElement){

            document.exitFullscreen();

        }else{

            document.documentElement
                .requestFullscreen();

        }

    };


/* =========================================================
   MOUSE WHEEL ZOOM
   ========================================================= */

viewer.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;


        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;


        const oldScale =
            base * zoom;


        if(e.deltaY < 0){

            zoom *= 1.12;

        }else{

            zoom /= 1.12;

        }


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX =

            mouseX -
            (
                mouseX -
                offsetX
            ) * ratio;


        offsetY =

            mouseY -
            (
                mouseY -
                offsetY
            ) * ratio;


        draw();

    },
    {
        passive:false
    }
);


/* =========================================================
   MENU
   ========================================================= */

menuButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();


        menu.style.display =

            menu.style.display === "block"

            ? "none"

            : "block";

    }
);


menu.addEventListener(
    "click",
    e => {

        e.stopPropagation();

    }
);


document.addEventListener(
    "click",
    () => {

        menu.style.display =
            "none";

    }
);


/* =========================================================
   NEW TAB
   ========================================================= */

document
    .getElementById("newTabBtn")
    .onclick = () => {

        menu.style.display =
            "none";


        window.open(
            src,
            "_blank"
        );

    };


/* =========================================================
   DOWNLOAD
   ========================================================= */

document
    .getElementById("downloadBtn")
    .onclick = () => {

        const a =
            document.createElement("a");


        a.href =
            src;


        a.download =
            src.split("/").pop();


        document.body.appendChild(a);


        a.click();


        a.remove();


        menu.style.display =
            "none";

    };


/* =========================================================
   SHARE
   ========================================================= */

document
    .getElementById("shareBtn")
    .addEventListener(
        "click",
        async () => {

            const url =
                window.location.href;


            menu.style.display =
                "none";


            /* Native share */

            if(navigator.share){

                try{

                    await navigator.share({

                        title:
                            title.textContent,

                        text:
                            title.textContent,

                        url:
                            url

                    });


                    return;

                }catch(err){

                    if(
                        err &&
                        err.name ===
                        "AbortError"
                    ){

                        return;

                    }

                }

            }


            /* Clipboard fallback */

            if(
                navigator.clipboard &&
                typeof navigator.clipboard.writeText ===
                "function"
            ){

                try{

                    await navigator.clipboard.writeText(
                        url
                    );


                    return;

                }catch(err){

                    /* Continue to final fallback */

                }

            }


            /* Manual fallback */

            window.prompt(
                "Copy this link:",
                url
            );

        }
    );


</script>

</body>
</html>
