<!DOCTYPE html>
<html lang="en">
<head>

<link
    rel="icon"
    type="image/png"
    href="file_000000000c40722f92b1fe6758cb4855.png"
>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Advanced Image Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
    --bg:#111;
    --panel:#1b1b1b;
    --panel2:#242424;
    --text:#eee;
    --muted:#aaa;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;

    background:var(--bg);
    color:var(--text);

    font-family:Arial,sans-serif;

    overflow:hidden;
}

body{
    display:flex;
    flex-direction:column;
}


/* ============================================================
   HEADER
   Modeled after PDF viewer
============================================================ */

header{

    min-height:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:#181818;

    border-bottom:1px solid #2d2d2d;

    flex-shrink:0;

    z-index:6000;
}

.top{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;
}


/* ============================================================
   BACK BUTTON
============================================================ */

#homeButton{

    background:#333;

    color:#fff;

    border:none;

    border-radius:7px;

    padding:9px 12px;

    text-decoration:none;

    cursor:pointer;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    white-space:nowrap;

    font-family:Arial,sans-serif;

    font-size:14px;

    line-height:normal;
}

#homeButton:hover{
    background:#353535;
}

#homeButton:active{
    background:#414141;
}


/* ============================================================
   HEADER CONTROLS
============================================================ */

.controls{

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;
}


/* ============================================================
   STANDARD BUTTON
   Modeled after PDF .btn
============================================================ */

.btn{

    background:#333;

    color:#fff;

    border:none;

    border-radius:7px;

    padding:9px 12px;

    text-decoration:none;

    cursor:pointer;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    white-space:nowrap;

    font-family:Arial,sans-serif;

    font-size:14px;

    line-height:normal;
}

.btn:hover{
    background:#353535;
}

.btn:active{
    background:#414141;
}


/* ============================================================
   PDF BUTTON
============================================================ */

#pdfButton{
    display:none;
}


/* ============================================================
   MENU BUTTON
   Same compact size as PDF
============================================================ */

#menuBtn{

    width:32px;
    height:32px;

    min-width:32px;
    min-height:32px;

    padding:0;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    background:#292929;

    color:#fff;

    border:1px solid #383838;

    border-radius:6px;

    font-family:Arial,sans-serif;

    font-size:16px;

    line-height:1;

    outline:none;

    cursor:pointer;
}

#menuBtn:hover{
    background:#353535;
}

#menuBtn:active{
    background:#414141;
}

#menuBtn:focus-visible{
    border-color:#666;

    outline:1px solid #555;
}


/* ============================================================
   MENU
   Modeled after PDF viewer
============================================================ */

#menu{

    position:fixed;

    right:10px;
    top:58px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    padding:8px;

    display:none;

    min-width:220px;

    z-index:7000;

    box-shadow:
        0 8px 20px rgba(0,0,0,.35);
}

#menu button{

    width:100%;

    text-align:left;

    margin:3px 0;

    background:#292929;

    color:#fff;

    border:1px solid #383838;

    border-radius:6px;

    padding:6px 9px;

    font:inherit;

    cursor:pointer;

    outline:none;
}

#menu button:hover{
    background:#353535;
}

#menu button:active{
    background:#414141;
}

#menu button:focus-visible{

    border-color:#666;

    outline:1px solid #555;
}


/* ============================================================
   VIEWER
============================================================ */

#viewer{

    flex:1;

    position:relative;

    overflow:hidden;

    touch-action:none;

    background:#111;
}

#img{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:center center;

    user-select:none;

    -webkit-user-drag:none;

    max-width:none;

    pointer-events:auto;
}


/* ============================================================
   TITLE BAR
   Modeled after PDF title bar
============================================================ */

.title{

    position:relative;

    background:rgba(24,24,24,.92);

    padding:12px 18px;

    text-align:center;

    z-index:3000;

    border-top:1px solid #333;

    backdrop-filter:blur(6px);

    font-size:1.2rem;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    flex-shrink:0;
}


/* ============================================================
   ZOOM BAR
============================================================ */

#zoomBar{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    min-height:46px;

    padding:6px 8px;

    background:#1b1b1b;

    border-top:1px solid #2d2d2d;

    flex-wrap:wrap;

    z-index:5500;
}


/* ============================================================
   UNIFIED ZOOM CONTROL
   Exact visual concept from PDF
============================================================ */

.zoomControls{

    display:flex;

    align-items:center;

    gap:3px;

    height:32px;

    padding:0 3px;

    background:#242424;

    border:1px solid #353535;

    border-radius:7px;
}

.zoomControls button{

    width:29px;
    height:28px;

    padding:0;

    border:0;

    background:transparent;

    color:#fff;

    font-size:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:4px;

    cursor:pointer;
}

.zoomControls button:hover{
    background:#353535;
}

.zoomControls button:active{
    background:#414141;
}

#zoom{

    width:58px;
    height:27px;

    padding:2px 4px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#1d1d1d;

    border:0;

    border-radius:4px;

    color:#fff;

    font-size:12px;

    line-height:1;

    user-select:none;
}


/* ============================================================
   READING MODE FLOATING BUTTON
   Same visual language as PDF
============================================================ */

#readingModeFloat{

    position:fixed;

    right:18px;
    bottom:86px;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:0;

    border-radius:50%;

    background:
        rgba(40,40,40,.94);

    border:1px solid #555;

    color:#fff;

    font-size:18px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.45);

    z-index:9000;

    cursor:pointer;

    backdrop-filter:blur(6px);

    transition:
        transform .15s ease,
        background .15s ease;
}

#readingModeFloat:hover{

    background:#3a3a3a;

    transform:scale(1.05);
}

#readingModeFloat:active{

    transform:scale(.96);
}


/* ============================================================
   READING MODE
   Modeled directly after PDF
============================================================ */

body.reading-mode header,
body.reading-mode #zoomBar,
body.reading-mode .title,
body.reading-mode #menu{

    display:none !important;

    height:0 !important;

    min-height:0 !important;

    max-height:0 !important;

    margin:0 !important;

    padding:0 !important;

    border:0 !important;

    overflow:hidden !important;
}

body.reading-mode #viewer{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    padding:20px;

    overflow:hidden;
}

body.reading-mode #readingModeFloat{

    right:16px;

    bottom:16px;

    background:
        rgba(40,40,40,.88);
}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:768px){

    header{

        padding:0 10px;
    }

    .controls{

        gap:4px;
    }

    #homeButton{

        padding:8px 10px;

        font-size:13px;
    }

    #menuBtn{

        width:30px;
        height:30px;

        min-width:30px;
        min-height:30px;

        font-size:15px;
    }

    #zoomBar{

        gap:4px;

        padding:5px;
    }

    .zoomControls{

        height:30px;
    }

    .zoomControls button{

        width:27px;
        height:26px;
    }

    #zoom{

        width:53px;
        height:25px;
    }

    .btn{

        padding:8px 10px;

        font-size:13px;
    }

    .title{

        font-size:1.2rem;

        padding:10px 14px;
    }

    #readingModeFloat{

        right:14px;

        bottom:88px;

        width:46px;
        height:46px;

        font-size:16px;
    }

    body.reading-mode #readingModeFloat{

        right:12px;

        bottom:12px;
    }
}

</style>

</head>

<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header>

    <div class="top">

        <a
            class="btn"
            id="homeButton"
            href="index.html"
        >
            ◀ Back
        </a>


        <div class="controls">

            <a
                class="btn"
                id="pdfButton"
                target="_blank"
                rel="noopener"
            >
                PDF
            </a>


            <button
                id="menuBtn"
                type="button"
                aria-label="Menu"
                title="Menu"
            >
                ☰
            </button>

        </div>

    </div>

</header>


<!-- ==========================================================
     MENU
========================================================== -->

<div id="menu">

    <button id="downloadBtn">
        Download Image
    </button>

    <button id="newTabBtn">
        Open in New Tab
    </button>

    <button id="shareBtn">
        Share Image
    </button>

    <button id="fullscreenBtn">
        Fullscreen
    </button>

</div>


<!-- ==========================================================
     IMAGE VIEWER
========================================================== -->

<div id="viewer">

    <img
        id="img"
        alt=""
    >

</div>


<!-- ==========================================================
     TITLE
========================================================== -->

<div
    class="title"
    id="title"
>
    Loading...
</div>


<!-- ==========================================================
     ZOOM CONTROLS
========================================================== -->

<div id="zoomBar">

    <div class="zoomControls">

        <button
            id="minus"
            title="Zoom out"
            aria-label="Zoom out"
        >
            −
        </button>


        <div
            id="zoom"
            aria-label="Zoom percentage"
        >
            100%
        </div>


        <button
            id="plus"
            title="Zoom in"
            aria-label="Zoom in"
        >
            +
        </button>

    </div>


    <button
        class="btn"
        id="fit"
    >
        Reset
    </button>


    <button
        class="btn"
        id="lock"
    >
        ✣ Free
    </button>

</div>


<!-- ==========================================================
     FLOATING READING MODE
========================================================== -->

<button
    id="readingModeFloat"
    type="button"
    aria-label="Toggle Reading Mode"
    title="Reading Mode"
>
    ▣
</button>


<script>

/* ============================================================
   URL PARAMETERS
============================================================ */

const p =
    new URLSearchParams(
        location.search
    );


const img =
    document.getElementById(
        "img"
    );


const viewer =
    document.getElementById(
        "viewer"
    );


const title =
    document.getElementById(
        "title"
    );


const fitButton =
    document.getElementById(
        "fit"
    );


const lockButton =
    document.getElementById(
        "lock"
    );


const minusButton =
    document.getElementById(
        "minus"
    );


const plusButton =
    document.getElementById(
        "plus"
    );


const menu =
    document.getElementById(
        "menu"
    );


const menuButton =
    document.getElementById(
        "menuBtn"
    );


const readingModeFloat =
    document.getElementById(
        "readingModeFloat"
    );


const src =
    decodeURIComponent(
        p.get("image") || ""
    );


const returnPage =
    decodeURIComponent(
        p.get("return") ||
        "index.html"
    );


/* ============================================================
   BACK BUTTON
============================================================ */

const homeButton =
    document.getElementById(
        "homeButton"
    );


homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );

        sessionStorage.setItem(
            "returnFromPage",
            "yes"
        );

        location.href =
            returnPage;
    }
);


/* ============================================================
   FIND PDF
============================================================ */

fetch("descriptions.json")
.then(
    response =>
        response.json()
)
.then(
    data => {

        let paper =
            null;

        Object.values(
            data
        ).forEach(
            item => {

                if(
                    !item.images
                ){

                    return;
                }

                if(
                    item.images.includes(
                        src
                    )
                ){

                    paper =
                        item;
                }

            }
        );

        if(
            !paper
        ){

            return;
        }

        const pdfButton =
            document.getElementById(
                "pdfButton"
            );

        pdfButton.href =
            paper.url;

        pdfButton.style.display =
            "inline-flex";

    }
)
.catch(
    error => {

        console.warn(
            "Could not load descriptions.json:",
            error
        );

    }
);


/* ============================================================
   IMAGE
============================================================ */

img.src =
    src;


const filename =
    src
        .split("/")
        .pop();


const displayName =
    filename
        .replace(
            /\.[^/.]+$/,
            ""
        )
        .replace(
            /[-_]+/g,
            " "
        )
        .replace(
            /\b\w/g,
            function(char){

                return char.toUpperCase();

            }
        );


title.textContent =
    displayName;


document.title =
    displayName;


/* ============================================================
   IMAGE MOVEMENT / ZOOM
============================================================ */

let base =
    1;

let zoom =
    1;

let offsetX =
    0;

let offsetY =
    0;


/*
    Movement modes:

    free       = left/right + up/down
    vertical   = up/down only
    horizontal = left/right only
*/

let movementMode =
    "free";


const zoomLabel =
    document.getElementById(
        "zoom"
    );


const pointers =
    new Map();


let pinchDistance =
    0;

let pinchZoom =
    1;


/* ============================================================
   ZOOM LIMITS
============================================================ */

function clampZoom(){

    if(
        zoom < 0.05
    ){

        zoom =
            0.05;
    }

    if(
        zoom > 50
    ){

        zoom =
            50;
    }
}


/* ============================================================
   DRAW
============================================================ */

function draw(){

    clampZoom();

    img.style.transform =

        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${base * zoom})`;

    zoomLabel.textContent =
        Math.round(
            zoom * 100
        ) + "%";
}


/* ============================================================
   FIT / RESET
============================================================ */

function fit(){

    if(
        !img.naturalWidth
    ){

        return;
    }

    base =
        Math.min(

            viewer.clientWidth /
            img.naturalWidth,

            viewer.clientHeight /
            img.naturalHeight

        );

    zoom =
        1;

    offsetX =
        0;

    offsetY =
        0;

    img.style.transition =
        "transform .22s";

    draw();

    setTimeout(
        () => {

            img.style.transition =
                "";

        },
        220
    );
}


img.onload =
    fit;


window.addEventListener(
    "resize",
    fit
);


/* ============================================================
   ZOOM BUTTONS
============================================================ */

minusButton.onclick =
    () => {

        zoom /=
            1.1;

        draw();

    };


plusButton.onclick =
    () => {

        zoom *=
            1.1;

        draw();

    };


fitButton.onclick =
    fit;


/* ============================================================
   MOVEMENT MODE
============================================================ */

lockButton.onclick =
    () => {

        if(
            movementMode ===
            "free"
        ){

            movementMode =
                "vertical";

            lockButton.textContent =
                "↕ Vertical";

        }else if(
            movementMode ===
            "vertical"
        ){

            movementMode =
                "horizontal";

            lockButton.textContent =
                "↔ Horizontal";

        }else{

            movementMode =
                "free";

            lockButton.textContent =
                "✣ Free";
        }

    };


/* ============================================================
   POINTER DOWN
============================================================ */

viewer.onpointerdown =
    event => {

        viewer.setPointerCapture(
            event.pointerId
        );

        pointers.set(

            event.pointerId,

            {
                x:event.clientX,
                y:event.clientY
            }

        );

        if(
            pointers.size === 2
        ){

            const points =
                [
                    ...pointers.values()
                ];

            pinchDistance =
                Math.hypot(

                    points[0].x -
                    points[1].x,

                    points[0].y -
                    points[1].y

                );

            pinchZoom =
                zoom;
        }

    };


/* ============================================================
   POINTER MOVE
============================================================ */

viewer.onpointermove =
    event => {

        if(
            !pointers.has(
                event.pointerId
            )
        ){

            return;
        }

        const previous =
            pointers.get(
                event.pointerId
            );

        pointers.set(

            event.pointerId,

            {
                x:event.clientX,
                y:event.clientY
            }

        );


        /* ---------- One Finger ---------- */

        if(
            pointers.size === 1
        ){

            const dx =
                event.clientX -
                previous.x;

            const dy =
                event.clientY -
                previous.y;


            if(
                movementMode ===
                "free"
            ){

                offsetX +=
                    dx;

                offsetY +=
                    dy;

            }else if(
                movementMode ===
                "vertical"
            ){

                offsetY +=
                    dy;

            }else if(
                movementMode ===
                "horizontal"
            ){

                offsetX +=
                    dx;
            }

            draw();

            return;
        }


        /* ---------- Two Finger Pinch ---------- */

        const points =
            [
                ...pointers.values()
            ];

        const distance =
            Math.hypot(

                points[0].x -
                points[1].x,

                points[0].y -
                points[1].y

            );

        if(
            !pinchDistance
        ){

            return;
        }

        const oldScale =
            base * zoom;

        zoom =
            pinchZoom *
            (
                distance /
                pinchDistance
            );

        clampZoom();

        const newScale =
            base * zoom;

        const ratio =
            newScale /
            oldScale;

        offsetX *=
            ratio;

        offsetY *=
            ratio;

        pinchDistance =
            distance;

        pinchZoom =
            zoom;

        draw();
    };


/* ============================================================
   POINTER UP
============================================================ */

viewer.onpointerup =
    event => {

        pointers.delete(
            event.pointerId
        );

        if(
            pointers.size < 2
        ){

            pinchDistance =
                0;
        }

    };


/* ============================================================
   POINTER CANCEL
============================================================ */

viewer.onpointercancel =
    event => {

        pointers.delete(
            event.pointerId
        );

        if(
            pointers.size < 2
        ){

            pinchDistance =
                0;
        }

    };


/* ============================================================
   INITIAL DRAW
============================================================ */

draw();

fit();


/* ============================================================
   FULLSCREEN
============================================================ */

document
    .getElementById(
        "fullscreenBtn"
    )
    .onclick =
    async () => {

        menu.style.display =
            "none";

        try{

            if(
                document.fullscreenElement
            ){

                await document.exitFullscreen();

            }else{

                await document.documentElement
                    .requestFullscreen();

            }

        }catch(error){

            console.warn(
                "Fullscreen failed:",
                error
            );

        }

    };


/* ============================================================
   MOUSE WHEEL ZOOM
============================================================ */

viewer.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        const rect =
            viewer.getBoundingClientRect();

        const mouseX =
            event.clientX -
            rect.left -
            rect.width / 2;

        const mouseY =
            event.clientY -
            rect.top -
            rect.height / 2;

        const oldScale =
            base * zoom;

        if(
            event.deltaY < 0
        ){

            zoom *=
                1.12;

        }else{

            zoom /=
                1.12;
        }

        clampZoom();

        const newScale =
            base * zoom;

        const ratio =
            newScale /
            oldScale;

        offsetX =

            mouseX -
            (
                mouseX -
                offsetX
            ) * ratio;

        offsetY =

            mouseY -
            (
                mouseY -
                offsetY
            ) * ratio;

        draw();

    },
    {
        passive:false
    }
);


/* ============================================================
   MENU
============================================================ */

menuButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        menu.style.display =

            menu.style.display ===
            "block"

                ? "none"
                : "block";

    }
);


menu.addEventListener(
    "click",
    event => {

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    event => {

        if(
            menu.contains(
                event.target
            ) ||
            event.target.closest(
                "#menuBtn"
            )
        ){

            return;
        }

        menu.style.display =
            "none";

    }
);


/* ============================================================
   NEW TAB
============================================================ */

document
    .getElementById(
        "newTabBtn"
    )
    .onclick =
    () => {

        menu.style.display =
            "none";

        window.open(
            src,
            "_blank"
        );

    };


/* ============================================================
   DOWNLOAD
============================================================ */

document
    .getElementById(
        "downloadBtn"
    )
    .onclick =
    () => {

        const a =
            document.createElement(
                "a"
            );

        a.href =
            src;

        a.download =
            src
                .split("/")
                .pop();

        document.body.appendChild(
            a
        );

        a.click();

        a.remove();

        menu.style.display =
            "none";

    };


/* ============================================================
   SHARE IMAGE
============================================================ */

document
    .getElementById(
        "shareBtn"
    )
    .addEventListener(
        "click",
        async () => {

            const url =
                window.location.href;

            menu.style.display =
                "none";


            /* Native share */

            if(
                navigator.share
            ){

                try{

                    await navigator.share({

                        title:
                            title.textContent,

                        text:
                            title.textContent,

                        url:
                            url

                    });

                    return;

                }catch(error){

                    if(
                        error &&
                        error.name ===
                        "AbortError"
                    ){

                        return;
                    }

                }
            }


            /* Clipboard fallback */

            if(
                navigator.clipboard &&
                typeof
                navigator.clipboard.writeText ===
                "function"
            ){

                try{

                    await navigator.clipboard.writeText(
                        url
                    );

                    return;

                }catch(error){

                    /* Continue */
                }

            }


            /* Manual fallback */

            window.prompt(
                "Copy this link:",
                url
            );

        }
    );


/* ============================================================
   READING MODE
   Modeled directly after PDF
============================================================ */

let readingMode =
    false;


function setReadingMode(
    enabled
){

    readingMode =
        Boolean(
            enabled
        );


    if(
        readingMode
    ){

        document.body.classList.add(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "×";

        readingModeFloat.title =
            "Exit Reading Mode";

        menu.style.display =
            "none";

    }else{

        document.body.classList.remove(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "▣";

        readingModeFloat.title =
            "Reading Mode";

    }

}


readingModeFloat.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        setReadingMode(
            !readingMode
        );

    }
);


/* ============================================================
   PREVENT MENU FROM OPENING IN READING MODE
============================================================ */

menuButton.addEventListener(
    "click",
    event => {

        if(
            readingMode
        ){

            event.preventDefault();

            return;
        }

    }
);

</script>
