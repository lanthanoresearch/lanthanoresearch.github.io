<!DOCTYPE html>
<html lang="en">
<head>

    <link
        rel="icon"
        type="image/png"
        href="file_000000000c40722f92b1fe6758cb4855.png"
    >

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Advanced Image Viewer</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            width:100%;
            height:100%;
            background:#111;
            color:#eee;
            font-family:Arial,sans-serif;
            overflow:hidden;
        }

        body{
            display:flex;
            flex-direction:column;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header{
            background:#1b1b1b;
            border-bottom:1px solid #333;
            padding:8px;
            flex-shrink:0;
            z-index:20;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
        }


        /* =====================================================
           HEADER BUTTONS
           ===================================================== */

        .headerButton{

            width:42px;
            height:38px;

            padding:0;

            display:flex;

            align-items:center;
            justify-content:center;

            background:#333;

            color:#fff;

            border:1px solid #3d3d3d;

            border-radius:7px;

            text-decoration:none;

            cursor:pointer;

            font-size:20px;

            line-height:1;

            transition:
                background .15s ease,
                border-color .15s ease,
                transform .05s ease;

        }

        .headerButton:hover{
            background:#444;
            border-color:#4a4a4a;
        }

        .headerButton:active{
            transform:scale(.97);
        }


        /* =====================================================
           STANDARD BUTTONS
           ===================================================== */

        .controls{

            display:flex;

            gap:6px;

            flex-wrap:wrap;

            align-items:center;

        }

        .btn{

            appearance:none;
            -webkit-appearance:none;

            background:#333;

            color:#fff;

            border:1px solid #3d3d3d;

            border-radius:7px;

            padding:9px 12px;

            text-decoration:none;

            cursor:pointer;

            font-family:inherit;

            font-size:14px;

            line-height:normal;

            transition:
                background .15s ease,
                border-color .15s ease,
                transform .05s ease;

        }

        .btn:hover{

            background:#444;

            border-color:#4a4a4a;

        }

        .btn:active{

            transform:scale(.97);

        }


        /* =====================================================
           PDF BUTTON
           ===================================================== */

        #pdfButton{
            display:none;
        }


        /* =====================================================
           MENU
           ===================================================== */

        #menu{

            position:absolute;

            right:10px;

            top:58px;

            min-width:220px;

            padding:8px;

            background:#222;

            border:1px solid #3a3a3a;

            border-radius:10px;

            box-shadow:
                0 12px 35px rgba(0,0,0,.45);

            display:none;

            z-index:1000;

        }

        #menu button{

            appearance:none;

            -webkit-appearance:none;

            width:100%;

            margin:3px 0;

            padding:9px 12px;

            text-align:left;

            background:#333;

            color:#fff;

            border:1px solid transparent;

            border-radius:7px;

            cursor:pointer;

            font-family:inherit;

            font-size:14px;

            transition:
                background .15s ease,
                border-color .15s ease;

        }

        #menu button:hover{

            background:#444;

            border-color:#4a4a4a;

        }


        /* =====================================================
           VIEWER
           ===================================================== */

        #viewer{

            flex:1;

            position:relative;

            overflow:hidden;

            min-height:0;

            width:100%;

            touch-action:none;

            background:#111;

        }

        #img{

            position:absolute;

            left:50%;

            top:50%;

            transform-origin:center center;

            max-width:none;

            user-select:none;

            -webkit-user-select:none;

            -webkit-user-drag:none;

        }


        /* =====================================================
           FLOATING READING MODE BUTTON
           ===================================================== */

        .readingModeButton{

            position:absolute;

            right:14px;

            bottom:14px;

            z-index:50;

            width:42px;

            height:42px;

            padding:0;

            display:flex;

            align-items:center;

            justify-content:center;

            background:#333;

            color:#fff;

            border:1px solid #3d3d3d;

            border-radius:7px;

            cursor:pointer;

            font-family:Arial,sans-serif;

            font-size:20px;

            line-height:1;

            box-shadow:
                0 4px 14px rgba(0,0,0,.35);

            transition:
                background .15s ease,
                border-color .15s ease,
                transform .05s ease;

        }

        .readingModeButton:hover{

            background:#444;

            border-color:#4a4a4a;

        }

        .readingModeButton:active{

            transform:scale(.96);

        }


        /* =====================================================
           TITLE
           ===================================================== */

        .title{

            flex-shrink:0;

            padding:12px 18px;

            text-align:center;

            font-weight:bold;

            font-size:1.2rem;

            line-height:1.2;

            white-space:nowrap;

            overflow:hidden;

            text-overflow:ellipsis;

            background:rgba(24,24,24,.94);

            border-top:1px solid #333;

            backdrop-filter:blur(6px);

            -webkit-backdrop-filter:blur(6px);

        }


        /* =====================================================
           ZOOM BAR
           ===================================================== */

        #zoomBar{

            flex-shrink:0;

            display:flex;

            justify-content:center;

            align-items:center;

            gap:8px;

            padding:8px;

            background:#181818;

            border-top:1px solid #262626;

        }

        #zoom{

            display:flex;

            align-items:center;

            justify-content:center;

            position:relative;

            top:2px;

            min-width:60px;

            padding:0 2px;

            font-size:14px;

        }


        /* =====================================================
           READING MODE
           ===================================================== */

        body.readMode header,
        body.readMode .title,
        body.readMode #zoomBar{

            display:none;

        }


        body.readMode #viewer{

            flex:1;

            width:100%;

            height:100%;

        }


        /*
            The Reading Mode button deliberately
            remains visible while Reading Mode
            is active.
        */

        body.readMode .readingModeButton{

            display:flex;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media(max-width:700px){

            header{
                padding:7px;
            }

            .top{
                align-items:flex-start;
            }

            .headerButton{

                width:42px;

                height:38px;

            }

            .controls .btn{

                padding:8px 10px;

                font-size:.9rem;

            }

            .title{

                font-size:1.2rem;

                padding:10px 14px;

            }

            #zoomBar{

                gap:6px;

                padding:7px;

            }

            #zoomBar .btn{

                padding:8px 10px;

            }

            #menu{

                top:54px;

                right:8px;

                min-width:210px;

            }

            .readingModeButton{

                right:10px;

                bottom:10px;

                width:42px;

                height:42px;

            }

        }

    </style>

</head>


<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<header>

    <div class="top">

        <a
            class="headerButton"
            id="homeButton"
            href="index.html"
            aria-label="Back"
            title="Back"
        >
            ☰
        </a>


        <div class="controls">

            <a
                class="btn"
                id="pdfButton"
                target="_blank"
                rel="noopener"
            >
                PDF
            </a>


            <button
                class="headerButton"
                id="menuBtn"
                type="button"
                aria-label="Menu"
                title="Menu"
            >
                ☰
            </button>

        </div>

    </div>

</header>


<!-- =======================================================
     MENU
     ======================================================= -->

<div id="menu">

    <button
        id="downloadBtn"
        type="button"
    >
        Download Image
    </button>


    <button
        id="newTabBtn"
        type="button"
    >
        Open in New Tab
    </button>


    <button
        id="shareBtn"
        type="button"
    >
        Share Image
    </button>


    <button
        id="fullscreenBtn"
        type="button"
    >
        Fullscreen
    </button>

</div>


<!-- =======================================================
     IMAGE VIEWER
     ======================================================= -->

<div id="viewer">

    <img
        id="img"
        alt=""
    >


    <!-- Floating Read Mode control -->

    <button
        class="readingModeButton"
        id="readModeBtn"
        type="button"
        aria-label="Reading Mode"
        title="Reading Mode"
    >
        ◉
    </button>

</div>


<!-- =======================================================
     FILE NAME
     ======================================================= -->

<div
    class="title"
    id="title"
>
    Loading...
</div>


<!-- =======================================================
     ZOOM CONTROLS
     ======================================================= -->

<div id="zoomBar">

    <button
        class="btn"
        id="minus"
        type="button"
        aria-label="Zoom out"
        title="Zoom out"
    >
        −
    </button>


    <div id="zoom">
        100%
    </div>


    <button
        class="btn"
        id="plus"
        type="button"
        aria-label="Zoom in"
        title="Zoom in"
    >
        +
    </button>


    <button
        class="btn"
        id="fit"
        type="button"
    >
        Reset
    </button>


    <button
        class="btn"
        id="lock"
        type="button"
    >
        ✣ Free
    </button>

</div>


<script>


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const p =
    new URLSearchParams(
        location.search
    );


const img =
    document.getElementById(
        "img"
    );


const viewer =
    document.getElementById(
        "viewer"
    );


const title =
    document.getElementById(
        "title"
    );


const fitButton =
    document.getElementById(
        "fit"
    );


const lockButton =
    document.getElementById(
        "lock"
    );


const minusButton =
    document.getElementById(
        "minus"
    );


const plusButton =
    document.getElementById(
        "plus"
    );


const menu =
    document.getElementById(
        "menu"
    );


const menuButton =
    document.getElementById(
        "menuBtn"
    );


const readModeButton =
    document.getElementById(
        "readModeBtn"
    );


const src =
    decodeURIComponent(
        p.get("image") || ""
    );


const returnPage =
    decodeURIComponent(
        p.get("return") ||
        "index.html"
    );


/* =========================================================
   BACK BUTTON
   ========================================================= */

const homeButton =
    document.getElementById(
        "homeButton"
    );


homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();


        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );


        location.href =
            returnPage;

    }
);


/* =========================================================
   FIND PDF
   ========================================================= */

fetch("descriptions.json")
.then(
    r => r.json()
)
.then(
    data => {

        let paper = null;


        Object.values(data).forEach(
            p => {

                if(!p.images)
                    return;


                if(
                    p.images.includes(src)
                ){

                    paper = p;

                }

            }
        );


        if(!paper)
            return;


        document.getElementById(
            "pdfButton"
        ).href =
            paper.url;

    }
);


/* =========================================================
   IMAGE
   ========================================================= */

img.src =
    src;


const filename =
    src
        .split("/")
        .pop();


const displayName =
    filename
        .replace(
            /\.[^/.]+$/,
            ""
        )
        .replace(
            /[-_]+/g,
            " "
        )
        .replace(
            /\b\w/g,
            function(char){

                return char.toUpperCase();

            }
        );


title.textContent =
    displayName;


document.title =
    displayName;


/* =========================================================
   MOVEMENT / ZOOM
   ========================================================= */

let base = 1;

let zoom = 1;

let offsetX = 0;

let offsetY = 0;


let movementMode =
    "free";


const zoomLabel =
    document.getElementById(
        "zoom"
    );


const pointers =
    new Map();


let pinchDistance = 0;

let pinchZoom = 1;


/* =========================================================
   ZOOM LIMITS
   ========================================================= */

function clampZoom(){

    if(zoom < 0.05){

        zoom = 0.05;

    }


    if(zoom > 50){

        zoom = 50;

    }

}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

    clampZoom();


    img.style.transform =

        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${base * zoom})`;


    zoomLabel.textContent =
        Math.round(
            zoom * 100
        ) + "%";

}


/* =========================================================
   FIT / RESET
   ========================================================= */

function fit(){

    if(!img.naturalWidth)
        return;


    base = Math.min(

        viewer.clientWidth /
        img.naturalWidth,

        viewer.clientHeight /
        img.naturalHeight

    );


    zoom = 1;


    offsetX = 0;

    offsetY = 0;


    img.style.transition =
        "transform .22s";


    draw();


    setTimeout(
        () => {

            img.style.transition =
                "";

        },
        220
    );

}


img.onload =
    fit;


window.addEventListener(
    "resize",
    fit
);


/* =========================================================
   ZOOM BUTTONS
   ========================================================= */

minusButton.onclick =
    () => {

        zoom /= 1.1;

        draw();

    };


plusButton.onclick =
    () => {

        zoom *= 1.1;

        draw();

    };


fitButton.onclick =
    fit;


/* =========================================================
   MOVEMENT MODE
   ========================================================= */

lockButton.onclick =
    () => {

        if(
            movementMode ===
            "free"
        ){

            movementMode =
                "vertical";


            lockButton.textContent =
                "↕ Vertical";


        }else if(
            movementMode ===
            "vertical"
        ){

            movementMode =
                "horizontal";


            lockButton.textContent =
                "↔ Horizontal";


        }else{

            movementMode =
                "free";


            lockButton.textContent =
                "✣ Free";

        }

    };


/* =========================================================
   READING MODE
   ========================================================= */

let readMode = false;


/*
    The floating button is always available.

    Normal:
        ◉

    Reading Mode:
        ×
*/

function enterReadMode(){

    readMode = true;


    document.body.classList.add(
        "readMode"
    );


    readModeButton.textContent =
        "×";


    readModeButton.setAttribute(
        "aria-label",
        "Exit Reading Mode"
    );


    readModeButton.setAttribute(
        "title",
        "Exit Reading Mode"
    );


    menu.style.display =
        "none";

}


function exitReadMode(){

    readMode = false;


    document.body.classList.remove(
        "readMode"
    );


    readModeButton.textContent =
        "◉";


    readModeButton.setAttribute(
        "aria-label",
        "Reading Mode"
    );


    readModeButton.setAttribute(
        "title",
        "Reading Mode"
    );

}


readModeButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();


        if(readMode){

            exitReadMode();

        }else{

            enterReadMode();

        }

    }
);


/* =========================================================
   POINTER EVENTS
   ========================================================= */


/* ---------- Pointer Down ---------- */

viewer.onpointerdown =
    e => {

        /*
            Do not treat the Reading button
            as an image interaction.
        */

        if(
            e.target ===
            readModeButton
        ){

            return;

        }


        viewer.setPointerCapture(
            e.pointerId
        );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        if(
            pointers.size === 2
        ){

            const pts =
                [...pointers.values()];


            pinchDistance =
                Math.hypot(

                    pts[0].x -
                    pts[1].x,

                    pts[0].y -
                    pts[1].y

                );


            pinchZoom =
                zoom;

        }

    };


/* ---------- Pointer Move ---------- */

viewer.onpointermove =
    e => {

        if(
            !pointers.has(
                e.pointerId
            )
        ){

            return;

        }


        const previous =
            pointers.get(
                e.pointerId
            );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        /* ---------- One Finger ---------- */

        if(
            pointers.size === 1
        ){

            const dx =
                e.clientX -
                previous.x;


            const dy =
                e.clientY -
                previous.y;


            if(
                movementMode ===
                "free"
            ){

                offsetX += dx;

                offsetY += dy;


            }else if(
                movementMode ===
                "vertical"
            ){

                offsetY += dy;


            }else if(
                movementMode ===
                "horizontal"
            ){

                offsetX += dx;

            }


            draw();


            return;

        }


        /* ---------- Two Finger Pinch ---------- */

        if(
            pinchDistance <= 0
        ){

            return;

        }


        const pts =
            [...pointers.values()];


        const distance =
            Math.hypot(

                pts[0].x -
                pts[1].x,

                pts[0].y -
                pts[1].y

            );


        const oldScale =
            base * zoom;


        zoom =
            pinchZoom *
            (
                distance /
                pinchDistance
            );


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX *= ratio;

        offsetY *= ratio;


        pinchDistance =
            distance;


        pinchZoom =
            zoom;


        draw();

    };


/* ---------- Pointer Up ---------- */

viewer.onpointerup =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(
            pointers.size < 2
        ){

            pinchDistance = 0;

        }

    };


/* ---------- Pointer Cancel ---------- */

viewer.onpointercancel =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(
            pointers.size < 2
        ){

            pinchDistance = 0;

        }

    };


/* =========================================================
   INITIAL DRAW
   ========================================================= */

draw();

fit();


/* =========================================================
   FULLSCREEN
   ========================================================= */

document
    .getElementById(
        "fullscreenBtn"
    )
    .onclick =
    () => {

        menu.style.display =
            "none";


        if(
            document.fullscreenElement
        ){

            document.exitFullscreen();

        }else{

            document.documentElement
                .requestFullscreen();

        }

    };


/* =========================================================
   MOUSE WHEEL ZOOM
   ========================================================= */

viewer.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;


        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;


        const oldScale =
            base * zoom;


        if(
            e.deltaY < 0
        ){

            zoom *= 1.12;

        }else{

            zoom /= 1.12;

        }


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX =

            mouseX -
            (
                mouseX -
                offsetX
            ) * ratio;


        offsetY =

            mouseY -
            (
                mouseY -
                offsetY
            ) * ratio;


        draw();

    },
    {
        passive:false
    }
);


/* =========================================================
   MENU
   ========================================================= */

menuButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();


        menu.style.display =

            menu.style.display ===
            "block"

                ? "none"
                : "block";

    }
);


menu.addEventListener(
    "click",
    e => {

        e.stopPropagation();

    }
);


document.addEventListener(
    "click",
    () => {

        menu.style.display =
            "none";

    }
);


/* =========================================================
   NEW TAB
   ========================================================= */

document
    .getElementById(
        "newTabBtn"
    )
    .onclick =
    () => {

        menu.style.display =
            "none";


        window.open(
            src,
            "_blank"
        );

    };


/* =========================================================
   DOWNLOAD
   ========================================================= */

document
    .getElementById(
        "downloadBtn"
    )
    .onclick =
    () => {

        const a =
            document.createElement(
                "a"
            );


        a.href =
            src;


        a.download =
            src.split("/")
                .pop();


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        menu.style.display =
            "none";

    };


/* =========================================================
   SHARE IMAGE
   ========================================================= */

document
    .getElementById(
        "shareBtn"
    )
    .addEventListener(
        "click",
        async () => {

            const url =
                window.location.href;


            menu.style.display =
                "none";


            /* ---------- Native Share ---------- */

            if(
                navigator.share
            ){

                try{

                    await navigator.share({

                        title:
                            title.textContent,

                        text:
                            title.textContent,

                        url:
                            url

                    });


                    return;

                }catch(err){

                    if(
                        err &&
                        err.name ===
                        "AbortError"
                    ){

                        return;

                    }

                }

            }


            /* ---------- Clipboard ---------- */

            if(
                navigator.clipboard &&
                typeof navigator.clipboard.writeText ===
                "function"
            ){

                try{

                    await navigator.clipboard.writeText(
                        url
                    );


                    return;

                }catch(err){

                    /* Continue */

                }

            }


            /* ---------- Manual Fallback ---------- */

            window.prompt(
                "Copy this link:",
                url
            );

        }
    );


</script>

</body>
</html>
