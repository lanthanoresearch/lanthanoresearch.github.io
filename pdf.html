// detection could previously miss an entire table outright on a
// PDF that happens to use the second.
function isTableLikeLine(row){

  const items = row.filter(item => item.str && item.str.trim());

  if(items.length < 1){
    return false;
  }

  const avgCharWidth = estimateAvgCharWidth(row) || 5;
  const gapThreshold = Math.max(avgCharWidth * 3, 12);

  let bigGaps = 0;

  for(let i = 0; i < items.length - 1; i++){

    const a = items[i];
    const b = items[i + 1];

    const aEnd = a.transform[4] + (a.width || 0);
    const bStart = b.transform[4];

    if((bStart - aEnd) > gapThreshold){
      bigGaps++;
    }
  }

  for(const item of items){
    const runs = item.str.match(/ {3,}/g);
    if(runs){
      bigGaps += runs.length;
    }
  }

  if(bigGaps >= 2){
    return true;
  }

  if(bigGaps === 1){

    const joined = items.map(item => item.str).join(" ");
    const digitCount = (joined.match(/\d/g) || []).length;
    const letterCount = joined.replace(/[^A-Za-z]/g, "").length;

    if(digitCount >= 2 && digitCount >= letterCount){
      return true;
    }
  }

  return false;
}

// The page's single most common row-starting X position - its
// "main column" margin. Ordinary body text almost always starts
// flush against this; a run of rows starting well to the right of
// it is a strong sign of a second (or third, fourth...) column
// running in parallel, like a side-by-side comparison table.
function dominantLeftMargin(rows){

  const counts = new Map();

  for(const row of rows){

    const items = row.filter(item => item.str && item.str.trim());

    if(!items.length){
      continue;
    }

    const x = Math.round(items[0].transform[4] / 4) * 4;

    counts.set(x, (counts.get(x) || 0) + 1);
  }

  let best = null;
  let bestCount = -1;

  for(const [x, count] of counts){
    if(count > bestCount){
      bestCount = count;
      best = x;
    }
  }

  return best === null ? 72 : best;
}

// A stricter relative of isTableLikeLine: 3+ short chunks with real
// gaps between every one of them - the shape of a column-header row
// like "KJV    LOCATION    NIV    WRONG IN", not just any one line
// that happens to have a gap in it somewhere.
function isStrongTableHeader(row){

  const items = row.filter(item => item.str && item.str.trim());

  if(items.length < 3){
    return false;
  }

  const avgCharWidth = estimateAvgCharWidth(row) || 5;
  const gapThreshold = Math.max(avgCharWidth * 3, 12);

  let gaps = 0;

  for(let i = 0; i < items.length - 1; i++){

    const a = items[i];
    const b = items[i + 1];

    const aEnd = a.transform[4] + (a.width || 0);
    const bStart = b.transform[4];

    if((bStart - aEnd) > gapThreshold){
      gaps++;
    }
  }

  const totalChars = items.reduce((sum, item) => sum + item.str.trim().length, 0);

  return gaps >= 2 && totalChars < 80;
}

function rowHasBigGap(row){

  const items = row.filter(item => item.str && item.str.trim());

  if(items.length < 2){
    return false;
  }

  const avgCharWidth = estimateAvgCharWidth(row) || 5;
  const gapThreshold = Math.max(avgCharWidth * 3, 12);

  for(let i = 0; i < items.length - 1; i++){

    const a = items[i];
    const b = items[i + 1];

    const aEnd = a.transform[4] + (a.width || 0);
    const bStart = b.transform[4];

    if((bStart - aEnd) > gapThreshold){
      return true;
    }
  }

  return false;
}

// Whether a row marks a genuine return to normal, single-column
// prose after a multi-column block - either a full-width paragraph
// line starting back at the page's main margin with no more
// mid-line gaps, or a short ALL-CAPS section heading in the same
// position (a table is just as often followed immediately by a new
// heading as by a resumed paragraph).
function looksLikeResumedProse(row, margin){

  const items = row.filter(item => item.str && item.str.trim());

  if(!items.length){
    return false;
  }

  const x = items[0].transform[4];

  if(Math.abs(x - margin) > 20){
    return false;
  }

  if(rowHasBigGap(row)){
    return false;
  }

  const text = items.map(item => item.str).join(" ");
  const letters = text.replace(/[^A-Za-z]/g, "");
  const isHeadingLike = letters.length >= 3 && text === text.toUpperCase() && text !== text.toLowerCase();

  if(isHeadingLike){
    return true;
  }

  const last = items[items.length - 1];
  const span = (last.transform[4] + (last.width || 0)) - x;

  return span > 200;
}

// Smooths raw per-row table flags into runs, and separately folds
// in wrapped, side-by-side comparison blocks - a real, common table
// shape isTableLikeLine alone can't see, since it judges one row at
// a time and a comparison table's *body* rows, each column wrapping
// independently, rarely land on a shared y-position or look tabular
// on their own. Only the occasional column-header row does. So:
//
// 1. Same-row tables (e.g. "Revenue    $4.2M    $3.1M"): a single
//    stray row that happens to look tabular (e.g. a two-column
//    running head) is not, by itself, a table - only a run of 2+
//    consecutive table-like rows is treated as one, so ordinary
//    prose is never mistakenly swallowed.
// 2. Wrapped comparison blocks: once a strong header row is found,
//    everything through the next resumed-prose row (see
//    looksLikeResumedProse) is folded in too, even though most of
//    those in-between rows don't look tabular in isolation - a
//    wrapped side-by-side block otherwise reads as scattered,
//    out-of-order fragments if read at all.
function detectTableRuns(rows){

  const raw = rows.map(isTableLikeLine);
  const inTable = raw.slice();

  let i = 0;

  while(i < raw.length){

    if(!raw[i]){
      i++;
      continue;
    }

    let j = i;

    while(j < raw.length && raw[j]){
      j++;
    }

    if(j - i < 2){
      for(let k = i; k < j; k++){
        inTable[k] = false;
      }
    }

    i = j;
  }

  const margin = dominantLeftMargin(rows);

  for(let idx = 0; idx < rows.length; idx++){

    if(inTable[idx]){
      continue;
    }

    if(!isStrongTableHeader(rows[idx])){
      continue;
    }

    inTable[idx] = true;

    let k = idx + 1;

    while(k < rows.length && !looksLikeResumedProse(rows[k], margin)){
      inTable[k] = true;
      k++;
    }

    idx = k - 1;
  }

  return inTable;
}

function lineRepresentativeY(line){

  let sum = 0;
  let count = 0;

  for(const item of line){
    if(item.str && item.str.trim()){
      sum += item.transform[5];
      count++;
    }
  }

  return count > 0 ? sum / count : null;
}

// Bridges the two independent groupings: buildReadableBlocks walks
// pdf.js's hasEOL-based `lines`, but table detection runs on
// y-clustered `rows` (see groupIntoRows above for why). For each
// line, finds the row sitting at essentially the same y-position and
// carries that row's table flag over to it - so a line that's only
// one fragment of a multi-cell row still gets correctly skipped.
function mapTableFlagsToLines(lines, rows, rowFlags){

  return lines.map(line => {

    const y = lineRepresentativeY(line);

    if(y === null){
      return false;
    }

    let bestIndex = -1;
    let bestDist = Infinity;

    for(let i = 0; i < rows.length; i++){

      const rowY = rows[i][0]?.transform?.[5];

      if(typeof rowY !== "number"){
        continue;
      }

      const dist = Math.abs(rowY - y);

      if(dist < bestDist){
        bestDist = dist;
        bestIndex = i;
      }
    }

    if(bestIndex === -1){
      return false;
    }

    const size = itemFontSize(rows[bestIndex][0]) || 10;

    if(bestDist > size * 0.85){
      return false;
    }

    return rowFlags[bestIndex];
  });
}

function dominantFontSize(lines){

  const counts = new Map();

  for(const line of lines){
    for(const item of line){

      const size = Math.round(itemFontSize(item) * 2) / 2;
      const weight = (item.str || "").trim().length || 1;

      counts.set(size, (counts.get(size) || 0) + weight);
    }
  }

  let bestSize = 12;
  let bestWeight = -1;

  for(const [size, weight] of counts){
    if(weight > bestWeight){
      bestWeight = weight;
      bestSize = size;
    }
  }

  return bestSize || 12;
}

function lineIsItalic(line, styles){

  let italicChars = 0;
  let totalChars = 0;

  for(const item of line){

    const length = (item.str || "").trim().length;

    if(!length){
      continue;
    }

    totalChars += length;

    if(isItalicFont(item.fontName, styles)){
      italicChars += length;
    }
  }

  return totalChars > 0 && (italicChars / totalChars) > 0.6;
}

/* ------------------------------------------------------------
   CHARACTER-MAPPED TEXT CLEANUP

   Everything below builds the spoken text for a line alongside a
   same-length `map` array where map[i] is the character's offset
   in that line's original, uncleaned text (`rawLine`). Dropped
   characters (citation marks) simply have no entry; a
   multi-character replacement like "link" maps every one of its
   characters back to where the original URL started. That map is
   what makes it possible to trace a spoken word back to an exact
   spot in the PDF for highlighting.
------------------------------------------------------------ */

function appendMapped(state, raw){

  for(let k = 0; k < raw.length; k++){

    const ch = raw[k];
    const isSpace = ch === " " || ch === "\t" || ch === "\u00a0";

    if(isSpace){

      if(state.text.length === 0 || state.text[state.text.length - 1] === " "){
        state.rawLine += ch;
        state.rawCursor++;
        continue;
      }

      state.text += " ";
      state.map.push(state.rawCursor);
      state.rawLine += ch;
      state.rawCursor++;
      continue;
    }

    state.text += ch;
    state.map.push(state.rawCursor);
    state.rawLine += ch;
    state.rawCursor++;
  }
}

// Builds the (text, map, rawLine) triple for one visual line,
// dropping small glued-on citation marks as it goes.
function cleanLineMapped(line, bodySize){

  const state = { text:"", map:[], rawLine:"", rawCursor:0 };

  for(const item of line){

    const raw = item.str;

    if(!raw){
      continue;
    }

    const trimmed = raw.trim();
    const isSmall = itemFontSize(item) < bodySize * 0.82;
    const isCitation = isSmall && trimmed && trimmed.length <= 5 && CITATION_MARK_RE.test(trimmed);

    if(isCitation){
      state.rawLine += raw;
      state.rawCursor += raw.length;
      continue;
    }

    appendMapped(state, raw);
  }

  let start = 0;
  let end = state.text.length;

  while(start < end && state.text[start] === " "){
    start++;
  }
  while(end > start && state.text[end - 1] === " "){
    end--;
  }

  return {
    text: state.text.slice(start, end),
    map: state.map.slice(start, end),
    rawLine: state.rawLine
  };
}

function trimMappedStart(text, map, re){
  const match = text.match(re);
  if(match && match.index === 0){
    const cut = match[0].length;
    return { text: text.slice(cut), map: map.slice(cut) };
  }
  return { text, map };
}

function trimMappedEnd(text, map, re){
  const match = text.match(re);
  if(match){
    return { text: text.slice(0, match.index), map: map.slice(0, match.index) };
  }
  return { text, map };
}

// "1. Text" -> "1 Text", "a) Text" -> "a Text": removes just the
// single punctuation character off a numbered/lettered list marker
// at the start of a line, keeping the number or letter itself as
// real spoken content (dropping it entirely, the way a decorative
// bullet glyph is, would lose real information - "1", "2", "3" is
// exactly what tells a list apart from plain paragraphs). Left
// untouched if the line doesn't start with one of these markers.
function stripListMarkerPunctuation(text, map){

  const match = text.match(LIST_MARKER_RE);

  if(!match){
    return { text, map };
  }

  const punctIndex = match[1].length;

  return {
    text: text.slice(0, punctIndex) + text.slice(punctIndex + 1),
    map: map.slice(0, punctIndex).concat(map.slice(punctIndex + 1))
  };
}

// Replaces every URL/email in a mapped (text, map) pair with the
// spoken word "link". The replacement text has no source
// characters of its own, so every character of "link" maps back
// to wherever the original URL started.
function replaceLinksMapped(text, map){

  const spans = [];

  for(const re of [URL_RE, WWW_RE, EMAIL_RE]){

    re.lastIndex = 0;

    let match;

    while((match = re.exec(text))){

      spans.push({ start: match.index, end: match.index + match[0].length });

      if(match[0].length === 0){
        re.lastIndex++;
      }
    }
  }

  if(!spans.length){
    return { text, map };
  }

  spans.sort((a, b) => a.start - b.start);

  const merged = [];

  for(const span of spans){
    const last = merged[merged.length - 1];
    if(last && span.start <= last.end){
      last.end = Math.max(last.end, span.end);
    }else{
      merged.push({ ...span });
    }
  }

  let newText = "";
  const newMap = [];
  let cursor = 0;

  for(const span of merged){

    newText += text.slice(cursor, span.start);
    for(let i = cursor; i < span.start; i++){
      newMap.push(map[i]);
    }

    const anchor = map[span.start] ?? map[cursor] ?? 0;
    const word = "link";

    newText += word;
    for(let i = 0; i < word.length; i++){
      newMap.push(anchor);
    }

    cursor = span.end;
  }

  newText += text.slice(cursor);
  for(let i = cursor; i < text.length; i++){
    newMap.push(map[i]);
  }

  return { text: newText, map: newMap };
}

// Turns one page's raw text items into an ordered list of
// speakable blocks: { type:"heading"|"line", text, map, rawLine }.
// "line" here means one original visual line of the PDF - reading
// at that granularity (rather than merging wrapped lines into
// paragraphs) is what lets the highlight track the exact line
// currently being spoken.
function buildReadableBlocks(textContent){

  const items = (textContent && textContent.items) || [];
  const styles = (textContent && textContent.styles) || {};

  if(!items.length){
    return [];
  }

  const lines = groupIntoLines(items);
  const bodySize = dominantFontSize(lines);

  let inTable = null;

  if(skipTables){
    const rows = groupIntoRows(items);
    const rowFlags = detectTableRuns(rows);
    inTable = mapTableFlagsToLines(lines, rows, rowFlags);
  }

  // Precomputes, for every line, whether it's really just more of
  // a link that started on an earlier line and happened to wrap -
  // propagated forward so a link spanning three or more visual
  // lines is still recognized all the way through, not just once.
  // A continuation line has its leading fragment silently absorbed
  // below rather than read aloud as garbled leftover text; the
  // single "link" spoken for the line the URL actually started on
  // already covers the whole thing.
  const rawLineTexts = lines.map(line => line.map(item => item.str).join(""));
  const lineContinuesLink = new Array(lines.length).fill(false);

  {
    let open = false;

    for(let i = 0; i < rawLineTexts.length; i++){

      const raw = rawLineTexts[i];
      const trimmedEnd = raw.replace(/\s+$/, "");

      if(open){
        lineContinuesLink[i] = true;
      }

      const startsFreshOpenUrl = OPEN_URL_TAIL_RE.test(trimmedEnd);
      const noWhitespaceAtAll = trimmedEnd.length > 0 && !/\s/.test(trimmedEnd);

      open = startsFreshOpenUrl || (open && noWhitespaceAtAll);
    }
  }

  const blocks = [];

  for(let lineIndex = 0; lineIndex < lines.length; lineIndex++){

    const line = lines[lineIndex];

    if(inTable && inTable[lineIndex]){
      continue;
    }

    const rawJoined = rawLineTexts[lineIndex].trim();

    // A line that's nothing but digits (with maybe one stray
    // leading letter) is either a page number or a lone footnote
    // mark sitting on its own line - skip it either way. A line
    // that's nothing but a decorative bullet glyph (a bullet PDFs
    // often position as its own separate text run, apart from the
    // list item's actual text) is skipped the same way.
    if(rawJoined.length <= 5 && BARE_NUMBER_LINE_RE.test(rawJoined)){
      continue;
    }

    if(BULLET_ONLY_LINE_RE.test(rawJoined)){
      continue;
    }

    let { text, map, rawLine } = cleanLineMapped(line, bodySize);

    if(!text){
      continue;
    }

    // A line whose bullet glyph and text arrived as one combined
    // run - strip just the glyph, not the text after it. A
    // numbered/lettered marker instead keeps its number but loses
    // the "." or ")" - see stripListMarkerPunctuation for why.
    ({ text, map } = trimMappedStart(text, map, BULLET_PREFIX_RE));
    ({ text, map } = stripListMarkerPunctuation(text, map));

    // This line is really just the tail end of a link that started
    // on an earlier line - absorb its leading fragment (silently;
    // the "link" spoken for that earlier line already covers it)
    // rather than reading it as leftover text.
    if(lineContinuesLink[lineIndex]){

      const contMatch = text.match(URL_CONTINUATION_TOKEN_RE);

      if(contMatch){
        const cut = contMatch[0].length;
        text = text.slice(cut);
        map = map.slice(cut);
        ({ text, map } = trimMappedStart(text, map, /^\s+/));
      }
    }

    if(!text){
      continue;
    }

    ({ text, map } = trimMappedStart(text, map, BRACKET_CITE_RE));
    ({ text, map } = trimMappedEnd(text, map, DOT_LEADER_RE));
    ({ text, map } = trimMappedStart(text, map, /^\s+/));
    ({ text, map } = trimMappedEnd(text, map, /\s+$/));

    if(!text){
      continue;
    }

    ({ text, map } = replaceLinksMapped(text, map));

    const wordCount = text.split(/\s+/).filter(Boolean).length;
    const letters = text.replace(/[^A-Za-z]/g, "");
    const isAllCaps = letters.length >= 3 && text === text.toUpperCase() && text !== text.toLowerCase();
    const isBigFont = dominantFontSize([line]) >= bodySize * 1.15;
    const endsLikeSentence = /[.!?]["')\]]?$/.test(text);

    if(wordCount <= 12 && (isAllCaps || isBigFont) && !endsLikeSentence){
      blocks.push({ type:"heading", text, map, rawLine });
      continue;
    }

    // A short, mostly-italic line standing alone reads as an
    // image caption in most papers - skip it rather than read it.
    if(wordCount <= 10 && lineIsItalic(line, styles)){
      continue;
    }

    blocks.push({ type:"line", text, map, rawLine });
  }

  return blocks;
}

function endsSentence(text){
  return /[.!?]["'\u2019\u201d)\]]*$/.test(text.trim());
}

// Merges consecutive "line" blocks - each one visual line of the
// PDF - into paragraph-sized speech units, so playback only pauses
// at real sentence punctuation and never just because the PDF
// happened to wrap a line. Headings stay their own unit so the
// existing heading lead-in pause is untouched. Each unit keeps a
// `segments` list recording exactly where each original line's text
// landed inside the unit's combined text, so highlighting can still
// track the precise source line (and word) as speech moves through
// it, even though several original lines are now spoken as one
// utterance. A generous length/line cap forces a break even
// without punctuation, both as a safety net against runaway merges
// and to avoid reintroducing the old very-long-utterance stall bug.
function groupBlocksForSpeech(blocks){

  const units = [];
  let current = null;

  function flush(){
    if(current && current.segments.length){
      units.push(current);
    }
    current = null;
  }

  for(const block of blocks){

    if(block.type === "heading"){
      flush();
      units.push({
        type:"heading",
        text: block.text,
        segments:[{ block, start:0, end: block.text.length }]
      });
      continue;
    }

    if(!current){
      current = { type:"paragraph", text:"", segments:[] };
    }

    const sep = current.text.length > 0 ? " " : "";
    const start = current.text.length + sep.length;

    current.text += sep + block.text;

    const end = current.text.length;

    current.segments.push({ block, start, end });

    const tooLong = current.text.length > 600 || current.segments.length >= 8;

    if(endsSentence(block.text) || tooLong){
      flush();
    }
  }

  flush();

  return units;
}

/* ------------------------------------------------------------
   READING STATE

   currentToken (not a boolean) is what lets an intentionally
   cancelled utterance's "end" event be told apart from a real
   one: every utterance gets its own token, and its onend/onerror
   only act if that token is still the current one. That stays
   correct however cancel() happens to behave (some browsers fire
   "end" on a cancelled utterance, some don't).
------------------------------------------------------------ */

const reading = {
  active:false,
  paused:false,
  pageNumber:1,
  blocks:[],
  blockIndex:0,
  // Which segment (original PDF line) within the current unit is
  // being spoken/should be resumed from - lets a voice/speed
  // change or a watchdog retry pick back up from where playback
  // actually was instead of restarting the whole paragraph from its
  // first line. skipSection() always resets this to 0, since it
  // deliberately jumps by whole paragraph/heading, not by line.
  segmentIndex:0,
  generation:0,
  gapTimer:null,
  currentToken:0,
  lastProgressAt:0
};

let utteranceToken = 0;

const READ_RATE_STEPS = [0.5, 0.75, 1, 1.1, 1.2, 1.25, 1.3, 1.4, 1.5, 2, 2.5, 3];
const READ_RATE_LABELS = ["0.5×", "0.75×", "1.0×", "1.1×", "1.2×", "1.25×", "1.3×", "1.4×", "1.5×", "2.0×", "2.5×", "3.0×"];
let readRateIndex = 2;

// Restore a previously saved speed/voice, if any, before anything
// else touches these values.
{
  const savedPrefs = loadReadAloudPrefs();

  if(savedPrefs){

    if(Number.isInteger(savedPrefs.rateIndex) && READ_RATE_STEPS[savedPrefs.rateIndex] !== undefined){
      readRateIndex = savedPrefs.rateIndex;
    }

    if(typeof savedPrefs.voiceURI === "string" && savedPrefs.voiceURI){
      selectedVoiceURI = savedPrefs.voiceURI;
    }

    if(typeof savedPrefs.skipTables === "boolean"){
      skipTables = savedPrefs.skipTables;
    }
  }
}

function currentReadRate(){
  return READ_RATE_STEPS[readRateIndex];
}

function describeVoice(voice){

  if(!voice){
    return "Default";
  }

  return voice.lang ? `${voice.name} (${voice.lang})` : voice.name;
}

// Reflects the current speed/voice as active (checked) rows
// whenever either list is already built - called after every
// change so the two lists and the status line never drift out of
// sync with the actual selection.
function refreshSettingsSelection(){

  for(const button of readAloudSpeedList.children){
    const active = Number(button.dataset.index) === readRateIndex;
    button.classList.toggle("active", active);
    button.setAttribute("aria-checked", active ? "true" : "false");
  }

  for(const button of readAloudVoiceList.children){
    if(button.dataset.voiceUri === undefined){
      continue;
    }
    const active = button.dataset.voiceUri === (selectedVoiceURI || "");
    button.classList.toggle("active", active);
    button.setAttribute("aria-checked", active ? "true" : "false");
  }

  for(const button of readAloudOptionsList.children){
    if(button.dataset.option !== "skipTables"){
      continue;
    }
    button.classList.toggle("active", skipTables);
    button.setAttribute("aria-checked", skipTables ? "true" : "false");
  }

  updateReadAloudUI();
}

// `dataset` lets each row carry whatever identifying data(-index,
// -voiceUri, -option) refreshSettingsSelection() needs later to
// find it again and re-check its active state - every row must set
// one, or it silently stops following along after the first change
// (this was previously missing for the Speed rows entirely, and for
// the Voice list's "Default" row, which is why selection used to
// look right only until the first tap).
// `liveRestart`, unless explicitly set to false, restarts whatever
// is currently being spoken right away so a speed/voice change is
// heard immediately rather than only on the next line - callers
// that need a different live-apply behavior (like Skip Tables,
// which rebuilds the page instead) pass liveRestart:false and do
// their own live-apply inside onSelect.
function optionRow({ label, active, dataset, role, liveRestart, onSelect }){

  const button = document.createElement("button");

  button.type = "button";
  button.className = "readAloudOption" + (active ? " active" : "");
  button.setAttribute("role", role || "menuitemradio");
  button.setAttribute("aria-checked", active ? "true" : "false");

  if(dataset){
    Object.assign(button.dataset, dataset);
  }

  const check = document.createElement("span");
  check.className = "readAloudOptionCheck";
  check.textContent = "✓";

  const text = document.createElement("span");
  text.className = "readAloudOptionLabel";
  text.textContent = label;

  button.append(check, text);

  button.addEventListener("click", event => {
    event.stopPropagation();
    onSelect();
    saveReadAloudPrefs();
    refreshSettingsSelection();

    if(liveRestart !== false){
      restartCurrentUtterance();
    }
  });

  return button;
}

function buildSpeedList(){

  readAloudSpeedList.replaceChildren();

  READ_RATE_LABELS.forEach((label, index) => {

    readAloudSpeedList.appendChild(optionRow({
      label,
      active: index === readRateIndex,
      dataset:{ index:String(index) },
      onSelect(){
        readRateIndex = index;
      }
    }));
  });
}

function buildVoiceList(){

  readAloudVoiceList.replaceChildren();

  if(!availableVoices.length){

    const note = document.createElement("div");
    note.className = "readAloudEmptyNote";
    note.textContent = "No voices reported by this browser yet. Try opening this menu again in a moment.";
    readAloudVoiceList.appendChild(note);
    return;
  }

  // Pinned above the categories - picks whatever the browser
  // considers its own default, same as always, and stays
  // selectable alongside every individual voice below it.
  readAloudVoiceList.appendChild(optionRow({
    label: "Default (Auto)",
    active: !selectedVoiceURI,
    dataset:{ voiceUri:"" },
    onSelect(){
      selectedVoiceURI = null;
    }
  }));

  for(const { label, voices } of groupedVoiceList()){

    const heading = document.createElement("div");
    heading.className = "readAloudVoiceGroupHeading";
    heading.textContent = label;
    readAloudVoiceList.appendChild(heading);

    for(const voice of voices){

      const row = optionRow({
        label: describeVoice(voice),
        active: voice.voiceURI === selectedVoiceURI,
        dataset:{ voiceUri: voice.voiceURI },
        onSelect(){
          selectedVoiceURI = voice.voiceURI;
        }
      });

      readAloudVoiceList.appendChild(row);
    }
  }
}

// Skip Tables changes *what* gets read, not just how - so instead
// of the usual "restart the current utterance" live-apply, toggling
// it invalidates every page's cached blocks and restarts the
// current page's reading from its start (see
// restartCurrentPageReading() for why a clean restart, rather than
// trying to resume mid-sentence, is the right call here).
function buildOptionsList(){

  readAloudOptionsList.replaceChildren();

  readAloudOptionsList.appendChild(optionRow({
    label: "Skip tables",
    active: skipTables,
    role: "menuitemcheckbox",
    dataset:{ option:"skipTables" },
    liveRestart: false,
    onSelect(){
      skipTables = !skipTables;
      invalidateAllPageBlockCaches();
      restartCurrentPageReading();
    }
  }));
}

function openSettingsMenu(){
  refreshVoices();
  buildOptionsList();
  buildSpeedList();
  buildVoiceList();
  readAloudSettingsMenu.classList.remove("hidden");
  readAloudSettingsBtn.setAttribute("aria-expanded", "true");
}

function closeSettingsMenu(){
  readAloudSettingsMenu.classList.add("hidden");
  readAloudSettingsBtn.setAttribute("aria-expanded", "false");
}

function toggleSettingsMenu(){
  if(readAloudSettingsMenu.classList.contains("hidden")){
    openSettingsMenu();
  }else{
    closeSettingsMenu();
  }
}

async function getPageBlocks(view){

  if(view.readAloudBlocks){
    return view.readAloudBlocks;
  }

  try{
    const textContent = await ensureTextContent(view);
    const lineBlocks = buildReadableBlocks(textContent);
    view.readAloudBlocks = groupBlocksForSpeech(lineBlocks);
  }catch(error){
    console.warn(`Read Aloud: could not read page ${view.pageNumber}:`, error);
    view.readAloudBlocks = [];
  }

  return view.readAloudBlocks;
}

/* ------------------------------------------------------------
   LIVE HIGHLIGHTING

   Reuses the same DOM-Range technique the search feature uses
   (getRelativeRects, defined further down) rather than any of
   pdf.js's internal span layout - so this stays correct however
   the text layer happens to be built. A page's full rendered
   text is only walked once per render (cached on the view as
   readTextIndex) and reused for every line on that page.
------------------------------------------------------------ */

function buildPageTextIndex(view){

  const nodes = getTextNodes(view);

  let fullText = "";
  const positions = [];

  for(const node of nodes){

    const nodeText = node.nodeValue || "";
    const start = fullText.length;

    fullText += nodeText;

    positions.push({ node, start, end: fullText.length });
  }

  return { fullText, positions };
}

function locateOffset(positions, index){

  for(const info of positions){
    if(index >= info.start && index <= info.end){
      return { node: info.node, offset: index - info.start };
    }
  }

  return null;
}

function drawHighlightRects(layer, className, rects){
  for(const rect of rects){
    const el = document.createElement("div");
    el.className = className;
    el.style.left = `${rect.left}px`;
    el.style.top = `${rect.top}px`;
    el.style.width = `${rect.width}px`;
    el.style.height = `${rect.height}px`;
    layer.appendChild(el);
  }
}

const readHighlight = {
  view:null,
  lineAbsStart:-1
};

function clearReadHighlights(){

  for(const view of pageViews){
    if(view?.readHighlightLayerDiv){
      view.readHighlightLayerDiv.replaceChildren();
    }
  }

  readHighlight.view = null;
  readHighlight.lineAbsStart = -1;
}

// Highlights the whole line a block came from, in a soft yellow.
// Failure anywhere here (a line that can't be located, a stale
// DOM reference) is swallowed - a missing highlight should never
// interrupt playback.
function highlightLine(view, block){

  try{

    clearReadHighlights();

    if(!block?.rawLine || !block.rawLine.trim()){
      return;
    }

    if(!view.readTextIndex){
      view.readTextIndex = buildPageTextIndex(view);
    }

    const index = view.readTextIndex;
    const at = index.fullText.indexOf(block.rawLine);

    if(at === -1){
      return;
    }

    const startPos = locateOffset(index.positions, at);
    const endPos = locateOffset(index.positions, at + block.rawLine.length);

    if(!startPos || !endPos){
      return;
    }

    const rects = getRelativeRects(view, startPos.node, startPos.offset, endPos.node, endPos.offset);

    readHighlight.view = view;
    readHighlight.lineAbsStart = at;

    drawHighlightRects(view.readHighlightLayerDiv, "read-line-highlight", rects);

  }catch(error){
    console.warn("Read Aloud: line highlight failed:", error);
  }
}

// Highlights the specific word currently being spoken, using the
// speech engine's own reported charIndex/charLength into the
// block's spoken text, traced back through block.map to the raw
// line and then to the page's DOM.
function highlightWord(block, charIndex, charLength){

  try{

    if(!readHighlight.view || readHighlight.lineAbsStart < 0){
      return;
    }

    if(!block?.map?.length){
      return;
    }

    const from = Math.max(0, Math.min(charIndex, block.map.length - 1));
    const to = Math.max(from, Math.min(charIndex + Math.max(charLength, 1) - 1, block.map.length - 1));

    const rawStart = block.map[from];
    const rawEnd = block.map[to] + 1;

    const index = readHighlight.view.readTextIndex;

    if(!index){
      return;
    }

    const absStart = readHighlight.lineAbsStart + rawStart;
    const absEnd = readHighlight.lineAbsStart + rawEnd;

    const startPos = locateOffset(index.positions, absStart);
    const endPos = locateOffset(index.positions, absEnd);

    if(!startPos || !endPos){
      return;
    }

    const rects = getRelativeRects(readHighlight.view, startPos.node, startPos.offset, endPos.node, endPos.offset);

    const layer = readHighlight.view.readHighlightLayerDiv;

    for(const el of layer.querySelectorAll(".read-word-highlight")){
      el.remove();
    }

    drawHighlightRects(layer, "read-word-highlight", rects);

  }catch(error){
    console.warn("Read Aloud: word highlight failed:", error);
  }
}

/* ------------------------------------------------------------
   FOLLOW ALONG (AUTO-SCROLL)

   Off by default - a deliberate opt-in, not something reading
   quietly turns on for you. While it's on, the viewer scrolls to
   keep the line currently being read in a comfortable spot;
   scrolling it there yourself for any reason - a drag, a wheel
   turn, a keyboard scroll - breaks it instantly, and the button is
   the only thing that turns it back on (it never silently
   re-engages on its own).

   The "instantly" part is why every scroll this feature performs
   is a plain, synchronous `scrollTop` assignment rather than a
   smooth/animated one: a smooth scroll keeps generating scroll
   events for hundreds of milliseconds after it's requested, which
   would make it effectively impossible to tell "the person just
   grabbed the page" apart from "our own animation is still
   settling". A single instant jump, guarded for a brief moment
   right around when it happens, avoids that ambiguity entirely.
------------------------------------------------------------ */

let autoFollow = false;
let autoScrollGuardUntil = 0;
let lastAutoScrollTop = null;

function beginProgrammaticScroll(){
  // Backstop only. The real guard is lastAutoScrollTop below,
  // which compares the actual scrollTop instead of a timestamp -
  // that way a scroll event delivered late by a busy browser still
  // reads as "ours" instead of wrongly disengaging Follow Along.
  autoScrollGuardUntil = Date.now() + 600;
}

function updateAutoFollowUI(){
  readAloudFollowBtn.classList.toggle("active", autoFollow);
  readAloudFollowBtn.title = autoFollow ? "Following along (tap to stop)" : "Follow along as it reads";
  readAloudFollowBtn.setAttribute("aria-pressed", autoFollow ? "true" : "false");
}

// Scrolls (instantly) to keep a page's currently-highlighted line
// in view. Runs on every line change and, while a line is being
// spoken, on every word boundary too - so with force=false (the
// normal case) it moves by whatever small amount keeps the line
// pinned near its target spot, rather than only reacting once
// things have drifted well out of view. That's deliberate: only
// correcting for large drift reads as a jarring jump every so often
// rather than continuous tracking, which is the whole point of
// Follow Along. The tiny leftover threshold below exists purely to
// skip a handful of pointless sub-pixel scrollTop writes, not to
// create a dead zone. With force=true (tapping the button itself)
// it always jumps there regardless, so turning the feature on gives
// immediate, obvious feedback.
function snapToCurrentLine(view, force){

  if(!view){
    return;
  }

  const highlightEl = view.readHighlightLayerDiv.querySelector(".read-line-highlight");

  if(!highlightEl){
    return;
  }

  const elRect = highlightEl.getBoundingClientRect();
  const viewerRect = viewer.getBoundingClientRect();

  // Aim for a bit above dead-center, leaving more room below the
  // line than above it, since that's the text about to be read.
  const targetY = viewerRect.top + viewerRect.height * 0.35;
  const currentCenter = elRect.top + elRect.height / 2;
  const delta = currentCenter - targetY;

  if(!force && Math.abs(delta) < 6){
    return;
  }

  beginProgrammaticScroll();
  viewer.scrollTop += delta;
  lastAutoScrollTop = viewer.scrollTop;
}

// Used for page-turn scrolling in place of the shared, smoothly-
// animated scrollToView() only while Follow Along is engaged - see
// the note above on why an instant scroll is what makes the
// "breaks free the instant you touch it" behavior reliable.
async function readingScrollToPage(view){

  await renderPage(view);

  const viewerRect = viewer.getBoundingClientRect();
  const pageRect = view.pageDiv.getBoundingClientRect();
  const targetOffset = pageRect.top - viewerRect.top + viewer.scrollTop;

  beginProgrammaticScroll();
  viewer.scrollTop = Math.max(0, targetOffset - 8);
  lastAutoScrollTop = viewer.scrollTop;

  pageInput.value = String(view.pageNumber);
}

function engageAutoFollow(){

  autoFollow = true;
  updateAutoFollowUI();

  if(readHighlight.view){
    snapToCurrentLine(readHighlight.view, true);
  }
}

function disengageAutoFollow(){

  if(!autoFollow){
    return;
  }

  autoFollow = false;
  updateAutoFollowUI();
}

function toggleAutoFollow(){
  if(autoFollow){
    disengageAutoFollow();
  }else{
    engageAutoFollow();
  }
}

// The one and only way autoFollow turns itself off without the
// person tapping the button: any scroll on the viewer that didn't
// come from beginProgrammaticScroll() above is, by definition,
// the person scrolling it themselves.
viewer.addEventListener("scroll", () => {

  if(!autoFollow){
    return;
  }

  // Primary check: does the current scrollTop match the value we
  // just set ourselves? This holds regardless of how late the
  // browser delivers the scroll event, so a busy page can't cause
  // a false "the person grabbed it" read.
  if(lastAutoScrollTop !== null && Math.abs(viewer.scrollTop - lastAutoScrollTop) < 2){
    return;
  }

  // Fallback for the rare case the settled scrollTop doesn't
  // exactly match what we set (e.g. clamped at the top/bottom).
  if(Date.now() < autoScrollGuardUntil){
    return;
  }

  disengageAutoFollow();
});

/* ------------------------------------------------------------
   SCREEN-AWAKE ROBUSTNESS

   Two independent safety nets so a long reading session doesn't
   get cut short:

   - Screen Wake Lock keeps the display from auto-dimming/locking
     from inactivity while actively reading. This is the one part
     of "keep playing with the screen off" a web page can actually
     guarantee - a wake lock does NOT stop the person from
     manually pressing the power button, and if they do, whether
     speech keeps going after that is entirely up to the phone's
     OS/browser (Android Chrome generally keeps speaking; iOS
     Safari is known to suspend speech synthesis once the screen
     locks or the tab is backgrounded, with no web API able to
     override that).
   - A stall watchdog notices when nothing has happened - no word
     boundary, no line finishing - for several seconds while
     reading is supposed to be active, and recovers on its own by
     restarting the current line, rather than leaving the person
     staring at a "playing" icon that's gone silent. (An earlier
     version of this nudged the engine with a periodic
     pause()/resume() call to dodge a Chrome bug where long
     utterances silently stop after ~15s; that nudge turned out to
     itself be a source of random stops on some browsers, so it's
     been replaced with this - lines are also short enough now,
     one PDF line per utterance, that the original 15s bug rarely
     has a chance to trigger in the first place.)
------------------------------------------------------------ */

let wakeLockSentinel = null;

async function acquireWakeLock(){

  if(!("wakeLock" in navigator)){
    return;
  }

  try{
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", () => {
      wakeLockSentinel = null;
    });
  }catch(error){
    // Refused (low battery, unsupported context, etc.) - reading
    // still works, the screen just won't be kept awake for it.
    console.warn("Read Aloud: wake lock unavailable:", error);
  }
}

function releaseWakeLock(){
  if(wakeLockSentinel){
    try{
      wakeLockSentinel.release();
    }catch{}
    wakeLockSentinel = null;
  }
}

const WATCHDOG_CHECK_MS = 2000;
const WATCHDOG_BASE_STALL_MS = 6000;
const WATCHDOG_MAX_RETRIES = 2;

// Rough spoken words per second at 1x rate - used only to give a
// merged multi-line utterance (see groupBlocksForSpeech - several
// original PDF lines are now often spoken as one sentence, to avoid
// pausing at every line wrap) a fair, duration-aware stall
// allowance. Many voices/browsers never fire onboundary events at
// all, so for those the utterance's own start/end are the *only*
// progress signal that exists; a stall window sized for a single
// short line would otherwise trip on every long utterance well
// before it ever had a chance to finish speaking normally.
const ESTIMATED_WORDS_PER_SECOND = 2.3;

let watchdogTimer = null;
let watchdogRetries = 0;

// Called on every sign of *genuine* progress - an utterance
// starting, a word boundary, an utterance finishing - so the
// watchdog always measures time since the last thing that actually
// happened, not time since reading started. This also clears the
// retry count, since real progress means recovery worked. The
// watchdog's own forced restart below deliberately does NOT call
// this - see the note there.
function noteReadingProgress(){
  reading.lastProgressAt = Date.now();
  watchdogRetries = 0;
}

function startWatchdog(){

  stopWatchdog();
  noteReadingProgress();

  watchdogTimer = setInterval(() => {

    if(!reading.active || reading.paused){
      return;
    }

    const elapsed = Date.now() - reading.lastProgressAt;
    const allowance = reading.stallAllowanceMs || WATCHDOG_BASE_STALL_MS;

    if(elapsed < allowance){
      return;
    }

    if(watchdogRetries >= WATCHDOG_MAX_RETRIES){
      // Recovery has already been tried a couple of times and
      // it's still not moving - stop guessing and show this
      // honestly as paused (with a working Resume button) rather
      // than leaving a "playing" icon over silence indefinitely.
      console.warn("Read Aloud: still stalled after retrying - pausing.");
      pauseReading();
      return;
    }

    watchdogRetries++;

    console.warn(`Read Aloud: no progress for ${Math.round(elapsed / 1000)}s - restarting the current line (attempt ${watchdogRetries}/${WATCHDOG_MAX_RETRIES}).`);

    reading.currentToken = -1;

    try{
      window.speechSynthesis.cancel();
    }catch{}

    // Deliberately not noteReadingProgress() here - this is a
    // forced retry, not genuine progress, so the retry count above
    // must survive into the next check. Calling the shared
    // progress function would zero watchdogRetries right back out
    // on every single check, meaning the >= WATCHDOG_MAX_RETRIES
    // give-up above could never actually trigger - the exact bug
    // that let a stalled utterance restart the same content forever
    // instead of eventually pausing.
    reading.lastProgressAt = Date.now();

    scheduleSpeakCurrentBlock(SPEECH_RESTART_DELAY_MS);

  }, WATCHDOG_CHECK_MS);
}

function stopWatchdog(){
  if(watchdogTimer){
    clearInterval(watchdogTimer);
    watchdogTimer = null;
  }
}

if(SUPPORTS_SPEECH){

  document.addEventListener("visibilitychange", () => {

    if(document.visibilityState !== "visible"){

      // Going into the background/screen-off. The watchdog can't
      // meaningfully judge a stall against a stall clock that's
      // about to become meaningless the moment the JS thread gets
      // frozen (which screen-off does, hard, on most phones) - stop
      // it here so it can't fire a burst of its own recovery
      // attempts once un-frozen, on top of whatever else already
      // happened. It gets a clean restart below, once we're back
      // and can actually tell what state things ended up in.
      stopWatchdog();
      return;
    }

    if(!reading.active || reading.paused){
      return;
    }

    void acquireWakeLock();

    let stillSpeaking = false;

    try{
      stillSpeaking = window.speechSynthesis.speaking && !window.speechSynthesis.paused;
    }catch{}

    if(stillSpeaking){
      // Genuinely still going - nudge it in case this is a browser
      // that silently auto-pauses speech on backgrounding without
      // ever telling anyone, and pick the watchdog back up fresh.
      try{
        window.speechSynthesis.resume();
      }catch{}
      noteReadingProgress();
      startWatchdog();
      return;
    }

    // Speech has actually stopped. Many phones - iOS Safari in
    // particular - fully kill an in-progress utterance the moment
    // the screen locks rather than pausing it, with no event fired
    // to say so. This is also the fix for "turning the screen back
    // on skips pages": without it, whatever was still pending from
    // right before the freeze - a gap timer between lines, a
    // watchdog retry, a segment-highlight timer - can all fire in a
    // burst the instant the JS thread unfreezes, each one racing to
    // advance reading.blockIndex/pageNumber independently. Bumping
    // generation first invalidates every one of those stale,
    // pre-freeze callbacks outright (see the token/generation notes
    // on the `reading` object above), so the only thing that can
    // still act is the single, fresh restart scheduled right here -
    // from reading.blockIndex/segmentIndex/pageNumber exactly as
    // they were, since nothing legitimate had the chance to advance
    // them while genuinely frozen.
    reading.generation++;
    stopUtteranceQuietly();
    clearTimeout(reading.gapTimer);
    reading.gapTimer = null;

    noteReadingProgress();
    startWatchdog();

    scheduleSpeakCurrentBlock(SPEECH_RESTART_DELAY_MS);
  });
}

/* ------------------------------------------------------------
   MEDIA SESSION (BACKGROUND / LOCK-SCREEN PLAYBACK)

   Registers reading as a real media session rather than leaving it
   as an ordinary background tab producing audio on the side. Two
   concrete, practical differences that makes:

   - Lock-screen and notification-shade transport controls, and
     hardware media-key/headphone-button play-pause-next-previous
     support, all for free - the same surface a podcast or
     audiobook app gets, rather than the person having to unlock
     their phone and find this tab again just to pause.
   - On most platforms, a tab that's registered an active media
     session and is audibly playing is specifically exempted from
     the background-tab timer throttling that would otherwise
     eventually slow down the setTimeout/setInterval calls this
     whole reading pipeline (the watchdog, the gap between lines,
     the segment-highlight timers) depends on to keep moving -
     without this, "background" playback risks technically
     continuing as audio while the logic driving it along stalls.

   Every call is wrapped, and stop/pause/next/previous simply defer
   to the exact same functions the on-screen buttons use - so this
   is purely an additional way to reach controls that already exist,
   never a second, separate implementation of them.
------------------------------------------------------------ */

const SUPPORTS_MEDIA_SESSION = SUPPORTS_SPEECH && "mediaSession" in navigator && typeof MediaMetadata === "function";

// A plain open-book glyph, generated inline rather than shipped as
// a separate file, purely so the lock-screen/notification/OS media
// widget always has *something* to render - several platforms show
// a much smaller or blanker "now playing" card, or skip showing one
// at all, when a media session has no artwork.
const MEDIA_SESSION_ARTWORK_URI = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' +
  '<rect width="512" height="512" rx="64" fill="#181818"/>' +
  '<path d="M128 160v210l128-38 128 38V160l-128-38z" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>' +
  '<path d="M256 122v248" stroke="#ffffff" stroke-width="20"/>' +
  '</svg>'
);

function updateMediaSessionMetadata(){

  if(!SUPPORTS_MEDIA_SESSION){
    return;
  }

  try{

    const totalPages = pdfDoc ? pdfDoc.numPages : reading.pageNumber;

    navigator.mediaSession.metadata = new MediaMetadata({
      title: document.title || "Reading Aloud",
      artist: `Page ${reading.pageNumber} of ${totalPages}`,
      album: "Read Aloud",
      artwork: [
        { src: MEDIA_SESSION_ARTWORK_URI, sizes: "512x512", type: "image/svg+xml" }
      ]
    });

  }catch(error){
    console.warn("Read Aloud: could not set media session metadata:", error);
  }
}

// Called from updateReadAloudUI() - the single place reading's
// active/paused state already changes - so the lock-screen display
// can never drift out of sync with the on-screen one.
function updateMediaSessionState(){

  if(!SUPPORTS_MEDIA_SESSION){
    return;
  }

  try{

    if(!reading.active){
      navigator.mediaSession.playbackState = "none";
      navigator.mediaSession.metadata = null;
      return;
    }

    navigator.mediaSession.playbackState = reading.paused ? "paused" : "playing";
    updateMediaSessionMetadata();

  }catch(error){
    console.warn("Read Aloud: could not set media session state:", error);
  }
}

if(SUPPORTS_MEDIA_SESSION){

  const mediaSessionHandlers = {
    play(){
      if(reading.active && reading.paused){
        resumeReading();
      }
    },
    pause(){
      if(reading.active && !reading.paused){
        pauseReading();
      }
    },
    stop(){
      stopReading();
    },
    previoustrack(){
      skipPage(-1);
    },
    nexttrack(){
      skipPage(1);
    }
  };

  for(const [action, handler] of Object.entries(mediaSessionHandlers)){
    try{
      navigator.mediaSession.setActionHandler(action, handler);
    }catch{
      // Some browsers only support a subset of these action names -
      // an unsupported one throws on registration rather than just
      // being ignored. Every other (supported) handler still gets
      // registered fine regardless.
    }
  }
}

/* ------------------------------------------------------------
   UI
------------------------------------------------------------ */

function updateReadAloudUI(){

  if(!reading.active){

    readAloudControls.classList.add("hidden");
    closeSettingsMenu();

    readAloudFloat.classList.remove("active");
    readAloudFloat.innerHTML = ICON_SPEAKER;
    readAloudFloat.title = "Read Aloud";
    readAloudFloat.setAttribute("aria-label", "Read Aloud");

    syncReadBarLift();
    updateMediaSessionState();

    return;
  }

  readAloudControls.classList.remove("hidden");
  readAloudFloat.classList.add("active");

  const totalPages = pdfDoc ? pdfDoc.numPages : reading.pageNumber;
  const rateLabel = READ_RATE_LABELS[readRateIndex];

  if(reading.paused){

    readAloudFloat.innerHTML = ICON_PLAY;
    readAloudFloat.title = "Resume Reading";
    readAloudFloat.setAttribute("aria-label", "Resume reading");

    readAloudPlayPause.innerHTML = ICON_PLAY;
    readAloudPlayPause.title = "Resume";
    readAloudPlayPause.setAttribute("aria-label", "Resume reading");

    readAloudStatus.innerHTML = `Paused, page ${reading.pageNumber} of ${totalPages}<span class="readAloudDot">•</span>${rateLabel}`;

  }else{

    readAloudFloat.innerHTML = ICON_PAUSE;
    readAloudFloat.title = "Pause Reading";
    readAloudFloat.setAttribute("aria-label", "Pause reading");

    readAloudPlayPause.innerHTML = ICON_PAUSE;
    readAloudPlayPause.title = "Pause";
    readAloudPlayPause.setAttribute("aria-label", "Pause reading");

    readAloudStatus.innerHTML = `Reading page ${reading.pageNumber} of ${totalPages}<span class="readAloudDot">•</span>${rateLabel}`;
  }

  syncReadBarLift();
  updateMediaSessionState();
}

// Measures the control bar's real, current height and pushes that
// (plus a small gap) into --read-bar-lift so the three floating
// buttons rise to clear it, in both the normal viewer and reflow
// reading mode. Runs after a frame so the bar's just-changed
// visibility has actually been laid out before it's measured.
function syncReadBarLift(){

  requestAnimationFrame(() => {

    if(reading.active && !readAloudControls.classList.contains("hidden")){

      const height = readAloudControls.getBoundingClientRect().height || 52;

      document.documentElement.style.setProperty("--read-bar-lift", `${Math.ceil(height) + 14}px`);

    }else{
      document.documentElement.style.setProperty("--read-bar-lift", "0px");
    }
  });
}

/* ------------------------------------------------------------
   PLAYBACK CONTROL
------------------------------------------------------------ */

function stopUtteranceQuietly(){

  reading.currentToken = -1;

  clearTimeout(reading.gapTimer);
  reading.gapTimer = null;

  try{
    window.speechSynthesis.cancel();
  }catch{}
}

// Cancelling in-flight speech and asking the engine to speak again
// in the very same tick is a well-documented source of dropped or
// stuck utterances on several speech engines (Chrome's included) -
// this is almost certainly why picking a different voice, or the
// watchdog's own recovery attempt, used to appear to do nothing,
// or end up silently repeating the same content instead of moving
// on. Every place that needs to restart speech right after
// cancelling it goes through this one function so the engine
// always gets a brief moment to actually finish processing the
// cancellation first.
const SPEECH_RESTART_DELAY_MS = 120;

function scheduleSpeakCurrentBlock(delayMs){

  const generation = reading.generation;

  clearTimeout(reading.gapTimer);

  reading.gapTimer = setTimeout(() => {
    if(generation === reading.generation && reading.active && !reading.paused){
      speakCurrentBlock();
    }
  }, delayMs);
}

function stopReading(){

  reading.active = false;
  reading.paused = false;
  reading.generation++;
  reading.segmentIndex = 0;

  stopUtteranceQuietly();
  clearReadHighlights();
  stopWatchdog();
  releaseWakeLock();

  autoFollow = false;
  updateAutoFollowUI();

  updateReadAloudUI();
}

function pauseReading(){

  if(!reading.active || reading.paused){
    return;
  }

  reading.paused = true;

  stopUtteranceQuietly();
  stopWatchdog();
  releaseWakeLock();

  updateReadAloudUI();
}

// The person tapped Play (the floating button, the control-bar
// button, or a lock-screen/media-key play control - all three
// funnel through here) while paused. If they've since scrolled
// somewhere else entirely - checking on something forty pages
// ahead is exactly the case this is for - resuming silently from
// back where it paused would be surprising, and stopping the
// session just to pick a new page by hand is exactly the friction
// this avoids: ask, once, which one they actually want.
function resumeReading(){

  if(!reading.active || !reading.paused){
    return;
  }

  const pausedPage = reading.pageNumber;
  const currentPage = getNearestVisiblePage();

  if(pdfDoc && currentPage && currentPage !== pausedPage){
    openResumeChoice(pausedPage, currentPage);
    return;
  }

  continueReadingFromPause();
}

// The actual "keep going from exactly where it paused" logic -
// its own function so openResumeChoice()'s "Resume Page N" option
// can call it directly without re-running (and being blocked by)
// the page-drift check above.
function continueReadingFromPause(){

  reading.paused = false;

  updateReadAloudUI();

  void acquireWakeLock();
  startWatchdog();

  speakCurrentBlock();
}

// Applies a speed/voice change immediately, even mid-sentence,
// instead of waiting for the current utterance to finish on its
// own - cancels it and restarts the exact same unit (not the next
// one) with the newly chosen rate/voice, so nothing gets skipped.
function restartCurrentUtterance(){

  if(!reading.active || reading.paused){
    return;
  }

  clearTimeout(reading.gapTimer);
  reading.gapTimer = null;

  reading.currentToken = -1;

  try{
    window.speechSynthesis.cancel();
  }catch{}

  scheduleSpeakCurrentBlock(SPEECH_RESTART_DELAY_MS);
}

// Clears every page's cached Read Aloud blocks so the next time
// each is needed it's rebuilt from scratch - used when a setting
// that changes *what* gets read (Skip Tables) is toggled, so pages
// already visited during this session pick up the new behavior too.
function invalidateAllPageBlockCaches(){
  for(const view of pageViews){
    if(view){
      view.readAloudBlocks = null;
    }
  }
}

// Rebuilds and restarts the current page's reading from its start.
// Used right after a change (like Skip Tables) that alters which
// lines even exist to read - there's no sound way to line up an old
// mid-sentence position against newly-filtered content, so starting
// the page over is the honest, correct behavior.
function restartCurrentPageReading(){

  if(!reading.active){
    return;
  }

  reading.generation++;
  reading.paused = false;

  stopUtteranceQuietly();
  clearReadHighlights();
  noteReadingProgress();

  void advanceToPage(reading.pageNumber);
}

function speakCurrentBlock(){

  if(!reading.active || reading.paused){
    return;
  }

  if(reading.blockIndex >= reading.blocks.length){
    void advanceToPage(reading.pageNumber + 1);
    return;
  }

  const unit = reading.blocks[reading.blockIndex];
  const generation = reading.generation;
  const isHeading = unit.type === "heading";

  const speakNow = () => {

    if(generation !== reading.generation || reading.paused || !reading.active){
      return;
    }

    const token = ++utteranceToken;
    reading.currentToken = token;

    // Where within this unit to actually start speaking from - 0
    // for a fresh unit, but potentially further in if this call is
    // resuming after a voice/speed change or a watchdog retry
    // rather than restarting the whole paragraph from the top every
    // time. Clamped defensively in case segmentIndex was left
    // pointing past the end of a unit with fewer segments than
    // whatever was previously playing.
    const startSegIndex = Math.min(Math.max(0, reading.segmentIndex || 0), unit.segments.length - 1);
    const startCharOffset = unit.segments[startSegIndex] ? unit.segments[startSegIndex].start : 0;

    const speakText = unit.text.slice(startCharOffset);

    // The same segments as unit.segments from startSegIndex on, but
    // with start/end rebased to speakText's own coordinate space
    // (0 at startCharOffset) rather than the full unit's - since
    // speakText, not unit.text, is what's actually being spoken and
    // what onboundary's charIndex will be measured against.
    const activeSegments = unit.segments.slice(startSegIndex).map(segment => ({
      block: segment.block,
      start: segment.start - startCharOffset,
      end: segment.end - startCharOffset
    }));

    // Duration-aware stall allowance for the watchdog (see
    // startWatchdog()) - a merged multi-line unit legitimately
    // takes longer to speak than a single short line did, and on
    // browsers/voices that never fire onboundary events, its own
    // start/end are the only progress signal that exists at all.
    // Based on speakText (what's actually left to say), not the
    // unit's full original text, so resuming partway through a long
    // paragraph doesn't get an unreasonably generous allowance for
    // content that's already been spoken.
    const wordCount = Math.max(1, speakText.split(/\s+/).filter(Boolean).length);
    const estimatedSpeakMs = (wordCount / ESTIMATED_WORDS_PER_SECOND / currentReadRate()) * 1000;
    reading.stallAllowanceMs = Math.max(WATCHDOG_BASE_STALL_MS, estimatedSpeakMs * 2.2 + 4000);

    noteReadingProgress();

    const view = pageViews[reading.pageNumber - 1];

    // Tracks (by index into activeSegments, not by object) which
    // original PDF line is currently highlighted. Kept as an index
    // specifically so advanceSegment() below can enforce "only ever
    // move forward" regardless of which of its two independent
    // triggers - a real onboundary event, or the timer fallback -
    // fires first for a given segment.
    let currentSegmentIndex = 0;
    let currentSegment = activeSegments[0] || null;

    reading.segmentIndex = startSegIndex;

    if(view && currentSegment){
      highlightLine(view, currentSegment.block);
      if(autoFollow){
        snapToCurrentLine(view, false);
      }
    }

    // Moves the highlighted line to activeSegments[index], but only
    // if that's actually further along than where it already is -
    // this is what lets the onboundary handler and the timer
    // fallback below coexist safely: whichever notices a given
    // segment change first wins, and the other's later, now-stale
    // call for the same or an earlier segment simply no-ops. Also
    // keeps reading.segmentIndex (the *absolute* position within
    // the unit, used to resume correctly after any interruption)
    // in sync as playback moves through the paragraph.
    function advanceSegment(index){

      if(index <= currentSegmentIndex && currentSegment){
        return;
      }

      currentSegmentIndex = index;
      currentSegment = activeSegments[index];
      reading.segmentIndex = startSegIndex + index;

      if(view && currentSegment){
        highlightLine(view, currentSegment.block);
        if(autoFollow){
          snapToCurrentLine(view, false);
        }
      }
    }

    // Word boundary events are the ideal source for this - exactly
    // in sync with the audio - but a great many voices/engines
    // (much of Android's platform TTS bridge, several desktop
    // voices, and more) never fire them at all. Without a fallback,
    // the highlight for a multi-line merged paragraph would then
    // simply never move off its first line for the entire time it's
    // being read - which is exactly the "reads whole paragraphs,
    // but still only highlights a single line" symptom. Scheduling
    // each segment's estimated start time up front guarantees the
    // highlight keeps advancing through the paragraph on every
    // engine, with or without onboundary support; on engines that
    // do fire it, the real event will typically win the race and
    // this timer's later call for the same segment is just a no-op.
    if(activeSegments.length > 1){

      const totalChars = Math.max(1, speakText.length);
      let elapsedMs = 0;

      for(let i = 0; i < activeSegments.length; i++){

        const segment = activeSegments[i];
        const segChars = Math.max(1, segment.end - segment.start);
        const segMs = (segChars / totalChars) * estimatedSpeakMs;

        if(i > 0){
          const fireIndex = i;
          setTimeout(() => {
            if(token === reading.currentToken){
              advanceSegment(fireIndex);
            }
          }, elapsedMs);
        }

        elapsedMs += segMs;
      }
    }

    const utterance = new SpeechSynthesisUtterance(speakText);

    utterance.rate = currentReadRate();

    const voice = pickVoice();

    if(voice){
      // Match the utterance's lang to the chosen voice's own lang
      // rather than always forcing "en-US" - several browsers
      // (notably Android's platform TTS bridge) pick the actual
      // speaking voice primarily off of .lang, and will silently
      // fall back to a default English voice if it's left
      // mismatched with the voice actually assigned. This is why
      // picking a different voice - especially a non-English one -
      // used to appear to do nothing.
      utterance.voice = voice;
      utterance.lang = voice.lang || "en-US";
    }else{
      utterance.lang = "en-US";
    }

    utterance.onboundary = event => {

      if(token !== reading.currentToken){
        return;
      }

      noteReadingProgress();

      // Some engines also report sentence boundaries on the same
      // event - only act on word-level ones.
      if(event?.name && event.name !== "word"){
        return;
      }

      const charIndex = event?.charIndex || 0;
      const length = (typeof event?.charLength === "number" && event.charLength > 0) ? event.charLength : 1;

      // Find which original line this position in the merged
      // utterance text belongs to, so the right line (and the
      // right offset within it) gets highlighted even though
      // several lines are being spoken as one utterance.
      let segmentIndex = activeSegments.findIndex(s => charIndex >= s.start && charIndex < s.end);

      if(segmentIndex === -1){
        segmentIndex = activeSegments.length - 1;
      }

      advanceSegment(segmentIndex);

      // currentSegment reflects whichever segment actually won -
      // it may be ahead of this particular event if the timer
      // fallback above already moved on, in which case there's
      // nothing sensible to highlight a sub-word position within
      // for *this* event and it's simply skipped.
      if(currentSegment && segmentIndex === currentSegmentIndex){
        const localIndex = charIndex - currentSegment.start;
        const localLength = Math.max(1, Math.min(length, currentSegment.end - charIndex));
        highlightWord(currentSegment.block, localIndex, localLength);
      }

      // Re-check on every word, not just once at the start of the
      // unit, so Follow Along keeps the reading position in view
      // continuously as it moves rather than only nudging once per
      // utterance.
      if(autoFollow){
        snapToCurrentLine(view, false);
      }
    };

    const handleFinished = () => {

      // A stale or intentionally-cancelled utterance - a real
      // page turn, a pause, a stop, a watchdog restart - has since
      // replaced this one.
      if(token !== reading.currentToken){
        return;
      }

      if(generation !== reading.generation || reading.paused || !reading.active){
        return;
      }

      noteReadingProgress();

      reading.blockIndex++;
      reading.segmentIndex = 0;

      const gap = isHeading ? 420 : 45;

      reading.gapTimer = setTimeout(() => {
        if(generation === reading.generation && reading.active && !reading.paused){
          speakCurrentBlock();
        }
      }, gap);
    };

    utterance.onend = handleFinished;

    utterance.onerror = event => {
      // "canceled"/"interrupted" are expected whenever we cut an
      // utterance short on purpose (pause, stop, skip, a watchdog
      // restart) - only log genuine synthesis failures.
      if(event && event.error !== "canceled" && event.error !== "interrupted"){
        console.warn("Read Aloud: speech synthesis error:", event.error);
      }
      handleFinished();
    };

    try{
      window.speechSynthesis.speak(utterance);
    }catch(error){
      // A hard failure to even start speaking - surface this as
      // paused (with a working Resume button) rather than
      // silently ending the whole session.
      console.warn("Read Aloud: speech synthesis failed:", error);
      pauseReading();
    }
  };

  // A short beat before headings, so they land as a small pause
  // in the flow rather than running straight out of the body text.
  if(isHeading){
    reading.gapTimer = setTimeout(speakNow, 320);
  }else{
    speakNow();
  }
}

async function advanceToPage(pageNumber){

  const generation = reading.generation;

  if(!pdfDoc || pageNumber > pdfDoc.numPages){
    stopReading();
    return;
  }

  const view = await ensurePageView(pageNumber);

  if(generation !== reading.generation || !view){
    return;
  }

  if(autoFollow){
    await readingScrollToPage(view);
  }else{
    await scrollToView(view);
  }

  if(generation !== reading.generation){
    return;
  }

  const blocks = await getPageBlocks(view);

  if(generation !== reading.generation){
    return;
  }

  reading.pageNumber = pageNumber;
  reading.blocks = blocks;
  reading.blockIndex = 0;
  reading.segmentIndex = 0;

  noteReadingProgress();
  updateReadAloudUI();

  if(!blocks.length){
    // Nothing readable on this page (a cover image, a blank
    // page) - move straight on rather than sitting there silent.
    void advanceToPage(pageNumber + 1);
    return;
  }

  speakCurrentBlock();
}

function startReading(fromPage){

  reading.active = true;
  reading.paused = false;
  reading.generation++;

  updateReadAloudUI();

  void acquireWakeLock();
  startWatchdog();

  void advanceToPage(fromPage);
}

function skipPage(delta){

  if(!reading.active || !pdfDoc){
    return;
  }

  const target = reading.pageNumber + delta;

  if(target < 1 || target > pdfDoc.numPages){
    return;
  }

  reading.generation++;
  reading.paused = false;

  stopUtteranceQuietly();
  clearReadHighlights();
  noteReadingProgress();

  void advanceToPage(target);
}

// Skips straight to the next whole "section" - the same
// paragraph-or-heading unit that groupBlocksForSpeech() built and
// that gets highlighted/spoken as one continuous, naturally-paced
// piece (several original PDF lines merged together up to real
// sentence punctuation, not just wherever a line happened to wrap).
// Deliberately whole-unit, not line-by-line: a "next line" version
// of this used to jump only to the next segment within the same
// paragraph, which didn't match what's actually highlighted as one
// piece while reading, or feel like a meaningful "skip" within a
// short paragraph. If this was already the page's last unit,
// speakCurrentBlock() (called below) already knows to roll on to
// the next page on its own, same as reaching the end normally.
function skipSection(){

  if(!reading.active){
    return;
  }

  reading.generation++;
  reading.paused = false;

  stopUtteranceQuietly();
  clearReadHighlights();
  noteReadingProgress();

  reading.blockIndex++;
  reading.segmentIndex = 0;

  updateReadAloudUI();
  scheduleSpeakCurrentBlock(SPEECH_RESTART_DELAY_MS);
}

/* ------------------------------------------------------------
   READ ALOUD CHOICE

   One small "pick one of two things" dialog, reused for two
   different moments rather than building a second near-identical
   one: starting to read for the first time on a page other than 1,
   and resuming after having moved to a different page while
   paused. Each scenario below just fills in its own title,
   description, and button labels/actions.
------------------------------------------------------------ */

function showReadAloudChoice({ title, description, primaryLabel, onPrimary, secondaryLabel, onSecondary }){

  readAloudChoiceTitle.textContent = title;
  readAloudChoiceDescription.textContent = description;

  readAloudChoicePrimary.textContent = primaryLabel;
  readAloudChoiceSecondary.textContent = secondaryLabel;

  // Plain property assignment rather than addEventListener - there
  // is only ever exactly one active handler per button, and
  // reassigning it here on every open cleanly replaces whatever the
  // previous scenario wired up, with no manual listener bookkeeping
  // needed.
  readAloudChoicePrimary.onclick = event => {
    event.stopPropagation();
    closeReadAloudChoice();
    onPrimary();
  };

  readAloudChoiceSecondary.onclick = event => {
    event.stopPropagation();
    closeReadAloudChoice();
    onSecondary();
  };

  readAloudChoice.classList.remove("hidden");
}

function closeReadAloudChoice(){
  readAloudChoice.classList.add("hidden");
}

// Scenario 1: tapping Read Aloud for the first time on a page other
// than 1 - unchanged from before, just now going through the
// generic dialog helper above instead of its own bespoke wiring.
function openReadAloudChoice(){

  const current = getNearestVisiblePage();

  if(current <= 1){
    startReading(1);
    return;
  }

  showReadAloudChoice({
    title: "Start Reading",
    description: `You're on page ${current}. Start from the beginning, or from here?`,
    primaryLabel: `Start from Page ${current}`,
    onPrimary(){ startReading(current); },
    secondaryLabel: "Start from the Beginning",
    onSecondary(){ startReading(1); }
  });
}

// Scenario 2: pressing Play after having scrolled to a different
// page while paused - e.g. jumping ahead forty pages to check
// something, then coming back to keep listening, without having to
// stop reading altogether and re-pick a page from scratch. See the
// page-drift check in resumeReading() for where this gets called.
function openResumeChoice(pausedPage, currentPage){

  showReadAloudChoice({
    title: "Resume Reading",
    description: `You paused on page ${pausedPage}, but you're now on page ${currentPage}. Pick up where you left off, or read from here instead?`,
    primaryLabel: `Resume Page ${pausedPage}`,
    onPrimary(){ continueReadingFromPause(); },
    secondaryLabel: `Read from Page ${currentPage}`,
    onSecondary(){ startReading(currentPage); }
  });
}
