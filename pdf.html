/* ============================================================
   SAFE OUTPUT SCALE
============================================================ */

function getSafeOutputScale(viewport){

  const dpr = Math.max(1, window.devicePixelRatio || 1);

  let outputScale = dpr;

  const pagePixels = viewport.width * viewport.height;

  if(pagePixels > 0){
    outputScale = Math.min(outputScale, Math.sqrt(MAX_CANVAS_PIXELS / pagePixels));
  }

  if(viewport.width > 0){
    outputScale = Math.min(outputScale, MAX_CANVAS_DIMENSION / viewport.width);
  }

  if(viewport.height > 0){
    outputScale = Math.min(outputScale, MAX_CANVAS_DIMENSION / viewport.height);
  }

  return Math.max(0.35, Math.min(outputScale, dpr));
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(view, scale){

  const viewport = view.page.getViewport({ scale });

  view.viewport = viewport;

  const width = `${viewport.width}px`;
  const height = `${viewport.height}px`;

  view.pageDiv.style.width = width;
  view.pageDiv.style.height = height;

  view.canvas.style.width = width;
  view.canvas.style.height = height;

  view.textLayerDiv.style.width = width;
  view.textLayerDiv.style.height = height;

  view.readHighlightLayerDiv.style.width = width;
  view.readHighlightLayerDiv.style.height = height;

  view.searchLayerDiv.style.width = width;
  view.searchLayerDiv.style.height = height;

  view.linkLayerDiv.style.width = width;
  view.linkLayerDiv.style.height = height;

  view.emailLinkLayerDiv.style.width = width;
  view.emailLinkLayerDiv.style.height = height;

  const userUnit = view.page.userUnit || 1;

  view.textLayerDiv.style.setProperty("--scale-factor", String(viewport.scale));
  view.textLayerDiv.style.setProperty("--user-unit", String(userUnit));
  view.textLayerDiv.style.setProperty("--total-scale-factor", String(viewport.scale * userUnit));

  return viewport;
}

/* ============================================================
   RESET PAGE
============================================================ */

function resetRenderedPage(view){

  view.renderedScale = null;

  try{
    view.canvas.width = 1;
    view.canvas.height = 1;
  }catch{}

  view.textLayerDiv.replaceChildren();
  view.readHighlightLayerDiv.replaceChildren();
  view.searchLayerDiv.replaceChildren();
  view.linkLayerDiv.replaceChildren();
  view.emailLinkLayerDiv.replaceChildren();

  view.textLayer = null;
  view.textLayerEnd = null;

  // The text layer's DOM nodes are being torn down and rebuilt -
  // any cached node references for Read Aloud highlighting are
  // now dangling and must be rebuilt from scratch next time
  // they're needed. The parsed reading blocks themselves
  // (view.readAloudBlocks) don't depend on the DOM, so they're
  // left alone.
  view.readTextIndex = null;
}

/* ============================================================
   CANVAS
============================================================ */

async function paintCanvas(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  const viewport = view.viewport;

  const outputScale = getSafeOutputScale(viewport);

  const pixelWidth = Math.max(1, Math.floor(viewport.width * outputScale));
  const pixelHeight = Math.max(1, Math.floor(viewport.height * outputScale));

  if(pixelWidth > MAX_CANVAS_DIMENSION || pixelHeight > MAX_CANVAS_DIMENSION){
    throw new Error("Safe canvas limit exceeded.");
  }

  view.canvas.width = pixelWidth;
  view.canvas.height = pixelHeight;

  const context = view.canvas.getContext("2d", { alpha:false });

  if(!context){
    throw new Error("Could not create canvas context.");
  }

  context.setTransform(outputScale, 0, 0, outputScale, 0, 0);

  await view.page.render({ canvasContext:context, viewport }).promise;
}

/* ============================================================
   TEXT CONTENT
============================================================ */

async function ensureTextContent(view){

  if(view.textContent){
    return view.textContent;
  }

  view.textContent = await view.page.getTextContent();

  return view.textContent;
}

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  try{

    const textContent = await ensureTextContent(view);

    view.textLayerDiv.replaceChildren();

    const userUnit = view.page.userUnit || 1;

    view.textLayerDiv.style.setProperty("--scale-factor", String(view.viewport.scale));
    view.textLayerDiv.style.setProperty("--user-unit", String(userUnit));
    view.textLayerDiv.style.setProperty("--total-scale-factor", String(view.viewport.scale * userUnit));

    const textLayer = new TextLayer({
      textContentSource: textContent,
      container: view.textLayerDiv,
      viewport: view.viewport
    });

    await textLayer.render();

    if(generation !== renderGeneration){
      return;
    }

    const endOfContent = document.createElement("div");

    endOfContent.className = "endOfContent";

    view.textLayerDiv.append(endOfContent);

    view.textLayerEnd = endOfContent;

    view.textLayerDiv.addEventListener("pointerdown", () => {
      view.textLayerDiv.classList.add("selecting");
    });

    view.textLayer = textLayer;

  }catch(error){
    console.warn(`Text layer failed on page ${view.pageNumber}:`, error);
  }
}

/* ============================================================
   LINKS
============================================================ */

async function paintLinks(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  try{

    if(!view.annotations){
      view.annotations = await view.page.getAnnotations({ intent:"display" });
    }

    renderLinkLayer(view);

  }catch(error){
    console.warn(`Link layer failed on page ${view.pageNumber}:`, error);
  }
}

function renderLinkLayer(view){

  const layer = view.linkLayerDiv;

  layer.replaceChildren();

  if(!Array.isArray(view.annotations)){
    return;
  }

  const viewport = view.viewport;

  for(const annotation of view.annotations){

    if(annotation.subtype !== "Link"){
      continue;
    }

    if(!annotation.rect || annotation.rect.length !== 4){
      continue;
    }

    const rect = viewport.convertToViewportRectangle(annotation.rect);

    const left = Math.min(rect[0], rect[2]);
    const top = Math.min(rect[1], rect[3]);
    const width = Math.abs(rect[2] - rect[0]);
    const height = Math.abs(rect[3] - rect[1]);

    if(width <= 0 || height <= 0){
      continue;
    }

    const link = document.createElement("a");

    link.className = "pdf-link";

    link.style.left = `${left}px`;
    link.style.top = `${top}px`;
    link.style.width = `${width}px`;
    link.style.height = `${height}px`;

    if(annotation.url || annotation.unsafeUrl){

      link.href = annotation.url || annotation.unsafeUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

    }else if(annotation.dest){

      link.href = "#";

      link.addEventListener("click", async event => {
        event.preventDefault();
        event.stopPropagation();

        await openInternalDestination(annotation.dest);
      });

    }else{
      continue;
    }

    layer.appendChild(link);
  }
}

/* ============================================================
   EMAIL LINKS

   Scans a page's text layer for any occurrence of TARGET_EMAIL
   and overlays a clickable mailto: anchor on top of it, using
   the same text-walking approach as search (see
   findTextOccurrences below). Runs after the text layer has
   been painted, since it needs the text layer's DOM nodes.
============================================================ */

async function paintEmailLinks(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  try{

    view.emailLinkLayerDiv.replaceChildren();

    const matches = findTextOccurrences(view, TARGET_EMAIL);

    for(const match of matches){

      for(const rect of match.rects){

        const link = document.createElement("a");

        link.className = "email-link";
        link.href = `mailto:${TARGET_EMAIL}`;
        link.title = `Email ${TARGET_EMAIL}`;

        /*
           Without this, clicking navigates the CURRENT tab/frame to
           a mailto: URI. In an embedded viewer that counts as a
           top-level navigation attempt, which fires beforeunload -
           the same cleanup that runs when actually leaving the
           page - and that cleanup zeroes out every page's canvas,
           which is what was turning the whole PDF black. Handing
           it to a new context (same as the annotation links above)
           avoids touching the current page at all.
        */
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.style.left = `${rect.left}px`;
        link.style.top = `${rect.top}px`;
        link.style.width = `${rect.width}px`;
        link.style.height = `${rect.height}px`;

        link.addEventListener("click", event => {
          event.stopPropagation();
        });

        view.emailLinkLayerDiv.appendChild(link);
      }
    }

  }catch(error){
    console.warn(`Email link layer failed on page ${view.pageNumber}:`, error);
  }
}

/* ============================================================
   PAGE SHELL
============================================================ */

function createPageShell(pageNumber, page){

  const pageDiv = document.createElement("div");

  pageDiv.className = "page";
  pageDiv.dataset.pageNumber = String(pageNumber);

  const canvas = document.createElement("canvas");

  canvas.className = "pageCanvas";

  const textLayerDiv = document.createElement("div");

  textLayerDiv.className = "textLayer";

  const readHighlightLayerDiv = document.createElement("div");

  readHighlightLayerDiv.className = "readHighlightLayer";

  const searchLayerDiv = document.createElement("div");

  searchLayerDiv.className = "searchHighlightLayer";

  const linkLayerDiv = document.createElement("div");

  linkLayerDiv.className = "linkLayer";

  const emailLinkLayerDiv = document.createElement("div");

  emailLinkLayerDiv.className = "emailLinkLayer";

  pageDiv.appendChild(canvas);
  pageDiv.appendChild(textLayerDiv);
  pageDiv.appendChild(readHighlightLayerDiv);
  pageDiv.appendChild(searchLayerDiv);
  pageDiv.appendChild(linkLayerDiv);
  pageDiv.appendChild(emailLinkLayerDiv);

  pagesWrapper.appendChild(pageDiv);

  const view = {
    pageNumber,
    page,
    pageDiv,
    canvas,
    textLayerDiv,
    readHighlightLayerDiv,
    searchLayerDiv,
    linkLayerDiv,
    emailLinkLayerDiv,
    viewport:null,
    textContent:null,
    annotations:null,
    textLayer:null,
    textLayerEnd:null,
    renderedScale:null,
    renderingPromise:null,
    // Read Aloud caches - see the READ ALOUD section below.
    // readAloudBlocks survives a rescale (it's built from
    // scale-independent PDF text, not pixels); readTextIndex does
    // not, since it points at DOM text nodes that get torn down
    // and rebuilt whenever the page is re-rendered.
    readAloudBlocks:null,
    readTextIndex:null
  };

  pageViews[pageNumber - 1] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(view){

  if(!view){
    return;
  }

  const generation = renderGeneration;

  if(view.renderedScale === currentScale){
    return;
  }

  if(view.renderingPromise){
    return view.renderingPromise;
  }

  view.renderingPromise = (async () => {

    try{

      layoutPage(view, currentScale);

      await paintCanvas(view, generation);

      if(generation !== renderGeneration){
        return;
      }

      view.renderedScale = currentScale;

      await Promise.all([
        paintText(view, generation),
        paintLinks(view, generation)
      ]);

      // Email links depend on the text layer's DOM nodes, so this
      // must run after paintText has finished (not in the same
      // Promise.all above).
      await paintEmailLinks(view, generation);

    }catch(error){
      console.warn(`Page ${view.pageNumber} render failed:`, error);
    }finally{
      view.renderingPromise = null;
    }

  })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver = new IntersectionObserver(

  entries => {

    for(const entry of entries){

      if(!entry.isIntersecting){
        continue;
      }

      const view = pageViews.find(candidate => candidate && candidate.pageDiv === entry.target);

      if(view){
        void renderPage(view);
      }
    }

  },

  {
    root:viewer,
    rootMargin:RENDER_MARGIN,
    threshold:0
  }

);

/* ============================================================
   RENDER NEARBY
============================================================ */

function renderNearbyPages(){

  const viewerRect = viewer.getBoundingClientRect();

  for(const view of pageViews){

    if(!view){
      continue;
    }

    const rect = view.pageDiv.getBoundingClientRect();

    if(rect.bottom >= viewerRect.top - 1400 && rect.top <= viewerRect.bottom + 1400){
      void renderPage(view);
    }
  }
}

/* ============================================================
   ENSURE PAGE
============================================================ */

async function ensurePageView(pageNumber){

  if(!pdfDoc || pageNumber < 1 || pageNumber > pdfDoc.numPages){
    return null;
  }

  const existing = pageViews[pageNumber - 1];

  if(existing){
    return existing;
  }

  try{

    const page = await pdfDoc.getPage(pageNumber);

    const view = createPageShell(pageNumber, page);

    layoutPage(view, currentScale);

    pageObserver.observe(view.pageDiv);

    return view;

  }catch(error){
    console.warn(`Could not load page ${pageNumber}:`, error);
    return null;
  }
}

/* ============================================================
   INTERNAL DESTINATIONS
============================================================ */

async function resolveDestination(destination){

  if(!pdfDoc){
    return null;
  }

  try{

    let dest = destination;

    if(typeof dest === "string"){
      dest = await pdfDoc.getDestination(dest);
    }

    if(!Array.isArray(dest) || !dest.length){
      return null;
    }

    const pageRef = dest[0];

    let pageIndex = -1;

    try{
      pageIndex = await pdfDoc.getPageIndex(pageRef);
    }catch{
      if(typeof pageRef === "number"){
        pageIndex = pageRef;
      }
    }

    if(pageIndex < 0 || pageIndex >= pdfDoc.numPages){
      return null;
    }

    return pageIndex;

  }catch{
    return null;
  }
}

async function scrollToView(view){

  if(!view){
    return;
  }

  await renderPage(view);

  const viewerRect = viewer.getBoundingClientRect();
  const pageRect = view.pageDiv.getBoundingClientRect();

  const targetOffset = pageRect.top - viewerRect.top + viewer.scrollTop;

  viewer.scrollTo({
    top: Math.max(0, targetOffset - 8),
    behavior: "smooth"
  });

  pageInput.value = String(view.pageNumber);
}

async function openInternalDestination(destination){

  const pageIndex = await resolveDestination(destination);

  if(pageIndex === null){
    return;
  }

  const view = await ensurePageView(pageIndex + 1);

  if(view){
    await scrollToView(view);
  }
}

/* ============================================================
   READING MODE
============================================================ */

let readingMode = false;

function setReadingMode(enabled){

  readingMode = Boolean(enabled);

  if(readingMode){

    document.body.classList.add("reading-mode");

    readingModeFloat.textContent = "×";
    readingModeFloat.title = "Exit Reading Mode";

    menu.style.display = "none";

    /*
       Reading mode closes the search and TOC popups,
       but does not destroy the search data.
    */

    searchPopup.classList.add("hidden");
    tocPopup.classList.add("hidden");

    /*
       Explicitly remove the normal chrome
       space from the viewer.
    */

    layout.style.top = "0px";
    layout.style.height = "100%";

    loadingOverlay.style.top = "0px";

  }else{

    document.body.classList.remove("reading-mode");

    readingModeFloat.textContent = "▣";
    readingModeFloat.title = "Reading Mode";

    /*
       Let the normal chrome measurement restore
       the correct viewer position.
    */

    layout.style.height = "";
    loadingOverlay.style.top = "";

    scheduleChromeSync();
  }

  requestAnimationFrame(() => {

    renderGeneration++;

    for(const view of pageViews){

      if(!view){
        continue;
      }

      layoutPage(view, currentScale);
      resetRenderedPage(view);
    }

    renderNearbyPages();

    updateSideScroller();

    syncReadBarLift();

  });
}

readingModeFloat.addEventListener("click", event => {
  event.stopPropagation();
  setReadingMode(!readingMode);
});

/* ============================================================
   READ ALOUD

   Reads the paper aloud using the browser's own text-to-speech
   engine (SpeechSynthesis) - the "universal" reader built into
   effectively every modern browser, so nothing extra has to be
   shipped or loaded.

   A PDF's text layer has no semantic tags, so headings,
   citation markers, page numbers, captions, and links are told
   apart from ordinary body text using plain signals already
   present in that text layer (the same data the search feature
   reads from):

     - font size relative to the page's most common ("body")
       size flags headings (bigger) and citation marks (smaller,
       glued onto the end of a word - "governmentA1")
     - a short ALL-CAPS line is also read as a heading, since
       many papers set headings that way regardless of size
     - a short, mostly-italic line on its own is treated as an
       image caption and skipped
     - a bare line of digits (optionally with one leading letter,
       like a lone "E1") is skipped as a page number or footnote
       mark
     - long dot leaders ("......") with a trailing number, as in
       a table of contents, are trimmed off
     - URLs and email addresses are swapped for the spoken word
       "link" instead of being spelled out

   Every kept line also carries a character-by-character map back
   to its exact position in the PDF's own text layer. That map is
   what makes the live highlighting possible: as the browser's
   speech engine reports which word it's saying, that word's
   position in the (cleaned, "link"-ified) spoken text is traced
   back through the map to the real text in the page, and a
   rectangle is drawn there - a soft yellow wash over the whole
   line, a darker box over the exact word.

   This is a best-effort reading of whatever text layer a given
   PDF happens to expose, not a guarantee - but it keeps the
   audio free of citation clutter, page numbers, and raw URLs for
   the overwhelming majority of papers, and it fails safe: if a
   line can't be matched back onto the page for highlighting,
   playback just continues without it rather than stalling.
============================================================ */

const SUPPORTS_SPEECH = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";

if(!SUPPORTS_SPEECH){
  readAloudFloat.style.display = "none";
}

/* ------------------------------------------------------------
   ICONS

   Plain inline SVGs in currentColor, rather than emoji or
   font glyphs - guarantees they're monochrome, crisply centered,
   and a consistent size no matter what font the device has.
------------------------------------------------------------ */

const ICON_SPEAKER =
  '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/>' +
  '<path d="M16.3 8.5a5 5 0 0 1 0 7"/>' +
  '<path d="M19 6a9 9 0 0 1 0 12"/>' +
  '</svg>';

const ICON_PAUSE =
  '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">' +
  '<rect x="6" y="5" width="4" height="14" rx="1"/>' +
  '<rect x="14" y="5" width="4" height="14" rx="1"/>' +
  '</svg>';

const ICON_PLAY =
  '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">' +
  '<path d="M8 5v14l11-7z"/>' +
  '</svg>';

/* ------------------------------------------------------------
   VOICE SELECTION
------------------------------------------------------------ */

let availableVoices = [];

function refreshVoices(){
  try{
    availableVoices = window.speechSynthesis.getVoices() || [];
  }catch{
    availableVoices = [];
  }
}

if(SUPPORTS_SPEECH){

  refreshVoices();

  // Chrome (among others) reports an empty voice list until this
  // fires at least once - refreshing again here is what makes a
  // non-default voice available on the very first read.
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickVoice(){

  if(!availableVoices.length){
    return null;
  }

  const english = availableVoices.filter(voice => /^en/i.test(voice.lang || ""));
  const pool = english.length ? english : availableVoices;

  const enhanced = pool.find(voice => /natural|enhanced|premium|google/i.test(voice.name || ""));

  return enhanced || pool[0];
}

/* ------------------------------------------------------------
   TEXT CLASSIFICATION
------------------------------------------------------------ */

const CITATION_MARK_RE = /^[A-Za-z]{0,2}\d{1,3}$/;
const BARE_NUMBER_LINE_RE = /^[A-Za-z]{0,2}\d{1,4}$/;
const URL_RE = /\bhttps?:\/\/\S+/gi;
const WWW_RE = /\bwww\.\S+\.\S+/gi;
const EMAIL_RE = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g;
const DOT_LEADER_RE = /\.{5,}\s*\d*\s*$/;
const BRACKET_CITE_RE = /^\[[A-Za-z]{1,3}\d{1,3}\]\s*/;

function itemFontSize(item){
  const size = Math.hypot(item.transform[2], item.transform[3]);
  return size > 0.1 ? size : (Math.abs(item.transform[3]) || 1);
}

function isItalicFont(fontName, styles){
  const family = (styles && styles[fontName] && styles[fontName].fontFamily) || "";
  return /italic|oblique/i.test(family) || /italic|oblique/i.test(fontName || "");
}

// Groups the flat item list from getTextContent() into visual
// lines, using pdf.js's own hasEOL flag as the line-break signal.
function groupIntoLines(items){

  const lines = [];
  let current = [];

  for(const item of items){

    if(typeof item.str === "string" && item.str !== ""){
      current.push(item);
    }

    if(item.hasEOL){
      if(current.length){
        lines.push(current);
      }
      current = [];
    }
  }

  if(current.length){
    lines.push(current);
  }

  return lines;
}

function dominantFontSize(lines){

  const counts = new Map();

  for(const line of lines){
    for(const item of line){

      const size = Math.round(itemFontSize(item) * 2) / 2;
      const weight = (item.str || "").trim().length || 1;

      counts.set(size, (counts.get(size) || 0) + weight);
    }
  }

  let bestSize = 12;
  let bestWeight = -1;

  for(const [size, weight] of counts){
    if(weight > bestWeight){
      bestWeight = weight;
      bestSize = size;
    }
  }

  return bestSize || 12;
}

function lineIsItalic(line, styles){

  let italicChars = 0;
  let totalChars = 0;

  for(const item of line){

    const length = (item.str || "").trim().length;

    if(!length){
      continue;
    }

    totalChars += length;

    if(isItalicFont(item.fontName, styles)){
      italicChars += length;
    }
  }

  return totalChars > 0 && (italicChars / totalChars) > 0.6;
}

/* ------------------------------------------------------------
   CHARACTER-MAPPED TEXT CLEANUP

   Everything below builds the spoken text for a line alongside a
   same-length `map` array where map[i] is the character's offset
   in that line's original, uncleaned text (`rawLine`). Dropped
   characters (citation marks) simply have no entry; a
   multi-character replacement like "link" maps every one of its
   characters back to where the original URL started. That map is
   what makes it possible to trace a spoken word back to an exact
   spot in the PDF for highlighting.
------------------------------------------------------------ */

function appendMapped(state, raw){

  for(let k = 0; k < raw.length; k++){

    const ch = raw[k];
    const isSpace = ch === " " || ch === "\t" || ch === "\u00a0";

    if(isSpace){

      if(state.text.length === 0 || state.text[state.text.length - 1] === " "){
        state.rawLine += ch;
        state.rawCursor++;
        continue;
      }

      state.text += " ";
      state.map.push(state.rawCursor);
      state.rawLine += ch;
      state.rawCursor++;
      continue;
    }

    state.text += ch;
    state.map.push(state.rawCursor);
    state.rawLine += ch;
    state.rawCursor++;
  }
}

// Builds the (text, map, rawLine) triple for one visual line,
// dropping small glued-on citation marks as it goes.
function cleanLineMapped(line, bodySize){

  const state = { text:"", map:[], rawLine:"", rawCursor:0 };

  for(const item of line){

    const raw = item.str;

    if(!raw){
      continue;
    }

    const trimmed = raw.trim();
    const isSmall = itemFontSize(item) < bodySize * 0.82;
    const isCitation = isSmall && trimmed && trimmed.length <= 5 && CITATION_MARK_RE.test(trimmed);

    if(isCitation){
      state.rawLine += raw;
      state.rawCursor += raw.length;
      continue;
    }

    appendMapped(state, raw);
  }

  let start = 0;
  let end = state.text.length;

  while(start < end && state.text[start] === " "){
    start++;
  }
  while(end > start && state.text[end - 1] === " "){
    end--;
  }

  return {
    text: state.text.slice(start, end),
    map: state.map.slice(start, end),
    rawLine: state.rawLine
  };
}

function trimMappedStart(text, map, re){
  const match = text.match(re);
  if(match && match.index === 0){
    const cut = match[0].length;
    return { text: text.slice(cut), map: map.slice(cut) };
  }
  return { text, map };
}

function trimMappedEnd(text, map, re){
  const match = text.match(re);
  if(match){
    return { text: text.slice(0, match.index), map: map.slice(0, match.index) };
  }
  return { text, map };
}

// Replaces every URL/email in a mapped (text, map) pair with the
// spoken word "link". The replacement text has no source
// characters of its own, so every character of "link" maps back
// to wherever the original URL started.
function replaceLinksMapped(text, map){

  const spans = [];

  for(const re of [URL_RE, WWW_RE, EMAIL_RE]){

    re.lastIndex = 0;

    let match;

    while((match = re.exec(text))){

      spans.push({ start: match.index, end: match.index + match[0].length });

      if(match[0].length === 0){
        re.lastIndex++;
      }
    }
  }

  if(!spans.length){
    return { text, map };
  }

  spans.sort((a, b) => a.start - b.start);

  const merged = [];

  for(const span of spans){
    const last = merged[merged.length - 1];
    if(last && span.start <= last.end){
      last.end = Math.max(last.end, span.end);
    }else{
      merged.push({ ...span });
    }
  }

  let newText = "";
  const newMap = [];
  let cursor = 0;

  for(const span of merged){

    newText += text.slice(cursor, span.start);
    for(let i = cursor; i < span.start; i++){
      newMap.push(map[i]);
    }

    const anchor = map[span.start] ?? map[cursor] ?? 0;
    const word = "link";

    newText += word;
    for(let i = 0; i < word.length; i++){
      newMap.push(anchor);
    }

    cursor = span.end;
  }

  newText += text.slice(cursor);
  for(let i = cursor; i < text.length; i++){
    newMap.push(map[i]);
  }

  return { text: newText, map: newMap };
}

// Turns one page's raw text items into an ordered list of
// speakable blocks: { type:"heading"|"line", text, map, rawLine }.
// "line" here means one original visual line of the PDF - reading
// at that granularity (rather than merging wrapped lines into
// paragraphs) is what lets the highlight track the exact line
// currently being spoken.
function buildReadableBlocks(textContent){

  const items = (textContent && textContent.items) || [];
  const styles = (textContent && textContent.styles) || {};

  if(!items.length){
    return [];
  }

  const lines = groupIntoLines(items);
  const bodySize = dominantFontSize(lines);

  const blocks = [];

  for(const line of lines){

    const rawJoined = line.map(item => item.str).join("").trim();

    // A line that's nothing but digits (with maybe one stray
    // leading letter) is either a page number or a lone footnote
    // mark sitting on its own line - skip it either way.
    if(rawJoined.length <= 5 && BARE_NUMBER_LINE_RE.test(rawJoined)){
      continue;
    }

    let { text, map, rawLine } = cleanLineMapped(line, bodySize);

    if(!text){
      continue;
    }

    ({ text, map } = trimMappedStart(text, map, BRACKET_CITE_RE));
    ({ text, map } = trimMappedEnd(text, map, DOT_LEADER_RE));
    ({ text, map } = trimMappedStart(text, map, /^\s+/));
    ({ text, map } = trimMappedEnd(text, map, /\s+$/));

    if(!text){
      continue;
    }

    ({ text, map } = replaceLinksMapped(text, map));

    const wordCount = text.split(/\s+/).filter(Boolean).length;
    const letters = text.replace(/[^A-Za-z]/g, "");
    const isAllCaps = letters.length >= 3 && text === text.toUpperCase() && text !== text.toLowerCase();
    const isBigFont = dominantFontSize([line]) >= bodySize * 1.15;
    const endsLikeSentence = /[.!?]["')\]]?$/.test(text);

    if(wordCount <= 12 && (isAllCaps || isBigFont) && !endsLikeSentence){
      blocks.push({ type:"heading", text, map, rawLine });
      continue;
    }

    // A short, mostly-italic line standing alone reads as an
    // image caption in most papers - skip it rather than read it.
    if(wordCount <= 10 && lineIsItalic(line, styles)){
      continue;
    }

    blocks.push({ type:"line", text, map, rawLine });
  }

  return blocks;
}

/* ------------------------------------------------------------
   READING STATE

   currentToken (not a boolean) is what lets an intentionally
   cancelled utterance's "end" event be told apart from a real
   one: every utterance gets its own token, and its onend/onerror
   only act if that token is still the current one. That stays
   correct however cancel() happens to behave (some browsers fire
   "end" on a cancelled utterance, some don't).
------------------------------------------------------------ */

const reading = {
  active:false,
  paused:false,
  pageNumber:1,
  blocks:[],
  blockIndex:0,
  generation:0,
  gapTimer:null,
  currentToken:0
};

let utteranceToken = 0;

const READ_RATE_STEPS = [0.5, 0.75, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const READ_RATE_LABELS = ["0.5×", "0.75×", "1.0×", "1.1×", "1.25×", "1.5×", "1.75×", "2.0×", "2.5×", "3.0×"];
let readRateIndex = 2;

function currentReadRate(){
  return READ_RATE_STEPS[readRateIndex];
}

function updateRateLabel(){

  readAloudRateLabel.textContent = READ_RATE_LABELS[readRateIndex];

  for(const button of readAloudRateMenu.children){
    button.classList.toggle("active", Number(button.dataset.index) === readRateIndex);
  }
}

// Built once, from the same step/label arrays the +/- buttons
// use, so the two controls can never drift out of sync with
// each other.
function buildRateMenu(){

  readAloudRateMenu.replaceChildren();

  READ_RATE_LABELS.forEach((label, index) => {

    const button = document.createElement("button");

    button.type = "button";
    button.textContent = label;
    button.dataset.index = String(index);
    button.setAttribute("role", "menuitemradio");

    button.addEventListener("click", event => {
      event.stopPropagation();
      readRateIndex = index;
      updateRateLabel();
      closeRateMenu();
    });

    readAloudRateMenu.appendChild(button);
  });
}

function openRateMenu(){
  buildRateMenu();
  readAloudRateMenu.classList.remove("hidden");
}

function closeRateMenu(){
  readAloudRateMenu.classList.add("hidden");
}

function toggleRateMenu(){
  if(readAloudRateMenu.classList.contains("hidden")){
    openRateMenu();
  }else{
    closeRateMenu();
  }
}

async function getPageBlocks(view){

  if(view.readAloudBlocks){
    return view.readAloudBlocks;
  }

  try{
    const textContent = await ensureTextContent(view);
    view.readAloudBlocks = buildReadableBlocks(textContent);
  }catch(error){
    console.warn(`Read Aloud: could not read page ${view.pageNumber}:`, error);
    view.readAloudBlocks = [];
  }

  return view.readAloudBlocks;
}

/* ------------------------------------------------------------
   LIVE HIGHLIGHTING

   Reuses the same DOM-Range technique the search feature uses
   (getRelativeRects, defined further down) rather than any of
   pdf.js's internal span layout - so this stays correct however
   the text layer happens to be built. A page's full rendered
   text is only walked once per render (cached on the view as
   readTextIndex) and reused for every line on that page.
------------------------------------------------------------ */

function buildPageTextIndex(view){

  const nodes = getTextNodes(view);

  let fullText = "";
  const positions = [];

  for(const node of nodes){

    const nodeText = node.nodeValue || "";
    const start = fullText.length;

    fullText += nodeText;

    positions.push({ node, start, end: fullText.length });
  }

  return { fullText, positions };
}

function locateOffset(positions, index){

  for(const info of positions){
    if(index >= info.start && index <= info.end){
      return { node: info.node, offset: index - info.start };
    }
  }

  return null;
}

function drawHighlightRects(layer, className, rects){
  for(const rect of rects){
    const el = document.createElement("div");
    el.className = className;
    el.style.left = `${rect.left}px`;
    el.style.top = `${rect.top}px`;
    el.style.width = `${rect.width}px`;
    el.style.height = `${rect.height}px`;
    layer.appendChild(el);
  }
}

const readHighlight = {
  view:null,
  lineAbsStart:-1
};

function clearReadHighlights(){

  for(const view of pageViews){
    if(view?.readHighlightLayerDiv){
      view.readHighlightLayerDiv.replaceChildren();
    }
  }

  readHighlight.view = null;
  readHighlight.lineAbsStart = -1;
}

// Highlights the whole line a block came from, in a soft yellow.
// Failure anywhere here (a line that can't be located, a stale
// DOM reference) is swallowed - a missing highlight should never
// interrupt playback.
function highlightLine(view, block){

  try{

    clearReadHighlights();

    if(!block?.rawLine || !block.rawLine.trim()){
      return;
    }

    if(!view.readTextIndex){
      view.readTextIndex = buildPageTextIndex(view);
    }

    const index = view.readTextIndex;
    const at = index.fullText.indexOf(block.rawLine);

    if(at === -1){
      return;
    }

    const startPos = locateOffset(index.positions, at);
    const endPos = locateOffset(index.positions, at + block.rawLine.length);

    if(!startPos || !endPos){
      return;
    }

    const rects = getRelativeRects(view, startPos.node, startPos.offset, endPos.node, endPos.offset);

    readHighlight.view = view;
    readHighlight.lineAbsStart = at;

    drawHighlightRects(view.readHighlightLayerDiv, "read-line-highlight", rects);

  }catch(error){
    console.warn("Read Aloud: line highlight failed:", error);
  }
}

// Highlights the specific word currently being spoken, using the
// speech engine's own reported charIndex/charLength into the
// block's spoken text, traced back through block.map to the raw
// line and then to the page's DOM.
function highlightWord(block, charIndex, charLength){

  try{

    if(!readHighlight.view || readHighlight.lineAbsStart < 0){
      return;
    }

    if(!block?.map?.length){
      return;
    }

    const from = Math.max(0, Math.min(charIndex, block.map.length - 1));
    const to = Math.max(from, Math.min(charIndex + Math.max(charLength, 1) - 1, block.map.length - 1));

    const rawStart = block.map[from];
    const rawEnd = block.map[to] + 1;

    const index = readHighlight.view.readTextIndex;

    if(!index){
      return;
    }

    const absStart = readHighlight.lineAbsStart + rawStart;
    const absEnd = readHighlight.lineAbsStart + rawEnd;

    const startPos = locateOffset(index.positions, absStart);
    const endPos = locateOffset(index.positions, absEnd);

    if(!startPos || !endPos){
      return;
    }

    const rects = getRelativeRects(readHighlight.view, startPos.node, startPos.offset, endPos.node, endPos.offset);

    const layer = readHighlight.view.readHighlightLayerDiv;

    for(const el of layer.querySelectorAll(".read-word-highlight")){
      el.remove();
    }

    drawHighlightRects(layer, "read-word-highlight", rects);

  }catch(error){
    console.warn("Read Aloud: word highlight failed:", error);
  }
}

/* ------------------------------------------------------------
   SCREEN-AWAKE ROBUSTNESS

   Two independent safety nets so a long reading session doesn't
   get cut short:

   - Screen Wake Lock keeps the display from auto-dimming/locking
     from inactivity while actively reading. This is the one part
     of "keep playing with the screen off" a web page can actually
     guarantee - a wake lock does NOT stop the person from
     manually pressing the power button, and if they do, whether
     speech keeps going after that is entirely up to the phone's
     OS/browser (Android Chrome generally keeps speaking; iOS
     Safari is known to suspend speech synthesis once the screen
     locks or the tab is backgrounded, with no web API able to
     override that).
   - A small periodic pause/resume "nudge" works around a
     long-standing Chrome bug where speech synthesis silently
     stops after ~15 seconds unless kicked like this - harmless on
     browsers that don't have the bug.
------------------------------------------------------------ */

let wakeLockSentinel = null;

async function acquireWakeLock(){

  if(!("wakeLock" in navigator)){
    return;
  }

  try{
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", () => {
      wakeLockSentinel = null;
    });
  }catch(error){
    // Refused (low battery, unsupported context, etc.) - reading
    // still works, the screen just won't be kept awake for it.
    console.warn("Read Aloud: wake lock unavailable:", error);
  }
}

function releaseWakeLock(){
  if(wakeLockSentinel){
    try{
      wakeLockSentinel.release();
    }catch{}
    wakeLockSentinel = null;
  }
}

let keepAliveTimer = null;

function startKeepAlive(){

  stopKeepAlive();

  keepAliveTimer = setInterval(() => {

    if(!reading.active || reading.paused){
      return;
    }

    try{
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }catch{}

  }, 9000);
}

function stopKeepAlive(){
  if(keepAliveTimer){
    clearInterval(keepAliveTimer);
    keepAliveTimer = null;
  }
}

if(SUPPORTS_SPEECH){

  document.addEventListener("visibilitychange", () => {

    if(document.visibilityState !== "visible"){
      return;
    }

    if(!reading.active || reading.paused){
      return;
    }

    void acquireWakeLock();

    // Some browsers silently pause an in-flight utterance when a
    // tab is backgrounded and don't resume it on their own -
    // this is a harmless no-op if playback wasn't actually stuck.
    try{
      window.speechSynthesis.resume();
    }catch{}
  });
}

/* ------------------------------------------------------------
   UI
------------------------------------------------------------ */

function updateReadAloudUI(){

  if(!reading.active){

    readAloudControls.classList.add("hidden");
    closeRateMenu();

    readAloudFloat.classList.remove("active");
    readAloudFloat.innerHTML = ICON_SPEAKER;
    readAloudFloat.title = "Read Aloud";
    readAloudFloat.setAttribute("aria-label", "Read Aloud");

    syncReadBarLift();

    return;
  }

  readAloudControls.classList.remove("hidden");
  readAloudFloat.classList.add("active");

  const totalPages = pdfDoc ? pdfDoc.numPages : reading.pageNumber;

  if(reading.paused){

    readAloudFloat.innerHTML = ICON_PLAY;
    readAloudFloat.title = "Resume Reading";
    readAloudFloat.setAttribute("aria-label", "Resume reading");

    readAloudPlayPause.innerHTML = ICON_PLAY;
    readAloudPlayPause.title = "Resume";
    readAloudPlayPause.setAttribute("aria-label", "Resume reading");

    readAloudStatus.textContent = `Paused – page ${reading.pageNumber} of ${totalPages}`;

  }else{

    readAloudFloat.innerHTML = ICON_PAUSE;
    readAloudFloat.title = "Pause Reading";
    readAloudFloat.setAttribute("aria-label", "Pause reading");

    readAloudPlayPause.innerHTML = ICON_PAUSE;
    readAloudPlayPause.title = "Pause";
    readAloudPlayPause.setAttribute("aria-label", "Pause reading");

    readAloudStatus.textContent = `Reading page ${reading.pageNumber} of ${totalPages}`;
  }

  syncReadBarLift();
}

// Measures the control bar's real, current height and pushes that
// (plus a small gap) into --read-bar-lift so the three floating
// buttons rise to clear it, in both the normal viewer and reflow
// reading mode. Runs after a frame so the bar's just-changed
// visibility has actually been laid out before it's measured.
function syncReadBarLift(){

  requestAnimationFrame(() => {

    if(reading.active && !readAloudControls.classList.contains("hidden")){

      const height = readAloudControls.getBoundingClientRect().height || 52;

      document.documentElement.style.setProperty("--read-bar-lift", `${Math.ceil(height) + 14}px`);

    }else{
      document.documentElement.style.setProperty("--read-bar-lift", "0px");
    }
  });
}

/* ------------------------------------------------------------
   PLAYBACK CONTROL
------------------------------------------------------------ */

function stopUtteranceQuietly(){

  reading.currentToken = -1;

  clearTimeout(reading.gapTimer);
  reading.gapTimer = null;

  try{
    window.speechSynthesis.cancel();
  }catch{}
}

function stopReading(){

  reading.active = false;
  reading.paused = false;
  reading.generation++;

  stopUtteranceQuietly();
  clearReadHighlights();
  stopKeepAlive();
  releaseWakeLock();

  updateReadAloudUI();
}

function pauseReading(){

  if(!reading.active || reading.paused){
    return;
  }

  reading.paused = true;

  stopUtteranceQuietly();
  stopKeepAlive();
  releaseWakeLock();

  updateReadAloudUI();
}

function resumeReading(){

  if(!reading.active || !reading.paused){
    return;
  }

  reading.paused = false;

  updateReadAloudUI();

  void acquireWakeLock();
  startKeepAlive();

  speakCurrentBlock();
}

function speakCurrentBlock(){

  if(!reading.active || reading.paused){
    return;
  }

  if(reading.blockIndex >= reading.blocks.length){
    void advanceToPage(reading.pageNumber + 1);
    return;
  }

  const block = reading.blocks[reading.blockIndex];
  const generation = reading.generation;
  const isHeading = block.type === "heading";

  const speakNow = () => {

    if(generation !== reading.generation || reading.paused || !reading.active){
      return;
    }

    const token = ++utteranceToken;
    reading.currentToken = token;

    const view = pageViews[reading.pageNumber - 1];

    if(view){
      highlightLine(view, block);
    }

    const utterance = new SpeechSynthesisUtterance(block.text);

    utterance.rate = currentReadRate();
    utterance.lang = "en-US";

    const voice = pickVoice();

    if(voice){
      utterance.voice = voice;
    }

    utterance.onboundary = event => {

      if(token !== reading.currentToken){
        return;
      }

      // Some engines also report sentence boundaries on the same
      // event - only act on word-level ones.
      if(event?.name && event.name !== "word"){
        return;
      }

      const length = (typeof event?.charLength === "number" && event.charLength > 0) ? event.charLength : 1;

      highlightWord(block, event?.charIndex || 0, length);
    };

    const handleFinished = () => {

      // A stale or intentionally-cancelled utterance - a real
      // page turn, a pause, a stop - has since replaced this one.
      if(token !== reading.currentToken){
        return;
      }

      if(generation !== reading.generation || reading.paused || !reading.active){
        return;
      }

      reading.blockIndex++;

      const gap = isHeading ? 420 : 45;

      reading.gapTimer = setTimeout(() => {
        if(generation === reading.generation && reading.active && !reading.paused){
          speakCurrentBlock();
        }
      }, gap);
    };

    utterance.onend = handleFinished;

    utterance.onerror = event => {
      // "canceled"/"interrupted" are expected whenever we cut an
      // utterance short on purpose (pause, stop, skip) - only log
      // genuine synthesis failures.
      if(event && event.error !== "canceled" && event.error !== "interrupted"){
        console.warn("Read Aloud: speech synthesis error:", event.error);
      }
      handleFinished();
    };

    try{
      window.speechSynthesis.speak(utterance);
    }catch(error){
      console.warn("Read Aloud: speech synthesis failed:", error);
      stopReading();
    }
  };

  // A short beat before headings, so they land as a small pause
  // in the flow rather than running straight out of the body text.
  if(isHeading){
    reading.gapTimer = setTimeout(speakNow, 320);
  }else{
    speakNow();
  }
}

async function advanceToPage(pageNumber){

  const generation = reading.generation;

  if(!pdfDoc || pageNumber > pdfDoc.numPages){
    stopReading();
    return;
  }

  const view = await ensurePageView(pageNumber);

  if(generation !== reading.generation || !view){
    return;
  }

  await scrollToView(view);

  if(generation !== reading.generation){
    return;
  }

  const blocks = await getPageBlocks(view);

  if(generation !== reading.generation){
    return;
  }

  reading.pageNumber = pageNumber;
  reading.blocks = blocks;
  reading.blockIndex = 0;

  updateReadAloudUI();

  if(!blocks.length){
    // Nothing readable on this page (a cover image, a blank
    // page) - move straight on rather than sitting there silent.
    void advanceToPage(pageNumber + 1);
    return;
  }

  speakCurrentBlock();
}

function startReading(fromPage){

  reading.active = true;
  reading.paused = false;
  reading.generation++;

  updateReadAloudUI();

  void acquireWakeLock();
  startKeepAlive();

  void advanceToPage(fromPage);
}

function skipPage(delta){

  if(!reading.active || !pdfDoc){
    return;
  }

  const target = reading.pageNumber + delta;

  if(target < 1 || target > pdfDoc.numPages){
    return;
  }

  reading.generation++;
  reading.paused = false;

  stopUtteranceQuietly();
  clearReadHighlights();

  void advanceToPage(target);
}

   Mirrors the lock button from image.html: cycling between a

   these two states are offered here (no "horizontal" state,
   since a PDF's natural reading direction is vertical).
============================================================ */

let movementMode = "free";

function setMovementMode(mode){

  movementMode = mode;

  if(movementMode === "vertical"){

    lockButton.textContent = "↕ Vertical";
    lockButton.title = "Vertical-only scrolling (tap to switch to Free)";

    viewer.classList.add("vertical-lock");
