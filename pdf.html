<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PDF Viewer</title>
<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#eee;
  --muted:#aaa;
  --viewer-top:106px;
  --content-bottom-gap:100px;
  --title-bar-height:70px;

  /*
     How far the three stacked floating buttons lift above their
     normal resting spot to clear the Read Aloud control bar.
     0px (their normal position) until reading starts; syncReadBarLift()
     sets it to the bar's real measured height whenever the bar
     is visible, in either the normal viewer or reflow reading mode.
  */
  --read-bar-lift:0px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;

  /*
     overflow:hidden alone doesn't reliably stop a mobile browser
     from natively panning the whole page when a touch-scroll
     gesture starts inside a nested scrollable element (like
     #viewer, which scrolls both directions once you're zoomed
     in). That outer pan is what was dragging position:fixed
     elements - the side scroller, the toolbar, the floating
     buttons - off screen along with it. Pinning html/body in
     place removes the outer page entirely as something that can
     ever move: the only scrolling left possible is #viewer's own
     contained overflow:auto box, and position:fixed elements have
     nothing left to be dragged along with.
  */
  position:fixed;
  top:0;
  left:0;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;

  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 8px;

  background:#1b1b1b;

  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  scroll-behavior:auto;

  overscroll-behavior:contain;

  /*
     Explicitly declaring pan-x pan-y (rather than leaving this
     undeclared, which defaults to touch-action:auto) is what makes
     single-finger scrolling smooth. With auto, the browser can't
     commit a touch gesture to the fast compositor-thread scroll
     path - it has to wait on every frame to see whether our pointer
     handlers (used below for pinch detection) are about to call
     preventDefault(). Declaring the allowed pan axes up front lets
     it skip that check and start scrolling immediately. touch-
     action:none while pinching (see .pinching below) is the
     deliberate exception - a real two-finger gesture SHOULD be
     fully handed to JS, with no native scrolling racing against it.
  */
  touch-action:pan-x pan-y;

  /*
     The custom draggable #sideScroller is the only scrollbar we
     want visible - the browser's native one is hidden here so
     there's never a second, tiny, hard-to-grab slider alongside it.
  */
  scrollbar-width:none;
  -ms-overflow-style:none;
}

#viewer::-webkit-scrollbar{
  display:none;
}

#viewer.pinching{
  touch-action:none;
}

/*
   #pagesWrapper carries the centering layout that #viewer used to
   apply directly. Splitting it out gives pinch zoom something it
   can apply a live CSS transform to (scale only, no layout cost,
   fully GPU-composited) without that transform having to fight
   #viewer's own scroll/overflow box. #viewer itself never gets a
   transform - it stays a plain scrollable frame throughout.

   Width is NOT left at 100% - it's set explicitly in px by
   updateWrapperWidth() (see the ZOOM section) to
   max(viewer's inner width, widest page's width). That, plus plain
   block layout instead of a centering flexbox, is deliberate: a
   flex container centering a child that's wider than itself
   silently falls back to flex-start alignment (the CSS "safe
   alignment" overflow rule - centering something too big to keep
   scrollable would hide part of it, so the browser un-centers it
   instead). That fallback used to happen invisibly right as a page
   grew past the viewer's width, which is exactly the moment
   rescaleAndRender's anchor math needs the coordinate space to stay
   continuous - so it would silently drift off-center from that
   point on. Giving pagesWrapper an explicit width means .page's own
   margin:auto centers it in a perfectly ordinary, non-overflowing
   block box (no safe-alignment fallback possible), and #viewer just
   scrolls over however much of pagesWrapper doesn't fit - a plain,
   predictable, symmetric scroll range either way.
*/
#pagesWrapper{
  width:100%;

  transform-origin:0 0;
}

/*
   Vertical-lock mode: the movement lock button constrains free
   panning/scrolling to the vertical axis only. Horizontal
   overflow is hidden and touch-action is limited to vertical
   panning so a diagonal swipe can't drag the page sideways.
*/
#viewer.vertical-lock{
  overflow-x:hidden;
  touch-action:pan-y;
}

/*
   While a two-finger pinch is in progress, hand touch handling
   entirely to our own pointer listeners rather than letting the
   browser interpret it as a scroll/pan gesture.
*/
#viewer.pinching{
  touch-action:none;
}

/* ============================================================
   PDF PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:
    0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;

  pointer-events:none;

  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;

  align-items:center;

  white-space:nowrap;
}

button,
input{
  background:#292929;

  color:#fff;

  border:1px solid #383838;

  border-radius:6px;

  padding:6px 9px;

  font:inherit;

  outline:none;
}

button:hover{
  background:#353535;

  cursor:pointer;
}

button:active{
  background:#414141;
}

button:focus-visible,
input:focus-visible{
  border-color:#666;

  outline:1px solid #555;
}

/* ============================================================
   COMPACT TOOLBAR CONTROLS
============================================================ */

.toolButton{
  height:32px;

  padding:0 10px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  white-space:nowrap;

  font-size:13px;

  border-radius:6px;
}

#searchButton{
  width:32px;

  padding:0;
}

#searchButton svg{
  display:block;
}

.iconButton{
  width:32px;
  height:32px;

  padding:0;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  border-radius:6px;
}

/* ============================================================
   ZOOM
============================================================ */

.zoomControls{
  display:flex;

  align-items:center;

  gap:3px;

  height:32px;

  padding:0 3px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;
}

.zoomControls button{
  width:29px;
  height:28px;

  padding:0;

  border:0;

  background:transparent;

  font-size:17px;

  display:flex;

  align-items:center;

  justify-content:center;
}

.zoomControls button:hover{
  background:#353535;
}

#zoomPercent{
  width:58px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

/* ============================================================
   PAGE CONTROLS
============================================================ */

.pageControls{
  display:flex;

  align-items:center;

  gap:4px;

  height:32px;

  padding:0 6px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;

  white-space:nowrap;
}

.pageControls label{
  color:#aaa;

  font-size:12px;
}

#pageNumber{
  width:43px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

#pageCount{
  color:#999;

  font-size:12px;

  padding-right:2px;
}

/* ============================================================
   TOOLBAR DIVIDER
============================================================ */

.toolbarDivider{
  width:1px;

  height:22px;

  background:#383838;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:#181818;

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;
}

#title{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:14px;

  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.title-text{
  order:1;

  position:relative;

  display:inline-block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.title-badges{
  order:2;

  display:inline-flex;

  gap:8px;

  vertical-align:middle;

  flex-shrink:0;
}

.title-badge{
  display:inline-block;

  padding:4px 10px;

  color:#fff;

  font-size:.72em;

  font-weight:bold;

  border-radius:999px;

  text-transform:uppercase;

  letter-spacing:.5px;

  flex-shrink:0;
}

.title-badge.new{
  background:#00b050;
}

.title-badge.featured{
  background:#2f7cff;
}

/* ============================================================
   MENU
============================================================ */

#menu{
  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{
  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   SEARCH POPUP
============================================================ */

#searchPopup{
  position:fixed;

  top:108px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:6px;

  padding:8px;

  background:#222;

  border:1px solid #444;

  border-radius:9px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.45);

  z-index:6500;
}

#searchPopup.hidden{
  display:none;
}

#searchPopup input{
  width:230px;

  height:34px;

  background:#181818;

  border-color:#3b3b3b;

  font-size:13px;
}

#searchPopup input.searching{
  border-color:#4c82c7;
}

/* ============================================================
   LARGE SEARCH NAVIGATION BUTTONS
============================================================ */

#searchPopup .searchNavButton{

  width:42px;
  min-width:42px;

  height:40px;
  min-height:40px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:7px;

  font-size:20px;

  line-height:1;

  font-weight:bold;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

#searchPopup .searchNavButton:hover{
  background:#353535;
}

#searchPopup .searchNavButton:active{
  background:#414141;

  transform:scale(.96);
}

#searchPopup .searchNavButton:disabled{
  opacity:.4;

  cursor:default;
}

#searchResults{
  color:#aaa;

  min-width:70px;

  text-align:center;

  font-size:12px;

  white-space:nowrap;
}

/* ============================================================
   TABLE OF CONTENTS BUTTON
============================================================ */

#tocButton.toc-empty{
  opacity:.55;
}

/* ============================================================
   TABLE OF CONTENTS POPUP

   Covers the whole PDF-viewing area (not just a small dropdown):
   the same footprint as #layout normally, or the entire screen
   while in reading mode (see the reading-mode override below).
============================================================ */

#tocPopup{
  position:fixed;

  top:var(--viewer-top);
  left:0;
  right:0;

  /*
     Meets the title bar exactly, flush - no gap above it, but no
     overlap either. The floating TOC/reading-mode buttons sit
     further up (see their own title-bar-tracking offsets), so
     they're still well within this panel's covered area and get
     hidden underneath it regardless.
  */
  bottom:var(--title-bar-height);

  display:flex;
  flex-direction:column;

  /*
     The popup itself doesn't scroll - #tocContent (below) does,
     so the "Table of Contents" heading and close button stay
     pinned in view.
  */
  overflow:hidden;

  padding:14px 16px;

  background:#1b1b1b;

  border:0;
  border-top:1px solid #333;

  box-shadow:
    0 -6px 24px rgba(0,0,0,.5);

  /*
     Higher than the floating TOC/reading-mode buttons (z-index
     9000), so the panel visually and functionally covers them
     while it's open - they can't be tapped underneath it. The
     only ways out are the X button or picking an entry.
  */
  z-index:9500;
}

body.reading-mode #tocPopup{

  top:0;
  bottom:0;

  border-top:0;
}

#tocPopup.hidden{
  display:none;
}

#tocHeader{
  flex:0 0 auto;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;

  padding-bottom:10px;

  border-bottom:1px solid #333;
}

#tocHeader h3{
  margin:0;

  padding:0;

  font-size:16px;

  color:#eee;
}

#tocCloseBtn{
  width:32px;
  height:32px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border-radius:7px;

  font-size:16px;
}

#tocContent{
  flex:1 1 auto;

  /*
     min-height:0 is what actually lets a flex child shrink below
     its content size instead of forcing the parent to grow -
     without it this would ignore the popup's height.
  */
  min-height:0;

  overflow-y:auto;
}

.tocEmptyMessage{
  padding:8px 4px;

  color:#aaa;

  font-size:13px;

  line-height:1.4;
}

.tocList,
.tocList ul{
  margin:0;

  padding-left:0;

  list-style:none;
}

.tocList ul{
  padding-left:16px;
}

.tocList li{
  margin:2px 0;
}

.tocList button{
  width:100%;

  padding:9px 8px;

  display:flex;

  align-items:baseline;

  justify-content:space-between;

  gap:10px;

  text-align:left;

  background:transparent;

  border:0;

  border-radius:6px;

  cursor:pointer;

  /*
     Depth-tiered typography (see the nested overrides below):
     top-level entries read as headings, and each deeper level of
     nesting steps the size/weight/color down, so the outline's
     hierarchy is visible at a glance without expand/collapse UI.
  */
  font-size:15px;
  font-weight:600;
  color:#f0f0f0;
}

.tocList button:hover{
  background:#2c2c2c;
}

/* Depth 2 */
.tocList .tocList button{
  font-size:13.5px;
  font-weight:400;
  color:#dcdcdc;
}

/* Depth 3 */
.tocList .tocList .tocList button{
  font-size:12.5px;
  font-weight:400;
  color:#b8b8b8;
}

/* Depth 4 and beyond */
.tocList .tocList .tocList .tocList button{
  font-size:11.5px;
  font-weight:400;
  color:#999;
}

.tocItemTitle{
  flex:1 1 auto;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.tocItemPage{
  flex:0 0 auto;

  color:#888;

  font-size:12px;
}

.tocLabelOnly{
  padding:9px 8px;

  color:#999;

  font-size:15px;
  font-weight:600;
}

.tocList .tocList .tocLabelOnly{
  font-size:13.5px;
  font-weight:400;
}

.tocList .tocList .tocList .tocLabelOnly{
  font-size:12.5px;
  font-weight:400;
}

.tocList .tocList .tocList .tocList .tocLabelOnly{
  font-size:11.5px;
  font-weight:400;
}

/* ============================================================
   SIDE SCROLLER

   A draggable scrollbar handle running down the left edge of
   the screen. Only shown once the document is actually taller
   than the viewport. Dragging the thumb scrolls the document
   proportionally; clicking elsewhere on the track jumps there.
============================================================ */

#sideScroller{
  position:fixed;

  top:calc(var(--viewer-top) + 10px);
  left:4px;
  bottom:var(--content-bottom-gap);

  width:24px;

  display:none;

  align-items:stretch;
  justify-content:center;

  z-index:4000;

  touch-action:none;
}

body.reading-mode #sideScroller{

  top:16px;
  bottom:16px;
}

#sideScrollerTrack{
  position:relative;

  width:10px;
  height:100%;

  background:
    rgba(255,255,255,.06);

  box-shadow:
    0 0 0 1px rgba(0,0,0,.2);

  border-radius:5px;

  cursor:pointer;
}

#sideScrollerThumb{
  position:absolute;

  left:0;

  width:10px;

  min-height:34px;

  border-radius:5px;

  background:
    rgba(255,255,255,.5);

  /*
     A dark outline + shadow so the thumb reads against light PDF
     pages too - plain translucent white alone washes out over a
     white page and the bar effectively disappears.
  */
  box-shadow:
    0 0 0 1px rgba(0,0,0,.45),
    0 1px 3px rgba(0,0,0,.35);

  cursor:grab;

  touch-action:none;

  transition:background .12s ease;
}

#sideScrollerThumb:hover{
  background:
    rgba(255,255,255,.7);
}

#sideScrollerThumb.dragging{
  background:
    rgba(255,255,255,.85);

  cursor:grabbing;
}

/* ============================================================
   SIDE SCROLLER PAGE BADGE

   Floats to the right of the draggable thumb while dragging (or
   while pressing the track), showing which page you'd land on -
   like a tooltip that tracks the thumb's vertical position.
============================================================ */

#sideScrollerPageBadge{
  position:absolute;

  left:100%;

  margin-left:8px;

  padding:5px 10px;

  background:
    rgba(30,30,30,.95);

  border:1px solid #444;

  border-radius:6px;

  color:#fff;

  font-size:13px;
  font-weight:bold;

  white-space:nowrap;

  pointer-events:none;

  opacity:0;

  transform:translateY(-50%);

  transition:opacity .12s ease;

  z-index:4100;

  box-shadow:
    0 4px 12px rgba(0,0,0,.4);
}

#sideScrollerPageBadge.visible{
  opacity:1;
}

/* ============================================================
   PDF.JS TEXT LAYER
============================================================ */

.textLayer{
  color-scheme:only light;

  position:absolute;

  text-align:initial;

  inset:0;

  overflow:clip;

  opacity:1;

  line-height:1;

  letter-spacing:normal;

  word-spacing:normal;

  text-size-adjust:none;

  forced-color-adjust:none;

  transform-origin:0 0;

  caret-color:CanvasText;

  z-index:2;

  pointer-events:auto;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;

  -webkit-touch-callout:default;

  --min-font-size:1;

  --text-scale-factor:
    calc(
      var(--total-scale-factor) *
      var(--min-font-size)
    );

  --min-font-size-inv:
    calc(
      1 /
      var(--min-font-size)
    );

  --scale-factor:1;

  --user-unit:1;

  --total-scale-factor:1;
}

.textLayer span,
.textLayer br{
  color:transparent;

  position:absolute;

  white-space:pre;

  cursor:text;

  transform-origin:0% 0%;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;
}

.textLayer > :not(.markedContent),
.textLayer .markedContent span:not(.markedContent){

  z-index:1;

  --font-height:0;

  font-size:
    calc(
      var(--text-scale-factor) *
      var(--font-height)
    );

  --scale-x:1;

  --rotate:0deg;

  transform:
    rotate(var(--rotate))
    scaleX(var(--scale-x))
    scale(var(--min-font-size-inv));
}

.textLayer .markedContent{
  display:contents;
}

.textLayer span[role="img"]{
  user-select:none;

  -webkit-user-select:none;

  cursor:default;
}

.textLayer ::selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer ::-moz-selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer br::selection{
  background:transparent;
}

.textLayer .endOfContent{
  display:block;

  position:absolute;

  inset:100% 0 0;

  z-index:0;

  cursor:default;

  user-select:none;

  -webkit-user-select:none;
}

.textLayer.selecting .endOfContent{
  top:0;
}

/* ============================================================
   SEARCH HIGHLIGHTS
============================================================ */

.searchHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:3;

  pointer-events:none;
}

.search-highlight{

  position:absolute;

  background:
    rgba(0,125,255,.30);

  border-radius:2px;

  box-shadow:
    0 0 0 1px
    rgba(0,100,230,.10);

  pointer-events:none;

  transition:
    background .12s ease,
    box-shadow .12s ease;
}

.search-highlight.search-current{

  background:
    rgba(0,105,255,.48);

  box-shadow:
    0 0 0 1px
    rgba(0,80,220,.30);
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;

  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   EMAIL LINK LAYER

   Overlays clickable mailto: links on top of any occurrence of
   a specific email address found in the PDF's text layer. This
   sits above the ordinary annotation link layer since it is
   derived from plain text rather than a native PDF link
   annotation.
============================================================ */

.emailLinkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:5;

  pointer-events:none;
}

.email-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  /*
     Looks like an ordinary link - a thin blue underline, no fill -
     rather than a highlighted block, since it's sitting on top of
     text that's already rendered black by the page itself.
  */
  background:transparent;

  border:0;
  border-bottom:1.5px solid rgba(59,130,246,.85);

  padding:0;

  margin:0;

  text-decoration:none;
}

.email-link:hover{
  background:
    rgba(59,130,246,.12);
}

/* ============================================================
   READ ALOUD HIGHLIGHTS

   Sits just above the rendered page image but below the (invisible)
   text/search/link layers, so it never blocks selection or link
   taps. Two boxes at once: a soft yellow wash over the whole line
   currently being spoken, plus a smaller, more saturated box over
   the exact word the speech engine reports it's on right now.
============================================================ */

.readHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:1;

  pointer-events:none;
}

.read-line-highlight{
  position:absolute;

  background:
    rgba(255, 224, 60, .35);

  border-radius:3px;

  pointer-events:none;
}

.read-word-highlight{
  position:absolute;

  background:
    rgba(255, 176, 0, .65);

  border-radius:2px;

  box-shadow:
    0 0 0 1px rgba(200,120,0,.4);

  pointer-events:none;
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

/* ============================================================
   FLOATING READING MODE
============================================================ */

#readingModeFloat{

  position:fixed;

  right:18px;

  /*
     Tracks the title bar's actual current height (same variable
     the side scroller uses) instead of a fixed guess, so it lines
     up with the title bar whether it's one line or two. The
     added --read-bar-lift term is normally 0px, and only becomes
     nonzero while the Read Aloud control bar is docked, so this
     button (and the two stacked above it) rise together to clear it.
  */
  bottom:calc(var(--content-bottom-gap) + var(--read-bar-lift));

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:
    rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#readingModeFloat:hover{
  background:#3a3a3a;

  transform:scale(1.05);
}

#readingModeFloat:active{
  transform:scale(.96);
}

/* ============================================================
   FLOATING TABLE OF CONTENTS

   Stacked directly above the reading-mode button, in the same
   circular-button style, and deliberately NOT inside #toolbar -
   it stays visible (and tappable) even in reading mode, which is
   the whole point: it's the only chrome that survives there.
============================================================ */

#tocButton{

  position:fixed;

  right:18px;

  /*
     Stacked directly above the reading-mode button: its own
     bottom offset (the title-bar-tracking gap) plus that
     button's height and a small spacer between them.
  */
  bottom:calc(var(--content-bottom-gap) + 58px + var(--read-bar-lift));

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:
    rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:12px;
  font-weight:bold;
  letter-spacing:.5px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#tocButton:hover{
  background:#3a3a3a;

  transform:scale(1.05);
}

#tocButton:active{
  transform:scale(.96);
}

body.reading-mode #tocButton{

  right:16px;

  bottom:calc(74px + var(--read-bar-lift));

  background:
    rgba(40,40,40,.88);
}

/* ============================================================
   FLOATING READ ALOUD BUTTON

   Third button in the same stacked, circular-button family as
   #readingModeFloat and #tocButton above (same size, same dark
   glass look). Kept monochrome on purpose - a plain glyph in
   currentColor, no colored emoji - so it reads as part of the
   same icon set instead of standing out.
============================================================ */

#readAloudFloat{

  position:fixed;

  right:18px;

  /*
     Stacked directly above the table-of-contents button: two
     button-heights plus their spacers above the base gap.
  */
  bottom:calc(var(--content-bottom-gap) + 116px + var(--read-bar-lift));

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:
    rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:17px;
  line-height:1;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#readAloudFloat:hover{
  background:#3a3a3a;

  transform:scale(1.05);
}

#readAloudFloat:active{
  transform:scale(.96);
}

#readAloudFloat.active{
  border-color:#7a7a7a;

  background:
    rgba(60,60,60,.96);
}

body.reading-mode #readAloudFloat{

  right:16px;

  bottom:calc(132px + var(--read-bar-lift));

  background:
    rgba(40,40,40,.88);
}

/* ============================================================
   READ ALOUD CONTROL BAR

   A compact "now playing" bar, docked just above the title bar
   (mirrors #searchPopup's panel styling), that appears only
   while reading is active. It survives the reflow reading mode
   the same way the floating buttons do, since it's not covered
   by that mode's chrome-hiding rule.
============================================================ */

#readAloudControls{
  position:fixed;

  left:50%;

  bottom:calc(var(--title-bar-height) + 12px);

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:8px;

  max-width:calc(100% - 24px);

  padding:8px 10px;

  background:#222;

  border:1px solid #444;

  border-radius:11px;

  box-shadow:
    0 8px 24px rgba(0,0,0,.5);

  z-index:6500;
}

#readAloudControls.hidden{
  display:none;
}

body.reading-mode #readAloudControls{
  bottom:16px;
}

.readAloudBtn{
  width:36px;
  height:36px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border-radius:8px;

  font-size:16px;
  line-height:1;
}

#readAloudPlayPause{
  width:40px;
  height:40px;

  font-size:17px;
}

#readAloudRate{
  position:relative;

  display:flex;

  align-items:center;

  gap:2px;

  height:36px;

  padding:0 2px;

  background:#181818;

  border:1px solid #3b3b3b;

  border-radius:8px;

  flex:0 0 auto;
}

#readAloudRate button{
  width:26px;
  height:30px;

  padding:0;

  border:0;

  background:transparent;

  font-size:14px;
}

#readAloudRateLabel{
  min-width:38px;

  padding:0 2px;

  text-align:center;

  font-size:12px;

  color:#ddd;

  cursor:pointer;

  border-radius:5px;
}

#readAloudRateLabel:hover{
  background:#2c2c2c;
}

/* ============================================================
   READ ALOUD SPEED PRESET MENU

   Opens above the rate control when its label is tapped, so a
   specific speed can be picked directly instead of stepping to
   it one +/- tap at a time.
============================================================ */

#readAloudRateMenu{
  position:absolute;

  left:50%;
  bottom:calc(100% + 8px);

  transform:translateX(-50%);

  display:flex;
  flex-direction:column;

  gap:2px;

  padding:6px;

  background:#222;

  border:1px solid #444;

  border-radius:9px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.5);

  z-index:6600;
}

#readAloudRateMenu.hidden{
  display:none;
}

#readAloudRateMenu button{
  width:64px;

  padding:6px 8px;

  border:0;

  border-radius:6px;

  background:transparent;

  color:#ddd;

  font-size:13px;

  text-align:center;
}

#readAloudRateMenu button:hover{
  background:#333;
}

#readAloudRateMenu button.active{
  background:#2f7cff;

  color:#fff;
}

#readAloudStatus{
  min-width:0;

  padding:0 2px;

  color:#aaa;

  font-size:12px;

  line-height:1.25;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* ============================================================
   READ ALOUD START CHOICE

   A small centered confirmation card - "start from the
   beginning, or from here?" - shown only when the person isn't
   already on page 1. Styled as a simple modal so it reads as a
   deliberate question rather than a menu.
============================================================ */

#readAloudChoice{
  position:fixed;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.55);

  z-index:9800;
}

#readAloudChoice.hidden{
  display:none;
}

#readAloudChoiceCard{
  width:100%;
  max-width:320px;

  padding:20px;

  background:#1e1e1e;

  border:1px solid #3a3a3a;

  border-radius:13px;

  box-shadow:
    0 12px 32px rgba(0,0,0,.55);

  text-align:center;
}

#readAloudChoiceCard h3{
  margin:0 0 8px;

  font-size:16px;

  color:#fff;
}

#readAloudChoiceCard p{
  margin:0 0 16px;

  color:#bbb;

  font-size:13px;

  line-height:1.45;
}

.readAloudChoiceButtons{
  display:flex;

  flex-direction:column;

  gap:8px;
}

.readAloudChoiceButtons button{
  width:100%;

  padding:11px 10px;

  font-size:14px;

  border-radius:8px;
}

#readAloudFromCurrent{
  background:#2f7cff;

  border-color:#2f7cff;
}

#readAloudFromCurrent:hover{
  background:#4a8dff;
}

#readAloudChoiceCancel{
  margin-top:2px;

  background:transparent;

  border:0;

  color:#999;

  font-size:12px;

  padding:6px;
}

#readAloudChoiceCancel:hover{
  color:#ccc;

  background:transparent;
}

/* ============================================================
   READING MODE
============================================================ */

/*
   Reading mode completely removes the normal viewer chrome.
   The elements are not merely visually hidden; their height,
   padding, borders, and spacing are also collapsed.
*/

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{

  display:none !important;

  height:0 !important;

  min-height:0 !important;

  max-height:0 !important;

  margin:0 !important;

  padding:0 !important;

  border:0 !important;

  overflow:hidden !important;
}

body.reading-mode #layout{

  top:0 !important;

  height:100% !important;

  position:absolute;
}

body.reading-mode #viewer{

  height:100%;

  padding-top:20px;

  padding-bottom:20px;
}

body.reading-mode #loadingOverlay{

  inset:0;
}

body.reading-mode #readingModeFloat{

  right:16px;

  bottom:calc(16px + var(--read-bar-lift));

  background:
    rgba(40,40,40,.88);
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #toolbar{
    justify-content:center;

    gap:4px;

    padding:5px;
  }

  .toolButton{
    height:30px;

    padding:0 8px;

    font-size:12px;
  }

  #searchButton{
    width:30px;

    padding:0;
  }

  .zoomControls{
    height:30px;
  }

  .zoomControls button{
    width:27px;

    height:26px;
  }

  #zoomPercent{
    width:53px;

    height:25px;
  }

  .pageControls{
    height:30px;

    padding:0 5px;
  }

  #pageNumber{
    width:40px;

    height:25px;
  }

  #searchPopup{

    left:8px;
    right:8px;

    top:104px;

    transform:none;

    width:auto;

    flex-wrap:wrap;

    justify-content:center;

    gap:6px;
  }

  #searchPopup input{

    flex:1 1 100%;

    width:100%;

    min-width:0;

    height:36px;
  }

  #searchPopup .searchNavButton{

    width:48px;
    min-width:48px;

    height:44px;
    min-height:44px;

    font-size:21px;
  }

  #searchResults{

    flex:1;

    min-width:80px;
  }

  #sideScrollerTrack,
  #sideScrollerThumb{

    width:14px;
  }

  #readingModeFloat{

    right:14px;

    bottom:calc(var(--content-bottom-gap) + var(--read-bar-lift));

    width:46px;
    height:46px;

    font-size:16px;
  }

  body.reading-mode #readingModeFloat{

    right:12px;

    bottom:calc(12px + var(--read-bar-lift));
  }

  #tocButton{

    right:14px;

    bottom:calc(var(--content-bottom-gap) + 56px + var(--read-bar-lift));

    width:46px;
    height:46px;

    font-size:11px;
  }

  body.reading-mode #tocButton{

    right:12px;

    bottom:calc(68px + var(--read-bar-lift));
  }

  #readAloudFloat{

    right:14px;

    bottom:calc(var(--content-bottom-gap) + 112px + var(--read-bar-lift));

    width:46px;
    height:46px;
  }

  body.reading-mode #readAloudFloat{

    right:12px;

    bottom:calc(124px + var(--read-bar-lift));
  }

  #readAloudControls{

    left:8px;
    right:8px;

    bottom:calc(var(--title-bar-height) + 8px);

    transform:none;

    max-width:none;

    flex-wrap:wrap;

    justify-content:center;
  }

  #readAloudStatus{

    order:5;

    flex:1 1 100%;

    text-align:center;

    white-space:normal;
  }

  .title-badges{

    display:flex;

    justify-content:center;

    gap:8px;
  }

  #title{

    flex-direction:column;

    align-items:center;

    gap:6px;
  }

  .title-text{

    order:1;

    width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .title-badges{

    order:2;
  }
}

/* ============================================================
   ANIMATION
============================================================ */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

</style>

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc = "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params = new URLSearchParams(location.search);

const file = decodeURIComponent(params.get("file") || "");
const title = decodeURIComponent(params.get("paper") || "PDF");
const returnPage = decodeURIComponent(params.get("return") || "index.html");

/* ============================================================
   ELEMENTS
============================================================ */

const header = document.querySelector("header");
const toolbar = document.getElementById("toolbar");
const viewer = document.getElementById("viewer");
const pagesWrapper = document.getElementById("pagesWrapper");
const layout = document.getElementById("layout");
const loadingOverlay = document.getElementById("loadingOverlay");
const pageInput = document.getElementById("pageNumber");
const zoomBox = document.getElementById("zoomPercent");
const searchPopup = document.getElementById("searchPopup");
const searchBox = document.getElementById("searchBox");
const searchResultsLabel = document.getElementById("searchResults");
const prevResultBtn = document.getElementById("prevResult");
const nextResultBtn = document.getElementById("nextResult");
const menu = document.getElementById("menu");
const menuButton = document.getElementById("menuBtn");
const readingModeFloat = document.getElementById("readingModeFloat");
const tocButton = document.getElementById("tocButton");
const tocPopup = document.getElementById("tocPopup");
const tocContent = document.getElementById("tocContent");
const tocCloseBtn = document.getElementById("tocCloseBtn");
const sideScroller = document.getElementById("sideScroller");
const sideScrollerTrack = document.getElementById("sideScrollerTrack");
const sideScrollerThumb = document.getElementById("sideScrollerThumb");
const sideScrollerPageBadge = document.getElementById("sideScrollerPageBadge");
const titleBar = document.getElementById("titleBar");
const lockButton = document.getElementById("lockButton");
const readAloudFloat = document.getElementById("readAloudFloat");
const readAloudControls = document.getElementById("readAloudControls");

/* ============================================================
   CHROME HEIGHT
============================================================ */

function syncViewerTop(){

  if(document.body.classList.contains("reading-mode")){
    return;
  }

  const headerHeight = header.getBoundingClientRect().height;
  const toolbarHeight = toolbar.getBoundingClientRect().height;
  const total = Math.ceil(headerHeight + toolbarHeight);

  document.documentElement.style.setProperty("--viewer-top", `${total}px`);

  layout.style.top = `${total}px`;
  loadingOverlay.style.top = `${total}px`;
}

/*
   The title bar's height isn't fixed - a long title can wrap
   onto a second line, and the NEW/FEATURED badges can add a row
   on mobile. The side scroller and the floating buttons stop
   just above it (--content-bottom-gap, with a small buffer), and
   the TOC popup meets it exactly flush with no gap and no overlap
   (--title-bar-height, no buffer) - both track its real, current
   height instead of a guessed constant.
*/
function syncBottomGap(){

  if(document.body.classList.contains("reading-mode")){
    return;
  }

  const titleBarHeight = titleBar.getBoundingClientRect().height;

  document.documentElement.style.setProperty("--content-bottom-gap", `${Math.ceil(titleBarHeight) + 16}px`);

  /*
     Floored, not ceil'd: this offset is how far the TOC popup's
     bottom edge sits from the viewport bottom. Rounding up can
     push that edge a fraction of a pixel above the title bar's
     real top edge, exposing a hairline gap. Rounding down instead
     lands it at-or-inside the title bar, which is invisible since
     the title bar's z-index is far below the popup's.
  */
  document.documentElement.style.setProperty("--title-bar-height", `${Math.floor(titleBarHeight)}px`);
}

function scheduleChromeSync(){
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      syncViewerTop();
      syncBottomGap();
    });
  });
}

    .replaceAll('"', "&quot;")

}

/* ============================================================
   VIEWPORT SIZING
============================================================ */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;

function getViewerInnerWidth(){
  const styles = getComputedStyle(viewer);
  return Math.max(1, viewer.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight));
}

function getViewerInnerHeight(){
  const styles = getComputedStyle(viewer);
  return Math.max(1, viewer.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom));
}

/*
   Sizes #pagesWrapper explicitly (in px) to the widest page's width
   (or the viewer's own width, whichever is bigger) rather than
   leaving it at a flex-centered 100%. A flex container centering a
   child wider than itself silently falls back to flex-start
   alignment (CSS's "safe alignment" overflow rule), which used to
   make a page snap from centered to flush-left right as it grew
   past the viewer's width - giving pagesWrapper an explicit width
   means .page's own margin:auto centers it in an ordinary,
   non-overflowing block box instead, with no such fallback possible.
*/
function updateWrapperWidth(){

  let maxPageWidth = 0;

  for(const view of pageViews){
    if(view && view.viewport){
      maxPageWidth = Math.max(maxPageWidth, view.viewport.width);
    }
  }

  pagesWrapper.style.width = `${Math.max(getViewerInnerWidth(), maxPageWidth)}px`;
}

function getFitWidthScale(page){
  const viewport = page.getViewport({ scale:1 });
  return getViewerInnerWidth() / viewport.width;
}

function getFitPageScale(page){
  const viewport = page.getViewport({ scale:1 });
  const widthScale = getViewerInnerWidth() / viewport.width;
  const heightScale = getViewerInnerHeight() / viewport.height;
  return Math.min(widthScale, heightScale);
}

const zoomLevels = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3];

const MIN_ZOOM_LEVEL = zoomLevels[0];
const MAX_ZOOM_LEVEL = zoomLevels[zoomLevels.length - 1];
