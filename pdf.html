<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Image Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#eee;
  --muted:#aaa;
  --viewer-top:106px;
  --titlebar-h:56px;
  --float-gap:18px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;

  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 8px;

  background:#1b1b1b;

  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#111;

  touch-action:none;
}

#img{
  position:absolute;
  left:50%;
  top:50%;

  transform-origin:center center;

  user-select:none;
  -webkit-user-drag:none;

  max-width:none;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;

  align-items:center;

  white-space:nowrap;
}

.btn:hover{
  background:#3a3a3a;
}

button,
input{
  background:#292929;

  color:#fff;

  border:1px solid #383838;

  border-radius:6px;

  padding:6px 9px;

  font:inherit;

  outline:none;
}

button:hover{
  background:#353535;

  cursor:pointer;
}

button:active{
  background:#414141;
}

button:focus-visible,
input:focus-visible{
  border-color:#666;

  outline:1px solid #555;
}

/* ============================================================
   COMPACT TOOLBAR CONTROLS
============================================================ */

.toolButton{
  height:32px;

  padding:0 10px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  white-space:nowrap;

  font-size:13px;

  border-radius:6px;

  text-decoration:none;
}

.toolButton.disabled{
  opacity:.4;

  cursor:default;

  pointer-events:none;
}

.toolButton.disabled:hover{
  background:#333;
}

.iconButton{
  width:32px;
  height:32px;

  padding:0;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  border-radius:6px;
}

/* ============================================================
   ZOOM
============================================================ */

.zoomControls{
  display:flex;

  align-items:center;

  gap:3px;

  height:32px;

  padding:0 3px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;
}

.zoomControls button{
  width:29px;
  height:28px;

  padding:0;

  border:0;

  background:transparent;

  font-size:17px;

  display:flex;

  align-items:center;

  justify-content:center;
}

.zoomControls button:hover{
  background:#353535;
}

#zoomPercent{
  width:58px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

/* ============================================================
   TOOLBAR DIVIDER
============================================================ */

.toolbarDivider{
  width:1px;

  height:22px;

  background:#383838;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:rgba(24,24,24,.92);

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;

  backdrop-filter:blur(6px);
}

#title{
  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

/* ============================================================
   MENU
============================================================ */

#menu{
  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{
  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   FLOATING READING MODE
============================================================ */

#readingModeFloat{

  position:fixed;

  right:var(--float-gap);

  bottom:calc(var(--titlebar-h) + var(--float-gap));

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:
    rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#readingModeFloat:hover{
  background:#3a3a3a;

  transform:scale(1.05);
}

#readingModeFloat:active{
  transform:scale(.96);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* ============================================================
   READING MODE
============================================================ */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #menu{

  display:none !important;

  height:0 !important;

  min-height:0 !important;

  max-height:0 !important;

  margin:0 !important;

  padding:0 !important;

  border:0 !important;

  overflow:hidden !important;
}

body.reading-mode #layout{

  top:0 !important;

  height:100% !important;

  position:absolute;
}

body.reading-mode #loadingOverlay{

  inset:0;
}

body.reading-mode #readingModeFloat{

  right:16px;

  bottom:16px;

  background:
    rgba(40,40,40,.88);
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #toolbar{
    justify-content:center;

    gap:4px;

    padding:5px;
  }

  .toolButton{
    height:30px;

    padding:0 8px;

    font-size:12px;
  }

  .zoomControls{
    height:30px;
  }

  .zoomControls button{
    width:27px;

    height:26px;
  }

  #zoomPercent{
    width:53px;

    height:25px;
  }

  #readingModeFloat{

    right:14px;

    bottom:calc(var(--titlebar-h) + 14px);

    width:46px;
    height:46px;

    font-size:16px;
  }

  body.reading-mode #readingModeFloat{

    right:12px;

    bottom:12px;
  }

  #title{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

}

</style>
</head>

<body>

<!-- ==========================================================
     HEADER
========================================================== -->

<header>

  <a
    class="btn"
    id="homeButton"
    href="index.html"
  >
    ◀ Back
  </a>

  <div style="flex:1"></div>

  <button id="menuBtn">
    ☰
  </button>

</header>

<!-- ==========================================================
     TOOLBAR
========================================================== -->

<div id="toolbar">

  <div class="zoomControls">

    <button
      id="minus"
      title="Zoom out"
    >
      −
    </button>

    <input
      id="zoomPercent"
      value="100%"
      aria-label="Zoom percentage"
    >

    <button
      id="plus"
      title="Zoom in"
    >
      +
    </button>

  </div>

  <button
    id="fit"
    class="toolButton"
    title="Reset view"
  >
    Reset
  </button>

  <button
    id="lock"
    class="toolButton"
    title="Toggle movement mode"
  >
    ✣ Free
  </button>

  <a
    class="btn toolButton disabled"
    id="pdfButton"
    aria-disabled="true"
    title="Looking for the matching PDF…"
  >
    PDF
  </a>

</div>

<!-- ==========================================================
     LAYOUT
========================================================== -->

<div id="layout">

  <div id="loadingOverlay">

    <div class="spinner"></div>

    <div class="loadingText">
      Loading image...
    </div>

  </div>

  <div id="viewer">

    <img
      id="img"
      alt=""
    >

  </div>

</div>

<!-- ==========================================================
     TITLE BAR
========================================================== -->

<div
  id="titleBar"
>

  <div id="title">
    Loading...
  </div>

</div>

<!-- ==========================================================
     MENU
========================================================== -->

<div id="menu">

  <button id="downloadBtn">
    Download Image
  </button>

  <button id="newTabBtn">
    Open in New Tab
  </button>

  <button id="shareBtn">
    Share Image
  </button>

  <button id="fullscreenBtn">
    Fullscreen
  </button>

</div>

<!-- ==========================================================
     FLOATING READING MODE
========================================================== -->

<button
  id="readingModeFloat"
  aria-label="Toggle Reading Mode"
  title="Reading Mode"
>
  ▣
</button>

<script>

/* =========================================================
   IMAGE VIEWER
========================================================= */


/* ---------- URL Parameters ---------- */

const p =
    new URLSearchParams(
        location.search
    );


const img =
    document.getElementById("img");


const viewer =
    document.getElementById("viewer");


const title =
    document.getElementById("title");


const fitButton =
    document.getElementById("fit");


const lockButton =
    document.getElementById("lock");


const minusButton =
    document.getElementById("minus");


const plusButton =
    document.getElementById("plus");


const menu =
    document.getElementById("menu");


const menuButton =
    document.getElementById("menuBtn");


const zoomPercent =
    document.getElementById("zoomPercent");


const loadingOverlay =
    document.getElementById("loadingOverlay");


const header =
    document.querySelector("header");


const toolbar =
    document.getElementById("toolbar");


const layout =
    document.getElementById("layout");


const readingModeFloat =
    document.getElementById("readingModeFloat");


const titleBar =
    document.getElementById("titleBar");


function syncTitleBarHeight(){

    const height =
        titleBar.getBoundingClientRect()
            .height;

    document.documentElement.style.setProperty(
        "--titlebar-h",
        `${Math.ceil(height)}px`
    );

}


const src =
    decodeURIComponent(
        p.get("image") || ""
    );


const returnPage =
    decodeURIComponent(
        p.get("return") || "index.html"
    );


/* ---------- Chrome Height Sync ---------- */

function syncViewerTop(){

    if(
        document.body.classList.contains(
            "reading-mode"
        )
    ){

        return;

    }

    const headerHeight =
        header.getBoundingClientRect()
            .height;

    const toolbarHeight =
        toolbar.getBoundingClientRect()
            .height;

    const total =
        Math.ceil(
            headerHeight +
            toolbarHeight
        );

    document.documentElement.style.setProperty(
        "--viewer-top",
        `${total}px`
    );

    layout.style.top =
        `${total}px`;

    loadingOverlay.style.top =
        `${total}px`;

}


/* ---------- Back Button ---------- */

const homeButton =
    document.getElementById("homeButton");


homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();


        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );


        location.href =
            returnPage;

    }
);


/* ---------- Find PDF ---------- */

const pdfButtonEl =
    document.getElementById("pdfButton");


/*
    The button's own label doubles as an on-screen status
    indicator, since checking the console isn't practical
    on mobile. It should read one of:

      "PDF…"      - still checking descriptions.json
      "No PDF"    - checked, nothing referenced this image
      "PDF (!)"   - descriptions.json couldn't be loaded
      "PDF"       - match found, button is live
*/

pdfButtonEl.textContent =
    "PDF…";


/*
    While disabled, clicking the button must not navigate
    anywhere (it has no href yet, or an href left over
    from a previous state). pointer-events:none on the
    .disabled class already blocks mouse clicks, but this
    guard also blocks keyboard-triggered activation
    (Enter/Space on a focused link).
*/

pdfButtonEl.addEventListener(
    "click",
    event => {

        if(
            pdfButtonEl.classList.contains("disabled")
        ){

            event.preventDefault();

        }

    }
);


fetch("descriptions.json")
.then(response => {

    if(!response.ok){

        throw new Error(
            `descriptions.json responded with ${response.status}`
        );

    }

    return response.json();

})
.then(data => {

    let paper = null;

    /*
        Match by filename only, not the full path/string.

        The "image" URL param may include a folder prefix
        (e.g. "papername/Some Image.png") while
        descriptions.json's "images" arrays list bare
        filenames only ("Some Image.png"). An exact-string
        match would silently fail in that case and never
        show the PDF button, with no visible error.
    */

    const srcName =
        src
            .split("/")
            .pop();


    Object.values(data).forEach(p => {

        if(!p.images)
            return;


        const match =
            p.images.some(
                image =>
                    image.split("/").pop() === srcName
            );


        if(match){

            paper = p;

        }

    });


    if(!paper){

        console.warn(
            "PDF button: no descriptions.json entry references image",
            src
        );

        pdfButtonEl.textContent =
            "No PDF";

        pdfButtonEl.title =
            `No matching PDF found for "${srcName}"`;

        return;

    }


    /*
        Build the link to pdf.html.

        file/paper/return are each wrapped in
        encodeURIComponent twice, since pdf.html
        reads them with a URLSearchParams .get()
        (one automatic decode) followed by an
        explicit decodeURIComponent() call (a
        second decode) - matching the same
        double-encode/double-decode convention
        used for the "image"/"return" params on
        this page.

        The "return" value is this page's own
        current URL (image + return params and
        all), so that pressing Back inside
        pdf.html lands right back on this exact
        image.
    */

    const pdfUrl =
        "pdf.html?file=" +
        encodeURIComponent(
            encodeURIComponent(paper.url)
        ) +
        "&paper=" +
        encodeURIComponent(
            encodeURIComponent(paper.title)
        ) +
        "&return=" +
        encodeURIComponent(
            encodeURIComponent(location.href)
        );

    pdfButtonEl.href =
        pdfUrl;

    pdfButtonEl.classList.remove(
        "disabled"
    );

    pdfButtonEl.removeAttribute(
        "aria-disabled"
    );

    pdfButtonEl.textContent =
        "PDF";

    pdfButtonEl.title =
        `Open ${paper.title} PDF`;

})
.catch(error => {

    console.warn(
        "PDF button: could not load descriptions.json",
        error
    );

    pdfButtonEl.textContent =
        "PDF (!)";

    pdfButtonEl.title =
        "Could not check for a matching PDF: " +
        (error?.message || "unknown error");

});


/* ---------- Image ---------- */

img.onload =
    () => {

        loadingOverlay.style.display =
            "none";

        fit();

    };


img.onerror =
    () => {

        loadingOverlay.style.display =
            "none";

    };


img.src =
    src;


const filename =
    src
        .split("/")
        .pop();


const displayName =
    filename
        .replace(/\.[^/.]+$/, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, function(char){

            return char.toUpperCase();

        });


title.textContent =
    displayName;


document.title =
    displayName;


/* =========================================================
   IMAGE MOVEMENT / ZOOM
   ========================================================= */


let base = 1;

let zoom = 1;

let offsetX = 0;

let offsetY = 0;


/*
    Movement modes:

    free       = left/right + up/down
    vertical   = up/down only
    horizontal = left/right only
*/

let movementMode = "free";


const pointers =
    new Map();


let pinchDistance = 0;

let pinchZoom = 1;


/* ---------- Zoom Limits ---------- */

function clampZoom(){

    if(zoom < 0.05){

        zoom = 0.05;

    }


    if(zoom > 50){

        zoom = 50;

    }

}


/* ---------- Draw ---------- */

function draw(){

    clampZoom();


    img.style.transform =

        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${base * zoom})`;


    zoomPercent.value =
        Math.round(zoom * 100) + "%";

}


/* ---------- Fit / Reset ---------- */

function fit(){

    if(!img.naturalWidth)
        return;


    base = Math.min(

        viewer.clientWidth /
        img.naturalWidth,

        viewer.clientHeight /
        img.naturalHeight

    );


    zoom = 1;


    offsetX = 0;

    offsetY = 0;


    img.style.transition =
        "transform .22s";


    draw();


    setTimeout(
        () => {

            img.style.transition = "";

        },
        220
    );

}


window.addEventListener(
    "resize",
    () => {

        syncViewerTop();

        /*
            Only resize/reset when the viewer itself
            is actually resized.

            Reading Mode toggling does NOT call fit().
        */

        if(!document.body.classList.contains("reading-mode")){

            fit();

        }

    }
);


/* ---------- Zoom Buttons ---------- */

minusButton.onclick =
    () => {

        zoom /= 1.1;

        draw();

    };


plusButton.onclick =
    () => {

        zoom *= 1.1;

        draw();

    };


fitButton.onclick =
    fit;


/* ---------- Manual Zoom ---------- */

zoomPercent.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Enter"
        ){

            return;

        }

        let value =
            parseFloat(
                zoomPercent.value.replace(
                    "%",
                    ""
                )
            );

        if(
            Number.isNaN(value)
        ){

            value =
                100;

        }

        value =
            Math.max(
                5,

                Math.min(
                    5000,
                    value
                )
            );

        zoom =
            value / 100;

        draw();

    }
);


/* =========================================================
   MOVEMENT MODE
========================================================= */

lockButton.onclick = () => {

    if(movementMode === "free"){

        movementMode = "vertical";

        lockButton.textContent =
            "↕ Vertical";

    }else if(movementMode === "vertical"){

        movementMode = "horizontal";

        lockButton.textContent =
            "↔ Horizontal";

    }else{

        movementMode = "free";

        lockButton.textContent =
            "✣ Free";

    }

};


/* =========================================================
   POINTER EVENTS
========================================================= */


/* ---------- Pointer Down ---------- */

viewer.onpointerdown =
    e => {

        viewer.setPointerCapture(
            e.pointerId
        );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        if(pointers.size === 2){

            const pts =
                [...pointers.values()];


            pinchDistance =
                Math.hypot(

                    pts[0].x -
                    pts[1].x,

                    pts[0].y -
                    pts[1].y

                );


            pinchZoom =
                zoom;

        }

    };


/* ---------- Pointer Move ---------- */

viewer.onpointermove =
    e => {

        if(!pointers.has(e.pointerId))
            return;


        const previous =
            pointers.get(
                e.pointerId
            );


        pointers.set(

            e.pointerId,

            {
                x:e.clientX,
                y:e.clientY
            }

        );


        /* ---------- One Finger ---------- */

        if(pointers.size === 1){

            const dx =
                e.clientX -
                previous.x;


            const dy =
                e.clientY -
                previous.y;


            /*
                Free:
                move both directions.

                Vertical:
                only up/down.

                Horizontal:
                only left/right.
            */

            if(movementMode === "free"){

                offsetX += dx;

                offsetY += dy;

            }else if(movementMode === "vertical"){

                offsetY += dy;

            }else if(movementMode === "horizontal"){

                offsetX += dx;

            }


            draw();


            return;

        }


        /* ---------- Two Finger Pinch ---------- */

        const pts =
            [...pointers.values()];


        const distance =
            Math.hypot(

                pts[0].x -
                pts[1].x,

                pts[0].y -
                pts[1].y

            );


        const oldScale =
            base * zoom;


        zoom =
            pinchZoom *
            (
                distance /
                pinchDistance
            );


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX *= ratio;

        offsetY *= ratio;


        pinchDistance =
            distance;


        pinchZoom =
            zoom;


        draw();

    };


/* ---------- Pointer Up ---------- */

viewer.onpointerup =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(pointers.size < 2){

            pinchDistance = 0;

        }

    };


/* ---------- Pointer Cancel ---------- */

viewer.onpointercancel =
    e => {

        pointers.delete(
            e.pointerId
        );


        if(pointers.size < 2){

            pinchDistance = 0;

        }

    };


/* ---------- Initial Draw ---------- */

draw();


/* =========================================================
   READING MODE
========================================================= */

let readingMode =
    false;


function setReadingMode(
    enabled
){

    readingMode =
        Boolean(
            enabled
        );

    if(
        readingMode
    ){

        document.body.classList.add(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "×";

        readingModeFloat.title =
            "Exit Reading Mode";

        menu.style.display =
            "none";

        layout.style.top =
            "0px";

        loadingOverlay.style.top =
            "0px";

    }else{

        document.body.classList.remove(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "▣";

        readingModeFloat.title =
            "Reading Mode";

        syncViewerTop();

    }

    /*
        IMPORTANT:

        Do NOT call fit() here.

        fit() resets:

            zoom = 1
            offsetX = 0
            offsetY = 0

        Reading Mode should only change the
        interface around the image.

        The current zoom and image position
        are therefore preserved.
    */

    draw();

}


readingModeFloat.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        setReadingMode(
            !readingMode
        );

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

document
    .getElementById("fullscreenBtn")
    .onclick = () => {

        menu.style.display =
            "none";


        if(document.fullscreenElement){

            document.exitFullscreen();

        }else{

            document.documentElement
                .requestFullscreen();

        }

    };


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

viewer.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const rect =
            viewer.getBoundingClientRect();


        const mouseX =
            e.clientX -
            rect.left -
            rect.width / 2;


        const mouseY =
            e.clientY -
            rect.top -
            rect.height / 2;


        const oldScale =
            base * zoom;


        if(e.deltaY < 0){

            zoom *= 1.12;

        }else{

            zoom /= 1.12;

        }


        clampZoom();


        const newScale =
            base * zoom;


        const ratio =
            newScale /
            oldScale;


        offsetX =

            mouseX -
            (
                mouseX -
                offsetX
            ) * ratio;


        offsetY =

            mouseY -
            (
                mouseY -
                offsetY
            ) * ratio;


        draw();

    },
    {
        passive:false
    }
);


/* =========================================================
   MENU
========================================================= */

menuButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();


        menu.style.display =

            menu.style.display === "block"

            ? "none"

            : "block";

    }
);


menu.addEventListener(
    "click",
    e => {

        e.stopPropagation();

    }
);


document.addEventListener(
    "click",
    () => {

        menu.style.display =
            "none";

    }
);


/* =========================================================
   NEW TAB
========================================================= */

document
    .getElementById("newTabBtn")
    .onclick = () => {

        menu.style.display =
            "none";


        window.open(
            src,
            "_blank"
        );

    };


/* =========================================================
   DOWNLOAD
========================================================= */

document
    .getElementById("downloadBtn")
    .onclick = () => {

        const a =
            document.createElement("a");


        a.href =
            src;


        a.download =
            src.split("/").pop();


        document.body.appendChild(a);


        a.click();


        a.remove();


        menu.style.display =
            "none";

    };


/* =========================================================
   SHARE
========================================================= */

document
    .getElementById("shareBtn")
    .addEventListener(
        "click",
        async () => {

            const url =
                window.location.href;


            menu.style.display =
                "none";


            /* Native share */

            if(navigator.share){

                try{

                    await navigator.share({

                        title:
                            title.textContent,

                        text:
                            title.textContent,

                        url:
                            url

                    });


                    return;

                }catch(err){

                    if(
                        err &&
                        err.name ===
                        "AbortError"
                    ){

                        return;

                    }

                }

            }


            /* Clipboard fallback */

            if(
                navigator.clipboard &&
                typeof navigator.clipboard.writeText ===
                "function"
            ){

                try{

                    await navigator.clipboard.writeText(
                        url
                    );


                    alert(
                        "Link copied to clipboard!"
                    );


                    return;

                }catch(err){

                    /* Continue to final fallback */

                }

            }


            /* Manual fallback */

            window.prompt(
                "Copy this link:",
                url
            );

        }
    );


/* =========================================================
   CHROME RESIZE OBSERVER
========================================================= */

if(
    "ResizeObserver" in window
){

    const chromeObserver =
        new ResizeObserver(
            () => {

                syncViewerTop();

                syncTitleBarHeight();

            }
        );

    chromeObserver.observe(
        header
    );

    chromeObserver.observe(
        toolbar
    );

    chromeObserver.observe(
        titleBar
    );

}


syncViewerTop();

syncTitleBarHeight();


</script>
