<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="./pdfjs/web/text_layer_builder.css">
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Viewer</title>

<style>
:root{
    --bg:#111;
    --panel:#1d1d1d;
    --panel2:#222;
    --text:#eee;
    --muted:#aaa;
    --accent:#3a3a3a;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.page{
    position:relative;
    margin:0 auto 20px;
    box-shadow:0 0 14px rgba(0,0,0,.4);
    background:white;
    flex-shrink:0;
}

.pageCanvas{
    display:block;
    pointer-events:none;
}

.btn{
    background:#333;
    color:#fff;
    border:none;
    border-radius:7px;
    padding:9px 12px;
    text-decoration:none;
    cursor:pointer;
}

button,
input{
    background:#2b2b2b;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 12px;
}

button:hover{
    background:#3a3a3a;
    cursor:pointer;
}

header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#181818;
    border-bottom:1px solid #2d2d2d;
}

#toolbar{
    display:flex;
    gap:8px;
    align-items:center;
    padding:10px;
    background:#1b1b1b;
    border-bottom:1px solid #2d2d2d;
    flex-wrap:wrap;
}

#layout{
    height:calc(100% - 106px);
}

#viewer{
    width:100%;
    height:100%;
    overflow:auto;
    padding:30px 30px 90px;
    background:#111;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.zoomControls,
.pageControls{
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    flex-shrink:0;
}

.hidden{
    display:none;
}

/* ---------- Title ---------- */

#titleBar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    background:rgba(24,24,24,.92);

    padding:12px 18px;

    text-align:center;

    z-index:3000;

    border-top:1px solid #333;

    backdrop-filter:blur(6px);
}

#title{
    display:flex;

    justify-content:center;
    align-items:center;

    width:100%;

    text-align:center;

    font-size:1.2rem;
    font-weight:bold;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.title-text{
    order:1;

    position:relative;

    display:inline-block;

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.title-badges{
    display:inline-flex;

    gap:8px;

    margin-left:12px;

    vertical-align:middle;
}

.title-badge{
    display:inline-block;

    padding:4px 10px;

    color:white;

    font-size:.72em;

    font-weight:bold;

    border-radius:999px;

    text-transform:uppercase;

    letter-spacing:.5px;

    flex-shrink:0;
}

.title-badge.new{
    order:2;
    background:#00b050;
}

.title-badge.featured{
    order:3;
    background:#2f7cff;
}

/* ---------- Menu ---------- */

#menu{
    position:absolute;

    right:10px;
    top:58px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    padding:8px;

    display:none;

    min-width:220px;

    z-index:5000;
}

#menu button{
    width:100%;
    text-align:left;
    margin:3px 0;
}

/* ---------- Search ---------- */

#searchPopup{
    position:absolute;

    top:108px;
    left:110px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:10px;

    background:#222;

    border:1px solid #444;

    border-radius:10px;

    box-shadow:0 8px 20px rgba(0,0,0,.45);

    z-index:4500;
}

#searchPopup.hidden{
    display:none;
}

#searchPopup input{
    width:220px;
}

#searchResults{
    color:#bbb;

    min-width:70px;

    text-align:center;
}

/* ---------- PDF Text Layer ---------- */

.textLayer{
    position:absolute;
    inset:0;

    overflow:hidden;

    line-height:1;

    text-align:initial;

    forced-color-adjust:none;

    z-index:2;

    user-select:text;
    -webkit-user-select:text;

    cursor:text;
}

/*
    Important:
    PDF.js controls the exact positioning,
    size and transforms of these elements.
*/

.textLayer span,
.textLayer br{
    color:transparent;
}

.textLayer ::selection{
    background:rgba(0,120,255,.35);
}

.textLayer .highlight{
    margin:-1px;
    padding:1px;

    background-color:rgba(180,0,170,.2);

    border-radius:4px;
}

.textLayer .highlight.selected{
    background-color:rgba(0,100,255,.35);
}

.textLayer .endOfContent{
    display:block;

    position:absolute;

    left:0;
    top:100%;
    right:0;
    bottom:0;

    z-index:-1;

    cursor:default;

    user-select:none;
}

.textLayer .endOfContent.active{
    top:0;
}

/* ---------- Manual PDF Link Layer ---------- */

.linkLayer{
    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:4;

    pointer-events:none;
}

.pdf-link{
    position:absolute;

    display:block;

    pointer-events:auto;

    cursor:pointer;

    background:transparent;

    border:0;

    padding:0;

    margin:0;

    text-decoration:none;
}

.pdf-link:hover{
    background:rgba(0,120,255,.08);
}

/* ---------- Loading ---------- */

#loadingOverlay{
    position:absolute;

    inset:106px 0 0 0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#111;

    z-index:5000;
}

.spinner{
    width:60px;
    height:60px;

    border:6px solid #333;
    border-top:6px solid #fff;

    border-radius:50%;

    animation:spin .9s linear infinite;
}

.loadingText{
    margin-top:18px;

    color:#ddd;

    font-size:18px;
}

/* ---------- Reading Mode ---------- */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{
    display:none !important;
}

body.reading-mode #layout{
    height:100%;
}

body.reading-mode #viewer{
    height:100%;

    padding-top:20px;
    padding-bottom:20px;
}

body.reading-mode #loadingOverlay{
    inset:0;
}

/* ---------- Mobile ---------- */

@media (max-width:768px){

    #searchPopup{
        left:10px;
        right:10px;

        top:108px;

        width:auto;

        display:flex;

        flex-wrap:wrap;

        justify-content:center;

        gap:8px;
    }

    #searchPopup input{
        flex:1 1 100%;
        width:100%;
        min-width:0;
    }

    #prevResult,
    #nextResult{
        flex:0 0 auto;
    }

    #searchResults{
        flex:1;

        text-align:center;

        min-width:0;
    }

    .title-badges{
        display:flex;

        justify-content:center;

        gap:8px;

        margin:0 0 8px 0;
    }

    #title{
        flex-direction:column;

        align-items:center;

        gap:6px;
    }

    .title-text{
        order:2;

        width:100%;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;
    }

    .title-badge.new,
    .title-badge.featured{
        order:1;
    }
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<header>

<a class="btn" id="backBtn" href="index.html">◀ Back</a>

<div style="flex:1"></div>

<button id="menuBtn">☰</button>

</header>

<div id="toolbar">

<div class="zoomControls">

<button id="zoomOut">−</button>

    id="zoomPercent"

</div>

<script type="module">

import {
    getDocument,
    GlobalWorkerOptions,
    TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc =
    "./pdfjs/build/pdf.worker.mjs";


/* =========================================================
   URL PARAMETERS
========================================================= */

const p =
    new URLSearchParams(location.search);

const file =
    decodeURIComponent(
        p.get("file") || ""
    );

const title =
    decodeURIComponent(
        p.get("paper") || "PDF"
    );


/* =========================================================
   DESCRIPTIONS
========================================================= */

let descriptions = {};

try{

    descriptions =
        await fetch("descriptions.json")
        .then(r => r.json());

}
catch(err){

    console.warn(
        "Could not load descriptions.json:",
        err
    );

}


let newestEntry = null;

if(Object.keys(descriptions).length){

    newestEntry =
        Object.entries(descriptions)
        .sort((a,b) =>
            new Date(b[1].updated || 0) -
            new Date(a[1].updated || 0)
        )[0];

}


const newestKey =
    newestEntry
        ? newestEntry[0]
        : null;


const newestDate =
    newestEntry
        ? new Date(newestEntry[1].updated)
        : null;


const today =
    new Date();


const oneYearAgo =
    new Date(today);

oneYearAgo.setFullYear(
    today.getFullYear() - 1
);


const showNewestBadge =
    newestDate &&
    newestDate >= oneYearAgo;


const paper =
    Object.values(descriptions)
    .find(
        item => item.url === file
    );


const paperKey =
    Object.keys(descriptions)
    .find(
        key => descriptions[key].url === file
    );


const isNewest =
    Boolean(
        showNewestBadge &&
        paperKey === newestKey
    );


/* =========================================================
   RETURN PAGE
========================================================= */

const returnPage =
    decodeURIComponent(
        p.get("return") || "index.html"
    );


/* =========================================================
   TITLE
========================================================= */

document.getElementById("title").innerHTML = `

<div class="title-text">

    ${title}

    <span class="title-badges">

        ${
            isNewest
                ? `<span class="title-badge new">NEW</span>`
                : ""
        }

        ${
            paper?.featured
                ? `<span class="title-badge featured">FEATURED</span>`
                : ""
        }

    </span>

</div>
`;


/* =========================================================
   ELEMENTS
========================================================= */

const viewer =
    document.getElementById("viewer");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const menu =
    document.getElementById("menu");

const menuButton =
    document.getElementById("menuBtn");

const searchPopup =
    document.getElementById("searchPopup");

const searchBox =
    document.getElementById("searchBox");

const pageInput =
    document.getElementById("pageNumber");

const zoomBox =
    document.getElementById("zoomPercent");


/* =========================================================
   SCALE
========================================================= */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;

function getFitWidthScale(page){

    const viewport =
        page.getViewport({
            scale:1
        });

    const styles =
        getComputedStyle(viewer);

    const width =
        viewer.clientWidth
        - parseFloat(styles.paddingLeft)
        - parseFloat(styles.paddingRight);

    return width / viewport.width;
}


function getFitPageScale(page){

    const viewport =
        page.getViewport({
            scale:1
        });

    const styles =
        getComputedStyle(viewer);

    const availableWidth =
        viewer.clientWidth
        - parseFloat(styles.paddingLeft)
        - parseFloat(styles.paddingRight);

    const availableHeight =
        viewer.clientHeight
        - parseFloat(styles.paddingTop)
        - parseFloat(styles.paddingBottom);

    const widthScale =
        availableWidth / viewport.width;

    const heightScale =
        availableHeight / viewport.height;

    return Math.min(
        widthScale,
        heightScale
    );
}


function updateScale(){

    currentScale =
        baseScale * zoomLevel;

    zoomBox.value =
        Math.round(zoomLevel * 100) + "%";
}


/* =========================================================
   ZOOM LEVELS
========================================================= */

const zoomLevels = [
    0.25,
    0.5,
    0.75,
    1,
    1.25,
    1.5,
    1.75,
    2,
    2.25,
    2.5,
    2.75,
    3,
    3.25,
    3.5,
    3.75,
    4,
    4.25,
    4.5,
    4.75,
    5
];


/* =========================================================
   PDF STATE
========================================================= */

const pageViews = [];

let searchResults = [];
let currentSearch = -1;
let lastSearchQuery = "";

let pdfDoc = null;


/* =========================================================
   BACK BUTTON
========================================================= */

const backButton =
    document.getElementById("backBtn");

backButton.href =
    returnPage || "index.html";

backButton.addEventListener(
    "click",
    e => {

        e.preventDefault();

        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );

        sessionStorage.setItem(
            "returnFromPage",
            "yes"
        );

        location.href =
            returnPage || "index.html";
    }
);


/* =========================================================
   INTERNAL PDF LINK
========================================================= */

async function openInternalDestination(dest){

    try{

        let resolvedDest =
            dest;

        /*
            Named destination:
            pdfDoc.getDestination()
        */

        if(typeof resolvedDest === "string"){

            resolvedDest =
                await pdfDoc.getDestination(
                    resolvedDest
                );

        }

        if(
            !Array.isArray(resolvedDest) ||
            !resolvedDest.length
        ){

            return false;

        }

        const pageRef =
            resolvedDest[0];

        let pageIndex = -1;

        /*
            Most PDF destinations use an indirect
            page reference here.
        */

        if(pageRef){

            try{

                pageIndex =
                    await pdfDoc.getPageIndex(
                        pageRef
                    );

            }
            catch(err){

                /*
                    Some PDFs can provide a page
                    number directly.
                */

                if(
                    typeof pageRef === "number"
                ){

                    pageIndex =
                        pageRef;

                }

            }

        }

        /*
            If a page index was resolved, jump there.
        */

        if(
            pageIndex >= 0 &&
            pageIndex < pageViews.length
        ){

            pageViews[pageIndex]
                .pageDiv
                .scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

            pageInput.value =
                pageIndex + 1;

            return true;
        }

    }
    catch(err){

        console.warn(
            "Could not follow internal PDF link:",
            err
        );

    }

    return false;
}


/* =========================================================
   CREATE LINK LAYER
========================================================= */

function renderLinkLayer(
    view,
    annotations,
    viewport
){

    const layer =
        view.linkLayerDiv;

    layer.innerHTML = "";

    if(
        !annotations ||
        !annotations.length
    ){

        return;
    }


    for(
        const annotation of annotations
    ){

        /*
            Only create actual link hitboxes.
        */

        if(
            annotation.subtype !== "Link"
        ){

            continue;
        }


        if(
            !annotation.rect ||
            annotation.rect.length !== 4
        ){

            continue;
        }


        const link =
            document.createElement("a");

        link.className =
            "pdf-link";


        /*
            Convert PDF coordinates into the
            exact viewport coordinates used by
            the canvas and text layer.
        */

        const rect =
            viewport.convertToViewportRectangle(
                annotation.rect
            );


        const left =
            Math.min(
                rect[0],
                rect[2]
            );

        const top =
            Math.min(
                rect[1],
                rect[3]
            );

        const width =
            Math.abs(
                rect[2] - rect[0]
            );

        const height =
            Math.abs(
                rect[3] - rect[1]
            );


        link.style.left =
            left + "px";

        link.style.top =
            top + "px";

        link.style.width =
            width + "px";

        link.style.height =
            height + "px";


        /*
            External URL.
        */

        if(
            annotation.url ||
            annotation.unsafeUrl
        ){

            const url =
                annotation.url ||
                annotation.unsafeUrl;


            link.href =
                url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";

        }

        /*
            Internal PDF destination.
        */

        else if(annotation.dest){

            link.href =
                "#";


            link.addEventListener(
                "click",
                async event => {

                    event.preventDefault();

                    event.stopPropagation();

                    await openInternalDestination(
                        annotation.dest
                    );

                }
            );

        }

        /*
            Some PDF files represent
            navigation through actions.
        */

        else if(
            annotation.actionType === "GoTo" &&
            annotation.dest
        ){

            link.href = "#";

            link.addEventListener(
                "click",
                async event => {

                    event.preventDefault();

                    event.stopPropagation();

                    await openInternalDestination(
                        annotation.dest
                    );

                }
            );

        }
        else{

            /*
                Unknown annotation type.
                Do not create a useless hitbox.
            */

            continue;

        }


        layer.appendChild(
            link
        );

    }
}


/* =========================================================
   CREATE ONE PAGE
========================================================= */

async function createPage(
    pdf,
    pageNumber
){

    const page =
        await pdf.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale:currentScale
        });


    /* -----------------------------------------
       Page container
    ----------------------------------------- */

    const pageDiv =
        document.createElement("div");

    pageDiv.className =
        "page";

    pageDiv.style.width =
        viewport.width + "px";

    pageDiv.style.height =
        viewport.height + "px";


    /*
        Append immediately.

        This is important because pages now
        appear progressively rather than making
        the entire viewer wait until every
        operation for the page finishes.
    */

    viewer.appendChild(
        pageDiv
    );


    /* -----------------------------------------
       Canvas
    ----------------------------------------- */

    const canvas =
        document.createElement("canvas");

    canvas.className =
        "pageCanvas";


    const outputScale =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );

    canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    canvas.style.width =
        viewport.width + "px";

    canvas.style.height =
        viewport.height + "px";


    const ctx =
        canvas.getContext("2d");


    ctx.setTransform(
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
    );


    pageDiv.appendChild(
        canvas
    );


    /* -----------------------------------------
       Text layer
    ----------------------------------------- */

    const textLayerDiv =
        document.createElement("div");

    textLayerDiv.className =
        "textLayer";

    textLayerDiv.style.width =
        viewport.width + "px";

    textLayerDiv.style.height =
        viewport.height + "px";


    pageDiv.appendChild(
        textLayerDiv
    );


    /* -----------------------------------------
       Link layer
    ----------------------------------------- */

    const linkLayerDiv =
        document.createElement("div");

    linkLayerDiv.className =
        "linkLayer";

    linkLayerDiv.style.width =
        viewport.width + "px";

    linkLayerDiv.style.height =
        viewport.height + "px";


    pageDiv.appendChild(
        linkLayerDiv
    );


    /* -----------------------------------------
       Store view immediately
    ----------------------------------------- */

    const view = {

        page,

        pageDiv,

        canvas,

        textLayerDiv,

        linkLayerDiv,

        textContent:null,

        annotations:[]

    };


    pageViews.push(
        view
    );


    /*
        Render the canvas.
    */

    await page.render({

        canvasContext:
            ctx,

        viewport

    }).promise;


    /*
        Get text.
    */

    const textContent =
        await page.getTextContent();


    view.textContent =
        textContent;


    /*
        IMPORTANT:
        PDF.js TextLayer expects the cloned
        viewport with dontFlip:true.
    */

    const textLayer =
        new TextLayer({

            textContentSource:
                textContent,

            container:
                textLayerDiv,

            viewport:
                viewport.clone({
                    dontFlip:true
                })

        });


    await textLayer.render();


    /*
        Get PDF annotations.

        Failure here must NOT prevent the page
        from existing or stop later pages.
    */

    try{

        view.annotations =
            await page.getAnnotations({
                intent:"display"
            });


        renderLinkLayer(
            view,
            view.annotations,
            viewport
        );

    }
    catch(err){

        console.warn(
            "Could not load annotations for page " +
            pageNumber + ":",
            err
        );

    }


    return view;
}


/* =========================================================
   INITIAL PDF LOAD
========================================================= */

try{

    console.log(
        "Loading PDF:",
        file
    );


    const loadingTask =
        getDocument(file);


    pdfDoc =
        await loadingTask.promise;


    console.log(
        "PDF loaded:",
        pdfDoc.numPages,
        "pages"
    );


    document.getElementById(
        "pageCount"
    ).textContent =
        "of " + pdfDoc.numPages;


    /*
        Calculate the initial fit from page 1.
    */

    const firstPage =
        await pdfDoc.getPage(1);


    baseScale =
        getFitWidthScale(
            firstPage
        );


    zoomLevel = 1;

    updateScale();


    /*
        Render every page.

        Each page is handled independently.
        An annotation error cannot stop the rest
        of the PDF from loading.
    */

    for(
        let pageNumber = 1;
        pageNumber <= pdfDoc.numPages;
        pageNumber++
    ){

        try{

            console.log(
                "Rendering page",
                pageNumber,
                "of",
                pdfDoc.numPages
            );


            await createPage(
                pdfDoc,
                pageNumber
            );

        }
        catch(err){

            /*
                Do not stop the entire PDF because
                one unusual page failed.
            */

            console.error(
                "Failed to render page " +
                pageNumber + ":",
                err
            );

        }

    }


    loadingOverlay.style.display =
        "none";


    console.log(
        "Finished loading pages:",
        pageViews.length
    );

}
catch(err){

    console.error(
        "PDF LOAD ERROR:",
        err
    );


    loadingOverlay.style.display =
        "none";


    const message =
        document.createElement("div");

    message.style.color =
        "#fff";

    message.style.padding =
        "30px";

    message.style.textAlign =
        "center";

    message.textContent =
        "Unable to load this PDF.";


    viewer.appendChild(
        message
    );

}


/* =========================================================
   RE-RENDER ALL PAGES AFTER ZOOM
========================================================= */

async function renderAllPages(){

    const outputScale =
        window.devicePixelRatio || 1;


    for(
        const view of pageViews
    ){

        const viewport =
            view.page.getViewport({
                scale:currentScale
            });


        /* -----------------------------------------
           Resize page
        ----------------------------------------- */

        view.pageDiv.style.width =
            viewport.width + "px";

        view.pageDiv.style.height =
            viewport.height + "px";


        /* -----------------------------------------
           Canvas
        ----------------------------------------- */

        view.canvas.width =
            Math.floor(
                viewport.width *
                outputScale
            );

        view.canvas.height =
            Math.floor(
                viewport.height *
                outputScale
            );

        view.canvas.style.width =
            viewport.width + "px";

        view.canvas.style.height =
            viewport.height + "px";


        const ctx =
            view.canvas.getContext("2d");


        ctx.setTransform(
            outputScale,
            0,
            0,
            outputScale,
            0,
            0
        );


        await view.page.render({

            canvasContext:
                ctx,

            viewport

        }).promise;


        /* -----------------------------------------
           Text layer
        ----------------------------------------- */

        view.textLayerDiv.innerHTML =
            "";

        view.textLayerDiv.style.width =
            viewport.width + "px";

        view.textLayerDiv.style.height =
            viewport.height + "px";


        if(view.textContent){

            const textLayer =
                new TextLayer({

                    textContentSource:
                        view.textContent,

                    container:
                        view.textLayerDiv,

                    viewport:
                        viewport.clone({
                            dontFlip:true
                        })

                });


            await textLayer.render();

        }


        /* -----------------------------------------
           Links
        ----------------------------------------- */

        renderLinkLayer(
            view,
            view.annotations,
            viewport
        );

    }
}

/* =========================================================
   SHARE
========================================================= */

document.getElementById(
    "copyLinkBtn"
).addEventListener(
    "click",
    async () => {

        const url =
            window.location.href;

        menu.style.display =
            "none";


        if(navigator.share){

            try{

                await navigator.share({

                    title:
                        document.title,

                    text:
                        document.getElementById(
                            "title"
                        ).textContent,

                    url

                });

            }
            catch(err){

                // User cancelled sharing.

            }

            return;

        }


        try{

            await navigator.clipboard
                .writeText(url);

            alert(
                "Link copied to clipboard!"
            );

        }
        catch{

            window.prompt(
                "Copy this link:",
                url
            );

        }

    }
);


/* =========================================================
   ZOOM IN
========================================================= */

document.getElementById(
    "zoomIn"
).onclick = async () => {

    const next =
        zoomLevels.find(
            z => z > zoomLevel
        );

    if(!next)
        return;

    zoomLevel =
        next;

    updateScale();

    await renderAllPages();

};


/* =========================================================
   ZOOM OUT
========================================================= */

document.getElementById(
    "zoomOut"
).onclick = async () => {

    const previous =
        [...zoomLevels]
        .reverse()
        .find(
            z => z < zoomLevel
        );

    if(!previous)
        return;

    zoomLevel =
        previous;

    updateScale();

    await renderAllPages();

};


/* =========================================================
   FIT WIDTH
========================================================= */

document.getElementById(
    "fitWidth"
).onclick = async () => {

    if(!pageViews.length)
        return;

    baseScale =
        getFitWidthScale(
            pageViews[0].page
        );

    zoomLevel = 1;

    updateScale();

    await renderAllPages();

};


/* =========================================================
   FIT PAGE
========================================================= */

document.getElementById(
    "fitPage"
).onclick = async () => {

    if(!pageViews.length)
        return;

    baseScale =
        getFitPageScale(

        );

/* =========================================================
   PAGE NUMBER
========================================================= */

pageInput.addEventListener(
    "keydown",
    e => {

        if(
            e.key !== "Enter"
        )
            return;

        let page =
            parseInt(
                pageInput.value
            );


        if(
            isNaN(page)
        ){

            page = 1;

        }


        if(page < 1)
            page = 1;


        if(page > pageViews.length){

            page =
                pageViews.length;

        }


        if(!page)
            return;


        pageInput.value =
            page;


        pageViews[
            page - 1
        ].pageDiv.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    }
);


/* =========================================================
   ZOOM INPUT
========================================================= */

zoomBox.addEventListener(
    "keydown",
    async e => {

        if(
            e.key !== "Enter"
        )
            return;


        let value =
            parseFloat(
                zoomBox.value
                    .replace("%","")
            );


        if(
            isNaN(value)
        ){

            value = 100;

        }


        value =
            Math.max(
                25,
                Math.min(
                    500,
                    value
                )
            );


        zoomLevel =
            value / 100;


        updateScale();

        await renderAllPages();

    }
);


/* =========================================================
   CURRENT PAGE TRACKING
========================================================= */

viewer.addEventListener(
    "scroll",
    () => {

        let current = 1;


        for(
            let i = 0;
            i < pageViews.length;
            i++
        ){

            const rect =
                pageViews[i]
                .pageDiv
                .getBoundingClientRect();


            if(
                rect.top < 150
            ){

                current =
                    i + 1;

            }

        }


        pageInput.value =
            current;

    }
);


/* =========================================================
   SEARCH
========================================================= */

async function searchPDF(query){

    searchResults = [];

    currentSearch = -1;


    query =
        query.trim().toLowerCase();


    if(query === ""){

        document.getElementById(
            "searchResults"
        ).textContent =
            "0 of 0";

        return;

    }


    lastSearchQuery =
        query;


    for(
        let i = 0;
        i < pageViews.length;
        i++
    ){

        if(
            !pageViews[i].textContent
        )
            continue;


        const pageText =
            pageViews[i]
            .textContent
            .items
            .map(
                item => item.str
            )
            .join(" ")
            .toLowerCase();


        if(
            pageText.includes(query)
        ){

            searchResults.push(i);

        }

    }


    if(
        searchResults.length === 0
    ){

        document.getElementById(
            "searchResults"
        ).textContent =
            "0 of 0";

        alert(
            "No results found."
        );

        return;

    }


    gotoSearchResult(0);

}


function gotoSearchResult(index){

    if(
        searchResults.length === 0
    )
        return;


    if(index < 0){

        index =
            searchResults.length - 1;

    }


    if(
        index >= searchResults.length
    ){

        index = 0;

    }


    currentSearch =
        index;


    document.getElementById(
        "searchResults"
    ).textContent =
        `${currentSearch + 1} of ${searchResults.length}`;


    const view =
        pageViews[
            searchResults[currentSearch]
        ];


    if(view){

        view.pageDiv.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    }

}


/* =========================================================
   SEARCH BOX
========================================================= */

searchBox.addEventListener(
    "keydown",
    e => {

        if(
            e.key !== "Enter"
        )
            return;


        const query =
            searchBox.value
            .trim()
            .toLowerCase();


        if(

            query !== lastSearchQuery ||

            searchResults.length === 0 ||

            currentSearch === -1

        ){

            searchPDF(query);

            return;

        }


        gotoSearchResult(
            currentSearch + 1
        );

    }
);

};


/* =========================================================
   READING MODE
========================================================= */

let suppressReadingModeClick =
    false;


/*
    If text is already selected and the user
    clicks elsewhere, suppress that click.
*/

viewer.addEventListener(
    "mousedown",
    event => {

        const selection =
            window.getSelection();


        if(
            selection &&
            selection.toString().length > 0
        ){

            suppressReadingModeClick =
                true;

        }

    }
);


viewer.addEventListener(
    "click",
    event => {

        /*
            Clicking a link must never activate
            reading mode.
        */

        if(
            event.target.closest(
                ".pdf-link"
            )
        ){

            return;

        }


        const page =
            event.target.closest(
                ".page"
            );


        /*
            Gray area or anything outside
            an actual PDF page.
        */

        if(!page)
            return;


        /*
            Text selection takes priority.
        */

        const selection =
            window.getSelection();


        if(
            selection &&
            selection.toString().length > 0
        ){

            suppressReadingModeClick =
                true;

            return;

        }


        /*
            Suppress the click used to
            deselect previously selected text.
        */

        if(
            suppressReadingModeClick
        ){

            suppressReadingModeClick =
                false;

            return;

        }


        document.body.classList.toggle(
            "reading-mode"
        );


        if(
            document.body.classList
            .contains("reading-mode")
        ){

            menu.style.display =
                "none";


            searchPopup.classList.add(
                "hidden"
            );

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer = null;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async () => {

                    if(
                        window.innerWidth <= 768 &&
                        pageViews.length
                    ){

                        baseScale =
                            getFitWidthScale(
                                pageViews[0].page
                            );

                        updateScale();

                        await renderAllPages();

                    }

                },
                150
            );

    }
);
