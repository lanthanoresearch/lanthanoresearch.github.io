<title>PDF Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1d1d1d;
  --panel2:#222;
  --text:#eee;
  --muted:#aaa;
  --accent:#3a3a3a;
  --viewer-top:106px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;
  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:48px;

  display:flex;
  align-items:center;

  gap:8px;
  padding:10px;

  background:#1b1b1b;
  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);
  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  display:flex;
  flex-direction:column;
  align-items:center;

  scroll-behavior:auto;
  overscroll-behavior:contain;
}

/* ============================================================
   PDF PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;
  pointer-events:none;
  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;
  color:#fff;

  border:none;
  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;
  cursor:pointer;

  display:inline-flex;
  align-items:center;

  white-space:nowrap;
}

button,
input{
  background:#2b2b2b;
  color:#fff;

  border:none;
  border-radius:8px;

  padding:8px 12px;

}

button:hover{
  background:#3a3a3a;

}

button:active{

/* ============================================================
   CONTROL GROUPS
============================================================ */

.zoomControls,
.pageControls{
  display:flex;
  align-items:center;
  gap:6px;

  flex-shrink:0;
}

.toolbarDivider{

}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{

/* ============================================================

============================================================ */

#searchPopup{

}

#searchPopup.hidden{

}

}

#searchResults{
  color:#bbb;

  min-width:70px;

}

/* ============================================================
   PDF.JS TEXT LAYER
============================================================ */

.textLayer{
  color-scheme:only light;

  position:absolute;

  text-align:initial;

  inset:0;

  overflow:clip;

  opacity:1;

  line-height:1;

  letter-spacing:normal;
  word-spacing:normal;

  text-size-adjust:none;

  forced-color-adjust:none;

  transform-origin:0 0;

  caret-color:CanvasText;

  z-index:2;

  pointer-events:auto;

  user-select:text;
  -webkit-user-select:text;
  -moz-user-select:text;

  -webkit-touch-callout:default;

  --min-font-size:1;

  --text-scale-factor:
    calc(
      var(--total-scale-factor) *
      var(--min-font-size)
    );

  --min-font-size-inv:
    calc(
      1 /
      var(--min-font-size)
    );

  --scale-factor:1;
  --user-unit:1;
  --total-scale-factor:1;
}

.textLayer span,
.textLayer br{
  color:transparent;

  position:absolute;

  white-space:pre;

  cursor:text;

  transform-origin:0% 0%;

  user-select:text;
  -webkit-user-select:text;
  -moz-user-select:text;
}

.textLayer > :not(.markedContent),
.textLayer .markedContent span:not(.markedContent){
  z-index:1;

  --font-height:0;

  font-size:
    calc(
      var(--text-scale-factor) *
      var(--font-height)
    );

  --scale-x:1;
  --rotate:0deg;

  transform:
    rotate(var(--rotate))
    scaleX(var(--scale-x))
    scale(var(--min-font-size-inv));
}

.textLayer .markedContent{
  display:contents;
}

.textLayer span[role="img"]{
  user-select:none;
  -webkit-user-select:none;

  cursor:default;
}

.textLayer ::selection{
  background:rgba(0,120,255,.35);
  color:transparent;
}

.textLayer ::-moz-selection{
  background:rgba(0,120,255,.35);
  color:transparent;
}

.textLayer br::selection{
  background:transparent;
}

.textLayer .endOfContent{
  display:block;

  position:absolute;

  inset:100% 0 0;

  z-index:0;

  cursor:default;

  user-select:none;
  -webkit-user-select:none;
}

.textLayer.selecting .endOfContent{
  top:0;
}

/* ============================================================
   SEARCH HIGHLIGHT LAYER

   IMPORTANT:
   This sits between the text layer and link layer.

   It does NOT interfere with text selection.
============================================================ */

.searchHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:3;

  pointer-events:none;
}

.search-highlight{
  position:absolute;

  background:
    rgba(0,140,255,.25);

  border:
    1px solid rgba(0,140,255,.32);

  border-radius:3px;

  box-shadow:
    0 0 2px rgba(0,140,255,.15);

  pointer-events:none;
}

.search-highlight.search-current{
  background:
    rgba(0,140,255,.42);

  border:
    1px solid rgba(0,120,255,.65);

  box-shadow:
    0 0 5px rgba(0,120,255,.35);
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;
  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

}

.spinner{

  border:6px solid #333;

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

/* ============================================================
   READING MODE
============================================================ */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{

}

body.reading-mode #layout{

}

body.reading-mode #viewer{

/* Floating reading-mode control */

#readingModeButton{

#readingModeButton:hover{

/* ============================================================

  }

  }

  .title-text{
    order:2;

  }
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

</style>

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc =
  "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const file =
  decodeURIComponent(
    params.get("file") || ""
  );

const title =
  decodeURIComponent(
    params.get("paper") || "PDF"
  );

const returnPage =
  decodeURIComponent(
    params.get("return") ||
    "index.html"
  );

/* ============================================================
   ELEMENTS
============================================================ */

const header =
  document.querySelector("header");

const toolbar =
  document.getElementById("toolbar");

const viewer =
  document.getElementById("viewer");

const layout =
  document.getElementById("layout");

const loadingOverlay =
  document.getElementById("loadingOverlay");

const pageInput =
  document.getElementById("pageNumber");

const zoomBox =
  document.getElementById("zoomPercent");

const searchPopup =
  document.getElementById("searchPopup");

const searchBox =
  document.getElementById("searchBox");

const menu =
  document.getElementById("menu");

const menuButton =
  document.getElementById("menuBtn");

const readingModeButton =
  document.getElementById(
    "readingModeButton"
  );

/* ============================================================
   CHROME HEIGHT
============================================================ */

function syncViewerTop(){

  if(
    document.body.classList.contains(
      "reading-mode"
    )
  ){

    return;
  }

  const headerHeight =
    header.getBoundingClientRect()
      .height;

  const toolbarHeight =
    toolbar.getBoundingClientRect()
      .height;

  const total =
    Math.ceil(
      headerHeight +
      toolbarHeight
    );

  document.documentElement.style
    .setProperty(
      "--viewer-top",
      `${total}px`
    );

  layout.style.top =
    `${total}px`;

  loadingOverlay.style.top =
    `${total}px`;
}

function scheduleChromeSync(){

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          syncViewerTop();

        }
      );

    }
  );
}

/* ============================================================
   LIMITS
============================================================ */

const MAX_ZOOM = 3;

const MAX_CANVAS_PIXELS =
  8000000;

const MAX_CANVAS_DIMENSION =
  16384;

const RENDER_MARGIN =
  "1400px";

/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{

  descriptions =
    await fetch(
      "descriptions.json"
    ).then(
      response =>
        response.json()
    );

}catch(error){

  console.warn(
    "Could not load descriptions.json:",
    error
  );
}

let newestEntry = null;

if(
  Object.keys(
    descriptions
  ).length
){

  newestEntry =
    Object.entries(
      descriptions
    ).sort(
      (a,b) =>
        new Date(
          b[1].updated || 0
        ) -
        new Date(
          a[1].updated || 0
        )
    )[0];
}

const newestKey =
  newestEntry
    ? newestEntry[0]
    : null;

const newestDate =
  newestEntry
    ? new Date(
        newestEntry[1].updated
      )
    : null;

const today =
  new Date();

const oneYearAgo =
  new Date(today);

oneYearAgo.setFullYear(
  today.getFullYear() - 1
);

const showNewestBadge =
  Boolean(
    newestDate &&
    newestDate >= oneYearAgo
  );

const paper =
  Object.values(
    descriptions
  ).find(
    item =>
      item.url === file
  );

const paperKey =
  Object.keys(
    descriptions
  ).find(
    key =>
      descriptions[key].url === file
  );

const isNewest =
  Boolean(
    showNewestBadge &&
    paperKey === newestKey
  );

document.getElementById(
  "title"
).innerHTML = `

  <div class="title-text">

    ${escapeHtml(title)}

    <span class="title-badges">

      ${
        isNewest
          ? `<span class="title-badge new">NEW</span>`
          : ""
      }

      ${
        paper?.featured
          ? `<span class="title-badge featured">FEATURED</span>`
          : ""
      }

    </span>

  </div>

`;

/* ============================================================
   VIEWPORT SIZING
============================================================ */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;

function getViewerInnerWidth(){

  const styles =
    getComputedStyle(
      viewer
    );

  return Math.max(
    1,

    viewer.clientWidth -
    parseFloat(
      styles.paddingLeft
    ) -
    parseFloat(
      styles.paddingRight
    )
  );
}

function getViewerInnerHeight(){

  const styles =
    getComputedStyle(
      viewer
    );

  return Math.max(
    1,

    viewer.clientHeight -
    parseFloat(
      styles.paddingTop
    ) -
    parseFloat(
      styles.paddingBottom
    )
  );
}

function getFitWidthScale(page){

  const viewport =
    page.getViewport({
      scale:1
    });

  return (
    getViewerInnerWidth() /
    viewport.width
  );
}

function getFitPageScale(page){

  const viewport =
    page.getViewport({
      scale:1
    });

  const widthScale =
    getViewerInnerWidth() /
    viewport.width;

  const heightScale =
    getViewerInnerHeight() /
    viewport.height;

  return Math.min(
    widthScale,
    heightScale
  );
}

const zoomLevels = [

  0.25,
  0.5,
  0.75,

  1,
  1.25,
  1.5,
  1.75,

  2,
  2.25,
  2.5,
  2.75,

  3

];

/* ============================================================
   PDF STATE
============================================================ */

let pdfDoc = null;

const pageViews = [];

let searchResults = [];

let currentSearch = -1;

let lastSearchQuery = "";

let renderGeneration = 0;

/* ============================================================
   BACK
============================================================ */

const backButton =
  document.getElementById(
    "backBtn"
  );

backButton.href =
  returnPage ||
  "index.html";

backButton.addEventListener(
  "click",
  event => {

    event.preventDefault();

    sessionStorage.setItem(
      "restoreSearch",
      "yes"
    );

    sessionStorage.setItem(
      "returnFromPage",
      "yes"
    );

    window.location.assign(
      returnPage ||
      "index.html"
    );

  }
);

/* ============================================================
   SAFE CANVAS SCALE
============================================================ */

function getSafeOutputScale(
  viewport
){

  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );

  let outputScale =
    dpr;

  const pagePixels =
    viewport.width *
    viewport.height;

  if(
    pagePixels > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        Math.sqrt(
          MAX_CANVAS_PIXELS /
          pagePixels
        )
      );
  }

  if(
    viewport.width > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.width
      );
  }

  if(
    viewport.height > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.height
      );
  }

  return Math.max(
    .35,

    Math.min(
      outputScale,
      dpr
    )
  );
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(
  view,
  scale
){

  const viewport =
    view.page.getViewport({
      scale
    });

  view.viewport =
    viewport;

  view.pageDiv.style.width =
    `${viewport.width}px`;

  view.pageDiv.style.height =
    `${viewport.height}px`;

  view.canvas.style.width =
    `${viewport.width}px`;

  view.canvas.style.height =
    `${viewport.height}px`;

  view.textLayerDiv.style.width =
    `${viewport.width}px`;

  view.textLayerDiv.style.height =
    `${viewport.height}px`;

  view.searchHighlightLayer.style.width =
    `${viewport.width}px`;

  view.searchHighlightLayer.style.height =
    `${viewport.height}px`;

  view.linkLayerDiv.style.width =
    `${viewport.width}px`;

  view.linkLayerDiv.style.height =
    `${viewport.height}px`;

  const userUnit =
    view.page.userUnit || 1;

  view.textLayerDiv.style.setProperty(
    "--scale-factor",
    String(
      viewport.scale
    )
  );

  view.textLayerDiv.style.setProperty(
    "--user-unit",
    String(
      userUnit
    )
  );

  view.textLayerDiv.style.setProperty(
    "--total-scale-factor",
    String(
      viewport.scale *
      userUnit
    )
  );

  return viewport;
}

/* ============================================================
   RESET
============================================================ */

function resetRenderedPage(
  view
){

  view.renderedScale =
    null;

  try{

    view.canvas.width = 1;
    view.canvas.height = 1;

  }catch{}

  view.textLayerDiv.replaceChildren();

  view.searchHighlightLayer.replaceChildren();

  view.linkLayerDiv.replaceChildren();

  view.textLayer = null;
  view.textLayerEnd = null;

  /*
     Search positions are invalid after zoom.
  */

  for(
    const result
    of searchResults
  ){

    if(
      result &&
      result.view === view
    ){

      result.elements = [];
    }
  }
}

/* ============================================================
   CANVAS
============================================================ */

async function paintCanvas(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  const viewport =
    view.viewport;

  const outputScale =
    getSafeOutputScale(
      viewport
    );

  const pixelWidth =
    Math.max(
      1,

      Math.floor(
        viewport.width *
        outputScale
      )
    );

  const pixelHeight =
    Math.max(
      1,

      Math.floor(
        viewport.height *
        outputScale
      )
    );

  if(
    pixelWidth >
      MAX_CANVAS_DIMENSION ||
    pixelHeight >
      MAX_CANVAS_DIMENSION
  ){

    throw new Error(
      "Safe canvas limit exceeded."
    );
  }

  view.canvas.width =
    pixelWidth;

  view.canvas.height =
    pixelHeight;

  const context =
    view.canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );

  if(!context){

    throw new Error(
      "Could not create canvas context."
    );
  }

  context.setTransform(
    outputScale,
    0,
    0,
    outputScale,
    0,
    0
  );

  await view.page.render({

    canvasContext:
      context,

    viewport

  }).promise;
}

/* ============================================================
   TEXT
============================================================ */

async function ensureTextContent(
  view
){

  if(
    view.textContent
  ){

    return view.textContent;
  }

  view.textContent =
    await view.page.getTextContent();

  return view.textContent;
}

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    const textContent =
      await ensureTextContent(
        view
      );

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    view.textLayerDiv.replaceChildren();

    const userUnit =
      view.page.userUnit || 1;

    view.textLayerDiv.style.setProperty(
      "--scale-factor",
      String(
        view.viewport.scale
      )
    );

    view.textLayerDiv.style.setProperty(
      "--user-unit",
      String(
        userUnit
      )
    );

    view.textLayerDiv.style.setProperty(
      "--total-scale-factor",
      String(
        view.viewport.scale *
        userUnit
      )
    );

    const textLayer =
      new TextLayer({

        textContentSource:
          textContent,

        container:
          view.textLayerDiv,

        viewport:
          view.viewport

      });

    await textLayer.render();

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    const endOfContent =
      document.createElement(
        "div"
      );

    endOfContent.className =
      "endOfContent";

    view.textLayerDiv.append(
      endOfContent
    );

    view.textLayerEnd =
      endOfContent;

    view.textLayerDiv.onpointerdown =
      () => {

        view.textLayerDiv.classList.add(
          "selecting"
        );

      };

    view.textLayer =
      textLayer;

  }catch(error){

    console.warn(
      `Text layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

/* ============================================================
   LINKS
============================================================ */

async function paintLinks(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    if(
      !view.annotations
    ){

      view.annotations =
        await view.page.getAnnotations({
          intent:"display"
        });
    }

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    renderLinkLayer(
      view
    );

  }catch(error){

    console.warn(
      `Link layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

function renderLinkLayer(
  view
){

  const layer =
    view.linkLayerDiv;

  layer.replaceChildren();

  if(
    !Array.isArray(
      view.annotations
    )
  ){

    return;
  }

  const viewport =
    view.viewport;

  for(
    const annotation
    of view.annotations
  ){

    if(
      annotation.subtype !==
      "Link"
    ){

      continue;
    }

    if(
      !annotation.rect ||
      annotation.rect.length !== 4
    ){

      continue;
    }

    const rect =
      viewport.convertToViewportRectangle(
        annotation.rect
      );

    const left =
      Math.min(
        rect[0],
        rect[2]
      );

    const top =
      Math.min(
        rect[1],
        rect[3]
      );

    const width =
      Math.abs(
        rect[2] -
        rect[0]
      );

    const height =
      Math.abs(
        rect[3] -
        rect[1]
      );

    if(
      width <= 0 ||
      height <= 0
    ){

      continue;
    }

    const link =
      document.createElement(
        "a"
      );

    link.className =
      "pdf-link";

    link.style.left =
      `${left}px`;

    link.style.top =
      `${top}px`;

    link.style.width =
      `${width}px`;

    link.style.height =
      `${height}px`;

    if(
      annotation.url ||
      annotation.unsafeUrl
    ){

      link.href =
        annotation.url ||
        annotation.unsafeUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

    }else if(
      annotation.dest
    ){

      link.href = "#";

      link.addEventListener(
        "click",
        async event => {

          event.preventDefault();
          event.stopPropagation();

          await openInternalDestination(
            annotation.dest
          );

        }
      );

    }else{

      continue;
    }

    layer.appendChild(
      link
    );
  }
}

/* ============================================================
   PAGE SHELL
============================================================ */

function createPageShell(
  pageNumber,
  page
){

  const pageDiv =
    document.createElement(
      "div"
    );

  pageDiv.className =
    "page";

  pageDiv.dataset.pageNumber =
    String(pageNumber);

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.className =
    "pageCanvas";

  const textLayerDiv =
    document.createElement(
      "div"
    );

  textLayerDiv.className =
    "textLayer";

  const searchHighlightLayer =
    document.createElement(
      "div"
    );

  searchHighlightLayer.className =
    "searchHighlightLayer";

  const linkLayerDiv =
    document.createElement(
      "div"
    );

  linkLayerDiv.className =
    "linkLayer";

  /*
     Correct layer order:

     Canvas
     Text
     Search highlights
     Links
  */

  pageDiv.appendChild(
    canvas
  );

  pageDiv.appendChild(
    textLayerDiv
  );

  pageDiv.appendChild(
    searchHighlightLayer
  );

  pageDiv.appendChild(
    linkLayerDiv
  );

  viewer.appendChild(
    pageDiv
  );

  const view = {

    pageNumber,
    page,

    pageDiv,
    canvas,

    textLayerDiv,
    searchHighlightLayer,
    linkLayerDiv,

    viewport:null,

    textContent:null,
    annotations:null,

    textLayer:null,
    textLayerEnd:null,

    renderedScale:null,
    renderingPromise:null

  };

  pageViews[
    pageNumber - 1
  ] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(
  view
){

  if(!view){

    return;
  }

  const generation =
    renderGeneration;

  if(
    view.renderedScale ===
    currentScale
  ){

    /*
       The page itself is already rendered.

       Search highlights may still need rebuilding.
    */

    if(
      lastSearchQuery
    ){

      rebuildSearchHighlightsForPage(
        view
      );
    }

    return;
  }

  if(
    view.renderingPromise
  ){

    return view.renderingPromise;
  }

  view.renderingPromise =
    (async () => {

      try{

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        layoutPage(
          view,
          currentScale
        );

        await paintCanvas(
          view,
          generation
        );

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        view.renderedScale =
          currentScale;

        await Promise.all([

          paintText(
            view,
            generation
          ),

          paintLinks(
            view,
            generation
          )

        ]);

        /*
           Search highlights must be generated AFTER
           the text layer has been generated.
        */

        if(
          lastSearchQuery
        ){

          rebuildSearchHighlightsForPage(
            view
          );
        }

      }catch(error){

        console.warn(
          `Page ${view.pageNumber} render failed:`,
          error
        );

      }finally{

        view.renderingPromise =
          null;
      }

    })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver =
  new IntersectionObserver(

    entries => {

      for(
        const entry
        of entries
      ){

        if(
          !entry.isIntersecting
        ){

          continue;
        }

        const view =
          pageViews.find(
            candidate =>
              candidate &&
              candidate.pageDiv ===
              entry.target
          );

        if(view){

          void renderPage(
            view
          );
        }
      }

    },

    {
      root:viewer,

      rootMargin:
        RENDER_MARGIN,

      threshold:0
    }

  );

/* ============================================================
   RENDER NEARBY
============================================================ */

function renderNearbyPages(){

  const viewerRect =
    viewer.getBoundingClientRect();

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    const rect =
      view.pageDiv
        .getBoundingClientRect();

    const nearViewport =
      rect.bottom >=
        viewerRect.top - 1400 &&
      rect.top <=
        viewerRect.bottom + 1400;

    if(
      nearViewport
    ){

      void renderPage(
        view
      );
    }
  }
}

/* ============================================================
   ENSURE PAGE
============================================================ */

async function ensurePageView(
  pageNumber
){

  if(
    !pdfDoc ||
    pageNumber < 1 ||
    pageNumber >
      pdfDoc.numPages
  ){

    return null;
  }

  const existing =
    pageViews[
      pageNumber - 1
    ];

  if(existing){

    return existing;
  }

  try{

    const page =
      await pdfDoc.getPage(
        pageNumber
      );

    const view =
      createPageShell(
        pageNumber,
        page
      );

    layoutPage(
      view,
      currentScale
    );

    pageObserver.observe(
      view.pageDiv
    );

    return view;

  }catch(error){

    console.warn(
      `Could not load page ${pageNumber}:`,
      error
    );

    return null;
  }
}

/* ============================================================
   DESTINATIONS
============================================================ */

async function resolveDestination(
  destination
){

  if(!pdfDoc){

    return null;
  }

  try{

    let dest =
      destination;

    if(
      typeof dest ===
      "string"
    ){

      dest =
        await pdfDoc.getDestination(
          dest
        );
    }

    if(
      !Array.isArray(dest) ||
      !dest.length
    ){

      return null;
    }

    const pageRef =
      dest[0];

    let pageIndex =
      -1;

    try{

      pageIndex =
        await pdfDoc.getPageIndex(
          pageRef
        );

    }catch{

      if(
        typeof pageRef ===
        "number"
      ){

        pageIndex =
          pageRef;
      }
    }

    if(
      pageIndex < 0 ||
      pageIndex >=
        pdfDoc.numPages
    ){

      return null;
    }

    return pageIndex;

  }catch(error){

    console.warn(
      "Could not resolve PDF destination:",
      error
    );

    return null;
  }
}

async function scrollToView(
  view
){

  if(!view){

    return;
  }

  await renderPage(
    view
  );

  const viewerRect =
    viewer.getBoundingClientRect();

  const pageRect =
    view.pageDiv.getBoundingClientRect();

  const targetOffset =
    pageRect.top -
    viewerRect.top +
    viewer.scrollTop;

  viewer.scrollTo({

    top:Math.max(
      0,
      targetOffset - 8
    ),

    behavior:"smooth"

  });

  pageInput.value =
    String(
      view.pageNumber
    );
}

async function openInternalDestination(
  destination
){

  const pageIndex =
    await resolveDestination(
      destination
    );

  if(
    pageIndex === null
  ){

    return;
  }

  const view =
    await ensurePageView(
      pageIndex + 1
    );

  if(!view){

    return;
  }

  await scrollToView(
    view
  );
}

/* ============================================================
   READING MODE
============================================================ */

let readingMode =
  false;

function setReadingMode(
  enabled
){

  readingMode =
    Boolean(
      enabled
    );

  if(
    readingMode
  ){

    document.body.classList.add(
      "reading-mode"
    );

    menu.style.display =
      "none";

    searchPopup.classList.add(
      "hidden"
    );

    readingModeButton.title =
      "Exit Reading Mode";

  }else{

    document.body.classList.remove(
      "reading-mode"
    );

    readingModeButton.title =
      "Reading Mode";
  }

  requestAnimationFrame(
    () => {

      /*
         Recalculate the actual viewer height.

         This is important because reading mode removes
         the header, toolbar AND bottom title bar.
      */

      if(
        readingMode
      ){

        layout.style.top =
          "0";

        layout.style.bottom =
          "0";

        viewer.style.height =
          "100%";

        loadingOverlay.style.top =
          "0";

      }else{

        syncViewerTop();

      }

      renderGeneration++;

      for(
        const view
        of pageViews
      ){

        if(!view){

          continue;
        }

        layoutPage(
          view,
          currentScale
        );

        resetRenderedPage(
          view
        );
      }

      renderNearbyPages();

    }
  );
}

readingModeButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    setReadingMode(
      !readingMode
    );

  }
);

/* ============================================================
   RESCALE
============================================================ */

async function rescaleAndRender(){

  renderGeneration++;

  currentScale =
    baseScale *
    zoomLevel;

  if(
    currentScale <= 0
  ){

    currentScale = 1;
  }

  zoomBox.value =
    `${Math.round(
      zoomLevel * 100
    )}%`;

  const scrollRatio =
    viewer.scrollHeight >
    viewer.clientHeight

      ? viewer.scrollTop /
        (
          viewer.scrollHeight -
          viewer.clientHeight
        )

      : 0;

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    layoutPage(
      view,
      currentScale
    );

    resetRenderedPage(
      view
    );
  }

  renderNearbyPages();

  requestAnimationFrame(
    () => {

      if(
        viewer.scrollHeight >
        viewer.clientHeight
      ){

        viewer.scrollTop =
          scrollRatio *
          (
            viewer.scrollHeight -
            viewer.clientHeight
          );
      }

    }
  );
}

/* ============================================================
   SEARCH — DATA
============================================================ */

/*
   Each search result is an individual occurrence.

   Example:

   Page 1: 3 matches
   Page 2: 4 matches
   Page 5: 11 matches

   searchResults.length = 18

   NOT 3 pages.
*/

function normalizeSearchText(
  value
){

  return String(
    value || ""
  )
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}

/*
   Creates a searchable string from PDF.js text items.

   We intentionally preserve every item's text separately
   because the individual span positions are what allow us
   to create accurate highlights.
*/

function getTextItems(
  view
){

  if(
    !view.textContent ||
    !Array.isArray(
      view.textContent.items
    )
  ){

    return [];
  }

  return view.textContent.items.filter(
    item =>
      typeof item.str ===
      "string" &&
      item.str.length > 0
  );
}

/* ============================================================
   SEARCH — BUILD OCCURRENCES
============================================================ */

function findOccurrencesOnPage(
  view,
  query
){

  const results = [];

  if(
    !view ||
    !query
  ){

    return results;
  }

  const items =
    getTextItems(
      view
    );

  if(!items.length){

    return results;
  }

  const queryLower =
    query.toLowerCase();

  /*
     Each PDF text item corresponds to one or more text
     spans in the text layer.

     We search across the complete page text, but then map
     each match back onto the relevant text items.
  */

  let fullText = "";

  const itemRanges = [];

  for(
    let i = 0;
    i < items.length;
    i++
  ){

    const item =
      items[i];

    const start =
      fullText.length;

    fullText +=
      item.str;

    const end =
      fullText.length;

    itemRanges.push({

      item,

      start,

      end,

      index:i

    });

    /*
       PDF text items often represent spaces separately,
       so add a logical separator when appropriate.

       Do NOT add it after the last item.
    */

    if(
      i <
      items.length - 1
    ){

      fullText += " ";
    }
  }

  const searchableText =
    fullText.toLowerCase();

  let position = 0;

  while(true){

    const matchIndex =
      searchableText.indexOf(
        queryLower,
        position
      );

    if(
      matchIndex === -1
    ){

      break;
    }

    const matchEnd =
      matchIndex +
      queryLower.length;

    const matchingItems =
      itemRanges.filter(
        range =>
          range.end >
            matchIndex &&
          range.start <
            matchEnd
      );

    if(
      matchingItems.length
    ){

      const result = {

        view,

        pageNumber:
          view.pageNumber,

        matchIndex,

        matchEnd,

        items:
          matchingItems.map(
            range =>
              range.item
          ),

        elements:[]

      };

      results.push(
        result
      );
    }

    /*
       Move by one character so overlapping/adjacent
       occurrences are not skipped.
    */

    position =
      matchIndex + 1;
  }

  return results;
}

/* ============================================================
   SEARCH — FIND SPANS
============================================================ */

function getTextLayerSpans(
  view
){

  return Array.from(
    view.textLayerDiv.querySelectorAll(
      "span"
    )
  ).filter(
    span =>
      span.textContent &&
      span.textContent.length
  );
}

/*
   PDF.js may create spans that correspond very closely to
   text items, but not always one-to-one.

   The safest way to locate a search match visually is to
   compare the text layer's spans against the PDF text items
   in document order.
*/

function getSpanForTextItem(
  view,
  item,
  itemIndex
){

  const spans =
    getTextLayerSpans(
      view
    );

  if(
    !spans.length
  ){

    return null;
  }

  /*
     Cache the mapping after the first lookup.
  */

  if(
    !view.spanMap
  ){

    view.spanMap = [];

    let spanIndex = 0;

    const items =
      getTextItems(
        view
      );

    for(
      let i = 0;
      i < items.length;
      i++
    ){

      const itemText =
        items[i].str;

      let collected = "";

      const matchedSpans = [];

      while(
        spanIndex <
          spans.length &&
        collected.length <
          itemText.length
      ){

        const span =
          spans[spanIndex];

        const text =
          span.textContent || "";

        matchedSpans.push(
          span
        );

        collected +=
          text;

        spanIndex++;
      }

      view.spanMap[i] =
        matchedSpans;
    }
  }

  return (
    view.spanMap[itemIndex] ||
    null
  );
}

/* ============================================================
   SEARCH — HIGHLIGHT ONE RESULT
============================================================ */

function highlightSearchResult(
  result
){

  const view =
    result.view;

  if(!view){

    return;
  }

  const layer =
    view.searchHighlightLayer;

  if(!layer){

    return;
  }

  /*
     Remove old highlight elements belonging to this result.
  */

  result.elements = [];

  const items =
    getTextItems(
      view
    );

  const queryLength =
    result.matchEnd -
    result.matchIndex;

  /*
     Determine the text range within each PDF text item.
  */

  for(
    let itemIndex = 0;
    itemIndex < items.length;
    itemIndex++
  ){

    const item =
      items[itemIndex];

    const itemStart =
      getItemStart(
        view,
        itemIndex
      );

    const itemEnd =
      itemStart +
      item.str.length;

    const overlapStart =
      Math.max(
        result.matchIndex,
        itemStart
      );

    const overlapEnd =
      Math.min(
        result.matchEnd,
        itemEnd
      );

    if(
      overlapEnd <=
      overlapStart
    ){

      continue;
    }

    const spans =
      getSpanForTextItem(
        view,
        item,
        itemIndex
      );

    if(
      !spans ||
      !spans.length
    ){

      continue;
    }

    /*
       If the match covers the item, highlight the entire
       item span.

       If it covers only part of the item, use the span's
       bounding box. This is visually accurate enough while
       keeping the actual text layer untouched and selectable.
    */

    const firstSpan =
      spans[0];

    const lastSpan =
      spans[
        spans.length - 1
      ];

    const firstRect =
      firstSpan.getBoundingClientRect();

    const lastRect =
      lastSpan.getBoundingClientRect();

    const layerRect =
      layer.getBoundingClientRect();

    if(
      firstRect.width <= 0 ||
      firstRect.height <= 0
    ){

      continue;
    }

    const left =
      firstRect.left -
      layerRect.left;

    const top =
      firstRect.top -
      layerRect.top;

    const right =
      lastRect.right -
      layerRect.left;

    const bottom =
      lastRect.bottom -
      layerRect.top;

    const highlight =
      document.createElement(
        "div"
      );

    highlight.className =
      "search-highlight";

    highlight.style.left =
      `${Math.max(0,left)}px`;

    highlight.style.top =
      `${Math.max(0,top)}px`;

    highlight.style.width =
      `${Math.max(2,right-left)}px`;

    highlight.style.height =
      `${Math.max(2,bottom-top)}px`;

    layer.appendChild(
      highlight
    );

    result.elements.push(
      highlight
    );
  }

  /*
     Fallback when the PDF text layer does not map cleanly.

     Highlight the complete text-item boxes rather than
     displaying nothing.
  */

  if(
    result.elements.length === 0
  ){

    for(
      let itemIndex = 0;
      itemIndex < items.length;
      itemIndex++
    ){

      const item =
        items[itemIndex];

      const itemStart =
        getItemStart(
          view,
          itemIndex
        );

      const itemEnd =
        itemStart +
        item.str.length;

      if(
        itemEnd <=
          result.matchIndex ||
        itemStart >=
          result.matchEnd
      ){

        continue;
      }

      const spans =
        getSpanForTextItem(
          view,
          item,
          itemIndex
        );

      if(
        !spans ||
        !spans.length
      ){

        continue;
      }

      for(
        const span
        of spans
      ){

        const rect =
          span.getBoundingClientRect();

        const layerRect =
          layer.getBoundingClientRect();

        const highlight =
          document.createElement(
            "div"
          );

        highlight.className =
          "search-highlight";

        highlight.style.left =
          `${rect.left-layerRect.left}px`;

        highlight.style.top =
          `${rect.top-layerRect.top}px`;

        highlight.style.width =
          `${Math.max(2,rect.width)}px`;

        highlight.style.height =
          `${Math.max(2,rect.height)}px`;

        layer.appendChild(
          highlight
        );

        result.elements.push(
          highlight
        );
      }
    }
  }

  return result.elements;
}

/* ============================================================
   SEARCH — ITEM START
============================================================ */

function getItemStart(
  view,
  itemIndex
){

  const items =
    getTextItems(
      view
    );

  let start = 0;

  for(
    let i = 0;
    i < itemIndex;
    i++
  ){

    start +=
      items[i].str.length;

    if(
      i <
      items.length - 1
    ){

      start += 1;
    }
  }

  return start;
}

/* ============================================================
   SEARCH — REBUILD PAGE HIGHLIGHTS
============================================================ */

function rebuildSearchHighlightsForPage(
  view
){

  if(
    !view ||
    !lastSearchQuery
  ){

    return;
  }

  const layer =
    view.searchHighlightLayer;

  if(!layer){

    return;
  }

  layer.replaceChildren();

  /*
     Remove stale elements.
  */

  for(
    const result
    of searchResults
  ){

    if(
      result &&
      result.view === view
    ){

      result.elements = [];
    }
  }

  const pageResults =
    searchResults.filter(
      result =>
        result.view === view
    );

  for(
    const result
    of pageResults
  ){

    highlightSearchResult(
      result
    );
  }

  markCurrentSearch();
}

/* ============================================================
   SEARCH — CLEAR
============================================================ */

function clearSearchHighlights(){

  for(
    const view
    of pageViews
  ){

    if(
      !view
    ){

      continue;
    }

    if(
      view.searchHighlightLayer
    ){

      view.searchHighlightLayer.replaceChildren();
    }
  }

  for(
    const result
    of searchResults
  ){

    if(result){

      result.elements = [];
    }
  }
}

/* ============================================================
   SEARCH — MARK CURRENT
============================================================ */

function markCurrentSearch(){

  /*
     First make every result normal blue.
  */

  for(
    const result
    of searchResults
  ){

    if(
      !result ||
      !result.elements
    ){

      continue;
    }

    for(
      const element
      of result.elements
    ){

      element.classList.remove(
        "search-current"
      );
    }
  }

  if(
    currentSearch < 0 ||
    currentSearch >=
      searchResults.length
  ){

    return;
  }

  const current =
    searchResults[
      currentSearch
    ];

  if(
    !current ||
    !current.elements
  ){

    return;
  }

  for(
    const element
    of current.elements
  ){

    element.classList.add(
      "search-current"
    );
  }
}

/* ============================================================
   SEARCH — COUNTER
============================================================ */

function updateSearchCounter(){

  const counter =
    document.getElementById(
      "searchResults"
    );

  if(
    !searchResults.length ||
    currentSearch < 0
  ){

    counter.textContent =
      "0 of 0";

    return;
  }

  counter.textContent =
    `${currentSearch + 1} of ${searchResults.length}`;
}

/* ============================================================
   SEARCH — MAIN SEARCH
============================================================ */

async function searchPDF(
  query
){

  query =
    normalizeSearchText(
      query
    );

  searchResults = [];

  currentSearch =
    -1;

  clearSearchHighlights();

  if(
    query === ""
  ){

    lastSearchQuery =
      "";

    updateSearchCounter();

    return;
  }

  lastSearchQuery =
    query;

  /*
     Make sure every page exists.

     This does NOT render every canvas.
     It only obtains the PDF page objects and text data.
  */

  for(
    let pageNumber = 1;

    pageNumber <=
      (pdfDoc?.numPages || 0);

    pageNumber++
  ){

    const view =
      await ensurePageView(
        pageNumber
      );

    if(
      !view
    ){

      continue;
    }

    try{

      await ensureTextContent(
        view
      );

    }catch(error){

      console.warn(
        `Could not extract text from page ${pageNumber}:`,
        error
      );
    }

    /*
       Yield occasionally so mobile browsers do not appear
       frozen during a large PDF search.
    */

    if(
      pageNumber % 3 === 0
    ){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            0
          )
      );
    }
  }

  /*
     Find EVERY occurrence on EVERY page.
  */

  for(
    const view
    of pageViews
  ){

    if(
      !view ||
      !view.textContent
    ){

      continue;
    }

    const occurrences =
      findOccurrencesOnPage(
        view,
        query
      );

    searchResults.push(
      ...occurrences
    );
  }

  if(
    !searchResults.length
  ){

    updateSearchCounter();

    alert(
      "No results found."
    );

    return;
  }

  /*
     Render pages containing matches so their text spans
     exist and can be highlighted.
  */

  for(
    const result
    of searchResults
  ){

    if(
      result.view.renderedScale !==
      currentScale
    ){

      await renderPage(
        result.view
      );
    }

    /*
       Avoid repeatedly rebuilding the entire page.
    */

    if(
      result.elements.length === 0
    ){

      highlightSearchResult(
        result
      );
    }
  }

  /*
     Start at the FIRST INDIVIDUAL occurrence.
  */

  currentSearch =
    0;

  markCurrentSearch();

  updateSearchCounter();

  await goToSearchResult(
    currentSearch
  );
}

/* ============================================================
   SEARCH — GO TO RESULT
============================================================ */

async function goToSearchResult(
  index
){

  if(
    !searchResults.length
  ){

    return;
  }

  if(
    index < 0
  ){

    index =
      searchResults.length - 1;
  }

  if(
    index >=
    searchResults.length
  ){

    index = 0;
  }

  currentSearch =
    index;

  const result =
    searchResults[
      currentSearch
    ];

  if(!result){

    return;
  }

  const view =
    result.view;

  if(!view){

    return;
  }

  /*
     Make sure this page is rendered.
  */

  await renderPage(
    view
  );

  /*
     If zoom/rendering destroyed the highlight, recreate it.
  */

  if(
    !result.elements ||
    result.elements.length === 0
  ){

    /*
       Rebuild all results on this page because the span
       positions may have changed.
    */

    rebuildSearchHighlightsForPage(
      view
    );

    /*
       The result object is still the same object, so its
       elements array has now been updated.
    */

    if(
      !result.elements ||
      !result.elements.length
    ){

      highlightSearchResult(
        result
      );
    }
  }

  markCurrentSearch();

  updateSearchCounter();

  pageInput.value =
    String(
      view.pageNumber
    );

  /*
     THIS IS THE IMPORTANT PART.

     Scroll to the actual highlight, not merely to the page.

     Two animation frames give the browser time to finish
     layout before measuring/scrolling.
  */

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          const currentResult =
            searchResults[
              currentSearch
            ];

          const highlight =
            currentResult?.elements?.[0];

          if(
            highlight &&
            highlight.isConnected
          ){

            highlight.scrollIntoView({

              behavior:"smooth",

              block:"center",

              inline:"nearest"

            });

          }else{

            /*
               Safe fallback.
            */

            view.pageDiv.scrollIntoView({

              behavior:"smooth",

              block:"center",

              inline:"nearest"

            });
          }

        }
      );

    }
  );
}

/* ============================================================
   SEARCH — NEXT/PREVIOUS
============================================================ */

async function searchOrAdvance(
  step
){

  const query =
    normalizeSearchText(
      searchBox.value
    );

  if(
    !query
  ){

    return;
  }

  /*
     New query.
  */

  if(
    query !==
    lastSearchQuery ||
    searchResults.length === 0
  ){

    await searchPDF(
      query
    );

    return;
  }

  /*
     Move through individual occurrences.

     This is NOT page-based.
  */

  await goToSearchResult(
    currentSearch + step
  );
}

/* ============================================================
   SEARCH INPUT
============================================================ */

searchBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      /*
         Shift + Enter = previous.
         Enter = next.
      */

      await searchOrAdvance(
        event.shiftKey
          ? -1
          : 1
      );
    }

  }
);

document.getElementById(
  "prevResult"
).addEventListener(
  "click",
  async event => {

    event.stopPropagation();

    await searchOrAdvance(
      -1
    );

  }
);

document.getElementById(
  "nextResult"
).addEventListener(
  "click",
  async event => {

    event.stopPropagation();

    await searchOrAdvance(
      1
    );

  }
);

/* ============================================================
   SEARCH BUTTON
============================================================ */

document.getElementById(
  "searchButton"
).onclick =
  event => {

    event.stopPropagation();

    searchPopup.classList.toggle(
      "hidden"
    );

    if(
      !searchPopup.classList.contains(
        "hidden"
      )
    ){

      searchBox.focus();

    }

  };

searchPopup.addEventListener(
  "click",
  event =>
    event.stopPropagation()
);

document.addEventListener(
  "click",
  () =>
    searchPopup.classList.add(
      "hidden"
    )
);

/* ============================================================
   SELECTION CLEANUP
============================================================ */

document.addEventListener(
  "selectionchange",
  () => {

    const selection =
      document.getSelection();

    if(
      selection &&
      selection.toString().length
    ){

      return;
    }

    for(
      const view
      of pageViews
    ){

      if(
        view?.textLayerDiv
      ){

        view.textLayerDiv.classList.remove(
          "selecting"
        );
      }
    }

  }
);

/* ============================================================
   ZOOM IN
============================================================ */

document.getElementById(
  "zoomIn"
).onclick =
  async () => {

    const next =
      zoomLevels.find(
        level =>
          level >
          zoomLevel
      );

    if(
      next === undefined
    ){

      return;
    }

    zoomLevel =
      Math.min(
        next,
        MAX_ZOOM
      );

    await rescaleAndRender();

  };

/* ============================================================
   ZOOM OUT
============================================================ */

document.getElementById(
  "zoomOut"
).onclick =
  async () => {

    const previous =
      [...zoomLevels]
        .reverse()
        .find(
          level =>
            level <
            zoomLevel
        );

    if(
      previous === undefined
    ){

      return;
    }

    zoomLevel =
      previous;

    await rescaleAndRender();

  };

/* ============================================================
   FIT WIDTH
============================================================ */

document.getElementById(
  "fitWidth"
).onclick =
  async () => {

    const firstView =
      pageViews.find(
        Boolean
      );

    if(!firstView){

      return;
    }

    baseScale =
      getFitWidthScale(
        firstView.page
      );

    zoomLevel =
      1;

    await rescaleAndRender();

  };

/* ============================================================
   FIT PAGE
============================================================ */

document.getElementById(
  "fitPage"
).onclick =
  async () => {

    const firstView =
      pageViews.find(
        Boolean
      );

    if(!firstView){

      return;
    }

    baseScale =
      getFitPageScale(
        firstView.page
      );

    zoomLevel =
      1;

    await rescaleAndRender();

  };

/* ============================================================
   MANUAL ZOOM
============================================================ */

zoomBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !==
      "Enter"
    ){

      return;
    }

    let value =
      parseFloat(
        zoomBox.value.replace(
          "%",
          ""
        )
      );

    if(
      Number.isNaN(
        value
      )
    ){

      value = 100;
    }

    value =
      Math.max(
        25,
        Math.min(
          300,
          value
        )
      );

    zoomLevel =
      value / 100;

    await rescaleAndRender();

  }
);

/* ============================================================
   PAGE NAVIGATION
============================================================ */

pageInput.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !==
      "Enter"
    ){

      return;
    }

    let pageNumber =
      parseInt(
        pageInput.value,
        10
      );

    if(
      Number.isNaN(
        pageNumber
      )
    ){

      pageNumber = 1;
    }

    pageNumber =
      Math.max(
        1,
        Math.min(
          pdfDoc?.numPages || 1,
          pageNumber
        )
      );

    const view =
      await ensurePageView(
        pageNumber
      );

    if(!view){

      return;
    }

    pageInput.value =
      String(
        pageNumber
      );

    await scrollToView(
      view
    );

  }
);

/* ============================================================
   CURRENT PAGE
============================================================ */

viewer.addEventListener(
  "scroll",
  () => {

    if(
      !pageViews.length
    ){

      return;
    }

    const viewerRect =
      viewer.getBoundingClientRect();

    let currentPage =
      1;

    let bestDistance =
      Infinity;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      const rect =
        view.pageDiv
          .getBoundingClientRect();

      const distance =
        Math.abs(
          rect.top -
          viewerRect.top -
          8
        );

      if(
        distance <
        bestDistance
      ){

        bestDistance =
          distance;

        currentPage =
          view.pageNumber;
      }
    }

    pageInput.value =
      String(
        currentPage
      );

    renderNearbyPages();

  }
);

/* ============================================================
   RESIZE
============================================================ */

let resizeTimer =
  null;

window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        async () => {

          syncViewerTop();

          if(
            !pageViews.length
          ){

            return;
          }

          if(
            window.innerWidth <=
            768
          ){

            const firstView =
              pageViews.find(
                Boolean
              );

            if(!firstView){

              return;
            }

            baseScale =
              getFitWidthScale(
                firstView.page
              );
          }

          await rescaleAndRender();

        },
        150
      );

  }
);

/* ============================================================
   CHROME RESIZE OBSERVER
============================================================ */

if(
  "ResizeObserver" in window
){

  const chromeObserver =
    new ResizeObserver(
      () => {

        syncViewerTop();

      }
    );

  chromeObserver.observe(
    header
  );

  chromeObserver.observe(
    toolbar
  );
}

/* ============================================================
   LOAD PDF
============================================================ */

try{

  if(!file){

    throw new Error(
      "No PDF file was supplied."
    );
  }

  syncViewerTop();

  const loadingTask =
    getDocument({

      url:file,

      disableAutoFetch:false,

      disableStream:false

    });

  pdfDoc =
    await loadingTask.promise;

  document.getElementById(
    "pageCount"
  ).textContent =
    `of ${pdfDoc.numPages}`;

  /*
     Load page 1 first.
  */

  const firstPage =
    await pdfDoc.getPage(
      1
    );

  baseScale =
    getFitWidthScale(
      firstPage
    );

  zoomLevel =
    1;

  currentScale =
    baseScale;

  zoomBox.value =
    "100%";

  const firstView =
    createPageShell(
      1,
      firstPage
    );

  layoutPage(
    firstView,
    currentScale
  );

  pageObserver.observe(
    firstView.pageDiv
  );

  syncViewerTop();

  await renderPage(
    firstView
  );

  loadingOverlay.style.display =
    "none";

  /*
     Initialize the remaining pages in the background.
  */

  void (async () => {

    for(
      let pageNumber = 2;

      pageNumber <=
        pdfDoc.numPages;

      pageNumber++
    ){

      try{

        if(
          pageViews[
            pageNumber - 1
          ]
        ){

          continue;
        }

        const page =
          await pdfDoc.getPage(
            pageNumber
          );

        const view =
          createPageShell(
            pageNumber,
            page
          );

        layoutPage(
          view,
          currentScale
        );

        pageObserver.observe(
          view.pageDiv
        );

        const viewerRect =
          viewer.getBoundingClientRect();

        const pageRect =
          view.pageDiv
            .getBoundingClientRect();

        if(
          pageRect.top <=
            viewerRect.bottom + 1400
        ){

          void renderPage(
            view
          );
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

      }catch(error){

        console.warn(
          `Could not initialize page ${pageNumber}:`,
          error
        );
      }

    }

  })();

}catch(error){

  console.error(
    "PDF loading failed:",
    error
  );

  loadingOverlay.style.display =
    "none";

  viewer.innerHTML = `

    <div style="
      color:#fff;
      padding:40px;
      text-align:center;
      max-width:600px;
    ">

      <h2>
        Unable to load PDF
      </h2>

      <p>
        ${escapeHtml(
          error?.message ||
          "Unknown error."
        )}
      </p>

    </div>

  `;
}

/* ============================================================
   MENU
============================================================ */

menuButton.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    menu.style.display =
      menu.style.display === "block"
        ? "none"
        : "block";

  }
);

menu.addEventListener(
  "click",
  event =>
    event.stopPropagation()
);

document.addEventListener(
  "click",
  () => {

    menu.style.display =
      "none";

  }
);

/* ============================================================
   DOWNLOAD
============================================================ */

document.getElementById(
  "downloadBtn"
).addEventListener(
  "click",
  () => {

    const link =
      document.createElement(
        "a"
      );

    link.href =
      file;

    link.download =
      file.split("/")
        .pop();

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    menu.style.display =
      "none";

  }
);

/* ============================================================
   NEW TAB
============================================================ */

document.getElementById(
  "newTabBtn"
).onclick =
  () =>
    window.open(
      file,
      "_blank"
    );

/* ============================================================
   FULLSCREEN
============================================================ */

document.getElementById(
  "fullscreenBtn"
).onclick =
  async () => {

    try{

      await document.documentElement
        .requestFullscreen();

    }catch(error){

      console.warn(
        "Fullscreen failed:",
        error
      );
    }

  };

/* ============================================================
   SHARE
============================================================ */

document.getElementById(
  "copyLinkBtn"
).addEventListener(
  "click",
  async () => {

    const url =
      window.location.href;

    menu.style.display =
      "none";

    if(
      navigator.share
    ){

      try{

        await navigator.share({

          title:
            document.title,

          text:
            document.getElementById(
              "title"
            ).textContent,

          url

        });

      }catch{

        /* User cancelled */

      }

      return;
    }

    try{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Link copied to clipboard!"
      );

    }catch{

      window.prompt(
        "Copy this link:",
        url
      );

    }

  }
);

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  () => {

    renderGeneration++;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      try{

        pageObserver.unobserve(
          view.pageDiv
        );

      }catch{}

      try{

        view.canvas.width =
          1;

        view.canvas.height =
          1;

      }catch{}

    }

    try{

      if(pdfDoc){

        pdfDoc.destroy();

      }

    }catch{}

  }
);

/* ============================================================
   INITIAL CHROME SYNC
============================================================ */

scheduleChromeSync();

</script>
