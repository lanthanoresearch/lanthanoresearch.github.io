/* ============================================================
   SEARCH POPUP CLICK
============================================================ */

searchPopup.addEventListener("click", event => {
  event.stopPropagation();
});

/* ============================================================
   OUTSIDE SEARCH CLICK = CANCEL SEARCH

   A direct tap outside the search popup cancels the search. A
   scroll or drag must NOT cancel it — so this tracks whether the
   pointer actually moved between down and up, the same way the
   reading-mode tap detection above does, and only treats it as a
   "click" (and closes the search) when it didn't.
============================================================ */

let searchOutsideTap = {
  active:false,
  moved:false,
  startX:0,
  startY:0
};

document.addEventListener("pointerdown", event => {

  if(searchPopup.classList.contains("hidden")){
    searchOutsideTap.active = false;
    return;
  }

  searchOutsideTap.active = true;
  searchOutsideTap.moved = false;
  searchOutsideTap.startX = event.clientX;
  searchOutsideTap.startY = event.clientY;

});

document.addEventListener("pointermove", event => {

  if(!searchOutsideTap.active){
    return;
  }

  if(Math.hypot(event.clientX - searchOutsideTap.startX, event.clientY - searchOutsideTap.startY) > 10){
    searchOutsideTap.moved = true;
  }

});

document.addEventListener("pointerup", event => {

  if(!searchOutsideTap.active){
    return;
  }

  const moved = searchOutsideTap.moved;

  searchOutsideTap.active = false;

  if(moved){
    // Was a scroll/drag, not a click — leave the search open.
    return;
  }

  if(searchPopup.classList.contains("hidden")){
    return;
  }

  if(searchPopup.contains(event.target)){
    return;
  }

  if(event.target.closest("#searchButton")){
    return;
  }

  closeSearch();

});

/* ============================================================
   TABLE OF CONTENTS

   Populated after the PDF loads (see LOAD PDF below), from
   pdfDoc.getOutline(). The button is always visible (floating,
   outside the toolbar, so it survives reading mode too): if the
   document has an outline, tapping it opens a full panel of
   clickable links - each showing the page it jumps to - that
   jump to each destination; if it doesn't, tapping it explains
   that plainly instead of doing nothing, so the missing panel
   doesn't look like a bug.
============================================================ */

function renderTocList(items, container){

  const list = document.createElement("ul");

  list.className = "tocList";

  for(const item of items){

    const li = document.createElement("li");

    if(item.dest){

      const button = document.createElement("button");

      button.type = "button";

      const titleSpan = document.createElement("span");

      titleSpan.className = "tocItemTitle";
      titleSpan.textContent = item.title || "Untitled section";

      const pageSpan = document.createElement("span");

      pageSpan.className = "tocItemPage";

      button.appendChild(titleSpan);
      button.appendChild(pageSpan);

      button.addEventListener("click", async () => {
        await openInternalDestination(item.dest);
        closeToc();
      });

      li.appendChild(button);

      // Resolving a destination to a page number is async (it may
      // need pdfDoc.getDestination + getPageIndex), so it's kicked
      // off without blocking the rest of the list from rendering -
      // the page number just fills in a moment later.
      resolveDestination(item.dest).then(pageIndex => {

        if(pageIndex !== null){
          pageSpan.textContent = String(pageIndex + 1);
        }

      });

    }else{

      const label = document.createElement("div");

      label.className = "tocLabelOnly";
      label.textContent = item.title || "Untitled section";

      li.appendChild(label);
    }

    if(Array.isArray(item.items) && item.items.length){
      renderTocList(item.items, li);
    }

    list.appendChild(li);
  }

  container.appendChild(list);
}

function setupTocButton(outlineItems){

  const hasToc = Array.isArray(outlineItems) && outlineItems.length > 0;

  tocContent.innerHTML = "";

  if(hasToc){

    tocButton.classList.remove("toc-empty");
    tocButton.title = "Table of Contents";

    renderTocList(outlineItems, tocContent);

  }else{

    tocButton.classList.add("toc-empty");
    tocButton.title = "No table of contents in this PDF";

    tocContent.innerHTML = `<div class="tocEmptyMessage">This PDF doesn't have a table of contents.</div>`;
  }
}

/*
   Closing only ever toggles the hidden class - it never touches
   scroll position, so whatever page you were reading stays right
   where it was underneath.
*/
function closeToc(){
  tocPopup.classList.add("hidden");
}

tocButton.addEventListener("click", event => {

  event.stopPropagation();

  closeSearch();

  if(tocPopup.classList.contains("hidden")){
    tocPopup.classList.remove("hidden");
  }else{
    closeToc();
  }

});

tocCloseBtn.addEventListener("click", event => {
  event.stopPropagation();
  closeToc();
});

tocPopup.addEventListener("click", event => {
  event.stopPropagation();
});

document.addEventListener("click", event => {

  if(tocPopup.classList.contains("hidden")){
    return;
  }

  if(tocPopup.contains(event.target) || event.target.closest("#tocButton")){
    return;
  }

  closeToc();
});

/* ============================================================
   ZOOM
============================================================ */

async function rescaleAndRender(){

  renderGeneration++;

  currentScale = baseScale * zoomLevel;

  if(currentScale <= 0){
    currentScale = 1;
  }

  zoomBox.value = `${Math.round(zoomLevel * 100)}%`;

  const ratio = viewer.scrollHeight > viewer.clientHeight
    ? viewer.scrollTop / (viewer.scrollHeight - viewer.clientHeight)
    : 0;

  for(const view of pageViews){

    if(!view){
      continue;
    }

    layoutPage(view, currentScale);
    resetRenderedPage(view);
  }

  renderNearbyPages();

  requestAnimationFrame(async () => {

    if(viewer.scrollHeight > viewer.clientHeight){
      viewer.scrollTop = ratio * (viewer.scrollHeight - viewer.clientHeight);
    }

    if(lastSearchQuery){

      // Not a new search — just re-creating highlights at the new
      // scale — so preserve the existing order/selection instead
      // of re-anchoring numbering to the current scroll position.
      runSearchNow(lastSearchQuery, false);

      await currentSearchOperation;
    }

    updateSideScroller();

  });
}

document.getElementById("zoomIn").addEventListener("click", async () => {

  const next = zoomLevels.find(level => level > zoomLevel);

  if(next !== undefined){
    zoomLevel = next;
    await rescaleAndRender();
  }
});

document.getElementById("zoomOut").addEventListener("click", async () => {

  const previous = [...zoomLevels].reverse().find(level => level < zoomLevel);

  if(previous !== undefined){
    zoomLevel = previous;
    await rescaleAndRender();
  }
});

/* ============================================================
   MANUAL ZOOM
============================================================ */

zoomBox.addEventListener("keydown", async event => {

  if(event.key !== "Enter"){
    return;
  }

  let value = parseFloat(zoomBox.value.replace("%", ""));

  if(Number.isNaN(value)){
    value = 100;
  }

  value = Math.max(25, Math.min(300, value));

  zoomLevel = value / 100;

  await rescaleAndRender();
});

/* ============================================================
   FIT WIDTH
============================================================ */

document.getElementById("fitWidth").addEventListener("click", async () => {

  const firstView = pageViews.find(Boolean);

  if(!firstView){
    return;
  }

  baseScale = getFitWidthScale(firstView.page);
  zoomLevel = 1;

  await rescaleAndRender();
});

/* ============================================================
   FIT PAGE
============================================================ */

document.getElementById("fitPage").addEventListener("click", async () => {

  const firstView = pageViews.find(Boolean);

  if(!firstView){
    return;
  }

  baseScale = getFitPageScale(firstView.page);
  zoomLevel = 1;

  await rescaleAndRender();
});

/* ============================================================
   PAGE NAVIGATION
============================================================ */

pageInput.addEventListener("keydown", async event => {

  if(event.key !== "Enter"){
    return;
  }

  let pageNumber = parseInt(pageInput.value, 10);

  if(Number.isNaN(pageNumber)){
    pageNumber = 1;
  }

  pageNumber = Math.max(1, Math.min(pdfDoc?.numPages || 1, pageNumber));

  const view = await ensurePageView(pageNumber);

  if(view){

    pageInput.value = String(pageNumber);

    await scrollToView(view);
  }
});

/* ============================================================
   SIDE SCROLLER

   Keeps the draggable thumb's size/position in sync with the
   viewer's actual scroll state, and lets the person drag it (or
   tap the track) to scroll the document instead of using the
   native scrollbar / touch-scrolling.
============================================================ */

const MIN_SCROLLER_THUMB_HEIGHT = 34;

function updateSideScroller(){

  if(!pageViews.length || viewer.scrollHeight <= viewer.clientHeight + 1){

    sideScroller.style.display = "none";

    return;
  }

  sideScroller.style.display = "flex";

  const trackHeight = sideScrollerTrack.clientHeight;

  if(trackHeight <= 0){
    return;
  }

  const visibleRatio = viewer.clientHeight / viewer.scrollHeight;

  const thumbHeight = Math.min(
    trackHeight,
    Math.max(MIN_SCROLLER_THUMB_HEIGHT, trackHeight * visibleRatio)
  );

  const maxScrollTop = viewer.scrollHeight - viewer.clientHeight;
  const scrollRatio = maxScrollTop > 0 ? viewer.scrollTop / maxScrollTop : 0;

  const maxThumbTop = trackHeight - thumbHeight;

  sideScrollerThumb.style.height = `${thumbHeight}px`;
  sideScrollerThumb.style.top = `${scrollRatio * maxThumbTop}px`;
}

/*
   Dragging the thumb: pointer capture keeps receiving move/up
   events even if the pointer strays off the thin thumb element,
   which matters a lot on touch.
*/

let scrollerDrag = {
  active:false,
  startY:0,
  startScrollTop:0,
  thumbHeight:0,
  trackHeight:0
};

sideScrollerThumb.addEventListener("pointerdown", event => {

  event.preventDefault();
  event.stopPropagation();

  scrollerDrag.active = true;
  scrollerDrag.startY = event.clientY;
  scrollerDrag.startScrollTop = viewer.scrollTop;
  scrollerDrag.thumbHeight = sideScrollerThumb.offsetHeight;
  scrollerDrag.trackHeight = sideScrollerTrack.clientHeight;

  sideScrollerThumb.classList.add("dragging");

  try{
    sideScrollerThumb.setPointerCapture(event.pointerId);
  }catch{}

});

sideScrollerThumb.addEventListener("pointermove", event => {

  if(!scrollerDrag.active){
    return;
  }

  const maxThumbTop = scrollerDrag.trackHeight - scrollerDrag.thumbHeight;
  const maxScrollTop = viewer.scrollHeight - viewer.clientHeight;

  if(maxThumbTop <= 0 || maxScrollTop <= 0){
    return;
  }

  const deltaY = event.clientY - scrollerDrag.startY;
  const scrollDelta = (deltaY / maxThumbTop) * maxScrollTop;

  viewer.scrollTop = Math.max(
    0,
    Math.min(maxScrollTop, scrollerDrag.startScrollTop + scrollDelta)
  );

  // Reposition the thumb itself right away. Don't wait for the
  // viewer's "scroll" event to do it - that event can lag behind
  // (or get coalesced) during a fast drag, which is why the thumb
  // used to stay put until you let go and scrolled again.
  updateSideScroller();

});

function endScrollerDrag(event){

  if(!scrollerDrag.active){
    return;
  }

  scrollerDrag.active = false;

  sideScrollerThumb.classList.remove("dragging");

  try{
    sideScrollerThumb.releasePointerCapture(event.pointerId);
  }catch{}
}

sideScrollerThumb.addEventListener("pointerup", endScrollerDrag);
sideScrollerThumb.addEventListener("pointercancel", endScrollerDrag);

/*
   Tapping the track itself (not the thumb) jumps the thumb -
   and the document - to that position.
*/

sideScrollerTrack.addEventListener("pointerdown", event => {

  if(event.target === sideScrollerThumb){
    return;
  }

  const trackRect = sideScrollerTrack.getBoundingClientRect();
  const thumbHeight = sideScrollerThumb.offsetHeight;

  const maxThumbTop = sideScrollerTrack.clientHeight - thumbHeight;
  const maxScrollTop = viewer.scrollHeight - viewer.clientHeight;

  if(maxThumbTop <= 0 || maxScrollTop <= 0){
    return;
  }

  const clickY = event.clientY - trackRect.top;

  const targetThumbTop = Math.max(
    0,
    Math.min(maxThumbTop, clickY - thumbHeight / 2)
  );

  viewer.scrollTop = (targetThumbTop / maxThumbTop) * maxScrollTop;

});

/* ============================================================
   CURRENT PAGE
============================================================ */

viewer.addEventListener("scroll", () => {

  if(!pageViews.length){
    return;
  }

  const viewerRect = viewer.getBoundingClientRect();

  let currentPage = 1;
  let bestDistance = Infinity;

  for(const view of pageViews){

    if(!view){
      continue;
    }

    const rect = view.pageDiv.getBoundingClientRect();

    const distance = Math.abs(rect.top - viewerRect.top - 8);

    if(distance < bestDistance){
      bestDistance = distance;
      currentPage = view.pageNumber;
    }
  }

  pageInput.value = String(currentPage);

  renderNearbyPages();

  updateSideScroller();
});

/* ============================================================
   MENU
============================================================ */

menuButton.addEventListener("click", event => {
  event.stopPropagation();
  menu.style.display = menu.style.display === "block" ? "none" : "block";
});

menu.addEventListener("click", event => event.stopPropagation());

document.addEventListener("click", event => {

  if(menu.contains(event.target) || event.target.closest("#menuBtn")){
    return;
  }

  menu.style.display = "none";
});

/* ============================================================
   DOWNLOAD
============================================================ */

document.getElementById("downloadBtn").addEventListener("click", () => {

  const link = document.createElement("a");

  link.href = file;
  link.download = file.split("/").pop();

  document.body.appendChild(link);

  link.click();

  link.remove();

  menu.style.display = "none";
});

/* ============================================================
   NEW TAB
============================================================ */

document.getElementById("newTabBtn").onclick = () => window.open(file, "_blank");

/* ============================================================
   FULLSCREEN
============================================================ */

document.getElementById("fullscreenBtn").onclick = async () => {

  try{
    await document.documentElement.requestFullscreen();
  }catch(error){
    console.warn("Fullscreen failed:", error);
  }
};

/* ============================================================
   SHARE
============================================================ */

document.getElementById("copyLinkBtn").addEventListener("click", async () => {

  const url = window.location.href;

  menu.style.display = "none";

  if(navigator.share){

    try{

      await navigator.share({
        title: document.title,
        text: document.getElementById("title").textContent,
        url
      });

    }catch{
      /* cancelled */
    }

    return;
  }

  try{

    await navigator.clipboard.writeText(url);

    alert("Link copied to clipboard!");

  }catch{
    window.prompt("Copy this link:", url);
  }
});

/* ============================================================
   SELECTION CLEANUP
============================================================ */

document.addEventListener("selectionchange", () => {

  const selection = document.getSelection();

  if(selection && selection.toString().length){
    return;
  }

  for(const view of pageViews){

    if(view?.textLayerDiv){
      view.textLayerDiv.classList.remove("selecting");
    }
  }
});

/* ============================================================
   RESIZE
============================================================ */

let resizeTimer = null;

/*
   Mobile browsers constantly fire "resize" events purely because
   their address bar/toolbar shows or hides while the page is
   scrolled - the viewport HEIGHT changes but the WIDTH (the only
   thing that affects fit-width layout here) does not. Previously
   every one of those benign resizes triggered a full
   wipe-and-rebuild (rescaleAndRender -> resetRenderedPage for
   every page), which throws away every page's canvas, text layer,
   and search highlights and re-renders the whole document from
   scratch. If a search was active, this meant scrolling the
   document - completely unrelated to zoom or search - would wipe
   the current highlight mid-navigation and leave it blank until
   the person stopped scrolling long enough for a full rebuild to
   finish. Tracking width separately lets us skip that entirely
   when only the toolbar moved.
*/

let lastKnownInnerWidth = window.innerWidth;

window.addEventListener("resize", () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(async () => {

    syncViewerTop();

    if(!pageViews.length){
      return;
    }

    const widthChanged = window.innerWidth !== lastKnownInnerWidth;

    lastKnownInnerWidth = window.innerWidth;

    if(!widthChanged){
      // Height-only change (mobile chrome show/hide from scrolling,
      // virtual keyboard, etc). Nothing that affects page layout
      // actually changed, so don't touch rendered pages or search
      // highlights.
      return;
    }

    if(window.innerWidth <= 768){

      const firstView = pageViews.find(Boolean);

      if(firstView){
        baseScale = getFitWidthScale(firstView.page);
      }
    }

    await rescaleAndRender();

    updateSideScroller();

  }, 150);
});

/* ============================================================
   CHROME RESIZE OBSERVER
============================================================ */

if("ResizeObserver" in window){

  const chromeObserver = new ResizeObserver(() => {
    syncViewerTop();
    syncBottomGap();
  });

  chromeObserver.observe(header);
  chromeObserver.observe(toolbar);
  chromeObserver.observe(titleBar);
}

scheduleChromeSync();

/* ============================================================
   LOAD PDF
============================================================ */

try{

  if(!file){
    throw new Error("No PDF file was supplied.");
  }

  syncViewerTop();

  const loadingTask = getDocument({
    url:file,
    disableAutoFetch:false,
    disableStream:false
  });

  pdfDoc = await loadingTask.promise;

  document.getElementById("pageCount").textContent = `of ${pdfDoc.numPages}`;

  // Fetch the outline (table of contents) up front. A document
  // with no outline resolves to null, not an error — either way
  // the TOC button is set up so the person always gets a clear
  // answer when they tap it.
  let outlineItems = null;

  try{
    outlineItems = await pdfDoc.getOutline();
  }catch(error){
    console.warn("Could not load outline:", error);
    outlineItems = null;
  }

  setupTocButton(outlineItems);

  const firstPage = await pdfDoc.getPage(1);

  baseScale = getFitWidthScale(firstPage);
  zoomLevel = 1;
  currentScale = baseScale;

  const firstView = createPageShell(1, firstPage);

  layoutPage(firstView, currentScale);

  pageObserver.observe(firstView.pageDiv);

  syncViewerTop();

  await renderPage(firstView);

  loadingOverlay.style.display = "none";

  updateSideScroller();

  void (async () => {

    for(let pageNumber = 2; pageNumber <= pdfDoc.numPages; pageNumber++){

      try{

        if(pageViews[pageNumber - 1]){
          continue;
        }

        const page = await pdfDoc.getPage(pageNumber);

        const view = createPageShell(pageNumber, page);

        layoutPage(view, currentScale);

        pageObserver.observe(view.pageDiv);

        const viewerRect = viewer.getBoundingClientRect();
        const pageRect = view.pageDiv.getBoundingClientRect();

        if(pageRect.top <= viewerRect.bottom + 1400){
          void renderPage(view);
        }

        updateSideScroller();

        await new Promise(resolve => setTimeout(resolve, 0));

      }catch(error){
        console.warn(`Could not initialize page ${pageNumber}:`, error);
      }
    }

  })();

}catch(error){

  console.error("PDF loading failed:", error);

  loadingOverlay.style.display = "none";

  viewer.innerHTML = `
    <div style="color:#fff;padding:40px;text-align:center;max-width:600px;">
      <h2>Unable to load PDF</h2>
      <p>${escapeHtml(error?.message || "Unknown error.")}</p>
    </div>
  `;
}

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener("beforeunload", () => {

  renderGeneration++;
  searchGeneration++;

  clearTimeout(searchTimer);

  for(const view of pageViews){

    if(!view){
      continue;
    }

    try{
      pageObserver.unobserve(view.pageDiv);
    }catch{}

    try{
      view.canvas.width = 1;
      view.canvas.height = 1;
    }catch{}
  }

  try{
    if(pdfDoc){
      pdfDoc.destroy();
    }
  }catch{}
});

</script>
