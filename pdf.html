<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="./pdfjs/web/text_layer_builder.css">
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF Viewer</title>

<style>
:root{
  --bg:#111;
  --panel:#1d1d1d;
  --panel2:#222;
  --text:#eee;
  --muted:#aaa;
  --accent:#3a3a3a;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* HEADER */
header{
  position:fixed; top:0; left:0; right:0; height:58px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 14px; background:#181818; border-bottom:1px solid #2d2d2d;
  z-index:6000;
}

/* TOOLBAR */
#toolbar{
  position:fixed; top:58px; left:0; right:0; min-height:48px;
  display:flex; gap:8px; align-items:center; padding:10px;
  background:#1b1b1b; border-bottom:1px solid #2d2d2d;
  flex-wrap:wrap; z-index:5500;
}

/* MAIN LAYOUT */
#layout{ position:absolute; top:106px; left:0; right:0; bottom:0; height:auto; }

/* VIEWER */
#viewer{
  width:100%; height:100%; overflow:auto;
  padding:30px 30px 90px; background:#111;
  display:flex; flex-direction:column; align-items:center;
  scroll-behavior:auto; overscroll-behavior:contain;
}

/* PDF PAGE */
.page{
  position:relative; margin:0 auto 20px;
  box-shadow:0 0 14px rgba(0,0,0,.4);
  background:#fff; flex-shrink:0;
}

.pageCanvas{ display:block; pointer-events:none; }

/* GENERAL BUTTONS */
.btn{
  background:#333; color:#fff; border:none; border-radius:7px;
  padding:9px 12px; text-decoration:none; cursor:pointer;
  display:inline-flex; align-items:center;
}

button,input{ background:#2b2b2b; color:#fff; border:none; border-radius:8px; padding:8px 12px; }
button:hover{ background:#3a3a3a; cursor:pointer; }

/* CONTROL GROUPS */
.zoomControls,.pageControls{ display:flex; align-items:center; gap:6px; white-space:nowrap; flex-shrink:0; }

/* TITLE BAR */
#titleBar{
  position:fixed; left:0; right:0; bottom:0;
  background:rgba(24,24,24,.92); padding:12px 18px; text-align:center;
  z-index:3000; border-top:1px solid #333; backdrop-filter:blur(6px);
}

#title{
  display:flex; justify-content:center; align-items:center; width:100%;
  text-align:center; font-size:1.2rem; font-weight:bold;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}

.title-text{
  order:1; position:relative; display:inline-block; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.title-badges{ display:inline-flex; gap:8px; margin-left:12px; vertical-align:middle; }

.title-badge{
  display:inline-block; padding:4px 10px; color:#fff; font-size:.72em;
  font-weight:bold; border-radius:999px; text-transform:uppercase;
  letter-spacing:.5px; flex-shrink:0;
}

.title-badge.new{ order:2; background:#00b050; }
.title-badge.featured{ order:3; background:#2f7cff; }

/* MENU */
#menu{
  position:fixed; right:10px; top:58px; background:#222;
  border:1px solid #333; border-radius:10px; padding:8px;
  display:none; min-width:220px; z-index:7000;
}
#menu button{ width:100%; text-align:left; margin:3px 0; }

/* SEARCH POPUP */
#searchPopup{
  position:fixed; top:108px; left:110px; display:flex; align-items:center;
  gap:8px; padding:10px; background:#222; border:1px solid #444;
  border-radius:10px; box-shadow:0 8px 20px rgba(0,0,0,.45); z-index:6500;
}
#searchPopup.hidden{ display:none; }
#searchPopup input{ width:220px; }
#searchResults{ color:#bbb; min-width:70px; text-align:center; }

/* TEXT LAYER
   NOTE: --scale-factor is what pdf.js actually uses to size glyphs.
   It must equal the current viewport scale, not a fixed value. It is
   set dynamically in JS (see layoutPage) alongside --user-unit and
   --total-scale-factor. Do not hard-code any of these in CSS. */
.textLayer{
  position:absolute; inset:0; overflow:hidden; line-height:1;
  text-align:initial; forced-color-adjust:none; z-index:2;
  user-select:text; -webkit-user-select:text; cursor:text;
  --scale-factor:1; --user-unit:1; --total-scale-factor:1;
}

.textLayer span,.textLayer br{ color:transparent; }
.textLayer ::selection{ background:rgba(0,120,255,.35); }
.textLayer br::selection{ background:transparent; }

.textLayer .highlight{
  margin:-1px; padding:1px; background-color:rgba(180,0,170,.2); border-radius:4px;
}
.textLayer .highlight.selected{ background-color:rgba(0,100,255,.35); }

.textLayer .endOfContent{
  display:block; position:absolute; left:0; top:100%; right:0; bottom:0;
  z-index:-1; cursor:default; user-select:none;
}
.textLayer .endOfContent.active{ top:0; }

/* LINK LAYER
   Width/height are kept in sync with the page on every render pass
   (layoutPage) — this is what was missing before and caused links
   to clip/misalign after zoom or resize. */
.linkLayer{ position:absolute; inset:0; overflow:hidden; z-index:4; pointer-events:none; }

.pdf-link{
  position:absolute; display:block; pointer-events:auto; cursor:pointer;
  background:transparent; border:0; padding:0; margin:0; text-decoration:none;
}
.pdf-link:hover{ background:rgba(0,120,255,.08); }

/* LOADING */
#loadingOverlay{
  position:fixed; inset:106px 0 0 0; display:flex; flex-direction:column;
  justify-content:center; align-items:center; background:#111; z-index:8000;
}
.spinner{
  width:60px; height:60px; border:6px solid #333; border-top:6px solid #fff;
  border-radius:50%; animation:spin .9s linear infinite;
}
.loadingText{ margin-top:18px; color:#ddd; font-size:18px; }

/* READING MODE */
body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{ display:none !important; }

body.reading-mode #layout{ top:0; height:100%; }
body.reading-mode #viewer{ height:100%; padding-top:20px; padding-bottom:20px; }
body.reading-mode #loadingOverlay{ inset:0; }

/* MOBILE */
@media (max-width:768px){
  #searchPopup{ left:10px; right:10px; top:108px; width:auto; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  #searchPopup input{ flex:1 1 100%; width:100%; min-width:0; }
  #prevResult,#nextResult{ flex:0 0 auto; }
  #searchResults{ flex:1; text-align:center; min-width:0; }
  .title-badges{ display:flex; justify-content:center; gap:8px; margin:0 0 8px 0; }
  #title{ flex-direction:column; align-items:center; gap:6px; }
  .title-text{ order:2; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title-badge.new,.title-badge.featured{ order:1; }
}

@keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
</style>
</head>

<body>

<header>
  <a class="btn" id="backBtn" href="index.html">◀ Back</a>
  <div style="flex:1"></div>
  <button id="menuBtn">☰</button>
</header>

<div id="toolbar">
  <button id="searchButton">🔍 Search</button>

  <div class="zoomControls">
    <button id="zoomOut">−</button>
    <input id="zoomPercent" value="150%" style="width:70px;text-align:center">
    <button id="zoomIn">+</button>
  </div>

  <button id="fitWidth">Fit Width</button>
  <button id="fitPage">Fit Page</button>

  <div class="pageControls">
    <label>Page</label>
    <input id="pageNumber" value="1" inputmode="numeric" style="width:60px;text-align:center">
    <span id="pageCount">of 0</span>
  </div>
</div>

<div id="searchPopup" class="hidden">
  <input id="searchBox" placeholder="Search..." autocomplete="off">
  <button id="prevResult">▲</button>
  <button id="nextResult">▼</button>
  <span id="searchResults">0 of 0</span>
</div>

<div id="layout">
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loadingText">Loading PDF...</div>
  </div>
  <div id="viewer"></div>
</div>

<div id="titleBar">
  <div id="title">Loading PDF...</div>
</div>

<div id="menu">
  <button id="downloadBtn">Download PDF</button>
  <button id="newTabBtn">Open in New Tab</button>
  <button id="copyLinkBtn">Share PDF</button>
  <button id="fullscreenBtn">Fullscreen</button>
</div>

<script type="module">

import { getDocument, GlobalWorkerOptions, TextLayer } from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc = "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params = new URLSearchParams(location.search);
const file = decodeURIComponent(params.get("file") || "");
const title = decodeURIComponent(params.get("paper") || "PDF");
const returnPage = decodeURIComponent(params.get("return") || "index.html");

/* ============================================================
   ELEMENTS
============================================================ */

const viewer = document.getElementById("viewer");
const loadingOverlay = document.getElementById("loadingOverlay");
const pageInput = document.getElementById("pageNumber");
const zoomBox = document.getElementById("zoomPercent");
const searchPopup = document.getElementById("searchPopup");
const searchBox = document.getElementById("searchBox");
const menu = document.getElementById("menu");
const menuButton = document.getElementById("menuBtn");

/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{
  descriptions = await fetch("descriptions.json").then(r => r.json());
}catch(err){
  console.warn("Could not load descriptions.json:", err);
}

let newestEntry = null;

if(Object.keys(descriptions).length){
  newestEntry = Object.entries(descriptions)
    .sort((a,b) => new Date(b[1].updated || 0) - new Date(a[1].updated || 0))[0];
}

const newestKey = newestEntry ? newestEntry[0] : null;
const newestDate = newestEntry ? new Date(newestEntry[1].updated) : null;
const today = new Date();
const oneYearAgo = new Date(today);
oneYearAgo.setFullYear(today.getFullYear() - 1);
const showNewestBadge = Boolean(newestDate && newestDate >= oneYearAgo);

const paper = Object.values(descriptions).find(item => item.url === file);
const paperKey = Object.keys(descriptions).find(key => descriptions[key].url === file);
const isNewest = Boolean(showNewestBadge && paperKey === newestKey);

document.getElementById("title").innerHTML = `
  <div class="title-text">
    ${escapeHtml(title)}
    <span class="title-badges">
      ${isNewest ? `<span class="title-badge new">NEW</span>` : ""}
      ${paper?.featured ? `<span class="title-badge featured">FEATURED</span>` : ""}
    </span>
  </div>
`;

/* ============================================================
   VIEWPORT SIZING HELPERS
============================================================ */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;

function getViewerInnerWidth(){
  const styles = getComputedStyle(viewer);
  return Math.max(1, viewer.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight));
}

function getViewerInnerHeight(){
  const styles = getComputedStyle(viewer);
  return Math.max(1, viewer.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom));
}

function getFitWidthScale(page){
  const viewport = page.getViewport({ scale:1 });
  return getViewerInnerWidth() / viewport.width;
}

function getFitPageScale(page){
  const viewport = page.getViewport({ scale:1 });
  const widthScale = getViewerInnerWidth() / viewport.width;
  const heightScale = getViewerInnerHeight() / viewport.height;
  return Math.min(widthScale, heightScale);
}

const zoomLevels = [0.25,0.5,0.75,1,1.25,1.5,1.75,2,2.25,2.5,2.75,3,3.25,3.5,3.75,4,4.25,4.5,4.75,5];

/* ============================================================
   PDF STATE
============================================================ */

let pdfDoc = null;
const pageViews = [];
let searchResults = [];
let currentSearch = -1;
let lastSearchQuery = "";

/* ============================================================
   BACK BUTTON
============================================================ */

const backButton = document.getElementById("backBtn");
backButton.href = returnPage || "index.html";

backButton.addEventListener("click", event => {
  event.preventDefault();
  sessionStorage.setItem("restoreSearch", "yes");
  sessionStorage.setItem("returnFromPage", "yes");
  window.location.assign(returnPage || "index.html");
});

/* ============================================================
   LAYOUT — single source of truth for all layer geometry.

   This replaces the old setPageScaleVariables()/createPageShell()/
   renderCanvas()/renderAllPages() split, which set page/canvas/
   text-layer/link-layer dimensions in three different places.
   That split is what let the link layer's box go stale after zoom
   (it was only ever sized once, at page creation) and let
   --scale-factor get hard-coded to "1" instead of the real scale
   (which is what actually made the text layer render at the wrong
   size). Now every render pass — initial load, zoom, fit, resize —
   goes through this one function, so the page, canvas, text layer
   and link layer can never drift out of sync with each other again.
============================================================ */

function layoutPage(view, scale){
  const viewport = view.page.getViewport({ scale });
  view.viewport = viewport;

  const userUnit = view.page.userUnit || 1;

  view.pageDiv.style.width = `${viewport.width}px`;
  view.pageDiv.style.height = `${viewport.height}px`;

  const dpr = window.devicePixelRatio || 1;
  view.canvas.width = Math.floor(viewport.width * dpr);
  view.canvas.height = Math.floor(viewport.height * dpr);
  view.canvas.style.width = `${viewport.width}px`;
  view.canvas.style.height = `${viewport.height}px`;

  for(const layer of [view.textLayerDiv, view.linkLayerDiv]){
    layer.style.width = `${viewport.width}px`;
    layer.style.height = `${viewport.height}px`;
    layer.style.setProperty("--scale-factor", `${viewport.scale}`);
    layer.style.setProperty("--user-unit", `${userUnit}`);
    layer.style.setProperty("--total-scale-factor", `${viewport.scale * userUnit}`);
  }

  return viewport;
}

async function paintCanvas(view){
  const dpr = window.devicePixelRatio || 1;
  const context = view.canvas.getContext("2d");
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  await view.page.render({ canvasContext:context, viewport:view.viewport }).promise;
}

async function paintText(view){
  try{
    if(!view.textContent){
      view.textContent = await view.page.getTextContent();
    }

    view.textLayerDiv.innerHTML = "";

    // Pass the plain viewport that matches the canvas — not a
    // dontFlip clone. The text layer must use the exact same
    // coordinate transform as the canvas render, or spans end up
    // positioned inconsistently with the glyphs drawn underneath.
    const textLayer = new TextLayer({
      textContentSource: view.textContent,
      container: view.textLayerDiv,
      viewport: view.viewport
    });

    await textLayer.render();
    view.textLayer = textLayer;
  }catch(error){
    console.warn(`Text layer failed on page ${view.pageNumber}`, error);
  }
}

async function paintLinks(view){
  try{
    if(!view.annotations){
      view.annotations = await view.page.getAnnotations({ intent:"display" });
    }
    renderLinkLayer(view);
  }catch(error){
    console.warn(`Link layer failed on page ${view.pageNumber}`, error);
  }
}

/* ============================================================
   PAGE SHELL — creates the DOM once per page; painting happens
   separately so the initial load can show canvases fast and fill
   in text/links in the background.
============================================================ */

function createPageShell(pageNumber, page){
  const pageDiv = document.createElement("div");
  pageDiv.className = "page";
  pageDiv.dataset.pageNumber = String(pageNumber);

  const canvas = document.createElement("canvas");
  canvas.className = "pageCanvas";

  const textLayerDiv = document.createElement("div");
  textLayerDiv.className = "textLayer";

  const linkLayerDiv = document.createElement("div");
  linkLayerDiv.className = "linkLayer";

  pageDiv.appendChild(canvas);
  pageDiv.appendChild(textLayerDiv);
  pageDiv.appendChild(linkLayerDiv);
  viewer.appendChild(pageDiv);

  const view = {
    pageNumber, page, pageDiv, canvas, textLayerDiv, linkLayerDiv,
    viewport:null, textContent:null, annotations:null
  };

  pageViews[pageNumber - 1] = view;
  return view;
}

/* ============================================================
   INTERNAL PDF DESTINATION
============================================================ */

async function resolveDestination(destination){
  if(!pdfDoc) return null;

  try{
    let dest = destination;

    if(typeof dest === "string"){
      dest = await pdfDoc.getDestination(dest);
    }

    if(!Array.isArray(dest) || !dest.length) return null;

    const pageRef = dest[0];
    let pageIndex = -1;

    try{
      pageIndex = await pdfDoc.getPageIndex(pageRef);
    }catch{
      if(typeof pageRef === "number") pageIndex = pageRef;
    }

    if(pageIndex < 0 || pageIndex >= pageViews.length) return null;
    return pageIndex;
  }catch(error){
    console.warn("Could not resolve PDF destination:", error);
    return null;
  }
}

function scrollToView(view){
  const viewerRect = viewer.getBoundingClientRect();
  const pageRect = view.pageDiv.getBoundingClientRect();
  const targetOffset = pageRect.top - viewerRect.top + viewer.scrollTop;

  viewer.scrollTo({ top: Math.max(0, targetOffset - 8), behavior:"smooth" });
  pageInput.value = String(view.pageNumber);
}

async function openInternalDestination(destination){
  const pageIndex = await resolveDestination(destination);
  if(pageIndex === null) return;

  const target = pageViews[pageIndex];
  if(!target) return;

  scrollToView(target);
}

/* ============================================================
   LINK LAYER
============================================================ */

function renderLinkLayer(view){
  const layer = view.linkLayerDiv;
  layer.innerHTML = "";

  const annotations = view.annotations;
  if(!Array.isArray(annotations)) return;

  const viewport = view.viewport;

  for(const annotation of annotations){
    if(annotation.subtype !== "Link") continue;
    if(!annotation.rect || annotation.rect.length !== 4) continue;

    const rect = viewport.convertToViewportRectangle(annotation.rect);
    const left = Math.min(rect[0], rect[2]);
    const top = Math.min(rect[1], rect[3]);
    const width = Math.abs(rect[2] - rect[0]);
    const height = Math.abs(rect[3] - rect[1]);

    if(width <= 0 || height <= 0) continue;

    const link = document.createElement("a");
    link.className = "pdf-link";
    link.style.left = `${left}px`;
    link.style.top = `${top}px`;
    link.style.width = `${width}px`;
    link.style.height = `${height}px`;

    if(annotation.url || annotation.unsafeUrl){
      link.href = annotation.url || annotation.unsafeUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    }else if(annotation.dest){
      link.href = "#";
      link.addEventListener("click", async event => {
        event.preventDefault();
        event.stopPropagation();
        await openInternalDestination(annotation.dest);
      });
    }else{
      continue;
    }

    layer.appendChild(link);
  }
}

/* ============================================================
   RESCALE — used by zoom in/out, fit width/page, zoom input,
   and the mobile resize handler. Keeps scroll position stable.
============================================================ */

async function rescaleAndRender(){
  currentScale = baseScale * zoomLevel;
  zoomBox.value = `${Math.round(zoomLevel * 100)}%`;

  const scrollRatio = viewer.scrollHeight > viewer.clientHeight
    ? viewer.scrollTop / (viewer.scrollHeight - viewer.clientHeight)
    : 0;

  await Promise.all(pageViews.map(async view => {
    if(!view) return;

    layoutPage(view, currentScale);

    try{ await paintCanvas(view); }
    catch(error){ console.warn(`Canvas render failed on page ${view.pageNumber}`, error); }

    await paintText(view);
    await paintLinks(view);
  }));

  requestAnimationFrame(() => {
    if(viewer.scrollHeight > viewer.clientHeight){
      viewer.scrollTop = scrollRatio * (viewer.scrollHeight - viewer.clientHeight);
    }
  });
}

/* ============================================================
   LOAD PDF
============================================================ */

try{
  if(!file) throw new Error("No PDF file was supplied.");

  const loadingTask = getDocument(file);
  pdfDoc = await loadingTask.promise;

  document.getElementById("pageCount").textContent = `of ${pdfDoc.numPages}`;

  const firstPage = await pdfDoc.getPage(1);
  baseScale = getFitWidthScale(firstPage);
  zoomLevel = 1;
  currentScale = baseScale * zoomLevel;
  zoomBox.value = `${Math.round(zoomLevel * 100)}%`;

  // STEP 1 — create every page shell and lay it out (fast, no
  // painting yet) so the document has its full scrollable height
  // immediately.
  const pages = [firstPage];
  for(let pageNumber = 2; pageNumber <= pdfDoc.numPages; pageNumber++){
    pages.push(await pdfDoc.getPage(pageNumber));
  }

  pages.forEach((page, index) => {
    const view = createPageShell(index + 1, page);
    layoutPage(view, currentScale);
  });

  // STEP 2 — paint canvases first; this is what the user actually
  // waits to see.
  await Promise.all(pageViews.map(async view => {
    if(!view) return;
    try{ await paintCanvas(view); }
    catch(error){ console.error(`Canvas rendering failed on page ${view.pageNumber}`, error); }
  }));

  loadingOverlay.style.display = "none";

  // STEP 3 — text and links fill in independently in the
  // background; a slow page doesn't block the others.
  void Promise.all(pageViews.map(async view => {
    if(!view) return;
    await paintText(view);
    await paintLinks(view);
  }));

}catch(error){
  console.error("PDF loading failed:", error);
  loadingOverlay.style.display = "none";

  viewer.innerHTML = `
    <div style="color:#fff;padding:40px;text-align:center;max-width:600px;">
      <h2>Unable to load PDF</h2>
      <p>${escapeHtml(error?.message || "Unknown error.")}</p>
    </div>
  `;
}

/* ============================================================
   MENU
============================================================ */

menuButton.addEventListener("click", event => {
  event.stopPropagation();
  menu.style.display = menu.style.display === "block" ? "none" : "block";
});

menu.addEventListener("click", event => event.stopPropagation());
document.addEventListener("click", () => { menu.style.display = "none"; });

/* ============================================================
   DOWNLOAD / OPEN / FULLSCREEN / SHARE
============================================================ */

document.getElementById("downloadBtn").addEventListener("click", () => {
  const link = document.createElement("a");
  link.href = file;
  link.download = file.split("/").pop();
  document.body.appendChild(link);
  link.click();
  link.remove();
  menu.style.display = "none";
});

document.getElementById("newTabBtn").onclick = () => window.open(file, "_blank");

document.getElementById("fullscreenBtn").onclick = async () => {
  try{ await document.documentElement.requestFullscreen(); }
  catch(error){ console.warn("Fullscreen failed:", error); }
};

document.getElementById("copyLinkBtn").addEventListener("click", async () => {
  const url = window.location.href;
  menu.style.display = "none";

  if(navigator.share){
    try{
      await navigator.share({ title: document.title, text: document.getElementById("title").textContent, url });
    }catch{ /* user cancelled */ }
    return;
  }

  try{
    await navigator.clipboard.writeText(url);
    alert("Link copied to clipboard!");
  }catch{
    window.prompt("Copy this link:", url);
  }
});

/* ============================================================
   ZOOM CONTROLS
============================================================ */

document.getElementById("zoomIn").onclick = async () => {
  const next = zoomLevels.find(level => level > zoomLevel);
  if(!next) return;
  zoomLevel = next;
  await rescaleAndRender();
};

document.getElementById("zoomOut").onclick = async () => {
  const previous = [...zoomLevels].reverse().find(level => level < zoomLevel);
  if(!previous) return;
  zoomLevel = previous;
  await rescaleAndRender();
};

document.getElementById("fitWidth").onclick = async () => {
  const firstView = pageViews.find(Boolean);
  if(!firstView) return;
  baseScale = getFitWidthScale(firstView.page);
  zoomLevel = 1;
  await rescaleAndRender();
};

document.getElementById("fitPage").onclick = async () => {
  const firstView = pageViews.find(Boolean);
  if(!firstView) return;
  baseScale = getFitPageScale(firstView.page);
  zoomLevel = 1;
  await rescaleAndRender();
};

zoomBox.addEventListener("keydown", async event => {
  if(event.key !== "Enter") return;

  let value = parseFloat(zoomBox.value.replace("%",""));
  if(Number.isNaN(value)) value = 100;
  value = Math.max(25, Math.min(500, value));

  zoomLevel = value / 100;
  await rescaleAndRender();
});

/* ============================================================
   PAGE NUMBER NAVIGATION
============================================================ */

pageInput.addEventListener("keydown", event => {
  if(event.key !== "Enter") return;

  let pageNumber = parseInt(pageInput.value, 10);
  if(Number.isNaN(pageNumber)) pageNumber = 1;
  pageNumber = Math.max(1, Math.min(pageViews.length, pageNumber));

  const view = pageViews[pageNumber - 1];
  if(!view) return;

  pageInput.value = String(pageNumber);
  scrollToView(view);
});

viewer.addEventListener("scroll", () => {
  if(!pageViews.length) return;

  const viewerRect = viewer.getBoundingClientRect();
  let currentPage = 1;
  let bestDistance = Infinity;

  for(const view of pageViews){
    if(!view) continue;
    const rect = view.pageDiv.getBoundingClientRect();
    const distance = Math.abs(rect.top - viewerRect.top - 8);
    if(distance < bestDistance){
      bestDistance = distance;
      currentPage = view.pageNumber;
    }
  }

  pageInput.value = String(currentPage);
});

/* ============================================================
   SEARCH
============================================================ */

function searchPDF(query){
  searchResults = [];
  currentSearch = -1;
  query = query.trim().toLowerCase();

  if(query === ""){
    document.getElementById("searchResults").textContent = "0 of 0";
    return;
  }

  lastSearchQuery = query;

  for(const view of pageViews){
    if(!view || !view.textContent) continue;

    const pageText = view.textContent.items.map(item => item.str).join(" ").toLowerCase();
    if(pageText.includes(query)) searchResults.push(view.pageNumber - 1);
  }

  if(searchResults.length === 0){
    document.getElementById("searchResults").textContent = "0 of 0";
    alert("No results found.");
    return;
  }

  gotoSearchResult(0);
}

function gotoSearchResult(index){
  if(!searchResults.length) return;

  if(index < 0) index = searchResults.length - 1;
  if(index >= searchResults.length) index = 0;

  currentSearch = index;
  document.getElementById("searchResults").textContent = `${currentSearch + 1} of ${searchResults.length}`;

  const view = pageViews[searchResults[currentSearch]];
  if(!view) return;

  scrollToView(view);
}

function searchOrAdvance(step){
  const query = searchBox.value.trim().toLowerCase();

  if(query !== lastSearchQuery || searchResults.length === 0 || currentSearch === -1){
    searchPDF(query);
    return;
  }

  gotoSearchResult(currentSearch + step);
}

searchBox.addEventListener("keydown", event => {
  if(event.key === "Enter") searchOrAdvance(1);
});

document.getElementById("prevResult").onclick = () => searchOrAdvance(-1);
document.getElementById("nextResult").onclick = () => searchOrAdvance(1);

document.getElementById("searchButton").onclick = event => {
  event.stopPropagation();
  searchPopup.classList.toggle("hidden");
  if(!searchPopup.classList.contains("hidden")) searchBox.focus();
};

searchPopup.addEventListener("click", event => event.stopPropagation());
document.addEventListener("click", () => searchPopup.classList.add("hidden"));

/* ============================================================
   READING MODE
============================================================ */

let suppressReadingModeClick = false;

viewer.addEventListener("mousedown", () => {
  const selection = window.getSelection();
  if(selection && selection.toString().length > 0) suppressReadingModeClick = true;
});

viewer.addEventListener("click", event => {
  if(event.target.closest(".pdf-link")) return;

  const page = event.target.closest(".page");
  if(!page) return;

  const selection = window.getSelection();
  if(selection && selection.toString().length > 0){
    suppressReadingModeClick = true;
    return;
  }

  if(suppressReadingModeClick){
    suppressReadingModeClick = false;
    return;
  }

  document.body.classList.toggle("reading-mode");

  if(document.body.classList.contains("reading-mode")){
    menu.style.display = "none";
    searchPopup.classList.add("hidden");
  }
});

/* ============================================================
   RESIZE (mobile auto fit-width)
============================================================ */

let resizeTimer = null;

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(async () => {
    if(!pageViews.length) return;
    if(window.innerWidth > 768) return;

    const firstView = pageViews.find(Boolean);
    if(!firstView) return;

    baseScale = getFitWidthScale(firstView.page);
    await rescaleAndRender();
  }, 150);
});

</script>
