<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="./pdfjs/web/text_layer_builder.css">

>

>

<title>PDF Viewer</title>

<style>

:root{
  --bg:#111;
  --panel:#1d1d1d;
  --panel2:#222;
  --text:#eee;
  --muted:#aaa;
  --accent:#3a3a3a;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;
  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:48px;

  display:flex;
  gap:8px;
  align-items:center;

  padding:10px;

  background:#1b1b1b;
  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:106px;
  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  display:flex;
  flex-direction:column;
  align-items:center;

  scroll-behavior:auto;

  overscroll-behavior:contain;
}

/* ============================================================
   PDF PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:
    0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;

  /*
     The canvas itself never receives pointer input.

     Text selection happens through the PDF.js text layer.
  */

  pointer-events:none;

  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;
  color:#fff;

  border:none;
  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;
  align-items:center;
}

button,
input{
  background:#2b2b2b;
  color:#fff;

  border:none;
  border-radius:8px;

  padding:8px 12px;
}

button:hover{
  background:#3a3a3a;
  cursor:pointer;
}

/* ============================================================
   CONTROL GROUPS
============================================================ */

.zoomControls,
.pageControls{
  display:flex;
  align-items:center;

  gap:6px;

  white-space:nowrap;

  flex-shrink:0;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:rgba(24,24,24,.92);

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;

  backdrop-filter:blur(6px);
}

#title{
  display:flex;

  justify-content:center;
  align-items:center;

  width:100%;

  text-align:center;

  font-size:1.2rem;
  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.title-text{
  order:1;

  position:relative;

  display:inline-block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.title-badges{
  display:inline-flex;

  gap:8px;

  margin-left:12px;

  vertical-align:middle;
}

.title-badge{
  display:inline-block;

  padding:4px 10px;

  color:#fff;

  font-size:.72em;

  font-weight:bold;

  border-radius:999px;

  text-transform:uppercase;

  letter-spacing:.5px;

  flex-shrink:0;
}

.title-badge.new{
  order:2;

  background:#00b050;
}

.title-badge.featured{
  order:3;

  background:#2f7cff;
}

/* ============================================================
   MENU
============================================================ */

#menu{
  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{
  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   SEARCH
============================================================ */

#searchPopup{
  position:fixed;

  top:108px;
  left:110px;

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  background:#222;

  border:1px solid #444;

  border-radius:10px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.45);

  z-index:6500;
}

#searchPopup.hidden{
  display:none;
}

#searchPopup input{
  width:220px;
}

#searchResults{
  color:#bbb;

  min-width:70px;

  text-align:center;
}

/* ============================================================
   PDF.JS TEXT LAYER
   ------------------------------------------------------------
   IMPORTANT:
   Do NOT manually position generated spans here.

   PDF.js calculates the span geometry itself from the viewport.
============================================================ */

.textLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  line-height:1;

  text-align:initial;

  forced-color-adjust:none;

  z-index:2;

  /*
     This is what allows the browser to interact with the
     selectable HTML text.
  */

  pointer-events:auto;

  user-select:text;
  -webkit-user-select:text;
  -moz-user-select:text;

  -webkit-touch-callout:default;

  cursor:text;

  /*
     PDF.js uses this internally for its text positioning.
  */

  --scale-factor:1;
  --user-unit:1;
  --total-scale-factor:1;
}

/*
   DO NOT set position, transform, width, height, font-size,
   or scale on the generated spans.

   PDF.js owns those values.
*/

.textLayer ::selection{
  background:rgba(0,120,255,.45);
}

.textLayer ::-moz-selection{
  background:rgba(0,120,255,.45);
}

/*
   PDF.js search highlights.
*/

.textLayer .highlight{
  margin:-1px;
  padding:1px;

  background-color:
    rgba(180,0,170,.20);

  border-radius:4px;
}

.textLayer .highlight.selected{
  background-color:
    rgba(0,100,255,.35);
}

/*
   PDF.js selection helper.
*/

.textLayer .endOfContent{
  display:block;

  position:absolute;

  left:0;
  top:100%;
  right:0;
  bottom:0;

  z-index:-1;

  cursor:default;

  user-select:none;
  -webkit-user-select:none;
}

.textLayer .endOfContent.active{
  top:0;
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;
  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:106px 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

/* ============================================================
   READING MODE
============================================================ */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{
  display:none !important;
}

body.reading-mode #layout{
  top:0;

  height:100%;
}

body.reading-mode #viewer{
  height:100%;

  padding-top:20px;

  padding-bottom:20px;
}

body.reading-mode #loadingOverlay{
  inset:0;
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #searchPopup{
    left:10px;
    right:10px;

    top:108px;

    width:auto;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;
  }

  #searchPopup input{
    flex:1 1 100%;

    width:100%;

    min-width:0;
  }

  #prevResult,
  #nextResult{
    flex:0 0 auto;
  }

  #searchResults{
    flex:1;

    text-align:center;

    min-width:0;
  }

  .title-badges{
    display:flex;

    justify-content:center;

    gap:8px;

    margin:0 0 8px 0;
  }

  #title{
    flex-direction:column;

    align-items:center;

    gap:6px;
  }

  .title-text{
    order:2;

    width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .title-badge.new,
  .title-badge.featured{
    order:1;
  }
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

<body>

  <a
    class="btn"

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc =
  "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const file =
  decodeURIComponent(
    params.get("file") || ""
  );

const title =
  decodeURIComponent(
    params.get("paper") || "PDF"
  );

const returnPage =
  decodeURIComponent(
    params.get("return") ||
    "index.html"
  );

/* ============================================================
   ELEMENTS
============================================================ */

const viewer =
  document.getElementById(
    "viewer"
  );

const loadingOverlay =
  document.getElementById(
    "loadingOverlay"
  );

const pageInput =
  document.getElementById(
    "pageNumber"
  );

const zoomBox =
  document.getElementById(
    "zoomPercent"
  );

const searchPopup =
  document.getElementById(
    "searchPopup"
  );

const searchBox =
  document.getElementById(
    "searchBox"
  );

const menu =
  document.getElementById(
    "menu"
  );

const menuButton =
  document.getElementById(
    "menuBtn"
  );

/* ============================================================
   SAFETY LIMITS
============================================================ */

/*
   Maximum requested zoom.

   This prevents the Android browser from being forced to
   create absurdly large page bitmaps.
*/

const MAX_ZOOM = 3;

/*
   Maximum physical pixels in a canvas.

   The CSS page can still be 300% zoomed.
   Only the backing bitmap is capped.
*/

const MAX_CANVAS_PIXELS =
  8000000;

/*
   Maximum width/height of one backing canvas.
*/

const MAX_CANVAS_DIMENSION =
  16384;

/*
   Distance around the viewport in which pages are rendered.
*/

const RENDER_MARGIN =
  "1400px";

/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{

  descriptions =
    await fetch(
      "descriptions.json"
    ).then(
      response =>
        response.json()
    );

}catch(error){

  console.warn(
    "Could not load descriptions.json:",
    error
  );
}

let newestEntry = null;

if(
  Object.keys(
    descriptions
  ).length
){

  newestEntry =
    Object.entries(
      descriptions
    ).sort(
      (a,b) =>
        new Date(
          b[1].updated || 0
        ) -
        new Date(
          a[1].updated || 0
        )
    )[0];
}

const newestKey =
  newestEntry
    ? newestEntry[0]
    : null;

const newestDate =
  newestEntry
    ? new Date(
        newestEntry[1].updated
      )
    : null;

const today =
  new Date();

const oneYearAgo =
  new Date(today);

oneYearAgo.setFullYear(
  today.getFullYear() - 1
);

const showNewestBadge =
  Boolean(
    newestDate &&
    newestDate >= oneYearAgo
  );

const paper =
  Object.values(
    descriptions
  ).find(
    item =>
      item.url === file
  );

const paperKey =
  Object.keys(
    descriptions
  ).find(
    key =>
      descriptions[key].url === file
  );

const isNewest =
  Boolean(
    showNewestBadge &&
    paperKey === newestKey
  );

document.getElementById(
  "title"
).innerHTML = `

  <div class="title-text">

    ${escapeHtml(title)}

    <span class="title-badges">

      ${
        isNewest
          ? `
            <span class="title-badge new">
              NEW
            </span>
          `
          : ""
      }

      ${
        paper?.featured
          ? `
            <span class="title-badge featured">
              FEATURED
            </span>
          `
          : ""
      }

    </span>

  </div>

`;

/* ============================================================
   VIEWPORT SIZING
============================================================ */

let baseScale = 1;

let zoomLevel = 1;

let currentScale = 1;

function getViewerInnerWidth(){

  const styles =
    getComputedStyle(
      viewer
    );

  return Math.max(
    1,

    viewer.clientWidth -
    parseFloat(
      styles.paddingLeft
    ) -
    parseFloat(
      styles.paddingRight
    )
  );
}

function getViewerInnerHeight(){

  const styles =
    getComputedStyle(
      viewer
    );

  return Math.max(
    1,

    viewer.clientHeight -
    parseFloat(
      styles.paddingTop
    ) -
    parseFloat(
      styles.paddingBottom
    )
  );
}

function getFitWidthScale(
  page
){

  const viewport =
    page.getViewport({
      scale:1
    });

  return (
    getViewerInnerWidth() /
    viewport.width
  );
}

function getFitPageScale(
  page
){

  const viewport =
    page.getViewport({
      scale:1
    });

  const widthScale =
    getViewerInnerWidth() /
    viewport.width;

  const heightScale =
    getViewerInnerHeight() /
    viewport.height;

  return Math.min(
    widthScale,
    heightScale
  );
}

const zoomLevels = [

  0.25,
  0.5,
  0.75,

  1,
  1.25,
  1.5,
  1.75,

  2,
  2.25,
  2.5,
  2.75,

  3

];

/* ============================================================
   PDF STATE
============================================================ */

let pdfDoc = null;

const pageViews = [];

let searchResults = [];

let currentSearch = -1;

let lastSearchQuery = "";

let renderGeneration = 0;

/* ============================================================
   BACK BUTTON
============================================================ */

const backButton =
  document.getElementById(
    "backBtn"
  );

backButton.href =
  returnPage ||
  "index.html";

backButton.addEventListener(
  "click",
  event => {

    event.preventDefault();

    sessionStorage.setItem(
      "restoreSearch",
      "yes"
    );

    sessionStorage.setItem(
      "returnFromPage",
      "yes"
    );

    window.location.assign(
      returnPage ||
      "index.html"
    );

  }
);

/* ============================================================
   SAFE CANVAS OUTPUT SCALE
============================================================ */

function getSafeOutputScale(
  viewport
){

  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );

  let outputScale =
    dpr;

  const pagePixels =
    viewport.width *
    viewport.height;

  if(
    pagePixels > 0
  ){

    const pixelLimitScale =
      Math.sqrt(
        MAX_CANVAS_PIXELS /
        pagePixels
      );

    outputScale =
      Math.min(
        outputScale,
        pixelLimitScale
      );
  }

  if(
    viewport.width > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.width
      );
  }

  if(
    viewport.height > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.height
      );
  }

  return Math.max(
    0.35,

    Math.min(
      outputScale,
      dpr
    )
  );
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(
  view,
  scale
){

  /*
     THIS viewport object is the single source of truth.

     Canvas and TextLayer receive this exact same object.
  */

  const viewport =
    view.page.getViewport({
      scale
    });

  view.viewport =
    viewport;

  view.pageDiv.style.width =
    `${viewport.width}px`;

  view.pageDiv.style.height =
    `${viewport.height}px`;

  view.canvas.style.width =
    `${viewport.width}px`;

  view.canvas.style.height =
    `${viewport.height}px`;

  view.textLayerDiv.style.width =
    `${viewport.width}px`;

  view.textLayerDiv.style.height =
    `${viewport.height}px`;

  view.linkLayerDiv.style.width =
    `${viewport.width}px`;

  view.linkLayerDiv.style.height =
    `${viewport.height}px`;

  /*
     PDF.js needs these values for its text-layer calculations.
  */

  view.textLayerDiv.style.setProperty(
    "--scale-factor",
    String(
      viewport.scale
    )
  );

  view.textLayerDiv.style.setProperty(
    "--user-unit",
    String(
      view.page.userUnit || 1
    )
  );

  view.textLayerDiv.style.setProperty(
    "--total-scale-factor",
    String(
      viewport.scale *
      (view.page.userUnit || 1)
    )
  );

  return viewport;
}

/* ============================================================
   RESET PAGE
============================================================ */

function resetRenderedPage(
  view
){

  view.renderedScale =
    null;

  /*
     Release the large bitmap.
  */

  try{

    view.canvas.width =
      1;

    view.canvas.height =
      1;

  }catch{}

  /*
     Remove the old text and link layers.
  */

  view.textLayerDiv.innerHTML =
    "";

  view.linkLayerDiv.innerHTML =
    "";

  view.textLayer =
    null;
}

/* ============================================================
   PAINT CANVAS
============================================================ */

async function paintCanvas(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  const viewport =
    view.viewport;

  const outputScale =
    getSafeOutputScale(
      viewport
    );

  const pixelWidth =
    Math.max(
      1,

      Math.floor(
        viewport.width *
        outputScale
      )
    );

  const pixelHeight =
    Math.max(
      1,

      Math.floor(
        viewport.height *
        outputScale
      )
    );

  if(
    pixelWidth >
      MAX_CANVAS_DIMENSION ||
    pixelHeight >
      MAX_CANVAS_DIMENSION
  ){

    throw new Error(
      "Safe canvas limit exceeded."
    );
  }

  view.canvas.width =
    pixelWidth;

  view.canvas.height =
    pixelHeight;

  view.canvas.style.width =
    `${viewport.width}px`;

  view.canvas.style.height =
    `${viewport.height}px`;

  const context =
    view.canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );

  if(!context){

    throw new Error(
      "Could not create canvas context."
    );
  }

  /*
     Physical bitmap scaling happens here.

     This does NOT change viewport.scale.

     Therefore the text layer remains aligned.
  */

  context.setTransform(
    outputScale,
    0,
    0,
    outputScale,
    0,
    0
  );

  await view.page.render({

    canvasContext:
      context,

    viewport:
      view.viewport

  }).promise;

  if(
    generation !==
    renderGeneration
  ){

    return;
  }
}

/* ============================================================
   TEXT CONTENT
============================================================ */

async function ensureTextContent(
  view
){

  if(
    view.textContent
  ){

    return view.textContent;
  }

  view.textContent =
    await view.page.getTextContent();

  return view.textContent;
}

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    const textContent =
      await ensureTextContent(
        view
      );

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    /*
       Remove only the old layer contents.

       We do NOT modify PDF.js generated spans afterward.
    */

    view.textLayerDiv.innerHTML =
      "";

    /*
       Keep PDF.js's variables synchronized.
    */

    view.textLayerDiv.style.setProperty(
      "--scale-factor",
      String(
        view.viewport.scale
      )
    );

    view.textLayerDiv.style.setProperty(
      "--user-unit",
      String(
        view.page.userUnit || 1
      )
    );

    view.textLayerDiv.style.setProperty(
      "--total-scale-factor",
      String(
        view.viewport.scale *
        (view.page.userUnit || 1)
      )
    );

    /*
       IMPORTANT:

       Use the EXACT SAME viewport object used by the canvas.

       No dontFlip().
       No manually calculated span positions.
       No manual transform.
    */

    const textLayer =
      new TextLayer({

        textContentSource:
          textContent,

        container:
          view.textLayerDiv,

        viewport:
          view.viewport

      });

    await textLayer.render();

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    view.textLayer =
      textLayer;

  }catch(error){

    console.warn(
      `Text layer failed on page ${view.pageNumber}:`,
      error
    );

  }
}

/* ============================================================
   LINK LAYER
============================================================ */

async function paintLinks(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    if(
      !view.annotations
    ){

      view.annotations =
        await view.page.getAnnotations({
          intent:"display"
        });
    }

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    renderLinkLayer(
      view
    );

  }catch(error){

    console.warn(
      `Link layer failed on page ${view.pageNumber}:`,
      error
    );

  }
}

function renderLinkLayer(
  view
){

  const layer =
    view.linkLayerDiv;

  layer.innerHTML =
    "";

  const annotations =
    view.annotations;

  if(
    !Array.isArray(
      annotations
    )
  ){

    return;
  }

  const viewport =
    view.viewport;

  for(
    const annotation
    of annotations
  ){

    if(
      annotation.subtype !==
      "Link"
    ){

      continue;
    }

    if(
      !annotation.rect ||
      annotation.rect.length !== 4
    ){

      continue;
    }

    const rect =
      viewport.convertToViewportRectangle(
        annotation.rect
      );

    const left =
      Math.min(
        rect[0],
        rect[2]
      );

    const top =
      Math.min(
        rect[1],
        rect[3]
      );

    const width =
      Math.abs(
        rect[2] -
        rect[0]
      );

    const height =
      Math.abs(
        rect[3] -
        rect[1]
      );

    if(
      width <= 0 ||
      height <= 0
    ){

      continue;
    }

    const link =
      document.createElement(
        "a"
      );

    link.className =
      "pdf-link";

    link.style.left =
      `${left}px`;

    link.style.top =
      `${top}px`;

    link.style.width =
      `${width}px`;

    link.style.height =
      `${height}px`;

    if(
      annotation.url ||
      annotation.unsafeUrl
    ){

      link.href =
        annotation.url ||
        annotation.unsafeUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

    }else if(
      annotation.dest
    ){

      link.href =
        "#";

      link.addEventListener(
        "click",
        async event => {

          event.preventDefault();

          event.stopPropagation();

          await openInternalDestination(
            annotation.dest
          );

        }
      );

    }else{

      continue;
    }

    layer.appendChild(
      link
    );
  }
}

/* ============================================================
   CREATE PAGE
============================================================ */

function createPageShell(
  pageNumber,
  page
){

  const pageDiv =
    document.createElement(
      "div"
    );

  pageDiv.className =
    "page";

  pageDiv.dataset.pageNumber =
    String(
      pageNumber
    );

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.className =
    "pageCanvas";

  const textLayerDiv =
    document.createElement(
      "div"
    );

  textLayerDiv.className =
    "textLayer";

  const linkLayerDiv =
    document.createElement(
      "div"
    );

  linkLayerDiv.className =
    "linkLayer";

  pageDiv.appendChild(
    canvas
  );

  pageDiv.appendChild(
    textLayerDiv
  );

  pageDiv.appendChild(
    linkLayerDiv
  );

  viewer.appendChild(
    pageDiv
  );

  const view = {

    pageNumber,

    page,

    pageDiv,

    canvas,

    textLayerDiv,

    linkLayerDiv,

    viewport:null,

    textContent:null,

    annotations:null,

    textLayer:null,

    renderedScale:null,

    renderingPromise:null

  };

  pageViews[
    pageNumber - 1
  ] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(
  view
){

  if(!view){

    return;
  }

  const generation =
    renderGeneration;

  if(
    view.renderedScale ===
    currentScale
  ){

    return;
  }

  if(
    view.renderingPromise
  ){

    return view.renderingPromise;
  }

  view.renderingPromise =
    (async () => {

      try{

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        layoutPage(
          view,
          currentScale
        );

        await paintCanvas(
          view,
          generation
        );

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        view.renderedScale =
          currentScale;

        /*
           Text and links are painted after the visible canvas.
        */

        await Promise.all([

          paintText(
            view,
            generation
          ),

          paintLinks(
            view,
            generation
          )

        ]);

      }catch(error){

        console.warn(
          `Page ${view.pageNumber} render failed:`,
          error
        );

        /*
           Do NOT destroy the viewer if one page fails.
        */

        try{

          view.canvas.width =
            1;

          view.canvas.height =
            1;

        }catch{}

      }finally{

        view.renderingPromise =
          null;
      }

    })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver =
  new IntersectionObserver(

    entries => {

      for(
        const entry
        of entries
      ){

        if(
          !entry.isIntersecting
        ){

          continue;
        }

        const view =
          pageViews.find(
            candidate =>
              candidate &&
              candidate.pageDiv ===
              entry.target
          );

        if(view){

          void renderPage(
            view
          );
        }
      }

    },

    {
      root:viewer,

      rootMargin:
        RENDER_MARGIN,

      threshold:0
    }

  );

/* ============================================================
   RENDER NEAR VIEWPORT
============================================================ */

function renderNearbyPages(){

  const viewerRect =
    viewer.getBoundingClientRect();

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    const rect =
      view.pageDiv.getBoundingClientRect();

    const nearViewport =
      rect.bottom >=
        viewerRect.top - 1400 &&
      rect.top <=
        viewerRect.bottom + 1400;

    if(
      nearViewport
    ){

      void renderPage(
        view
      );
    }
  }
}

/* ============================================================
   INTERNAL DESTINATIONS
============================================================ */

async function resolveDestination(
  destination
){

  if(!pdfDoc){

    return null;
  }

  try{

    let dest =
      destination;

    if(
      typeof dest ===
      "string"
    ){

      dest =
        await pdfDoc.getDestination(
          dest
        );
    }

    if(
      !Array.isArray(dest) ||
      !dest.length
    ){

      return null;
    }

    const pageRef =
      dest[0];

    let pageIndex =
      -1;

    try{

      pageIndex =
        await pdfDoc.getPageIndex(
          pageRef
        );

    }catch{

      if(
        typeof pageRef ===
        "number"
      ){

        pageIndex =
          pageRef;
      }
    }

    if(
      pageIndex < 0 ||
      pageIndex >=
        pageViews.length
    ){

      return null;
    }

    return pageIndex;

  }catch(error){

    console.warn(
      "Could not resolve PDF destination:",
      error
    );

    return null;
  }
}

async function scrollToView(
  view
){

  if(!view){

    return;
  }

  void renderPage(
    view
  );

  const viewerRect =
    viewer.getBoundingClientRect();

  const pageRect =
    view.pageDiv.getBoundingClientRect();

  const targetOffset =
    pageRect.top -
    viewerRect.top +
    viewer.scrollTop;

  viewer.scrollTo({

    top:Math.max(
      0,
      targetOffset - 8
    ),

    behavior:"smooth"

  });

  pageInput.value =
    String(
      view.pageNumber
    );
}

async function openInternalDestination(
  destination
){

  const pageIndex =
    await resolveDestination(
      destination
    );

  if(
    pageIndex === null
  ){

    return;
  }

  const view =
    pageViews[
      pageIndex
    ];

  if(!view){

    return;
  }

  await scrollToView(
    view
  );
}

/* ============================================================
   RESCALE
============================================================ */

async function rescaleAndRender(){

  renderGeneration++;

  currentScale =
    baseScale *
    zoomLevel;

  if(
    currentScale <= 0
  ){

    currentScale =
      1;
  }

  zoomBox.value =
    `${Math.round(
      zoomLevel * 100
    )}%`;

  /*
     Resize page shells.

     Only nearby pages will actually get new canvases.
  */

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    layoutPage(
      view,
      currentScale
    );

    resetRenderedPage(
      view
    );
  }

  renderNearbyPages();
}

/* ============================================================
   LOAD PDF
============================================================ */

try{

  if(!file){

    throw new Error(
      "No PDF file was supplied."
    );
  }

  const loadingTask =
    getDocument(
      file
    );

  pdfDoc =
    await loadingTask.promise;

  document.getElementById(
    "pageCount"
  ).textContent =
    `of ${pdfDoc.numPages}`;

  const firstPage =
    await pdfDoc.getPage(
      1
    );

  baseScale =
    getFitWidthScale(
      firstPage
    );

  zoomLevel =
    1;

  currentScale =
    baseScale;

  zoomBox.value =
    "100%";

  /*
     Load page objects so the full document height is known.

     We do NOT render every page's canvas.
  */

  const pages = [
    firstPage
  ];

  for(
    let pageNumber = 2;
    pageNumber <=
      pdfDoc.numPages;
    pageNumber++
  ){

    pages.push(
      await pdfDoc.getPage(
        pageNumber
      )
    );
  }

  pages.forEach(
    (page,index) => {

      const view =
        createPageShell(
          index + 1,
          page
        );

      layoutPage(
        view,
        currentScale
      );

      pageObserver.observe(
        view.pageDiv
      );

    }
  );

  loadingOverlay.style.display =
    "none";

  renderNearbyPages();

}catch(error){

  console.error(
    "PDF loading failed:",
    error
  );

  loadingOverlay.style.display =
    "none";

  viewer.innerHTML = `

    <div style="
      color:#fff;
      padding:40px;
      text-align:center;
      max-width:600px;
    ">

      <h2>
        Unable to load PDF
      </h2>

      <p>
        ${escapeHtml(
          error?.message ||
          "Unknown error."
        )}
      </p>

    </div>

  `;
}
