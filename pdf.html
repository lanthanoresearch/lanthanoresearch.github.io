<title>PDF Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#eee;
  --muted:#aaa;
  --viewer-top:106px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;
  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 8px;

  background:#1b1b1b;
  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  display:flex;
  flex-direction:column;
  align-items:center;

  scroll-behavior:auto;

  overscroll-behavior:contain;
}

/* ============================================================
   PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;

  pointer-events:none;

  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;
  align-items:center;

  white-space:nowrap;
}

button,
input{
  background:#292929;

  color:#fff;

  border:1px solid #383838;

  border-radius:6px;

  padding:6px 9px;

  font:inherit;

  outline:none;
}

button:hover{
  background:#353535;

  cursor:pointer;
}

button:active{
  background:#414141;
}

button:focus-visible,
input:focus-visible{
  border-color:#666;

  outline:1px solid #555;
}

/* ============================================================
   COMPACT TOOLBAR CONTROLS
============================================================ */

.toolButton{
  height:32px;

  padding:0 10px;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  white-space:nowrap;

  font-size:13px;

  border-radius:6px;
}

.iconButton{
  width:32px;
  height:32px;

  padding:0;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  font-size:16px;

  border-radius:6px;
}

/* ============================================================
   ZOOM
============================================================ */

.zoomControls{
  display:flex;

  align-items:center;

  gap:3px;

  height:32px;

  padding:0 3px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;
}

.zoomControls button{
  width:29px;
  height:28px;

  padding:0;

  border:0;

  background:transparent;

  font-size:17px;

  display:flex;

  align-items:center;
  justify-content:center;
}

.zoomControls button:hover{
  background:#353535;
}

#zoomPercent{
  width:58px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

/* ============================================================
   PAGE CONTROLS
============================================================ */

.pageControls{
  display:flex;

  align-items:center;

  gap:4px;

  height:32px;

  padding:0 6px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;

  white-space:nowrap;
}

.pageControls label{
  color:#aaa;

  font-size:12px;
}

#pageNumber{
  width:43px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

#pageCount{
  color:#999;

  font-size:12px;

  padding-right:2px;
}

/* ============================================================
   DIVIDER
============================================================ */

.toolbarDivider{
  width:1px;

  height:22px;

  background:#383838;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:rgba(24,24,24,.92);

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;

  backdrop-filter:blur(6px);
}

#title{
  display:flex;

  justify-content:center;
  align-items:center;

  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.title-text{
  order:1;

  position:relative;

  display:inline-block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.title-badges{
  display:inline-flex;

  gap:8px;

  margin-left:12px;

  vertical-align:middle;
}

.title-badge{
  display:inline-block;

  padding:4px 10px;

  font-size:.72em;

  font-weight:bold;

  border-radius:999px;

  text-transform:uppercase;

  letter-spacing:.5px;

  flex-shrink:0;
}

.title-badge.new{
  order:2;
  background:#00b050;
}

.title-badge.featured{
  order:3;
  background:#2f7cff;
}

/* ============================================================
   MENU
============================================================ */

#menu{

  right:10px;
  top:58px;

  border:1px solid #333;

  border-radius:10px;

}

#menu button{

}

/* ============================================================
   SEARCH POPUP
============================================================ */

#searchPopup{
  position:fixed;

  top:108px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:5px;

  padding:7px;

  background:#222;

  border:1px solid #444;

  z-index:6500;
}

#searchPopup.hidden{

}

#searchPopup input{

  border-color:#3b3b3b;

}

#searchPopup button{

  height:31px;

  padding:0;

  align-items:center;
  justify-content:center;

  font-size:13px;
}

#searchResults{
  color:#aaa;

  min-width:65px;

  text-align:center;

  font-size:12px;

  white-space:nowrap;
}

/* ============================================================
   PDF.JS TEXT LAYER
============================================================ */

.textLayer{
  color-scheme:only light;

  position:absolute;

  text-align:initial;

  inset:0;

  overflow:clip;

  opacity:1;

  line-height:1;

  letter-spacing:normal;

  word-spacing:normal;

  text-size-adjust:none;

  forced-color-adjust:none;

  transform-origin:0 0;

  caret-color:CanvasText;

  z-index:2;

  pointer-events:auto;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;

  -webkit-touch-callout:default;

  --min-font-size:1;

  --text-scale-factor:
    calc(
      var(--total-scale-factor) *
      var(--min-font-size)
    );

  --min-font-size-inv:
    calc(
      1 /
      var(--min-font-size)
    );

  --scale-factor:1;

  --user-unit:1;

  --total-scale-factor:1;
}

.textLayer span,
.textLayer br{
  color:transparent;

  position:absolute;

  white-space:pre;

  cursor:text;

  transform-origin:0% 0%;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;
}

.textLayer > :not(.markedContent),
.textLayer .markedContent span:not(.markedContent){

  z-index:1;

  --font-height:0;

  font-size:
    calc(
      var(--text-scale-factor) *
      var(--font-height)
    );

  --scale-x:1;

  --rotate:0deg;

  transform:
    rotate(var(--rotate))
    scaleX(var(--scale-x))
    scale(var(--min-font-size-inv));
}

.textLayer .markedContent{
  display:contents;
}

.textLayer span[role="img"]{
  user-select:none;

  -webkit-user-select:none;

  cursor:default;
}

.textLayer ::selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer ::-moz-selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer br::selection{
  background:transparent;
}

.textLayer .endOfContent{
  display:block;

  position:absolute;

  inset:100% 0 0;

  z-index:0;

  cursor:default;

  user-select:none;

  -webkit-user-select:none;
}

.textLayer.selecting .endOfContent{
  top:0;
}

/* ============================================================
   SEARCH HIGHLIGHT OVERLAY
   ------------------------------------------------------------
   Translucent blue and does not alter selectable text.
============================================================ */

.searchHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:3;

  pointer-events:none;
}

.search-highlight{
  position:absolute;

  background:
    rgba(0,115,255,.28);

  border-radius:2px;

  box-shadow:
    0 0 0 1px
    rgba(0,90,220,.12);

  pointer-events:none;
}

.search-highlight.search-current{
  background:
    rgba(0,95,255,.42);

  box-shadow:
    0 0 0 1px
    rgba(0,70,220,.28);
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;

  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

/* ============================================================
   FLOATING READING MODE
============================================================ */

#readingModeFloat{
  position:fixed;

  right:18px;
  bottom:70px;

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#readingModeFloat:hover{
  background:#3a3a3a;
  transform:scale(1.05);
}

#readingModeFloat:active{
  transform:scale(.96);
}

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{
  display:none !important;
}

body.reading-mode #layout{
  top:0;
  height:100%;
}

body.reading-mode #viewer{
  height:100%;
  padding-top:20px;
  padding-bottom:20px;
}

body.reading-mode #loadingOverlay{
  inset:0;
}

body.reading-mode #readingModeFloat{
  right:16px;
  bottom:16px;
  background:rgba(40,40,40,.88);
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #toolbar{
    justify-content:center;

  }

  .zoomControls button{

  }

  }

  #pageNumber{

  #searchPopup{

  }

  #searchPopup input{
    flex:1 1 100%;

  }

  #prevResult,

  #searchResults{

  }

  #readingModeFloat{

    height:44px;
    font-size:16px;
  }

  body.reading-mode #readingModeFloat{
    right:12px;
    bottom:12px;
  }

  .title-badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:0 0 8px 0;
  }

  #title{

  }

  .title-text{

  }

  }
}

/* ============================================================
   ANIMATION
============================================================ */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

    transform:rotate(360deg);
  }

</style>

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc =
  "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const file =
  decodeURIComponent(
    params.get("file") || ""
  );

const title =
  decodeURIComponent(
    params.get("paper") || "PDF"
  );

const returnPage =
  decodeURIComponent(
    params.get("return") ||
    "index.html"
  );

/* ============================================================
   ELEMENTS
============================================================ */

const header =
  document.querySelector("header");

const toolbar =
  document.getElementById("toolbar");

const viewer =
  document.getElementById("viewer");

const layout =
  document.getElementById("layout");

const loadingOverlay =
  document.getElementById("loadingOverlay");

const pageInput =
  document.getElementById("pageNumber");

const zoomBox =
  document.getElementById("zoomPercent");

const searchPopup =
  document.getElementById("searchPopup");

const searchBox =
  document.getElementById("searchBox");

const menu =
  document.getElementById("menu");

const menuButton =
  document.getElementById("menuBtn");

const readingModeFloat =
  document.getElementById("readingModeFloat");

/* ============================================================
   VIEWER CHROME HEIGHT
============================================================ */

function syncViewerTop(){

  if(
    document.body.classList.contains(
      "reading-mode"
    )
  ){

    return;
  }

  const headerHeight =
    header.getBoundingClientRect().height;

  const toolbarHeight =
    toolbar.getBoundingClientRect().height;

  const total =
    Math.ceil(
      headerHeight +
      toolbarHeight
    );

  document.documentElement.style.setProperty(
    "--viewer-top",
    `${total}px`
  );

  layout.style.top =
    `${total}px`;

  loadingOverlay.style.top =
    `${total}px`;
}

function scheduleChromeSync(){

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        syncViewerTop
      );

    }
  );
}

/* ============================================================
   LIMITS
============================================================ */

const MAX_ZOOM =
  3;

const MAX_CANVAS_PIXELS =
  8000000;

const MAX_CANVAS_DIMENSION =
  16384;

const RENDER_MARGIN =
  "1400px";

/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{

  descriptions =
    await fetch("descriptions.json")
      .then(
        response =>
          response.json()
      );

}catch(error){

  console.warn(
    "Could not load descriptions.json:",
    error
  );
}

let newestEntry = null;

if(
  Object.keys(
    descriptions
  ).length
){

  newestEntry =
    Object.entries(
      descriptions
    ).sort(
      (a,b) =>
        new Date(
          b[1].updated || 0
        ) -
        new Date(
          a[1].updated || 0
        )
    )[0];
}

const newestKey =
  newestEntry
    ? newestEntry[0]
    : null;

const newestDate =
  newestEntry
    ? new Date(
        newestEntry[1].updated
      )
    : null;

const today =
  new Date();

const oneYearAgo =
  new Date(today);

oneYearAgo.setFullYear(
  today.getFullYear() - 1
);

const showNewestBadge =
  Boolean(
    newestDate &&
    newestDate >= oneYearAgo
  );

const paper =
  Object.values(
    descriptions
  ).find(
    item =>
      item.url === file
  );

const paperKey =
  Object.keys(
    descriptions
  ).find(
    key =>
      descriptions[key].url === file
  );

const isNewest =
  Boolean(
    showNewestBadge &&
    paperKey === newestKey
  );

document.getElementById(
  "title"
).innerHTML = `

  <div class="title-text">

    ${escapeHtml(title)}

    <span class="title-badges">

      ${
        isNewest
          ? `
            <span class="title-badge new">
              NEW
            </span>
          `
          : ""
      }

      ${
        paper?.featured
          ? `
            <span class="title-badge featured">
              FEATURED
            </span>
          `
          : ""
      }

    </span>

  </div>

`;

/* ============================================================
   VIEWPORT SIZING
============================================================ */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;

function getViewerInnerWidth(){

  const styles =
    getComputedStyle(viewer);

  return Math.max(
    1,

    viewer.clientWidth -
    parseFloat(styles.paddingLeft) -
    parseFloat(styles.paddingRight)
  );
}

function getViewerInnerHeight(){

  const styles =
    getComputedStyle(viewer);

  return Math.max(
    1,

    viewer.clientHeight -
    parseFloat(styles.paddingTop) -
    parseFloat(styles.paddingBottom)
  );
}

function getFitWidthScale(page){

  const viewport =
    page.getViewport({
      scale:1
    });

  return (
    getViewerInnerWidth() /
    viewport.width
  );
}

function getFitPageScale(page){

  const viewport =
    page.getViewport({
      scale:1
    });

  const widthScale =
    getViewerInnerWidth() /
    viewport.width;

  const heightScale =
    getViewerInnerHeight() /
    viewport.height;

  return Math.min(
    widthScale,
    heightScale
  );
}

/* ============================================================
   CANVAS SCALE SAFETY
============================================================ */

function getSafeOutputScale(
  viewport
){

  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );

  let outputScale =
    dpr;

  const pagePixels =
    viewport.width *
    viewport.height;

  if(
    pagePixels > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        Math.sqrt(
          MAX_CANVAS_PIXELS /
          pagePixels
        )
      );
  }

  if(
    viewport.width > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.width
      );
  }

  if(
    viewport.height > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.height
      );
  }

  return Math.max(
    0.35,
    Math.min(
      outputScale,
      dpr
    )
  );
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(
  view,
  scale
){

  const viewport =
    view.page.getViewport({
      scale
    });

  view.viewport =
    viewport;

  view.pageDiv.style.width =
    `${viewport.width}px`;

  view.pageDiv.style.height =
    `${viewport.height}px`;

  view.canvas.style.width =
    `${viewport.width}px`;

  view.canvas.style.height =
    `${viewport.height}px`;

  view.textLayerDiv.style.width =
    `${viewport.width}px`;

  view.textLayerDiv.style.height =
    `${viewport.height}px`;

  view.searchLayerDiv.style.width =
    `${viewport.width}px`;

  view.searchLayerDiv.style.height =
    `${viewport.height}px`;

  view.linkLayerDiv.style.width =
    `${viewport.width}px`;

  view.linkLayerDiv.style.height =
    `${viewport.height}px`;

  const userUnit =
    view.page.userUnit || 1;

  view.textLayerDiv.style.setProperty(
    "--scale-factor",
    String(viewport.scale)
  );

  view.textLayerDiv.style.setProperty(
    "--user-unit",
    String(userUnit)
  );

  view.textLayerDiv.style.setProperty(
    "--total-scale-factor",
    String(
      viewport.scale *
      userUnit
    )
  );

  return viewport;
}

/* ============================================================
   RESET PAGE
============================================================ */

function resetRenderedPage(
  view
){

  view.renderedScale =
    null;

  try{

    view.canvas.width = 1;
    view.canvas.height = 1;

  }catch{}

  view.textLayerDiv.replaceChildren();

  view.searchLayerDiv.replaceChildren();

  view.linkLayerDiv.replaceChildren();

  view.textLayer = null;

  view.textLayerEnd = null;
}

/* ============================================================
   CANVAS
============================================================ */

async function paintCanvas(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  const viewport =
    view.viewport;

  const outputScale =
    getSafeOutputScale(
      viewport
    );

  const pixelWidth =
    Math.max(
      1,
      Math.floor(
        viewport.width *
        outputScale
      )
    );

  const pixelHeight =
    Math.max(
      1,
      Math.floor(
        viewport.height *
        outputScale
      )
    );

  if(
    pixelWidth >
      MAX_CANVAS_DIMENSION ||
    pixelHeight >
      MAX_CANVAS_DIMENSION
  ){

    throw new Error(
      "Safe canvas limit exceeded."
    );
  }

  view.canvas.width =
    pixelWidth;

  view.canvas.height =
    pixelHeight;

  const context =
    view.canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );

  if(!context){

    throw new Error(
      "Could not create canvas context."
    );
  }

  context.setTransform(
    outputScale,
    0,
    0,
    outputScale,
    0,
    0
  );

  await view.page.render({

    canvasContext:
      context,

    viewport

  }).promise;
}

/* ============================================================
   TEXT CONTENT
============================================================ */

async function ensureTextContent(
  view
){

  if(
    view.textContent
  ){

    return view.textContent;
  }

  view.textContent =
    await view.page.getTextContent();

  return view.textContent;
}

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    const textContent =
      await ensureTextContent(
        view
      );

    view.textLayerDiv.replaceChildren();

    const userUnit =
      view.page.userUnit || 1;

    view.textLayerDiv.style.setProperty(
      "--scale-factor",
      String(view.viewport.scale)
    );

    view.textLayerDiv.style.setProperty(
      "--user-unit",
      String(userUnit)
    );

    view.textLayerDiv.style.setProperty(
      "--total-scale-factor",
      String(
        view.viewport.scale *
        userUnit
      )
    );

    const textLayer =
      new TextLayer({

        textContentSource:
          textContent,

        container:
          view.textLayerDiv,

        viewport:
          view.viewport

      });

    await textLayer.render();

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    const endOfContent =
      document.createElement(
        "div"
      );

    endOfContent.className =
      "endOfContent";

    view.textLayerDiv.append(
      endOfContent
    );

    view.textLayerEnd =
      endOfContent;

    view.textLayerDiv.addEventListener(
      "pointerdown",
      () => {

        view.textLayerDiv.classList.add(
          "selecting"
        );

      }
    );

    view.textLayer =
      textLayer;

  }catch(error){

    console.warn(
      `Text layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

/* ============================================================
   LINKS
============================================================ */

async function paintLinks(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    if(
      !view.annotations
    ){

      view.annotations =
        await view.page.getAnnotations({
          intent:"display"
        });
    }

    renderLinkLayer(view);

  }catch(error){

    console.warn(
      `Link layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

function renderLinkLayer(
  view
){

  const layer =
    view.linkLayerDiv;

  layer.replaceChildren();

  if(
    !Array.isArray(
      view.annotations
    )
  ){

    return;
  }

  const viewport =
    view.viewport;

  for(
    const annotation
    of view.annotations
  ){

    if(
      annotation.subtype !== "Link"
    ){

      continue;
    }

    if(
      !annotation.rect ||
      annotation.rect.length !== 4
    ){

      continue;
    }

    const rect =
      viewport.convertToViewportRectangle(
        annotation.rect
      );

    const left =
      Math.min(
        rect[0],
        rect[2]
      );

    const top =
      Math.min(
        rect[1],
        rect[3]
      );

    const width =
      Math.abs(
        rect[2] -
        rect[0]
      );

    const height =
      Math.abs(
        rect[3] -
        rect[1]
      );

    if(
      width <= 0 ||
      height <= 0
    ){

      continue;
    }

    const link =
      document.createElement("a");

    link.className =
      "pdf-link";

    link.style.left =
      `${left}px`;

    link.style.top =
      `${top}px`;

    link.style.width =
      `${width}px`;

    link.style.height =
      `${height}px`;

    if(
      annotation.url ||
      annotation.unsafeUrl
    ){

      link.href =
        annotation.url ||
        annotation.unsafeUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

    }else if(
      annotation.dest
    ){

      link.href =
        "#";

      link.addEventListener(
        "click",
        async event => {

          event.preventDefault();
          event.stopPropagation();

          await openInternalDestination(
            annotation.dest
          );
        }
      );

    }else{

      continue;
    }

    layer.appendChild(
      link
    );
  }
}

/* ============================================================
   PAGE SHELL
============================================================ */

function createPageShell(
  pageNumber,
  page
){

  const pageDiv =
    document.createElement(
      "div"
    );

  pageDiv.className =
    "page";

  pageDiv.dataset.pageNumber =
    String(pageNumber);

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.className =
    "pageCanvas";

  const textLayerDiv =
    document.createElement(
      "div"
    );

  textLayerDiv.className =
    "textLayer";

  const searchLayerDiv =
    document.createElement(
      "div"
    );

  searchLayerDiv.className =
    "searchHighlightLayer";

  const linkLayerDiv =
    document.createElement(
      "div"
    );

  linkLayerDiv.className =
    "linkLayer";

  pageDiv.appendChild(
    canvas
  );

  pageDiv.appendChild(
    textLayerDiv
  );

  pageDiv.appendChild(
    searchLayerDiv
  );

  pageDiv.appendChild(
    linkLayerDiv
  );

  viewer.appendChild(
    pageDiv
  );

  const view = {

    pageNumber,
    page,

    pageDiv,
    canvas,

    textLayerDiv,
    searchLayerDiv,
    linkLayerDiv,

    viewport:null,

    textContent:null,
    annotations:null,

    textLayer:null,
    textLayerEnd:null,

    renderedScale:null,
    renderingPromise:null
  };

  pageViews[
    pageNumber - 1
  ] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(
  view
){

  if(!view){

    return;
  }

  const generation =
    renderGeneration;

  if(
    view.renderedScale ===
    currentScale
  ){

    return;
  }

  if(
    view.renderingPromise
  ){

    return view.renderingPromise;
  }

  view.renderingPromise =
    (async () => {

      try{

        layoutPage(
          view,
          currentScale
        );

        await paintCanvas(
          view,
          generation
        );

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        view.renderedScale =
          currentScale;

        await Promise.all([

          paintText(
            view,
            generation
          ),

          paintLinks(
            view,
            generation
          )

        ]);

      }catch(error){

        console.warn(
          `Page ${view.pageNumber} render failed:`,
          error
        );

      }finally{

        view.renderingPromise =
          null;
      }

    })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver =
  new IntersectionObserver(

    entries => {

      for(
        const entry
        of entries
      ){

        if(
          !entry.isIntersecting
        ){

          continue;
        }

        const view =
          pageViews.find(
            candidate =>
              candidate &&
              candidate.pageDiv ===
              entry.target
          );

        if(view){

          void renderPage(view);
        }
      }

    },

    {
      root:viewer,
      rootMargin:RENDER_MARGIN,
      threshold:0
    }

  );

/* ============================================================
   RENDER NEARBY
============================================================ */

function renderNearbyPages(){

  const viewerRect =
    viewer.getBoundingClientRect();

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    const rect =
      view.pageDiv.getBoundingClientRect();

    if(
      rect.bottom >=
        viewerRect.top - 1400 &&

      rect.top <=
        viewerRect.bottom + 1400
    ){

      void renderPage(view);
    }
  }
}

/* ============================================================
   ENSURE PAGE
============================================================ */

async function ensurePageView(
  pageNumber
){

  if(
    !pdfDoc ||
    pageNumber < 1 ||
    pageNumber > pdfDoc.numPages
  ){

    return null;
  }

  const existing =
    pageViews[
      pageNumber - 1
    ];

  if(existing){

    return existing;
  }

  try{

    const page =
      await pdfDoc.getPage(
        pageNumber
      );

    const view =
      createPageShell(
        pageNumber,
        page
      );

    layoutPage(
      view,
      currentScale
    );

    pageObserver.observe(
      view.pageDiv
    );

    return view;

  }catch(error){

    console.warn(
      `Could not load page ${pageNumber}:`,
      error
    );

    return null;
  }
}

/* ============================================================
   INTERNAL DESTINATIONS
============================================================ */

async function resolveDestination(
  destination
){

  if(!pdfDoc){

    return null;
  }

  try{

    let dest =
      destination;

    if(
      typeof dest === "string"
    ){

      dest =
        await pdfDoc.getDestination(
          dest
        );
    }

    if(
      !Array.isArray(dest) ||
      !dest.length
    ){

      return null;
    }

    const pageRef =
      dest[0];

    let pageIndex =
      -1;

    try{

      pageIndex =
        await pdfDoc.getPageIndex(
          pageRef
        );

    }catch{

      if(
        typeof pageRef === "number"
      ){

        pageIndex =
          pageRef;
      }
    }

    if(
      pageIndex < 0 ||
      pageIndex >= pdfDoc.numPages
    ){

      return null;
    }

    return pageIndex;

  }catch{

    return null;
  }
}

async function scrollToView(
  view
){

  if(!view){

    return;
  }

  await renderPage(
    view
  );

  const viewerRect =
    viewer.getBoundingClientRect();

  const pageRect =
    view.pageDiv.getBoundingClientRect();

  const targetOffset =
    pageRect.top -
    viewerRect.top +
    viewer.scrollTop;

  viewer.scrollTo({

    top:
      Math.max(
        0,
        targetOffset - 8
      ),

    behavior:
      "smooth"

  });

  pageInput.value =
    String(
      view.pageNumber
    );
}

async function openInternalDestination(
  destination
){

  const pageIndex =
    await resolveDestination(
      destination
    );

  if(
    pageIndex === null
  ){

    return;
  }

  const view =
    await ensurePageView(
      pageIndex + 1
    );

  if(view){

    await scrollToView(
      view
    );
  }
}

/* ============================================================
   TAP TO READ
============================================================ */

let tapState = {

  active:false,
  moved:false,
  startX:0,
  startY:0
};

viewer.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target.closest(".textLayer") ||
      event.target.closest(".pdf-link") ||
      event.target.closest(".searchHighlightLayer")
    ){

      tapState.active =
        false;

      return;
    }

    const page =
      event.target.closest(".page");

    if(!page){

      tapState.active =
        false;

      return;
    }

    tapState.active =
      true;

    tapState.moved =
      false;

    tapState.startX =
      event.clientX;

    tapState.startY =
      event.clientY;
  }
);

viewer.addEventListener(
  "pointermove",
  event => {

    if(
      !tapState.active
    ){

      return;
    }

    if(
      Math.hypot(
        event.clientX -
        tapState.startX,

        event.clientY -
        tapState.startY
      ) > 10
    ){

      tapState.moved =
        true;
    }
  }
);

viewer.addEventListener(
  "pointerup",
  event => {

    if(
      !tapState.active
    ){

      return;
    }

    const moved =
      tapState.moved;

    tapState.active =
      false;

    if(moved){

      return;
    }

    if(
      event.target.closest(".textLayer") ||
      event.target.closest(".pdf-link") ||
      event.target.closest(".searchHighlightLayer")
    ){

      return;
    }

    if(
      event.target.closest(".page")
    ){

      setReadingMode(
        !readingMode
      );
    }
  }
);

/* ============================================================
   SEARCH: TEXT NODES
============================================================ */

function getTextNodes(
  view
){

  const nodes = [];

  const walker =
    document.createTreeWalker(
      view.textLayerDiv,

      NodeFilter.SHOW_TEXT,

      {
        acceptNode(node){

          if(
            !node.nodeValue ||
            !node.nodeValue.length
          ){

            return NodeFilter.FILTER_REJECT;
          }

          const parent =
            node.parentElement;

          if(
            parent?.closest(".endOfContent")
          ){

            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

  let node;

  while(
    (node = walker.nextNode())
  ){

    nodes.push(node);
  }

  return nodes;
}

/* ============================================================
   SEARCH: CREATE RANGE RECTANGLES
============================================================ */

function createHighlightForRange(
  view,
  startNode,
  startOffset,
  endNode,
  endOffset
){

  const range =
    document.createRange();

  try{

    range.setStart(
      startNode,
      startOffset
    );

    range.setEnd(
      endNode,
      endOffset
    );

  }catch(error){

    console.warn(
      "Search range failed:",
      error
    );

    return [];
  }

  const layerRect =
    view.searchLayerDiv.getBoundingClientRect();

  const rects =
    Array.from(
      range.getClientRects()
    );

  const elements = [];

  for(
    const rect
    of rects
  ){

    if(
      rect.width <= 0 ||
      rect.height <= 0
    ){

      continue;
    }

    const highlight =
      document.createElement(
        "div"
      );

    highlight.className =
      "search-highlight";

    highlight.style.left =
      `${rect.left - layerRect.left}px`;

    highlight.style.top =
      `${rect.top - layerRect.top}px`;

    highlight.style.width =
      `${rect.width}px`;

    highlight.style.height =
      `${rect.height}px`;

    view.searchLayerDiv.appendChild(
      highlight
    );

    elements.push(
      highlight
    );
  }

  return elements;
}

/* ============================================================
   SEARCH: OCCURRENCES ON PAGE
============================================================ */

function findOccurrencesOnPage(
  view,
  query
){

  if(
    !view ||
    !query
  ){

    return [];
  }

  const nodes =
    getTextNodes(
      view
    );

  if(
    !nodes.length
  ){

    return [];
  }

  let fullText =
    "";

  const positions = [];

  /*
     The PDF.js text layer can split a visible phrase into
     multiple spans. Build a searchable character map.
  */

  for(
    const node
    of nodes
  ){

    const start =
      fullText.length;

    const text =
      node.nodeValue || "";

    fullText +=
      text;

    positions.push({

      node,

      start,

      end:
        fullText.length

    });
  }

  const lowerText =
    fullText.toLowerCase();

  const lowerQuery =
    query.toLowerCase();

  const results = [];

  let searchAt =
    0;

  while(true){

    const matchStart =
      lowerText.indexOf(
        lowerQuery,
        searchAt
      );

    if(
      matchStart < 0
    ){

      break;
    }

    const matchEnd =
      matchStart +
      lowerQuery.length;

    let startInfo =
      null;

    let endInfo =
      null;

    for(
      const info
      of positions
    ){

      if(
        !startInfo &&
        matchStart >= info.start &&
        matchStart < info.end
      ){

        startInfo =
          info;
      }

      if(
        matchEnd > info.start &&
        matchEnd <= info.end
      ){

        endInfo =
          info;

        break;
      }
    }

    if(
      startInfo &&
      endInfo
    ){

      const elements =
        createHighlightForRange(

          view,

          startInfo.node,

          matchStart -
          startInfo.start,

          endInfo.node,

          matchEnd -
          endInfo.start
        );

      if(
        elements.length
      ){

        results.push({

          view,

          pageNumber:
            view.pageNumber,

          elements
        });
      }
    }

    searchAt =
      matchStart +
      Math.max(
        1,
        lowerQuery.length
      );
  }

  return results;
}

/* ============================================================
   SEARCH: CLEAR
============================================================ */

function clearSearchHighlights(){

  for(
    const view
    of pageViews
  ){

    if(
      view?.searchLayerDiv
    ){

      view.searchLayerDiv.replaceChildren();
    }
  }
}

/* ============================================================
   SEARCH: CURRENT RESULT
============================================================ */

function markCurrentSearch(){

  for(
    const result
    of searchResults
  ){

    for(
      const element
      of result.elements
    ){

      element.classList.remove(
        "search-current"
      );
    }
  }

  if(
    currentSearch < 0 ||
    currentSearch >=
      searchResults.length
  ){

    return;
  }

  const result =
    searchResults[
      currentSearch
    ];

  if(!result){

    return;
  }

  for(
    const element
    of result.elements
  ){

    element.classList.add(
      "search-current"
    );
  }
}

/* ============================================================
   SEARCH: COUNTER
============================================================ */

function updateSearchCounter(){

  document.getElementById(
    "searchResults"
  ).textContent =
    searchResults.length

      ? `${currentSearch + 1} of ${searchResults.length}`

      : "0 of 0";
}

/* ============================================================
   SEARCH: SCROLL EXACT RESULT
============================================================ */

async function scrollToSearchResult(
  result
){

  if(!result){

    return;
  }

  const view =
    result.view;

  if(!view){

    return;
  }

  /*
     Make sure this page is fully rendered before determining
     the final rectangle.
  */

  await renderPage(
    view
  );

  await new Promise(
    resolve =>
      requestAnimationFrame(
        resolve
      )
  );

  const element =
    result.elements[0];

  if(!element){

    return;
  }

  /*
     Measure after rendering.

     We intentionally calculate the target against the viewer
     instead of using scrollIntoView(), because the PDF is inside
     a custom scroll container and there are fixed UI elements.
  */

  const viewerRect =
    viewer.getBoundingClientRect();

  const elementRect =
    element.getBoundingClientRect();

  const targetCenter =
    elementRect.top +
    elementRect.height / 2;

  const viewerCenter =
    viewerRect.top +
    viewerRect.height / 2;

  const delta =
    targetCenter -
    viewerCenter;

  viewer.scrollTop +=
    delta;

  /*
     Horizontal correction is only applied when the result is
     outside the visible horizontal area.
  */

  if(
    elementRect.left <
      viewerRect.left
  ){

    viewer.scrollLeft +=
      elementRect.left -
      viewerRect.left -
      20;

  }else if(
    elementRect.right >
      viewerRect.right
  ){

    viewer.scrollLeft +=
      elementRect.right -
      viewerRect.right +
      20;
  }

  pageInput.value =
    String(
      view.pageNumber
    );
}

/* ============================================================
   SEARCH: NAVIGATE RESULT
============================================================ */

async function showSearchResult(
  index
){

  if(
    !searchResults.length
  ){

    return;
  }

  if(
    index < 0
  ){

    index =
      searchResults.length - 1;
  }

  if(
    index >=
      searchResults.length
  ){

    index =
      0;
  }

  currentSearch =
    index;

  markCurrentSearch();

  updateSearchCounter();

  const result =
    searchResults[
      currentSearch
    ];

  await scrollToSearchResult(
    result
  );
}

/* ============================================================
   SEARCH: MAIN
============================================================ */

async function searchPDF(
  query
){

  query =
    query
      .trim()
      .toLowerCase();

  clearSearchHighlights();

  searchResults =
    [];

  currentSearch =
    -1;

  lastSearchQuery =
    query;

  updateSearchCounter();

  if(!query){

    return;
  }

  /*
     Ensure every page object exists.
  */

  for(
    let pageNumber = 1;

    pageNumber <=
      (pdfDoc?.numPages || 0);

    pageNumber++
  ){

    await ensurePageView(
      pageNumber
    );

    if(
      pageNumber % 4 === 0
    ){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            0
          )
      );
    }
  }

  /*
     Load text content first.
  */

  const pageTextCache =
    new Map();

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    try{

      const content =
        await ensureTextContent(
          view
        );

      const text =
        content.items
          .map(
            item =>
              item.str || ""
          )
          .join("");

      pageTextCache.set(
        view,
        text.toLowerCase()
      );

    }catch(error){

      console.warn(
        `Search text extraction failed on page ${view.pageNumber}:`,
        error
      );
    }
  }

  /*
     Render only pages whose extracted text contains the query.
  */

  for(
    const view
    of pageViews
  ){

    const pageText =
      pageTextCache.get(
        view
      );

    if(
      !pageText ||
      !pageText.includes(
        query
      )
    ){

      continue;
    }

    await renderPage(
      view
    );

    /*
       Wait one frame so getClientRects() sees final layout.
    */

    await new Promise(
      resolve =>
        requestAnimationFrame(
          resolve
        )
    );

    const pageResults =
      findOccurrencesOnPage(
        view,
        query
      );

    searchResults.push(
      ...pageResults
    );
  }

  if(
    !searchResults.length
  ){

    updateSearchCounter();

    alert(
      "No results found."
    );

    return;
  }

  currentSearch =
    0;

  markCurrentSearch();

  updateSearchCounter();

  await scrollToSearchResult(
    searchResults[0]
  );
}

/* ============================================================
   SEARCH: NEXT / PREVIOUS
============================================================ */

async function searchOrAdvance(
  step
){

  const query =
    searchBox.value
      .trim()
      .toLowerCase();

  if(!query){

    return;
  }

  if(
    query !==
      lastSearchQuery ||
    searchResults.length === 0
  ){

    await searchPDF(
      query
    );

    return;
  }

  await showSearchResult(
    currentSearch + step
  );
}

/* ============================================================
   SEARCH INPUT
============================================================ */

searchBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      await searchOrAdvance(
        event.shiftKey

      );

    if(
      event.key ===
      "Escape"
    ){

      searchPopup.classList.add(
        "hidden"
      );
    }
  }
);

document.getElementById(
  "prevResult"
).addEventListener(
  "click",
  () =>
    void searchOrAdvance(-1)
);

document.getElementById(
  "nextResult"
).addEventListener(
  "click",
  () =>
    void searchOrAdvance(1)
);

/* ============================================================
   ZOOM
============================================================ */

async function rescaleAndRender(){

  renderGeneration++;

  currentScale =
    baseScale *
    zoomLevel;

  if(
    currentScale <= 0
  ){

    currentScale = 1;
  }

  zoomBox.value =
    `${Math.round(
      zoomLevel * 100
    )}%`;

  const scrollRatio =
    viewer.scrollHeight >
    viewer.clientHeight

      ? viewer.scrollTop /
        (
          viewer.scrollHeight -
          viewer.clientHeight
        )

      : 0;

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    layoutPage(
      view,
      currentScale
    );

    resetRenderedPage(
      view
    );
  }

  renderNearbyPages();

  requestAnimationFrame(
    () => {

      if(
        viewer.scrollHeight >
        viewer.clientHeight
      ){

        viewer.scrollTop =
          scrollRatio *
          (
            viewer.scrollHeight -
            viewer.clientHeight
          );
      }

    }
  );
}

document.getElementById(
  "zoomIn"
).addEventListener(
  "click",
  async () => {

    const next =
      zoomLevels.find(
        level =>
          level >
          zoomLevel
      );

    if(
      next !== undefined
    ){

      zoomLevel =
        next;

      await rescaleAndRender();
    }
  }
);

document.getElementById(
  "zoomOut"
).addEventListener(
  "click",
  async () => {

    const previous =
      [...zoomLevels]
        .reverse()
        .find(
          level =>
            level <
            zoomLevel
        );

    if(
      previous !== undefined
    ){

      zoomLevel =
        previous;

      await rescaleAndRender();
    }
  }
);

/* ============================================================
   MANUAL ZOOM
============================================================ */

zoomBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !== "Enter"
    ){

      return;
    }

    let value =
      parseFloat(
        zoomBox.value.replace(
          "%",
          ""
        )
      );

    if(
      Number.isNaN(value)
    ){

      value = 100;
    }

    value =
      Math.max(
        25,
        Math.min(
          300,
          value
        )
      );

    zoomLevel =
      value / 100;

    await rescaleAndRender();
  }
);

/* ============================================================
   FIT WIDTH
============================================================ */

document.getElementById(
  "fitWidth"
).addEventListener(
  "click",
  async () => {

    const firstView =
      pageViews.find(Boolean);

    if(!firstView){

      return;
    }

    baseScale =
      getFitWidthScale(
        firstView.page
      );

    zoomLevel =
      1;

    await rescaleAndRender();

);

document.getElementById(

).addEventListener(

    if(!firstView){

      );

/* ============================================================
   PAGE NAVIGATION
============================================================ */

pageInput.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !== "Enter"
    ){

      return;
    }

    let pageNumber =
      parseInt(
        pageInput.value,
        10
      );

    if(
      Number.isNaN(
        pageNumber
      )
    ){

      pageNumber = 1;
    }

    pageNumber =
      Math.max(
        1,
        Math.min(
          pdfDoc?.numPages || 1,
          pageNumber
        )
      );

    const view =
      await ensurePageView(
        pageNumber
      );

    if(view){

      pageInput.value =
        String(pageNumber);

      await scrollToView(
        view
      );
    }
  }
);

/* ============================================================
   CURRENT PAGE
============================================================ */

viewer.addEventListener(
  "scroll",
  () => {

    if(
      !pageViews.length
    ){

      return;
    }

    const viewerRect =
      viewer.getBoundingClientRect();

    let currentPage =
      1;

    let bestDistance =
      Infinity;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      const rect =
        view.pageDiv.getBoundingClientRect();

      const distance =
        Math.abs(
          rect.top -
          viewerRect.top -
          8
        );

      if(
        distance <
        bestDistance
      ){

        bestDistance =
          distance;

        currentPage =
          view.pageNumber;
      }
    }

    pageInput.value =
      String(currentPage);

    renderNearbyPages();
  }
);

/* ============================================================
   SELECTION CLEANUP
============================================================ */

document.addEventListener(
  "selectionchange",
  () => {

    const selection =
      document.getSelection();

    if(
      selection &&
      selection.toString().length
    ){

      return;
    }

    for(
      const view
      of pageViews
    ){

      if(
        view?.textLayerDiv
      ){

        view.textLayerDiv.classList.remove(
          "selecting"
        );
      }
    }
  }
);

/* ============================================================
   RESIZE
============================================================ */

let resizeTimer = null;

window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        async () => {

          syncViewerTop();

          if(
            !pageViews.length
          ){

            return;
          }

          if(
            window.innerWidth <= 768
          ){

            const firstView =
              pageViews.find(Boolean);

            if(firstView){

              baseScale =
                getFitWidthScale(
                  firstView.page
                );
            }
          }

          await rescaleAndRender();

        },
        150
      );
  }
);

){

/* ============================================================
   SHARE
============================================================ */

document.getElementById(
  "copyLinkBtn"
).addEventListener(
  "click",
  async () => {

    const url =
      window.location.href;

    menu.style.display =
      "none";

    if(
      navigator.share
    ){

      try{

        await navigator.share({

          title:
            document.title,

          text:
            document.getElementById(
              "title"
            ).textContent,

          url

        });

      }catch{

        /* User cancelled */
      }

      return;
    }

    try{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Link copied to clipboard!"
      );

    }catch{

      window.prompt(
        "Copy this link:",
        url
      );
    }
  }
);

/* ============================================================
   LOAD PDF
============================================================ */

try{

  if(!file){

    throw new Error(
      "No PDF file was supplied."
    );
  }

  syncViewerTop();

  const loadingTask =
    getDocument({

      url:file,

      disableAutoFetch:false,

      disableStream:false

    });

  pdfDoc =
    await loadingTask.promise;

  document.getElementById(
    "pageCount"
  ).textContent =
    `of ${pdfDoc.numPages}`;

  const firstPage =
    await pdfDoc.getPage(1);

  baseScale =
    getFitWidthScale(
      firstPage
    );

  zoomLevel =
    1;

  currentScale =
    baseScale;

  zoomBox.value =
    "100%";

  const firstView =
    createPageShell(
      1,
      firstPage
    );

  layoutPage(
    firstView,
    currentScale
  );

  pageObserver.observe(
    firstView.pageDiv
  );

  syncViewerTop();

  await renderPage(
    firstView
  );

  loadingOverlay.style.display =
    "none";

  /*
     Load the remaining page objects in the background.
  */

  void (async () => {

    for(
      let pageNumber = 2;
      pageNumber <= pdfDoc.numPages;
      pageNumber++
    ){

      try{

        if(
          pageViews[
            pageNumber - 1
          ]
        ){

          continue;
        }

        const page =
          await pdfDoc.getPage(
            pageNumber
          );

        const view =
          createPageShell(
            pageNumber,
            page
          );

        layoutPage(
          view,
          currentScale
        );

        pageObserver.observe(
          view.pageDiv
        );

        const viewerRect =
          viewer.getBoundingClientRect();

        const pageRect =
          view.pageDiv.getBoundingClientRect();

        if(
          pageRect.top <=
            viewerRect.bottom + 1400
        ){

          void renderPage(
            view
          );
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

      }catch(error){

        console.warn(
          `Could not initialize page ${pageNumber}:`,
          error
        );
      }
    }

  })();

}catch(error){

  console.error(
    "PDF loading failed:",
    error
  );

  loadingOverlay.style.display =
    "none";

  viewer.innerHTML = `

    <div style="
      color:#fff;
      padding:40px;
      text-align:center;
      max-width:600px;
    ">

      <h2>
        Unable to load PDF
      </h2>

      <p>
        ${escapeHtml(
          error?.message ||
          "Unknown error."
        )}
      </p>

    </div>
  `;
}

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  () => {

    renderGeneration++;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      try{

        pageObserver.unobserve(
          view.pageDiv
        );

      }catch{}

      try{

        view.canvas.width = 1;
        view.canvas.height = 1;

      }catch{}
    }

    try{

      if(pdfDoc){

        pdfDoc.destroy();
      }

    }catch{}
  }
);
