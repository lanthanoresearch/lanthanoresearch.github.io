<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="./pdfjs/web/annotation_layer_builder.css">
<link rel="stylesheet" href="./pdfjs/web/text_layer_builder.css">

<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Viewer</title>

<style>

/* =========================================================
   SETTINGS
========================================================= */

/*
   FALSE = selectable text layer is disabled.
   TRUE  = selectable text layer is rendered.

   Search still works when this is FALSE.
*/
const DOES_NOT_BELONG_IN_CSS = 1;

:root{
    --bg:#111;
    --panel:#1d1d1d;
    --text:#eee;
    --muted:#aaa;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;

    background:var(--bg);
    color:var(--text);

    font-family:Arial,sans-serif;

    overflow:hidden;
}


/* =========================================================
   FIXED HEADER
========================================================= */

header{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:#181818;

    border-bottom:1px solid #2d2d2d;

    z-index:10000;
}


/* =========================================================
   TOOLBAR
========================================================= */

#toolbar{
    position:fixed;

    top:58px;
    left:0;
    right:0;

    min-height:48px;

    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:8px;

    padding:10px;

    background:#1b1b1b;

    border-bottom:1px solid #2d2d2d;

    z-index:9000;
}


/* =========================================================
   MAIN VIEWER
========================================================= */

#layout{
    position:absolute;

    top:106px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;
}

#viewer{
    position:relative;

    width:100%;
    height:100%;

    overflow:auto;

    padding:30px 30px 90px;

    background:#111;

    display:flex;
    flex-direction:column;
    align-items:center;

    overscroll-behavior:contain;
}


/* =========================================================
   PAGE
========================================================= */

.page{
    position:relative;

    margin:0 auto 20px;

    background:#fff;

    box-shadow:0 0 14px rgba(0,0,0,.4);

    flex:0 0 auto;
}

.pageCanvas{
    position:absolute;

    top:0;
    left:0;

    display:block;

    pointer-events:none;

    z-index:1;
}


/* =========================================================
   TEXT LAYER
========================================================= */

/*
   It is intentionally kept simple.

   When ENABLE_TEXT_SELECTION is false,
   no textLayer is rendered at all.
*/

.textLayer{
    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:2;

    user-select:text;
    -webkit-user-select:text;

    pointer-events:auto;

    cursor:text;
}


/* =========================================================
   NATIVE PDF.JS ANNOTATION LAYER
========================================================= */

.annotationLayer{
    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:4;

    /*
       IMPORTANT:
       The layer itself must not block text selection.
       PDF.js's actual annotation elements receive
       pointer events through its own stylesheet.
    */
    pointer-events:none;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
    display:inline-flex;

    align-items:center;

    background:#333;
    color:#fff;

    border:none;

    border-radius:7px;

    padding:9px 12px;

    text-decoration:none;

    cursor:pointer;
}

button,
input{
    background:#2b2b2b;

    color:#fff;

    border:none;

    border-radius:8px;

    padding:8px 12px;
}

button:hover{
    background:#3a3a3a;

    cursor:pointer;
}


/* =========================================================
   CONTROL GROUPS
========================================================= */

.zoomControls,
.pageControls{
    display:flex;

    align-items:center;

    gap:6px;

    white-space:nowrap;

    flex-shrink:0;
}


/* =========================================================
   TITLE
========================================================= */

#titleBar{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    padding:12px 18px;

    background:rgba(24,24,24,.92);

    text-align:center;

    border-top:1px solid #333;

    backdrop-filter:blur(6px);

    z-index:8000;
}

#title{
    display:flex;

    justify-content:center;
    align-items:center;

    width:100%;

    text-align:center;

    font-size:1.2rem;

    font-weight:bold;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.title-text{
    display:inline-flex;

    align-items:center;

    min-width:0;

    max-width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.title-badges{
    display:inline-flex;

    gap:8px;

    margin-left:12px;

    flex-shrink:0;
}

.title-badge{
    display:inline-block;

    padding:4px 10px;

    color:#fff;

    font-size:.72em;

    font-weight:bold;

    border-radius:999px;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.title-badge.new{
    background:#00b050;
}

.title-badge.featured{
    background:#2f7cff;
}


/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;

    right:10px;
    top:58px;

    display:none;

    min-width:220px;

    padding:8px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    z-index:15000;
}

#menu button{
    width:100%;

    text-align:left;

    margin:3px 0;
}


/* =========================================================
   SEARCH
========================================================= */

#searchPopup{
    position:fixed;

    top:108px;
    left:110px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:10px;

    background:#222;

    border:1px solid #444;

    border-radius:10px;

    box-shadow:0 8px 20px rgba(0,0,0,.45);

    z-index:14000;
}

#searchPopup.hidden{
    display:none;
}

#searchPopup input{
    width:220px;
}

#searchResults{
    min-width:70px;

    color:#bbb;

    text-align:center;
}


/* =========================================================
   LOADING
========================================================= */

#loadingOverlay{
    position:fixed;

    inset:106px 0 0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#111;

    z-index:20000;
}

.spinner{
    width:60px;
    height:60px;

    border:6px solid #333;

    border-top:6px solid #fff;

    border-radius:50%;

    animation:spin .9s linear infinite;
}

.loadingText{
    margin-top:18px;

    color:#ddd;

    font-size:18px;
}


/* =========================================================
   READING MODE
========================================================= */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #menu,
body.reading-mode #searchPopup{
    display:none !important;
}

body.reading-mode #layout{
    top:0;
}

body.reading-mode #viewer{
    height:100%;

    padding-top:20px;
    padding-bottom:20px;
}

body.reading-mode #loadingOverlay{
    inset:0;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    #searchPopup{
        left:10px;
        right:10px;

        width:auto;

        flex-wrap:wrap;

        justify-content:center;
    }

    #searchPopup input{
        flex:1 1 100%;

        width:100%;

        min-width:0;
    }

    #searchResults{
        flex:1;

        min-width:0;
    }

    #title{
        flex-direction:column;

        gap:6px;
    }

    .title-text{
        max-width:100%;
    }

    .title-badges{
        margin-left:0;
    }

}


@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

</style>
</head>

<body>

<a

<script type="module">

/* =========================================================
   PDF.JS
========================================================= */

import {
    getDocument,
    GlobalWorkerOptions,
    TextLayer,
    AnnotationLayer
} from "./pdfjs/build/pdf.mjs";


GlobalWorkerOptions.workerSrc =
    "./pdfjs/build/pdf.worker.mjs";


/* =========================================================
   SINGLE TEXT-SELECTION SWITCH
========================================================= */

/*
   Change ONLY this value.

   false = text selection OFF
   true  = text selection ON

   Search still works either way.
*/
const ENABLE_TEXT_SELECTION = false;


/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );

const file =
    decodeURIComponent(
        params.get("file") || ""
    );

const title =
    decodeURIComponent(
        params.get("paper") || "PDF"
    );

const returnPage =
    decodeURIComponent(
        params.get("return") ||
        "index.html"
    );


/* =========================================================
   ELEMENTS
========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );

const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );

const pageInput =
    document.getElementById(
        "pageNumber"
    );

const zoomBox =
    document.getElementById(
        "zoomPercent"
    );

const searchPopup =
    document.getElementById(
        "searchPopup"
    );

const searchBox =
    document.getElementById(
        "searchBox"
    );

const menu =
    document.getElementById(
        "menu"
    );

const menuButton =
    document.getElementById(
        "menuBtn"
    );


/* =========================================================
   DESCRIPTION DATA
========================================================= */

let descriptions = {};

try{

    descriptions =
        await fetch(
            "descriptions.json"
        )
        .then(
            response =>
                response.json()
        );

}
catch(error){

    console.warn(
        "Could not load descriptions.json:",
        error
    );

}


const entries =
    Object.entries(
        descriptions
    );

let newestEntry =
    null;

if(entries.length){

    newestEntry =
        entries.sort(
            (a,b) =>
                new Date(
                    b[1].updated || 0
                ) -
                new Date(
                    a[1].updated || 0
                )
        )[0];

}


const newestKey =
    newestEntry
        ? newestEntry[0]
        : null;

const newestDate =
    newestEntry
        ? new Date(
            newestEntry[1].updated
        )
        : null;

const oneYearAgo =
    new Date();

oneYearAgo.setFullYear(
    oneYearAgo.getFullYear() - 1
);

const paper =
    Object.values(
        descriptions
    ).find(
        item =>
            item.url === file
    );

const paperKey =
    Object.keys(
        descriptions
    ).find(
        key =>
            descriptions[key].url === file
    );

const isNewest =
    Boolean(
        newestDate &&
        newestDate >= oneYearAgo &&
        paperKey === newestKey
    );


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   TITLE
========================================================= */

document.getElementById(
    "title"
).innerHTML = `

<div class="title-text">

    ${escapeHtml(title)}

    <span class="title-badges">

        ${
            isNewest
                ? `
                    <span class="title-badge new">
                        NEW
                    </span>
                  `
                : ""
        }

        ${
            paper?.featured
                ? `
                    <span class="title-badge featured">
                        FEATURED
                    </span>
                  `
                : ""
        }

    </span>

</div>

`;


/* =========================================================
   SCALE
========================================================= */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;


function updateViewerScaleVariable(){

    /*
       This is needed only when text selection is enabled.
       PDF.js requires its text-layer scale factor when
       using TextLayer outside its full viewer.
    */

    viewer.style.setProperty(
        "--scale-factor",
        String(currentScale)
    );

}


function getViewerWidth(){

    const styles =
        getComputedStyle(
            viewer
        );

    return Math.max(
        1,

        viewer.clientWidth
        -
        parseFloat(
            styles.paddingLeft
        )
        -
        parseFloat(
            styles.paddingRight
        )
    );

}


function getViewerHeight(){

    const styles =
        getComputedStyle(
            viewer
        );

    return Math.max(
        1,

        viewer.clientHeight
        -
        parseFloat(
            styles.paddingTop
        )
        -
        parseFloat(
            styles.paddingBottom
        )
    );

}


function getFitWidthScale(
    page
){

    const viewport =
        page.getViewport({
            scale:1
        });

    return (
        getViewerWidth() /
        viewport.width
    );

}


function getFitPageScale(
    page
){

    const viewport =
        page.getViewport({
            scale:1
        });

    const widthScale =
        getViewerWidth() /
        viewport.width;

    const heightScale =
        getViewerHeight() /
        viewport.height;

    return Math.min(
        widthScale,
        heightScale
    );

}


function updateScale(){

    currentScale =
        baseScale *
        zoomLevel;

    updateViewerScaleVariable();

    zoomBox.value =
        Math.round(
            zoomLevel * 100
        ) + "%";

}


/* =========================================================
   ZOOM LEVELS
========================================================= */

const zoomLevels = [
    0.25,
    0.5,
    0.75,
    1,
    1.25,
    1.5,
    1.75,
    2,
    2.25,
    2.5,
    2.75,
    3,
    3.25,
    3.5,
    3.75,
    4,
    4.25,
    4.5,
    4.75,
    5
];


/* =========================================================
   PDF STATE
========================================================= */

let pdfDoc = null;

const pageViews = [];

let searchResults = [];

let currentSearch = -1;

let lastSearchQuery = "";


/* =========================================================
   BACK BUTTON
========================================================= */

const backButton =
    document.getElementById(
        "backBtn"
    );

backButton.href =
    returnPage || "index.html";

backButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        sessionStorage.setItem(
            "restoreSearch",
            "yes"
        );

        sessionStorage.setItem(
            "returnFromPage",
            "yes"
        );

        location.assign(
            returnPage || "index.html"
        );

    }
);


/* =========================================================
   VIEWER-ONLY SCROLL
========================================================= */

function scrollToPage(
    view
){

    if(!view)
        return;

    const viewerRect =
        viewer.getBoundingClientRect();

    const pageRect =
        view.pageDiv.getBoundingClientRect();

    const target =
        viewer.scrollTop
        +
        pageRect.top
        -
        viewerRect.top
        -
        8;

    viewer.scrollTo({
        top:Math.max(
            0,
            target
        ),
        behavior:"smooth"
    });

    pageInput.value =
        String(
            view.pageNumber
        );

}


/* =========================================================
   INTERNAL DESTINATION
========================================================= */

async function resolveDestination(
    destination
){

    if(!pdfDoc)
        return null;

    try{

        let dest =
            destination;

        if(
            typeof dest === "string"
        ){

            dest =
                await pdfDoc.getDestination(
                    dest
                );

        }

        if(
            !Array.isArray(dest) ||
            !dest.length
        ){

            return null;

        }

        const pageRef =
            dest[0];

        let pageIndex = -1;

        try{

            pageIndex =
                await pdfDoc.getPageIndex(
                    pageRef
                );

        }
        catch{

            if(
                typeof pageRef === "number"
            ){

                pageIndex =
                    pageRef;

            }

        }

        if(
            pageIndex < 0 ||
            pageIndex >= pageViews.length
        ){

            return null;

        }

        return pageIndex;

    }
    catch(error){

        console.warn(
            "Could not resolve PDF destination:",
            error
        );

        return null;

    }

}


async function goToDestination(
    destination
){

    const pageIndex =
        await resolveDestination(
            destination
        );

    if(
        pageIndex === null
    )
        return;

    const view =
        pageViews[
            pageIndex
        ];

    if(view){

        scrollToPage(
            view
        );

    }

}


/* =========================================================
   LINK SERVICE
========================================================= */

/*
   PDF.js AnnotationLayer uses a link service for
   navigation. External URLs are handled here,
   internal destinations go through goToDestination().
*/

const linkService = {

    externalLinkTarget: 2,

    externalLinkRel:
        "noopener noreferrer",

    externalLinkEnabled:true,

    ignoreDestinationZoom:false,


    addLinkAttributes(
        link,
        url,
        newWindow = false
    ){

        if(!url)
            return;

        link.href =
            url;

        /*
           Keep your existing viewer behavior:
           external PDF links open separately.
        */
        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

    },


    getDestinationHash(
        destination
    ){

        if(
            typeof destination === "string"
        ){

            return (
                "#nameddest=" +
                encodeURIComponent(
                    destination
                )
            );

        }

        return "#";

    },


    getAnchorUrl(
        hash
    ){

        return hash || "#";

    },


    async goToDestination(
        destination
    ){

        await goToDestination(
            destination
        );

    },


    executeNamedAction(
        action
    ){

        if(
            action === "NextPage"
        ){

            goRelativePage(
                1
            );

        }
        else if(
            action === "PrevPage"
        ){

            goRelativePage(
                -1
            );

        }
        else if(
            action === "FirstPage"
        ){

            if(pageViews[0]){

                scrollToPage(
                    pageViews[0]
                );

            }

        }
        else if(
            action === "LastPage"
        ){

            const last =
                pageViews[
                    pageViews.length - 1
                ];

            if(last){

                scrollToPage(
                    last
                );

            }

        }

    }

};


/* =========================================================
   RELATIVE PAGE NAVIGATION
========================================================= */

function goRelativePage(
    amount
){

    const current =
        parseInt(
            pageInput.value,
            10
        ) || 1;

    const target =
        Math.max(
            1,
            Math.min(
                pageViews.length,
                current + amount
            )
        );

    const view =
        pageViews[
            target - 1
        ];

    if(view){

        scrollToPage(
            view
        );

    }

}


/* =========================================================
   CREATE PAGE
========================================================= */

async function createPage(
    pageNumber
){

    const page =
        await pdfDoc.getPage(
            pageNumber
        );

    const viewport =
        page.getViewport({
            scale:currentScale
        });

    const pageDiv =
        document.createElement(
            "div"
        );

    pageDiv.className =
        "page";

    pageDiv.dataset.pageNumber =
        String(
            pageNumber
        );

    pageDiv.style.width =
        `${viewport.width}px`;

    pageDiv.style.height =
        `${viewport.height}px`;


    /* -----------------------------------------
       Canvas
    ----------------------------------------- */

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.className =
        "pageCanvas";

    const outputScale =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );

    canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );

    canvas.style.width =
        `${viewport.width}px`;

    canvas.style.height =
        `${viewport.height}px`;

    pageDiv.appendChild(
        canvas
    );


    /* -----------------------------------------
       Text layer
    ----------------------------------------- */

    const textLayerDiv =
        document.createElement(
            "div"
        );

    textLayerDiv.className =
        "textLayer";

    pageDiv.appendChild(
        textLayerDiv
    );


    /* -----------------------------------------
       Annotation layer
    ----------------------------------------- */

    const annotationLayerDiv =
        document.createElement(
            "div"
        );

    annotationLayerDiv.className =
        "annotationLayer";

    pageDiv.appendChild(
        annotationLayerDiv
    );


    viewer.appendChild(
        pageDiv
    );


    const view = {

        pageNumber,
        page,
        pageDiv,
        canvas,
        textLayerDiv,
        annotationLayerDiv,
        viewport,

        textContent:null,
        annotations:[],

        textLayer:null,
        annotationLayer:null

    };


    pageViews[
        pageNumber - 1
    ] =
        view;


    return view;

}


/* =========================================================
   RENDER CANVAS
========================================================= */

async function renderCanvas(
    view
){

    const viewport =
        view.page.getViewport({
            scale:currentScale
        });

    view.viewport =
        viewport;


    view.pageDiv.style.width =
        `${viewport.width}px`;

    view.pageDiv.style.height =
        `${viewport.height}px`;


    const outputScale =
        window.devicePixelRatio || 1;


    view.canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );

    view.canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    view.canvas.style.width =
        `${viewport.width}px`;

    view.canvas.style.height =
        `${viewport.height}px`;


    const context =
        view.canvas.getContext(
            "2d"
        );


    context.setTransform(
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
    );


    await view.page.render({

        canvasContext:
            context,

        viewport

    }).promise;

}


/* =========================================================
   RENDER TEXT
========================================================= */

async function renderText(
    view
){

    /*
       Text extraction remains available for SEARCH
       regardless of whether visual selection is enabled.
    */

    try{

        view.textContent =
            await view.page.getTextContent();

    }
    catch(error){

        console.warn(
            `Text extraction failed on page ${view.pageNumber}:`,
            error
        );

        return;

    }


    if(
        !ENABLE_TEXT_SELECTION
    ){

        view.textLayerDiv.style.display =
            "none";

        return;

    }


    try{

        view.textLayerDiv.style.display =
            "block";

        view.textLayerDiv.replaceChildren();


        /*
           PDF.js requires --scale-factor when using
           TextLayer outside the complete viewer.
        */

        view.textLayerDiv.style.setProperty(
            "--scale-factor",
            String(
                currentScale
            )
        );


        const textLayer =
            new TextLayer({

                textContentSource:
                    view.textContent,

                container:
                    view.textLayerDiv,

                viewport:
                    view.viewport

            });


        await textLayer.render();


        view.textLayer =
            textLayer;

    }
    catch(error){

        console.warn(
            `Text layer failed on page ${view.pageNumber}:`,
            error
        );

    }

}


/* =========================================================
   RENDER ANNOTATIONS
========================================================= */

async function renderAnnotations(
    view
){

    try{

        const annotations =
            await view.page.getAnnotations({
                intent:"display"
            });


        view.annotations =
            annotations;


        view.annotationLayerDiv.replaceChildren();


        /*
           Native PDF.js annotation layer.

           This handles:
           - external URL links
           - internal PDF destinations
           - link coordinates
           - rotation
           - scaling
           - other supported annotations
        */

        const annotationLayer =
            new AnnotationLayer({

                div:
                    view.annotationLayerDiv,

                page:
                    view.page,

                viewport:
                    view.viewport,

                linkService

            });


        await annotationLayer.render({
            annotations
        });


        view.annotationLayer =
            annotationLayer;

    }
    catch(error){

        console.error(
            `Annotation layer failed on page ${view.pageNumber}:`,
            error
        );

    }

}


/* =========================================================
   LOAD PDF
========================================================= */

try{

    if(!file){

        throw new Error(
            "No PDF file was supplied."
        );

    }


    const loadingTask =
        getDocument(file);


    pdfDoc =
        await loadingTask.promise;


    document.getElementById(
        "pageCount"
    ).textContent =
        `of ${pdfDoc.numPages}`;


    const firstPage =
        await pdfDoc.getPage(
            1
        );


    baseScale =
        getFitWidthScale(
            firstPage
        );


    zoomLevel =
        1;


    updateScale();


    /*
       Create all page containers first.
    */

    for(
        let pageNumber = 1;
        pageNumber <= pdfDoc.numPages;
        pageNumber++
    ){

        try{

            await createPage(
                pageNumber
            );

        }
        catch(error){

            console.error(
                `Could not create page ${pageNumber}:`,
                error
            );

            pageViews[
                pageNumber - 1
            ] =
                null;

        }

    }


    /*
       Render canvases.
    */

    for(
        const view
        of pageViews
    ){

        if(!view)
            continue;

        try{

            await renderCanvas(
                view
            );

        }
        catch(error){

            console.error(
                `Canvas failed on page ${view.pageNumber}:`,
                error
            );

        }

    }


    /*
       The actual PDF pages are visible now.
    */

    loadingOverlay.style.display =
        "none";


    /*
       Text extraction and links.
       Selection can be disabled independently.
    */

    for(
        const view
        of pageViews
    ){

        if(!view)
            continue;


        void renderText(
            view
        );


        void renderAnnotations(
            view
        );

    }

}
catch(error){

    console.error(
        "PDF load failed:",
        error
    );


    loadingOverlay.style.display =
        "none";


    viewer.innerHTML = `

        <div style="
            color:#fff;
            padding:40px;
            text-align:center;
            max-width:600px;
        ">

            <h2>
                Unable to load PDF
            </h2>

            <p>
                ${escapeHtml(
                    error?.message ||
                    "Unknown error."
                )}
            </p>

        </div>

    `;

}


/* =========================================================
   ZOOM / ORIENTATION RENDER
========================================================= */

async function renderAllPages(){

    /*
       Preserve current position within the PDF viewer.
    */

    const oldScrollableHeight =
        viewer.scrollHeight -
        viewer.clientHeight;

    const scrollRatio =
        oldScrollableHeight > 0
            ? viewer.scrollTop /
              oldScrollableHeight
            : 0;


    updateScale();


    for(
        const view
        of pageViews
    ){

        if(!view)
            continue;


        const viewport =
            view.page.getViewport({
                scale:currentScale
            });


        view.viewport =
            viewport;


        view.pageDiv.style.width =
            `${viewport.width}px`;

        view.pageDiv.style.height =
            `${viewport.height}px`;


        /* -----------------------------------------
           Canvas
        ----------------------------------------- */

        try{

            const outputScale =
                window.devicePixelRatio || 1;


            view.canvas.width =
                Math.floor(
                    viewport.width *
                    outputScale
                );

            view.canvas.height =
                Math.floor(
                    viewport.height *
                    outputScale
                );


            view.canvas.style.width =
                `${viewport.width}px`;

            view.canvas.style.height =
                `${viewport.height}px`;


            const context =
                view.canvas.getContext(
                    "2d"
                );


            context.setTransform(
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
            );


            await view.page.render({

                canvasContext:
                    context,

                viewport

            }).promise;

        }
        catch(error){

            console.warn(
                `Canvas rerender failed on page ${view.pageNumber}:`,
                error
            );

        }


        /* -----------------------------------------
           Text
        ----------------------------------------- */

        if(
            ENABLE_TEXT_SELECTION &&
            view.textContent
        ){

            try{

                view.textLayerDiv.replaceChildren();

                view.textLayerDiv.style.display =
                    "block";

                view.textLayerDiv.style.setProperty(
                    "--scale-factor",
                    String(
                        currentScale
                    )
                );


                const textLayer =
                    new TextLayer({

                        textContentSource:
                            view.textContent,

                        container:
                            view.textLayerDiv,

                        viewport

                    });


                await textLayer.render();


                view.textLayer =
                    textLayer;

            }
            catch(error){

                console.warn(
                    `Text rerender failed on page ${view.pageNumber}:`,
                    error
                );

            }

        }


        /* -----------------------------------------
           Native annotations
        ----------------------------------------- */

        try{

            if(
                view.annotations &&
                view.annotations.length
            ){

                view.annotationLayerDiv.replaceChildren();


                const annotationLayer =
                    new AnnotationLayer({

                        div:
                            view.annotationLayerDiv,

                        page:
                            view.page,

                        viewport,

                        linkService

                    });


                await annotationLayer.render({

                    annotations:
                        view.annotations

                });


                view.annotationLayer =
                    annotationLayer;

            }

        }
        catch(error){

            console.warn(
                `Annotation rerender failed on page ${view.pageNumber}:`,
                error
            );

        }

    }


    /*
       Restore PDF-only scroll position.
    */

    requestAnimationFrame(
        () => {

            const newScrollableHeight =
                viewer.scrollHeight -
                viewer.clientHeight;


            viewer.scrollTop =
                Math.max(

                    0,

                    scrollRatio *
                    Math.max(
                        0,
                        newScrollableHeight
                    )

                );

        }
    );

}

    if(!next)

    zoomLevel =

    await renderAllPages();

};

========================================================= */

    "zoomOut"
).onclick = async () => {

    const previous =
        [...zoomLevels]
        .reverse()
        .find(
            value =>
                value < zoomLevel
        );


    if(!previous)
        return;


    zoomLevel =
        previous;


    await renderAllPages();

};

/* =========================================================
   PAGE INPUT
========================================================= */

pageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key !== "Enter"
        )
            return;


        let pageNumber =
            parseInt(
                pageInput.value,
                10
            );


        if(
            Number.isNaN(
                pageNumber
            )
        ){

            pageNumber =
                1;

        }


        pageNumber =
            Math.max(
                1,

                Math.min(
                    pageViews.length,
                    pageNumber
                )
            );


        const view =
            pageViews[
                pageNumber - 1
            ];


        if(view){

            scrollToPage(
                view
            );

        }

    }
);


/* =========================================================
   ZOOM INPUT
========================================================= */

zoomBox.addEventListener(
    "keydown",
    async event => {

        if(
            event.key !== "Enter"
        )
            return;


        let value =
            parseFloat(
                zoomBox.value
                    .replace(
                        "%",
                        ""
                    )
            );


        if(
            Number.isNaN(
                value
            )
        ){

            value =
                100;

        }


        value =
            Math.max(
                25,

                Math.min(
                    500,
                    value
                )
            );


        zoomLevel =
            value / 100;


        await renderAllPages();

    }
);


/* =========================================================
   CURRENT PAGE INDICATOR
========================================================= */

let scrollFrame =
    null;


viewer.addEventListener(
    "scroll",
    () => {

        if(scrollFrame)
            return;


        scrollFrame =
            requestAnimationFrame(
                () => {

                    scrollFrame =
                        null;


                    const viewerRect =
                        viewer.getBoundingClientRect();


                    let current =
                        1;


                    let bestDistance =
                        Infinity;


                    for(
                        const view
                        of pageViews
                    ){

                        if(!view)
                            continue;


                        const rect =
                            view.pageDiv
                            .getBoundingClientRect();


                        const distance =
                            Math.abs(
                                rect.top -
                                viewerRect.top -
                                8
                            );


                        if(
                            distance <
                            bestDistance
                        ){

                            bestDistance =
                                distance;

                            current =
                                view.pageNumber;

                        }

                    }


                    pageInput.value =
                        String(
                            current
                        );

                }
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

async function searchPDF(
    query
){

    searchResults =
        [];


    currentSearch =
        -1;


    query =
        query
            .trim()
            .toLowerCase();


    if(
        query === ""
    ){

        document.getElementById(
            "searchResults"
        ).textContent =
            "0 of 0";


        return;

    }


    lastSearchQuery =
        query;


    for(
        const view
        of pageViews
    ){

        if(
            !view ||
            !view.textContent
        )
            continue;


        const text =
            view.textContent.items

                .map(
                    item =>
                        item.str
                )

                .join(" ")

                .toLowerCase();


        if(
            text.includes(
                query
            )
        ){

            searchResults.push(
                view.pageNumber - 1
            );

        }

    }


    if(
        searchResults.length === 0
    ){

        document.getElementById(
            "searchResults"
        ).textContent =
            "0 of 0";


        alert(
            "No results found."
        );


        return;

    }


    gotoSearchResult(
        0
    );

}


function gotoSearchResult(
    index
){

    if(
        searchResults.length === 0
    )
        return;


    if(
        index < 0
    ){

        index =
            searchResults.length - 1;

    }


    if(
        index >=
        searchResults.length
    ){

        index =
            0;

    }


    currentSearch =
        index;


    document.getElementById(
        "searchResults"
    ).textContent =
        `${currentSearch + 1} of ${searchResults.length}`;


    const pageIndex =
        searchResults[
            currentSearch
        ];


    const view =
        pageViews[
            pageIndex
        ];


    if(view){

        scrollToPage(
            view
        );

    }

}


/* =========================================================
   SEARCH BOX
========================================================= */

searchBox.addEventListener(
    "keydown",
    event => {

        if(
            event.key !== "Enter"
        )

        const query =

        if(

            searchResults.length === 0 ||

            currentSearch === -1

        ){

            searchPDF(

            );

            return;

        }


        gotoSearchResult(
            currentSearch + 1
        );

    }
);

/* =========================================================
   READING MODE
========================================================= */

/*
   Reading mode is completely independent of
   PDF text selection.

   A click on actual PDF page content toggles it.

   A click on an annotation/link does NOT toggle it.

   Gray space does NOT toggle it.
*/

let suppressReadingModeClick =
    false;


viewer.addEventListener(
    "mousedown",
    event => {

        /*
           If there is a text selection enabled,
           remember it so the click used to clear it
           won't toggle reading mode.
        */

        if(
            !ENABLE_TEXT_SELECTION
        ){

            return;

        }


        const selection =
            window.getSelection();


        if(
            selection &&
            selection.toString().length > 0
        ){

            suppressReadingModeClick =
                true;

        }

    }
);


viewer.addEventListener(
    "click",
    event => {

        /*
           Annotation/link click:
           never enter reading mode.
        */

        if(
            event.target.closest(
                ".annotationLayer section"
            ) ||
            event.target.closest(
                ".annotationLayer a"
            ) ||
            event.target.closest(
                ".annotationLayer button"
            )
        ){

            return;

        }


        const page =
            event.target.closest(
                ".page"
            );


        /*
           Gray area:
           no reading-mode change.
        */

        if(!page)
            return;


        /*
           When selectable text is enabled,
           preserve the previous behavior.
        */

        if(
            ENABLE_TEXT_SELECTION
        ){

            const selection =
                window.getSelection();


            if(
                selection &&
                selection.toString().length > 0
            ){

                suppressReadingModeClick =
                    true;

                return;

            }


            if(
                suppressReadingModeClick
            ){

                suppressReadingModeClick =
                    false;

                return;

            }

        }


        /*
           Toggle reading mode.
        */

        document.body.classList.toggle(
            "reading-mode"
        );


        if(
            document.body.classList
                .contains(
                    "reading-mode"
                )
        ){

            menu.style.display =
                "none";


            searchPopup.classList.add(
                "hidden"
            );

        }

    }
);


/* =========================================================
   RESIZE / ORIENTATION
========================================================= */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async () => {

                    if(
                        !pageViews.length
                    )
                        return;


                    /*
                       Preserve the original behavior:
                       automatically Fit Width on mobile.
                    */

                    if(
                        window.innerWidth <=
                        768
                    ){

                        const firstView =
                            pageViews.find(
                                Boolean
                            );


                        if(!firstView)
                            return;


                        baseScale =
                            getFitWidthScale(
                                firstView.page
                            );


                        zoomLevel =
                            1;


                        await renderAllPages();

                    }

                },
                150
            );

    }
);
