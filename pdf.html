<!DOCTYPE html>
<html lang="en">
<head>

<title>PDF Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#eee;
  --muted:#aaa;
  --viewer-top:106px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;

  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 8px;

  background:#1b1b1b;

  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  display:flex;
  flex-direction:column;
  align-items:center;

  scroll-behavior:auto;

  overscroll-behavior:contain;
}

/* ============================================================
   PDF PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:
    0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;

  pointer-events:none;

  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;

  align-items:center;

  white-space:nowrap;
}

button,
input{
  background:#292929;

  color:#fff;

  border:1px solid #383838;

  border-radius:6px;

  padding:6px 9px;

  font:inherit;

  outline:none;
}

button:hover{
  background:#353535;

  cursor:pointer;
}

button:active{
  background:#414141;
}

button:focus-visible,
input:focus-visible{
  border-color:#666;

  outline:1px solid #555;
}

/* ============================================================
   COMPACT TOOLBAR CONTROLS
============================================================ */

.toolButton{
  height:32px;

  padding:0 10px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  white-space:nowrap;

  font-size:13px;

  border-radius:6px;
}

.iconButton{
  width:32px;
  height:32px;

  padding:0;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  border-radius:6px;
}

/* ============================================================
   ZOOM
============================================================ */

.zoomControls{
  display:flex;

  align-items:center;

  gap:3px;

  height:32px;

  padding:0 3px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;
}

.zoomControls button{
  width:29px;
  height:28px;

  padding:0;

  border:0;

  background:transparent;

  font-size:17px;

  display:flex;

  align-items:center;

  justify-content:center;
}

.zoomControls button:hover{
  background:#353535;
}

#zoomPercent{
  width:58px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

/* ============================================================
   PAGE CONTROLS
============================================================ */

.pageControls{
  display:flex;

  align-items:center;

  gap:4px;

  height:32px;

  padding:0 6px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;

  white-space:nowrap;
}

.pageControls label{
  color:#aaa;

  font-size:12px;
}

#pageNumber{
  width:43px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

#pageCount{
  color:#999;

  font-size:12px;

  padding-right:2px;
}

/* ============================================================
   TOOLBAR DIVIDER
============================================================ */

.toolbarDivider{
  width:1px;

  height:22px;

  background:#383838;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:rgba(24,24,24,.92);

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;

  backdrop-filter:blur(6px);
}

#title{
  display:flex;

  justify-content:center;
  align-items:center;

  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.title-text{
  order:1;

  position:relative;

  display:inline-block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.title-badges{
  display:inline-flex;

  gap:8px;

  margin-left:12px;

  vertical-align:middle;
}

.title-badge{
  display:inline-block;

  padding:4px 10px;

  color:#fff;

  font-size:.72em;

  font-weight:bold;

  border-radius:999px;

  text-transform:uppercase;

  letter-spacing:.5px;

  flex-shrink:0;
}

.title-badge.new{
  order:2;

  background:#00b050;
}

.title-badge.featured{
  order:3;

  background:#2f7cff;
}

/* ============================================================
   MENU
============================================================ */

#menu{
  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{
  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   SEARCH POPUP
============================================================ */

#searchPopup{
  position:fixed;

  top:108px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:6px;

  padding:8px;

  background:#222;

  border:1px solid #444;

  border-radius:9px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.45);

  z-index:6500;
}

#searchPopup.hidden{
  display:none;
}

#searchPopup input{
  width:230px;

  height:34px;

  background:#181818;

  border-color:#3b3b3b;

  font-size:13px;
}

#searchPopup input.searching{
  border-color:#4c82c7;
}

/* ============================================================
   LARGE SEARCH NAVIGATION BUTTONS
============================================================ */

#searchPopup .searchNavButton{

  width:42px;
  min-width:42px;

  height:40px;
  min-height:40px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:7px;

  font-size:20px;

  line-height:1;

  font-weight:bold;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

#searchPopup .searchNavButton:hover{
  background:#353535;
}

#searchPopup .searchNavButton:active{
  background:#414141;

  transform:scale(.96);
}

#searchResults{
  color:#aaa;

  min-width:70px;

  text-align:center;

  font-size:12px;

  white-space:nowrap;
}

/* ============================================================
   PDF.JS TEXT LAYER
============================================================ */

.textLayer{
  color-scheme:only light;

  position:absolute;

  text-align:initial;

  inset:0;

  overflow:clip;

  opacity:1;

  line-height:1;

  letter-spacing:normal;

  word-spacing:normal;

  text-size-adjust:none;

  forced-color-adjust:none;

  transform-origin:0 0;

  caret-color:CanvasText;

  z-index:2;

  pointer-events:auto;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;

  -webkit-touch-callout:default;

  --min-font-size:1;

  --text-scale-factor:
    calc(
      var(--total-scale-factor) *
      var(--min-font-size)
    );

  --min-font-size-inv:
    calc(
      1 /
      var(--min-font-size)
    );

  --scale-factor:1;

  --user-unit:1;

  --total-scale-factor:1;
}

.textLayer span,
.textLayer br{
  color:transparent;

  position:absolute;

  white-space:pre;

  cursor:text;

  transform-origin:0% 0%;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;
}

.textLayer > :not(.markedContent),
.textLayer .markedContent span:not(.markedContent){

  z-index:1;

  --font-height:0;

  font-size:
    calc(
      var(--text-scale-factor) *
      var(--font-height)
    );

  --scale-x:1;

  --rotate:0deg;

  transform:
    rotate(var(--rotate))
    scaleX(var(--scale-x))
    scale(var(--min-font-size-inv));
}

.textLayer .markedContent{
  display:contents;
}

.textLayer span[role="img"]{
  user-select:none;

  -webkit-user-select:none;

  cursor:default;
}

.textLayer ::selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer ::-moz-selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer br::selection{
  background:transparent;
}

.textLayer .endOfContent{
  display:block;

  position:absolute;

  inset:100% 0 0;

  z-index:0;

  cursor:default;

  user-select:none;

  -webkit-user-select:none;
}

.textLayer.selecting .endOfContent{
  top:0;
}

/* ============================================================
   SEARCH HIGHLIGHTS
============================================================ */

.searchHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:3;

  pointer-events:none;
}

.search-highlight{

  position:absolute;

  background:
    rgba(0,125,255,.30);

  border-radius:2px;

  box-shadow:
    0 0 0 1px
    rgba(0,100,230,.10);

  pointer-events:none;

  transition:
    background .12s ease,
    box-shadow .12s ease;
}

.search-highlight.search-current{

  background:
    rgba(0,105,255,.48);

  box-shadow:
    0 0 0 1px
    rgba(0,80,220,.30);
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;

  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

/* ============================================================
   FLOATING READING MODE
============================================================ */

#readingModeFloat{

  position:fixed;

  right:18px;

  bottom:86px;

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:
    rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#readingModeFloat:hover{
  background:#3a3a3a;

  transform:scale(1.05);
}

#readingModeFloat:active{
  transform:scale(.96);
}

/* ============================================================
   READING MODE
============================================================ */

/*
   Reading mode completely removes the normal viewer chrome.
   The elements are not merely visually hidden; their height,
   padding, borders, and spacing are also collapsed.
*/

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{

  display:none !important;

  height:0 !important;

  min-height:0 !important;

  max-height:0 !important;

  margin:0 !important;

  padding:0 !important;

  border:0 !important;

  overflow:hidden !important;
}

body.reading-mode #layout{

  top:0 !important;

  height:100% !important;

  position:absolute;
}

body.reading-mode #viewer{

  height:100%;

  padding-top:20px;

  padding-bottom:20px;
}

body.reading-mode #loadingOverlay{

  inset:0;
}

body.reading-mode #readingModeFloat{

  right:16px;

  bottom:16px;

  background:
    rgba(40,40,40,.88);
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #toolbar{
    justify-content:center;

    gap:4px;

    padding:5px;
  }

  .toolButton{
    height:30px;

    padding:0 8px;

    font-size:12px;
  }

  .zoomControls{
    height:30px;
  }

  .zoomControls button{
    width:27px;

    height:26px;
  }

  #zoomPercent{
    width:53px;

    height:25px;
  }

  .pageControls{
    height:30px;

    padding:0 5px;
  }

  #pageNumber{
    width:40px;

    height:25px;
  }

  #searchPopup{

    left:8px;
    right:8px;

    top:104px;

    transform:none;

    width:auto;

    flex-wrap:wrap;

    justify-content:center;

    gap:6px;
  }

  #searchPopup input{

    flex:1 1 100%;

    width:100%;

    min-width:0;

    height:36px;
  }

  #searchPopup .searchNavButton{

    width:48px;
    min-width:48px;

    height:44px;
    min-height:44px;

    font-size:21px;
  }

  #searchResults{

    flex:1;

    min-width:80px;
  }

  #readingModeFloat{

    right:14px;

    bottom:88px;

    width:46px;
    height:46px;

    font-size:16px;
  }

  body.reading-mode #readingModeFloat{

    right:12px;

    bottom:12px;
  }

  .title-badges{

    display:flex;

    justify-content:center;

    gap:8px;

    margin:0 0 8px 0;
  }

  #title{

    flex-direction:column;

    align-items:center;

    gap:6px;
  }

  .title-text{

    order:2;

    width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .title-badge.new,
  .title-badge.featured{

    order:1;
  }
}

/* ============================================================
   ANIMATION
============================================================ */

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

</style>
</head>

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc =
  "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const file =
  decodeURIComponent(
    params.get("file") || ""
  );

const title =
  decodeURIComponent(
    params.get("paper") || "PDF"
  );

const returnPage =
  decodeURIComponent(
    params.get("return") ||
    "index.html"
  );

/* ============================================================
   ELEMENTS
============================================================ */

const header =
  document.querySelector("header");

const toolbar =
  document.getElementById(
    "toolbar"
  );

const viewer =
  document.getElementById(
    "viewer"
  );

const layout =
  document.getElementById(
    "layout"
  );

const loadingOverlay =
  document.getElementById(
    "loadingOverlay"
  );

const pageInput =
  document.getElementById(
    "pageNumber"
  );

const zoomBox =
  document.getElementById(
    "zoomPercent"
  );

const searchPopup =
  document.getElementById(
    "searchPopup"
  );

const searchBox =
  document.getElementById(
    "searchBox"
  );

const searchResultsLabel =
  document.getElementById(
    "searchResults"
  );

const menu =
  document.getElementById(
    "menu"
  );

const menuButton =
  document.getElementById(
    "menuBtn"
  );

const readingModeFloat =
  document.getElementById(
    "readingModeFloat"
  );

/* ============================================================
   CHROME HEIGHT
============================================================ */

function syncViewerTop(){

  if(
    document.body.classList.contains(
      "reading-mode"
    )
  ){

    return;
  }

  const headerHeight =
    header.getBoundingClientRect()
      .height;

  const toolbarHeight =
    toolbar.getBoundingClientRect()
      .height;

  const total =
    Math.ceil(
      headerHeight +
      toolbarHeight
    );

  document.documentElement.style.setProperty(
    "--viewer-top",
    `${total}px`
  );

  layout.style.top =
    `${total}px`;

  loadingOverlay.style.top =
    `${total}px`;
}

function scheduleChromeSync(){

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        syncViewerTop
      );

    }
  );
}

/* ============================================================
   LIMITS
============================================================ */

const MAX_CANVAS_PIXELS =
  8000000;

const MAX_CANVAS_DIMENSION =
  16384;

const RENDER_MARGIN =
  "1400px";

/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{

  descriptions =
    await fetch(

/* ============================================================
   SAFE OUTPUT SCALE
============================================================ */

function getSafeOutputScale(
  viewport
){

  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );

  let outputScale =
    dpr;

  const pagePixels =
    viewport.width *
    viewport.height;

  if(
    pagePixels > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        Math.sqrt(
          MAX_CANVAS_PIXELS /
          pagePixels
        )
      );
  }

  if(
    viewport.width > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.width
      );
  }

  if(
    viewport.height > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.height
      );
  }

  return Math.max(
    0.35,

    Math.min(
      outputScale,
      dpr
    )
  );
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(
  view,
  scale
){

  const viewport =
    view.page.getViewport({
      scale
    });

  view.viewport =
    viewport;

  const width =
    `${viewport.width}px`;

  const height =
    `${viewport.height}px`;

  view.pageDiv.style.width =
    width;

  view.pageDiv.style.height =
    height;

  view.canvas.style.width =
    width;

  view.canvas.style.height =
    height;

  view.textLayerDiv.style.width =
    width;

  view.textLayerDiv.style.height =
    height;

  view.searchLayerDiv.style.width =
    width;

  view.searchLayerDiv.style.height =
    height;

  view.linkLayerDiv.style.width =
    width;

  view.linkLayerDiv.style.height =
    height;

  const userUnit =
    view.page.userUnit || 1;

  view.textLayerDiv.style.setProperty(
    "--scale-factor",
    String(
      viewport.scale
    )
  );

  view.textLayerDiv.style.setProperty(
    "--user-unit",
    String(
      userUnit
    )
  );

  view.textLayerDiv.style.setProperty(
    "--total-scale-factor",
    String(
      viewport.scale *
      userUnit
    )
  );

  return viewport;
}

/* ============================================================
   CANVAS
============================================================ */

async function paintCanvas(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  const viewport =
    view.viewport;

  const outputScale =
    getSafeOutputScale(
      viewport
    );

  const pixelWidth =
    Math.max(
      1,
      Math.floor(
        viewport.width *
        outputScale
      )
    );

  const pixelHeight =
    Math.max(
      1,
      Math.floor(
        viewport.height *
        outputScale
      )
    );

  if(
    pixelWidth >
      MAX_CANVAS_DIMENSION ||
    pixelHeight >
      MAX_CANVAS_DIMENSION
  ){

    throw new Error(
      "Safe canvas limit exceeded."
    );
  }

  view.canvas.width =
    pixelWidth;

  view.canvas.height =
    pixelHeight;

  const context =
    view.canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );

  if(!context){

    throw new Error(
      "Could not create canvas context."
    );
  }

  context.setTransform(
    outputScale,
    0,
    0,
    outputScale,
    0,
    0
  );

  await view.page.render({

    canvasContext:
      context,

    viewport

  }).promise;
}

async function ensureTextContent(
  view
){

  if(
    view.textContent
  ){

  view.textContent =

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    const textContent =
      await ensureTextContent(
        view
      );

    view.textLayerDiv.replaceChildren();

    const userUnit =
      view.page.userUnit || 1;

    view.textLayerDiv.style.setProperty(
      "--scale-factor",
      String(
        view.viewport.scale
      )
    );

    view.textLayerDiv.style.setProperty(
      "--user-unit",
      String(
        userUnit
      )
    );

    view.textLayerDiv.style.setProperty(
      "--total-scale-factor",
      String(
        view.viewport.scale *
        userUnit
      )
    );

    const textLayer =
      new TextLayer({

        textContentSource:
          textContent,

        container:
          view.textLayerDiv,

        viewport:
          view.viewport

      });

    await textLayer.render();

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    const endOfContent =
      document.createElement(
        "div"
      );

    endOfContent.className =
      "endOfContent";

    view.textLayerDiv.append(
      endOfContent
    );

    view.textLayerEnd =
      endOfContent;

    view.textLayerDiv.addEventListener(
      "pointerdown",
      () => {

        view.textLayerDiv.classList.add(
          "selecting"
        );

      }
    );

    view.textLayer =
      textLayer;

  }catch(error){

    console.warn(
      `Text layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

/* ============================================================
   LINKS
============================================================ */

async function paintLinks(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    if(
      !view.annotations
    ){

      view.annotations =
        await view.page.getAnnotations({
          intent:"display"
        });
    }

    renderLinkLayer(
      view
    );

  }catch(error){

    console.warn(
      `Link layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

function renderLinkLayer(
  view
){

  const layer =
    view.linkLayerDiv;

  layer.replaceChildren();

  if(
    !Array.isArray(
      view.annotations
    )
  ){

    return;
  }

  const viewport =
    view.viewport;

  for(
    const annotation
    of view.annotations
  ){

    if(
      annotation.subtype !==
      "Link"
    ){

      continue;
    }

    if(
      !annotation.rect ||
      annotation.rect.length !== 4
    ){

      continue;
    }

    const rect =
      viewport.convertToViewportRectangle(
        annotation.rect
      );

    const left =
      Math.min(
        rect[0],
        rect[2]
      );

    const top =
      Math.min(
        rect[1],
        rect[3]
      );

    const width =
      Math.abs(
        rect[2] -
        rect[0]
      );

    const height =
      Math.abs(
        rect[3] -
        rect[1]
      );

    if(
      width <= 0 ||
      height <= 0
    ){

      continue;
    }

    const link =
      document.createElement(
        "a"
      );

    link.className =
      "pdf-link";

    link.style.left =
      `${left}px`;

    link.style.top =
      `${top}px`;

    link.style.width =
      `${width}px`;

    link.style.height =
      `${height}px`;

    if(
      annotation.url ||
      annotation.unsafeUrl
    ){

      link.href =
        annotation.url ||
        annotation.unsafeUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

    }else if(
      annotation.dest
    ){

      link.href =
        "#";

      link.addEventListener(
        "click",
        async event => {

          event.preventDefault();

          event.stopPropagation();

          await openInternalDestination(
            annotation.dest
          );

        }
      );

    }else{

      continue;
    }

    layer.appendChild(
      link
    );
  }
}

function createPageShell(
  pageNumber,
  page
){

  const pageDiv =
    document.createElement(
      "div"
    );

  pageDiv.className =
    "page";

  pageDiv.dataset.pageNumber =
    String(pageNumber);

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.className =
    "pageCanvas";

  const textLayerDiv =
    document.createElement(
      "div"
    );

  textLayerDiv.className =
    "textLayer";

  const searchLayerDiv =
    document.createElement(
      "div"
    );

  searchLayerDiv.className =
    "searchHighlightLayer";

  const linkLayerDiv =
    document.createElement(
      "div"
    );

  linkLayerDiv.className =
    "linkLayer";

  pageDiv.appendChild(
    canvas
  );

  pageDiv.appendChild(
    textLayerDiv
  );

  pageDiv.appendChild(
    searchLayerDiv
  );

  pageDiv.appendChild(
    linkLayerDiv
  );

  viewer.appendChild(
    pageDiv
  );

  const view = {

    pageNumber,

    page,

    pageDiv,

    canvas,

    textLayerDiv,

    searchLayerDiv,

    linkLayerDiv,

    viewport:null,

    textContent:null,

    annotations:null,

    textLayer:null,

    textLayerEnd:null,

    renderedScale:null,

    renderingPromise:null

  };

  pageViews[
    pageNumber - 1
  ] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(
  view
){

  if(!view){

    return;
  }

  const generation =
    renderGeneration;

  if(
    view.renderedScale ===
    currentScale
  ){

    return;
  }

  if(
    view.renderingPromise
  ){

    return view.renderingPromise;
  }

  view.renderingPromise =
    (async () => {

      try{

        layoutPage(
          view,
          currentScale
        );

        await paintCanvas(
          view,
          generation
        );

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        view.renderedScale =
          currentScale;

        await Promise.all([

          paintText(
            view,
            generation
          ),

          paintLinks(
            view,
            generation
          )

        ]);

      }catch(error){

        console.warn(
          `Page ${view.pageNumber} render failed:`,
          error
        );

      }finally{

        view.renderingPromise =
          null;
      }

    })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver =
  new IntersectionObserver(

    entries => {

      for(
        const entry
        of entries
      ){

        if(
          !entry.isIntersecting
        ){

          continue;
        }

        const view =
          pageViews.find(
            candidate =>
              candidate &&
              candidate.pageDiv ===
              entry.target
          );

        if(view){

          void renderPage(
            view
          );
        }
      }

    },

    {
      root:viewer,

      rootMargin:
        RENDER_MARGIN,

      threshold:0
    }

  );

/* ============================================================
   RENDER NEARBY
============================================================ */

function renderNearbyPages(){

  const viewerRect =
    viewer.getBoundingClientRect();

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    const rect =
      view.pageDiv.getBoundingClientRect();

    if(
      rect.bottom >=
        viewerRect.top - 1400 &&

      rect.top <=
        viewerRect.bottom + 1400
    ){

      void renderPage(
        view
      );
    }
  }
}

/* ============================================================
   ENSURE PAGE
============================================================ */

async function ensurePageView(
  pageNumber
){

  if(
    !pdfDoc ||
    pageNumber < 1 ||
    pageNumber >
      pdfDoc.numPages
  ){

    return null;
  }

  const existing =
    pageViews[
      pageNumber - 1
    ];

  if(existing){

    return existing;
  }

  try{

    const page =
      await pdfDoc.getPage(
        pageNumber
      );

    const view =
      createPageShell(
        pageNumber,
        page
      );

    layoutPage(
      view,
      currentScale
    );

    pageObserver.observe(
      view.pageDiv
    );

    return view;

  }catch(error){

    console.warn(
      `Could not load page ${pageNumber}:`,
      error
    );

    return null;
  }
}

/* ============================================================
   INTERNAL DESTINATIONS
============================================================ */

async function resolveDestination(
  destination
){

  if(!pdfDoc){

    return null;
  }

  try{

    let dest =
      destination;

    if(
      typeof dest ===
      "string"
    ){

      dest =
        await pdfDoc.getDestination(
          dest
        );
    }

    if(
      !Array.isArray(dest) ||
      !dest.length
    ){

      return null;
    }

    const pageRef =
      dest[0];

    let pageIndex =
      -1;

    try{

      pageIndex =
        await pdfDoc.getPageIndex(
          pageRef
        );

    }catch{

      if(
        typeof pageRef ===
        "number"
      ){

        pageIndex =
          pageRef;
      }
    }

    if(
      pageIndex < 0 ||
      pageIndex >=
        pdfDoc.numPages
    ){

      return null;
    }

    return pageIndex;

  }catch{

    return null;
  }
}

async function scrollToView(
  view
){

  if(!view){

    return;
  }

  await renderPage(
    view
  );

  const viewerRect =
    viewer.getBoundingClientRect();

  const pageRect =
    view.pageDiv.getBoundingClientRect();

  const targetOffset =
    pageRect.top -
    viewerRect.top +
    viewer.scrollTop;

  viewer.scrollTo({

    top:
      Math.max(
        0,
        targetOffset - 8
      ),

    behavior:
      "smooth"

  });

  pageInput.value =
    String(
      view.pageNumber
    );
}

async function openInternalDestination(
  destination
){

  const pageIndex =
    await resolveDestination(
      destination
    );

  if(
    pageIndex === null
  ){

    return;
  }

  const view =
    await ensurePageView(
      pageIndex + 1
    );

  if(view){

    await scrollToView(
      view
    );
  }
}

/* ============================================================
   TAP TO READ
============================================================ */

let tapState = {

  active:false,

  moved:false,

  startX:0,

  startY:0

};

viewer.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target.closest(
        ".textLayer"
      ) ||
      event.target.closest(
        ".pdf-link"
      ) ||
      event.target.closest(
        ".searchHighlightLayer"
      )
    ){

      tapState.active =
        false;

      return;
    }

    const page =
      event.target.closest(
        ".page"
      );

    if(!page){

      tapState.active =
        false;

      return;
    }

    tapState.active =
      true;

    tapState.moved =
      false;

    tapState.startX =
      event.clientX;

    tapState.startY =
      event.clientY;

  }
);

viewer.addEventListener(
  "pointermove",
  event => {

    if(
      !tapState.active
    ){

      return;
    }

    if(
      Math.hypot(
        event.clientX -
        tapState.startX,

        event.clientY -
        tapState.startY
      ) > 10
    ){

      tapState.moved =
        true;
    }
  }
);

viewer.addEventListener(
  "pointerup",
  event => {

    if(
      !tapState.active
    ){

      return;
    }

    const moved =
      tapState.moved;

    tapState.active =
      false;

    if(moved){

      return;
    }

    if(
      event.target.closest(
        ".textLayer"
      ) ||
      event.target.closest(
        ".pdf-link"
      ) ||
      event.target.closest(
        ".searchHighlightLayer"
      )
    ){

      return;
    }

    if(
      event.target.closest(
        ".page"
      )
    ){

      setReadingMode(
        !readingMode
      );
    }
  }
);

/* ============================================================
   SEARCH TEXT NODES
============================================================ */

function getTextNodes(
  view
){

  const nodes = [];

  const walker =
    document.createTreeWalker(

      view.textLayerDiv,

      NodeFilter.SHOW_TEXT,

      {
        acceptNode(node){

          if(
            !node.nodeValue ||
            !node.nodeValue.length
          ){

            return NodeFilter.FILTER_REJECT;
          }

          if(
            node.parentElement?.closest(
              ".endOfContent"
            )
          ){

            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      }

    );

  let node;

  while(
    (node = walker.nextNode())
  ){

    nodes.push(
      node
    );
  }

  return nodes;
}

/* ============================================================
   SEARCH NORMALIZATION
============================================================ */

function normalizeSearchText(
  value
){

  return String(
    value || ""
  )
    .replace(
      /\u00a0/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .toLowerCase();
}

/* ============================================================
   SEARCH RANGE HIGHLIGHT
============================================================ */

function createHighlightForRange(
  view,
  startNode,
  startOffset,
  endNode,
  endOffset
){

  const range =
    document.createRange();

  try{

    range.setStart(
      startNode,
      startOffset
    );

    range.setEnd(
      endNode,
      endOffset
    );

  }catch{

    return [];
  }

  const layerRect =
    view.searchLayerDiv
      .getBoundingClientRect();

  const rects =
    Array.from(
      range.getClientRects()
    );

  const elements = [];

  for(
    const rect
    of rects
  ){

    if(
      rect.width <= 0 ||
      rect.height <= 0
    ){

      continue;
    }

    const highlight =
      document.createElement(
        "div"
      );

    highlight.className =
      "search-highlight";

    highlight.style.left =
      `${rect.left - layerRect.left}px`;

    highlight.style.top =
      `${rect.top - layerRect.top}px`;

    highlight.style.width =
      `${rect.width}px`;

    highlight.style.height =
      `${rect.height}px`;

    view.searchLayerDiv.appendChild(
      highlight
    );

    elements.push(
      highlight
    );
  }

  return elements;
}

/* ============================================================
   SEARCH OCCURRENCES ON PAGE
============================================================ */

function findOccurrencesOnPage(
  view,
  query
){

  if(
    !view ||
    !query
  ){

    return [];
  }

  const nodes =
    getTextNodes(
      view
    );

  if(
    !nodes.length
  ){

    return [];
  }

  let fullText =
    "";

  const positions = [];

  for(
    const node
    of nodes
  ){

    const nodeText =
      node.nodeValue || "";

    const start =
      fullText.length;

    fullText +=
      nodeText;

    positions.push({

      node,

      start,

      end:
        fullText.length

    });
  }

  const lowerText =
    fullText.toLowerCase();

  const lowerQuery =
    query.toLowerCase();

  const occurrences =
    [];

  let searchAt =
    0;

  while(true){

    const matchStart =
      lowerText.indexOf(
        lowerQuery,
        searchAt
      );

    if(
      matchStart === -1
    ){

      break;
    }

    const matchEnd =
      matchStart +
      lowerQuery.length;

    let startInfo =
      null;

    let endInfo =
      null;

    for(
      const info
      of positions
    ){

      if(
        !startInfo &&
        matchStart >=
          info.start &&
        matchStart <
          info.end
      ){

        startInfo =
          info;
      }

      if(
        matchEnd >
          info.start &&
        matchEnd <=
          info.end
      ){

        endInfo =
          info;

        break;
      }
    }

    if(
      startInfo &&
      endInfo
    ){

      const startOffset =
        matchStart -
        startInfo.start;

      const endOffset =
        matchEnd -
        endInfo.start;

      const elements =
        createHighlightForRange(

          view,

          startInfo.node,
          startOffset,

          endInfo.node,
          endOffset

        );

      if(
        elements.length
      ){

        occurrences.push({

          view,

          pageNumber:
            view.pageNumber,

          elements

        });
      }
    }

    searchAt =
      matchStart +
      Math.max(
        1,
        lowerQuery.length
      );
  }

  return occurrences;
}

/* ============================================================
   CLEAR SEARCH HIGHLIGHTS
============================================================ */

function clearSearchHighlights(){

  for(
    const view
    of pageViews
  ){

    if(
      view?.searchLayerDiv
    ){

      view.searchLayerDiv.replaceChildren();
    }
  }
}

/* ============================================================
   SEARCH COUNTER
============================================================ */

function updateSearchCounter(){

  if(
    !searchResults.length
  ){

    searchResultsLabel.textContent =
      lastSearchQuery
        ? "0 results"
        : "0 of 0";

    return;
  }

  searchResultsLabel.textContent =
    `${currentSearch + 1} of ${searchResults.length}`;
}

/* ============================================================
   MARK CURRENT SEARCH
============================================================ */

function markCurrentSearch(){

  for(
    const result
    of searchResults
  ){

    for(
      const element
      of result.elements
    ){

      element.classList.remove(
        "search-current"
      );
    }
  }

  if(
    currentSearch < 0 ||
    currentSearch >=
      searchResults.length
  ){

    return;
  }

  const result =
    searchResults[
      currentSearch
    ];

  if(!result){

    return;
  }

  for(
    const element
    of result.elements
  ){

    element.classList.add(
      "search-current"
    );
  }
}

/* ============================================================
   SCROLL SEARCH RESULT
============================================================ */

async function scrollToSearchResult(
  result
){

  if(!result){

    return;
  }

  const view =
    result.view;

  if(!view){

    return;
  }

  await renderPage(
    view
  );

  await new Promise(
    resolve =>
      requestAnimationFrame(
        resolve
      )
  );

  const element =
    result.elements?.[0];

  if(!element){

    return;
  }

  const viewerRect =
    viewer.getBoundingClientRect();

  const elementRect =
    element.getBoundingClientRect();

  const viewerCenter =
    viewerRect.top +
    viewer.clientHeight / 2;

  const elementCenter =
    elementRect.top +
    elementRect.height / 2;

  viewer.scrollTop +=
    elementCenter -
    viewerCenter;

  const finalRect =
    element.getBoundingClientRect();

  const topPadding =
    20;

  const bottomPadding =
    readingMode
      ? 20
      : 90;

  if(
    finalRect.top <
      viewerRect.top +
      topPadding
  ){

    viewer.scrollTop +=
      finalRect.top -
      (
        viewerRect.top +
        topPadding
      );

  }else if(
    finalRect.bottom >
      viewerRect.bottom -
      bottomPadding
  ){

    viewer.scrollTop +=
      finalRect.bottom -
      (
        viewerRect.bottom -
        bottomPadding
      );
  }

  pageInput.value =
    String(
      view.pageNumber
    );
}

/* ============================================================
   REBUILD SEARCH
============================================================ */

async function rebuildSearchHighlights(
  query,
  generation
){

  if(
    !query ||
    generation !==
      searchGeneration
  ){

    return;
  }

  clearSearchHighlights();

  const results = [];

  const normalizedQuery =
    normalizeSearchText(
      query
    );

  for(
    let pageNumber = 1;

    pageNumber <=
      (pdfDoc?.numPages || 0);

    pageNumber++
  ){

    if(
      generation !==
        searchGeneration
    ){

      return;
    }

    const view =
      await ensurePageView(
        pageNumber
      );

    if(!view){

      continue;
    }

    const textContent =
      await ensureTextContent(
        view
      );

    if(
      generation !==
        searchGeneration
    ){

      return;
    }

    const pageText =
      textContent.items
        .map(
          item =>
            item.str || ""
        )
        .join("");

    if(
      !normalizeSearchText(
        pageText
      ).includes(
        normalizedQuery
      )
    ){

      continue;
    }

    await renderPage(
      view
    );

    if(
      generation !==
        searchGeneration
    ){

      return;
    }

    await new Promise(
      resolve =>
        requestAnimationFrame(
          () =>
            requestAnimationFrame(
              resolve
            )
        )
    );

    if(
      generation !==
        searchGeneration
    ){

      return;
    }

    const pageResults =
      findOccurrencesOnPage(
        view,
        query
      );

    results.push(
      ...pageResults
    );
  }

  if(
    generation !==
      searchGeneration
  ){

    return;
  }

  searchResults =
    results;

  lastSearchQuery =
    query;

  currentSearch =
    results.length
      ? 0
      : -1;

  markCurrentSearch();

  updateSearchCounter();

  if(
    results.length
  ){

    await scrollToSearchResult(
      results[0]
    );

  }
}

/* ============================================================
   SEARCH AS YOU TYPE
============================================================ */

function scheduleSearch(){

  const query =
    searchBox.value.trim();

  clearTimeout(
    searchTimer
  );

  searchGeneration++;

  const generation =
    searchGeneration;

  searchResults =
    [];

  currentSearch =
    -1;

  lastSearchQuery =
    "";

  clearSearchHighlights();

  if(!query){

    searchBusy =
      false;

    searchBox.classList.remove(
      "searching"
    );

    updateSearchCounter();

    return;
  }

  searchBusy =
    true;

  searchBox.classList.add(
    "searching"
  );

  searchResultsLabel.textContent =
    "Searching…";

  searchTimer =
    setTimeout(
      async () => {

        try{

          await rebuildSearchHighlights(
            query,
            generation
          );

        }catch(error){

          if(
            generation ===
              searchGeneration
          ){

            console.error(
              "PDF search failed:",
              error
            );

            searchResults =
              [];

            currentSearch =
              -1;

            lastSearchQuery =
              query;

            clearSearchHighlights();

            searchResultsLabel.textContent =
              "Search error";
          }

        }finally{

          if(
            generation ===
              searchGeneration
          ){

            searchBusy =
              false;

            searchBox.classList.remove(
              "searching"
            );

            updateSearchCounter();
          }
        }

      },

      150
    );
}

/* ============================================================
   SEARCH NAVIGATION
============================================================ */

async function showSearchResult(
  index
){

  if(
    searchBusy ||
    !searchResults.length
  ){

    return;
  }

  if(
    index < 0
  ){

    index =
      searchResults.length - 1;
  }

  if(
    index >=
      searchResults.length
  ){

    index = 0;
  }

  currentSearch =
    index;

  markCurrentSearch();

  updateSearchCounter();

  await scrollToSearchResult(
    searchResults[
      currentSearch
    ]
  );
}

/* ============================================================
   ZOOM
============================================================ */

async function rescaleAndRender(){

  renderGeneration++;

  currentScale =
    baseScale *
    zoomLevel;

  if(
    currentScale <= 0
  ){

    currentScale =
      1;
  }

  zoomBox.value =
    `${Math.round(
      zoomLevel * 100
    )}%`;

  const ratio =
    viewer.scrollHeight >
    viewer.clientHeight

      ? viewer.scrollTop /
        (
          viewer.scrollHeight -
          viewer.clientHeight
        )

      : 0;

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    layoutPage(
      view,
      currentScale
    );

    resetRenderedPage(
      view
    );
  }

  renderNearbyPages();

  requestAnimationFrame(
    async () => {

      if(
        viewer.scrollHeight >
        viewer.clientHeight
      ){

        viewer.scrollTop =
          ratio *
          (
            viewer.scrollHeight -
            viewer.clientHeight
          );
      }

      if(
        lastSearchQuery
      ){

        searchGeneration++;

        const generation =
          searchGeneration;

        await rebuildSearchHighlights(
          lastSearchQuery,
          generation
        );
      }

    }
  );
}

document.getElementById(
  "zoomIn"
).addEventListener(
  "click",
  async () => {

    const next =
      zoomLevels.find(
        level =>
          level >
          zoomLevel
      );

    if(
      next !== undefined
    ){

      zoomLevel =
        next;

      await rescaleAndRender();
    }
  }
);

document.getElementById(
  "zoomOut"
).addEventListener(
  "click",
  async () => {

    const previous =
      [...zoomLevels]
        .reverse()
        .find(
          level =>
            level <
            zoomLevel
        );

    if(
      previous !== undefined
    ){

      zoomLevel =
        previous;

      await rescaleAndRender();
    }
  }
);

/* ============================================================
   MANUAL ZOOM
============================================================ */

zoomBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !==
      "Enter"
    ){

      return;
    }

    let value =
      parseFloat(
        zoomBox.value.replace(
          "%",
          ""
        )
      );

    if(
      Number.isNaN(value)
    ){

      value =
        100;
    }

    value =
      Math.max(
        25,

        Math.min(
          300,
          value
        )
      );

    zoomLevel =
      value / 100;

    await rescaleAndRender();
  }
);

          pdfDoc?.numPages || 1,
          pageNumber
        )
      );

    const view =
      await ensurePageView(

/* ============================================================
   CURRENT PAGE
============================================================ */

viewer.addEventListener(
  "scroll",
  () => {

    if(
      !pageViews.length
    ){

      return;
    }

    const viewerRect =
      viewer.getBoundingClientRect();

    let currentPage =
      1;

    let bestDistance =
      Infinity;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      const rect =
        view.pageDiv.getBoundingClientRect();

      const distance =
        Math.abs(
          rect.top -
          viewerRect.top -
          8
        );

      if(
        distance <
        bestDistance
      ){

        bestDistance =
          distance;

        currentPage =
          view.pageNumber;
      }
    }

    pageInput.value =
      String(
        currentPage
      );

    renderNearbyPages();
  }
);

    getDocument({

      url:file,

      disableAutoFetch:false,

      disableStream:false

    });

  pdfDoc =
    await loadingTask.promise;

  document.getElementById(
    "pageCount"
  ).textContent =
    `of ${pdfDoc.numPages}`;

  const firstPage =
    await pdfDoc.getPage(
      1
    );

  baseScale =
    getFitWidthScale(
      firstPage
    );

  zoomLevel =
    1;

  currentScale =
    baseScale;

  const firstView =
    createPageShell(
      1,
      firstPage
    );

  layoutPage(
    firstView,
    currentScale
  );

  pageObserver.observe(
    firstView.pageDiv
  );

  syncViewerTop();

  await renderPage(
    firstView
  );

  loadingOverlay.style.display =
    "none";

  void (async () => {

    for(
      let pageNumber = 2;

      pageNumber <=
        pdfDoc.numPages;

      pageNumber++
    ){

      try{

        if(
          pageViews[
            pageNumber - 1
          ]
        ){

          continue;
        }

        const page =
          await pdfDoc.getPage(
            pageNumber
          );

        const view =
          createPageShell(
            pageNumber,
            page
          );

        layoutPage(
          view,
          currentScale
        );

        pageObserver.observe(
          view.pageDiv
        );

        const viewerRect =
          viewer.getBoundingClientRect();

        const pageRect =
          view.pageDiv.getBoundingClientRect();

        if(
          pageRect.top <=
            viewerRect.bottom + 1400
        ){

          void renderPage(
            view
          );
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

      }catch(error){

        console.warn(
          `Could not initialize page ${pageNumber}:`,
          error
        );
      }
    }

  })();

}catch(error){

  console.error(
    "PDF loading failed:",
    error
  );

  loadingOverlay.style.display =
    "none";

  viewer.innerHTML = `

    <div style="
      color:#fff;
      padding:40px;
      text-align:center;
      max-width:600px;
    ">

      <h2>
        Unable to load PDF
      </h2>

      <p>
        ${escapeHtml(
          error?.message ||
          "Unknown error."
        )}
      </p>

    </div>

  `;
}

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  () => {

    renderGeneration++;

    searchGeneration++;

    clearTimeout(
      searchTimer
    );

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      try{

        pageObserver.unobserve(
          view.pageDiv
        );

      }catch{}

      try{

        view.canvas.width =
          1;

        view.canvas.height =
          1;

      }catch{}
    }

    try{

      if(pdfDoc){

        pdfDoc.destroy();
      }

    }catch{}
  }
);

</script>

</body>
</html>
