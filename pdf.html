<!DOCTYPE html>
<html lang="en">
<head>

<title>PDF Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1d1d1d;
  --panel2:#222;
  --text:#eee;
  --muted:#aaa;
  --accent:#3a3a3a;

  --viewer-top:106px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;

  background:var(--bg);
  color:var(--text);

  font-family:Arial,sans-serif;

  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;

  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;

  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:48px;

  display:flex;
  align-items:center;

  gap:8px;

  padding:10px;

  background:#1b1b1b;

  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  display:flex;
  flex-direction:column;
  align-items:center;

  scroll-behavior:auto;

  overscroll-behavior:contain;
}

/* ============================================================
   PDF PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;

  pointer-events:none;

  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;
  align-items:center;

  white-space:nowrap;
}

button,
input{
  background:#2b2b2b;

  color:#fff;

  border:none;

  border-radius:8px;

  padding:8px 12px;

  font:inherit;
}

button:hover{
  background:#3a3a3a;
  cursor:pointer;
}

button:active{
  background:#444;
}

/* ============================================================
   CONTROL GROUPS
============================================================ */

.zoomControls,
.pageControls{
  display:flex;

  align-items:center;

  gap:6px;

  white-space:nowrap;

  flex-shrink:0;
}

.toolbarDivider{
  width:1px;
  height:28px;

  background:#3a3a3a;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:rgba(24,24,24,.92);

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;

  backdrop-filter:blur(6px);
}

#title{
  display:flex;

  justify-content:center;
  align-items:center;

  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.title-text{
  order:1;

  position:relative;

  display:inline-block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.title-badges{
  display:inline-flex;

  gap:8px;

  margin-left:12px;

  vertical-align:middle;
}

.title-badge{
  display:inline-block;

  padding:4px 10px;

  color:#fff;

  font-size:.72em;

  font-weight:bold;

  border-radius:999px;

  text-transform:uppercase;

  letter-spacing:.5px;

  flex-shrink:0;
}

.title-badge.new{
  order:2;

  background:#00b050;
}

.title-badge.featured{
  order:3;

  background:#2f7cff;
}

/* ============================================================
   MENU
============================================================ */

#menu{
  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{
  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   SEARCH POPUP
============================================================ */

#searchPopup{
  position:fixed;

  top:108px;
  left:110px;

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  background:#222;

  border:1px solid #444;

  border-radius:10px;

  box-shadow:0 8px 20px rgba(0,0,0,.45);

  z-index:6500;
}

#searchPopup.hidden{
  display:none;
}

#searchPopup input{
  width:220px;
}

#searchResults{
  color:#bbb;

  min-width:70px;

  text-align:center;
}

/* ============================================================
   PDF.JS TEXT LAYER
============================================================ */

.textLayer{
  color-scheme:only light;

  position:absolute;

  text-align:initial;

  inset:0;

  overflow:clip;

  opacity:1;

  line-height:1;

  letter-spacing:normal;

  word-spacing:normal;

  text-size-adjust:none;

  forced-color-adjust:none;

  transform-origin:0 0;

  caret-color:CanvasText;

  z-index:2;

  pointer-events:auto;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;

  -webkit-touch-callout:default;

  --min-font-size:1;

  --text-scale-factor:
    calc(
      var(--total-scale-factor) *
      var(--min-font-size)
    );

  --min-font-size-inv:
    calc(
      1 /
      var(--min-font-size)
    );

  --scale-factor:1;

  --user-unit:1;

  --total-scale-factor:1;
}

.textLayer span,
.textLayer br{
  color:transparent;

  position:absolute;

  white-space:pre;

  cursor:text;

  transform-origin:0% 0%;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;
}

.textLayer > :not(.markedContent),
.textLayer .markedContent span:not(.markedContent){

  z-index:1;

  --font-height:0;

  font-size:
    calc(
      var(--text-scale-factor) *
      var(--font-height)
    );

  --scale-x:1;

  --rotate:0deg;

  transform:
    rotate(var(--rotate))
    scaleX(var(--scale-x))
    scale(var(--min-font-size-inv));
}

.textLayer .markedContent{
  display:contents;
}

.textLayer span[role="img"]{
  user-select:none;

  -webkit-user-select:none;

  cursor:default;
}

.textLayer ::selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer ::-moz-selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer br::selection{
  background:transparent;
}

.textLayer .highlight{
  --highlight-bg-color:
    rgb(180 0 170 / 0.25);

  --highlight-selected-bg-color:
    rgb(0 100 0 / 0.25);

  margin:-1px;

  padding:1px;

  background-color:
    var(--highlight-bg-color);

  border-radius:4px;
}

.textLayer .highlight.selected{
  background-color:
    var(--highlight-selected-bg-color);

  scroll-margin-top:50px;
}

.textLayer .endOfContent{
  display:block;

  position:absolute;

  inset:100% 0 0;

  z-index:0;

  cursor:default;

  user-select:none;

  -webkit-user-select:none;
}

.textLayer.selecting .endOfContent{
  top:0;
}

/* ============================================================
   SEARCH HIGHLIGHT LAYER
   ------------------------------------------------------------
   This sits BELOW the selectable text layer.

   The PDF text remains transparent/selectable while these
   elements provide the visible yellow search highlighting.
============================================================ */

.searchHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:1;

  pointer-events:none;
}

.search-highlight{
  position:absolute;

  background:
    rgba(255,220,0,.48);

  border-radius:2px;

  pointer-events:none;

  mix-blend-mode:multiply;
}

/* Current search result */

.search-highlight.current{
  background:
    rgba(255,190,0,.72);

  outline:
    1px solid rgba(210,150,0,.45);
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;

  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

/* ============================================================
   READING MODE
============================================================ */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #searchPopup,
body.reading-mode #menu{
  display:none !important;
}

body.reading-mode #layout{
  top:0;

  height:100%;
}

body.reading-mode #viewer{
  height:100%;

  padding-top:20px;

  padding-bottom:20px;
}

body.reading-mode #loadingOverlay{
  inset:0;
}

/* ============================================================
   FLOATING READING MODE BUTTON
============================================================ */

#readingModeFloat{
  position:fixed;

  right:18px;

  bottom:76px;

  width:46px;
  height:46px;

  padding:0;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#2b2b2b;

  color:#fff;

  border:1px solid #444;

  box-shadow:
    0 5px 18px rgba(0,0,0,.55);

  z-index:9000;

  font-size:12px;

  font-weight:bold;

  letter-spacing:.2px;

  line-height:1;

  user-select:none;

  -webkit-user-select:none;

  touch-action:manipulation;
}

#readingModeFloat:hover{
  background:#3a3a3a;
}

#readingModeFloat:active{
  transform:scale(.94);
}

body.reading-mode #readingModeFloat{
  background:#3a3a3a;

  border-color:#666;

  font-size:19px;
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #searchPopup{
    left:10px;

    right:10px;

    top:108px;

    width:auto;

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;
  }

  #searchPopup input{
    flex:1 1 100%;

    width:100%;

    min-width:0;
  }

  #prevResult,
  #nextResult{
    flex:0 0 auto;
  }

  #searchResults{
    flex:1;

    text-align:center;

    min-width:0;
  }

  .title-badges{
    display:flex;

    justify-content:center;

    gap:8px;

    margin:0 0 8px 0;
  }

  #title{
    flex-direction:column;

    align-items:center;

    gap:6px;
  }

  .title-text{
    order:2;

    width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .title-badge.new,
  .title-badge.featured{
    order:1;
  }

  #readingModeFloat{
    right:14px;

    bottom:76px;

    width:44px;
    height:44px;

    font-size:11px;
  }

  body.reading-mode #readingModeFloat{
    bottom:14px;
  }
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

</style>
</head>

<body>

<header>

  <a
    class="btn"
    id="backBtn"

  >
    ◀ Back
  </a>

  <div style="flex:1"></div>

  </button>

</header>

<div id="toolbar">

  <button id="searchButton">

  </button>

  <div class="zoomControls">

</div>

<!-- =========================================================
     FLOATING READING MODE CONTROL
========================================================= -->

<button

>

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc =
  "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params =
  new URLSearchParams(
    location.search
  );

const file =
  decodeURIComponent(
    params.get("file") || ""
  );

const title =
  decodeURIComponent(
    params.get("paper") || "PDF"
  );

const returnPage =
  decodeURIComponent(
    params.get("return") ||
    "index.html"
  );

/* ============================================================
   ELEMENTS
============================================================ */

const header =
  document.querySelector("header");

const toolbar =
  document.getElementById(
    "toolbar"
  );

const viewer =
  document.getElementById(
    "viewer"
  );

const layout =
  document.getElementById(
    "layout"
  );

const loadingOverlay =
  document.getElementById(
    "loadingOverlay"
  );

const pageInput =
  document.getElementById(
    "pageNumber"
  );

const zoomBox =
  document.getElementById(
    "zoomPercent"
  );

const searchPopup =
  document.getElementById(
    "searchPopup"
  );

const searchBox =
  document.getElementById(
    "searchBox"
  );

const menu =
  document.getElementById(
    "menu"
  );

const menuButton =
  document.getElementById(
    "menuBtn"
  );

const readingModeFloat =
  document.getElementById(
    "readingModeFloat"
  );

/* ============================================================
   CHROME / VIEWER HEIGHT
============================================================ */

function syncViewerTop(){

  if(
    document.body.classList.contains(
      "reading-mode"
    )
  ){

    return;
  }

  const headerHeight =
    header.getBoundingClientRect()
      .height;

  const toolbarHeight =
    toolbar.getBoundingClientRect()
      .height;

  const total =
    Math.ceil(
      headerHeight +
      toolbarHeight
    );

  document.documentElement.style.setProperty(
    "--viewer-top",
    `${total}px`
  );

  layout.style.top =
    `${total}px`;

  loadingOverlay.style.top =
    `${total}px`;
}

function scheduleChromeSync(){

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        () => {

          syncViewerTop();

        }
      );

    }
  );
}

/* ============================================================
   PERFORMANCE / SAFETY
============================================================ */

const MAX_ZOOM =
  3;

const MAX_CANVAS_PIXELS =
  8000000;

const MAX_CANVAS_DIMENSION =
  16384;

const RENDER_MARGIN =
  "1400px";

/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{

  descriptions =
    await fetch(
      "descriptions.json"
    ).then(
      response =>
        response.json()
    );

}catch(error){

  console.warn(
    "Could not load descriptions.json:",
    error
  );
}

let newestEntry = null;

if(
  Object.keys(
    descriptions
  ).length
){

  newestEntry =
    Object.entries(
      descriptions
    ).sort(
      (a,b) =>
        new Date(
          b[1].updated || 0
        ) -
        new Date(
          a[1].updated || 0
        )
    )[0];
}

const newestKey =
  newestEntry
    ? newestEntry[0]
    : null;

const newestDate =
  newestEntry
    ? new Date(
        newestEntry[1].updated
      )
    : null;

const today =
  new Date();

const oneYearAgo =
  new Date(today);

oneYearAgo.setFullYear(
  today.getFullYear() - 1
);

const showNewestBadge =
  Boolean(
    newestDate &&
    newestDate >= oneYearAgo
  );

const paper =
  Object.values(
    descriptions
  ).find(
    item =>
      item.url === file
  );

const paperKey =
  Object.keys(
    descriptions
  ).find(
    key =>
      descriptions[key].url === file
  );

const isNewest =
  Boolean(
    showNewestBadge &&
    paperKey === newestKey
  );

document.getElementById(
  "title"
).innerHTML = `

  <div class="title-text">

    ${escapeHtml(title)}

    <span class="title-badges">

      ${
        isNewest
          ? `
            <span class="title-badge new">
              NEW
            </span>
          `
          : ""
      }

      ${
        paper?.featured
          ? `
            <span class="title-badge featured">
              FEATURED
            </span>
          `
          : ""
      }

    </span>

  </div>

`;

/* ============================================================
   VIEWPORT SIZING
============================================================ */

let baseScale = 1;

let zoomLevel = 1;

let currentScale = 1;

function getViewerInnerWidth(){

  const styles =
    getComputedStyle(
      viewer
    );

  return Math.max(
    1,

    viewer.clientWidth -
    parseFloat(
      styles.paddingLeft
    ) -
    parseFloat(
      styles.paddingRight
    )
  );
}

function getViewerInnerHeight(){

  const styles =
    getComputedStyle(
      viewer
    );

  return Math.max(
    1,

    viewer.clientHeight -
    parseFloat(
      styles.paddingTop
    ) -
    parseFloat(
      styles.paddingBottom
    )
  );
}

function getFitWidthScale(page){

  const viewport =
    page.getViewport({
      scale:1
    });

  return (
    getViewerInnerWidth() /
    viewport.width
  );
}

function getFitPageScale(page){

  const viewport =
    page.getViewport({
      scale:1
    });

  const widthScale =
    getViewerInnerWidth() /
    viewport.width;

  const heightScale =
    getViewerInnerHeight() /
    viewport.height;

  return Math.min(
    widthScale,
    heightScale
  );
}

const zoomLevels = [

  0.25,
  0.5,
  0.75,

  1,
  1.25,
  1.5,
  1.75,

  2,
  2.25,
  2.5,
  2.75,

  3

];

/* ============================================================
   PDF STATE
============================================================ */

let pdfDoc = null;

const pageViews = [];

let searchResults = [];

let currentSearch = -1;

let lastSearchQuery = "";

let renderGeneration = 0;

/* ============================================================
   BACK BUTTON
============================================================ */

const backButton =
  document.getElementById(
    "backBtn"
  );

backButton.href =
  returnPage ||
  "index.html";

backButton.addEventListener(
  "click",
  event => {

    event.preventDefault();

    sessionStorage.setItem(
      "restoreSearch",
      "yes"
    );

    sessionStorage.setItem(
      "returnFromPage",
      "yes"
    );

    window.location.assign(
      returnPage ||
      "index.html"
    );
  }
);

/* ============================================================
   SAFE CANVAS SCALE
============================================================ */

function getSafeOutputScale(
  viewport
){

  const dpr =
    Math.max(
      1,
      window.devicePixelRatio || 1
    );

  let outputScale =
    dpr;

  const pagePixels =
    viewport.width *
    viewport.height;

  if(
    pagePixels > 0
  ){

    const pixelLimitScale =
      Math.sqrt(
        MAX_CANVAS_PIXELS /
        pagePixels
      );

    outputScale =
      Math.min(
        outputScale,
        pixelLimitScale
      );
  }

  if(
    viewport.width > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.width
      );
  }

  if(
    viewport.height > 0
  ){

    outputScale =
      Math.min(
        outputScale,

        MAX_CANVAS_DIMENSION /
        viewport.height
      );
  }

  return Math.max(
    0.35,

    Math.min(
      outputScale,
      dpr
    )
  );
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(
  view,
  scale
){

  const viewport =
    view.page.getViewport({
      scale
    });

  view.viewport =
    viewport;

  view.pageDiv.style.width =
    `${viewport.width}px`;

  view.pageDiv.style.height =
    `${viewport.height}px`;

  view.canvas.style.width =
    `${viewport.width}px`;

  view.canvas.style.height =
    `${viewport.height}px`;

  view.textLayerDiv.style.width =
    `${viewport.width}px`;

  view.textLayerDiv.style.height =
    `${viewport.height}px`;

  view.searchHighlightLayer.style.width =
    `${viewport.width}px`;

  view.searchHighlightLayer.style.height =
    `${viewport.height}px`;

  view.linkLayerDiv.style.width =
    `${viewport.width}px`;

  view.linkLayerDiv.style.height =
    `${viewport.height}px`;

  const userUnit =
    view.page.userUnit || 1;

  view.textLayerDiv.style.setProperty(
    "--scale-factor",
    String(
      viewport.scale
    )
  );

  view.textLayerDiv.style.setProperty(
    "--user-unit",
    String(
      userUnit
    )
  );

  view.textLayerDiv.style.setProperty(
    "--total-scale-factor",
    String(
      viewport.scale *
      userUnit
    )
  );

  return viewport;
}

/* ============================================================
   RESET PAGE
============================================================ */

function resetRenderedPage(
  view
){

  view.renderedScale =
    null;

  try{

    view.canvas.width =
      1;

    view.canvas.height =
      1;

  }catch{}

  view.textLayerDiv.replaceChildren();

  view.searchHighlightLayer.replaceChildren();

  view.linkLayerDiv.replaceChildren();

  view.textLayer =
    null;

  view.textLayerEnd =
    null;
}

/* ============================================================
   CANVAS
============================================================ */

async function paintCanvas(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  const viewport =
    view.viewport;

  const outputScale =
    getSafeOutputScale(
      viewport
    );

  const pixelWidth =
    Math.max(
      1,

      Math.floor(
        viewport.width *
        outputScale
      )
    );

  const pixelHeight =
    Math.max(
      1,

      Math.floor(
        viewport.height *
        outputScale
      )
    );

  if(
    pixelWidth >
      MAX_CANVAS_DIMENSION ||
    pixelHeight >
      MAX_CANVAS_DIMENSION
  ){

    throw new Error(
      "Safe canvas limit exceeded."
    );
  }

  view.canvas.width =
    pixelWidth;

  view.canvas.height =
    pixelHeight;

  view.canvas.style.width =
    `${viewport.width}px`;

  view.canvas.style.height =
    `${viewport.height}px`;

  const context =
    view.canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );

  if(!context){

    throw new Error(
      "Could not create canvas context."
    );
  }

  context.setTransform(
    outputScale,
    0,
    0,
    outputScale,
    0,
    0
  );

  await view.page.render({

    canvasContext:
      context,

    viewport:
      view.viewport

  }).promise;

  if(
    generation !==
    renderGeneration
  ){

    return;
  }
}

/* ============================================================
   TEXT CONTENT
============================================================ */

async function ensureTextContent(
  view
){

  if(
    view.textContent
  ){

    return view.textContent;
  }

  view.textContent =
    await view.page.getTextContent();

  return view.textContent;
}

/* ============================================================
   SEARCH HIGHLIGHT HELPERS
============================================================ */

/*
   Find every occurrence of the search term in the rendered
   text layer.

   This works across multiple text spans, so a search phrase
   does not have to exist inside one individual PDF.js span.
*/

function getTextNodesForHighlight(
  container
){

  const nodes = [];

  const walker =
    document.createTreeWalker(
      container,

      NodeFilter.SHOW_TEXT,

      {
        acceptNode(node){

          const parent =
            node.parentElement;

          if(!parent){
            return NodeFilter.FILTER_REJECT;
          }

          if(
            parent.closest(
              ".endOfContent"
            )
          ){

            return NodeFilter.FILTER_REJECT;
          }

          if(
            parent.closest(
              ".search-highlight"
            )
          ){

            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      }
    );

  let node;

  while(
    node =
      walker.nextNode()
  ){

    nodes.push(node);
  }

  return nodes;
}

function applySearchHighlights(
  view
){

  view.searchHighlightLayer.replaceChildren();

  const query =
    lastSearchQuery.trim();

  if(
    !query ||
    !view.textLayerDiv ||
    !view.viewport
  ){

    return;
  }

  const textNodes =
    getTextNodesForHighlight(
      view.textLayerDiv
    );

  if(
    !textNodes.length
  ){

    return;
  }

  /*
     Build a single searchable string while remembering where
     every character came from in the DOM.
  */

  const mappings = [];

  let combinedText = "";

  for(
    const node
    of textNodes
  ){

    const text =
      node.nodeValue || "";

    if(!text){
      continue;
    }

    const start =
      combinedText.length;

    combinedText += text;

    mappings.push({

      node,

      start,

      end:
        combinedText.length

    });
  }

  const lowerText =
    combinedText.toLowerCase();

  const lowerQuery =
    query.toLowerCase();

  if(
    !lowerQuery ||
    !lowerText
  ){

    return;
  }

  let searchPosition = 0;

  while(true){

    const found =
      lowerText.indexOf(
        lowerQuery,
        searchPosition
      );

    if(
      found === -1
    ){

      break;
    }

    const matchStart =
      found;

    const matchEnd =
      found +
      lowerQuery.length;

    const startMapping =
      mappings.find(
        mapping =>
          matchStart >= mapping.start &&
          matchStart < mapping.end
      );

    const endMapping =
      mappings.find(
        mapping =>
          matchEnd > mapping.start &&
          matchEnd <= mapping.end
      );

    /*
       Normally the match will span one or more text nodes.
    */

    if(
      startMapping &&
      endMapping
    ){

      const range =
        document.createRange();

      try{

        range.setStart(
          startMapping.node,

          matchStart -
          startMapping.start
        );

        range.setEnd(
          endMapping.node,

          matchEnd -
          endMapping.start
        );

        const rects =
          Array.from(
            range.getClientRects()
          );

        const layerRect =
          view.searchHighlightLayer
            .getBoundingClientRect();

        for(
          const rect
          of rects
        ){

          if(
            rect.width <= 0 ||
            rect.height <= 0
          ){

            continue;
          }

          const highlight =
            document.createElement(
              "div"
            );

          highlight.className =
            "search-highlight";

          highlight.style.left =
            `${rect.left - layerRect.left}px`;

          highlight.style.top =
            `${rect.top - layerRect.top}px`;

          highlight.style.width =
            `${rect.width}px`;

          highlight.style.height =
            `${rect.height}px`;

          view.searchHighlightLayer.appendChild(
            highlight
          );
        }

      }catch(error){

        console.warn(
          "Could not create search highlight:",
          error
        );
      }
    }

    searchPosition =
      Math.max(
        found +
        lowerQuery.length,

        searchPosition + 1
      );
  }
}

/*
   Make the current result visually stronger.

   The page containing the current result gets the darker yellow
   highlight. Other matching pages remain normal yellow.
*/

function markCurrentSearchPage(){

  for(
    const view
    of pageViews
  ){

    if(
      !view?.searchHighlightLayer
    ){

      continue;
    }

    const isCurrent =
      searchResults[
        currentSearch
      ] ===
      view.pageNumber - 1;

    const highlights =
      view.searchHighlightLayer
        .querySelectorAll(
          ".search-highlight"
        );

    highlights.forEach(
      highlight => {

        highlight.classList.toggle(
          "current",
          isCurrent
        );

      }
    );
  }
}

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    const textContent =
      await ensureTextContent(
        view
      );

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    view.textLayerDiv.replaceChildren();

    const userUnit =
      view.page.userUnit || 1;

    view.textLayerDiv.style.setProperty(
      "--scale-factor",
      String(
        view.viewport.scale
      )
    );

    view.textLayerDiv.style.setProperty(
      "--user-unit",
      String(
        userUnit
      )
    );

    view.textLayerDiv.style.setProperty(
      "--total-scale-factor",
      String(
        view.viewport.scale *
        userUnit
      )
    );

    const textLayer =
      new TextLayer({

        textContentSource:
          textContent,

        container:
          view.textLayerDiv,

        viewport:
          view.viewport

      });

    await textLayer.render();

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    const endOfContent =
      document.createElement(
        "div"
      );

    endOfContent.className =
      "endOfContent";

    view.textLayerDiv.append(
      endOfContent
    );

    view.textLayerEnd =
      endOfContent;

    view.textLayerDiv.addEventListener(
      "pointerdown",
      () => {

        view.textLayerDiv.classList.add(
          "selecting"
        );

      }
    );

    view.textLayer =
      textLayer;

    /*
       If a search is currently active, immediately draw its
       highlights after the text layer finishes rendering.
    */

    if(
      lastSearchQuery
    ){

      requestAnimationFrame(
        () => {

          if(
            generation !==
            renderGeneration
          ){

            return;
          }

          applySearchHighlights(
            view
          );

          markCurrentSearchPage();

        }
      );
    }

  }catch(error){

    console.warn(
      `Text layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

/* ============================================================
   LINKS
============================================================ */

async function paintLinks(
  view,
  generation
){

  if(
    generation !==
    renderGeneration
  ){

    return;
  }

  try{

    if(
      !view.annotations
    ){

      view.annotations =
        await view.page.getAnnotations({
          intent:"display"
        });
    }

    if(
      generation !==
      renderGeneration
    ){

      return;
    }

    renderLinkLayer(
      view
    );

  }catch(error){

    console.warn(
      `Link layer failed on page ${view.pageNumber}:`,
      error
    );
  }
}

function renderLinkLayer(
  view
){

  const layer =
    view.linkLayerDiv;

  layer.replaceChildren();

  if(
    !Array.isArray(
      view.annotations
    )
  ){

    return;
  }

  const viewport =
    view.viewport;

  for(
    const annotation
    of view.annotations
  ){

    if(
      annotation.subtype !==
      "Link"
    ){

      continue;
    }

    if(
      !annotation.rect ||
      annotation.rect.length !== 4
    ){

      continue;
    }

    const rect =
      viewport.convertToViewportRectangle(
        annotation.rect
      );

    const left =
      Math.min(
        rect[0],
        rect[2]
      );

    const top =
      Math.min(
        rect[1],
        rect[3]
      );

    const width =
      Math.abs(
        rect[2] -
        rect[0]
      );

    const height =
      Math.abs(
        rect[3] -
        rect[1]
      );

    if(
      width <= 0 ||
      height <= 0
    ){

      continue;
    }

    const link =
      document.createElement(
        "a"
      );

    link.className =
      "pdf-link";

    link.style.left =
      `${left}px`;

    link.style.top =
      `${top}px`;

    link.style.width =
      `${width}px`;

    link.style.height =
      `${height}px`;

    if(
      annotation.url ||
      annotation.unsafeUrl
    ){

      link.href =
        annotation.url ||
        annotation.unsafeUrl;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

    }else if(
      annotation.dest
    ){

      link.href =
        "#";

      link.addEventListener(
        "click",
        async event => {

          event.preventDefault();

          event.stopPropagation();

          await openInternalDestination(
            annotation.dest
          );
        }
      );

    }else{

      continue;
    }

    layer.appendChild(
      link
    );
  }
}

/* ============================================================
   PAGE SHELL
============================================================ */

function createPageShell(
  pageNumber,
  page
){

  const pageDiv =
    document.createElement(
      "div"
    );

  pageDiv.className =
    "page";

  pageDiv.dataset.pageNumber =
    String(pageNumber);

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.className =
    "pageCanvas";

  /*
     Search highlights must be between the canvas and the
     selectable text layer.
  */

  const searchHighlightLayer =
    document.createElement(
      "div"
    );

  searchHighlightLayer.className =
    "searchHighlightLayer";

  const textLayerDiv =
    document.createElement(
      "div"
    );

  textLayerDiv.className =
    "textLayer";

  const linkLayerDiv =
    document.createElement(
      "div"
    );

  linkLayerDiv.className =
    "linkLayer";

  pageDiv.appendChild(
    canvas
  );

  pageDiv.appendChild(
    searchHighlightLayer
  );

  pageDiv.appendChild(
    textLayerDiv
  );

  pageDiv.appendChild(
    linkLayerDiv
  );

  viewer.appendChild(
    pageDiv
  );

  const view = {

    pageNumber,

    page,

    pageDiv,

    canvas,

    searchHighlightLayer,

    textLayerDiv,

    linkLayerDiv,

    viewport:null,

    textContent:null,

    annotations:null,

    textLayer:null,

    textLayerEnd:null,

    renderedScale:null,

    renderingPromise:null

  };

  pageViews[
    pageNumber - 1
  ] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(
  view
){

  if(!view){

    return;
  }

  const generation =
    renderGeneration;

  if(
    view.renderedScale ===
    currentScale
  ){

    /*
       The page is already rendered. Make sure an active search
       highlight still exists.
    */

    if(
      lastSearchQuery &&
      view.textLayerDiv.children.length
    ){

      requestAnimationFrame(
        () => {

          applySearchHighlights(
            view
          );

          markCurrentSearchPage();

        }
      );
    }

    return;
  }

  if(
    view.renderingPromise
  ){

    return view.renderingPromise;
  }

  view.renderingPromise =
    (async () => {

      try{

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        layoutPage(
          view,
          currentScale
        );

        await paintCanvas(
          view,
          generation
        );

        if(
          generation !==
          renderGeneration
        ){

          return;
        }

        view.renderedScale =
          currentScale;

        await Promise.all([

          paintText(
            view,
            generation
          ),

          paintLinks(
            view,
            generation
          )

        ]);

      }catch(error){

        console.warn(
          `Page ${view.pageNumber} render failed:`,
          error
        );

      }finally{

        view.renderingPromise =
          null;
      }

    })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver =
  new IntersectionObserver(

    entries => {

      for(
        const entry
        of entries
      ){

        if(
          !entry.isIntersecting
        ){

          continue;
        }

        const view =
          pageViews.find(
            candidate =>
              candidate &&
              candidate.pageDiv ===
              entry.target
          );

        if(view){

          void renderPage(
            view
          );
        }
      }

    },

    {
      root:viewer,

      rootMargin:
        RENDER_MARGIN,

      threshold:0
    }

  );

/* ============================================================
   RENDER NEARBY PAGES
============================================================ */

function renderNearbyPages(){

  const viewerRect =
    viewer.getBoundingClientRect();

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    const rect =
      view.pageDiv.getBoundingClientRect();

    const nearViewport =
      rect.bottom >=
        viewerRect.top - 1400 &&

      rect.top <=
        viewerRect.bottom + 1400;

    if(
      nearViewport
    ){

      void renderPage(
        view
      );
    }
  }
}

/* ============================================================
   ENSURE PAGE
============================================================ */

async function ensurePageView(
  pageNumber
){

  if(
    !pdfDoc ||
    pageNumber < 1 ||
    pageNumber >
      pdfDoc.numPages
  ){

    return null;
  }

  const existing =
    pageViews[
      pageNumber - 1
    ];

  if(existing){

    return existing;
  }

  try{

    const page =
      await pdfDoc.getPage(
        pageNumber
      );

    const view =
      createPageShell(
        pageNumber,
        page
      );

    layoutPage(
      view,
      currentScale
    );

    pageObserver.observe(
      view.pageDiv
    );

    return view;

  }catch(error){

    console.warn(
      `Could not load page ${pageNumber}:`,
      error
    );

    return null;
  }
}

/* ============================================================
   INTERNAL DESTINATIONS
============================================================ */

async function resolveDestination(
  destination
){

  if(!pdfDoc){

    return null;
  }

  try{

    let dest =
      destination;

    if(
      typeof dest ===
      "string"
    ){

      dest =
        await pdfDoc.getDestination(
          dest
        );
    }

    if(
      !Array.isArray(dest) ||
      !dest.length
    ){

      return null;
    }

    const pageRef =
      dest[0];

    let pageIndex =
      -1;

    try{

      pageIndex =
        await pdfDoc.getPageIndex(
          pageRef
        );

    }catch{

      if(
        typeof pageRef ===
        "number"
      ){

        pageIndex =
          pageRef;
      }
    }

    if(
      pageIndex < 0 ||
      pageIndex >=
        pdfDoc.numPages
    ){

      return null;
    }

    return pageIndex;

  }catch(error){

    console.warn(
      "Could not resolve PDF destination:",
      error
    );

    return null;
  }
}

async function scrollToView(
  view
){

  if(!view){

    return;
  }

  await renderPage(
    view
  );

  const viewerRect =
    viewer.getBoundingClientRect();

  const pageRect =
    view.pageDiv.getBoundingClientRect();

  const targetOffset =
    pageRect.top -
    viewerRect.top +
    viewer.scrollTop;

  viewer.scrollTo({

    top:Math.max(
      0,
      targetOffset - 8
    ),

    behavior:"smooth"

  });

  pageInput.value =
    String(
      view.pageNumber
    );
}

async function openInternalDestination(
  destination
){

  const pageIndex =
    await resolveDestination(
      destination
    );

  if(
    pageIndex === null
  ){

    return;
  }

  const view =
    await ensurePageView(
      pageIndex + 1
    );

  if(!view){

    return;
  }

  await scrollToView(
    view
  );
}

/* ============================================================
   READING MODE
============================================================ */

let readingMode =
  false;

function updateReadingModeButton(){

  if(
    readingMode
  ){

    readingModeFloat.textContent =
      "×";

    readingModeFloat.setAttribute(
      "aria-label",
      "Exit Reading Mode"
    );

    readingModeFloat.setAttribute(
      "title",
      "Exit Reading Mode"
    );

  }else{

    readingModeFloat.textContent =
      "RM";

    readingModeFloat.setAttribute(
      "aria-label",
      "Enter Reading Mode"
    );

    readingModeFloat.setAttribute(
      "title",
      "Reading Mode"
    );
  }
}

function setReadingMode(
  enabled
){

  readingMode =
    Boolean(
      enabled
    );

  updateReadingModeButton();

  if(
    readingMode
  ){

    document.body.classList.add(
      "reading-mode"
    );

    menu.style.display =
      "none";

    searchPopup.classList.add(
      "hidden"
    );

  }else{

    document.body.classList.remove(
      "reading-mode"
    );
  }

  requestAnimationFrame(
    () => {

      renderGeneration++;

      for(
        const view
        of pageViews
      ){

        if(!view){

          continue;
        }

        layoutPage(
          view,
          currentScale
        );

        resetRenderedPage(
          view
        );
      }

      renderNearbyPages();

    }
  );
}

readingModeFloat.addEventListener(
  "click",
  event => {

    event.preventDefault();

    event.stopPropagation();

    setReadingMode(
      !readingMode
    );

  }
);

/* ============================================================
   RESCALE
============================================================ */

async function rescaleAndRender(){

  renderGeneration++;

  currentScale =
    baseScale *
    zoomLevel;

  if(
    currentScale <= 0
  ){

    currentScale =
      1;
  }

  zoomBox.value =
    `${Math.round(
      zoomLevel * 100
    )}%`;

  const scrollRatio =
    viewer.scrollHeight >
    viewer.clientHeight

      ? viewer.scrollTop /
        (
          viewer.scrollHeight -
          viewer.clientHeight
        )

      : 0;

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    layoutPage(
      view,
      currentScale
    );

    resetRenderedPage(
      view
    );
  }

  renderNearbyPages();

  requestAnimationFrame(
    () => {

      if(
        viewer.scrollHeight >
        viewer.clientHeight
      ){

        viewer.scrollTop =
          scrollRatio *
          (
            viewer.scrollHeight -
            viewer.clientHeight
          );
      }

    }
  );
}

/* ============================================================
   LOAD PDF
============================================================ */

try{

  if(!file){

    throw new Error(
      "No PDF file was supplied."
    );
  }

  syncViewerTop();

  const loadingTask =
    getDocument({

      url:file,

      disableAutoFetch:false,

      disableStream:false

    });

  pdfDoc =
    await loadingTask.promise;

  document.getElementById(
    "pageCount"
  ).textContent =
    `of ${pdfDoc.numPages}`;

  /*
     PAGE 1 FIRST
  */

  const firstPage =
    await pdfDoc.getPage(
      1
    );

  baseScale =
    getFitWidthScale(
      firstPage
    );

  zoomLevel =
    1;

  currentScale =
    baseScale;

  zoomBox.value =
    "100%";

  const firstView =
    createPageShell(
      1,
      firstPage
    );

  layoutPage(
    firstView,
    currentScale
  );

  pageObserver.observe(
    firstView.pageDiv
  );

  syncViewerTop();

  await renderPage(
    firstView
  );

  loadingOverlay.style.display =
    "none";

  /*
     Start remaining pages in background.
  */

  void (async () => {

    for(
      let pageNumber = 2;

      pageNumber <=
        pdfDoc.numPages;

      pageNumber++
    ){

      if(!pdfDoc){

        return;
      }

      try{

        if(
          pageViews[
            pageNumber - 1
          ]
        ){

          continue;
        }

        const page =
          await pdfDoc.getPage(
            pageNumber
          );

        if(!pdfDoc){

          return;
        }

        const view =
          createPageShell(
            pageNumber,
            page
          );

        layoutPage(
          view,
          currentScale
        );

        pageObserver.observe(
          view.pageDiv
        );

        const viewerRect =
          viewer.getBoundingClientRect();

        const pageRect =
          view.pageDiv.getBoundingClientRect();

        if(
          pageRect.top <=
            viewerRect.bottom + 1400
        ){

          void renderPage(
            view
          );
        }

        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              0
            )
        );

      }catch(error){

        console.warn(
          `Could not initialize page ${pageNumber}:`,
          error
        );
      }

    }

  })();

}catch(error){

  console.error(
    "PDF loading failed:",
    error
  );

  loadingOverlay.style.display =
    "none";

  viewer.innerHTML = `

    <div style="
      color:#fff;
      padding:40px;
      text-align:center;
      max-width:600px;
    ">

      <h2>
        Unable to load PDF
      </h2>

      <p>
        ${escapeHtml(
          error?.message ||
          "Unknown error."
        )}
      </p>

    </div>

  `;
}

).onclick =

/* ============================================================
   SHARE
============================================================ */

document.getElementById(
  "copyLinkBtn"
).addEventListener(
  "click",
  async () => {

    const url =
      window.location.href;

    menu.style.display =
      "none";

    if(
      navigator.share
    ){

      try{

        await navigator.share({

          title:
            document.title,

          text:
            document.getElementById(
              "title"
            ).textContent,

        });

      }catch{

        /* User cancelled */
      }

      return;
    }

    try{

      await navigator.clipboard.writeText(

      alert(

    }catch{

/* ============================================================
   ZOOM IN
============================================================ */

document.getElementById(
  "zoomIn"
).onclick =
  async () => {

    const next =
      zoomLevels.find(
        level =>
          level >
          zoomLevel
      );

    if(
      next === undefined
    ){

      return;
    }

    zoomLevel =
      Math.min(
        next,
        MAX_ZOOM
      );

    await rescaleAndRender();
  };

/* ============================================================
   ZOOM OUT
============================================================ */

document.getElementById(
  "zoomOut"
).onclick =
  async () => {

    const previous =
      [...zoomLevels]
        .reverse()
        .find(
          level =>
            level <
            zoomLevel
        );

    if(
      previous === undefined
    ){

      return;
    }

    zoomLevel =
      previous;

    await rescaleAndRender();
  };

/* ============================================================
   FIT WIDTH
============================================================ */

document.getElementById(
  "fitWidth"
).onclick =
  async () => {

    const firstView =
      pageViews.find(
        Boolean
      );

    if(!firstView){

      return;
    }

    baseScale =
      getFitWidthScale(
        firstView.page
      );

    zoomLevel =
      1;

    await rescaleAndRender();
  };

/* ============================================================
   FIT PAGE
============================================================ */

document.getElementById(
  "fitPage"
).onclick =
  async () => {

    const firstView =
      pageViews.find(
        Boolean
      );

    if(!firstView){

      return;
    }

    baseScale =
      getFitPageScale(
        firstView.page
      );

    zoomLevel =
      1;

    await rescaleAndRender();
  };

/* ============================================================
   MANUAL ZOOM
============================================================ */

zoomBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !==
      "Enter"
    ){

      return;
    }

    let value =
      parseFloat(
        zoomBox.value.replace(
          "%",
          ""
        )
      );

    if(
      Number.isNaN(
        value
      )
    ){

      value =
        100;
    }

    value =
      Math.max(
        25,

        Math.min(
          300,
          value
        )
      );

    zoomLevel =
      value / 100;

    await rescaleAndRender();
  }
);

/* ============================================================
   PAGE NAVIGATION
============================================================ */

pageInput.addEventListener(
  "keydown",
  async event => {

    if(
      event.key !==
      "Enter"
    ){

      return;
    }

    let pageNumber =
      parseInt(
        pageInput.value,
        10
      );

    if(
      Number.isNaN(
        pageNumber
      )
    ){

      pageNumber =
        1;
    }

    pageNumber =
      Math.max(
        1,

        Math.min(
          pdfDoc?.numPages || 1,
          pageNumber
        )
      );

    const view =
      await ensurePageView(
        pageNumber
      );

    if(!view){

      return;
    }

    pageInput.value =
      String(
        pageNumber
      );

    await scrollToView(
      view
    );
  }
);

/* ============================================================
   CURRENT PAGE
============================================================ */

viewer.addEventListener(
  "scroll",
  () => {

    if(
      !pageViews.length
    ){

      return;
    }

    const viewerRect =
      viewer.getBoundingClientRect();

    let currentPage =
      1;

    let bestDistance =
      Infinity;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      const rect =
        view.pageDiv
          .getBoundingClientRect();

      const distance =
        Math.abs(
          rect.top -
          viewerRect.top -
          8
        );

      if(
        distance <
        bestDistance
      ){

        bestDistance =
          distance;

        currentPage =
          view.pageNumber;
      }
    }

    pageInput.value =
      String(
        currentPage
      );

    renderNearbyPages();
  }
);

/* ============================================================
   SEARCH
============================================================ */

async function searchPDF(
  query
){

  /*
     Remove all old visible highlights immediately.
  */

  for(
    const view
    of pageViews
  ){

    if(
      view?.searchHighlightLayer
    ){

      view.searchHighlightLayer
        .replaceChildren();

    }
  }

  searchResults = [];

  currentSearch =
    -1;

  query =
    query
      .trim()
      .toLowerCase();

  if(
    query === ""
  ){

    lastSearchQuery = "";

    document.getElementById(
      "searchResults"
    ).textContent =
      "0 of 0";

    return;
  }

  lastSearchQuery =
    query;

  /*
     Ensure page objects exist.
  */

  for(
    let pageNumber = 1;

    pageNumber <=
      (pdfDoc?.numPages || 0);

    pageNumber++
  ){

    await ensurePageView(
      pageNumber
    );

    if(
      pageNumber % 3 === 0
    ){

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            0
          )
      );
    }
  }

  /*
     Extract text.
  */

  for(
    const view
    of pageViews
  ){

    if(!view){

      continue;
    }

    try{

      await ensureTextContent(
        view
      );

    }catch(error){

      console.warn(
        `Could not read text from page ${view.pageNumber}:`,
        error
      );

      continue;
    }

    const pageText =
      view.textContent.items

        .map(
          item =>
            item.str
        )

        .join(" ")

        .toLowerCase();

    if(
      pageText.includes(
        query
      )
    ){

      searchResults.push(
        view.pageNumber - 1
      );
    }
  }

  if(
    searchResults.length === 0
  ){

    lastSearchQuery = "";

    document.getElementById(
      "searchResults"
    ).textContent =
      "0 of 0";

    alert(
      "No results found."
    );

    return;
  }

  gotoSearchResult(
    0
  );
}

function gotoSearchResult(
  index
){

  if(
    !searchResults.length
  ){

    return;
  }

  if(
    index < 0
  ){

    index =
      searchResults.length - 1;
  }

  if(
    index >=
    searchResults.length
  ){

    index =
      0;
  }

  currentSearch =
    index;

  document.getElementById(
    "searchResults"
  ).textContent =
    `${currentSearch + 1} of ${searchResults.length}`;

  const view =
    pageViews[
      searchResults[
        currentSearch
      ]
    ];

  if(!view){

    return;
  }

  void (async () => {

    await scrollToView(
      view
    );

    /*
       The target page has now been rendered, so create its
       visible yellow highlights.
    */

    if(
      view.textLayerDiv.children.length
    ){

      applySearchHighlights(
        view
      );

      markCurrentSearchPage();

    }

  })();
}

async function searchOrAdvance(
  step
){

  const query =
    searchBox.value
      .trim()
      .toLowerCase();

  if(
    query !==
      lastSearchQuery ||

    searchResults.length === 0 ||

    currentSearch === -1
  ){

    await searchPDF(
      query
    );

    return;
  }

  gotoSearchResult(
    currentSearch + step
  );
}

searchBox.addEventListener(
  "keydown",
  async event => {

    if(
      event.key ===
      "Enter"
    ){

      await searchOrAdvance(
        1
      );
    }
  }
);

document.getElementById(
  "prevResult"
).onclick =
  () =>
    void searchOrAdvance(
      -1
    );

document.getElementById(
  "nextResult"
).onclick =
  () =>
    void searchOrAdvance(
      1
    );

/* ============================================================
   SEARCH BUTTON
============================================================ */

document.getElementById(
  "searchButton"
).onclick =
  event => {

    event.stopPropagation();

    searchPopup.classList.toggle(
      "hidden"
    );

    if(
      !searchPopup.classList.contains(
        "hidden"
      )
    ){

      searchBox.focus();
    }
  };

searchPopup.addEventListener(
  "click",
  event =>
    event.stopPropagation()
);

document.addEventListener(
  "click",
  () =>
    searchPopup.classList.add(
      "hidden"
    )
);

/* ============================================================
   TEXT SELECTION CLEANUP
============================================================ */

document.addEventListener(
  "selectionchange",
  () => {

    const selection =
      document.getSelection();

    if(
      selection &&
      selection.toString().length
    ){

      return;
    }

    for(
      const view
      of pageViews
    ){

      if(
        view?.textLayerDiv
      ){

        view.textLayerDiv.classList.remove(
          "selecting"
        );
      }
    }
  }
);

/* ============================================================
   RESIZE
============================================================ */

let resizeTimer =
  null;

window.addEventListener(
  "resize",
  () => {

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        async () => {

          syncViewerTop();

          if(
            !pageViews.length
          ){

            return;
          }

          if(
            window.innerWidth <=
            768
          ){

            const firstView =
              pageViews.find(
                Boolean
              );

            if(!firstView){

              return;
            }

            baseScale =
              getFitWidthScale(
                firstView.page
              );
          }

          await rescaleAndRender();

        },

        150
      );
  }
);

/* ============================================================
   VISUAL VIEWPORT CHANGES
============================================================ */

if(
  "ResizeObserver" in window
){

  const chromeObserver =
    new ResizeObserver(
      () => {

        syncViewerTop();

      }
    );

  chromeObserver.observe(
    header
  );

  chromeObserver.observe(
    toolbar
  );
}

/* ============================================================
   INITIALIZATION
============================================================ */

updateReadingModeButton();

scheduleChromeSync();

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  () => {

    renderGeneration++;

    for(
      const view
      of pageViews
    ){

      if(!view){

        continue;
      }

      try{

        pageObserver.unobserve(
          view.pageDiv
        );

      }catch{}

      try{

        view.canvas.width =
          1;

        view.canvas.height =
          1;

      }catch{}
    }

    try{

      if(pdfDoc){

        pdfDoc.destroy();
      }

    }catch{}
  }
);

</script>
