<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PDF Viewer</title>
<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#eee;
  --muted:#aaa;
  --viewer-top:106px;
  --content-bottom-gap:100px;
  --title-bar-height:70px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;

  /*
     overflow:hidden alone doesn't reliably stop a mobile browser
     from natively panning the whole page when a touch-scroll
     gesture starts inside a nested scrollable element (like
     #viewer, which scrolls both directions once you're zoomed
     in). That outer pan is what was dragging position:fixed
     elements - the side scroller, the toolbar, the floating
     buttons - off screen along with it. Pinning html/body in
     place removes the outer page entirely as something that can
     ever move: the only scrolling left possible is #viewer's own
     contained overflow:auto box, and position:fixed elements have
     nothing left to be dragged along with.
  */
  position:fixed;
  top:0;
  left:0;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;

  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 8px;

  background:#1b1b1b;

  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:auto;

  padding:30px 30px 90px;

  background:#111;

  scroll-behavior:auto;

  overscroll-behavior:contain;

  /*
     Explicitly declaring pan-x pan-y (rather than leaving this
     undeclared, which defaults to touch-action:auto) is what makes
     single-finger scrolling smooth. With auto, the browser can't
     commit a touch gesture to the fast compositor-thread scroll
     path - it has to wait on every frame to see whether our pointer
     handlers (used below for pinch detection) are about to call
     preventDefault(). Declaring the allowed pan axes up front lets
     it skip that check and start scrolling immediately. touch-
     action:none while pinching (see .pinching below) is the
     deliberate exception - a real two-finger gesture SHOULD be
     fully handed to JS, with no native scrolling racing against it.
  */
  touch-action:pan-x pan-y;

  /*
     The custom draggable #sideScroller is the only scrollbar we
     want visible - the browser's native one is hidden here so
     there's never a second, tiny, hard-to-grab slider alongside it.
  */
  scrollbar-width:none;
  -ms-overflow-style:none;
}

#viewer::-webkit-scrollbar{
  display:none;
}

#viewer.pinching{
  touch-action:none;
}

/*
   #pagesWrapper carries the flex/centering layout that #viewer
   used to apply directly. Splitting it out gives pinch zoom
   something it can apply a live CSS transform to (scale only, no
   layout cost, fully GPU-composited) without that transform having
   to fight #viewer's own scroll/overflow box. #viewer itself never
   gets a transform - it stays a plain scrollable frame throughout.
*/
#pagesWrapper{
  display:flex;
  flex-direction:column;
  align-items:center;

  width:100%;

  transform-origin:0 0;
}

/*
   Vertical-lock mode: the movement lock button constrains free
   panning/scrolling to the vertical axis only. Horizontal
   overflow is hidden and touch-action is limited to vertical
   panning so a diagonal swipe can't drag the page sideways.
*/
#viewer.vertical-lock{
  overflow-x:hidden;
  touch-action:pan-y;
}

/*
   While a two-finger pinch is in progress, hand touch handling
   entirely to our own pointer listeners rather than letting the
   browser interpret it as a scroll/pan gesture.
*/
#viewer.pinching{
  touch-action:none;
}

/* ============================================================
   PDF PAGE
============================================================ */

.page{
  position:relative;

  margin:0 auto 20px;

  background:#fff;

  box-shadow:
    0 0 14px rgba(0,0,0,.4);

  flex-shrink:0;

  overflow:hidden;
}

/* ============================================================
   CANVAS
============================================================ */

.pageCanvas{
  display:block;

  pointer-events:none;

  background:#fff;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;

  align-items:center;

  white-space:nowrap;
}

button,
input{
  background:#292929;

  color:#fff;

  border:1px solid #383838;

  border-radius:6px;

  padding:6px 9px;

  font:inherit;

  outline:none;
}

button:hover{
  background:#353535;

  cursor:pointer;
}

button:active{
  background:#414141;
}

button:focus-visible,
input:focus-visible{
  border-color:#666;

  outline:1px solid #555;
}

/* ============================================================
   COMPACT TOOLBAR CONTROLS
============================================================ */

.toolButton{
  height:32px;

  padding:0 10px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  white-space:nowrap;

  font-size:13px;

  border-radius:6px;
}

#searchButton{
  width:32px;

  padding:0;
}

.iconButton{
  width:32px;
  height:32px;

  padding:0;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  border-radius:6px;
}

/* ============================================================
   ZOOM
============================================================ */

.zoomControls{
  display:flex;

  align-items:center;

  gap:3px;

  height:32px;

  padding:0 3px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;
}

.zoomControls button{
  width:29px;
  height:28px;

  padding:0;

  border:0;

  background:transparent;

  font-size:17px;

  display:flex;

  align-items:center;

  justify-content:center;
}

.zoomControls button:hover{
  background:#353535;
}

#zoomPercent{
  width:58px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

/* ============================================================
   PAGE CONTROLS
============================================================ */

.pageControls{
  display:flex;

  align-items:center;

  gap:4px;

  height:32px;

  padding:0 6px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;

  white-space:nowrap;
}

.pageControls label{
  color:#aaa;

  font-size:12px;
}

#pageNumber{
  width:43px;

  height:27px;

  padding:2px 4px;

  text-align:center;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

#pageCount{
  color:#999;

  font-size:12px;

  padding-right:2px;
}

/* ============================================================
   TOOLBAR DIVIDER
============================================================ */

.toolbarDivider{
  width:1px;

  height:22px;

  background:#383838;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:#181818;

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;
}

#title{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:14px;

  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.title-text{
  order:1;

  position:relative;

  display:inline-block;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.title-badges{
  order:2;

  display:inline-flex;

  gap:8px;

  vertical-align:middle;

  flex-shrink:0;
}

.title-badge{
  display:inline-block;

  padding:4px 10px;

  color:#fff;

  font-size:.72em;

  font-weight:bold;

  border-radius:999px;

  text-transform:uppercase;

  letter-spacing:.5px;

  flex-shrink:0;
}

.title-badge.new{
  background:#00b050;
}

.title-badge.featured{
  background:#2f7cff;
}

/* ============================================================
   MENU
============================================================ */

#menu{
  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{
  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   SEARCH POPUP
============================================================ */

#searchPopup{
  position:fixed;

  top:108px;
  left:50%;

  transform:translateX(-50%);

  display:flex;

  align-items:center;

  gap:6px;

  padding:8px;

  background:#222;

  border:1px solid #444;

  border-radius:9px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.45);

  z-index:6500;
}

#searchPopup.hidden{
  display:none;
}

#searchPopup input{
  width:230px;

  height:34px;

  background:#181818;

  border-color:#3b3b3b;

  font-size:13px;
}

#searchPopup input.searching{
  border-color:#4c82c7;
}

/* ============================================================
   LARGE SEARCH NAVIGATION BUTTONS
============================================================ */

#searchPopup .searchNavButton{

  width:42px;
  min-width:42px;

  height:40px;
  min-height:40px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:7px;

  font-size:20px;

  line-height:1;

  font-weight:bold;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

#searchPopup .searchNavButton:hover{
  background:#353535;
}

#searchPopup .searchNavButton:active{
  background:#414141;

  transform:scale(.96);
}

#searchPopup .searchNavButton:disabled{
  opacity:.4;

  cursor:default;
}

#searchResults{
  color:#aaa;

  min-width:70px;

  text-align:center;

  font-size:12px;

  white-space:nowrap;
}

/* ============================================================
   TABLE OF CONTENTS BUTTON
============================================================ */

#tocButton.toc-empty{
  opacity:.55;
}

/* ============================================================
   TABLE OF CONTENTS POPUP

   Covers the whole PDF-viewing area (not just a small dropdown):
   the same footprint as #layout normally, or the entire screen
   while in reading mode (see the reading-mode override below).
============================================================ */

#tocPopup{
  position:fixed;

  top:var(--viewer-top);
  left:0;
  right:0;

  /*
     Meets the title bar exactly, flush - no gap above it, but no
     overlap either. The floating TOC/reading-mode buttons sit
     further up (see their own title-bar-tracking offsets), so
     they're still well within this panel's covered area and get
     hidden underneath it regardless.
  */
  bottom:var(--title-bar-height);

  display:flex;
  flex-direction:column;

  /*
     The popup itself doesn't scroll - #tocContent (below) does,
     so the "Table of Contents" heading and close button stay
     pinned in view.
  */
  overflow:hidden;

  padding:14px 16px;

  background:#1b1b1b;

  border:0;
  border-top:1px solid #333;

  box-shadow:
    0 -6px 24px rgba(0,0,0,.5);

  /*
     Higher than the floating TOC/reading-mode buttons (z-index
     9000), so the panel visually and functionally covers them
     while it's open - they can't be tapped underneath it. The
     only ways out are the X button or picking an entry.
  */
  z-index:9500;
}

body.reading-mode #tocPopup{

  top:0;
  bottom:0;

  border-top:0;
}

#tocPopup.hidden{
  display:none;
}

#tocHeader{
  flex:0 0 auto;

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;

  padding-bottom:10px;

  border-bottom:1px solid #333;
}

#tocHeader h3{
  margin:0;

  padding:0;

  font-size:16px;

  color:#eee;
}

#tocCloseBtn{
  width:32px;
  height:32px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border-radius:7px;

  font-size:16px;
}

#tocContent{
  flex:1 1 auto;

  /*
     min-height:0 is what actually lets a flex child shrink below
     its content size instead of forcing the parent to grow -
     without it this would ignore the popup's height.
  */
  min-height:0;

  overflow-y:auto;
}

.tocEmptyMessage{
  padding:8px 4px;

  color:#aaa;

  font-size:13px;

  line-height:1.4;
}

.tocList,
.tocList ul{
  margin:0;

  padding-left:0;

  list-style:none;
}

.tocList ul{
  padding-left:16px;
}

.tocList li{
  margin:2px 0;
}

.tocList button{
  width:100%;

  padding:9px 8px;

  display:flex;

  align-items:baseline;

  justify-content:space-between;

  gap:10px;

  text-align:left;

  background:transparent;

  border:0;

  border-radius:6px;

  cursor:pointer;

  /*
     Depth-tiered typography (see the nested overrides below):
     top-level entries read as headings, and each deeper level of
     nesting steps the size/weight/color down, so the outline's
     hierarchy is visible at a glance without expand/collapse UI.
  */
  font-size:15px;
  font-weight:600;
  color:#f0f0f0;
}

.tocList button:hover{
  background:#2c2c2c;
}

/* Depth 2 */
.tocList .tocList button{
  font-size:13.5px;
  font-weight:400;
  color:#dcdcdc;
}

/* Depth 3 */
.tocList .tocList .tocList button{
  font-size:12.5px;
  font-weight:400;
  color:#b8b8b8;
}

/* Depth 4 and beyond */
.tocList .tocList .tocList .tocList button{
  font-size:11.5px;
  font-weight:400;
  color:#999;
}

.tocItemTitle{
  flex:1 1 auto;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.tocItemPage{
  flex:0 0 auto;

  color:#888;

  font-size:12px;
}

.tocLabelOnly{
  padding:9px 8px;

  color:#999;

  font-size:15px;
  font-weight:600;
}

.tocList .tocList .tocLabelOnly{
  font-size:13.5px;
  font-weight:400;
}

.tocList .tocList .tocList .tocLabelOnly{
  font-size:12.5px;
  font-weight:400;
}

.tocList .tocList .tocList .tocList .tocLabelOnly{
  font-size:11.5px;
  font-weight:400;
}

/* ============================================================
   SIDE SCROLLER

   A draggable scrollbar handle running down the left edge of
   the screen. Only shown once the document is actually taller
   than the viewport. Dragging the thumb scrolls the document
   proportionally; clicking elsewhere on the track jumps there.
============================================================ */

#sideScroller{
  position:fixed;

  top:calc(var(--viewer-top) + 10px);
  left:4px;
  bottom:var(--content-bottom-gap);

  width:24px;

  display:none;

  align-items:stretch;
  justify-content:center;

  z-index:4000;

  touch-action:none;
}

body.reading-mode #sideScroller{

  top:16px;
  bottom:16px;
}

#sideScrollerTrack{
  position:relative;

  width:10px;
  height:100%;

  background:
    rgba(255,255,255,.06);

  box-shadow:
    0 0 0 1px rgba(0,0,0,.2);

  border-radius:5px;

  cursor:pointer;
}

#sideScrollerThumb{
  position:absolute;

  left:0;

  width:10px;

  min-height:34px;

  border-radius:5px;

  background:
    rgba(255,255,255,.5);

  /*
     A dark outline + shadow so the thumb reads against light PDF
     pages too - plain translucent white alone washes out over a
     white page and the bar effectively disappears.
  */
  box-shadow:
    0 0 0 1px rgba(0,0,0,.45),
    0 1px 3px rgba(0,0,0,.35);

  cursor:grab;

  touch-action:none;

  transition:background .12s ease;
}

#sideScrollerThumb:hover{
  background:
    rgba(255,255,255,.7);
}

#sideScrollerThumb.dragging{
  background:
    rgba(255,255,255,.85);

  cursor:grabbing;
}

/* ============================================================
   SIDE SCROLLER PAGE BADGE

   Floats to the right of the draggable thumb while dragging (or
   while pressing the track), showing which page you'd land on -
   like a tooltip that tracks the thumb's vertical position.
============================================================ */

#sideScrollerPageBadge{
  position:absolute;

  left:100%;

  margin-left:8px;

  padding:5px 10px;

  background:
    rgba(30,30,30,.95);

  border:1px solid #444;

  border-radius:6px;

  color:#fff;

  font-size:13px;
  font-weight:bold;

  white-space:nowrap;

  pointer-events:none;

  opacity:0;

  transform:translateY(-50%);

  transition:opacity .12s ease;

  z-index:4100;

  box-shadow:
    0 4px 12px rgba(0,0,0,.4);
}

#sideScrollerPageBadge.visible{
  opacity:1;
}

/* ============================================================
   PDF.JS TEXT LAYER
============================================================ */

.textLayer{
  color-scheme:only light;

  position:absolute;

  text-align:initial;

  inset:0;

  overflow:clip;

  opacity:1;

  line-height:1;

  letter-spacing:normal;

  word-spacing:normal;

  text-size-adjust:none;

  forced-color-adjust:none;

  transform-origin:0 0;

  caret-color:CanvasText;

  z-index:2;

  pointer-events:auto;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;

  -webkit-touch-callout:default;

  --min-font-size:1;

  --text-scale-factor:
    calc(
      var(--total-scale-factor) *
      var(--min-font-size)
    );

  --min-font-size-inv:
    calc(
      1 /
      var(--min-font-size)
    );

  --scale-factor:1;

  --user-unit:1;

  --total-scale-factor:1;
}

.textLayer span,
.textLayer br{
  color:transparent;

  position:absolute;

  white-space:pre;

  cursor:text;

  transform-origin:0% 0%;

  user-select:text;

  -webkit-user-select:text;

  -moz-user-select:text;
}

.textLayer > :not(.markedContent),
.textLayer .markedContent span:not(.markedContent){

  z-index:1;

  --font-height:0;

  font-size:
    calc(
      var(--text-scale-factor) *
      var(--font-height)
    );

  --scale-x:1;

  --rotate:0deg;

  transform:
    rotate(var(--rotate))
    scaleX(var(--scale-x))
    scale(var(--min-font-size-inv));
}

.textLayer .markedContent{
  display:contents;
}

.textLayer span[role="img"]{
  user-select:none;

  -webkit-user-select:none;

  cursor:default;
}

.textLayer ::selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer ::-moz-selection{
  background:
    rgba(0,120,255,.35);

  color:transparent;
}

.textLayer br::selection{
  background:transparent;
}

.textLayer .endOfContent{
  display:block;

  position:absolute;

  inset:100% 0 0;

  z-index:0;

  cursor:default;

  user-select:none;

  -webkit-user-select:none;
}

.textLayer.selecting .endOfContent{
  top:0;
}

/* ============================================================
   SEARCH HIGHLIGHTS
============================================================ */

.searchHighlightLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:3;

  pointer-events:none;
}

.search-highlight{

  position:absolute;

  background:
    rgba(0,125,255,.30);

  border-radius:2px;

  box-shadow:
    0 0 0 1px
    rgba(0,100,230,.10);

  pointer-events:none;

  transition:
    background .12s ease,
    box-shadow .12s ease;
}

.search-highlight.search-current{

  background:
    rgba(0,105,255,.48);

  box-shadow:
    0 0 0 1px
    rgba(0,80,220,.30);
}

/* ============================================================
   LINK LAYER
============================================================ */

.linkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:4;

  pointer-events:none;
}

.pdf-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  background:transparent;

  border:0;

  padding:0;

  margin:0;

  text-decoration:none;
}

.pdf-link:hover{
  background:
    rgba(0,120,255,.08);
}

/* ============================================================
   EMAIL LINK LAYER

   Overlays clickable mailto: links on top of any occurrence of
   a specific email address found in the PDF's text layer. This
   sits above the ordinary annotation link layer since it is
   derived from plain text rather than a native PDF link
   annotation.
============================================================ */

.emailLinkLayer{
  position:absolute;

  inset:0;

  overflow:hidden;

  z-index:5;

  pointer-events:none;
}

.email-link{
  position:absolute;

  display:block;

  pointer-events:auto;

  cursor:pointer;

  /*
     Looks like an ordinary link - a thin blue underline, no fill -
     rather than a highlighted block, since it's sitting on top of
     text that's already rendered black by the page itself.
  */
  background:transparent;

  border:0;
  border-bottom:1.5px solid rgba(59,130,246,.85);

  padding:0;

  margin:0;

  text-decoration:none;
}

.email-link:hover{
  background:
    rgba(59,130,246,.12);
}

/* ============================================================
   LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

<script type="module">

import {
  getDocument,
  GlobalWorkerOptions,
  TextLayer
} from "./pdfjs/build/pdf.mjs";

GlobalWorkerOptions.workerSrc = "./pdfjs/build/pdf.worker.mjs";

/* ============================================================
   URL PARAMETERS
============================================================ */

const params = new URLSearchParams(location.search);

const file = decodeURIComponent(params.get("file") || "");
const title = decodeURIComponent(params.get("paper") || "PDF");
const returnPage = decodeURIComponent(params.get("return") || "index.html");

/* ============================================================
   ELEMENTS
============================================================ */

const header = document.querySelector("header");
const toolbar = document.getElementById("toolbar");
const viewer = document.getElementById("viewer");
const pagesWrapper = document.getElementById("pagesWrapper");
const layout = document.getElementById("layout");
const loadingOverlay = document.getElementById("loadingOverlay");
const pageInput = document.getElementById("pageNumber");
const zoomBox = document.getElementById("zoomPercent");
const searchPopup = document.getElementById("searchPopup");
const searchBox = document.getElementById("searchBox");
const searchResultsLabel = document.getElementById("searchResults");
const prevResultBtn = document.getElementById("prevResult");
const nextResultBtn = document.getElementById("nextResult");
const menu = document.getElementById("menu");
const menuButton = document.getElementById("menuBtn");
const readingModeFloat = document.getElementById("readingModeFloat");
const tocButton = document.getElementById("tocButton");
const tocPopup = document.getElementById("tocPopup");
const tocContent = document.getElementById("tocContent");
const tocCloseBtn = document.getElementById("tocCloseBtn");
const sideScroller = document.getElementById("sideScroller");
const sideScrollerTrack = document.getElementById("sideScrollerTrack");
const sideScrollerThumb = document.getElementById("sideScrollerThumb");
const sideScrollerPageBadge = document.getElementById("sideScrollerPageBadge");
const titleBar = document.getElementById("titleBar");
const lockButton = document.getElementById("lockButton");

/* ============================================================
   CHROME HEIGHT
============================================================ */

function syncViewerTop(){

  if(document.body.classList.contains("reading-mode")){
    return;
  }

  const headerHeight = header.getBoundingClientRect().height;
  const toolbarHeight = toolbar.getBoundingClientRect().height;
  const total = Math.ceil(headerHeight + toolbarHeight);

  document.documentElement.style.setProperty("--viewer-top", `${total}px`);

  layout.style.top = `${total}px`;
  loadingOverlay.style.top = `${total}px`;
}

/*
   The title bar's height isn't fixed - a long title can wrap
   onto a second line, and the NEW/FEATURED badges can add a row
   on mobile. The side scroller and the floating buttons stop
   just above it (--content-bottom-gap, with a small buffer), and
   the TOC popup meets it exactly flush with no gap and no overlap
   (--title-bar-height, no buffer) - both track its real, current
   height instead of a guessed constant.
*/
function syncBottomGap(){

  if(document.body.classList.contains("reading-mode")){
    return;
  }

  const titleBarHeight = titleBar.getBoundingClientRect().height;

  document.documentElement.style.setProperty("--content-bottom-gap", `${Math.ceil(titleBarHeight) + 16}px`);

  /*
     Floored, not ceil'd: this offset is how far the TOC popup's
     bottom edge sits from the viewport bottom. Rounding up can
     push that edge a fraction of a pixel above the title bar's
     real top edge, exposing a hairline gap. Rounding down instead
     lands it at-or-inside the title bar, which is invisible since
     the title bar's z-index is far below the popup's.
  */
  document.documentElement.style.setProperty("--title-bar-height", `${Math.floor(titleBarHeight)}px`);
}

function scheduleChromeSync(){
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      syncViewerTop();
      syncBottomGap();
    });
  });
}

/* ============================================================
   LIMITS
============================================================ */

const MAX_CANVAS_PIXELS = 8000000;
const MAX_CANVAS_DIMENSION = 16384;
const RENDER_MARGIN = "1400px";

/*
   Any occurrence of this email address anywhere in the PDF's
   text layer gets turned into a clickable mailto: overlay. The
   match is case-insensitive (see paintEmailLinks / findTextOccurrences).
*/
const TARGET_EMAIL = "lanthanoresearch@protonmail.com";

/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ============================================================
   DESCRIPTION / BADGES
============================================================ */

let descriptions = {};

try{
  descriptions = await fetch("descriptions.json").then(response => response.json());
}catch(error){
  console.warn("Could not load descriptions.json:", error);
}

let newestEntry = null;

if(Object.keys(descriptions).length){
  newestEntry = Object.entries(descriptions).sort(
    (a,b) => new Date(b[1].updated || 0) - new Date(a[1].updated || 0)
  )[0];
}

const newestKey = newestEntry ? newestEntry[0] : null;
const newestDate = newestEntry ? new Date(newestEntry[1].updated) : null;
const today = new Date();
const oneYearAgo = new Date(today);

oneYearAgo.setFullYear(today.getFullYear() - 1);

const showNewestBadge = Boolean(newestDate && newestDate >= oneYearAgo);

const paper = Object.values(descriptions).find(item => item.url === file);
const paperKey = Object.keys(descriptions).find(key => descriptions[key].url === file);

const isNewest = Boolean(showNewestBadge && paperKey === newestKey);

/*
   title-text and title-badges are rendered as SIBLINGS (not
   nested) inside #title, which is itself a flex row with a gap.
   That gap is what actually creates the spacing between the
   title and its badges - a nested structure previously fought
   with the CSS's sibling-based layout rules and collapsed the
   spacing down to almost nothing.
*/

const badgesHtml = `
  ${isNewest ? `<span class="title-badge new">NEW</span>` : ""}
  ${paper?.featured ? `<span class="title-badge featured">FEATURED</span>` : ""}
`.trim();

document.getElementById("title").innerHTML = `
  <span class="title-text">${escapeHtml(title)}</span>
  ${badgesHtml ? `<span class="title-badges">${badgesHtml}</span>` : ""}
`;

/* ============================================================
   VIEWPORT SIZING
============================================================ */

let baseScale = 1;
let zoomLevel = 1;
let currentScale = 1;

function getViewerInnerWidth(){
  const styles = getComputedStyle(viewer);
  return Math.max(1, viewer.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight));
}

function getViewerInnerHeight(){
  const styles = getComputedStyle(viewer);
  return Math.max(1, viewer.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom));
}

function getFitWidthScale(page){
  const viewport = page.getViewport({ scale:1 });
  return getViewerInnerWidth() / viewport.width;
}

function getFitPageScale(page){
  const viewport = page.getViewport({ scale:1 });
  const widthScale = getViewerInnerWidth() / viewport.width;
  const heightScale = getViewerInnerHeight() / viewport.height;
  return Math.min(widthScale, heightScale);
}

const zoomLevels = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3];

const MIN_ZOOM_LEVEL = zoomLevels[0];
const MAX_ZOOM_LEVEL = zoomLevels[zoomLevels.length - 1];

/* ============================================================
   PDF STATE
============================================================ */

let pdfDoc = null;
const pageViews = [];
let renderGeneration = 0;

/* ============================================================
   SEARCH STATE
============================================================ */

let searchResults = [];
let currentSearch = -1;
let lastSearchQuery = "";
let searchGeneration = 0;
let searchTimer = null;
let searchBusy = false;

/*
   searchOrderKeys records the reading order ("1, 2, 3...") that was
   established the last time a *fresh* search was kicked off. Every
   occurrence is keyed by "pageNumber:charStart", which uniquely and
   stably identifies a match regardless of zoom/rerender.

   activeResultKey records which occurrence is the one currently
   selected/highlighted, by the same key. It's used so that a
   rebuild that isn't a new search (e.g. triggered by zooming) can
   restore both the ordering and the current selection instead of
   restarting the count from 1.
*/

let searchOrderKeys = [];
let activeResultKey = null;

/*
   currentSearchOperation always resolves once whatever
   search is currently running (debounced or forced) has
   finished. Navigation (Enter / arrow buttons) awaits this
   before acting, so it never silently no-ops just because a
   search was still in flight.
*/

let currentSearchOperation = Promise.resolve();

/* ============================================================
   SEARCH CANCELLATION
============================================================ */

function cancelSearch(){

  searchGeneration++;

  clearTimeout(searchTimer);

  searchTimer = null;
  searchBusy = false;
  lastSearchQuery = "";
  currentSearch = -1;
  searchResults = [];
  searchOrderKeys = [];
  activeResultKey = null;

  searchBox.value = "";
  searchBox.classList.remove("searching");

  clearSearchHighlights();
  updateSearchCounter();
}

function closeSearch(){
  cancelSearch();
  searchPopup.classList.add("hidden");
}

/* ============================================================
   BACK
============================================================ */

const backButton = document.getElementById("backBtn");

backButton.href = returnPage || "index.html";

backButton.addEventListener("click", event => {
  event.preventDefault();

  sessionStorage.setItem("restoreSearch", "yes");
  sessionStorage.setItem("returnFromPage", "yes");

  window.location.assign(returnPage || "index.html");
});

/* ============================================================
   SAFE OUTPUT SCALE
============================================================ */

function getSafeOutputScale(viewport){

  const dpr = Math.max(1, window.devicePixelRatio || 1);

  let outputScale = dpr;

  const pagePixels = viewport.width * viewport.height;

  if(pagePixels > 0){
    outputScale = Math.min(outputScale, Math.sqrt(MAX_CANVAS_PIXELS / pagePixels));
  }

  if(viewport.width > 0){
    outputScale = Math.min(outputScale, MAX_CANVAS_DIMENSION / viewport.width);
  }

  if(viewport.height > 0){
    outputScale = Math.min(outputScale, MAX_CANVAS_DIMENSION / viewport.height);
  }

  return Math.max(0.35, Math.min(outputScale, dpr));
}

/* ============================================================
   PAGE LAYOUT
============================================================ */

function layoutPage(view, scale){

  const viewport = view.page.getViewport({ scale });

  view.viewport = viewport;

  const width = `${viewport.width}px`;
  const height = `${viewport.height}px`;

  view.pageDiv.style.width = width;
  view.pageDiv.style.height = height;

  view.canvas.style.width = width;
  view.canvas.style.height = height;

  view.textLayerDiv.style.width = width;
  view.textLayerDiv.style.height = height;

  view.searchLayerDiv.style.width = width;
  view.searchLayerDiv.style.height = height;

  view.linkLayerDiv.style.width = width;
  view.linkLayerDiv.style.height = height;

  view.emailLinkLayerDiv.style.width = width;
  view.emailLinkLayerDiv.style.height = height;

  const userUnit = view.page.userUnit || 1;

  view.textLayerDiv.style.setProperty("--scale-factor", String(viewport.scale));
  view.textLayerDiv.style.setProperty("--user-unit", String(userUnit));
  view.textLayerDiv.style.setProperty("--total-scale-factor", String(viewport.scale * userUnit));

  return viewport;
}

/* ============================================================
   RESET PAGE
============================================================ */

function resetRenderedPage(view){

  view.renderedScale = null;

  try{
    view.canvas.width = 1;
    view.canvas.height = 1;
  }catch{}

  view.textLayerDiv.replaceChildren();
  view.searchLayerDiv.replaceChildren();
  view.linkLayerDiv.replaceChildren();
  view.emailLinkLayerDiv.replaceChildren();

  view.textLayer = null;
  view.textLayerEnd = null;
}

/* ============================================================
   CANVAS
============================================================ */

async function paintCanvas(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  const viewport = view.viewport;

  const outputScale = getSafeOutputScale(viewport);

  const pixelWidth = Math.max(1, Math.floor(viewport.width * outputScale));
  const pixelHeight = Math.max(1, Math.floor(viewport.height * outputScale));

  if(pixelWidth > MAX_CANVAS_DIMENSION || pixelHeight > MAX_CANVAS_DIMENSION){
    throw new Error("Safe canvas limit exceeded.");
  }

  view.canvas.width = pixelWidth;
  view.canvas.height = pixelHeight;

  const context = view.canvas.getContext("2d", { alpha:false });

  if(!context){
    throw new Error("Could not create canvas context.");
  }

  context.setTransform(outputScale, 0, 0, outputScale, 0, 0);

  await view.page.render({ canvasContext:context, viewport }).promise;
}

/* ============================================================
   TEXT CONTENT
============================================================ */

async function ensureTextContent(view){

  if(view.textContent){
    return view.textContent;
  }

  view.textContent = await view.page.getTextContent();

  return view.textContent;
}

/* ============================================================
   TEXT LAYER
============================================================ */

async function paintText(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  try{

    const textContent = await ensureTextContent(view);

    view.textLayerDiv.replaceChildren();

    const userUnit = view.page.userUnit || 1;

    view.textLayerDiv.style.setProperty("--scale-factor", String(view.viewport.scale));
    view.textLayerDiv.style.setProperty("--user-unit", String(userUnit));
    view.textLayerDiv.style.setProperty("--total-scale-factor", String(view.viewport.scale * userUnit));

    const textLayer = new TextLayer({
      textContentSource: textContent,
      container: view.textLayerDiv,
      viewport: view.viewport
    });

    await textLayer.render();

    if(generation !== renderGeneration){
      return;
    }

    const endOfContent = document.createElement("div");

    endOfContent.className = "endOfContent";

    view.textLayerDiv.append(endOfContent);

    view.textLayerEnd = endOfContent;

    view.textLayerDiv.addEventListener("pointerdown", () => {
      view.textLayerDiv.classList.add("selecting");
    });

    view.textLayer = textLayer;

  }catch(error){
    console.warn(`Text layer failed on page ${view.pageNumber}:`, error);
  }
}

/* ============================================================
   LINKS
============================================================ */

async function paintLinks(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  try{

    if(!view.annotations){
      view.annotations = await view.page.getAnnotations({ intent:"display" });
    }

    renderLinkLayer(view);

  }catch(error){
    console.warn(`Link layer failed on page ${view.pageNumber}:`, error);
  }
}

function renderLinkLayer(view){

  const layer = view.linkLayerDiv;

  layer.replaceChildren();

  if(!Array.isArray(view.annotations)){
    return;
  }

  const viewport = view.viewport;

  for(const annotation of view.annotations){

    if(annotation.subtype !== "Link"){
      continue;
    }

    if(!annotation.rect || annotation.rect.length !== 4){
      continue;
    }

    const rect = viewport.convertToViewportRectangle(annotation.rect);

    const left = Math.min(rect[0], rect[2]);
    const top = Math.min(rect[1], rect[3]);
    const width = Math.abs(rect[2] - rect[0]);
    const height = Math.abs(rect[3] - rect[1]);

    if(width <= 0 || height <= 0){
      continue;
    }

    const link = document.createElement("a");

    link.className = "pdf-link";

    link.style.left = `${left}px`;
    link.style.top = `${top}px`;
    link.style.width = `${width}px`;
    link.style.height = `${height}px`;

    if(annotation.url || annotation.unsafeUrl){

      link.href = annotation.url || annotation.unsafeUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

    }else if(annotation.dest){

      link.href = "#";

      link.addEventListener("click", async event => {
        event.preventDefault();
        event.stopPropagation();

        await openInternalDestination(annotation.dest);
      });

    }else{
      continue;
    }

    layer.appendChild(link);
  }
}

/* ============================================================
   EMAIL LINKS

   Scans a page's text layer for any occurrence of TARGET_EMAIL
   and overlays a clickable mailto: anchor on top of it, using
   the same text-walking approach as search (see
   findTextOccurrences below). Runs after the text layer has
   been painted, since it needs the text layer's DOM nodes.
============================================================ */

async function paintEmailLinks(view, generation){

  if(generation !== renderGeneration){
    return;
  }

  try{

    view.emailLinkLayerDiv.replaceChildren();

    const matches = findTextOccurrences(view, TARGET_EMAIL);

    for(const match of matches){

      for(const rect of match.rects){

        const link = document.createElement("a");

        link.className = "email-link";
        link.href = `mailto:${TARGET_EMAIL}`;
        link.title = `Email ${TARGET_EMAIL}`;

        /*
           Without this, clicking navigates the CURRENT tab/frame to
           a mailto: URI. In an embedded viewer that counts as a
           top-level navigation attempt, which fires beforeunload -
           the same cleanup that runs when actually leaving the
           page - and that cleanup zeroes out every page's canvas,
           which is what was turning the whole PDF black. Handing
           it to a new context (same as the annotation links above)
           avoids touching the current page at all.
        */
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.style.left = `${rect.left}px`;
        link.style.top = `${rect.top}px`;
        link.style.width = `${rect.width}px`;
        link.style.height = `${rect.height}px`;

        link.addEventListener("click", event => {
          event.stopPropagation();
        });

        view.emailLinkLayerDiv.appendChild(link);
      }
    }

  }catch(error){
    console.warn(`Email link layer failed on page ${view.pageNumber}:`, error);
  }
}

/* ============================================================
   PAGE SHELL
============================================================ */

function createPageShell(pageNumber, page){

  const pageDiv = document.createElement("div");

  pageDiv.className = "page";
  pageDiv.dataset.pageNumber = String(pageNumber);

  const canvas = document.createElement("canvas");

  canvas.className = "pageCanvas";

  const textLayerDiv = document.createElement("div");

  textLayerDiv.className = "textLayer";

  const searchLayerDiv = document.createElement("div");

  searchLayerDiv.className = "searchHighlightLayer";

  const linkLayerDiv = document.createElement("div");

  linkLayerDiv.className = "linkLayer";

  const emailLinkLayerDiv = document.createElement("div");

  emailLinkLayerDiv.className = "emailLinkLayer";

  pageDiv.appendChild(canvas);
  pageDiv.appendChild(textLayerDiv);
  pageDiv.appendChild(searchLayerDiv);
  pageDiv.appendChild(linkLayerDiv);
  pageDiv.appendChild(emailLinkLayerDiv);

  pagesWrapper.appendChild(pageDiv);

  const view = {
    pageNumber,
    page,
    pageDiv,
    canvas,
    textLayerDiv,
    searchLayerDiv,
    linkLayerDiv,
    emailLinkLayerDiv,
    viewport:null,
    textContent:null,
    annotations:null,
    textLayer:null,
    textLayerEnd:null,
    renderedScale:null,
    renderingPromise:null
  };

  pageViews[pageNumber - 1] = view;

  return view;
}

/* ============================================================
   RENDER PAGE
============================================================ */

async function renderPage(view){

  if(!view){
    return;
  }

  const generation = renderGeneration;

  if(view.renderedScale === currentScale){
    return;
  }

  if(view.renderingPromise){
    return view.renderingPromise;
  }

  view.renderingPromise = (async () => {

    try{

      layoutPage(view, currentScale);

      await paintCanvas(view, generation);

      if(generation !== renderGeneration){
        return;
      }

      view.renderedScale = currentScale;

      await Promise.all([
        paintText(view, generation),
        paintLinks(view, generation)
      ]);

      // Email links depend on the text layer's DOM nodes, so this
      // must run after paintText has finished (not in the same
      // Promise.all above).
      await paintEmailLinks(view, generation);

    }catch(error){
      console.warn(`Page ${view.pageNumber} render failed:`, error);
    }finally{
      view.renderingPromise = null;
    }

  })();

  return view.renderingPromise;
}

/* ============================================================
   INTERSECTION OBSERVER
============================================================ */

const pageObserver = new IntersectionObserver(

  entries => {

    for(const entry of entries){

      if(!entry.isIntersecting){
        continue;
      }

      const view = pageViews.find(candidate => candidate && candidate.pageDiv === entry.target);

      if(view){
        void renderPage(view);
      }
    }

  },

  {
    root:viewer,
    rootMargin:RENDER_MARGIN,
    threshold:0
  }

);

/* ============================================================
   RENDER NEARBY
============================================================ */

function renderNearbyPages(){

  const viewerRect = viewer.getBoundingClientRect();

  for(const view of pageViews){

    if(!view){
      continue;
    }

    const rect = view.pageDiv.getBoundingClientRect();

    if(rect.bottom >= viewerRect.top - 1400 && rect.top <= viewerRect.bottom + 1400){
      void renderPage(view);
    }
  }
}

/* ============================================================
   ENSURE PAGE
============================================================ */

async function ensurePageView(pageNumber){

  if(!pdfDoc || pageNumber < 1 || pageNumber > pdfDoc.numPages){
    return null;
  }

  const existing = pageViews[pageNumber - 1];

  if(existing){
    return existing;
  }

  try{

    const page = await pdfDoc.getPage(pageNumber);

    const view = createPageShell(pageNumber, page);

    layoutPage(view, currentScale);

    pageObserver.observe(view.pageDiv);

    return view;

  }catch(error){
    console.warn(`Could not load page ${pageNumber}:`, error);
    return null;
  }
}

/* ============================================================
   INTERNAL DESTINATIONS
============================================================ */

async function resolveDestination(destination){

  if(!pdfDoc){
    return null;
  }

  try{

    let dest = destination;

    if(typeof dest === "string"){
      dest = await pdfDoc.getDestination(dest);
    }

    if(!Array.isArray(dest) || !dest.length){
      return null;
    }

    const pageRef = dest[0];

    let pageIndex = -1;

    try{
      pageIndex = await pdfDoc.getPageIndex(pageRef);
    }catch{
      if(typeof pageRef === "number"){
        pageIndex = pageRef;
      }
    }

    if(pageIndex < 0 || pageIndex >= pdfDoc.numPages){
      return null;
    }

    return pageIndex;

  }catch{
    return null;
  }
}

async function scrollToView(view){

  if(!view){
    return;
  }

  await renderPage(view);

  const viewerRect = viewer.getBoundingClientRect();
  const pageRect = view.pageDiv.getBoundingClientRect();

  const targetOffset = pageRect.top - viewerRect.top + viewer.scrollTop;

  viewer.scrollTo({
    top: Math.max(0, targetOffset - 8),
    behavior: "smooth"
  });

  pageInput.value = String(view.pageNumber);
}

async function openInternalDestination(destination){

  const pageIndex = await resolveDestination(destination);

  if(pageIndex === null){
    return;
  }

  const view = await ensurePageView(pageIndex + 1);

  if(view){
    await scrollToView(view);
  }
}

/* ============================================================
   READING MODE
============================================================ */

let readingMode = false;

function setReadingMode(enabled){

  readingMode = Boolean(enabled);

  if(readingMode){

    document.body.classList.add("reading-mode");

    readingModeFloat.textContent = "×";
    readingModeFloat.title = "Exit Reading Mode";

    menu.style.display = "none";

    /*
       Reading mode closes the search and TOC popups,
       but does not destroy the search data.
    */

    searchPopup.classList.add("hidden");
    tocPopup.classList.add("hidden");

    /*
       Explicitly remove the normal chrome
       space from the viewer.
    */

    layout.style.top = "0px";
    layout.style.height = "100%";

    loadingOverlay.style.top = "0px";

  }else{

    document.body.classList.remove("reading-mode");

    readingModeFloat.textContent = "▣";
    readingModeFloat.title = "Reading Mode";

    /*
       Let the normal chrome measurement restore
       the correct viewer position.
    */

    layout.style.height = "";
    loadingOverlay.style.top = "";

    scheduleChromeSync();
  }

  requestAnimationFrame(() => {

    renderGeneration++;

    for(const view of pageViews){

      if(!view){
        continue;
      }

      layoutPage(view, currentScale);
      resetRenderedPage(view);
    }

    renderNearbyPages();

    updateSideScroller();

  });
}

readingModeFloat.addEventListener("click", event => {
  event.stopPropagation();
  setReadingMode(!readingMode);
});

/* ============================================================
   MOVEMENT LOCK (Free / Vertical)

   Mirrors the lock button from image.html: cycling between a
   free-panning mode (normal 2D scroll/pan) and a vertical-only
   mode that constrains scrolling/panning to the Y axis. Only
   these two states are offered here (no "horizontal" state,
   since a PDF's natural reading direction is vertical).
============================================================ */

let movementMode = "free";

function setMovementMode(mode){

  movementMode = mode;

  if(movementMode === "vertical"){

    lockButton.textContent = "↕ Vertical";
    lockButton.title = "Vertical-only scrolling (tap to switch to Free)";

    viewer.classList.add("vertical-lock");

  }else{

    lockButton.textContent = "✣ Free";
    lockButton.title = "Free scrolling (tap to switch to Vertical-only)";

    viewer.classList.remove("vertical-lock");
  }
}

lockButton.addEventListener("click", event => {
  event.stopPropagation();
  setMovementMode(movementMode === "free" ? "vertical" : "free");
});

/* ============================================================
   TAP TO READ
============================================================ */

let tapState = {
  active:false,
  moved:false,
  startX:0,
  startY:0
};

viewer.addEventListener("pointerdown", event => {

  if(
    event.target.closest(".textLayer") ||
    event.target.closest(".pdf-link") ||
    event.target.closest(".email-link") ||
    event.target.closest(".searchHighlightLayer")
  ){
    tapState.active = false;
    return;
  }

  const page = event.target.closest(".page");

  if(!page){
    tapState.active = false;
    return;
  }

  tapState.active = true;
  tapState.moved = false;
  tapState.startX = event.clientX;
  tapState.startY = event.clientY;

});

viewer.addEventListener("pointermove", event => {

  if(!tapState.active){
    return;
  }

  if(Math.hypot(event.clientX - tapState.startX, event.clientY - tapState.startY) > 10){
    tapState.moved = true;
  }
});

viewer.addEventListener("pointerup", event => {

  if(!tapState.active){
    return;
  }

  const moved = tapState.moved;

  tapState.active = false;

  if(moved){
    return;
  }

  if(
    event.target.closest(".textLayer") ||
    event.target.closest(".pdf-link") ||
    event.target.closest(".email-link") ||
    event.target.closest(".searchHighlightLayer")
  ){
    return;
  }

  if(event.target.closest(".page")){
    setReadingMode(!readingMode);
  }
});

/* ============================================================
   PINCH ZOOM

   Two phases, the same way native apps (and Adobe's own viewers)
   do it:

   1. LIVE PREVIEW - while fingers are actually moving, apply a
      pure CSS transform:scale() to #pagesWrapper. This costs
      nothing (no page re-layout, no re-render, fully
      GPU-composited) so it tracks your fingers with zero lag,
      but the underlying canvases are just being visually
      stretched, so it can look soft mid-gesture - exactly like
      every other touch PDF viewer.

   2. COMMIT - the instant the pinch ends (second finger lifts),
      the transform is removed and a single real re-layout runs
      at the final zoom level, producing a crisp render again.

   Both phases scale around the SAME fixed point - the center of
   the viewer - which is what "zoom toward the center always"
   means here: not the pinch midpoint (which would drift toward
   whichever edge your fingers happen to be biased toward), but
   the actual middle of the visible page area, every time,
   whether you're pinching or tapping +/-. Because both the live
   transform and the committed re-render share that same anchor,
   there's no jump/snap when the transform is swapped out for the
   real layout at the end.

   Only engages once a second touch point lands - a single finger
   is left untouched for normal scrolling / tap-to-read / text
   selection / the movement-lock panning above.
============================================================ */

const pinchPointers = new Map();

let pinchGestureActive = false;
let pinchStartDistance = 0;
let pinchStartZoomLevel = 1;
let pinchLiveScale = 1;
let pinchTransformQueued = false;

function getViewportCenter(){

  const viewerRect = viewer.getBoundingClientRect();

  return {
    x: viewerRect.left + viewerRect.width / 2,
    y: viewerRect.top + viewerRect.height / 2
  };
}

function getPinchPointerDistance(){

  const points = [...pinchPointers.values()];

  if(points.length < 2){
    return 0;
  }

  return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
}

function queuePinchTransform(){

  if(pinchTransformQueued){
    return;
  }

  pinchTransformQueued = true;

  requestAnimationFrame(() => {
    pinchTransformQueued = false;
    pagesWrapper.style.transform = `scale(${pinchLiveScale})`;
  });
}

viewer.addEventListener("pointerdown", event => {

  if(event.pointerType !== "touch"){
    return;
  }

  pinchPointers.set(event.pointerId, { x:event.clientX, y:event.clientY });

  if(pinchPointers.size === 2){

    pinchGestureActive = true;

    // A second finger landing mid-tap should cancel tap-to-read,
    // not trigger it once the fingers lift.
    tapState.active = false;

    pinchStartDistance = getPinchPointerDistance();
    pinchStartZoomLevel = zoomLevel;
    pinchLiveScale = 1;

    // Fix the transform-origin, in #pagesWrapper's own untransformed
    // coordinate space, to wherever the viewer's center currently
    // sits. #pagesWrapper carries no transform at gesture start, so
    // getBoundingClientRect() here is a true, unscaled reference -
    // scaling around this point keeps it visually locked in place
    // for the whole live-preview phase, regardless of how tall the
    // document is or how far it's scrolled.
    const center = getViewportCenter();
    const wrapperRect = pagesWrapper.getBoundingClientRect();

    pagesWrapper.style.transformOrigin =
      `${center.x - wrapperRect.left}px ${center.y - wrapperRect.top}px`;

    viewer.classList.add("pinching");
  }

});

viewer.addEventListener("pointermove", event => {

  if(!pinchGestureActive || !pinchPointers.has(event.pointerId)){
    return;
  }

  pinchPointers.set(event.pointerId, { x:event.clientX, y:event.clientY });

  if(pinchPointers.size < 2 || pinchStartDistance <= 0){
    return;
  }

  event.preventDefault();

  const distance = getPinchPointerDistance();

  const targetZoom = Math.max(MIN_ZOOM_LEVEL, Math.min(MAX_ZOOM_LEVEL, pinchStartZoomLevel * (distance / pinchStartDistance)));

  // Live-preview scale is always relative to the zoom level the
  // gesture STARTED at, not the raw finger-distance ratio - this
  // is what keeps the preview correctly clamped once either zoom
  // limit is hit, instead of the transform continuing to grow (or
  // shrink) past what a real commit would ever allow, which is
  // what caused pinching out to get stuck at an unrecoverable
  // scale before.
  pinchLiveScale = targetZoom / pinchStartZoomLevel;

  zoomBox.value = `${Math.round(targetZoom * 100)}%`;

  queuePinchTransform();

});

async function commitPinchZoom(){

  const finalZoom = Math.max(MIN_ZOOM_LEVEL, Math.min(MAX_ZOOM_LEVEL, pinchStartZoomLevel * pinchLiveScale));

  pagesWrapper.style.transform = "none";

  zoomLevel = finalZoom;
  pinchLiveScale = 1;

  // Anchor the real re-render on the same viewport-center point the
  // live transform was scaling around, so swapping the transform
  // out for a true re-layout is seamless - no visual jump.
  await rescaleAndRender(getViewportCenter());
}

function endPinchPointer(event){

  if(!pinchPointers.has(event.pointerId)){
    return;
  }

  pinchPointers.delete(event.pointerId);

  if(pinchPointers.size < 2 && pinchGestureActive){

    pinchGestureActive = false;
    pinchStartDistance = 0;

    viewer.classList.remove("pinching");

    void commitPinchZoom();
  }
}

viewer.addEventListener("pointerup", endPinchPointer);
viewer.addEventListener("pointercancel", endPinchPointer);

/* ============================================================
   SEARCH TEXT NODES
============================================================ */

function getTextNodes(view){

  const nodes = [];

  const walker = document.createTreeWalker(

    view.textLayerDiv,

    NodeFilter.SHOW_TEXT,

    {
      acceptNode(node){

        if(!node.nodeValue || !node.nodeValue.length){
          return NodeFilter.FILTER_REJECT;
        }

        if(node.parentElement?.closest(".endOfContent")){
          return NodeFilter.FILTER_REJECT;
        }

        return NodeFilter.FILTER_ACCEPT;
      }
    }

  );

  let node;

  while((node = walker.nextNode())){
    nodes.push(node);
  }

  return nodes;
}

/* ============================================================
   SEARCH NORMALIZATION
============================================================ */

function normalizeSearchText(value){
  return String(value || "")
    .replace(/\u00a0/g, " ")
    .replace(/\s+/g, " ")
    .toLowerCase();
}

/* ============================================================
   RANGE -> LAYER-RELATIVE RECTS

   Shared by search highlighting and email-link overlays: given a
   DOM Range within a page's text layer, returns its client rects
   translated into coordinates relative to that page's overlay
   layers. All of a page's overlay layers (search, link, email)
   are absolutely positioned at inset:0 over the same page, so a
   single reference rect works for any of them.
============================================================ */

function getRelativeRects(view, startNode, startOffset, endNode, endOffset){

  const range = document.createRange();

  try{
    range.setStart(startNode, startOffset);
    range.setEnd(endNode, endOffset);
  }catch{
    return [];
  }

  const layerRect = view.searchLayerDiv.getBoundingClientRect();

  const rects = Array.from(range.getClientRects());

  const relative = [];

  for(const rect of rects){

    if(rect.width <= 0 || rect.height <= 0){
      continue;
    }

    relative.push({
      left: rect.left - layerRect.left,
      top: rect.top - layerRect.top,
      width: rect.width,
      height: rect.height
    });
  }

  return relative;
}

/* ============================================================
   FIND TEXT OCCURRENCES (generic)

   Walks a page's text layer for every occurrence of `query`
   (case-insensitive) and returns their layer-relative rects,
   without creating any DOM elements itself. Used both for
   search highlighting and for email-link overlays.
============================================================ */

function findTextOccurrences(view, query){

  if(!view || !query){
    return [];
  }

  const nodes = getTextNodes(view);

  if(!nodes.length){
    return [];
  }

  let fullText = "";

  const positions = [];

  for(const node of nodes){

    const nodeText = node.nodeValue || "";

    const start = fullText.length;

    fullText += nodeText;

    positions.push({ node, start, end: fullText.length });
  }

  const lowerText = fullText.toLowerCase();
  const lowerQuery = query.toLowerCase();

  const occurrences = [];

  let searchAt = 0;

  while(true){

    const matchStart = lowerText.indexOf(lowerQuery, searchAt);

    if(matchStart === -1){
      break;
    }

    const matchEnd = matchStart + lowerQuery.length;

    let startInfo = null;
    let endInfo = null;

    for(const info of positions){

      if(!startInfo && matchStart >= info.start && matchStart < info.end){
        startInfo = info;
      }

      if(matchEnd > info.start && matchEnd <= info.end){
        endInfo = info;
        break;
      }
    }

    if(startInfo && endInfo){

      const rects = getRelativeRects(
        view,
        startInfo.node,
        matchStart - startInfo.start,
        endInfo.node,
        matchEnd - endInfo.start
      );

      if(rects.length){

        occurrences.push({
          pageNumber: view.pageNumber,
          charStart: matchStart,
          rects
        });
      }
    }

    searchAt = matchStart + Math.max(1, lowerQuery.length);
  }

  return occurrences;
}

/* ============================================================
   SEARCH OCCURRENCES ON PAGE

   Thin wrapper around findTextOccurrences that additionally
   creates the visible highlight <div> elements in the page's
   search layer (search needs the elements themselves so it can
   mark the "current" one and scroll to it).
============================================================ */

function findOccurrencesOnPage(view, query){

  const matches = findTextOccurrences(view, query);

  const occurrences = [];

  for(const match of matches){

    const elements = [];

    for(const rect of match.rects){

      const highlight = document.createElement("div");

      highlight.className = "search-highlight";

      highlight.style.left = `${rect.left}px`;
      highlight.style.top = `${rect.top}px`;
      highlight.style.width = `${rect.width}px`;
      highlight.style.height = `${rect.height}px`;

      view.searchLayerDiv.appendChild(highlight);

      elements.push(highlight);
    }

    if(elements.length){

      occurrences.push({
        view,
        pageNumber: match.pageNumber,
        elements,
        charStart: match.charStart
      });
    }
  }

  return occurrences;
}

/* ============================================================
   CLEAR SEARCH HIGHLIGHTS
============================================================ */

function clearSearchHighlights(){

  for(const view of pageViews){

    if(view?.searchLayerDiv){
      view.searchLayerDiv.replaceChildren();
    }
  }
}

/* ============================================================
   SEARCH COUNTER
============================================================ */

function updateSearchCounter(){

  if(!searchResults.length){
    searchResultsLabel.textContent = lastSearchQuery ? "No results found" : "0 of 0";
    return;
  }

  if(currentSearch < 0){
    // Matches exist and are highlighted, but the person hasn't
    // navigated to one yet (typing never jumps automatically).
    searchResultsLabel.textContent = `${searchResults.length} found`;
    return;
  }

  searchResultsLabel.textContent = `${currentSearch + 1} of ${searchResults.length}`;
}

/* ============================================================
   MARK CURRENT SEARCH
============================================================ */

function markCurrentSearch(){

  for(const result of searchResults){
    for(const element of result.elements){
      element.classList.remove("search-current");
    }
  }

  if(currentSearch < 0 || currentSearch >= searchResults.length){
    return;
  }

  const result = searchResults[currentSearch];

  if(!result){
    return;
  }

  for(const element of result.elements){
    element.classList.add("search-current");
  }
}

/* ============================================================
   SCROLL SEARCH RESULT
============================================================ */

async function scrollToSearchResult(result){

  if(!result){
    return;
  }

  const view = result.view;

  if(!view){
    return;
  }

  await renderPage(view);

  await new Promise(resolve => requestAnimationFrame(resolve));

  const element = result.elements?.[0];

  if(!element){
    return;
  }

  const viewerRect = viewer.getBoundingClientRect();
  const elementRect = element.getBoundingClientRect();

  const viewerCenter = viewerRect.top + viewer.clientHeight / 2;
  const elementCenter = elementRect.top + elementRect.height / 2;

  viewer.scrollTop += elementCenter - viewerCenter;

  const finalRect = element.getBoundingClientRect();

  const topPadding = 20;
  const bottomPadding = readingMode ? 20 : 90;

  if(finalRect.top < viewerRect.top + topPadding){
    viewer.scrollTop += finalRect.top - (viewerRect.top + topPadding);
  }else if(finalRect.bottom > viewerRect.bottom - bottomPadding){
    viewer.scrollTop += finalRect.bottom - (viewerRect.bottom - bottomPadding);
  }

  pageInput.value = String(view.pageNumber);
}

/* ============================================================
   REBUILD SEARCH

   isNewSearch distinguishes two situations:

   - true:  the user actually changed the search text (typed a new
            query, or forced one via Enter). In this case we
            re-anchor the numbering to wherever the person is
            currently sitting in the document: the next match at
            or below the current scroll position becomes #1, and
            the list continues downward, wraps to the top, and
            ends just above where they started.

   - false: the highlights are being rebuilt for some other reason
            (currently: after a zoom change, since page geometry
            changes and highlight elements must be re-created). The
            query hasn't changed, so we preserve the previously
            established order and the previously active match
            instead of restarting the count at 1.
============================================================ */

async function rebuildSearchHighlights(query, generation, isNewSearch){

  if(!query || generation !== searchGeneration){
    return;
  }

  clearSearchHighlights();

  // Capture the reference scroll position up front, before any
  // rendering happens, so it reflects where the person actually was
  // when the search was kicked off. Highlighting never causes a
  // jump on its own — this reference is only used to decide which
  // match becomes "next" the first time the person actually
  // presses Enter or an arrow.
  const referenceScrollTop = isNewSearch ? viewer.scrollTop : null;

  const rawResults = [];

  for(let pageNumber = 1; pageNumber <= (pdfDoc?.numPages || 0); pageNumber++){

    if(generation !== searchGeneration){
      return;
    }

    const view = await ensurePageView(pageNumber);

    if(!view){
      continue;
    }

    await renderPage(view);

    if(generation !== searchGeneration){
      return;
    }

    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    if(generation !== searchGeneration){
      return;
    }

    const pageResults = findOccurrencesOnPage(view, query);

    if(pageResults.length){

      // Record each occurrence's absolute vertical position within
      // the scrollable viewer, so we can figure out which matches
      // are "at or below" the current scroll position.
      const viewerRect = viewer.getBoundingClientRect();

      for(const result of pageResults){

        const firstElement = result.elements[0];
        const elementRect = firstElement.getBoundingClientRect();

        result.docTop = (elementRect.top - viewerRect.top) + viewer.scrollTop;
      }

      rawResults.push(...pageResults);
    }
  }

  if(generation !== searchGeneration){
    return;
  }

  let orderedResults;
  let nextCurrentIndex;

  if(isNewSearch){

    let startIndex = rawResults.findIndex(result => result.docTop >= referenceScrollTop);

    if(startIndex === -1){
      startIndex = 0;
    }

    orderedResults = rawResults.slice(startIndex).concat(rawResults.slice(0, startIndex));

    searchOrderKeys = orderedResults.map(result => `${result.pageNumber}:${result.charStart}`);

    // A fresh search never auto-navigates — it only highlights.
    // currentSearch stays "unset" until the person presses Enter
    // or an arrow, at which point goToSearchResult() picks index 0
    // (the nearest next match) or the last index (the nearest
    // previous match), using the order established here.
    nextCurrentIndex = -1;

  }else{

    // Preserve the order and selection established by the last
    // real search, remapped onto the freshly-rebuilt occurrences.
    const byKey = new Map(rawResults.map(result => [`${result.pageNumber}:${result.charStart}`, result]));

    const preserved = [];

    for(const key of searchOrderKeys){

      const match = byKey.get(key);

      if(match){
        preserved.push(match);
        byKey.delete(key);
      }
    }

    // Anything left over (shouldn't normally happen for an
    // unchanged query) is appended in document order so nothing
    // found gets silently dropped.
    for(const result of rawResults){

      const key = `${result.pageNumber}:${result.charStart}`;

      if(byKey.has(key)){
        preserved.push(result);
        byKey.delete(key);
      }
    }

    orderedResults = preserved;

    searchOrderKeys = orderedResults.map(result => `${result.pageNumber}:${result.charStart}`);

    // Only restore a "current" match if one was actually active
    // before (i.e. the person had already navigated to it). If
    // nothing was active, stay unset rather than inventing a
    // selection — this rebuild (e.g. from zooming) never navigates
    // on its own either.
    nextCurrentIndex = activeResultKey
      ? orderedResults.findIndex(result => `${result.pageNumber}:${result.charStart}` === activeResultKey)
      : -1;
  }

  searchResults = orderedResults;
  lastSearchQuery = query;
  currentSearch = nextCurrentIndex;

  activeResultKey = currentSearch >= 0
    ? `${searchResults[currentSearch].pageNumber}:${searchResults[currentSearch].charStart}`
    : null;

  markCurrentSearch();
  updateSearchCounter();

  // Deliberately no auto-scroll here — highlighting the document
  // should never move the page. The view only jumps in response to
  // Enter (in the search box) or the up/down arrow buttons.
}

/* ============================================================
   RUN SEARCH NOW
   (shared by the debounce timer and by forced/immediate
   triggers like Enter or the nav arrows, so both paths go
   through the exact same busy-state bookkeeping and both
   are captured by currentSearchOperation)
============================================================ */

function runSearchNow(query, isNewSearch = true){

  searchGeneration++;

  const generation = searchGeneration;

  searchBusy = true;

  searchBox.classList.add("searching");

  searchResultsLabel.textContent = "Searching…";

  const operation = (async () => {

    try{

      await rebuildSearchHighlights(query, generation, isNewSearch);

    }catch(error){

      if(generation === searchGeneration){

        console.error("PDF search failed:", error);

        searchResults = [];
        currentSearch = -1;
        lastSearchQuery = query;
        searchOrderKeys = [];
        activeResultKey = null;

        clearSearchHighlights();

        searchResultsLabel.textContent = "No results found";
      }

    }finally{

      if(generation === searchGeneration){

        searchBusy = false;

        searchBox.classList.remove("searching");

        updateSearchCounter();
      }
    }

  })();

  currentSearchOperation = operation;

  return operation;
}

/* ============================================================
   SEARCH AS YOU TYPE
============================================================ */

const MIN_SEARCH_LENGTH = 3;

function scheduleSearch(){

  const query = searchBox.value.trim();

  clearTimeout(searchTimer);

  searchTimer = null;

  searchGeneration++;

  searchResults = [];
  currentSearch = -1;
  lastSearchQuery = "";
  searchOrderKeys = [];
  activeResultKey = null;

  clearSearchHighlights();

  if(query.length < MIN_SEARCH_LENGTH){

    // Too short to search yet (need more than 2 letters). Don't
    // touch the page — just let the person know to keep going.
    searchBusy = false;

    searchBox.classList.remove("searching");

    currentSearchOperation = Promise.resolve();

    searchResultsLabel.textContent = query.length > 0 ? "Keep typing…" : "0 of 0";

    return;
  }

  searchTimer = setTimeout(() => {

    searchTimer = null;

    // Every time the search text is updated, this is a fresh
    // search: highlighting re-anchors its ordering to wherever the
    // person is currently sitting in the document (but doesn't
    // move the page — see rebuildSearchHighlights).
    runSearchNow(query, true);

  }, 150);
}

/* ============================================================
   ENSURE QUERY SEARCHED
   Used before any navigation action (Enter key, prev/next
   arrows). If a debounce is still pending, run it right now
   instead of waiting. If a search is already in flight, wait
   for it. Either way, by the time this resolves the current
   searchBox value has been (or is being) searched.
============================================================ */

async function ensureQuerySearched(){

  const query = searchBox.value.trim();

  if(query.length < MIN_SEARCH_LENGTH){
    return false;
  }

  if(searchTimer !== null){

    clearTimeout(searchTimer);

    searchTimer = null;

    runSearchNow(query, true);

  }else if(query !== lastSearchQuery && !searchBusy){

    /*
       Query text doesn't match what's currently
       highlighted and nothing is in flight — search
       hasn't run for this text yet (e.g. programmatic
       value change). Run it now.
    */

    runSearchNow(query, true);
  }

  await currentSearchOperation;

  return Boolean(searchResults.length);
}

/* ============================================================
   LIVE RESULT POSITION

   Returns a result's current document-relative top position,
   measured fresh against the viewer right now. This is
   deliberately NOT the cached `result.docTop` from when
   highlights were built - that snapshot can go stale (the
   person may have scrolled, or layout may have settled
   slightly differently) by the time they actually press an
   arrow button, and navigating off a stale snapshot is what
   made forward navigation from an unset state unreliable.
============================================================ */

function getLiveResultDocTop(result){

  const element = result.elements?.[0];

  if(!element){
    return null;
  }

  const viewerRect = viewer.getBoundingClientRect();
  const elementRect = element.getBoundingClientRect();

  return (elementRect.top - viewerRect.top) + viewer.scrollTop;
}

/* ============================================================
   FIND CLOSEST RESULT

   Used the first time the person navigates after a fresh
   search (currentSearch is still unset). Scans all results
   using LIVE positions (not the build-time snapshot) and
   picks:

     - direction > 0 (next):     nearest match at/after the
                                  current scroll position
     - direction < 0 (previous): nearest match before it

   If nothing qualifies (e.g. every match is already behind
   us when going forward, or already ahead when going
   backward), it wraps around to the outermost match in that
   same direction, so navigation always lands somewhere.
============================================================ */

function findClosestResultIndex(direction){

  const referenceTop = viewer.scrollTop;

  let nearest = null;
  let extreme = null;

  for(let i = 0; i < searchResults.length; i++){

    const docTop = getLiveResultDocTop(searchResults[i]);

    if(docTop === null){
      continue;
    }

    const isAhead = direction > 0
      ? docTop >= referenceTop
      : docTop < referenceTop;

    if(isAhead){

      if(
        !nearest ||
        (direction > 0 ? docTop < nearest.docTop : docTop > nearest.docTop)
      ){
        nearest = { index:i, docTop };
      }
    }

    if(
      !extreme ||
      (direction > 0 ? docTop < extreme.docTop : docTop > extreme.docTop)
    ){
      extreme = { index:i, docTop };
    }
  }

  const chosen = nearest || extreme;

  return chosen ? chosen.index : -1;
}

/* ============================================================
   SEARCH NAVIGATION
============================================================ */

async function showSearchResult(index){

  if(!searchResults.length){
    return;
  }

  if(index < 0){
    index = searchResults.length - 1;
  }

  if(index >= searchResults.length){
    index = 0;
  }

  currentSearch = index;

  activeResultKey = `${searchResults[currentSearch].pageNumber}:${searchResults[currentSearch].charStart}`;

  markCurrentSearch();
  updateSearchCounter();

  await scrollToSearchResult(searchResults[currentSearch]);
}

async function goToSearchResult(direction){

  const hasResults = await ensureQuerySearched();

  if(!hasResults){
    return;
  }

  if(currentSearch < 0){

    // Nothing has been navigated to yet. Find the nearest match
    // in the requested direction using LIVE positions (see
    // findClosestResultIndex) rather than trusting the ordering
    // snapshot from when highlighting was built, which is what
    // made "next" unreliable as the very first navigation action.
    const index = findClosestResultIndex(direction);

    if(index === -1){
      return;
    }

    await showSearchResult(index);

  }else{

    await showSearchResult(currentSearch + direction);
  }
}

============================================================ */
