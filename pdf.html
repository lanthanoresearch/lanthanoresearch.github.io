/* ============================================================
   MOVEMENT LOCK (Free / Vertical)

   Mirrors the lock button from image.html: cycling between a
   free-panning mode (normal 2D scroll/pan) and a vertical-only
   mode that constrains scrolling/panning to the Y axis. Only
   these two states are offered here (no "horizontal" state,
   since a PDF's natural reading direction is vertical).
============================================================ */

let movementMode = "free";

function setMovementMode(mode){

  movementMode = mode;

  if(movementMode === "vertical"){

    lockButton.textContent = "↕ Vertical";
    lockButton.title = "Vertical-only scrolling (tap to switch to Free)";

    viewer.classList.add("vertical-lock");

  }else{

    lockButton.textContent = "✣ Free";
    lockButton.title = "Free scrolling (tap to switch to Vertical-only)";

    viewer.classList.remove("vertical-lock");
  }
}

lockButton.addEventListener("click", event => {
  event.stopPropagation();
  setMovementMode(movementMode === "free" ? "vertical" : "free");
});

/* ============================================================
   TAP TO READ
============================================================ */

let tapState = {
  active:false,
  moved:false,
  startX:0,
  startY:0
};

viewer.addEventListener("pointerdown", event => {

  if(
    event.target.closest(".textLayer") ||
    event.target.closest(".pdf-link") ||
    event.target.closest(".email-link") ||
    event.target.closest(".searchHighlightLayer")
  ){
    tapState.active = false;
    return;
  }

  const page = event.target.closest(".page");

  if(!page){
    tapState.active = false;
    return;
  }

  tapState.active = true;
  tapState.moved = false;
  tapState.startX = event.clientX;
  tapState.startY = event.clientY;

});

viewer.addEventListener("pointermove", event => {

  if(!tapState.active){
    return;
  }

  if(Math.hypot(event.clientX - tapState.startX, event.clientY - tapState.startY) > 10){
    tapState.moved = true;
  }
});

viewer.addEventListener("pointerup", event => {

  if(!tapState.active){
    return;
  }

  const moved = tapState.moved;

  tapState.active = false;

  if(moved){
    return;
  }

  if(
    event.target.closest(".textLayer") ||
    event.target.closest(".pdf-link") ||
    event.target.closest(".email-link") ||
    event.target.closest(".searchHighlightLayer")
  ){
    return;
  }

  // A tap on white space or the page image itself (i.e. anywhere
  // outside the text layer / links) should drop any active text
  // selection, the same way tapping on other text does. Without
  // this, selectionchange never fires here, so a selection made
  // earlier just sits there until the user happens to click into
  // more text.
  clearTextSelection();

  if(event.target.closest(".page")){
    setReadingMode(!readingMode);
  }
});

function clearTextSelection(){

  const selection = document.getSelection();

  if(selection && selection.toString().length){
    selection.removeAllRanges();
  }
}

// Tapping in the empty area around/between pages (outside any .page
// element entirely) never reaches the tap-to-read handler above,
// since that requires a .page ancestor - but it should still clear
// a lingering selection.
viewer.addEventListener("pointerup", event => {

  if(event.target.closest(".page")){
    return;
  }

  clearTextSelection();
});

/* ============================================================
   PINCH ZOOM

   Two phases, the same way native apps (and Adobe's own viewers)
   do it:

   1. LIVE PREVIEW - while fingers are actually moving, apply a
      pure CSS transform:scale() to #pagesWrapper. This costs
      nothing (no page re-layout, no re-render, fully
      GPU-composited) so it tracks your fingers with zero lag,
      but the underlying canvases are just being visually
      stretched, so it can look soft mid-gesture - exactly like
      every other touch PDF viewer.

   2. COMMIT - the instant the pinch ends (second finger lifts),
      the transform is removed and a single real re-layout runs
      at the final zoom level, producing a crisp render again.

   Both phases scale around the SAME fixed point - the center of
   the viewer - which is what "zoom toward the center always"
   means here: not the pinch midpoint (which would drift toward
   whichever edge your fingers happen to be biased toward), but
   the actual middle of the visible page area, every time,
   whether you're pinching or tapping +/-. Because both the live
   transform and the committed re-render share that same anchor,
   there's no jump/snap when the transform is swapped out for the
   real layout at the end.

   Only engages once a second touch point lands - a single finger
   is left untouched for normal scrolling / tap-to-read / text
   selection / the movement-lock panning above.
============================================================ */

const pinchPointers = new Map();

let pinchGestureActive = false;
let pinchStartDistance = 0;
let pinchStartZoomLevel = 1;
let pinchLiveScale = 1;
let pinchTransformQueued = false;
let pinchPointerIds = [];

function getViewportCenter(){

  const viewerRect = viewer.getBoundingClientRect();

  return {
    x: viewerRect.left + viewerRect.width / 2,
    y: viewerRect.top + viewerRect.height / 2
  };
}

function getPinchPointerDistance(){

  if(pinchPointerIds.length < 2){
    return 0;
  }

  const a = pinchPointers.get(pinchPointerIds[0]);
  const b = pinchPointers.get(pinchPointerIds[1]);

  if(!a || !b){
    return 0;
  }

  return Math.hypot(a.x - b.x, a.y - b.y);
}

function queuePinchTransform(){

  if(pinchTransformQueued){
    return;
  }

  pinchTransformQueued = true;

  requestAnimationFrame(() => {
    pinchTransformQueued = false;
    pagesWrapper.style.transform = `scale(${pinchLiveScale})`;
  });
}

viewer.addEventListener("pointerdown", event => {

  if(event.pointerType !== "touch"){
    return;
  }

  // Lock this pointer to #viewer for its whole lifetime. Without this,
  // a finger that drifts near the edge of #viewer mid-pinch can end up
  // delivering its pointerup/pointercancel to a different element,
  // which never reaches this handler - the pointer then stays stuck
  // in pinchPointers forever, corrupting the next gesture's distance
  // calc and flipping zoom direction.
  viewer.setPointerCapture(event.pointerId);

  pinchPointers.set(event.pointerId, { x:event.clientX, y:event.clientY });

  if(pinchPointers.size === 2){

    pinchGestureActive = true;

    pinchPointerIds = [...pinchPointers.keys()];

    // A second finger landing mid-tap should cancel tap-to-read,
    // not trigger it once the fingers lift.
    tapState.active = false;

    pinchStartDistance = getPinchPointerDistance();
    pinchStartZoomLevel = zoomLevel;
    pinchLiveScale = 1;

    // Fix the transform-origin, in #pagesWrapper's own untransformed
    // coordinate space, to wherever the viewer's center currently
    // sits. #pagesWrapper carries no transform at gesture start, so
    // getBoundingClientRect() here is a true, unscaled reference -
    // scaling around this point keeps it visually locked in place
    // for the whole live-preview phase, regardless of how tall the
    // document is or how far it's scrolled.
    const center = getViewportCenter();
    const wrapperRect = pagesWrapper.getBoundingClientRect();

    pagesWrapper.style.transformOrigin =
      `${center.x - wrapperRect.left}px ${center.y - wrapperRect.top}px`;

    viewer.classList.add("pinching");
  }

});



   viewer.addEventListener("pointermove", event => {

  if(!pinchGestureActive || !pinchPointerIds.includes(event.pointerId)){
    return;
  }

  pinchPointers.set(event.pointerId, { x:event.clientX, y:event.clientY });

  if(pinchStartDistance <= 0){
    return;
  }

  event.preventDefault();

  const distance = getPinchPointerDistance();

  const targetZoom = Math.max(MIN_ZOOM_LEVEL, Math.min(MAX_ZOOM_LEVEL, pinchStartZoomLevel * (distance / pinchStartDistance)));

  // Live-preview scale is always relative to the zoom level the
  // gesture STARTED at, not the raw finger-distance ratio - this
  // is what keeps the preview correctly clamped once either zoom
  // limit is hit, instead of the transform continuing to grow (or
  // shrink) past what a real commit would ever allow, which is
  // what caused pinching out to get stuck at an unrecoverable
  // scale before.
  pinchLiveScale = targetZoom / pinchStartZoomLevel;

  zoomBox.value = `${Math.round(targetZoom * 100)}%`;

  queuePinchTransform();

});

async function commitPinchZoom(){

  const finalZoom = Math.max(MIN_ZOOM_LEVEL, Math.min(MAX_ZOOM_LEVEL, pinchStartZoomLevel * pinchLiveScale));

  pagesWrapper.style.transform = "none";

  zoomLevel = finalZoom;
  pinchLiveScale = 1;

  // Anchor the real re-render on the same viewport-center point the
  // live transform was scaling around, so swapping the transform
  // out for a true re-layout is seamless - no visual jump.
  await rescaleAndRender(getViewportCenter());
}




   function endPinchPointer(event){

  if(!pinchPointers.has(event.pointerId)){
    return;
  }

  pinchPointers.delete(event.pointerId);

  if(pinchPointerIds.includes(event.pointerId) && pinchGestureActive){

    pinchGestureActive = false;
    pinchStartDistance = 0;
    pinchPointerIds = [];

    // Clear out any stray/extra pointers (e.g. a resting third
    // finger) so they can't pollute the next gesture.
    pinchPointers.clear();

    viewer.classList.remove("pinching");

    void commitPinchZoom();
  }
   }
   
   
viewer.addEventListener("pointerup", endPinchPointer);
viewer.addEventListener("pointercancel", endPinchPointer);

/* ============================================================
   CTRL+SCROLL ZOOM (desktop / trackpad)

   Reuses the exact same live-preview transform + commit pair as
   touch pinch above (pinchStartZoomLevel / pinchLiveScale /
   queuePinchTransform / commitPinchZoom) rather than duplicating
   that logic - a wheel gesture is treated as just another way of
   driving the same "zoom level + live scale" state. That also
   means it anchors to the same fixed point pinch and +/- do: the
   center of the viewer, never the cursor position, so zooming
   never drifts toward whichever edge the mouse happens to be on.

   Browsers report both "hold Ctrl and scroll" AND a trackpad pinch
   gesture as a wheel event with ctrlKey set to true (this is a
   deliberate, if slightly odd, browser convention - trackpad
   pinches don't have their own event type), so this one listener
   covers both PC ctrl+scroll and trackpad pinch-to-zoom for free.

   Individual wheel ticks are applied as a live transform
   immediately (no lag), then a short idle timer commits a real
   re-layout once scrolling actually stops - mirroring the
   live-preview/commit split pinch already uses, so rapid wheel
   zooming stays smooth instead of triggering a full page re-render
   on every single tick.
============================================================ */

let wheelZoomActive = false;
let wheelCommitTimer = null;

const WHEEL_ZOOM_SENSITIVITY = 0.0018;
const WHEEL_ZOOM_COMMIT_DELAY = 150;

viewer.addEventListener("wheel", event => {

  if(!event.ctrlKey && !event.metaKey){
    return;
  }

  // A two-finger touch pinch is already being handled by the
  // pointer handlers above - don't let a synthetic wheel event
  // (some browsers fire both) fight over the same live-scale state.
  if(pinchGestureActive){
    return;
  }

  event.preventDefault();

  if(!wheelZoomActive){

    wheelZoomActive = true;
    pinchStartZoomLevel = zoomLevel;
    pinchLiveScale = 1;

    const center = getViewportCenter();
    const wrapperRect = pagesWrapper.getBoundingClientRect();

    pagesWrapper.style.transformOrigin =
      `${center.x - wrapperRect.left}px ${center.y - wrapperRect.top}px`;
  }

  // Negative deltaY (scroll up / pinch out) should zoom in, so the
  // sign is flipped: exp() keeps repeated small ticks compounding
  // smoothly rather than linearly, matching how trackpad pinch
  // deltas actually feel.
  //
  // The raw factor is clamped to +/-12% PER EVENT before it's
  // applied, regardless of how big deltaY was. This matters because
  // browsers don't agree on what deltaY means for ctrl+wheel:
  // Chrome deliberately amplifies it (sometimes to several hundred)
  // since it assumes you want its own fast native zoom speed, while
  // a plain mouse's deltaMode can report in "lines" rather than
  // pixels. Without the clamp, one of those inflated deltas fed
  // straight into exp() could jump the zoom level from 100% to the
  // 25% floor (or the 300% ceiling) on a single tick. Clamping the
  // per-tick change keeps every event feeling like a normal
  // incremental step no matter which of those a given device/browser
  // sends - a real gesture is many events in a row anyway, so it
  // still reaches full speed almost immediately.
  const rawFactor = Math.exp(-event.deltaY * WHEEL_ZOOM_SENSITIVITY);
  const factor = Math.max(0.88, Math.min(1.12, rawFactor));

  const liveZoom = pinchStartZoomLevel * pinchLiveScale;
  const targetZoom = Math.max(MIN_ZOOM_LEVEL, Math.min(MAX_ZOOM_LEVEL, liveZoom * factor));

  pinchLiveScale = targetZoom / pinchStartZoomLevel;

  zoomBox.value = `${Math.round(targetZoom * 100)}%`;

  queuePinchTransform();

  clearTimeout(wheelCommitTimer);

  wheelCommitTimer = setTimeout(() => {
    wheelZoomActive = false;
    void commitPinchZoom();
  }, WHEEL_ZOOM_COMMIT_DELAY);

}, { passive:false });

/* ============================================================
   SEARCH TEXT NODES
============================================================ */

function getTextNodes(view){

  const nodes = [];

  const walker = document.createTreeWalker(

    view.textLayerDiv,

    NodeFilter.SHOW_TEXT,

    {
      acceptNode(node){

        if(!node.nodeValue || !node.nodeValue.length){
          return NodeFilter.FILTER_REJECT;
        }

        if(node.parentElement?.closest(".endOfContent")){
          return NodeFilter.FILTER_REJECT;
        }

        return NodeFilter.FILTER_ACCEPT;
      }
    }

  );

  let node;

  while((node = walker.nextNode())){
    nodes.push(node);
  }

  return nodes;
}

/* ============================================================
   SEARCH NORMALIZATION
============================================================ */

function normalizeSearchText(value){
  return String(value || "")
    .replace(/\u00a0/g, " ")
    .replace(/\s+/g, " ")
    .toLowerCase();
}

/* ============================================================
   RANGE -> LAYER-RELATIVE RECTS

   Shared by search highlighting and email-link overlays: given a
   DOM Range within a page's text layer, returns its client rects
   translated into coordinates relative to that page's overlay
   layers. All of a page's overlay layers (search, link, email)
   are absolutely positioned at inset:0 over the same page, so a
   single reference rect works for any of them.
============================================================ */

function getRelativeRects(view, startNode, startOffset, endNode, endOffset){

  const range = document.createRange();

  try{
    range.setStart(startNode, startOffset);
    range.setEnd(endNode, endOffset);
  }catch{
    return [];
  }

  const layerRect = view.searchLayerDiv.getBoundingClientRect();

  const rects = Array.from(range.getClientRects());

  const relative = [];

  for(const rect of rects){

    if(rect.width <= 0 || rect.height <= 0){
      continue;
    }

    relative.push({
      left: rect.left - layerRect.left,
      top: rect.top - layerRect.top,
      width: rect.width,
      height: rect.height
    });
  }

  return relative;
}

/* ============================================================
   FIND TEXT OCCURRENCES (generic)

   Walks a page's text layer for every occurrence of `query`
   (case-insensitive) and returns their layer-relative rects,
   without creating any DOM elements itself. Used both for
   search highlighting and for email-link overlays.
============================================================ */

function findTextOccurrences(view, query){

  if(!view || !query){
    return [];
  }

  const nodes = getTextNodes(view);

  if(!nodes.length){
    return [];
  }

  let fullText = "";

  const positions = [];

  for(const node of nodes){

    const nodeText = node.nodeValue || "";

    const start = fullText.length;

    fullText += nodeText;

    positions.push({ node, start, end: fullText.length });
  }

  const lowerText = fullText.toLowerCase();
  const lowerQuery = query.toLowerCase();

  const occurrences = [];

  let searchAt = 0;

  while(true){

    const matchStart = lowerText.indexOf(lowerQuery, searchAt);

    if(matchStart === -1){
      break;
    }

    const matchEnd = matchStart + lowerQuery.length;

    let startInfo = null;
    let endInfo = null;

    for(const info of positions){

      if(!startInfo && matchStart >= info.start && matchStart < info.end){
        startInfo = info;
      }

      if(matchEnd > info.start && matchEnd <= info.end){
        endInfo = info;
        break;
      }
    }

    if(startInfo && endInfo){

      const rects = getRelativeRects(
        view,
        startInfo.node,
        matchStart - startInfo.start,
        endInfo.node,
        matchEnd - endInfo.start
      );

      if(rects.length){

        occurrences.push({
          pageNumber: view.pageNumber,
          charStart: matchStart,
          rects
        });
      }
    }

    searchAt = matchStart + Math.max(1, lowerQuery.length);
  }

  return occurrences;
}

/* ============================================================
   SEARCH OCCURRENCES ON PAGE

   Thin wrapper around findTextOccurrences that additionally
   creates the visible highlight <div> elements in the page's
   search layer (search needs the elements themselves so it can
   mark the "current" one and scroll to it).
============================================================ */

function findOccurrencesOnPage(view, query){

  const matches = findTextOccurrences(view, query);

  const occurrences = [];

  for(const match of matches){

    const elements = [];

    for(const rect of match.rects){

      const highlight = document.createElement("div");

      highlight.className = "search-highlight";

      highlight.style.left = `${rect.left}px`;
      highlight.style.top = `${rect.top}px`;
      highlight.style.width = `${rect.width}px`;
      highlight.style.height = `${rect.height}px`;

      view.searchLayerDiv.appendChild(highlight);

      elements.push(highlight);
    }

    if(elements.length){

      occurrences.push({
        view,
        pageNumber: match.pageNumber,
        elements,
        charStart: match.charStart
      });
    }
  }

  return occurrences;
}

/* ============================================================
   CLEAR SEARCH HIGHLIGHTS
============================================================ */

function clearSearchHighlights(){

  for(const view of pageViews){

    if(view?.searchLayerDiv){
      view.searchLayerDiv.replaceChildren();
    }
  }
}

/* ============================================================
   SEARCH COUNTER
============================================================ */

function updateSearchCounter(){

  if(!searchResults.length){
    searchResultsLabel.textContent = lastSearchQuery ? "No results found" : "0 of 0";
    return;
  }

  if(currentSearch < 0){
    // Matches exist and are highlighted, but the person hasn't
    // navigated to one yet (typing never jumps automatically).
    searchResultsLabel.textContent = `${searchResults.length} found`;
    return;
  }

  searchResultsLabel.textContent = `${currentSearch + 1} of ${searchResults.length}`;
}

/* ============================================================
   MARK CURRENT SEARCH
============================================================ */

function markCurrentSearch(){

  for(const result of searchResults){
    for(const element of result.elements){
      element.classList.remove("search-current");
    }
  }

  if(currentSearch < 0 || currentSearch >= searchResults.length){
    return;
  }

  const result = searchResults[currentSearch];

  if(!result){
    return;
  }

  for(const element of result.elements){
    element.classList.add("search-current");
  }
}

/* ============================================================
   SCROLL SEARCH RESULT
============================================================ */

async function scrollToSearchResult(result){

  if(!result){
    return;
  }

  const view = result.view;

  if(!view){
    return;
  }

  await renderPage(view);

  await new Promise(resolve => requestAnimationFrame(resolve));

  const element = result.elements?.[0];

  if(!element){
    return;
  }

  const viewerRect = viewer.getBoundingClientRect();
  const elementRect = element.getBoundingClientRect();

  const viewerCenter = viewerRect.top + viewer.clientHeight / 2;
  const elementCenter = elementRect.top + elementRect.height / 2;

  viewer.scrollTop += elementCenter - viewerCenter;

  const finalRect = element.getBoundingClientRect();

  const topPadding = 20;
  const bottomPadding = readingMode ? 20 : 90;

  if(finalRect.top < viewerRect.top + topPadding){
    viewer.scrollTop += finalRect.top - (viewerRect.top + topPadding);
  }else if(finalRect.bottom > viewerRect.bottom - bottomPadding){
    viewer.scrollTop += finalRect.bottom - (viewerRect.bottom - bottomPadding);
  }

  pageInput.value = String(view.pageNumber);
}

/* ============================================================
   REBUILD SEARCH

   isNewSearch distinguishes two situations:

   - true:  the user actually changed the search text (typed a new
            query, or forced one via Enter). In this case we
            re-anchor the numbering to wherever the person is
            currently sitting in the document: the next match at
            or below the current scroll position becomes #1, and
            the list continues downward, wraps to the top, and
            ends just above where they started.

   - false: the highlights are being rebuilt for some other reason
            (currently: after a zoom change, since page geometry
            changes and highlight elements must be re-created). The
            query hasn't changed, so we preserve the previously
            established order and the previously active match
            instead of restarting the count at 1.
============================================================ */

async function rebuildSearchHighlights(query, generation, isNewSearch){

  if(!query || generation !== searchGeneration){
    return;
  }

  clearSearchHighlights();

  // Capture the reference scroll position up front, before any
  // rendering happens, so it reflects where the person actually was
  // when the search was kicked off. Highlighting never causes a
  // jump on its own — this reference is only used to decide which
  // match becomes "next" the first time the person actually
  // presses Enter or an arrow.
  const referenceScrollTop = isNewSearch ? viewer.scrollTop : null;

  const rawResults = [];

  for(let pageNumber = 1; pageNumber <= (pdfDoc?.numPages || 0); pageNumber++){

    if(generation !== searchGeneration){
      return;
    }

    const view = await ensurePageView(pageNumber);

    if(!view){
      continue;
    }

    await renderPage(view);

    if(generation !== searchGeneration){
      return;
    }

    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    if(generation !== searchGeneration){
      return;
    }

    const pageResults = findOccurrencesOnPage(view, query);

    if(pageResults.length){

      // Record each occurrence's absolute vertical position within
      // the scrollable viewer, so we can figure out which matches
      // are "at or below" the current scroll position.
      const viewerRect = viewer.getBoundingClientRect();

      for(const result of pageResults){

        const firstElement = result.elements[0];
        const elementRect = firstElement.getBoundingClientRect();

        result.docTop = (elementRect.top - viewerRect.top) + viewer.scrollTop;
      }

      rawResults.push(...pageResults);
    }
  }

  if(generation !== searchGeneration){
    return;
  }

  let orderedResults;
  let nextCurrentIndex;

  if(isNewSearch){

    let startIndex = rawResults.findIndex(result => result.docTop >= referenceScrollTop);

    if(startIndex === -1){
      startIndex = 0;
    }

    orderedResults = rawResults.slice(startIndex).concat(rawResults.slice(0, startIndex));

    searchOrderKeys = orderedResults.map(result => `${result.pageNumber}:${result.charStart}`);

    // A fresh search never auto-navigates — it only highlights.
    // currentSearch stays "unset" until the person presses Enter
    // or an arrow, at which point goToSearchResult() picks index 0
    // (the nearest next match) or the last index (the nearest
    // previous match), using the order established here.
    nextCurrentIndex = -1;

  }else{

    // Preserve the order and selection established by the last
    // real search, remapped onto the freshly-rebuilt occurrences.
    const byKey = new Map(rawResults.map(result => [`${result.pageNumber}:${result.charStart}`, result]));

    const preserved = [];

    for(const key of searchOrderKeys){

      const match = byKey.get(key);

      if(match){
        preserved.push(match);
        byKey.delete(key);
      }
    }

    // Anything left over (shouldn't normally happen for an
    // unchanged query) is appended in document order so nothing
    // found gets silently dropped.
    for(const result of rawResults){

      const key = `${result.pageNumber}:${result.charStart}`;

      if(byKey.has(key)){
        preserved.push(result);
        byKey.delete(key);
      }
    }

    orderedResults = preserved;

    searchOrderKeys = orderedResults.map(result => `${result.pageNumber}:${result.charStart}`);

    // Only restore a "current" match if one was actually active
    // before (i.e. the person had already navigated to it). If
    // nothing was active, stay unset rather than inventing a
    // selection — this rebuild (e.g. from zooming) never navigates
    // on its own either.
    nextCurrentIndex = activeResultKey
      ? orderedResults.findIndex(result => `${result.pageNumber}:${result.charStart}` === activeResultKey)
      : -1;
  }

  searchResults = orderedResults;
  lastSearchQuery = query;
  currentSearch = nextCurrentIndex;

  activeResultKey = currentSearch >= 0
    ? `${searchResults[currentSearch].pageNumber}:${searchResults[currentSearch].charStart}`
    : null;

  markCurrentSearch();
  updateSearchCounter();

  // Deliberately no auto-scroll here — highlighting the document
  // should never move the page. The view only jumps in response to
  // Enter (in the search box) or the up/down arrow buttons.
}

/* ============================================================
   RUN SEARCH NOW
   (shared by the debounce timer and by forced/immediate
   triggers like Enter or the nav arrows, so both paths go
   through the exact same busy-state bookkeeping and both
   are captured by currentSearchOperation)
============================================================ */

function runSearchNow(query, isNewSearch = true){

  searchGeneration++;

  const generation = searchGeneration;

  searchBusy = true;

  searchBox.classList.add("searching");

  searchResultsLabel.textContent = "Searching…";

  const operation = (async () => {

    try{

      await rebuildSearchHighlights(query, generation, isNewSearch);

    }catch(error){

      if(generation === searchGeneration){

        console.error("PDF search failed:", error);

        searchResults = [];
        currentSearch = -1;
        lastSearchQuery = query;
        searchOrderKeys = [];
        activeResultKey = null;

        clearSearchHighlights();

        searchResultsLabel.textContent = "No results found";
      }

    }finally{

      if(generation === searchGeneration){

        searchBusy = false;

        searchBox.classList.remove("searching");

        updateSearchCounter();
      }
    }

  })();

  currentSearchOperation = operation;

  return operation;
}

/* ============================================================
   SEARCH AS YOU TYPE
============================================================ */

const MIN_SEARCH_LENGTH = 3;

function scheduleSearch(){

  const query = searchBox.value.trim();

  clearTimeout(searchTimer);

  searchTimer = null;

  searchGeneration++;

  searchResults = [];
  currentSearch = -1;
  lastSearchQuery = "";
  searchOrderKeys = [];
  activeResultKey = null;

  clearSearchHighlights();

  if(query.length < MIN_SEARCH_LENGTH){

    // Too short to search yet (need more than 2 letters). Don't
    // touch the page — just let the person know to keep going.
    searchBusy = false;

    searchBox.classList.remove("searching");

    currentSearchOperation = Promise.resolve();

    searchResultsLabel.textContent = query.length > 0 ? "Keep typing…" : "0 of 0";

    return;
  }

  searchTimer = setTimeout(() => {

    searchTimer = null;

    // Every time the search text is updated, this is a fresh
    // search: highlighting re-anchors its ordering to wherever the
    // person is currently sitting in the document (but doesn't
    // move the page — see rebuildSearchHighlights).
    runSearchNow(query, true);

  }, 150);
}

/* ============================================================
   ENSURE QUERY SEARCHED
   Used before any navigation action (Enter key, prev/next
   arrows). If a debounce is still pending, run it right now
   instead of waiting. If a search is already in flight, wait
   for it. Either way, by the time this resolves the current
   searchBox value has been (or is being) searched.
============================================================ */

async function ensureQuerySearched(){

  const query = searchBox.value.trim();

  if(query.length < MIN_SEARCH_LENGTH){
    return false;
  }

  if(searchTimer !== null){

    clearTimeout(searchTimer);

    searchTimer = null;

    runSearchNow(query, true);

  }else if(query !== lastSearchQuery && !searchBusy){

    /*
       Query text doesn't match what's currently
       highlighted and nothing is in flight — search
       hasn't run for this text yet (e.g. programmatic
       value change). Run it now.
    */

    runSearchNow(query, true);
  }

  await currentSearchOperation;

  return Boolean(searchResults.length);
}

/* ============================================================
   LIVE RESULT POSITION

   Returns a result's current document-relative top position,
   measured fresh against the viewer right now. This is
   deliberately NOT the cached `result.docTop` from when
   highlights were built - that snapshot can go stale (the
   person may have scrolled, or layout may have settled
   slightly differently) by the time they actually press an
   arrow button, and navigating off a stale snapshot is what
   made forward navigation from an unset state unreliable.
============================================================ */

function getLiveResultDocTop(result){

  const element = result.elements?.[0];

  if(!element){
    return null;
  }

  const viewerRect = viewer.getBoundingClientRect();
  const elementRect = element.getBoundingClientRect();

  return (elementRect.top - viewerRect.top) + viewer.scrollTop;
}

/* ============================================================
   FIND CLOSEST RESULT

   Used the first time the person navigates after a fresh
   search (currentSearch is still unset). Scans all results
   using LIVE positions (not the build-time snapshot) and
   picks:

     - direction > 0 (next):     nearest match at/after the
                                  current scroll position
     - direction < 0 (previous): nearest match before it

   If nothing qualifies (e.g. every match is already behind
   us when going forward, or already ahead when going
   backward), it wraps around to the outermost match in that
   same direction, so navigation always lands somewhere.
============================================================ */

function findClosestResultIndex(direction){

  const referenceTop = viewer.scrollTop;

  let nearest = null;
  let extreme = null;

  for(let i = 0; i < searchResults.length; i++){

    const docTop = getLiveResultDocTop(searchResults[i]);

    if(docTop === null){
      continue;
    }

    const isAhead = direction > 0
      ? docTop >= referenceTop
      : docTop < referenceTop;

    if(isAhead){

      if(
        !nearest ||
        (direction > 0 ? docTop < nearest.docTop : docTop > nearest.docTop)
      ){
        nearest = { index:i, docTop };
      }
    }

    if(
      !extreme ||
      (direction > 0 ? docTop < extreme.docTop : docTop > extreme.docTop)
    ){
      extreme = { index:i, docTop };
    }
  }

  const chosen = nearest || extreme;

  return chosen ? chosen.index : -1;
}

/* ============================================================
   SEARCH NAVIGATION
============================================================ */

async function showSearchResult(index){

  if(!searchResults.length){
    return;
  }

  if(index < 0){
    index = searchResults.length - 1;
  }

  if(index >= searchResults.length){
    index = 0;
  }

  currentSearch = index;

  activeResultKey = `${searchResults[currentSearch].pageNumber}:${searchResults[currentSearch].charStart}`;

  markCurrentSearch();
  updateSearchCounter();

  await scrollToSearchResult(searchResults[currentSearch]);
}

async function goToSearchResult(direction){

  const hasResults = await ensureQuerySearched();

  if(!hasResults){
    return;
  }

  if(currentSearch < 0){

    // Nothing has been navigated to yet. Find the nearest match
    // in the requested direction using LIVE positions (see
    // findClosestResultIndex) rather than trusting the ordering
    // snapshot from when highlighting was built, which is what
    // made "next" unreliable as the very first navigation action.
    const index = findClosestResultIndex(direction);

    if(index === -1){
      return;
    }

    await showSearchResult(index);

  }else{

    await showSearchResult(currentSearch + direction);
  }
}

   SEARCH INPUT

searchBox.addEventListener("input", () => {
  scheduleSearch();
});

searchBox.addEventListener("keydown", async event => {

  if(event.key === "Escape"){
    event.preventDefault();
    closeSearch();
    return;
  }

  if(event.key === "Enter"){
    event.preventDefault();
    await goToSearchResult(event.shiftKey ? -1 : 1);
  }
});

   OPEN SEARCH

document.getElementById("searchButton").addEventListener("click", event => {

  event.stopPropagation();

  closeToc();

/* ============================================================
   OUTSIDE SEARCH CLICK = CANCEL SEARCH

   A direct tap outside the search popup cancels the search. A
   scroll or drag must NOT cancel it — so this tracks whether the
   pointer actually moved between down and up, the same way the
   reading-mode tap detection above does, and only treats it as a
   "click" (and closes the search) when it didn't.
============================================================ */

let searchOutsideTap = {
  active:false,
  moved:false,
  startX:0,
  startY:0
};

document.addEventListener("pointerdown", event => {

  if(searchPopup.classList.contains("hidden")){
    searchOutsideTap.active = false;
    return;
  }

  searchOutsideTap.active = true;
  searchOutsideTap.moved = false;
  searchOutsideTap.startX = event.clientX;
  searchOutsideTap.startY = event.clientY;

});

document.addEventListener("pointermove", event => {

  if(!searchOutsideTap.active){
    return;
  }

  if(Math.hypot(event.clientX - searchOutsideTap.startX, event.clientY - searchOutsideTap.startY) > 10){
    searchOutsideTap.moved = true;
  }

});

document.addEventListener("pointerup", event => {

  if(!searchOutsideTap.active){
    return;
  }

  const moved = searchOutsideTap.moved;

  searchOutsideTap.active = false;

  if(moved){
    // Was a scroll/drag, not a click — leave the search open.
    return;
  }

  if(searchPopup.classList.contains("hidden")){
    return;
  }

  if(searchPopup.contains(event.target)){
    return;
  }

  if(event.target.closest("#searchButton")){
    return;
  }

  closeSearch();

});

/* ============================================================
   TABLE OF CONTENTS

   Populated after the PDF loads (see LOAD PDF below), from
   pdfDoc.getOutline(). The button is always visible (floating,
   outside the toolbar, so it survives reading mode too): if the
   document has an outline, tapping it opens a full panel of
   clickable links - each showing the page it jumps to - that
   jump to each destination; if it doesn't, tapping it explains
   that plainly instead of doing nothing, so the missing panel
   doesn't look like a bug.

   Nesting depth is expressed purely through CSS (see the
   .tocList .tocList ... selectors in <style>): each list is
   rendered with the exact same markup regardless of depth, and
   the browser's own ancestor matching handles the size/weight/
   color step-down automatically as renderTocList recurses.
============================================================ */

function renderTocList(items, container){

  const list = document.createElement("ul");

  list.className = "tocList";

  for(const item of items){

    const li = document.createElement("li");

    if(item.dest){

      const button = document.createElement("button");

      button.type = "button";

      const titleSpan = document.createElement("span");

      titleSpan.className = "tocItemTitle";
      titleSpan.textContent = item.title || "Untitled section";

      const pageSpan = document.createElement("span");

      pageSpan.className = "tocItemPage";

      button.appendChild(titleSpan);
      button.appendChild(pageSpan);

      button.addEventListener("click", async () => {
        await openInternalDestination(item.dest);
        closeToc();
      });

      li.appendChild(button);

      // Resolving a destination to a page number is async (it may
      // need pdfDoc.getDestination + getPageIndex), so it's kicked
      // off without blocking the rest of the list from rendering -
      // the page number just fills in a moment later.
      resolveDestination(item.dest).then(pageIndex => {

        if(pageIndex !== null){
          pageSpan.textContent = String(pageIndex + 1);
        }

      });

    }else{

      const label = document.createElement("div");

      label.className = "tocLabelOnly";
      label.textContent = item.title || "Untitled section";

      li.appendChild(label);
    }

    if(Array.isArray(item.items) && item.items.length){
      renderTocList(item.items, li);
    }

    list.appendChild(li);
  }

  container.appendChild(list);
}

function setupTocButton(outlineItems){

  const hasToc = Array.isArray(outlineItems) && outlineItems.length > 0;

  tocContent.innerHTML = "";

}

/* ============================================================
   ZOOM
============================================================ */

/*
   anchorPoint (optional): a viewport-space {x,y} point (e.g. from
   getViewportCenter()) that should stay visually fixed across the
   rescale. Defaults to the viewer's own center, so every zoom
   action - toolbar +/-, manual %, fit width/page, and a committed
   pinch - always zooms "toward the middle" instead of drifting
   toward whichever edge the content happens to grow from.

   The anchor is tracked as a FRACTION of whichever page it's
   currently sitting over (findAnchorPage), not as a raw scroll-
   space pixel coordinate. A pixel-math approach has to separately
   account for every source of "space that doesn't scale with the
   page" - the viewer's own padding, the centering gap around a page
   narrower than the viewport, and the fixed 20px margin between
   every pair of stacked pages - and that last one accumulates once
   per page above the anchor, so any small mistake gets worse the
   further down the document you are. Anchoring to a fraction of a
   specific page's box sidesteps all of that: offsetLeft/offsetTop
   (read after the pages have been re-laid-out at the new scale) are
   the browser's own computed position of that page within #viewer's
   scrollable content, already correctly accounting for every page
   above it, however many there are.
*/

function findAnchorPage(point){

  let fallback = null;
  let fallbackDistance = Infinity;

  for(const view of pageViews){

    if(!view){
      continue;
    }

    const rect = view.pageDiv.getBoundingClientRect();

    if(rect.width <= 0 || rect.height <= 0){
      continue;
    }

    const withinX = point.x >= rect.left && point.x <= rect.right;
    const withinY = point.y >= rect.top && point.y <= rect.bottom;

    if(withinX && withinY){
      return {
        view,
        fracX: (point.x - rect.left) / rect.width,
        fracY: (point.y - rect.top) / rect.height
      };
    }

    // The anchor can land in the 20px gap between pages (or above
    // the first / below the last) - fall back to whichever page is
    // vertically closest, clamped to its own box, rather than
    // giving up on anchoring entirely.
    const distance = point.y < rect.top ? rect.top - point.y : point.y > rect.bottom ? point.y - rect.bottom : 0;

    if(distance < fallbackDistance){

      fallbackDistance = distance;

      fallback = {
        view,
        fracX: Math.max(0, Math.min(1, (point.x - rect.left) / rect.width)),
        fracY: Math.max(0, Math.min(1, (point.y - rect.top) / rect.height))
      };
    }
  }

  return fallback;
}

async function rescaleAndRender(anchorPoint){

  renderGeneration++;

  currentScale = baseScale * zoomLevel;

  if(currentScale <= 0){
    currentScale = 1;
  }

  zoomBox.value = `${Math.round(zoomLevel * 100)}%`;

  const point = anchorPoint || getViewportCenter();

  const viewerRect = viewer.getBoundingClientRect();

  const anchorViewerX = point.x - viewerRect.left;
  const anchorViewerY = point.y - viewerRect.top;

  // Read BEFORE the layout loop below resizes every page div - the
  // bounding rects here still reflect the current (pre-rescale)
  // layout.
  const anchor = findAnchorPage(point);

  for(const view of pageViews){

    if(!view){
      continue;
    }

    layoutPage(view, currentScale);
    resetRenderedPage(view);
  }

  updateWrapperWidth();

  renderNearbyPages();

  requestAnimationFrame(async () => {

    const maxScrollLeft = Math.max(0, viewer.scrollWidth - viewer.clientWidth);
    const maxScrollTop = Math.max(0, viewer.scrollHeight - viewer.clientHeight);

    if(anchor){

      const targetX = anchor.view.pageDiv.offsetLeft + anchor.fracX * anchor.view.pageDiv.offsetWidth;
      const targetY = anchor.view.pageDiv.offsetTop + anchor.fracY * anchor.view.pageDiv.offsetHeight;

      viewer.scrollLeft = Math.max(0, Math.min(maxScrollLeft, targetX - anchorViewerX));
      viewer.scrollTop = Math.max(0, Math.min(maxScrollTop, targetY - anchorViewerY));
    }

    if(lastSearchQuery){

      // Not a new search — just re-creating highlights at the new
      // scale — so preserve the existing order/selection instead
      // of re-anchoring numbering to the current scroll position.
      runSearchNow(lastSearchQuery, false);

      await currentSearchOperation;
    }

    updateSideScroller();

  });
}

});

document.getElementById("zoomOut").addEventListener("click", async () => {

});

/* ============================================================
   SIDE SCROLLER

   Keeps the draggable thumb's size/position in sync with the
   viewer's actual scroll state, and lets the person drag it (or
   tap the track) to scroll the document instead of using the
   native scrollbar / touch-scrolling. While dragging (or pressing
   the track), a small floating badge next to the thumb shows
   which page that position corresponds to, so it's easy to "fly"
   to the right spot without watching the document itself.
============================================================ */

const MIN_SCROLLER_THUMB_HEIGHT = 34;

function getNearestVisiblePage(){

  if(!pageViews.length){
    return 1;
  }

  const viewerRect = viewer.getBoundingClientRect();

  let currentPage = 1;
  let bestDistance = Infinity;

  for(const view of pageViews){

    if(!view){
      continue;
    }

    const rect = view.pageDiv.getBoundingClientRect();

    const distance = Math.abs(rect.top - viewerRect.top - 8);

    if(distance < bestDistance){
      bestDistance = distance;
      currentPage = view.pageNumber;
    }
  }

  return currentPage;
}

function updateSideScroller(){

  if(!pageViews.length || viewer.scrollHeight <= viewer.clientHeight + 1){

    sideScroller.style.display = "none";

    return;
  }

  sideScroller.style.display = "flex";

  const trackHeight = sideScrollerTrack.clientHeight;

  if(trackHeight <= 0){
    return;
  }

  const visibleRatio = viewer.clientHeight / viewer.scrollHeight;

  const thumbHeight = Math.min(
    trackHeight,
    Math.max(MIN_SCROLLER_THUMB_HEIGHT, trackHeight * visibleRatio)
  );

  const maxScrollTop = viewer.scrollHeight - viewer.clientHeight;
  const scrollRatio = maxScrollTop > 0 ? viewer.scrollTop / maxScrollTop : 0;

  const maxThumbTop = trackHeight - thumbHeight;

  sideScrollerThumb.style.height = `${thumbHeight}px`;
  sideScrollerThumb.style.top = `${scrollRatio * maxThumbTop}px`;
}

/*
   Positions and refreshes the page-number badge to track the
   thumb's current vertical position, using whatever page is
   nearest the top of the viewer right now.
*/
function updateScrollerBadge(){

  const thumbTop = sideScrollerThumb.offsetTop + sideScrollerThumb.offsetHeight / 2;

  sideScrollerPageBadge.style.top = `${thumbTop}px`;

  const pageNumber = getNearestVisiblePage();
  const totalPages = pdfDoc?.numPages;

  sideScrollerPageBadge.textContent = totalPages
    ? `Page ${pageNumber} of ${totalPages}`
    : `Page ${pageNumber}`;
}

/*
   Dragging the thumb: pointer capture keeps receiving move/up
   events even if the pointer strays off the thin thumb element,
   which matters a lot on touch.
*/

let scrollerDrag = {
  active:false,
  startY:0,
  startScrollTop:0,
  thumbHeight:0,
  trackHeight:0
};

sideScrollerThumb.addEventListener("pointerdown", event => {

  event.preventDefault();
  event.stopPropagation();

  scrollerDrag.active = true;
  scrollerDrag.startY = event.clientY;
  scrollerDrag.startScrollTop = viewer.scrollTop;
  scrollerDrag.thumbHeight = sideScrollerThumb.offsetHeight;
  scrollerDrag.trackHeight = sideScrollerTrack.clientHeight;

  sideScrollerThumb.classList.add("dragging");
  sideScrollerPageBadge.classList.add("visible");

  updateScrollerBadge();

  try{
    sideScrollerThumb.setPointerCapture(event.pointerId);
  }catch{}

});

sideScrollerThumb.addEventListener("pointermove", event => {

  if(!scrollerDrag.active){
    return;
  }

  const maxThumbTop = scrollerDrag.trackHeight - scrollerDrag.thumbHeight;
  const maxScrollTop = viewer.scrollHeight - viewer.clientHeight;

  if(maxThumbTop <= 0 || maxScrollTop <= 0){
    return;
  }

  const deltaY = event.clientY - scrollerDrag.startY;
  const scrollDelta = (deltaY / maxThumbTop) * maxScrollTop;

  viewer.scrollTop = Math.max(
    0,
    Math.min(maxScrollTop, scrollerDrag.startScrollTop + scrollDelta)
  );

  // Reposition the thumb itself right away. Don't wait for the
  // viewer's "scroll" event to do it - that event can lag behind
  // (or get coalesced) during a fast drag, which is why the thumb
  // used to stay put until you let go and scrolled again.
  updateSideScroller();

  // Keep the page-number badge glued to the thumb and current as
  // the drag flies across pages.
  updateScrollerBadge();

});

function endScrollerDrag(event){

  if(!scrollerDrag.active){
    return;
  }

  scrollerDrag.active = false;

  sideScrollerThumb.classList.remove("dragging");
  sideScrollerPageBadge.classList.remove("visible");

  try{
    sideScrollerThumb.releasePointerCapture(event.pointerId);
  }catch{}
}

sideScrollerThumb.addEventListener("pointerup", endScrollerDrag);
sideScrollerThumb.addEventListener("pointercancel", endScrollerDrag);

/*
   Tapping the track itself (not the thumb) jumps the thumb -
   and the document - to that position. Briefly flashes the same
   page-number badge so a tap-to-jump gives the same feedback a
   drag does.
*/

sideScrollerTrack.addEventListener("pointerdown", event => {

  if(event.target === sideScrollerThumb){
    return;
  }

  const trackRect = sideScrollerTrack.getBoundingClientRect();
  const thumbHeight = sideScrollerThumb.offsetHeight;

  const maxThumbTop = sideScrollerTrack.clientHeight - thumbHeight;
  const maxScrollTop = viewer.scrollHeight - viewer.clientHeight;

  if(maxThumbTop <= 0 || maxScrollTop <= 0){
    return;
  }

  const clickY = event.clientY - trackRect.top;

  const targetThumbTop = Math.max(
    0,
    Math.min(maxThumbTop, clickY - thumbHeight / 2)
  );

  viewer.scrollTop = (targetThumbTop / maxThumbTop) * maxScrollTop;

  updateSideScroller();

  sideScrollerPageBadge.classList.add("visible");

  updateScrollerBadge();

  clearTimeout(sideScrollerTrack._badgeHideTimer);

  sideScrollerTrack._badgeHideTimer = setTimeout(() => {
    sideScrollerPageBadge.classList.remove("visible");
  }, 700);

});

/* ============================================================
   CURRENT PAGE
============================================================ */

viewer.addEventListener("scroll", () => {

  if(!pageViews.length){
    return;
  }

  pageInput.value = String(getNearestVisiblePage());

  renderNearbyPages();

});

/* ============================================================
   RESIZE
============================================================ */

let resizeTimer = null;

/*
   Mobile browsers constantly fire "resize" events purely because
   their address bar/toolbar shows or hides while the page is
   scrolled - the viewport HEIGHT changes but the WIDTH (the only
   thing that affects fit-width layout here) does not. Previously
   every one of those benign resizes triggered a full
   wipe-and-rebuild (rescaleAndRender -> resetRenderedPage for
   every page), which throws away every page's canvas, text layer,
   and search highlights and re-renders the whole document from
   scratch. If a search was active, this meant scrolling the
   document - completely unrelated to zoom or search - would wipe
   the current highlight mid-navigation and leave it blank until
   the person stopped scrolling long enough for a full rebuild to
   finish. Tracking width separately lets us skip that entirely
   when only the toolbar moved.
*/

let lastKnownInnerWidth = window.innerWidth;

window.addEventListener("resize", () => {

  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(async () => {

    syncViewerTop();
    syncReadBarLift();

    if(!pageViews.length){
      return;
    }

    const widthChanged = window.innerWidth !== lastKnownInnerWidth;

    lastKnownInnerWidth = window.innerWidth;

    if(!widthChanged){
      // Height-only change (mobile chrome show/hide from scrolling,
      // virtual keyboard, etc). Nothing that affects page layout
      // actually changed, so don't touch rendered pages or search
      // highlights.
      return;
    }

    if(window.innerWidth <= 768){

      const firstView = pageViews.find(Boolean);

      if(firstView){
        baseScale = getFitWidthScale(firstView.page);
      }
    }

    await rescaleAndRender();

    updateSideScroller();

  }, 150);
});

/* ============================================================
   CHROME RESIZE OBSERVER
============================================================ */

if("ResizeObserver" in window){

  const chromeObserver = new ResizeObserver(() => {
    syncViewerTop();
    syncBottomGap();
    syncReadBarLift();
  });

  chromeObserver.observe(header);
  chromeObserver.observe(toolbar);
  chromeObserver.observe(titleBar);
  chromeObserver.observe(readAloudControls);
}

scheduleChromeSync();

/* ============================================================
   LOAD PDF
============================================================ */

try{

  if(!file){
    throw new Error("No PDF file was supplied.");
  }

  syncViewerTop();

  const loadingTask = getDocument({
    url:file,
    disableAutoFetch:false,
    disableStream:false
  });

  pdfDoc = await loadingTask.promise;

  document.getElementById("pageCount").textContent = `of ${pdfDoc.numPages}`;

  // Fetch the outline (table of contents) up front. A document
  // with no outline resolves to null, not an error — either way
  // the TOC button is set up so the person always gets a clear
  // answer when they tap it.
  let outlineItems = null;

  try{
    outlineItems = await pdfDoc.getOutline();
  }catch(error){
    console.warn("Could not load outline:", error);
    outlineItems = null;
  }

  setupTocButton(outlineItems);

  const firstPage = await pdfDoc.getPage(1);

  baseScale = getFitWidthScale(firstPage);
  zoomLevel = 1;
  currentScale = baseScale;

  const firstView = createPageShell(1, firstPage);

  layoutPage(firstView, currentScale);
  updateWrapperWidth();

  pageObserver.observe(firstView.pageDiv);

  syncViewerTop();

  await renderPage(firstView);

  loadingOverlay.style.display = "none";

  updateSideScroller();

  void (async () => {

    for(let pageNumber = 2; pageNumber <= pdfDoc.numPages; pageNumber++){

      try{

        if(pageViews[pageNumber - 1]){
          continue;
        }

        const page = await pdfDoc.getPage(pageNumber);

        const view = createPageShell(pageNumber, page);

        layoutPage(view, currentScale);
        updateWrapperWidth();

        pageObserver.observe(view.pageDiv);

        const viewerRect = viewer.getBoundingClientRect();
        const pageRect = view.pageDiv.getBoundingClientRect();

        if(pageRect.top <= viewerRect.bottom + 1400){
          void renderPage(view);
        }

        updateSideScroller();

        await new Promise(resolve => setTimeout(resolve, 0));

      }catch(error){
        console.warn(`Could not initialize page ${pageNumber}:`, error);
      }
    }

  })();

}catch(error){

  console.error("PDF loading failed:", error);

  loadingOverlay.style.display = "none";

  viewer.innerHTML = `
    <div style="color:#fff;padding:40px;text-align:center;max-width:600px;">
      <h2>Unable to load PDF</h2>
      <p>${escapeHtml(error?.message || "Unknown error.")}</p>
    </div>
  `;
}

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener("beforeunload", () => {

  renderGeneration++;
  searchGeneration++;

  clearTimeout(searchTimer);

  if(SUPPORTS_SPEECH){
    try{
      reading.generation++;
      clearTimeout(reading.gapTimer);
      window.speechSynthesis.cancel();
    }catch{}
  }

  for(const view of pageViews){

    if(!view){
      continue;
    }

    try{
      pageObserver.unobserve(view.pageDiv);
    }catch{}

    try{
      view.canvas.width = 1;
      view.canvas.height = 1;
    }catch{}
  }

  try{
    if(pdfDoc){
      pdfDoc.destroy();
    }
  }catch{}
});

/*
   Back-forward cache (bfcache) restore.

   The browser's back button doesn't always do a real navigation -
   it can freeze the page into bfcache instead, then resume that
   frozen snapshot with no script re-run. beforeunload above still
   fires right before that freeze, so by the time the page is
   resumed its canvases are already zeroed and pdfDoc already
   destroyed - the PDF renders solid black because nothing
   re-initializes it.

   pageshow fires on both a normal load and a bfcache restore;
   event.persisted is true only for the latter, so only then do we
   force a full reload to get a clean, freshly-initialized page.
*/
window.addEventListener("pageshow", event => {
  if(event.persisted){
    location.reload();
  }
});

</script>
</body>
</html>
