<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="./pdfjs/web/text_layer_builder.css">
<link rel="stylesheet" href="./pdfjs/web/annotation_layer_builder.css">
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Viewer</title>

<style>

/* =========================================================
   BASE
========================================================= */

:root{
    --bg:#111;
    --panel:#1d1d1d;
    --text:#eee;
    --muted:#aaa;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;

    background:var(--bg);
    color:var(--text);

    font-family:Arial,sans-serif;

    overflow:hidden;
}


/* =========================================================
   FIXED HEADER
========================================================= */

header{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:#181818;

    border-bottom:1px solid #2d2d2d;

    z-index:10000;
}


/* =========================================================
   FIXED TOOLBAR
========================================================= */

#toolbar{
    position:fixed;

    top:58px;
    left:0;
    right:0;

    min-height:48px;

    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:8px;

    padding:10px;

    background:#1b1b1b;

    border-bottom:1px solid #2d2d2d;

    z-index:9000;
}


/* =========================================================
   MAIN VIEWER AREA
========================================================= */

#layout{
    position:absolute;

    top:106px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;
}

#viewer{
    position:relative;

    width:100%;
    height:100%;

    overflow:auto;

    padding:30px 30px 90px;

    background:#111;

    display:flex;
    flex-direction:column;
    align-items:center;

    overscroll-behavior:contain;
}


/* =========================================================
   PDF PAGE
========================================================= */

.page{
    position:relative;

    margin:0 auto 20px;

    background:#fff;

    box-shadow:0 0 14px rgba(0,0,0,.4);

    flex:0 0 auto;

    /*
      Important:
      No transform, zoom, scale, or manual
      text positioning here.
    */
}

.pageCanvas{
    position:absolute;

    top:0;
    left:0;

    display:block;

    pointer-events:none;

    z-index:1;
}


/* =========================================================
   PDF.JS TEXT LAYER
========================================================= */

.textLayer{
    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;

    z-index:2;

    user-select:text;
    -webkit-user-select:text;

    pointer-events:auto;

    cursor:text;

    forced-color-adjust:none;

    /*
       These are deliberately supplied to PDF.js.
       The PDF.js stylesheet uses them when calculating
       the generated text dimensions.
    */
    --scale-factor:1;
    --user-unit:1;
    --total-scale-factor:1;
}

/*
   Do not change font-size, transform, left, top,
   width, height, or line-height of the generated
   spans here. PDF.js calculates those.
*/

.textLayer span,
.textLayer br{
    color:transparent;
}

.textLayer ::selection{
    background:rgba(0,120,255,.35);
}

.textLayer br::selection{
    background:transparent;
}


/* =========================================================
   PDF.JS ANNOTATION LAYER
========================================================= */

.annotationLayer{
    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    z-index:4;

    pointer-events:auto;
}


/* =========================================================
   GENERIC BUTTONS
========================================================= */

.btn{
    display:inline-flex;

    align-items:center;

    background:#333;
    color:#fff;

    border:none;

    border-radius:7px;

    padding:9px 12px;

    text-decoration:none;

    cursor:pointer;
}

button,
input{
    background:#2b2b2b;

    color:#fff;

    border:none;

    border-radius:8px;

    padding:8px 12px;
}

button:hover{
    background:#3a3a3a;

    cursor:pointer;
}


/* =========================================================
   CONTROL GROUPS
========================================================= */

.zoomControls,
.pageControls{
    display:flex;

    align-items:center;

    gap:6px;

    white-space:nowrap;

    flex-shrink:0;
}


/* =========================================================
   TITLE BAR
========================================================= */

#titleBar{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    padding:12px 18px;

    background:rgba(24,24,24,.92);

    text-align:center;

    border-top:1px solid #333;

    backdrop-filter:blur(6px);

    z-index:8000;
}

#title{
    display:flex;

    justify-content:center;
    align-items:center;

    width:100%;

    text-align:center;

    font-size:1.2rem;

    font-weight:bold;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.title-text{
    display:inline-flex;

    align-items:center;

    min-width:0;

    max-width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.title-badges{
    display:inline-flex;

    gap:8px;

    margin-left:12px;

    flex-shrink:0;
}

.title-badge{
    display:inline-block;

    padding:4px 10px;

    color:#fff;

    font-size:.72em;

    font-weight:bold;

    border-radius:999px;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.title-badge.new{
    background:#00b050;
}

.title-badge.featured{
    background:#2f7cff;
}


/* =========================================================
   MENU
========================================================= */

#menu{
    position:fixed;

    right:10px;
    top:58px;

    display:none;

    min-width:220px;

    padding:8px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    z-index:15000;
}

#menu button{
    width:100%;

    text-align:left;

    margin:3px 0;
}


/* =========================================================
   SEARCH
========================================================= */

#searchPopup{
    position:fixed;

    top:108px;
    left:110px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:10px;

    background:#222;

    border:1px solid #444;

    border-radius:10px;

    box-shadow:0 8px 20px rgba(0,0,0,.45);

    z-index:14000;
}

#searchPopup.hidden{
    display:none;
}

#searchPopup input{
    width:220px;
}

#searchResults{
    min-width:70px;

    color:#bbb;

    text-align:center;
}


/* =========================================================
   LOADING
========================================================= */

#loadingOverlay{
    position:fixed;

    inset:106px 0 0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#111;

    z-index:20000;
}

.spinner{
    width:60px;
    height:60px;

    border:6px solid #333;

    border-top:6px solid #fff;

    border-radius:50%;

    animation:spin .9s linear infinite;
}

.loadingText{
    margin-top:18px;

    color:#ddd;

    font-size:18px;
}


/* =========================================================
   READING MODE
========================================================= */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #menu,
body.reading-mode #searchPopup{
    display:none !important;
}

body.reading-mode #layout{
    top:0;
}

body.reading-mode #viewer{
    height:100%;

    padding-top:20px;
    padding-bottom:20px;
}

body.reading-mode #loadingOverlay{
    inset:0;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    #searchPopup{
        left:10px;
        right:10px;

        width:auto;

        flex-wrap:wrap;

        justify-content:center;
    }

    #searchPopup input{
        flex:1 1 100%;

        width:100%;

        min-width:0;
    }

    #searchResults{
        flex:1;

        min-width:0;
    }

    #title{
        flex-direction:column;

        gap:6px;
    }

    .title-text{
        max-width:100%;
    }

    .title-badges{
        margin-left:0;
    }

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

</style>
</head>


<body>


<!-- =======================================================
     FIXED HEADER
======================================================= -->

<header>

<a

<div id="toolbar">

<script type="module">


/* =========================================================
   PDF.JS
========================================================= */

import {
    getDocument,
    GlobalWorkerOptions,
    TextLayer,
    AnnotationLayer
} from "./pdfjs/build/pdf.mjs";


GlobalWorkerOptions.workerSrc =
    "./pdfjs/build/pdf.worker.mjs";


/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        location.search
    );


const file =
    decodeURIComponent(
        params.get("file") || ""
    );


const title =
    decodeURIComponent(
        params.get("paper") || "PDF"
    );


const returnPage =
    decodeURIComponent(
        params.get("return") ||
        "index.html"
    );


/* =========================================================
   ELEMENTS
========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );

const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );

const pageInput =
    document.getElementById(
        "pageNumber"
    );

const zoomBox =
    document.getElementById(
        "zoomPercent"
    );

const searchPopup =
    document.getElementById(
        "searchPopup"
    );

const searchBox =
    document.getElementById(
        "searchBox"
    );

const menu =
    document.getElementById(
        "menu"
    );

const menuButton =
    document.getElementById(
        "menuBtn"
    );


/* =========================================================
   DESCRIPTION DATA
========================================================= */

let descriptions = {};

try{

    descriptions =
        await fetch(
            "descriptions.json"
        )
        .then(
            response =>
                response.json()
        );

}
catch(error){

    console.warn(
        "descriptions.json failed:",
        error
    );

}


const entries =
    Object.entries(
        descriptions
    );


let newestEntry =
    null;


if(entries.length){

    newestEntry =
        entries.sort(
            (a,b) =>
                new Date(
                    b[1].updated || 0
                ) -
                new Date(
                    a[1].updated || 0
                )
        )[0];

}


const newestKey =
    newestEntry
        ? newestEntry[0]
        : null;


const newestDate =
    newestEntry
        ? new Date(
            newestEntry[1].updated
        )
        : null;


const oneYearAgo =
    new Date();


oneYearAgo.setFullYear(
    oneYearAgo.getFullYear() - 1
);


const paper =
    Object.values(
        descriptions
    ).find(
        item =>
            item.url === file
    );


const paperKey =
    Object.keys(
        descriptions
    ).find(
        key =>
            descriptions[key].url === file
    );


const isNewest =
    Boolean(
        newestDate &&
        newestDate >= oneYearAgo &&
        paperKey === newestKey
    );


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   TITLE
========================================================= */

document.getElementById(
    "title"
).innerHTML = `

<div class="title-text">

    ${escapeHtml(title)}

    <span class="title-badges">

        ${
            isNewest
                ? `
                    <span class="title-badge new">
                        NEW
                    </span>
                  `
                : ""
        }

        ${
            paper?.featured
                ? `
                    <span class="title-badge featured">
                        FEATURED
                    </span>
                  `
                : ""
        }

    </span>

</div>

`;


/* =========================================================
   SCALE
========================================================= */

let baseScale =
    1;

let zoomLevel =
    1;

let currentScale =
    1;


function getViewerWidth(){

    const style =
        getComputedStyle(
            viewer
        );


    return Math.max(

        1,

        viewer.clientWidth
        -
        parseFloat(
            style.paddingLeft
        )
        -
        parseFloat(
            style.paddingRight
        )

    );

}


function getViewerHeight(){

    const style =
        getComputedStyle(
            viewer
        );


    return Math.max(

        1,

        viewer.clientHeight
        -
        parseFloat(
            style.paddingTop
        )
        -
        parseFloat(
            style.paddingBottom
        )

    );

}


function getFitWidthScale(
    page
){

    const viewport =
        page.getViewport({
            scale:1
        });


    return (
        getViewerWidth() /
        viewport.width
    );

}


function getFitPageScale(
    page
){

    const viewport =
        page.getViewport({
            scale:1
        });


    const widthScale =
        getViewerWidth() /
        viewport.width;


    const heightScale =
        getViewerHeight() /
        viewport.height;


    return Math.min(
        widthScale,
        heightScale
    );

}


function updateScale(){

    currentScale =
        baseScale *
        zoomLevel;


    zoomBox.value =
        Math.round(
            zoomLevel * 100
        ) + "%";

}


/* =========================================================
   ZOOM LEVELS
========================================================= */

const zoomLevels = [

    0.25,
    0.5,
    0.75,
    1,
    1.25,
    1.5,
    1.75,
    2,
    2.25,
    2.5,
    2.75,
    3,
    3.25,
    3.5,
    3.75,
    4,
    4.25,
    4.5,
    4.75,
    5

];


/* =========================================================
   PDF STATE
========================================================= */

let pdfDoc =
    null;


const pageViews =
    [];


let searchResults =
    [];


let currentSearch =
    -1;


let lastSearchQuery =
    "";


/* =========================================================
   PAGE CSS SCALE
========================================================= */

function applyPageScaleVariables(
    element,
    page,
    viewport
){

    /*
       This is intentionally modeled after the
       variables used by PDF.js's own viewer.

       The CSS DPI conversion is handled by the
       PDF.js stylesheet rather than manually
       changing every text span.
    */

    const userUnit =
        Number(
            page.userUnit
        ) || 1;


    element.style.setProperty(
        "--scale-factor",
        String(
            viewport.scale
        )
    );


    element.style.setProperty(
        "--user-unit",
        String(
            userUnit
        )
    );


    element.style.setProperty(
        "--total-scale-factor",
        `calc(
            var(--scale-factor) *
            var(--user-unit)
        )`
    );

}


/* =========================================================
   VIEWER-ONLY SCROLL
========================================================= */

function scrollToPage(
    view
){

    if(!view)
        return;


    /*
       Never use scrollIntoView().
       That can move ancestor containers and
       make the fixed UI appear to disappear.
    */

    const viewerRect =
        viewer.getBoundingClientRect();


    const pageRect =
        view.pageDiv.getBoundingClientRect();


    const targetTop =
        viewer.scrollTop
        +
        pageRect.top
        -
        viewerRect.top
        -
        8;


    viewer.scrollTo({

        top:
            Math.max(
                0,
                targetTop
            ),

        behavior:"smooth"

    });


    pageInput.value =
        String(
            view.pageNumber
        );

}


/* =========================================================
   CREATE PAGE
========================================================= */

async function createPage(
    pageNumber
){

    const page =
        await pdfDoc.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale:currentScale
        });


    const pageDiv =
        document.createElement(
            "div"
        );


    pageDiv.className =
        "page";


    pageDiv.dataset.page =
        String(
            pageNumber
        );


    pageDiv.style.width =
        `${viewport.width}px`;


    pageDiv.style.height =
        `${viewport.height}px`;


    applyPageScaleVariables(
        pageDiv,
        page,
        viewport
    );


    /* -----------------------------------------
       Canvas
    ----------------------------------------- */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.className =
        "pageCanvas";


    const outputScale =
        window.devicePixelRatio || 1;


    canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );


    canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    canvas.style.width =
        `${viewport.width}px`;


    canvas.style.height =
        `${viewport.height}px`;


    pageDiv.appendChild(
        canvas
    );


    /* -----------------------------------------
       Text Layer
    ----------------------------------------- */

    const textLayerDiv =
        document.createElement(
            "div"
        );


    textLayerDiv.className =
        "textLayer";


    applyPageScaleVariables(
        textLayerDiv,
        page,
        viewport
    );


    pageDiv.appendChild(
        textLayerDiv
    );


    /* -----------------------------------------
       Annotation Layer
    ----------------------------------------- */

    const annotationLayerDiv =
        document.createElement(
            "div"
        );


    annotationLayerDiv.className =
        "annotationLayer";


    pageDiv.appendChild(
        annotationLayerDiv
    );


    /* -----------------------------------------
       Viewer
    ----------------------------------------- */

    viewer.appendChild(
        pageDiv
    );


    const view = {

        pageNumber,

        page,

        pageDiv,

        canvas,

        textLayerDiv,

        annotationLayerDiv,

        viewport,

        textContent:null,

        annotations:[],

        textLayer:null,

        annotationLayer:null

    };


    pageViews[
        pageNumber - 1
    ] =
        view;


    return view;

}


/* =========================================================
   RENDER CANVAS
========================================================= */

async function renderCanvas(
    view
){

    const viewport =
        view.page.getViewport({
            scale:currentScale
        });


    view.viewport =
        viewport;


    view.pageDiv.style.width =
        `${viewport.width}px`;


    view.pageDiv.style.height =
        `${viewport.height}px`;


    applyPageScaleVariables(
        view.pageDiv,
        view.page,
        viewport
    );


    applyPageScaleVariables(
        view.textLayerDiv,
        view.page,
        viewport
    );


    const outputScale =
        window.devicePixelRatio || 1;


    view.canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );


    view.canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    view.canvas.style.width =
        `${viewport.width}px`;


    view.canvas.style.height =
        `${viewport.height}px`;


    const context =
        view.canvas.getContext(
            "2d"
        );


    context.setTransform(
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
    );


    await view.page.render({

        canvasContext:
            context,

        viewport

    }).promise;

}


/* =========================================================
   RENDER TEXT
========================================================= */

async function renderText(
    view
){

    try{

        const textContent =
            await view.page.getTextContent();


        view.textContent =
            textContent;


        view.textLayerDiv.innerHTML =
            "";


        applyPageScaleVariables(
            view.textLayerDiv,
            view.page,
            view.viewport
        );


        /*
           Important:
           Use the exact viewport used by the canvas.
           The PDF.js TextLayer itself handles the
           span geometry.
        */

        const textLayer =
            new TextLayer({

                textContentSource:
                    textContent,

                container:
                    view.textLayerDiv,

                viewport:
                    view.viewport

            });


        await textLayer.render();


        view.textLayer =
            textLayer;

    }
    catch(error){

        console.warn(
            `Text layer failed on page ${view.pageNumber}:`,
            error
        );

    }

}


/* =========================================================
   LINK SERVICE
========================================================= */

/*
   The AnnotationLayer expects a link service for
   navigation annotations.

   This small adapter keeps navigation inside this
   custom viewer rather than using scrollIntoView().
*/

const customLinkService = {

    externalLinkTarget:
        2,

    externalLinkRel:
        "noopener noreferrer",

    externalLinkEnabled:
        true,

    ignoreDestinationZoom:
        false,

    addLinkAttributes(
        link,
        url,
        newWindow = false
    ){

        if(!url)
            return;

        link.href =
            url;

        if(newWindow){

            link.target =
                "_blank";

        }

        link.rel =
            "noopener noreferrer";

    },

    getDestinationHash(
        destination
    ){

        if(
            typeof destination ===
            "string"
        ){

            return (
                "#nameddest=" +
                encodeURIComponent(
                    destination
                )
            );

        }

        return "#";

    },

    getAnchorUrl(
        hash
    ){

        return hash;

    },

    async goToDestination(
        destination
    ){

        await navigateToDestination(
            destination
        );

    },

    async navigateTo(
        destination
    ){

        await navigateToDestination(
            destination
        );

    }

};


/* =========================================================
   DESTINATION RESOLUTION
========================================================= */

async function resolveDestination(
    destination
){

    if(!pdfDoc)
        return null;


    try{

        let resolved =
            destination;


        if(
            typeof resolved ===
            "string"
        ){

            resolved =
                await pdfDoc.getDestination(
                    resolved
                );

        }


        if(
            !Array.isArray(
                resolved
            ) ||
            !resolved.length
        ){

            return null;

        }


        const pageRef =
            resolved[0];


        let pageIndex =
            -1;


        try{

            pageIndex =
                await pdfDoc.getPageIndex(
                    pageRef
                );

        }
        catch{

            if(
                typeof pageRef ===
                "number"
            ){

                pageIndex =
                    pageRef;

            }

        }


        if(
            pageIndex < 0 ||
            pageIndex >=
                pageViews.length
        ){

            return null;

        }


        return {

            pageIndex,

            destination:
                resolved

        };

    }
    catch(error){

        console.warn(
            "Unable to resolve PDF destination:",
            error
        );

        return null;

    }

}


/* =========================================================
   DESTINATION NAVIGATION
========================================================= */

async function navigateToDestination(
    destination
){

    const result =
        await resolveDestination(
            destination
        );


    if(!result)
        return;


    const view =
        pageViews[
            result.pageIndex
        ];


    if(!view)
        return;


    scrollToPage(
        view
    );

}


/* =========================================================
   RENDER ANNOTATIONS
========================================================= */

async function renderAnnotations(
    view
){

    try{

        const annotations =
            await view.page.getAnnotations({
                intent:"display"
            });


        view.annotations =
            annotations;


        view.annotationLayerDiv.innerHTML =
            "";


        /*
           PDF.js itself handles:
           - external URLs
           - internal destinations
           - URI annotations
           - link annotation geometry
           - orientation
           - scaling
           - quad points
           - other supported annotations

           The exact same viewport is used as the
           canvas and text layer.
        */

        const annotationLayer =
            new AnnotationLayer({

                div:
                    view.annotationLayerDiv,

                page:
                    view.page,

                viewport:
                    view.viewport,

                linkService:
                    customLinkService

            });


        await annotationLayer.render({
            annotations
        });


        view.annotationLayer =
            annotationLayer;

    }
    catch(error){

        console.warn(
            `Annotation layer failed on page ${view.pageNumber}:`,
            error
        );

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

try{

    if(!file){

        throw new Error(
            "No PDF file was supplied."
        );

    }


    const loadingTask =
        getDocument(file);


    pdfDoc =
        await loadingTask.promise;


    document.getElementById(
        "pageCount"
    ).textContent =
        `of ${pdfDoc.numPages}`;


    const firstPage =
        await pdfDoc.getPage(
            1
        );


    baseScale =
        getFitWidthScale(
            firstPage
        );


    zoomLevel =
        1;


    updateScale();


    /*
       -----------------------------------------------------
       PHASE 1
       Create every page container first.
       -----------------------------------------------------
    */

    for(
        let pageNumber = 1;
        pageNumber <= pdfDoc.numPages;
        pageNumber++
    ){

        try{

            await createPage(
                pageNumber
            );

        }
        catch(error){

            console.error(
                `Could not create page ${pageNumber}:`,
                error
            );

            pageViews[
                pageNumber - 1
            ] =
                null;

        }

    }


    /*
       -----------------------------------------------------
       PHASE 2
       Render the actual PDF canvases.
       -----------------------------------------------------
    */

    for(
        const view
        of pageViews
    ){

        if(!view)
            continue;


        try{

            await renderCanvas(
                view
            );

        }
        catch(error){

            console.error(
                `Canvas failed on page ${view.pageNumber}:`,
                error
            );

        }

    }


    /*
       Every page now has an actual PDF canvas.
       Hide the loader before the selectable/interactive
       layers are processed.
    */

    loadingOverlay.style.display =
        "none";


    /*
       -----------------------------------------------------
       PHASE 3
       Build text + annotations.
       -----------------------------------------------------
    */

    for(
        const view
        of pageViews
    ){

        if(!view)
            continue;


        /*
           These are independent. If annotation rendering
           fails, text still renders; if text fails, links
           still render.
        */

        Promise.all([
            renderText(view),
            renderAnnotations(view)
        ])
        .catch(error => {

            console.warn(
                `Secondary layer failure on page ${view.pageNumber}:`,
                error
            );

        });

    }

}
catch(error){

    console.error(
        "PDF loading failed:",
        error
    );


    loadingOverlay.style.display =
        "none";


    viewer.innerHTML = `

        <div style="
            color:#fff;
            padding:40px;
            max-width:600px;
            text-align:center;
        ">

            <h2>
                Unable to load PDF
            </h2>

            <p>
                ${escapeHtml(
                    error?.message ||
                    "Unknown error."
                )}
            </p>

        </div>

    `;

}


/* =========================================================
   RE-RENDER AFTER ZOOM
========================================================= */

async function renderAllPages(){

    /*
       Preserve the viewer's relative scroll position.
    */

    const oldScrollableHeight =
        viewer.scrollHeight -
        viewer.clientHeight;


    const scrollRatio =
        oldScrollableHeight > 0

            ? viewer.scrollTop /
              oldScrollableHeight

            : 0;


    for(
        const view
        of pageViews
    ){

        if(!view)
            continue;


        const viewport =
            view.page.getViewport({
                scale:currentScale
            });


        view.viewport =
            viewport;


        view.pageDiv.style.width =
            `${viewport.width}px`;


        view.pageDiv.style.height =
            `${viewport.height}px`;


        applyPageScaleVariables(
            view.pageDiv,
            view.page,
            viewport
        );


        applyPageScaleVariables(
            view.textLayerDiv,
            view.page,
            viewport
        );


        /* -----------------------------------------
           Canvas
        ----------------------------------------- */

        try{

            const outputScale =
                window.devicePixelRatio || 1;


            view.canvas.width =
                Math.floor(
                    viewport.width *
                    outputScale
                );


            view.canvas.height =
                Math.floor(
                    viewport.height *
                    outputScale
                );


            view.canvas.style.width =
                `${viewport.width}px`;


            view.canvas.style.height =
                `${viewport.height}px`;


            const context =
                view.canvas.getContext(
                    "2d"
                );


            context.setTransform(
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
            );


            await view.page.render({

                canvasContext:
                    context,

                viewport

            }).promise;

        }
        catch(error){

            console.warn(
                `Canvas zoom failed on page ${view.pageNumber}:`,
                error
            );

        }


        /* -----------------------------------------
           Text
        ----------------------------------------- */

        try{

            if(
                view.textContent
            ){

                view.textLayerDiv.innerHTML =
                    "";


                applyPageScaleVariables(
                    view.textLayerDiv,
                    view.page,
                    viewport
                );


                const textLayer =
                    new TextLayer({

                        textContentSource:
                            view.textContent,

                        container:
                            view.textLayerDiv,

                        viewport

                    });


                await textLayer.render();


                view.textLayer =
                    textLayer;

            }

        }
        catch(error){

            console.warn(
                `Text zoom failed on page ${view.pageNumber}:`,
                error
            );

        }


        /* -----------------------------------------
           Annotation layer
        ----------------------------------------- */

        try{

            if(
                view.annotations &&
                view.annotations.length
            ){

                view.annotationLayerDiv.innerHTML =
                    "";


                const annotationLayer =
                    new AnnotationLayer({

                        div:
                            view.annotationLayerDiv,

                        page:
                            view.page,

                        viewport,

                        linkService:
                            customLinkService

                    });


                await annotationLayer.render({

                    annotations:
                        view.annotations

                });


                view.annotationLayer =
                    annotationLayer;

            }

        }
        catch(error){

            console.warn(
                `Annotation zoom failed on page ${view.pageNumber}:`,
                error
            );

        }

    }


    /*
       Restore the approximate scroll location
       using #viewer only.
    */

    requestAnimationFrame(
        () => {

            const newScrollableHeight =
                viewer.scrollHeight -
                viewer.clientHeight;


            viewer.scrollTop =
                Math.max(
                    0,

                    scrollRatio *
                    Math.max(
                        0,
                        newScrollableHeight
                    )

                );

        }
    );

}

    zoomLevel =

    updateScale();


    await renderAllPages();

};

/* =========================================================
   PAGE NUMBER
========================================================= */

pageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key !== "Enter"
        ){

            return;

        }


        let number =
            parseInt(
                pageInput.value,
                10
            );


        if(
            Number.isNaN(
                number
            )
        ){

            number =
                1;

        }


        number =
            Math.max(
                1,

                Math.min(
                    pageViews.length,
                    number
                )

            );


        const view =
            pageViews[
                number - 1
            ];


        if(!view)
            return;


        scrollToPage(
            view
        );

    }
);


/* =========================================================
   ZOOM INPUT
========================================================= */

zoomBox.addEventListener(
    "keydown",
    async event => {

        if(
            event.key !== "Enter"
        ){

            return;

        }


        let value =
            parseFloat(
                zoomBox.value
                    .replace("%","")
            );


        if(
            Number.isNaN(
                value
            )
        ){

            value =
                100;

        }


        value =
            Math.max(
                25,

                Math.min(
                    500,
                    value
                )

            );


        zoomLevel =
            value / 100;


        updateScale();


        await renderAllPages();

    }
);


/* =========================================================
   CURRENT PAGE
========================================================= */

let scrollFrame =
    null;


viewer.addEventListener(
    "scroll",
    () => {

        if(scrollFrame)
            return;


        scrollFrame =
            requestAnimationFrame(
                () => {

                    scrollFrame =
                        null;


                    const viewerRect =
                        viewer.getBoundingClientRect();


                    let current =
                        1;


                    let bestDistance =
                        Infinity;


                    for(
                        const view
                        of pageViews
                    ){

                        if(!view)
                            continue;


                        const rect =
                            view.pageDiv
                            .getBoundingClientRect();


                        const distance =
                            Math.abs(
                                rect.top -
                                viewerRect.top -
                                8
                            );


                        if(
                            distance <
                            bestDistance
                        ){

                            bestDistance =
                                distance;


                            current =
                                view.pageNumber;

                        }

                    }


                    pageInput.value =
                        String(
                            current
                        );

                }
            );

    }
);


/* =========================================================
   SEARCH
========================================================= */

async function searchPDF(
    query
){

    searchResults =
        [];


    currentSearch =
        -1;


    query =
        query
        .trim()
        .toLowerCase();


    if(
        query === ""
    ){

        document.getElementById(
            "searchResults"
        ).textContent =
            "0 of 0";


        return;

    }


    lastSearchQuery =
        query;


    for(
        const view
        of pageViews
    ){

        if(
            !view ||
            !view.textContent
        ){

            continue;

        }


        const text =
            view.textContent.items

            .map(
                item =>
                    item.str
            )

            .join(" ")

            .toLowerCase();


        if(
            text.includes(
                query
            )
        ){

            searchResults.push(
                view.pageNumber - 1
            );

        }

    }


    if(
        searchResults.length === 0
    ){

        document.getElementById(
            "searchResults"
        ).textContent =
            "0 of 0";


        alert(
            "No results found."
        );


        return;

    }


    gotoSearchResult(
        0
    );

}


function gotoSearchResult(
    index
){

    if(
        searchResults.length === 0
    ){

        return;

    }


    if(
        index < 0
    ){

        index =
            searchResults.length - 1;

    }


    if(
        index >=
        searchResults.length
    ){

        index =
            0;

    }


    currentSearch =
        index;


    document.getElementById(
        "searchResults"
    ).textContent =
        `${currentSearch + 1} of ${searchResults.length}`;


    const view =
        pageViews[
            searchResults[
                currentSearch
            ]
        ];


    if(view){

        scrollToPage(
            view
        );

    }

}

        ){

    }
);

/* =========================================================
   READING MODE
========================================================= */

let suppressReadingModeClick =
    false;


viewer.addEventListener(
    "mousedown",
    () => {

        const selection =
            window.getSelection();


        if(
            selection &&
            selection.toString().length > 0
        ){

            suppressReadingModeClick =
                true;

        }

    }
);


viewer.addEventListener(
    "click",
    event => {

        /*
           Annotation links take priority.
           Clicking an actual PDF link will not
           enter reading mode.
        */

        if(
            event.target.closest(
                ".annotationLayer"
            )
        ){

            return;

        }


        /*
           Only the actual PDF page can toggle
           reading mode.
        */

        const page =
            event.target.closest(
                ".page"
            );


        if(!page)
            return;


        const selection =
            window.getSelection();


        /*
           Active selection takes priority.
        */

        if(
            selection &&
            selection.toString().length > 0
        ){

            suppressReadingModeClick =
                true;

            return;

        }


        /*
           Don't toggle on the click that merely
           deselects previously selected text.
        */

        if(
            suppressReadingModeClick
        ){

            suppressReadingModeClick =
                false;

            return;

        }


        document.body.classList.toggle(
            "reading-mode"
        );


        if(
            document.body.classList
                .contains(
                    "reading-mode"
                )
        ){

            menu.style.display =
                "none";


            searchPopup.classList.add(
                "hidden"
            );

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                async () => {

                    if(
                        window.innerWidth <= 768 &&
                        pageViews.length
                    ){

                        const firstView =
                            pageViews.find(
                                view =>
                                    Boolean(view)
                            );


                        if(!firstView)
                            return;


                        baseScale =
                            getFitWidthScale(
                                firstView.page
                            );


                        zoomLevel =
                            1;


                        updateScale();


                        await renderAllPages();

                    }

                },
                150
            );

    }
);
