<title>Contact</title><style>

html{
    scroll-behavior:smooth;
    background:#111;
}

body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

section{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

section.extra-scroll-padding{
    padding-bottom:110px;
}

h1{
    text-align:center;
    margin-top:0;
    margin-bottom:40px;
}

.card{
    background:#1d1d1d;
    padding:25px;
    border-radius:10px;
}
.email a{
    color:white;
    text-decoration:none;
}

.email a:visited{
    color:white;
}

.email a:hover{
    color:white;
    text-decoration:underline;
}

.email a:active{
    color:white;
}
.back{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}

.email{
    text-align:center;
    font-size:1.2em;
    margin-top:20px;
    word-break:break-word;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

.top-button:hover{
    opacity:.6;
    background:#2a2a2a;
}

</style></head><body><section>
    
 <a class="back" href="index.html">◀ Home</a>

<h1>Contact</h1><div class="card"><p>
Questions, comments, corrections, research submissions, and other inquiries may be sent to:
</p><div class="email">
<a href="mailto:LanthanoResearch@protonmail.com">
LanthanoResearch@protonmail.com
</a>
</div></div></section>
<a href="#" class="top-button" id="topButton">
    <span style="position:relative; top:-3px;">▲</span>
</a>
<script>

const topButton = document.getElementById("topButton");
const pageSection = document.querySelector("section");

function updateTopButton(){
    if(window.scrollY > 10){
        topButton.style.display = "flex";
    }else{
        topButton.style.display = "none";
    }
}

function adjustForScrollButton(){

    // Reset first so we measure the page's natural height,
    // not the height inflated by our own extra padding.
    pageSection.classList.remove("extra-scroll-padding");

    // Force a reflow so the browser recalculates height
    // before we measure it.
    void pageSection.offsetHeight;

    const pageScrolls =
        document.documentElement.scrollHeight >
        window.innerHeight;

    if(pageScrolls){
        pageSection.classList.add("extra-scroll-padding");
    }

}

topButton.addEventListener("click", function(e){
    e.preventDefault();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

window.addEventListener("scroll", updateTopButton);

window.addEventListener("load", function(){
    adjustForScrollButton();
    updateTopButton();
});

window.addEventListener("resize", function(){
    adjustForScrollButton();
    updateTopButton();
});

</script>
</body>
</html>
