<!DOCTYPE html>
<html>
<head>

<title>Gallery</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

section{
    position:relative;
    max-width:1000px;
    margin:auto;
    padding:40px 20px 110px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.back{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:-20px;
    margin-bottom:35px;
    gap:10px;
    flex-wrap:wrap;
}

#imageCount{
    margin:0;
    color:#777;
}

/* ---------- Paper dropdown (same look as the Sort dropdown) ---------- */

.paper-dropdown{
    position:relative;
}

.paper-btn{
    background:#222;
    color:#eee;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:.95em;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:170px;
}

.paper-btn:hover{
    background:#262626;
}

.paper-btn-label{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    min-width:0;
}

.paper-caret{
    flex-shrink:0;
    width:0;
    height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:7px solid #999;
    transition:transform .15s ease;
}

.paper-dropdown.open .paper-caret{
    transform:rotate(180deg);
}

.paper-panel{
    box-sizing:border-box;
    display:none;
    flex-direction:column;
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    width:280px;
    max-width:calc(100vw - 24px);
    max-height:min(65vh, 460px);
    background:#1d1d1d;
    border:1px solid #2c2c2c;
    border-radius:10px;
    padding:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    z-index:1600;
    text-align:left;
}

.paper-panel.open{
    display:flex;
}

.paper-panel-actions{
    display:flex;
    gap:8px;
    padding-bottom:8px;
    margin-bottom:6px;
    border-bottom:1px solid #2c2c2c;
    flex:0 0 auto;
}

.panel-action{
    flex:1;
    background:#2e2e2e;
    color:#ddd;
    border:0;
    border-radius:6px;
    padding:7px 6px;
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
}

.panel-action:hover{
    background:#383838;
}

.paper-option-list{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
}

.paper-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
    padding:8px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#ddd;
    font-size:13px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
}

.paper-option:hover{
    background:#262626;
}

.paper-option.active{
    background:#262626;
    color:#fff;
}

.paper-option-label{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.paper-option-count{
    flex:0 0 auto;
    color:#777;
    font-size:11.5px;
}

.paper-option-check{
    flex:0 0 auto;
    min-width:14px;
    text-align:center;
    color:#999;
    visibility:hidden;
}

.paper-option.active .paper-option-check{
    visibility:visible;
}

.page-top-bar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:20px;
}

.top-settings{
    position:absolute;
    top:28px;
    right:20px;
    z-index:1600;
}

.sort-dropdown{
    position:relative;
}

.sort-btn{
    background:#222;
    color:#eee;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:.95em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:150px;
}

.sort-btn:hover{
    background:#262626;
}

.sort-btn-label{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    min-width:0;
}

.sort-caret{
    flex-shrink:0;
    width:0;
    height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:7px solid #999;
    transition:transform .15s ease;
}

.sort-dropdown.open .sort-caret{
    transform:rotate(180deg);
}

.sort-panel{
    display:none;
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    background:#1d1d1d;
    border:1px solid #2c2c2c;
    border-radius:10px;
    padding:10px;
    width:180px;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    z-index:1600;
    text-align:left;
}

.sort-panel.open{
    display:block;
}

.sort-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:none;
    border:none;
    color:#ddd;
    font-size:.92em;
    font-family:inherit;
    padding:8px 8px;
    border-radius:6px;
    cursor:pointer;
    text-align:left;
}

.sort-option:hover{
    background:#262626;
}

.sort-option.active{
    background:#262626;
    color:#fff;
}

.sort-option-arrow{
    color:#999;
    font-size:.9em;
    min-width:14px;
    text-align:center;
}
/* ============================================================
   SETTINGS BUTTON + PANEL

   Matches video.html's floating Settings gear/popover treatment
   exactly - same gear icon, same panel background/border/radius/
   shadow, same picker-row and toggle-switch styling - just
   anchored under this page's own gear button instead of a
   floating bottom bar.
============================================================ */

.settings-btn{
    background:#292929;
    color:#eee;
    border:1px solid #383838;
    border-radius:8px;
    width:36px;
    height:36px;
    padding:0;
    cursor:pointer;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.settings-btn:hover{
    background:#353535;
}

.settingsCloseBtn{
    width:28px;
    height:28px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    flex:0 0 auto;

    background:#292929;
    color:#eee;
    border:1px solid #383838;
    border-radius:6px;

    font-size:13px;
    line-height:1;

    cursor:pointer;
}

.settingsCloseBtn:hover{
    background:#353535;
}

.settings-panel{
    box-sizing:border-box;

    display:none;
    position:absolute;
    /*
       Shifted up to cover the gear button itself while open, rather
       than leaving a gap that shows the button sitting there
       underneath - with the X in the header now, tapping the gear
       again isn't the only way to close this, so there's no reason
       to keep it visible/reachable behind the panel.
    */
    top:calc(100% - 36px);
    right:0;

    flex-direction:column;

    width:230px;
    max-width:calc(100vw - 24px);

    padding:8px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    box-shadow:0 8px 24px rgba(0,0,0,.5);

    z-index:1600;

    text-align:left;
}

.settings-panel.open{
    display:flex;
}

.settingsMenuHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin:0 0 8px;
    padding-bottom:8px;

    border-bottom:1px solid #333;
}

.settingsMenuHeader h3{
    margin:0;
    font-size:14px;
    font-weight:600;
    color:#eee;
}

.settingsScroll{
    display:flex;
    flex-direction:column;
    gap:4px;
}

/* Picker row: label on the left, current value + chevron on the
   right - tapping it opens the option popup below. Matches
   video.html's .videoPickerRow exactly. */
.videoPickerRow{
    box-sizing:border-box;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    width:100%;

    padding:10px 16px;

    border:0;
    border-radius:8px;

    background:#2e2e2e;

    color:#eee;

    font-size:13.5px;

    font-family:inherit;

    cursor:pointer;
}

.videoPickerRow:hover{
    background:#383838;
}

.videoPickerValue{
    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:8px;

    flex:1 1 auto;
    min-width:0;

    color:#eee;

    font-size:13.5px;
}

.videoPickerValue span{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    min-width:0;
}

.videoPickerCaret{
    flex-shrink:0;

    width:0;
    height:0;

    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:7px solid #999;

    transition:transform .15s ease;
}

.videoPickerRow.open .videoPickerCaret{
    transform:rotate(180deg);
}

/* Bare "mere popup" - no header/back button, just the option
   list - anchored above/below its own trigger row via inline
   left/top set in JS at open-time. Matches video.html's
   #videoSpeedPopup exactly. */
.videoOptionPopup{
    box-sizing:border-box;

    position:fixed;

    display:none;
    flex-direction:column;

    width:190px;
    max-width:calc(100vw - 24px);
    max-height:min(60vh, 420px);

    padding:10px;

    background:#1d1d1d;

    border:1px solid #2c2c2c;

    border-radius:10px;

    box-shadow:0 6px 18px rgba(0,0,0,.5);

    z-index:1700;
}

.videoOptionPopup.open{
    display:flex;
}

.videoOptionList{
    display:flex;
    flex-direction:column;

    flex:1 1 auto;

    min-height:0;

    overflow-y:auto;
}

.videoOption{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    width:100%;

    padding:8px 8px;

    border:0;
    border-radius:6px;

    background:transparent;

    color:#ddd;

    font-size:13px;

    font-family:inherit;

    text-align:left;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    cursor:pointer;
}

.videoOption:hover{
    background:#262626;
}

.videoOption.active{
    background:#262626;

    color:#fff;
}

.videoOption .videoOptionCheck{
    flex:0 0 auto;

    min-width:14px;

    text-align:center;

    color:#999;

    visibility:hidden;
}

.videoOption.active .videoOptionCheck{
    visibility:visible;
}

.videoOption .videoOptionLabel{
    flex:1 1 auto;

    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* Toggle switch, matching video.html's .toggleSwitch exactly -
   used for the boolean "Show supporting images by default"
   setting instead of a checkbox. */
.toggleSwitch{
    position:relative;

    flex:0 0 auto;

    width:42px;
    height:24px;

    padding:0;

    background:#3a3a3a;

    border:1px solid #444;

    border-radius:999px;

    cursor:pointer;
}

.toggleSwitch .toggleKnob{
    position:absolute;

    top:2px;
    left:2px;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#ccc;

    transition:left .15s ease, background .15s ease;
}

.toggleSwitch.active{
    background:#2f7cff;

    border-color:#2f7cff;
}

.toggleSwitch.active .toggleKnob{
    left:20px;

    background:#fff;
}

    

/* ---------- Gallery-specific tweaks to the shared dropdown/settings CSS ---------- */

.top-settings{ right:20px; }

.info-bar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* Sort + paper filter live in one panel: sort options on top, the
   list of papers below. Scrolls inside itself and never closes while
   you pick things. */
.sort-panel{
    box-sizing:border-box;
    width:280px;
    max-width:calc(100vw - 24px);
    max-height:min(70vh, 520px);
    overflow-y:auto;
    overscroll-behavior:contain;
}

.panel-divider{
    height:1px;
    background:#2c2c2c;
    margin:8px 0;
}

.panel-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#999;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:2px 8px 8px;
}

.paper-panel-actions{
    border-bottom:0;
    margin-bottom:4px;
    padding-bottom:6px;
}

.paper-option-list{
    overflow:visible;
}

/* ---------- Paper breaks ---------- */

.paper-break{
    flex:0 0 100%;
    display:flex;
    align-items:center;
    gap:12px;
    margin:18px 0 8px;
    color:#ccc;
    font-size:14px;
    font-weight:bold;
    min-width:0;
}

.paper-break:first-child{ margin-top:0; }

.paper-break-title{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.paper-break-count{
    flex:0 0 auto;
    color:#777;
    font-size:12px;
    font-weight:normal;
}

.paper-break::after{
    content:"";
    flex:1 1 auto;
    height:1px;
    background:#2c2c2c;
    order:3;
}

.paper-break-count{ order:2; }

/* Pushes the last row of a paper to stay natural width instead of
   stretching a lone picture across the whole page. */
.gallery-fill{
    flex:1000000 1 0;
    margin-left:calc(var(--gap) * -1);
}

.end-of-list{
    text-align:center;
    color:#555;
    font-size:.85em;
    letter-spacing:.4px;
    margin:34px 0 6px;
}

/* ---------- One big justified gallery ----------
   Every row is the same height; each picture's width follows its own
   shape, and the row stretches to fill the full width, so tall images
   get narrower and wide ones wider and everything locks together. */

.gallery{
    --row-h:220px;
    --gap:6px;
    display:flex;
    flex-wrap:wrap;
    gap:var(--gap);
}

.gallery::after{
    content:"";
    flex:1000000 1 0;
    margin-left:calc(var(--gap) * -1);
}

.gallery-image{
    position:relative;
    display:block;
    flex-shrink:1;
    flex-basis:calc(var(--ar) * var(--row-h));
    background:#1a1a1a;
    border-radius:6px;
    overflow:hidden;
}

.gallery-image i{
    display:block;
    padding-bottom:calc(100% / var(--ar));
}

.gallery-image img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
    transition:transform .2s ease;
}

.gallery-image:hover img{
    transform:scale(1.04);
}

.status{
    text-align:center;
    color:#888;
    padding:70px 20px;
}

/* ---------- Graphic content warning ---------- */

#warningOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:999999;
    padding:20px;
    box-sizing:border-box;
}

#warningBox{
    background:#1d1d1d;
    width:100%;
    max-width:420px;
    padding:25px;
    border-radius:12px;
    text-align:center;
}

.warningIcon{
    font-size:60px;
    margin-bottom:12px;
}

#warningBox h2{
    margin:0 0 10px;
}

#warningBox p{
    color:#bbb;
    line-height:1.4;
}

.warningButtons{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.warningButtons button{
    flex:1;
    padding:12px;
    background:#333;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-family:inherit;
}

.warningButtons button:hover{
    background:#444;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

@media (max-width:700px){
    section{
        padding:30px 10px 110px;
    }
    .gallery{
        --row-h:130px;
        --gap:4px;
    }
    .top-settings{ right:10px; }
}
</style>
</head>

<body>

<section>

<div class="page-top-bar">

<div class="top-settings">

<button class="settings-btn" id="settingsButton" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg></button>

<script>

const container = document.getElementById("galleryContainer");
const countEl = document.getElementById("imageCount");

const paperOptionList = document.getElementById("paperOptionList");

const WARN_ICON_SMALL = "<svg class=\"warn-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:14px;height:14px;color:#e8b13a;vertical-align:-2px;margin-right:6px\"><path d=\"M12 3.6 21.8 20.4H2.2Z\"/><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14.6\"/><line x1=\"12\" y1=\"17.4\" x2=\"12\" y2=\"17.5\"/></svg>";

const SCROLL_KEY = "galleryScroll";
const RETURN_FLAG = "galleryReturn";
const RATIO_KEY = "galleryRatios";
const ENABLED_KEY = "galleryEnabled";

// Gallery images keep a sane shape inside the rows; anything more extreme
// than this gets cropped slightly instead of becoming a thin sliver.
const MIN_RATIO = 0.4;
const MAX_RATIO = 3.5;
const DEFAULT_RATIO = 1.33;

let papers = [];        // [{key, paper, images}]
let enabled = {};       // key -> true/false
let ratios = {};        // image path -> width / height
let pendingWarningKey = null;

let pageCounts = {};
let contentPageCounts = {};
let lastRenderAt = 0;

/* ---------- Sorting (same groups/behavior as category.html) ---------- */

const sortLabels = {
    az: "A-Z",
    za: "Z-A",
    newest: "Newest",
    oldest: "Oldest",
    mostimages: "Most Images",
    leastimages: "Least Images",
    mostreadtime: "Longest Read",
    leastreadtime: "Shortest Read"
};

const SORT_GROUPS = {
    title:    { label: "Title",        asc: "az",            desc: "za" },
    date:     { label: "Date",         asc: "oldest",        desc: "newest" },
    images:   { label: "Images",       asc: "leastimages",   desc: "mostimages" },
    readtime: { label: "Reading Time", asc: "leastreadtime", desc: "mostreadtime" }
};

let sortType = "az";
let paperBreaks = false;
let readingLevel = "average";

try{
    const s = localStorage.getItem("gallerySort");
    if(s && sortLabels[s]) sortType = s;
    paperBreaks = localStorage.getItem("galleryPaperBreaks") === "true";
    const r = localStorage.getItem("readingLevel");
    if(r) readingLevel = r;
}catch(e){}

function getActiveSortGroup(){
    for(const [key, group] of Object.entries(SORT_GROUPS)){
        if(sortType === group.asc) return { key, direction: "asc" };
        if(sortType === group.desc) return { key, direction: "desc" };
    }
    return { key: null, direction: null };
}

/* ---- Reading time (identical math to category.html) ---- */

const WORDS_PER_PAGE = 500;
const READING_WPM = { slow: 150, average: 200, fast: 300 };

function getContentPageCount(key, paper){
    if(typeof paper.contentPages === "number") return paper.contentPages;
    if(paper.url && typeof contentPageCounts[paper.url] === "number"){
        return contentPageCounts[paper.url];
    }
    return Number(pageCounts[key]) || 0;
}

function getReadMinutes(key, paper){
    const pages = getContentPageCount(key, paper);
    if(pages <= 0) return 0;
    const wpm = READING_WPM[readingLevel] || READING_WPM.average;
    return Math.max(1, Math.round((pages * WORDS_PER_PAGE) / wpm));
}

const SORTERS = {
    az:            (a, b) => (a.paper.title || "").localeCompare(b.paper.title || ""),
    za:            (a, b) => (b.paper.title || "").localeCompare(a.paper.title || ""),
    newest:        (a, b) => (b.paper.updated || "").localeCompare(a.paper.updated || ""),
    oldest:        (a, b) => (a.paper.updated || "").localeCompare(b.paper.updated || ""),
    mostimages:    (a, b) => b.images.length - a.images.length,
    leastimages:   (a, b) => a.images.length - b.images.length,
    mostreadtime:  (a, b) => getReadMinutes(b.key, b.paper) - getReadMinutes(a.key, a.paper),
    leastreadtime: (a, b) => getReadMinutes(a.key, a.paper) - getReadMinutes(b.key, b.paper)
};

function sortedEnabledPapers(){
    // Start from A-Z so ties fall back to alphabetical, then apply the
    // chosen sort (Array.sort is stable).
    return papers
        .filter(p => enabled[p.key])
        .sort(SORTERS.az)
        .sort(SORTERS[sortType] || SORTERS.az);
}

/* ---------- Settings + sort menus (same behavior as category.html) ---------- */

const settingsButton = document.getElementById("settingsButton");
const settingsPanel = document.getElementById("settingsPanel");
const sortButton = document.getElementById("sortButton");
const sortPanel = document.getElementById("sortPanel");
const sortDropdown = document.getElementById("sortDropdown");
const paperBreaksToggle = document.getElementById("paperBreaksToggle");
const optionPopup = document.getElementById("optionPopup");
const optionList = document.getElementById("optionList");

const PICKER_GROUPS = {
    readingLevel: {
        options: [
            { value:"slow", label:"Slow" },
            { value:"average", label:"Average" },
            { value:"fast", label:"Fast" }
        ],
        get(){ return readingLevel; },
        set(value){
            readingLevel = value;
            try{ localStorage.setItem("readingLevel", value); }catch(e){}
        }
    }
};

let openPickerKey = null;

function pickerValueLabel(key){
    const group = PICKER_GROUPS[key];
    const current = group.options.find(opt => opt.value === group.get());
    return current ? current.label : "";
}

function applySortUI(){
    const active = getActiveSortGroup();

    document.querySelectorAll(".sort-option").forEach(btn => {
        const groupKey = btn.dataset.group;
        const isActive = groupKey === active.key;

        btn.classList.toggle("active", isActive);

        const direction = isActive ? active.direction : "asc";
        const arrow = btn.querySelector(".sort-option-arrow");
        arrow.textContent = direction === "desc" ? "↓" : "↑";
        arrow.style.visibility = isActive ? "visible" : "hidden";
    });

    document.getElementById("sortButtonLabel").textContent =
        sortLabels[sortType] || "Sort";
}

function applySettingsUI(){
    paperBreaksToggle.classList.toggle("active", paperBreaks);
    paperBreaksToggle.setAttribute("aria-checked", paperBreaks ? "true" : "false");

    applySortUI();
}

function closeOptionPopup(){
    if(openPickerKey){
        const rowEl = document.getElementById(openPickerKey + "Open");
        if(rowEl){
            rowEl.classList.remove("open");
            rowEl.setAttribute("aria-expanded", "false");
        }
    }
    optionPopup.classList.remove("open");
    openPickerKey = null;
}

function closeMenus(){
    settingsPanel.classList.remove("open");
    settingsButton.setAttribute("aria-expanded", "false");
    sortPanel.classList.remove("open");
    sortDropdown.classList.remove("open");
    closeOptionPopup();
}

settingsButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !settingsPanel.classList.contains("open");
    closeMenus();
    if(willOpen){
        settingsPanel.classList.add("open");
        settingsButton.setAttribute("aria-expanded", "true");
    }
});

document.getElementById("settingsCloseBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    closeMenus();
});

sortButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !sortPanel.classList.contains("open");
    closeMenus();
    if(willOpen){
        sortPanel.classList.add("open");
        sortDropdown.classList.add("open");
    }
});

sortPanel.addEventListener("click", (e) => e.stopPropagation());
settingsPanel.addEventListener("click", (e) => e.stopPropagation());
optionPopup.addEventListener("click", (e) => e.stopPropagation());

// Scrolling closes the sort/settings menus (like category.html). Ignored
// right after a re-render, because changing the content height can nudge
// the scroll position on its own. The paper list stays open so you can
// tick several papers in a row.
window.addEventListener("scroll", () => {
    if(Date.now() - lastRenderAt < 400) return;
    settingsPanel.classList.remove("open");
    settingsButton.setAttribute("aria-expanded", "false");
    sortPanel.classList.remove("open");
    sortDropdown.classList.remove("open");
    closeOptionPopup();
}, { passive: true });

function buildOptionList(key){
    const group = PICKER_GROUPS[key];
    optionList.replaceChildren();

    group.options.forEach(opt => {
        const isActive = opt.value === group.get();

        const button = document.createElement("button");
        button.type = "button";
        button.className = "videoOption" + (isActive ? " active" : "");
        button.setAttribute("role", "menuitemradio");
        button.setAttribute("aria-checked", isActive ? "true" : "false");

        const label = document.createElement("span");
        label.className = "videoOptionLabel";
        label.textContent = opt.label;

        const check = document.createElement("span");
        check.className = "videoOptionCheck";
        check.textContent = "✓";

        button.append(label, check);

        button.addEventListener("click", (event) => {
            event.stopPropagation();
            group.set(opt.value);
            applySettingsUI();
            closeOptionPopup();
            render();
        });

        optionList.appendChild(button);
    });
}

function positionOptionPopup(rowEl){
    const rect = rowEl.getBoundingClientRect();
    const popupWidth = Math.min(190, window.innerWidth - 24);
    const margin = 12;

    let left = rect.left + (rect.width / 2) - (popupWidth / 2);
    left = Math.max(margin, Math.min(left, window.innerWidth - popupWidth - margin));
    optionPopup.style.left = left + "px";

    const spaceBelow = window.innerHeight - rect.bottom - 8;
    const spaceAbove = rect.top - 8;

    if(spaceBelow >= 160 || spaceBelow >= spaceAbove){
        optionPopup.style.top = (rect.bottom + 8) + "px";
        optionPopup.style.bottom = "auto";
    }else{
        optionPopup.style.bottom = (window.innerHeight - rect.top + 8) + "px";
        optionPopup.style.top = "auto";
    }
}

function openOptionPopup(key, rowEl){
    openPickerKey = key;
    buildOptionList(key);
    optionPopup.classList.add("open");
    positionOptionPopup(rowEl);
    rowEl.classList.add("open");
    rowEl.setAttribute("aria-expanded", "true");
}

window.addEventListener("resize", () => {
    if(openPickerKey){
        positionOptionPopup(document.getElementById(openPickerKey + "Open"));
    }
});

document.querySelectorAll(".videoPickerRow[data-picker]").forEach(row => {
    row.addEventListener("click", (e) => {
        e.stopPropagation();
        const key = row.dataset.picker;
        const wasOpen = openPickerKey === key;
        closeOptionPopup();
        if(!wasOpen) openOptionPopup(key, row);
    });
});

paperBreaksToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    paperBreaks = !paperBreaks;
    try{ localStorage.setItem("galleryPaperBreaks", paperBreaks); }catch(err){}
    applySettingsUI();
    render();
});

document.querySelectorAll(".sort-option").forEach(btn => {
    btn.addEventListener("click", () => {
        const groupKey = btn.dataset.group;
        const group = SORT_GROUPS[groupKey];
        const active = getActiveSortGroup();

        sortType = active.key === groupKey
            ? (active.direction === "asc" ? group.desc : group.asc)
            : group.asc;

        try{ localStorage.setItem("gallerySort", sortType); }catch(err){}
        applySortUI();
        render();
    });
});

/* ---------- Small storage helpers (safe if storage is blocked) ---------- */

function loadJson(storage, key, fallback){
    try{
        const raw = storage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    }catch(e){
        return fallback;
    }
}

function saveJson(storage, key, value){
    try{
        storage.setItem(key, JSON.stringify(value));
    }catch(e){}
}

ratios = loadJson(localStorage, RATIO_KEY, {});

/* ---------- Data ---------- */

// Same rule as the rest of the site: "#$" images are hidden everywhere.
function visibleImages(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );
}

function warningAccepted(key){
    return sessionStorage.getItem("warning-" + key) === "accepted";
}

// Opens the image in the exact same viewer, the exact same way as
// category.html, and returns here when you press Back.
function viewerUrl(image, paperTitle){
    return "image.html?image=" + encodeURIComponent(image) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

function clampRatio(r){
    return Math.max(MIN_RATIO, Math.min(MAX_RATIO, r));
}

/* ---------- Dropdown ---------- */

function enabledCount(){
    return papers.filter(p => enabled[p.key]).length;
}

function updateButtonLabel(){
    document.getElementById("paperHeadingCount").textContent =
        enabledCount() + " of " + papers.length;
}

function buildOptions(){
    paperOptionList.innerHTML = "";

    papers.forEach(({key, paper, images}) => {

        const row = document.createElement("button");
        row.type = "button";
        row.className = "paper-option" + (enabled[key] ? " active" : "");
        row.dataset.key = key;
        row.setAttribute("role", "menuitemcheckbox");
        row.setAttribute("aria-checked", enabled[key] ? "true" : "false");

        const label = document.createElement("span");
        label.className = "paper-option-label";
        label.textContent = paper.title;
        if(paper.warning){
            label.insertAdjacentHTML("afterbegin", WARN_ICON_SMALL);
        }

        const count = document.createElement("span");
        count.className = "paper-option-count";
        count.textContent = images.length;

        const check = document.createElement("span");
        check.className = "paper-option-check";
        check.textContent = "✓";

        row.append(label, count, check);

        row.addEventListener("click", (e) => {
            e.stopPropagation();
            togglePaper(key);
        });

        paperOptionList.appendChild(row);
    });
}

function refreshOptionStates(){
    paperOptionList.querySelectorAll(".paper-option").forEach(row => {
        const on = !!enabled[row.dataset.key];
        row.classList.toggle("active", on);
        row.setAttribute("aria-checked", on ? "true" : "false");
    });
    updateButtonLabel();
}

function setEnabled(key, value){
    enabled[key] = value;
}

function persistEnabled(){
    saveJson(localStorage, ENABLED_KEY, enabled);
}

function togglePaper(key){
    const entry = papers.find(p => p.key === key);
    if(!entry) return;

    // Turning a graphic paper ON asks first (once per session).
    if(!enabled[key] && entry.paper.warning && !warningAccepted(key)){
        askWarning([key]);
        return;
    }

    setEnabled(key, !enabled[key]);
    persistEnabled();
    refreshOptionStates();
    render();
}

function selectAll(){
    const needWarning = papers
        .filter(p => p.paper.warning && !warningAccepted(p.key) && !enabled[p.key])
        .map(p => p.key);

    // Everything that is not graphic turns on right away.
    papers.forEach(p => {
        if(!p.paper.warning || warningAccepted(p.key)){
            setEnabled(p.key, true);
        }
    });

    persistEnabled();
    refreshOptionStates();
    render();

    if(needWarning.length){
        askWarning(needWarning);
    }
}

function clearAll(){
    papers.forEach(p => setEnabled(p.key, false));
    persistEnabled();
    refreshOptionStates();
    render();
}


document.addEventListener("click", closeMenus);

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
        if(optionPopup.classList.contains("open")){
            closeOptionPopup();
            return;
        }
        closeMenus();
        closeWarning();
    }
});

document.getElementById("selectAllBtn").addEventListener("click", selectAll);
document.getElementById("clearAllBtn").addEventListener("click", clearAll);

/* ---------- Graphic content warning ---------- */

let pendingWarningKeys = [];

function askWarning(keys){
    pendingWarningKeys = keys;

    const titles = keys
        .map(k => papers.find(p => p.key === k))
        .filter(Boolean)
        .map(p => p.paper.title);

    document.getElementById("warningText").textContent =
        titles.length === 1
            ? "\"" + titles[0] + "\" contains graphic material, including depictions of severe injuries, death, or war casualties."
            : titles.length + " of these papers contain graphic material, including depictions of severe injuries, death, or war casualties.";

    document.getElementById("warningOverlay").style.display = "flex";
}

function closeWarning(){
    document.getElementById("warningOverlay").style.display = "none";
    pendingWarningKeys = [];
}

document.getElementById("warningCancel").addEventListener("click", closeWarning);

document.getElementById("warningOverlay").addEventListener("click", (e) => {
    if(e.target.id === "warningOverlay") closeWarning();
});

document.getElementById("warningContinue").addEventListener("click", () => {
    pendingWarningKeys.forEach(key => {
        sessionStorage.setItem("warning-" + key, "accepted");
        setEnabled(key, true);
    });

    persistEnabled();
    closeWarning();
    refreshOptionStates();
    render();
});

/* ---------- Gallery ---------- */

function applyRatio(link, ratio){
    const r = clampRatio(ratio);
    link.style.setProperty("--ar", r);
    link.style.flexGrow = String(r * 100);
}

function render(){

    container.innerHTML = "";

    lastRenderAt = Date.now();

    const groups = sortedEnabledPapers();
    const total = groups.reduce((n, p) => n + p.images.length, 0);

    countEl.textContent =
        total + (total === 1 ? " Image" : " Images");

    if(!total){
        container.innerHTML =
            '<div class="status">No papers selected. Use the menu above to choose which papers to show.</div>';
        return;
    }

    const gallery = document.createElement("div");
    gallery.className = "gallery";

    const fragment = document.createDocumentFragment();

    function addImage(image, title){

        const link = document.createElement("a");
        link.className = "gallery-image";
        link.href = viewerUrl(image, title);

        applyRatio(link, ratios[image] || DEFAULT_RATIO);

        const spacer = document.createElement("i");

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = title;
        img.src = image;

        img.addEventListener("load", () => {
            if(!img.naturalWidth || !img.naturalHeight) return;

            const real = img.naturalWidth / img.naturalHeight;
            const known = ratios[image];

            if(!known || Math.abs(known - real) > 0.001){
                ratios[image] = real;
                applyRatio(link, real);
                scheduleRatioSave();
            }
        });

        img.addEventListener("error", () => link.remove());

        link.append(spacer, img);
        fragment.appendChild(link);
    }

    groups.forEach(({paper, images}, index) => {

        if(paperBreaks){
            if(index > 0){
                const fill = document.createElement("div");
                fill.className = "gallery-fill";
                fragment.appendChild(fill);
            }

            const brk = document.createElement("div");
            brk.className = "paper-break";

            const name = document.createElement("span");
            name.className = "paper-break-title";
            name.textContent = paper.title;

            const count = document.createElement("span");
            count.className = "paper-break-count";
            count.textContent = images.length + (images.length === 1 ? " image" : " images");

            brk.append(name, count);
            fragment.appendChild(brk);
        }

        images.forEach(image => addImage(image, paper.title));
    });

    gallery.appendChild(fragment);
    container.appendChild(gallery);

    const end = document.createElement("p");
    end.className = "end-of-list";
    end.textContent = "— No more images —";
    container.appendChild(end);
}

let ratioSaveTimer = null;

function scheduleRatioSave(){
    clearTimeout(ratioSaveTimer);
    ratioSaveTimer = setTimeout(() => saveJson(localStorage, RATIO_KEY, ratios), 400);
}

/* ---------- Remember scroll position when opening an image ---------- */

container.addEventListener("click", (e) => {
    if(e.target.closest(".gallery-image")){
        try{
            sessionStorage.setItem(SCROLL_KEY, window.scrollY);
            sessionStorage.setItem(RETURN_FLAG, "yes");
        }catch(err){}
    }
});

function returningFromViewer(){
    let saved = null;
    let flag = null;

    try{
        saved = sessionStorage.getItem(SCROLL_KEY);
        flag = sessionStorage.getItem(RETURN_FLAG);
        sessionStorage.removeItem(RETURN_FLAG);
    }catch(e){}

    if(saved === null) return null;

    const ref = document.referrer || "";
    const cameFromViewer = ref ? /image\.html/.test(ref) : flag === "yes";

    if(!cameFromViewer){
        try{ sessionStorage.removeItem(SCROLL_KEY); }catch(e){}
        return null;
    }

    return parseInt(saved, 10) || 0;
}

/* ---------- Load ---------- */

Promise.all([
    fetch("descriptions.json").then(response => {
        if(!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
    }),
    fetch("page-counts.json").then(r => r.json()).catch(() => ({})),
    fetch("content-pages.json").then(r => r.json()).catch(() => ({}))
])
    .then(([data, counts, contentCounts]) => {

        pageCounts = counts || {};
        contentPageCounts = contentCounts || {};

        papers = Object.entries(data)
            .map(([key, paper]) => ({key, paper, images: visibleImages(paper)}))
            .filter(p => p.images.length)
            .sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        // Everything is on by default, except graphic papers, which stay
        // off until you opt in to them from the menu.
        const stored = loadJson(localStorage, ENABLED_KEY, {});

        papers.forEach(({key, paper}) => {
            if(typeof stored[key] === "boolean"){
                enabled[key] = stored[key];
            }else{
                enabled[key] = !paper.warning;
            }

            // A remembered "on" for a graphic paper only counts once it
            // has been confirmed again this session.
            if(paper.warning && enabled[key] && !warningAccepted(key)){
                enabled[key] = false;
            }
        });

        buildOptions();
        updateButtonLabel();
        applySettingsUI();

        const restoreTo = returningFromViewer();

        render();

        if(restoreTo !== null){
            const restore = () => window.scrollTo({top: restoreTo, behavior: "instant"});
            requestAnimationFrame(() => requestAnimationFrame(restore));
            window.addEventListener("load", restore, {once: true});
        }
    })
    .catch(error => {
        console.error(error);
        container.innerHTML = '<div class="status">Could not load descriptions.json.</div>';
    });

/* ---------- Back to top ---------- */

const topButton = document.getElementById("topButton");

function updateTopButton(){
    topButton.style.display = window.scrollY > 10 ? "flex" : "none";
}

topButton.addEventListener("click", (e) => {
    e.preventDefault();
    window.scrollTo({top: 0, behavior: "smooth"});
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);

</script>
