<!DOCTYPE html>

<head>
<script>
/* A refresh starts this page fresh, from the top, like a normal new visit.
   Only this page's remembered "where I was" is forgotten - saved settings,
   favorites and other saved data are never touched. (Coming back from a
   paper/image/video/other page still restores your spot; only a reload
   resets it.) */
(function(){
  try{
    var keys = ["galleryScroll", "galleryReturn"];
    var prefixes = [];

    function forget(){
      keys.forEach(function(k){ sessionStorage.removeItem(k); });
      Object.keys(sessionStorage).forEach(function(k){
        for(var i = 0; i < prefixes.length; i++){
          if(k.indexOf(prefixes[i]) === 0){ sessionStorage.removeItem(k); break; }
        }
      });
    }

    // Page restored whole from the browser's back/forward cache: it is
    // already exactly as it was, so drop any leftover "restore me" notes.
    window.addEventListener("pageshow", function(e){
      if(e.persisted){ try{ forget(); }catch(err){} }
    });

    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var isReload = nav ? nav.type === "reload"
      : (performance.navigation && performance.navigation.type === 1);
    if(!isReload) return;

    forget();

    if("scrollRestoration" in history) history.scrollRestoration = "manual";

    var top = function(){ window.scrollTo({top:0, behavior:"instant"}); };
    top();
    window.addEventListener("load", function(){
      top();
      requestAnimationFrame(function(){
        top();
        if("scrollRestoration" in history) history.scrollRestoration = "auto";
      });
    });
  }catch(e){}
})();
</script>
<script>
/* Home / Back links: when the page you came from is the one just before
   this one in the browser's history, step back through the history (the
   page comes back exactly as you left it and the phone's own back button
   stays consistent). Otherwise just open the page. */
(function(){
  function norm(p){ return p.replace(/index\.html$/, ""); }

  window.__goHome = function(){
    var dest = "index.html";
    var canStep = false;
    try{
      if(history.length > 1 && document.referrer){
        var r = new URL(document.referrer), t = new URL(dest, location.href);
        canStep = r.origin === t.origin && norm(r.pathname) === norm(t.pathname);
      }
    }catch(e){}

    if(!canStep){ location.assign(dest); return; }

    var fallback = setTimeout(function(){ location.assign(dest); }, 1200);
    window.addEventListener("pagehide", function(){ clearTimeout(fallback); }, {once:true});
    history.back();
  };

  document.addEventListener("click", function(e){
    if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href="index.html"]') : null;
    if(!a || (a.target && a.target !== "_self")) return;
    e.preventDefault();
    window.__goHome();
  });
})();
</script>

/* ============================================================
   SETTINGS BUTTON + PANEL

   Matches video.html's floating Settings gear/popover treatment
   exactly - same gear icon, same panel background/border/radius/
   shadow, same picker-row and toggle-switch styling - just
   anchored under this page's own gear button instead of a
   floating bottom bar.
============================================================ */

.settings-btn{
    background:#292929;
    color:#eee;
    border:1px solid #383838;
    border-radius:8px;
    width:36px;
    height:36px;
    padding:0;
    cursor:pointer;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.settings-btn:hover{
    background:#353535;
}

.settingsCloseBtn{
    width:28px;
    height:28px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    flex:0 0 auto;

    background:#292929;
    color:#eee;
    border:1px solid #383838;
    border-radius:6px;

    font-size:13px;
    line-height:1;

    cursor:pointer;
}

.settingsCloseBtn:hover{
    background:#353535;
}

.settings-panel{
    box-sizing:border-box;

    display:none;
    position:absolute;
    /*
       Shifted up to cover the gear button itself while open, rather
       than leaving a gap that shows the button sitting there
       underneath - with the X in the header now, tapping the gear
       again isn't the only way to close this, so there's no reason
       to keep it visible/reachable behind the panel.
    */
    top:calc(100% - 36px);
    right:0;

    flex-direction:column;

    width:230px;
    max-width:calc(100vw - 24px);

    padding:8px;

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    box-shadow:0 8px 24px rgba(0,0,0,.5);

    z-index:1600;

    text-align:left;
}

.settings-panel.open{
    display:flex;
}

.settingsMenuHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin:0 0 8px;
    padding-bottom:8px;

    border-bottom:1px solid #333;
}

.settingsMenuHeader h3{
    margin:0;
    font-size:14px;
    font-weight:600;
    color:#eee;
}

.settingsScroll{
    display:flex;
    flex-direction:column;
    gap:4px;
}

/* Picker row: label on the left, current value + chevron on the

    box-sizing:border-box;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    width:100%;

    padding:10px 16px;

}

.videoPickerRow:hover{
    background:#383838;
}

/* Toggle switch, matching video.html's .toggleSwitch exactly -
   used for the boolean "Show supporting images by default"
   setting instead of a checkbox. */
.toggleSwitch{

    flex:0 0 auto;

    width:42px;
    height:24px;

    padding:0;

    background:#3a3a3a;

}

.toggleSwitch .toggleKnob{
    position:absolute;

    top:2px;
    left:2px;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#ccc;

    transition:left .15s ease, background .15s ease;
}

.toggleSwitch.active{
    background:#2f7cff;

    border-color:#2f7cff;
}

.toggleSwitch.active .toggleKnob{

/* ---------- Gallery-specific tweaks to the shared dropdown/settings CSS ---------- */

.top-settings{ right:20px; }

.info-bar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* Sort + paper filter live in one panel: sort options on top, the
   list of papers below. Scrolls inside itself and never closes while
   you pick things. */
.sort-panel{
    box-sizing:border-box;
    width:280px;
    max-width:calc(100vw - 24px);
    max-height:min(70vh, 520px);
    overflow-y:auto;
    overscroll-behavior:contain;
}

.panel-divider{
    height:1px;
    background:#2c2c2c;
    margin:8px 0;
}

.panel-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#999;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:2px 8px 8px;
}

.paper-panel-actions{
    border-bottom:0;
    margin-bottom:4px;
    padding-bottom:6px;
}

.paper-option-list{
    overflow:visible;
}

/* ---------- Paper breaks ---------- */

.paper-break{
    flex:0 0 100%;
    display:flex;
    align-items:center;
    gap:14px;
    margin:32px 0 20px;
    color:#ddd;
    font-size:18px;
    font-weight:bold;
    min-width:0;
}

.paper-break:first-child{ margin-top:0; }

.paper-break-title{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.paper-break-count{
    flex:0 0 auto;
    color:#808080;
    font-size:13px;
    font-weight:normal;
}

.paper-break::after{
    content:"";
    flex:1 1 auto;
    height:1px;
    background:#2c2c2c;
    order:3;
}

.paper-break-count{ order:2; }

/* Download this section as a .zip: a quiet icon at the end of the heading line. */
.paper-break-dl{
    order:4;
    flex:0 0 auto;
    box-sizing:border-box;
    width:34px;
    height:34px;
    margin:-8px 0;
    padding:0;
    border:0;
    border-radius:50%;
    background:#222;
    color:#8f8f8f;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, background .15s ease, color .15s ease;
}
.paper-break-dl svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    pointer-events:none;
}
.paper-break-dl:hover{ transform:scale(1.12); background:#2c2c2c; }
.paper-break-dl.open{ background:#2c2c2c; color:#ddd; }
.paper-break-dl:focus-visible{ outline:2px solid #777; outline-offset:1px; }

/* Pushes the last row of a paper to stay natural width instead of
   stretching a lone picture across the whole page. */
.gallery-fill{
    flex:1000000 1 0;
    margin-left:calc(var(--gap) * -1);
}

.end-of-list{
    text-align:center;
    color:#555;
    font-size:.85em;
    letter-spacing:.4px;
    margin:34px 0 6px;
}

/* ---------- One big justified gallery ----------
   Every row is the same height; each picture's width follows its own
   shape, and the row stretches to fill the full width, so tall images
   get narrower and wide ones wider and everything locks together. */

.gallery{
    --row-h:220px;
    --gap:6px;
    display:flex;
    flex-wrap:wrap;
    gap:var(--gap);
}

.gallery::after{
    content:"";
    flex:1000000 1 0;
    margin-left:calc(var(--gap) * -1);
}

.gallery-image{
    position:relative;
    display:block;
    flex-shrink:1;
    flex-basis:calc(var(--ar) * var(--row-h));
    background:#1a1a1a;
    border-radius:6px;
    overflow:hidden;
}

.gallery-image i{
    display:block;
    padding-bottom:calc(100% / var(--ar));
}

.gallery-image img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
    transition:transform .2s ease;
}

.gallery-image:hover img{
    transform:scale(1.04);
}

.status{
    text-align:center;
    color:#888;
    padding:70px 20px;
}

/* ---------- Images / Videos switch ---------- */

.mode-switch{
    position:relative;
    display:flex;
    width:min(340px, 100%);
    margin:0 auto 42px;
    padding:3px;
    box-sizing:border-box;
    background:#1a1a1a;
    border:1px solid #2c2c2c;
    border-radius:999px;
}

.mode-pill{
    position:absolute;
    top:3px;
    bottom:3px;
    left:3px;
    width:calc(33.3333% - 2px);
    background:#3a3a3a;
    border-radius:999px;
}

.mode-switch.animate .mode-pill{
    transition:transform .25s ease;
}

.mode-switch[data-mode="mixed"] .mode-pill{
    transform:translateX(100%);
}

.mode-switch[data-mode="videos"] .mode-pill{
    transform:translateX(200%);
}

/* Mixed: one justified puzzle. Pictures and videos share rows; a video
   can take a row alone or sit beside another video or pictures, and every
   row locks to the full width. */
.mixed-wrap{
    --gap:6px;
}
.mixrow{
    display:flex;
    gap:var(--gap);
}
.mixrow + .mixrow{
    margin-top:var(--gap);
}
.mixrow .gallery-image,
.mixstack .gallery-image{
    flex:none;
    min-width:0;
}
.mixrow i{ display:none; }
.mixstack{
    flex:none;
    display:flex;
    flex-direction:column;
    gap:var(--gap);
}
.mixrow.natural{
    justify-content:flex-start;
}

.mode-switch button{
    position:relative;
    flex:1;
    padding:8px 0;
    background:none;
    border:0;
    color:#999;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    border-radius:999px;
    transition:color .2s ease;
}

.mode-switch button[aria-selected="true"]{
    color:#fff;
}

.settings-mode-note{
    color:#777;
    font-size:12px;
    padding:2px 10px 8px;
}

/* ---------- Video tiles (drawn from text; the picture is a small
   thumbnail from this site, never anything from the video storage) ---------- */

.gallery.videos{
    --gap:8px;
    display:flex;
    flex-direction:column;
    flex-wrap:nowrap;
    gap:var(--gap);
}

.gallery.videos::after{
    display:none;
}

/* Every video group is its own little 12-column grid, so each layout keeps
   its shape: full width, even pair, uneven pair, or one big video beside two
   stacked ones. Tiles are 16:9; a side-by-side partner is stretched to match
   and its picture is cropped to fit. */
.vu{
    flex:none;
    display:grid;
    grid-template-columns:repeat(12, minmax(0, 1fr));
    gap:var(--gap);
}
.vu .gallery-image{
    flex-basis:auto;
    width:auto;
    min-width:0;
}
.vu .gallery-image i{ display:none; }

/* Every video is exactly 16:9 in every layout; layouts only scale tiles up
   or down. */
.vu .gallery-image{ aspect-ratio:16 / 9; }
.vu-big .gallery-image{ grid-column:1 / -1; }
.vu-pair .gallery-image{ grid-column:span 6; }
.vu-trio .gallery-image{ grid-column:span 4; }

/* One big video beside two stacked ones: the big tile is sized so its height
   equals the two small ones plus the gap, with every tile still 16:9. */
.vu-featL, .vu-featR{
    --s:calc((100% - var(--gap) * 25 / 9) / 3);
    --b:calc(var(--s) * 2 + var(--gap) * 16 / 9);
}
.vu-featL{ grid-template-columns:var(--b) var(--s); }
.vu-featR{ grid-template-columns:var(--s) var(--b); }
.vu-featL .gallery-image, .vu-featR .gallery-image{ grid-column:auto; }
.vu-featL .gallery-image:nth-child(1){ grid-column:1; grid-row:1 / span 2; }
.vu-featL .gallery-image:nth-child(2){ grid-column:2; grid-row:1; }
.vu-featL .gallery-image:nth-child(3){ grid-column:2; grid-row:2; }
.vu-featR .gallery-image:nth-child(1){ grid-column:2; grid-row:1 / span 2; }
.vu-featR .gallery-image:nth-child(2){ grid-column:1; grid-row:1; }
.vu-featR .gallery-image:nth-child(3){ grid-column:1; grid-row:2; }

@media (max-width:599px){
    .vu-trio .gallery-image:nth-child(1){ grid-column:1 / -1; }
    .vu-trio .gallery-image:nth-child(n+2){ grid-column:span 6; }
}

/* Paper-name headings span the full width instead of taking a tile's place. */
.gallery.videos .paper-break{
    flex:none;
}

.gallery.videos .gallery-fill{
    display:none;
}

@media (max-width:339px){
    .vu{ grid-template-columns:minmax(0, 1fr); }
    .vu .gallery-image{ grid-column:auto !important; grid-row:auto !important; }
}

/* Play button, time and heart scale with the tile so small tiles stay clean. */
.video-tile{ container-type:inline-size; }
.video-tile .video-play{
    width:clamp(24px,16cqw,46px);
    height:clamp(24px,16cqw,46px);
    margin:0;
    transform:translate(-50%,-50%);
    box-sizing:border-box;
}
.video-tile .video-play svg{ width:52%; height:52%; transform:translateX(6%); }
.video-tile .video-duration{
    right:clamp(4px,3cqw,8px);
    bottom:clamp(4px,3cqw,8px);
    font-size:clamp(9px,3.4cqw,12px);
}
.video-tile .fav-heart{
    --in:clamp(4px,3cqw,8px);
    top:var(--in); right:var(--in);
    width:clamp(20px,9cqw,30px);
    height:clamp(20px,9cqw,30px);
}
.video-tile .fav-heart svg{ width:58%; height:58%; }

.video-tile{
    background:linear-gradient(145deg,#232323,#161616);
}

.video-tile img{
    z-index:0;
}

.video-play{
    position:absolute;
    top:50%;
    left:50%;
    width:38px;
    height:38px;
    margin:-19px 0 0 -19px;
    border-radius:50%;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    z-index:1;
    pointer-events:none;
}

.video-play svg{
    margin:0;
    transform:translateX(-0.2px);
}

.video-duration{
    position:absolute;
    right:6px;
    bottom:6px;

<script id="favMediaJs">
/* Favorite media: one small shared helper (the same copy lives on the
   gallery, category and home pages). Keys look like "i:<image path>" or
   "v:<video file>" and are saved as a list under "favoriteMedia". */
(function(){
  if(window.FavMedia) return;

  var KEY = "favoriteMedia";
  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  var mem = null, raw = null, set = new Set(), listeners = [];

  function read(){
    var r = null;
    try{ r = localStorage.getItem(KEY); }catch(e){ r = mem; }
    if(r === raw) return set;
    raw = r;
    set = new Set();
    try{
      var a = JSON.parse(r || "[]");
      if(Array.isArray(a)) a.forEach(function(k){ if(typeof k === "string" && k) set.add(k); });
    }catch(e){}
    return set;
  }

  function write(){
    var s = JSON.stringify(Array.from(set));
    mem = s;
    try{ localStorage.setItem(KEY, s); }catch(e){}
    raw = s;
  }

  function key(kind, path){
    return (kind === "video" ? "v:" : "i:") + String(path == null ? "" : path).trim();
  }

  function esc(t){
    return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function has(k){ return read().has(k); }

  function toggle(k){
    read();
    var on = !set.has(k);
    if(on) set.add(k); else set.delete(k);
    write();
    return on;
  }

  function paint(el){
    var on = has(el.getAttribute("data-fav"));
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    var label = on ? "Remove from favorite media" : "Add to favorite media";
    el.setAttribute("aria-label", label);
    el.setAttribute("title", label);
  }

  function sync(root){
    (root || document).querySelectorAll(".fav-heart").forEach(paint);
  }

  function notify(){
    listeners.slice().forEach(function(fn){ try{ fn(); }catch(e){} });
  }

  function heart(kind, path, extra){
    var k = key(kind, path), on = has(k);
    var label = on ? "Remove from favorite media" : "Add to favorite media";
    return '<span class="fav-heart' + (on ? " active" : "") + (extra ? " " + extra : "") +
      '" role="button" tabindex="0" data-fav="' + esc(k) + '" aria-pressed="' + (on ? "true" : "false") +
      '" aria-label="' + label + '" title="' + label + '">' + HEART + '</span>';
  }

  function el(kind, path, extra){
    var d = document.createElement("div");
    d.innerHTML = heart(kind, path, extra);
    return d.firstChild;
  }

  // The little jump + tiny buzz (phones that support it) when something is
  // saved. Used by hearts and by the paper star, so they feel identical.
  function buzz(){
    try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){}
  }

  function pop(el){
    if(!el) return;
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
  }

  function flip(h){
    var on = toggle(h.getAttribute("data-fav"));
    sync();
    h.classList.remove("pop");
    if(on) pop(h);
    buzz();
    notify();
  }

  // Captured first, so tapping a heart never opens the image or video under it.
  document.addEventListener("click", function(e){
    var h = e.target && e.target.closest ? e.target.closest(".fav-heart") : null;
    if(!h) return;
    e.preventDefault();
    e.stopPropagation();
    flip(h);
  }, true);

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var h = e.target && e.target.closest ? e.target.closest(".fav-heart") : null;
    if(!h) return;
    e.preventDefault();
    e.stopPropagation();
    flip(h);
  }, true);

  function refresh(){ sync(); notify(); }

  window.addEventListener("storage", function(e){
    if(e.key === KEY || e.key === null) refresh();
  });
  window.addEventListener("pageshow", function(e){ if(e.persisted) refresh(); });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refresh();
  });

  window.FavMedia = {
    key: key,
    has: has,
    toggle: toggle,
    heart: heart,
    el: el,
    sync: sync,
    pop: pop,
    buzz: buzz,
    count: function(){ return read().size; },
    onChange: function(fn){ listeners.push(fn); }
  };
})();
</script>
</head>

};

const SORT_GROUPS = {
    title:    { label: "Title",        asc: "az",            desc: "za" },
    date:     { label: "Date",         asc: "oldest",        desc: "newest" },
    images:   { label: "Images",       asc: "leastimages",   desc: "mostimages" },
    readtime: { label: "Reading Time", asc: "leastreadtime", desc: "mostreadtime" }
};

function loadModeSettings(m){
    const o = { sortType: "az", paperBreaks: true, showNames: false };   // group headings are always on
    const k = KEYS[m];

    try{
        const s = localStorage.getItem(k.sort);
        if(s === "az" || s === "za") o.sortType = s;
        o.showNames = localStorage.getItem(KEYS.images.names) === "true";
    }catch(e){}

    return o;
}

const settingsBy = {
    images: loadModeSettings("images"),
    videos: loadModeSettings("videos"),
    mixed: loadModeSettings("mixed")
};

let sortType = settingsBy[mode].sortType;
const paperBreaks = true;   // group headings are always on
let showNames = settingsBy[mode].showNames;
let readingLevel = "average";

try{
    const r = localStorage.getItem("readingLevel");
    if(r) readingLevel = r;
}catch(e){}

function sortLabel(type){
    const base = sortLabels[type] || "Sort";
    return mode === "videos" ? base.replace("Images", "Videos")
        : mode === "mixed" ? base.replace("Images", "Items") : base;
}

function getActiveSortGroup(){
    for(const [key, group] of Object.entries(SORT_GROUPS)){
        if(sortType === group.asc) return { key, direction: "asc" };
        if(sortType === group.desc) return { key, direction: "desc" };
    }
    return { key: null, direction: null };
}

/* ---- Reading time (identical math to category.html) ---- */

const WORDS_PER_PAGE = 500;
const READING_WPM = { slow: 150, average: 200, fast: 300 };

function getContentPageCount(key, paper){
    if(typeof paper.contentPages === "number") return paper.contentPages;
    if(paper.url && typeof contentPageCounts[paper.url] === "number"){
        return contentPageCounts[paper.url];
    }
    return Number(pageCounts[key]) || 0;
}

function getReadMinutes(key, paper){
    const pages = getContentPageCount(key, paper);
    if(pages <= 0) return 0;
    const wpm = READING_WPM[readingLevel] || READING_WPM.average;
    return Math.max(1, Math.round((pages * WORDS_PER_PAGE) / wpm));
}

const SORTERS = {
    az:            (a, b) => (a.paper.title || "").localeCompare(b.paper.title || ""),
    za:            (a, b) => (b.paper.title || "").localeCompare(a.paper.title || ""),
    newest:        (a, b) => (b.paper.updated || "").localeCompare(a.paper.updated || ""),
    oldest:        (a, b) => (a.paper.updated || "").localeCompare(b.paper.updated || ""),
    mostimages:    (a, b) => b.items.length - a.items.length,
    leastimages:   (a, b) => a.items.length - b.items.length,
    mostreadtime:  (a, b) => getReadMinutes(b.key, b.paper) - getReadMinutes(a.key, a.paper),
    leastreadtime: (a, b) => getReadMinutes(a.key, a.paper) - getReadMinutes(b.key, b.paper)
};

// The favorites key of one gallery item, whichever tab it is in.
function favKeyOf(it){
    if(mode === "mixed") return it.kind === "video" ? FavMedia.key("video", it.v.file) : FavMedia.key("image", it.src);
    return mode === "videos" ? FavMedia.key("video", it.file) : FavMedia.key("image", it);
}

function isFavItem(it){
    return FavMedia.has(favKeyOf(it));
}

// What a paper contributes right now (only its favorites in favorites view).
function shownItems(p){
    return favoritesOnly ? p.items.filter(isFavItem) : p.items;
}

// Favorites that belong to papers switched off in the menu.
function hiddenFavoriteCount(){
    let n = 0;
    papers.forEach(p => { if(!enabled[p.key]) n += p.items.filter(isFavItem).length; });
    return n;
}

function sortedEnabledPapers(){
    // Start from A-Z so ties fall back to alphabetical, then apply the
    // chosen sort (Array.sort is stable).
    return papers
        .filter(p => enabled[p.key])
        .map(p => favoritesOnly ? { key: p.key, paper: p.paper, items: shownItems(p) } : p)
        .filter(p => p.items.length)
        .sort(SORTERS.az)
        .sort(SORTERS[sortType] || SORTERS.az);
}

/* ---------- Small storage helpers (safe if storage is blocked) ---------- */

function loadJson(storage, key, fallback){
    try{
        const raw = storage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    }catch(e){
        return fallback;
    }
}

function saveJson(storage, key, value){
    try{
        storage.setItem(key, JSON.stringify(value));
    }catch(e){}
}

// Same rule as the rest of the site: "#$" images are hidden everywhere.
function visibleImages(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );
}

// Videos are listed under a paper as { file, title, duration } (a plain text
// path works too). A file starting with "#$" is hidden, like images.
function visibleVideos(paper){
    return (paper.videos || [])
        .map(v => typeof v === "string" ? { file: v } : v)
        .filter(v =>
            v &&
            typeof v.file === "string" &&
            v.file.trim() &&
            !v.file.trim().startsWith("#$")
        )
        .map(v => ({
            file: v.file.trim(),
            title: v.title,
            duration: v.duration,
            thumbnail: v.thumbnail,
            source: v.source,
            group: v.group,
            groupLabel: v.groupLabel
        }));
}

function warningAccepted(key){
    return sessionStorage.getItem("warning-" + key) === "accepted";
}

// Opens the image in the exact same viewer, the exact same way as
// category.html, and returns here when you press Back.
function viewerUrl(image, paperTitle){
    return "image.html?image=" + encodeURIComponent(image) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

// Opens the video in the video viewer, which returns here on Back. Nothing
// is requested from the video storage until that page opens.
function videoUrl(v, paperTitle){
    const base = v.file.split("/").pop().replace(/\.[^/.]+$/, "");
    return "video.html?video=" + encodeURIComponent(v.file) +
        (v.source === "site" ? "" : "&source=r2") +
        "&title=" + encodeURIComponent(v.title || base) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

function clampRatio(r){

// A listed picture that isn't on the site is left out; the count follows.
function recountTiles(){
    const [one, many] = WORDS[mode];
    const n = container.querySelectorAll(".gallery-image").length;
    countEl.textContent = n + " " + (n === 1 ? one : many);
}

function applyRatio(link, ratio){
    const r = clampRatio(ratio);
    link.style.setProperty("--ar", r);
    link.style.flexGrow = String(r * 100);
}

const VIDEO_RATIO = 16 / 9;

function fileLabel(path){
    return String(path).split("/").pop().replace(/\.[^/.]+$/, "");
}

// Collage layout (Images and Mixed tabs). Pictures and videos are packed into
// rows that fill the full width. Nothing is ever stretched: every tile keeps
// its own shape and is only scaled. Inside a row a cell is either one tile or
// two/three tiles stacked on top of each other, so a tall picture can sit
// beside two wide ones and the row still closes with no gaps. The packer picks
// the breaks and the stacks that keep every row closest to the target height.
let mixSections = [];
let settleRaf = 0;

function settleSoon(){
    if(settleRaf) return;
    settleRaf = requestAnimationFrame(() => { settleRaf = 0; layoutMixed(); });
}

// All ways to cut k tiles into cells of 1 to 3 stacked tiles.
const CELL_PLANS = {};
function cellPlans(k){
    if(CELL_PLANS[k]) return CELL_PLANS[k];
    const out = [];
    (function go(left, cur){
        if(!left){ out.push(cur.slice()); return; }
        for(let s = 1; s <= Math.min(3, left); s++){
            cur.push(s); go(left - s, cur); cur.pop();
        }
    })(k, []);
    return CELL_PLANS[k] = out;
}

// Best way to lay tiles[i..j) in one row: returns { cost, H, cells, stacks }.
function bestRow(rs, mins, i, j, W, gap, T){
    const k = j - i;
    let best = null;
    cellPlans(k).forEach(plan => {
        let pos = i, sumA = 0, corr = 0, stacks = 0, three = 0;
        const cells = [];
        plan.forEach(s => {
            let inv = 0;
            for(let q = 0; q < s; q++) inv += 1 / rs[pos + q];
            const A = 1 / inv;
            sumA += A;
            corr += A * (s - 1);
            if(s > 1) stacks++;
            if(s === 3) three++;
            cells.push({ from: pos, n: s, A });
            pos += s;
        });
        const H = (W - gap * (plan.length - 1) + gap * corr) / sumA;
        // Hard-ish floor: every tile must stay big enough to show its heart,
        // name and (for videos) play button and time without overlapping.
        // Anything under the floor gets a heavy penalty, so very wide or very
        // tall pictures get a row or stack that keeps them readable.
        let small = 0;
        cells.forEach(c => {
            const w = c.A * (H - gap * (c.n - 1));
            for(let q = 0; q < c.n; q++){
                const m = mins[c.from + q];
                const v = Math.max(0, (m.w - w) / m.w, (m.h - w / rs[c.from + q]) / m.h);
                if(v > 0) small += 1 + v * v * 4;
            }
        });
        const cost = Math.pow(Math.log(H / T), 2) + stacks * 0.03 + three * 0.05 + small * 40;
        if(!best || cost < best.cost) best = { cost, H, cells };
    });
    return best;
}

function packRows(tiles, W, gap, T, allowNatural, ar){
    const n = tiles.length;
    if(!n) return [];
    const rs = tiles.map(ar);
    // Smallest size a tile may be drawn at (videos need room for play + time).
    const mins = tiles.map(t => t.classList.contains("video-tile")
        ? { w: W < 600 ? 112 : 150, h: W < 600 ? 66 : 84 }
        : { w: W < 600 ? 84 : 110, h: W < 600 ? 62 : 80 });
    const MAXK = 7;

    const best = new Array(n + 1).fill(Infinity);
    const from = new Array(n + 1).fill(0);
    const pick = new Array(n + 1).fill(null);
    best[0] = 0;

    for(let j = 1; j <= n; j++){
        for(let i = j - 1; i >= 0 && j - i <= MAXK; i--){
            const r = bestRow(rs, mins, i, j, W, gap, T);
            let cost = r.cost, natural = false;
            if(j === n && allowNatural && r.H > T * allowNatural){
                cost = 0.05 + r.cells.length * 0.002;
                natural = true;
            }
            if(best[i] + cost < best[j]){
                best[j] = best[i] + cost;
                from[j] = i;
                pick[j] = { r, natural };
            }
        }
    }

    const rows = [];
    let j = n;
    while(j > 0){
        const i = from[j];
        const { r, natural } = pick[j];
        const H = natural ? T : r.H;
        rows.unshift({
            H, natural,
            cells: r.cells.map(c => ({
                tiles: tiles.slice(c.from, c.from + c.n),
                w: c.A * (H - gap * (c.n - 1))
            }))
        });
        j = i;
    }
    return rows;
}

function layoutMixed(){
    mixSections.forEach(sec => {
        const el = sec.el;
        if(!el.isConnected) return;

        const W = el.clientWidth;
        if(!W) return;

        const gap = parseFloat(getComputedStyle(el).getPropertyValue("--gap")) || 6;
        const T = W < 600 ? Math.max(140, W * 0.38) : Math.max(190, Math.min(280, W * 0.26));
        const ar = t => parseFloat(t.style.getPropertyValue("--ar")) || 1.33;

        const tiles = sec.order.map(o => o.flow).filter(t => !t.dataset.dead);
        const rows = packRows(tiles, W, gap, T, 0, ar);

        const sig = rows.map(r => r.cells.map(c => c.tiles.map(t => sec.all.indexOf(t)).join("+")).join(",") + (r.natural ? "n" : "")).join("|");

        if(sig !== sec.sig){
            sec.sig = sig;
            el.textContent = "";
            rows.forEach(row => {
                const d = document.createElement("div");
                d.className = "mixrow" + (row.natural ? " natural" : "");
                row.cells.forEach(c => {
                    if(c.tiles.length === 1){
                        d.appendChild(c.tiles[0]);
                    }else{
                        const s = document.createElement("div");
                        s.className = "mixstack";
                        c.tiles.forEach(t => s.appendChild(t));
                        d.appendChild(s);
                    }
                });
                el.appendChild(d);
            });
        }

        // Exact pixel sizes, so every tile keeps its true shape.
        rows.forEach(row => {
            row.cells.forEach(c => {
                c.tiles.forEach(t => {
                    t.style.width = c.w + "px";
                    t.style.height = (c.w / ar(t)) + "px";
                });
                if(c.tiles.length > 1) c.tiles[0].parentNode.style.width = c.w + "px";
            });
        });
    });
}

window.addEventListener("resize", settleSoon);

function render(){

    container.innerHTML = "";

    lastRenderAt = Date.now();

    container.classList.toggle("show-names", showNames);

    const [one, many] = WORDS[mode];

    const groups = sortedEnabledPapers();
    const total = groups.reduce((n, p) => n + p.items.length, 0);

    countEl.textContent =
        total + " " + (total === 1 ? one : many);

    if(!papers.length){
        container.innerHTML =
            '<div class="status">No ' + many.toLowerCase() + ' have been added yet.</div>';
        return;
    }

    if(!total){
        if(favoritesOnly){
            const hidden = hiddenFavoriteCount();
            if(hidden){
                container.innerHTML = "";
                container.appendChild(favHiddenNote(hidden));
            }else{
                container.innerHTML = favEmptyHtml();
            }
        }else{
            container.innerHTML =
                '<div class="status">No papers selected. Use the menu above to choose which papers to show.</div>';
        }
        return;
    }

    const gallery = document.createElement("div");
    gallery.className = (mode === "mixed" || mode === "images") ? "mixed-wrap" : "gallery" + (mode === "videos" ? " videos" : "");

    const fragment = document.createDocumentFragment();
    let target = fragment;   // where the next tile goes (a holder in Mixed)
    mixSections = [];

    function addName(link, text){
        const name = document.createElement("span");
        name.className = "tile-name";
        name.textContent = text;
        link.appendChild(name);
    }

    function addImage(image, title){

        const link = document.createElement("a");
        link.className = "gallery-image";
        link.href = viewerUrl(image, title);

        applyRatio(link, ratios[image] || DEFAULT_RATIO);

        const spacer = document.createElement("i");

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = title;
        img.src = image;

        img.addEventListener("load", () => {
            if(!img.naturalWidth || !img.naturalHeight) return;

            const real = img.naturalWidth / img.naturalHeight;
            const known = ratios[image];

            if(!known || Math.abs(known - real) > 0.001){
                ratios[image] = real;
                applyRatio(link, real);
                scheduleRatioSave();
            }
            settleSoon();
        });

        img.addEventListener("error", () => { link.dataset.dead = "1"; link.remove(); recountTiles(); settleSoon(); });

        link.append(spacer, img);
        addName(link, fileLabel(image));
        link.dataset.favkey = FavMedia.key("image", image);
        link.appendChild(FavMedia.el("image", image));
        target.appendChild(link);
    }

    function addVideo(v, title){

        const name = v.title || fileLabel(v.file);
        const rkey = "v:" + v.file;

        const link = document.createElement("a");
        link.className = "gallery-image video-tile";
        link.href = videoUrl(v, title);
        link.setAttribute(
            "aria-label",
            "Play " + name + (v.duration ? " (" + v.duration + ")" : "")
        );

        // In Mixed, videos keep a clean 16:9 so rows line up nicely.
        const fixedShape = mode === "mixed";

        applyRatio(link, fixedShape ? VIDEO_RATIO : (ratios[rkey] || VIDEO_RATIO));

        const spacer = document.createElement("i");

        // The thumbnail is a small picture on this site (thumbnails/<video
        // name>.jpg; .png, .webp and .jpeg also work). If there isn't one the
        // plain dark tile stays. It is never read from the video storage.
        const thumbPath = (v.thumbnail && String(v.thumbnail).trim())
            ? String(v.thumbnail).trim()
            : "thumbnails/" + fileLabel(v.file) + ".jpg";

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = "";
        img.dataset.tried = "0";
        img.src = thumbPath.split("/").map(encodeURIComponent).join("/");

        img.addEventListener("load", () => {
            if(!img.naturalWidth || !img.naturalHeight) return;

            const real = img.naturalWidth / img.naturalHeight;
            const known = ratios[rkey];

            if(fixedShape){
                if(!known || Math.abs(known - real) > 0.001){
                    ratios[rkey] = real;
                    scheduleRatioSave();
                }
                return;
            }

            if(!known || Math.abs(known - real) > 0.001){
                ratios[rkey] = real;
                applyRatio(link, real);
                scheduleRatioSave();
            }
        });

        img.addEventListener("error", () => {
            const exts = ["png", "webp", "jpeg"];
            const tried = Number(img.dataset.tried || 0);

            if(tried >= exts.length || !/\.[a-z]+$/i.test(img.src)){
                img.remove();
                return;
            }

            img.dataset.tried = String(tried + 1);
            img.src = img.src.replace(/\.[a-z]+$/i, "." + exts[tried]);
        });

        const play = document.createElement("span");
        play.className = "video-play";
        play.innerHTML =
            '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>';

        link.append(spacer, img, play);

        if(v.duration){
            const dur = document.createElement("span");
            dur.className = "video-duration";
            dur.textContent = v.duration;
            link.appendChild(dur);
        }

        addName(link, name);
        link.dataset.favkey = FavMedia.key("video", v.file);
        link.appendChild(FavMedia.el("video", v.file));
        target.appendChild(link);
    }

    // Mixed: videos come in three sizes. "big" takes a whole row alone,
    // "pair" is two side by side, and "half" is sized for two-per-row but sits
    // beside pictures. Everything is spread evenly and packed into rows.
    function addMixedBlocks(list){
        const imgs = list.filter(i => i.kind === "image");
        const vids = list.filter(i => i.kind === "video");

        const holder = document.createElement("div");
        const all = [];

        function make(it){
            target = holder;
            if(it.kind === "video") addVideo(it.v, it.paperLabel);
            else addImage(it.src, it.paperTitle);
            target = fragment;
            const t = holder.lastElementChild;
            all.push(t);
            return t;
        }

        // Videos are spread evenly among the pictures; the packer does the rest.
        const order = [];
        let a = 0, b = 0;

        while(a < imgs.length || b < vids.length){
            const pa = imgs.length ? (a + 0.5) / imgs.length : Infinity;
            const pb = vids.length ? (b + 0.5) / vids.length : Infinity;
            const it = (a < imgs.length && (b >= vids.length || pa <= pb)) ? imgs[a++] : vids[b++];
            order.push({ flow: make(it) });
        }

        const el = document.createElement("div");
        el.className = "mixsec";
        fragment.appendChild(el);
        mixSections.push({ el, all, order, sig: null });
    }


    // Videos tab: a fixed (never random) rhythm of layouts that repeats:
    // a full-width video, a pair, a big video beside two stacked ones, a
    // row of three, and so on. Every tile is always 16:9. A short leftover always ends cleanly.
    const VU_CYCLE = ["big", "pair", "featL", "trio", "pair", "featR", "trio", "pair"];
    const VU_NEED = { big: 1, pair: 2, trio: 3, featL: 3, featR: 3 };
    let vuCount = 0;

    function addVideoUnits(list){
        let i = 0;
        while(i < list.length){
            const rem = list.length - i;
            let type = VU_CYCLE[vuCount++ % VU_CYCLE.length];
            if(rem < VU_NEED[type]) type = rem === 1 ? "big" : "pair";
            const unit = document.createElement("div");
            unit.className = "vu vu-" + type;
            fragment.appendChild(unit);
            target = unit;
            list.slice(i, i + VU_NEED[type]).forEach(e => addVideo(e.v, e.label));
            target = fragment;
            i += VU_NEED[type];
        }
    }

    groups.forEach(({paper, items}, index) => {

        if(paperBreaks){
            if(index > 0 && mode === "videos"){
                const fill = document.createElement("div");
                fill.className = "gallery-fill";
                fragment.appendChild(fill);
            }

            const brk = document.createElement("div");
            brk.className = "paper-break";

            const name = document.createElement("span");
            name.className = "paper-break-title";
            name.textContent = paper.label || paper.title;

            const count = document.createElement("span");
            count.className = "paper-break-count";
            count.textContent =
                items.length + " " + (items.length === 1 ? one : many).toLowerCase();

            brk.append(name, count);

            // One download button per section: its pictures and/or videos as a .zip.
            const dl = document.createElement("button");
            dl.type = "button";
            dl.className = "paper-break-dl";
            dl.title = "Download";
            dl.setAttribute("aria-label", "Download " + (paper.label || paper.title));
            dl.setAttribute("aria-haspopup", "true");
            dl.setAttribute("aria-expanded", "false");
            dl.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 11 12 15.5 16.5 11"/><path d="M5 19.5h14"/></svg>';
            dl.addEventListener("click", e => {
                e.stopPropagation();
                if(!window.LT || !LT.mediaMenu) return;
                let imgs = [], vids = [];
                if(mode === "images") imgs = items.slice();
                else if(mode === "videos") vids = items.slice();
                else{
                    items.forEach(it => { if(it.kind === "video") vids.push(it.v); else if(it.src) imgs.push(it.src); });
                }
                LT.mediaMenu(dl, paper.label || paper.title, imgs, vids);
            });
            brk.appendChild(dl);
            fragment.appendChild(brk);
        }

        if(mode === "mixed"){
            if(paperBreaks) addMixedBlocks(items);
            return;
        }

        if(mode === "images"){
            if(paperBreaks) addMixedBlocks(items.map(src => ({ kind: "image", src, paperTitle: paper.title })));
            return;
        }

        if(mode === "videos"){
            if(paperBreaks) addVideoUnits(items.map(v => ({ v, label: paper.label || paper.title })));
            return;
        }

        items.forEach(item => addImage(item, paper.title));
    });

    // Without paper headings, everything is mixed together across papers.
    if(mode === "mixed" && !paperBreaks){
        addMixedBlocks(groups.flatMap(g => g.items));
    }
    if(mode === "images" && !paperBreaks){
        addMixedBlocks(groups.flatMap(g => g.items.map(src => ({ kind: "image", src, paperTitle: g.paper.title }))));
    }
    if(mode === "videos" && !paperBreaks){
        addVideoUnits(groups.flatMap(g => g.items.map(v => ({ v, label: g.paper.label || g.paper.title }))));
    }

    gallery.appendChild(fragment);
    container.appendChild(gallery);

    if(mode === "mixed" || mode === "images") settleSoon();

    const end = document.createElement("p");
    end.className = "end-of-list";
    end.textContent = "— No more " + many.toLowerCase() + " —";
    container.appendChild(end);

    if(favoritesOnly){
        const hidden = hiddenFavoriteCount();
        if(hidden) container.appendChild(favHiddenNote(hidden));
    }
}

function favHiddenNote(n){
    const note = document.createElement("div");
    note.className = "fav-note";
    const msg = document.createElement("span");
    msg.textContent = n + (n === 1 ? " favorite is" : " favorites are") + " in papers that are switched off.";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Show all papers";
    btn.addEventListener("click", selectAll);
    note.append(msg, btn);
    return note;
}

let ratioSaveTimer = null;

function scheduleRatioSave(){
    clearTimeout(ratioSaveTimer);
    ratioSaveTimer = setTimeout(() => saveJson(localStorage, RATIO_KEY, ratios), 400);
}

/* ---------- Remember scroll position when opening an image ---------- */

container.addEventListener("click", (e) => {
    if(e.target.closest(".gallery-image")){
        try{
            sessionStorage.setItem(SCROLL_KEY, window.scrollY);
            sessionStorage.setItem(RETURN_FLAG, "yes");
        }catch(err){}
    }
});

function returningFromViewer(){
    let saved = null;
    let flag = null;

    try{
        saved = sessionStorage.getItem(SCROLL_KEY);
        flag = sessionStorage.getItem(RETURN_FLAG);
        sessionStorage.removeItem(RETURN_FLAG);
    }catch(e){}

    if(saved === null) return null;

    const ref = document.referrer || "";
    const navEntry = performance.getEntriesByType("navigation")[0];
    const cameFromViewer =
        (navEntry && navEntry.type === "back_forward")
            ? true
            : (ref ? /(image|video)\.html/.test(ref) : flag === "yes");

    if(!cameFromViewer){
        try{ sessionStorage.removeItem(SCROLL_KEY); }catch(e){}
        return null;
    }

    return parseInt(saved, 10) || 0;
}

/* ---------- Images / Videos switch ---------- */

let ready = false;

function applyModeUI(){
    modeSwitch.dataset.mode = mode;

    modeSwitch.querySelectorAll("button").forEach(btn => {
        btn.setAttribute("aria-selected", btn.dataset.mode === mode ? "true" : "false");
    });
}

function setMode(next){

    if(!ready || next === mode) return;

    // Only the sorting is separate for Images and Videos; the other settings
    // (paper breaks, file names) are shared and stay as they are.
    settingsBy[mode] = { sortType, paperBreaks: true, showNames };

    mode = next;

    try{ localStorage.setItem(MODE_KEY, mode); }catch(e){}
    try{ sessionStorage.setItem(MODE_KEY, mode); }catch(e){}

    const st = settingsBy[mode];
    sortType = st.sortType;

    papers = lists[mode];
    enabled = enabledBy[mode];

    closeMenus();
    buildOptions();
    updateButtonLabel();
    modeSwitch.classList.add("animate");
    applyModeUI();
    applySettingsUI();

    window.scrollTo({top: 0, behavior: "instant"});

    render();
}

modeSwitch.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", (e) => {
        e.stopPropagation();
        setMode(btn.dataset.mode);
    });
});

/* ---------- Swipe left / right to change tabs ----------
   Deliberately hard to trigger by accident: a long, fast, mostly-horizontal
   swipe, started away from the screen edges (which phones use for Back),
   and never while a menu or popup is open. */

(function(){
    const ORDER = ["images", "mixed", "videos"];
    const MIN_DX = 110;        // px of horizontal travel
    const MAX_MS = 700;        // must be quick
    const EDGE = 28;           // ignore swipes that start at the screen edge
    let st = null;

    function blocked(target){
        if(target.closest && target.closest("input, textarea, select, .top-settings, #settingsPanel, #sortPanel, #warningOverlay")) return true;
        if(document.getElementById("warningOverlay").style.display === "flex") return true;
        if(settingsPanel.classList.contains("open") || sortPanel.classList.contains("open")) return true;
        return false;
    }

    document.addEventListener("touchstart", (e) => {
        st = null;
        if(e.touches.length !== 1 || !ready) return;
        const t = e.touches[0];
        if(t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) return;
        if(blocked(e.target)) return;
        st = { x: t.clientX, y: t.clientY, time: Date.now(), bad: false };
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
        if(!st) return;
        if(e.touches.length !== 1){ st = null; return; }
        const t = e.touches[0];
        // A mostly-vertical drag is a scroll, never a swipe.
        if(Math.abs(t.clientY - st.y) > 60 && Math.abs(t.clientY - st.y) > Math.abs(t.clientX - st.x) * 0.5) st.bad = true;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
        const s0 = st;
        st = null;
        if(!s0 || s0.bad) return;

        const t = e.changedTouches[0];
        const dx = t.clientX - s0.x;
        const dy = t.clientY - s0.y;

        if(Date.now() - s0.time > MAX_MS) return;
        if(Math.abs(dx) < MIN_DX) return;
        if(Math.abs(dy) > Math.abs(dx) * 0.4) return;

        const i = ORDER.indexOf(mode) + (dx < 0 ? 1 : -1);
        if(i < 0 || i >= ORDER.length) return;

        setMode(ORDER[i]);
    }, { passive: true });
})();

/* ---------- Favorites view ---------- */

// Opened only from the home page's Media button, like the Papers favorites
// page: it is its own page, with no toggle to switch it on or off here.
document.getElementById("pageHeading").textContent = favoritesOnly ? "Favorite Media" : "Gallery";
document.title = favoritesOnly ? "Favorite Media" : "Gallery";

// Same wording and look as the empty Favorite Papers page.
function favEmptyHtml(){
    const name = mode === "images" ? "Images" : mode === "videos" ? "Videos" : "Media";
    const what = mode === "images" ? "image" : mode === "videos" ? "video" : "image or video";
    const heart = '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>';
    return '<div class="fav-empty">' +
        '<svg class="fav-empty-icon" viewBox="0 0 24 24" aria-hidden="true">' + heart + '</svg>' +
        '<h2>No Favorite ' + name + '</h2>' +
        '<p>Tap the <svg class="heart-in" viewBox="0 0 24 24" aria-hidden="true">' + heart + '</svg> on any ' + what + ' to save it here.</p>' +
        '</div>';
}

// Un-hearting inside the favorites view removes it right away, exactly like
// un-starring on the Favorite Papers page.
FavMedia.onChange(() => {
    if(!favoritesOnly || !ready) return;
    const y = window.scrollY;
    render();
    window.scrollTo({top: y, behavior: "instant"});
});

/* ---------- Load ---------- */

Promise.all([
    fetch("descriptions.json", { cache: "no-cache" }).then(response => {
        if(!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
    }),
    fetch("page-counts.json").then(r => r.json()).catch(() => ({})),
    fetch("content-pages.json").then(r => r.json()).catch(() => ({}))
])
    .then(([data, counts, contentCounts]) => {

        pageCounts = counts || {};
        contentPageCounts = contentCounts || {};

        const entries = Object.entries(data);

        lists.images = entries
            .map(([key, paper]) => ({key, paper, items: visibleImages(paper)}))
            .filter(p => p.items.length)
            .sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        // A video with a "group" (for example "Other") isn't listed under its
        // paper; it goes into that group in the Papers list instead, shown
        // under "groupLabel" (for example "Featured") where its name appears.
        const videoGroups = {};

        lists.videos = [];

        entries.forEach(([key, paper]) => {

            const normal = [];

            visibleVideos(paper).forEach(v => {
                if(v.group){
                    const g = videoGroups[v.group] || (videoGroups[v.group] = {
                        key: "group:" + v.group,
                        paper: { title: v.group, label: v.groupLabel || v.group, warning: false },
                        items: []
                    });
                    g.items.push(v);
                }else{
                    normal.push(v);
                }
            });

            if(normal.length) lists.videos.push({key, paper, items: normal});
        });

        lists.videos.sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        Object.values(videoGroups).forEach(g => lists.videos.push(g));

        // Everything is on by default, except graphic papers, which stay
        // off until you opt in to them from the menu. (Images and Videos
        // remember their own choices.)
        // Mixed: every paper's images and videos together.
        {
            const byKey = {};
            const add = (e, kind) => {
                const g = byKey[e.key] || (byKey[e.key] = { key: e.key, paper: e.paper, items: [] });
                e.items.forEach(it => g.items.push(kind === "video"
                    ? { kind, v: it, paperLabel: e.paper.label || e.paper.title }
                    : { kind, src: it, paperTitle: e.paper.title }));
            };
            lists.images.forEach(e => add(e, "image"));
            lists.videos.forEach(e => add(e, "video"));
            lists.mixed = Object.values(byKey)
                .sort((a, b) => a.paper.title.localeCompare(b.paper.title));
        }

        ["images", "videos", "mixed"].forEach(m => {

            const stored = loadJson(localStorage, KEYS[m].enabled, {});

            lists[m].forEach(({key, paper}) => {
                if(typeof stored[key] === "boolean"){
                    enabledBy[m][key] = stored[key];
                }else{
                    enabledBy[m][key] = !paper.warning;
                }

                // A remembered "on" for a graphic paper only counts once it
                // has been confirmed again this session.
                if(paper.warning && enabledBy[m][key] && !warningAccepted(key)){
                    enabledBy[m][key] = false;
                }
            });
        });

        papers = lists[mode];
        enabled = enabledBy[mode];
        ready = true;

        buildOptions();
        updateButtonLabel();
        applyModeUI();
        applySettingsUI();

        const restoreTo = returningFromViewer();

        render();

        if(restoreTo !== null){
            const restore = () => window.scrollTo({top: restoreTo, behavior: "instant"});
            requestAnimationFrame(() => requestAnimationFrame(restore));
            window.addEventListener("load", restore, {once: true});
        }
    })
    .catch(error => {
        console.error(error);
        container.innerHTML = '<div class="status">Could not load descriptions.json.</div>';
    });

/* ---------- Back to top ---------- */

const topButton = document.getElementById("topButton");

function updateTopButton(){
    topButton.style.display = window.scrollY > 10 ? "flex" : "none";
}

topButton.addEventListener("click", (e) => {
    e.preventDefault();
    window.scrollTo({top: 0, behavior: "smooth"});
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);

</script>
