<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Images</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

section{
    max-width:1100px;
    margin:auto;
    padding:40px 20px 110px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.back{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:-20px;
    margin-bottom:30px;
}

#imageCount{
    margin:0;
    color:#777;
}

#filterBox{
    box-sizing:border-box;
    width:220px;
    max-width:100%;
    padding:10px 14px;
    background:#1d1d1d;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    font-size:.95em;
    font-family:inherit;
}

#filterBox:focus{
    outline:none;
    border-color:#666;
}

.paper-group{
    background:#1d1d1d;
    border-radius:10px;
    padding:20px;
    margin:15px 0;
}

.paper-group h2{
    margin:0 0 4px;
    font-size:1.15em;
}

.paper-group .count{
    color:#777;
    font-size:.8em;
    margin:0 0 14px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:10px;
}

.gallery a{
    display:block;
}

.gallery img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    background:#141414;
    cursor:pointer;
    transition:.15s;
}

.gallery img:hover{
    transform:scale(1.03);
}

.warning-box{
    text-align:center;
    padding:15px 10px;
}

.warning-icon{
    font-size:3.5rem;
    line-height:1;
    margin-bottom:12px;
}

.warning-box p{
    margin:0 0 16px;
    color:#ddd;
    line-height:1.5;
}

.button{
    display:inline-block;
    background:#333;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-size:1em;
    font-family:inherit;
}

.button:hover{
    background:#444;
}

.status{
    text-align:center;
    color:#888;
    padding:60px 20px;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

@media (max-width:600px){
    .gallery{
        grid-template-columns:repeat(3, 1fr);
        gap:6px;
    }
}
</style>
</head>

<body>

<section>

<a class="back" href="index.html">◀ Home</a>

<h1>All Images</h1>

<div class="info-bar">
    <p id="imageCount"></p>
    <input id="filterBox" type="text" placeholder="Filter by paper..." disabled>
</div>

<div id="gallery-container">
    <div class="status">Loading images...</div>
</div>

</section>

<a href="#" class="top-button" id="topButton">
    <span style="position:relative; top:-3px;">▲</span>
</a>

<script>
const container = document.getElementById("gallery-container");
const countEl = document.getElementById("imageCount");
const filterBox = document.getElementById("filterBox");

let groups = [];

// Same rule the rest of the site uses: images whose name starts with "#$"
// are hidden everywhere, so they are skipped here too.
function visibleImages(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );
}

function viewerUrl(image, paperTitle){
    return "image.html?image=" + encodeURIComponent(image) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

function buildGallery(paper, images){
    const gallery = document.createElement("div");
    gallery.className = "gallery";

    images.forEach(image => {
        const link = document.createElement("a");
        link.href = viewerUrl(image, paper.title);

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = image;
        img.src = image;
        img.onerror = () => link.remove();

        link.appendChild(img);
        gallery.appendChild(link);
    });

    return gallery;
}

function render(){
    const query = filterBox.value.trim().toLowerCase();
    container.innerHTML = "";

    let shownImages = 0;
    let shownPapers = 0;

    groups.forEach(({key, paper, images}) => {
        if(query && !paper.title.toLowerCase().includes(query)) return;

        shownPapers++;
        shownImages += images.length;

        const card = document.createElement("div");
        card.className = "paper-group";

        const title = document.createElement("h2");
        title.textContent = paper.title;

        const count = document.createElement("p");
        count.className = "count";
        count.textContent = images.length + (images.length === 1 ? " image" : " images");

        card.appendChild(title);
        card.appendChild(count);

        // Graphic papers stay behind the same warning the rest of the
        // site uses, remembered for the session per paper.
        const accepted = sessionStorage.getItem("warning-" + key) === "accepted";

        if(paper.warning && !accepted){
            const box = document.createElement("div");
            box.className = "warning-box";
            box.innerHTML =
                '<div class="warning-icon">⚠️</div>' +
                '<p>This paper\'s supporting images contain graphic material, ' +
                'including depictions of severe injuries, death, or war casualties.</p>';

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "button";
            btn.textContent = "I Understand, Show Images";
            btn.addEventListener("click", () => {
                sessionStorage.setItem("warning-" + key, "accepted");
                box.replaceWith(buildGallery(paper, images));
            });

            box.appendChild(btn);
            card.appendChild(box);
        }else{
            card.appendChild(buildGallery(paper, images));
        }

        container.appendChild(card);
    });

    if(!shownPapers){
        container.innerHTML = '<div class="status">No images found.</div>';
    }

    countEl.textContent =
        shownImages + (shownImages === 1 ? " Image" : " Images") +
        " • " + shownPapers + (shownPapers === 1 ? " Paper" : " Papers");
}

fetch("descriptions.json")
    .then(response => {
        if(!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
    })
    .then(data => {
        groups = Object.entries(data)
            .map(([key, paper]) => ({key, paper, images: visibleImages(paper)}))
            .filter(g => g.images.length)
            .sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        filterBox.disabled = false;
        filterBox.addEventListener("input", render);
        render();
    })
    .catch(error => {
        console.error(error);
        container.innerHTML = '<div class="status">Could not load descriptions.json.</div>';
    });

// Back to top
const topButton = document.getElementById("topButton");

function updateTopButton(){
    topButton.style.display = window.scrollY > 10 ? "flex" : "none";
}

topButton.addEventListener("click", e => {
    e.preventDefault();
    window.scrollTo({top: 0, behavior: "smooth"});
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);
</script>

</body>
</html>
