<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

section{
    position:relative;
    max-width:1200px;
    margin:auto;
    padding:40px 20px 110px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.back{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}

.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:-20px;
    margin-bottom:25px;
}

#imageCount{
    margin:0;
    color:#777;
}

/* ---------- Paper dropdown (same look as the Sort dropdown) ---------- */

.paper-dropdown{
    position:relative;
}

.paper-btn{
    background:#222;
    color:#eee;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:.95em;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:170px;
}

.paper-btn:hover{
    background:#262626;
}

.paper-btn-label{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    min-width:0;
}

.paper-caret{
    flex-shrink:0;
    width:0;
    height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:7px solid #999;
    transition:transform .15s ease;
}

.paper-dropdown.open .paper-caret{
    transform:rotate(180deg);
}

.paper-panel{
    box-sizing:border-box;
    display:none;
    flex-direction:column;
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    width:280px;
    max-width:calc(100vw - 24px);
    max-height:min(65vh, 460px);
    background:#1d1d1d;
    border:1px solid #2c2c2c;
    border-radius:10px;
    padding:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    z-index:1600;
    text-align:left;
}

.paper-panel.open{
    display:flex;
}

.paper-panel-actions{
    display:flex;
    gap:8px;
    padding-bottom:8px;
    margin-bottom:6px;
    border-bottom:1px solid #2c2c2c;
    flex:0 0 auto;
}

.panel-action{
    flex:1;
    background:#2e2e2e;
    color:#ddd;
    border:0;
    border-radius:6px;
    padding:7px 6px;
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
}

.panel-action:hover{
    background:#383838;
}

.paper-option-list{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
}

.paper-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
    padding:8px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#ddd;
    font-size:13px;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
}

.paper-option:hover{
    background:#262626;
}

.paper-option.active{
    background:#262626;
    color:#fff;
}

.paper-option-label{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.paper-option-count{
    flex:0 0 auto;
    color:#777;
    font-size:11.5px;
}

.paper-option-check{
    flex:0 0 auto;
    min-width:14px;
    text-align:center;
    color:#999;
    visibility:hidden;
}

.paper-option.active .paper-option-check{
    visibility:visible;
}

/* ---------- One big justified gallery ----------
   Every row is the same height; each picture's width follows its own
   shape, and the row stretches to fill the full width, so tall images
   get narrower and wide ones wider and everything locks together. */

.gallery{
    --row-h:220px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.gallery::after{
    content:"";
    flex-grow:1000000;
}

.gallery-image{
    position:relative;
    display:block;
    flex-shrink:1;
    flex-basis:calc(var(--ar) * var(--row-h));
    background:#1a1a1a;
    border-radius:6px;
    overflow:hidden;
}

.gallery-image i{
    display:block;
    padding-bottom:calc(100% / var(--ar));
}

.gallery-image img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
    transition:transform .2s ease;
}

.gallery-image:hover img{
    transform:scale(1.04);
}

.status{
    text-align:center;
    color:#888;
    padding:70px 20px;
}

/* ---------- Graphic content warning ---------- */

#warningOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    justify-content:center;
    align-items:center;
    z-index:999999;
    padding:20px;
    box-sizing:border-box;
}

#warningBox{
    background:#1d1d1d;
    width:100%;
    max-width:420px;
    padding:25px;
    border-radius:12px;
    text-align:center;
}

.warningIcon{
    font-size:60px;
    margin-bottom:12px;
}

#warningBox h2{
    margin:0 0 10px;
}

#warningBox p{
    color:#bbb;
    line-height:1.4;
}

.warningButtons{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.warningButtons button{
    flex:1;
    padding:12px;
    background:#333;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-family:inherit;
}

.warningButtons button:hover{
    background:#444;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

@media (max-width:700px){
    section{
        padding:30px 10px 110px;
    }
    .gallery{
        --row-h:130px;
        gap:4px;
    }
}
</style>
</head>

<body>

<section>

<a class="back" href="index.html"><svg class="back-arrow" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;vertical-align:-.12em;margin-right:.35em;flex-shrink:0"><path d="M18 4.5v15L5.5 12z"/></svg> Home</a>

<h1>Gallery</h1>

<div class="info-bar">

    <p id="imageCount"></p>

    <div class="paper-dropdown" id="paperDropdown">

        <button class="paper-btn" id="paperButton" type="button" aria-label="Choose papers">
            <span class="paper-btn-label" id="paperButtonLabel">All Papers</span>
            <span class="paper-caret" aria-hidden="true"></span>
        </button>

        <div class="paper-panel" id="paperPanel">

            <div class="paper-panel-actions">
                <button type="button" class="panel-action" id="selectAllBtn">Select All</button>
                <button type="button" class="panel-action" id="clearAllBtn">Clear All</button>
            </div>

            <div class="paper-option-list" id="paperOptionList"></div>

        </div>

    </div>

</div>

<div id="galleryContainer">
    <div class="status">Loading images...</div>
</div>

</section>

<a href="#" class="top-button" id="topButton">
    <span style="position:relative; top:-3px;">▲</span>
</a>

<div id="warningOverlay">
    <div id="warningBox">
        <div class="warningIcon"><svg class="warn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:60px;height:60px;color:#e8b13a;display:block;margin:0 auto;"><path d="M12 3.6 21.8 20.4H2.2Z"/><line x1="12" y1="10" x2="12" y2="14.6"/><line x1="12" y1="17.4" x2="12" y2="17.5"/></svg></div>
        <h2>Graphic Images</h2>
        <p id="warningText">This paper's images contain graphic material, including depictions of severe injuries, death, or war casualties.</p>
        <div class="warningButtons">
            <button type="button" id="warningCancel">Cancel</button>
            <button type="button" id="warningContinue">Show Images</button>
        </div>
    </div>
</div>

<script>

const container = document.getElementById("galleryContainer");
const countEl = document.getElementById("imageCount");

const paperDropdown = document.getElementById("paperDropdown");
const paperButton = document.getElementById("paperButton");
const paperButtonLabel = document.getElementById("paperButtonLabel");
const paperPanel = document.getElementById("paperPanel");
const paperOptionList = document.getElementById("paperOptionList");

const WARN_ICON_SMALL = "<svg class=\"warn-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:14px;height:14px;color:#e8b13a;vertical-align:-2px;margin-right:6px\"><path d=\"M12 3.6 21.8 20.4H2.2Z\"/><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14.6\"/><line x1=\"12\" y1=\"17.4\" x2=\"12\" y2=\"17.5\"/></svg>";

const SCROLL_KEY = "galleryScroll";
const RETURN_FLAG = "galleryReturn";
const RATIO_KEY = "galleryRatios";
const ENABLED_KEY = "galleryEnabled";

// Gallery images keep a sane shape inside the rows; anything more extreme
// than this gets cropped slightly instead of becoming a thin sliver.
const MIN_RATIO = 0.4;
const MAX_RATIO = 3.5;
const DEFAULT_RATIO = 1.33;

let papers = [];        // [{key, paper, images}]
let enabled = {};       // key -> true/false
let ratios = {};        // image path -> width / height
let pendingWarningKey = null;

/* ---------- Small storage helpers (safe if storage is blocked) ---------- */

function loadJson(storage, key, fallback){
    try{
        const raw = storage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    }catch(e){
        return fallback;
    }
}

function saveJson(storage, key, value){
    try{
        storage.setItem(key, JSON.stringify(value));
    }catch(e){}
}

ratios = loadJson(localStorage, RATIO_KEY, {});

/* ---------- Data ---------- */

// Same rule as the rest of the site: "#$" images are hidden everywhere.
function visibleImages(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );
}

function warningAccepted(key){
    return sessionStorage.getItem("warning-" + key) === "accepted";
}

// Opens the image in the exact same viewer, the exact same way as
// category.html, and returns here when you press Back.
function viewerUrl(image, paperTitle){
    return "image.html?image=" + encodeURIComponent(image) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

function clampRatio(r){
    return Math.max(MIN_RATIO, Math.min(MAX_RATIO, r));
}

/* ---------- Dropdown ---------- */

function enabledCount(){
    return papers.filter(p => enabled[p.key]).length;
}

function updateButtonLabel(){
    const on = enabledCount();

    if(on === papers.length){
        paperButtonLabel.textContent = "All Papers";
    }else if(on === 0){
        paperButtonLabel.textContent = "No Papers";
    }else{
        paperButtonLabel.textContent = on + " of " + papers.length + " Papers";
    }
}

function buildOptions(){
    paperOptionList.innerHTML = "";

    papers.forEach(({key, paper, images}) => {

        const row = document.createElement("button");
        row.type = "button";
        row.className = "paper-option" + (enabled[key] ? " active" : "");
        row.dataset.key = key;
        row.setAttribute("role", "menuitemcheckbox");
        row.setAttribute("aria-checked", enabled[key] ? "true" : "false");

        const label = document.createElement("span");
        label.className = "paper-option-label";
        label.textContent = paper.title;
        if(paper.warning){
            label.insertAdjacentHTML("afterbegin", WARN_ICON_SMALL);
        }

        const count = document.createElement("span");
        count.className = "paper-option-count";
        count.textContent = images.length;

        const check = document.createElement("span");
        check.className = "paper-option-check";
        check.textContent = "✓";

        row.append(label, count, check);

        row.addEventListener("click", (e) => {
            e.stopPropagation();
            togglePaper(key);
        });

        paperOptionList.appendChild(row);
    });
}

function refreshOptionStates(){
    paperOptionList.querySelectorAll(".paper-option").forEach(row => {
        const on = !!enabled[row.dataset.key];
        row.classList.toggle("active", on);
        row.setAttribute("aria-checked", on ? "true" : "false");
    });
    updateButtonLabel();
}

function setEnabled(key, value){
    enabled[key] = value;
}

function persistEnabled(){
    saveJson(localStorage, ENABLED_KEY, enabled);
}

function togglePaper(key){
    const entry = papers.find(p => p.key === key);
    if(!entry) return;

    // Turning a graphic paper ON asks first (once per session).
    if(!enabled[key] && entry.paper.warning && !warningAccepted(key)){
        askWarning([key]);
        return;
    }

    setEnabled(key, !enabled[key]);
    persistEnabled();
    refreshOptionStates();
    render();
}

function selectAll(){
    const needWarning = papers
        .filter(p => p.paper.warning && !warningAccepted(p.key) && !enabled[p.key])
        .map(p => p.key);

    // Everything that is not graphic turns on right away.
    papers.forEach(p => {
        if(!p.paper.warning || warningAccepted(p.key)){
            setEnabled(p.key, true);
        }
    });

    persistEnabled();
    refreshOptionStates();
    render();

    if(needWarning.length){
        askWarning(needWarning);
    }
}

function clearAll(){
    papers.forEach(p => setEnabled(p.key, false));
    persistEnabled();
    refreshOptionStates();
    render();
}

function openPanel(){
    paperPanel.classList.add("open");
    paperDropdown.classList.add("open");
}

function closePanel(){
    paperPanel.classList.remove("open");
    paperDropdown.classList.remove("open");
}

paperButton.addEventListener("click", (e) => {
    e.stopPropagation();
    if(paperPanel.classList.contains("open")){
        closePanel();
    }else{
        openPanel();
    }
});

paperPanel.addEventListener("click", (e) => e.stopPropagation());

document.addEventListener("click", closePanel);

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
        closePanel();
        closeWarning();
    }
});

document.getElementById("selectAllBtn").addEventListener("click", selectAll);
document.getElementById("clearAllBtn").addEventListener("click", clearAll);

/* ---------- Graphic content warning ---------- */

let pendingWarningKeys = [];

function askWarning(keys){
    pendingWarningKeys = keys;

    const titles = keys
        .map(k => papers.find(p => p.key === k))
        .filter(Boolean)
        .map(p => p.paper.title);

    document.getElementById("warningText").textContent =
        titles.length === 1
            ? "\"" + titles[0] + "\" contains graphic material, including depictions of severe injuries, death, or war casualties."
            : titles.length + " of these papers contain graphic material, including depictions of severe injuries, death, or war casualties.";

    document.getElementById("warningOverlay").style.display = "flex";
}

function closeWarning(){
    document.getElementById("warningOverlay").style.display = "none";
    pendingWarningKeys = [];
}

document.getElementById("warningCancel").addEventListener("click", closeWarning);

document.getElementById("warningOverlay").addEventListener("click", (e) => {
    if(e.target.id === "warningOverlay") closeWarning();
});

document.getElementById("warningContinue").addEventListener("click", () => {
    pendingWarningKeys.forEach(key => {
        sessionStorage.setItem("warning-" + key, "accepted");
        setEnabled(key, true);
    });

    persistEnabled();
    closeWarning();
    refreshOptionStates();
    render();
});

/* ---------- Gallery ---------- */

function applyRatio(link, ratio){
    const r = clampRatio(ratio);
    link.style.setProperty("--ar", r);
    link.style.flexGrow = String(r * 100);
}

function render(){

    container.innerHTML = "";

    const visible = [];

    papers.forEach(({key, paper, images}) => {
        if(!enabled[key]) return;
        images.forEach(image => visible.push({image, title: paper.title}));
    });

    countEl.textContent =
        visible.length + (visible.length === 1 ? " Image" : " Images");

    if(!visible.length){
        container.innerHTML =
            '<div class="status">No papers selected. Use the menu above to choose which papers to show.</div>';
        return;
    }

    const gallery = document.createElement("div");
    gallery.className = "gallery";

    const fragment = document.createDocumentFragment();

    visible.forEach(({image, title}) => {

        const link = document.createElement("a");
        link.className = "gallery-image";
        link.href = viewerUrl(image, title);

        applyRatio(link, ratios[image] || DEFAULT_RATIO);

        const spacer = document.createElement("i");

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = title;
        img.src = image;

        img.addEventListener("load", () => {
            if(!img.naturalWidth || !img.naturalHeight) return;

            const real = img.naturalWidth / img.naturalHeight;
            const known = ratios[image];

            if(!known || Math.abs(known - real) > 0.001){
                ratios[image] = real;
                applyRatio(link, real);
                scheduleRatioSave();
            }
        });

        img.addEventListener("error", () => link.remove());

        link.append(spacer, img);
        fragment.appendChild(link);
    });

    gallery.appendChild(fragment);
    container.appendChild(gallery);
}

let ratioSaveTimer = null;

function scheduleRatioSave(){
    clearTimeout(ratioSaveTimer);
    ratioSaveTimer = setTimeout(() => saveJson(localStorage, RATIO_KEY, ratios), 400);
}

/* ---------- Remember scroll position when opening an image ---------- */

container.addEventListener("click", (e) => {
    if(e.target.closest(".gallery-image")){
        try{
            sessionStorage.setItem(SCROLL_KEY, window.scrollY);
            sessionStorage.setItem(RETURN_FLAG, "yes");
        }catch(err){}
    }
});

function returningFromViewer(){
    let saved = null;
    let flag = null;

    try{
        saved = sessionStorage.getItem(SCROLL_KEY);
        flag = sessionStorage.getItem(RETURN_FLAG);
        sessionStorage.removeItem(RETURN_FLAG);
    }catch(e){}

    if(saved === null) return null;

    const ref = document.referrer || "";
    const cameFromViewer = ref ? /image\.html/.test(ref) : flag === "yes";

    if(!cameFromViewer){
        try{ sessionStorage.removeItem(SCROLL_KEY); }catch(e){}
        return null;
    }

    return parseInt(saved, 10) || 0;
}

/* ---------- Load ---------- */

fetch("descriptions.json")
    .then(response => {
        if(!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
    })
    .then(data => {

        papers = Object.entries(data)
            .map(([key, paper]) => ({key, paper, images: visibleImages(paper)}))
            .filter(p => p.images.length)
            .sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        // Everything is on by default, except graphic papers, which stay
        // off until you opt in to them from the menu.
        const stored = loadJson(localStorage, ENABLED_KEY, {});

        papers.forEach(({key, paper}) => {
            if(typeof stored[key] === "boolean"){
                enabled[key] = stored[key];
            }else{
                enabled[key] = !paper.warning;
            }

            // A remembered "on" for a graphic paper only counts once it
            // has been confirmed again this session.
            if(paper.warning && enabled[key] && !warningAccepted(key)){
                enabled[key] = false;
            }
        });

        buildOptions();
        updateButtonLabel();

        const restoreTo = returningFromViewer();

        render();

        if(restoreTo !== null){
            const restore = () => window.scrollTo({top: restoreTo, behavior: "instant"});
            requestAnimationFrame(() => requestAnimationFrame(restore));
            window.addEventListener("load", restore, {once: true});
        }
    })
    .catch(error => {
        console.error(error);
        container.innerHTML = '<div class="status">Could not load descriptions.json.</div>';
    });

/* ---------- Back to top ---------- */

const topButton = document.getElementById("topButton");

function updateTopButton(){
    topButton.style.display = window.scrollY > 10 ? "flex" : "none";
}

topButton.addEventListener("click", (e) => {
    e.preventDefault();
    window.scrollTo({top: 0, behavior: "smooth"});
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);

</script>

</body>
</html>
