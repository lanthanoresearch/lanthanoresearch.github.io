<!DOCTYPE html>
<html>
<head>
<script>
/* A refresh starts this page fresh, from the top, like a normal new visit.
   Only this page's remembered "where I was" is forgotten - saved settings,
   favorites and other saved data are never touched. (Coming back from a
   paper/image/video/other page still restores your spot; only a reload
   resets it.) */
(function(){
  try{
    var keys = ["galleryScroll", "galleryReturn"];
    var prefixes = [];

    function forget(){
      keys.forEach(function(k){ sessionStorage.removeItem(k); });
      Object.keys(sessionStorage).forEach(function(k){
        for(var i = 0; i < prefixes.length; i++){
          if(k.indexOf(prefixes[i]) === 0){ sessionStorage.removeItem(k); break; }
        }
      });
    }

    // Page restored whole from the browser's back/forward cache: it is
    // already exactly as it was, so drop any leftover "restore me" notes.
    window.addEventListener("pageshow", function(e){
      if(e.persisted){ try{ forget(); }catch(err){} }
    });

    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var isReload = nav ? nav.type === "reload"
      : (performance.navigation && performance.navigation.type === 1);
    if(!isReload) return;

    forget();

    if("scrollRestoration" in history) history.scrollRestoration = "manual";

    var top = function(){ window.scrollTo({top:0, behavior:"instant"}); };
    top();
    window.addEventListener("load", function(){
      top();
      requestAnimationFrame(function(){
        top();
        if("scrollRestoration" in history) history.scrollRestoration = "auto";
      });
    });
  }catch(e){}
})();
</script>
<script>
/* Home / Back links: when the page you came from is the one just before
   this one in the browser's history, step back through the history (the
   page comes back exactly as you left it and the phone's own back button
   stays consistent). Otherwise just open the page. */
(function(){
  function norm(p){ return p.replace(/index\.html$/, ""); }

  window.__goHome = function(){
    var dest = "index.html";
    var canStep = false;
    try{
      if(history.length > 1 && document.referrer){
        var r = new URL(document.referrer), t = new URL(dest, location.href);
        canStep = r.origin === t.origin && norm(r.pathname) === norm(t.pathname);
      }
    }catch(e){}

    if(!canStep){ location.assign(dest); return; }

    var fallback = setTimeout(function(){ location.assign(dest); }, 1200);
    window.addEventListener("pagehide", function(){ clearTimeout(fallback); }, {once:true});
    history.back();
  };

  document.addEventListener("click", function(e){
    if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href="index.html"]') : null;
    if(!a || (a.target && a.target !== "_self")) return;
    e.preventDefault();
    window.__goHome();
  });
})();
</script>

.settings-btn{

       to keep it visible/reachable behind the panel.

    right:0;

    width:230px;
    max-width:calc(100vw - 24px);

    padding:8px;

/* Pushes the last row of a paper to stay natural width instead of
   stretching a lone picture across the whole page. */
.gallery-fill{
    flex:1000000 1 0;
    margin-left:calc(var(--gap) * -1);
}

.end-of-list{
    text-align:center;
    color:#555;
    font-size:.85em;

}

/* ---------- One big justified gallery ----------
   Every row is the same height; each picture's width follows its own
   shape, and the row stretches to fill the full width, so tall images
   get narrower and wide ones wider and everything locks together. */

.gallery{
    --row-h:220px;
    --gap:6px;
    display:flex;
    flex-wrap:wrap;
    gap:var(--gap);
}

.gallery::after{
    content:"";
    flex:1000000 1 0;
    margin-left:calc(var(--gap) * -1);
}

.gallery-image{
    position:relative;
    display:block;
    flex-shrink:1;
    flex-basis:calc(var(--ar) * var(--row-h));
    background:#1a1a1a;
    border-radius:6px;
    overflow:hidden;
}

.gallery-image i{
    display:block;
    padding-bottom:calc(100% / var(--ar));
}

.gallery-image img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
    transition:transform .2s ease;
}

.gallery-image:hover img{
    transform:scale(1.04);
}

.status{

    color:#888;
    padding:70px 20px;
}

/* ---------- Images / Videos switch ---------- */

.mode-switch{
    position:relative;
    display:flex;
    width:min(340px, 100%);
    margin:0 auto 42px;
    padding:3px;
    box-sizing:border-box;
    background:#1a1a1a;
    border:1px solid #2c2c2c;
    border-radius:999px;
}

.mode-pill{
    position:absolute;
    top:3px;
    bottom:3px;
    left:3px;
    width:calc(33.3333% - 2px);
    background:#3a3a3a;
    border-radius:999px;
}

.mode-switch.animate .mode-pill{
    transition:transform .25s ease;
}

.mode-switch[data-mode="mixed"] .mode-pill{
    transform:translateX(100%);
}

.mode-switch[data-mode="videos"] .mode-pill{
    transform:translateX(200%);
}

/* Mixed: one justified puzzle. Pictures and videos share rows; a video
   can take a row alone or sit beside another video or pictures, and every
   row locks to the full width. */
.mixed-wrap{
    --gap:6px;
}
.mixrow{
    display:flex;
    gap:var(--gap);
}
.mixrow + .mixrow{
    margin-top:var(--gap);
}
.mixrow .gallery-image{
    flex-basis:0;
    min-width:0;
}
.mixrow.natural{
    justify-content:flex-start;
}
.mixrow.natural .gallery-image{
    flex:0 0 auto !important;
    width:calc(var(--ar) * var(--nat-h));
    max-width:100%;
}

.mode-switch button{
    position:relative;
    flex:1;
    padding:8px 0;
    background:none;
    border:0;
    color:#999;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    border-radius:999px;
    transition:color .2s ease;
}

.mode-switch button[aria-selected="true"]{

}

.settings-mode-note{

    padding:2px 10px 8px;
}

/* ---------- Video tiles (drawn from text; the picture is a small
   thumbnail from this site, never anything from the video storage) ---------- */

.gallery.videos{
    --row-h:150px;
    --gap:8px;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
}

.gallery.videos::after{

/* Every video tile is the same 16:9 shape, two across (one across on

.gallery.videos .gallery-image{

.gallery.videos .gallery-image i{

.gallery.videos .gallery-fill{

<style id="favMediaCss">
/* ---------- Favorite media (heart) ----------
   Same idea as the star on papers, for images and videos. The saved list is
   the "favoriteMedia" entry in this browser's storage, shared by every page. */
.fav-heart{
position:absolute;
top:6px;
right:6px;
width:28px;
height:28px;
box-sizing:border-box;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.5);
color:#fff;
cursor:pointer;
user-select:none;
-webkit-user-select:none;
-webkit-tap-highlight-color:transparent;
z-index:5;
transition:transform .15s ease, background .15s ease, color .15s ease;
}
.fav-heart::before{content:"";position:absolute;inset:-7px}
.fav-heart svg{
width:16px;
height:16px;
display:block;
fill:none;
stroke:currentColor;
stroke-width:2;
stroke-linejoin:round;
stroke-linecap:round;
pointer-events:none;
}
.fav-heart:hover{transform:scale(1.12);background:rgba(0,0,0,.72)}
.fav-heart:focus-visible{outline:2px solid #ff8a96;outline-offset:2px}
.fav-heart.active{color:#ff3b4f}
.fav-heart.active svg{fill:#ff3b4f;filter:drop-shadow(0 0 4px rgba(255,59,79,.6))}
.fav-heart.pop svg{animation:favHeartPop .3s ease}
@keyframes favHeartPop{0%{transform:scale(.7)}55%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.fav-heart,.fav-heart.pop svg{transition:none;animation:none}}
</style>
<script id="favMediaJs">
/* Favorite media: one small shared helper (the same copy lives on the
   gallery, category and home pages). Keys look like "i:<image path>" or
   "v:<video file>" and are saved as a list under "favoriteMedia". */
(function(){
  if(window.FavMedia) return;

  var KEY = "favoriteMedia";
  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  var mem = null, raw = null, set = new Set(), listeners = [];

  function read(){
    var r = null;
    try{ r = localStorage.getItem(KEY); }catch(e){ r = mem; }
    if(r === raw) return set;
    raw = r;
    set = new Set();
    try{
      var a = JSON.parse(r || "[]");
      if(Array.isArray(a)) a.forEach(function(k){ if(typeof k === "string" && k) set.add(k); });
    }catch(e){}
    return set;
  }

  function write(){
    var s = JSON.stringify(Array.from(set));
    mem = s;
    try{ localStorage.setItem(KEY, s); }catch(e){}
    raw = s;
  }

  function key(kind, path){
    return (kind === "video" ? "v:" : "i:") + String(path == null ? "" : path).trim();
  }

  function esc(t){
    return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function has(k){ return read().has(k); }

  function toggle(k){
    read();
    var on = !set.has(k);
    if(on) set.add(k); else set.delete(k);
    write();
    return on;
  }

  function paint(el){
    var on = has(el.getAttribute("data-fav"));
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    var label = on ? "Remove from favorite media" : "Add to favorite media";
    el.setAttribute("aria-label", label);
    el.setAttribute("title", label);
  }

  function sync(root){
    (root || document).querySelectorAll(".fav-heart").forEach(paint);
  }

  function notify(){
    listeners.slice().forEach(function(fn){ try{ fn(); }catch(e){} });
  }

  function heart(kind, path, extra){
    var k = key(kind, path), on = has(k);
    var label = on ? "Remove from favorite media" : "Add to favorite media";
    return '<span class="fav-heart' + (on ? " active" : "") + (extra ? " " + extra : "") +
      '" role="button" tabindex="0" data-fav="' + esc(k) + '" aria-pressed="' + (on ? "true" : "false") +
      '" aria-label="' + label + '" title="' + label + '">' + HEART + '</span>';
  }

  function el(kind, path, extra){
    var d = document.createElement("div");
    d.innerHTML = heart(kind, path, extra);
    return d.firstChild;
  }

  function flip(h){
    var on = toggle(h.getAttribute("data-fav"));
    sync();
    h.classList.remove("pop");
    if(on){ void h.offsetWidth; h.classList.add("pop"); }
    notify();
  }

  // Captured first, so tapping a heart never opens the image or video under it.
  document.addEventListener("click", function(e){
    var h = e.target && e.target.closest ? e.target.closest(".fav-heart") : null;
    if(!h) return;
    e.preventDefault();
    e.stopPropagation();
    flip(h);
  }, true);

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var h = e.target && e.target.closest ? e.target.closest(".fav-heart") : null;
    if(!h) return;
    e.preventDefault();
    e.stopPropagation();
    flip(h);
  }, true);

  function refresh(){ sync(); notify(); }

  window.addEventListener("storage", function(e){
    if(e.key === KEY || e.key === null) refresh();
  });
  window.addEventListener("pageshow", function(e){ if(e.persisted) refresh(); });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refresh();
  });

  window.FavMedia = {
    key: key,
    has: has,
    toggle: toggle,
    heart: heart,
    el: el,
    sync: sync,
    count: function(){ return read().size; },
    onChange: function(fn){ listeners.push(fn); }
  };
})();
</script>
</head>

<script>

const container = document.getElementById("galleryContainer");
const countEl = document.getElementById("imageCount");

const paperOptionList = document.getElementById("paperOptionList");

const WARN_ICON_SMALL = "<svg class=\"warn-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"width:14px;height:14px;color:#e8b13a;vertical-align:-2px;margin-right:6px\"><path d=\"M12 3.6 21.8 20.4H2.2Z\"/><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14.6\"/><line x1=\"12\" y1=\"17.4\" x2=\"12\" y2=\"17.5\"/></svg>";

const SCROLL_KEY = "galleryScroll";
const RETURN_FLAG = "galleryReturn";
const RATIO_KEY = "galleryRatios";

// Images and Videos each keep their own settings (saved separately).
const MODE_KEY = "galleryMode";

const KEYS = {
    images: { sort: "gallerySort",      breaks: "galleryPaperBreaks",      enabled: "galleryEnabled",      names: "galleryShowNames" },
    videos: { sort: "galleryVideoSort", breaks: "galleryPaperBreaks",      enabled: "galleryVideoEnabled", names: "galleryShowNames" },
    mixed:  { sort: "galleryMixedSort", breaks: "galleryPaperBreaks",      enabled: "galleryMixedEnabled", names: "galleryShowNames" }
};

const WORDS = { images: ["Image", "Images"], videos: ["Video", "Videos"], mixed: ["Item", "Items"] };

let mode = "images";

// "Favorites only": the same gallery, but showing just the images and videos
// that have a heart. Opened from the home page's Media button
// (gallery.html?favorites=1) or with the Favorites button here.
let favoritesOnly = false;
try{ favoritesOnly = new URLSearchParams(location.search).get("favorites") === "1"; }catch(e){}

try{
    { const a = localStorage.getItem(MODE_KEY); if(a === "videos" || a === "mixed") mode = a; }
}catch(e){}
try{
    // Backup copy for browsers that block long-term storage.
    { const a = sessionStorage.getItem(MODE_KEY); if(a === "videos" || a === "mixed") mode = a; }
}catch(e){}

const lists = { images: [], videos: [], mixed: [] };      // [{key, paper, items}]
const enabledBy = { images: {}, videos: {}, mixed: {} };  // paper key -> true/false

// Gallery images keep a sane shape inside the rows; anything more extreme
// than this gets cropped slightly instead of becoming a thin sliver.
const MIN_RATIO = 0.4;
const MAX_RATIO = 3.5;
const DEFAULT_RATIO = 1.33;

if(favoritesOnly) mode = "mixed";   // landing from the Media button (not saved)

let papers = lists[mode];        // the papers of the current view
let enabled = enabledBy[mode];   // which of them are switched on
let ratios = {};        // image path -> width / height
let pendingWarningKey = null;

let pageCounts = {};
let contentPageCounts = {};
let lastRenderAt = 0;

/* ---------- Sorting (same groups/behavior as category.html) ---------- */

const sortLabels = {
    az: "A-Z",
    za: "Z-A",
    newest: "Newest",
    oldest: "Oldest",
    mostimages: "Most Images",
    leastimages: "Least Images",
    mostreadtime: "Longest Read",
    leastreadtime: "Shortest Read"
};

const SORT_GROUPS = {
    title:    { label: "Title",        asc: "az",            desc: "za" },
    date:     { label: "Date",         asc: "oldest",        desc: "newest" },
    images:   { label: "Images",       asc: "leastimages",   desc: "mostimages" },
    readtime: { label: "Reading Time", asc: "leastreadtime", desc: "mostreadtime" }
};

function loadModeSettings(m){
    const o = { sortType: "az", paperBreaks: false, showNames: false };
    const k = KEYS[m];

    try{
        const s = localStorage.getItem(k.sort);
        if(s === "az" || s === "za") o.sortType = s;
        o.paperBreaks = localStorage.getItem(KEYS.images.breaks) === "true";
        o.showNames = localStorage.getItem(KEYS.images.names) === "true";
    }catch(e){}

    return o;
}

const settingsBy = {
    images: loadModeSettings("images"),
    videos: loadModeSettings("videos"),
    mixed: loadModeSettings("mixed")
};

let sortType = settingsBy[mode].sortType;
let paperBreaks = settingsBy[mode].paperBreaks;
let showNames = settingsBy[mode].showNames;
let readingLevel = "average";

try{
    const r = localStorage.getItem("readingLevel");
    if(r) readingLevel = r;
}catch(e){}

function sortLabel(type){
    const base = sortLabels[type] || "Sort";
    return mode === "videos" ? base.replace("Images", "Videos")
        : mode === "mixed" ? base.replace("Images", "Items") : base;
}

function getActiveSortGroup(){
    for(const [key, group] of Object.entries(SORT_GROUPS)){
        if(sortType === group.asc) return { key, direction: "asc" };
        if(sortType === group.desc) return { key, direction: "desc" };
    }
    return { key: null, direction: null };
}

/* ---- Reading time (identical math to category.html) ---- */

const WORDS_PER_PAGE = 500;
const READING_WPM = { slow: 150, average: 200, fast: 300 };

function getContentPageCount(key, paper){
    if(typeof paper.contentPages === "number") return paper.contentPages;
    if(paper.url && typeof contentPageCounts[paper.url] === "number"){
        return contentPageCounts[paper.url];
    }
    return Number(pageCounts[key]) || 0;
}

function getReadMinutes(key, paper){
    const pages = getContentPageCount(key, paper);
    if(pages <= 0) return 0;
    const wpm = READING_WPM[readingLevel] || READING_WPM.average;
    return Math.max(1, Math.round((pages * WORDS_PER_PAGE) / wpm));
}

const SORTERS = {
    az:            (a, b) => (a.paper.title || "").localeCompare(b.paper.title || ""),
    za:            (a, b) => (b.paper.title || "").localeCompare(a.paper.title || ""),
    newest:        (a, b) => (b.paper.updated || "").localeCompare(a.paper.updated || ""),
    oldest:        (a, b) => (a.paper.updated || "").localeCompare(b.paper.updated || ""),
    mostimages:    (a, b) => b.items.length - a.items.length,
    leastimages:   (a, b) => a.items.length - b.items.length,
    mostreadtime:  (a, b) => getReadMinutes(b.key, b.paper) - getReadMinutes(a.key, a.paper),
    leastreadtime: (a, b) => getReadMinutes(a.key, a.paper) - getReadMinutes(b.key, b.paper)
};

// The favorites key of one gallery item, whichever tab it is in.
function favKeyOf(it){
    if(mode === "mixed") return it.kind === "video" ? FavMedia.key("video", it.v.file) : FavMedia.key("image", it.src);
    return mode === "videos" ? FavMedia.key("video", it.file) : FavMedia.key("image", it);
}

function isFavItem(it){
    return FavMedia.has(favKeyOf(it));
}

// What a paper contributes right now (only its favorites in favorites view).
function shownItems(p){
    return favoritesOnly ? p.items.filter(isFavItem) : p.items;
}

// Favorites that belong to papers switched off in the menu.
function hiddenFavoriteCount(){
    let n = 0;
    papers.forEach(p => { if(!enabled[p.key]) n += p.items.filter(isFavItem).length; });
    return n;
}

function sortedEnabledPapers(){
    // Start from A-Z so ties fall back to alphabetical, then apply the
    // chosen sort (Array.sort is stable).
    return papers
        .filter(p => enabled[p.key])
        .map(p => favoritesOnly ? { key: p.key, paper: p.paper, items: shownItems(p) } : p)
        .filter(p => p.items.length)
        .sort(SORTERS.az)
        .sort(SORTERS[sortType] || SORTERS.az);
}

/* ---------- Settings + sort menus (same behavior as category.html) ---------- */

const settingsButton = document.getElementById("settingsButton");
const settingsPanel = document.getElementById("settingsPanel");
const sortButton = document.getElementById("sortButton");
const sortPanel = document.getElementById("sortPanel");
const sortDropdown = document.getElementById("sortDropdown");
const paperBreaksToggle = document.getElementById("paperBreaksToggle");
const showNamesToggle = document.getElementById("showNamesToggle");
const modeSwitch = document.getElementById("modeSwitch");


function applySortUI(){
    const active = getActiveSortGroup();

    document.querySelectorAll(".sort-option").forEach(btn => {
        const groupKey = btn.dataset.group;
        const isActive = groupKey === active.key;

        btn.classList.toggle("active", isActive);

        const direction = isActive ? active.direction : "asc";
        const arrow = btn.querySelector(".sort-option-arrow");
        arrow.textContent = direction === "desc" ? "↓" : "↑";
        arrow.style.visibility = isActive ? "visible" : "hidden";
    });

    document.getElementById("sortButtonLabel").textContent =
        sortLabel(sortType);
}

function applySettingsUI(){
    paperBreaksToggle.classList.toggle("active", paperBreaks);
    paperBreaksToggle.setAttribute("aria-checked", paperBreaks ? "true" : "false");

    showNamesToggle.classList.toggle("active", showNames);
    showNamesToggle.setAttribute("aria-checked", showNames ? "true" : "false");

    container.classList.toggle("show-names", showNames);


    applySortUI();
}

function closeMenus(){
    settingsPanel.classList.remove("open");
    settingsButton.setAttribute("aria-expanded", "false");
    sortPanel.classList.remove("open");
    sortDropdown.classList.remove("open");
}

settingsButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !settingsPanel.classList.contains("open");
    closeMenus();
    if(willOpen){
        settingsPanel.classList.add("open");
        settingsButton.setAttribute("aria-expanded", "true");
    }
});

document.getElementById("settingsCloseBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    closeMenus();
});

sortButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !sortPanel.classList.contains("open");
    closeMenus();
    if(willOpen){
        sortPanel.classList.add("open");
        sortDropdown.classList.add("open");
    }
});

sortPanel.addEventListener("click", (e) => e.stopPropagation());
settingsPanel.addEventListener("click", (e) => e.stopPropagation());

// Scrolling closes the sort/settings menus (like category.html). Ignored
// right after a re-render, because changing the content height can nudge
// the scroll position on its own. The paper list stays open so you can
// tick several papers in a row.
window.addEventListener("scroll", () => {
    if(Date.now() - lastRenderAt < 400) return;
    settingsPanel.classList.remove("open");
    settingsButton.setAttribute("aria-expanded", "false");
    sortPanel.classList.remove("open");
    sortDropdown.classList.remove("open");
}, { passive: true });


paperBreaksToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    paperBreaks = !paperBreaks;
    try{ localStorage.setItem(KEYS.images.breaks, paperBreaks); }catch(err){}
    applySettingsUI();
    render();
});

showNamesToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    showNames = !showNames;
    try{ localStorage.setItem(KEYS.images.names, showNames); }catch(err){}
    applySettingsUI();
});

document.querySelectorAll(".sort-option").forEach(btn => {
    btn.addEventListener("click", () => {
        const groupKey = btn.dataset.group;
        const group = SORT_GROUPS[groupKey];
        const active = getActiveSortGroup();

        sortType = active.key === groupKey
            ? (active.direction === "asc" ? group.desc : group.asc)
            : group.asc;

        try{ localStorage.setItem(KEYS[mode].sort, sortType); }catch(err){}
        applySortUI();
        render();
    });
});

/* ---------- Small storage helpers (safe if storage is blocked) ---------- */

function loadJson(storage, key, fallback){
    try{
        const raw = storage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    }catch(e){
        return fallback;
    }
}

function saveJson(storage, key, value){
    try{
        storage.setItem(key, JSON.stringify(value));
    }catch(e){}
}

ratios = loadJson(localStorage, RATIO_KEY, {});

/* ---------- Data ---------- */

// Same rule as the rest of the site: "#$" images are hidden everywhere.
function visibleImages(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );
}

// Videos are listed under a paper as { file, title, duration } (a plain text
// path works too). A file starting with "#$" is hidden, like images.
function visibleVideos(paper){
    return (paper.videos || [])
        .map(v => typeof v === "string" ? { file: v } : v)
        .filter(v =>
            v &&
            typeof v.file === "string" &&
            v.file.trim() &&
            !v.file.trim().startsWith("#$")
        )
        .map(v => ({
            file: v.file.trim(),
            title: v.title,
            duration: v.duration,
            thumbnail: v.thumbnail,
            source: v.source,
            group: v.group,
            groupLabel: v.groupLabel
        }));
}

function warningAccepted(key){
    return sessionStorage.getItem("warning-" + key) === "accepted";
}

// Opens the image in the exact same viewer, the exact same way as
// category.html, and returns here when you press Back.
function viewerUrl(image, paperTitle){
    return "image.html?image=" + encodeURIComponent(image) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

// Opens the video in the video viewer, which returns here on Back. Nothing
// is requested from the video storage until that page opens.
function videoUrl(v, paperTitle){
    const base = v.file.split("/").pop().replace(/\.[^/.]+$/, "");
    return "video.html?video=" + encodeURIComponent(v.file) +
        (v.source === "site" ? "" : "&source=r2") +
        "&title=" + encodeURIComponent(v.title || base) +
        "&paper=" + encodeURIComponent(paperTitle) +
        "&return=" + encodeURIComponent(window.location.href);
}

function clampRatio(r){
    return Math.max(MIN_RATIO, Math.min(MAX_RATIO, r));
}

/* ---------- Dropdown ---------- */

function enabledCount(){
    return papers.filter(p => enabled[p.key]).length;
}

function updateButtonLabel(){
    document.getElementById("paperHeadingCount").textContent =
        enabledCount() + " of " + papers.length;
}

function buildOptions(){
    paperOptionList.innerHTML = "";

    papers.forEach(({key, paper, items}) => {

        const row = document.createElement("button");
        row.type = "button";
        row.className = "paper-option" + (enabled[key] ? " active" : "");
        row.dataset.key = key;
        row.setAttribute("role", "menuitemcheckbox");
        row.setAttribute("aria-checked", enabled[key] ? "true" : "false");

        const label = document.createElement("span");
        label.className = "paper-option-label";
        label.textContent = paper.title;
        if(paper.warning){
            label.insertAdjacentHTML("afterbegin", WARN_ICON_SMALL);
        }

        const count = document.createElement("span");
        count.className = "paper-option-count";
        count.textContent = favoritesOnly ? items.filter(isFavItem).length : items.length;

        const check = document.createElement("span");
        check.className = "paper-option-check";
        check.textContent = "✓";

        row.append(label, count, check);

        row.addEventListener("click", (e) => {
            e.stopPropagation();
            togglePaper(key);
        });

        paperOptionList.appendChild(row);
    });
}

function refreshOptionStates(){
    paperOptionList.querySelectorAll(".paper-option").forEach(row => {
        const on = !!enabled[row.dataset.key];
        row.classList.toggle("active", on);
        row.setAttribute("aria-checked", on ? "true" : "false");
    });
    updateButtonLabel();
}

function setEnabled(key, value){
    enabled[key] = value;
}

function persistEnabled(){
    saveJson(localStorage, KEYS[mode].enabled, enabled);
}

function togglePaper(key){
    const entry = papers.find(p => p.key === key);
    if(!entry) return;

    // Turning a graphic paper ON asks first (once per session).
    if(!enabled[key] && entry.paper.warning && !warningAccepted(key)){
        askWarning([key]);
        return;
    }

    setEnabled(key, !enabled[key]);
    persistEnabled();
    refreshOptionStates();
    render();
}

function selectAll(){
    const needWarning = papers
        .filter(p => p.paper.warning && !warningAccepted(p.key) && !enabled[p.key])
        .map(p => p.key);

    // Everything that is not graphic turns on right away.
    papers.forEach(p => {
        if(!p.paper.warning || warningAccepted(p.key)){
            setEnabled(p.key, true);
        }
    });

    persistEnabled();
    refreshOptionStates();
    render();

    if(needWarning.length){
        askWarning(needWarning);
    }
}

function clearAll(){
    papers.forEach(p => setEnabled(p.key, false));
    persistEnabled();
    refreshOptionStates();
    render();
}


document.addEventListener("click", closeMenus);

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
        closeMenus();
        closeWarning();
    }
});

document.getElementById("selectAllBtn").addEventListener("click", selectAll);
document.getElementById("clearAllBtn").addEventListener("click", clearAll);

/* ---------- Graphic content warning ---------- */

let pendingWarningKeys = [];

function askWarning(keys){
    pendingWarningKeys = keys;

    const titles = keys
        .map(k => papers.find(p => p.key === k))
        .filter(Boolean)
        .map(p => p.paper.title);

    document.getElementById("warningText").textContent =
        titles.length === 1
            ? "\"" + titles[0] + "\" contains graphic material, including depictions of severe injuries, death, or war casualties."
            : titles.length + " of these papers contain graphic material, including depictions of severe injuries, death, or war casualties.";

    document.getElementById("warningTitle").textContent =
        "Graphic " + WORDS[mode][1];
    document.getElementById("warningContinue").textContent =
        "Show " + WORDS[mode][1];

    document.getElementById("warningOverlay").style.display = "flex";
}

function closeWarning(){
    document.getElementById("warningOverlay").style.display = "none";
    pendingWarningKeys = [];
}

document.getElementById("warningCancel").addEventListener("click", closeWarning);

document.getElementById("warningOverlay").addEventListener("click", (e) => {
    if(e.target.id === "warningOverlay") closeWarning();
});

document.getElementById("warningContinue").addEventListener("click", () => {
    pendingWarningKeys.forEach(key => {
        sessionStorage.setItem("warning-" + key, "accepted");
        setEnabled(key, true);
    });

    persistEnabled();
    closeWarning();
    refreshOptionStates();
    render();
});

/* ---------- Gallery ---------- */

function applyRatio(link, ratio){
    const r = clampRatio(ratio);
    link.style.setProperty("--ar", r);
    link.style.flexGrow = String(r * 100);
}

const VIDEO_RATIO = 16 / 9;

function fileLabel(path){
    return String(path).split("/").pop().replace(/\.[^/.]+$/, "");
}

// Mixed layout: tiles (pictures and videos) are packed into rows that all
// lock to the full width. A row closes when its height gets close to the
// target; the last row stays natural size if it would be mostly empty.
let mixSections = [];
let settleRaf = 0;

function settleSoon(){
    if(settleRaf) return;
    settleRaf = requestAnimationFrame(() => { settleRaf = 0; layoutMixed(); });
}

// Splits a run of pictures / half-size videos into rows that all lock to the
// full width, choosing the breaks that keep every row closest to the target
// height. (The very last row of the page may stay natural size.)
function packRun(tiles, W, gap, T, allowNatural, ar){
    const n = tiles.length;
    if(!n) return [];

    const best = new Array(n + 1).fill(Infinity);
    const from = new Array(n + 1).fill(0);
    const nat = new Array(n + 1).fill(false);
    best[0] = 0;

    for(let j = 1; j <= n; j++){
        let sum = 0;
        for(let i = j - 1; i >= 0 && j - i <= 6; i--){
            sum += ar(tiles[i]);
            const cnt = j - i;
            const h = (W - gap * (cnt - 1)) / sum;
            let cost = Math.pow(Math.log(h / T), 2);
            let isNat = false;

            if(j === n && allowNatural && h > T * (allowNatural === true ? 1.25 : allowNatural)){
                cost = 0.04;
                isNat = true;
            }

            if(best[i] + cost < best[j]){
                best[j] = best[i] + cost;
                from[j] = i;
                nat[j] = isNat;
            }
        }
    }

    const rows = [];
    let j = n;
    while(j > 0){
        const i = from[j];
        rows.unshift({ tiles: tiles.slice(i, j), natural: j === n && nat[n] });
        j = i;
    }
    return rows;
}

function layoutMixed(){
    mixSections.forEach(sec => {
        const el = sec.el;
        if(!el.isConnected) return;

        const W = el.clientWidth;
        if(!W) return;

        const gap = parseFloat(getComputedStyle(el).getPropertyValue("--gap")) || 6;
        const T = Math.max(170, Math.min(280, W * 0.26));
        const ar = t => parseFloat(t.style.getPropertyValue("--ar")) || 1.33;
        const alive = t => !t.dataset.dead;

        const rows = [];
        let run = [];

        const flush = (last) => {
            packRun(run.filter(alive), W, gap, T, last ? 1.25 : 1.7, ar).forEach(r => rows.push(r));
            run = [];
        };

        sec.order.forEach((it, idx) => {
            if(it.flow){
                run.push(it.flow);
            }else{
                flush(false);
                rows.push({ tiles: it.tiles, natural: false });
            }
        });
        flush(true);

        // The page's final row can only be natural if it is a picture row.
        const sig = rows.map(r => r.tiles.map(t => sec.all.indexOf(t)).join(",") + (r.natural ? "n" : "")).join("|");

        if(sig !== sec.sig){
            sec.sig = sig;
            el.textContent = "";
            rows.forEach(row => {
                const d = document.createElement("div");
                d.className = "mixrow" + (row.natural ? " natural" : "");
                row.tiles.forEach(t => d.appendChild(t));
                el.appendChild(d);
            });
        }

        for(let i = 0; i < el.children.length; i++){
            el.children[i].style.setProperty("--nat-h", T + "px");
        }
    });
}

window.addEventListener("resize", settleSoon);

function render(){

    container.innerHTML = "";

    lastRenderAt = Date.now();

    container.classList.toggle("show-names", showNames);

    const [one, many] = WORDS[mode];

    const groups = sortedEnabledPapers();
    const total = groups.reduce((n, p) => n + p.items.length, 0);

    countEl.textContent =
        total + " " + (total === 1 ? one : many);

    if(!papers.length){
        container.innerHTML =
            '<div class="status">No ' + many.toLowerCase() + ' have been added yet.</div>';
        return;
    }

    if(!total){
        if(favoritesOnly){
            const hidden = hiddenFavoriteCount();
            if(hidden){
                container.innerHTML = "";
                container.appendChild(favHiddenNote(hidden));
            }else{
                container.innerHTML =
                    '<div class="fav-empty">' +
                    '<svg class="fav-empty-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
                    '<h2>No Favorite Media</h2>' +
                    '<p>Tap the <svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;vertical-align:-.15em;fill:#ff3b4f;stroke:#ff3b4f;stroke-width:2;stroke-linejoin:round"><path d="'+'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'+'"/></svg> on any image or video to save it here.</p>' +
                    '</div>';
            }
        }else{
            container.innerHTML =
                '<div class="status">No papers selected. Use the menu above to choose which papers to show.</div>';
        }
        return;
    }

    const gallery = document.createElement("div");
    gallery.className = mode === "mixed" ? "mixed-wrap" : "gallery" + (mode === "videos" ? " videos" : "");

    const fragment = document.createDocumentFragment();
    let target = fragment;   // where the next tile goes (a holder in Mixed)
    mixSections = [];

    function addName(link, text){
        const name = document.createElement("span");
        name.className = "tile-name";
        name.textContent = text;
        link.appendChild(name);
    }

    function addImage(image, title){

        const link = document.createElement("a");
        link.className = "gallery-image";
        link.href = viewerUrl(image, title);

        applyRatio(link, ratios[image] || DEFAULT_RATIO);

        const spacer = document.createElement("i");

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = title;
        img.src = image;

        img.addEventListener("load", () => {
            if(!img.naturalWidth || !img.naturalHeight) return;

            const real = img.naturalWidth / img.naturalHeight;
            const known = ratios[image];

            if(!known || Math.abs(known - real) > 0.001){
                ratios[image] = real;
                applyRatio(link, real);
                scheduleRatioSave();
            }
            settleSoon();
        });

        img.addEventListener("error", () => { link.dataset.dead = "1"; link.remove(); settleSoon(); });

        link.append(spacer, img);
        addName(link, fileLabel(image));
        link.dataset.favkey = FavMedia.key("image", image);
        link.appendChild(FavMedia.el("image", image));
        target.appendChild(link);
    }

    function addVideo(v, title, big){

        const name = v.title || fileLabel(v.file);
        const rkey = "v:" + v.file;

        const link = document.createElement("a");
        link.className = "gallery-image video-tile" + (big ? " video-big" : "");
        link.href = videoUrl(v, title);
        link.setAttribute(
            "aria-label",
            "Play " + name + (v.duration ? " (" + v.duration + ")" : "")
        );

        // In Mixed, videos keep a clean 16:9 so rows line up nicely.
        const fixedShape = mode === "mixed";

        applyRatio(link, fixedShape ? VIDEO_RATIO : (ratios[rkey] || VIDEO_RATIO));

        const spacer = document.createElement("i");

        // The thumbnail is a small picture on this site (thumbnails/<video
        // name>.jpg; .png, .webp and .jpeg also work). If there isn't one the
        // plain dark tile stays. It is never read from the video storage.
        const thumbPath = (v.thumbnail && String(v.thumbnail).trim())
            ? String(v.thumbnail).trim()
            : "thumbnails/" + fileLabel(v.file) + ".jpg";

        const img = document.createElement("img");
        img.loading = "lazy";
        img.alt = "";
        img.dataset.tried = "0";
        img.src = thumbPath.split("/").map(encodeURIComponent).join("/");

        img.addEventListener("load", () => {
            if(!img.naturalWidth || !img.naturalHeight) return;

            const real = img.naturalWidth / img.naturalHeight;
            const known = ratios[rkey];

            if(fixedShape){
                if(!known || Math.abs(known - real) > 0.001){
                    ratios[rkey] = real;
                    scheduleRatioSave();
                }
                return;
            }

            if(!known || Math.abs(known - real) > 0.001){
                ratios[rkey] = real;
                applyRatio(link, real);
                scheduleRatioSave();
            }
        });

        img.addEventListener("error", () => {
            const exts = ["png", "webp", "jpeg"];
            const tried = Number(img.dataset.tried || 0);

            if(tried >= exts.length || !/\.[a-z]+$/i.test(img.src)){
                img.remove();
                return;
            }

            img.dataset.tried = String(tried + 1);
            img.src = img.src.replace(/\.[a-z]+$/i, "." + exts[tried]);
        });

        const play = document.createElement("span");
        play.className = "video-play";
        play.innerHTML =
            '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>';

        link.append(spacer, img, play);

        if(v.duration){
            const dur = document.createElement("span");
            dur.className = "video-duration";
            dur.textContent = v.duration;
            link.appendChild(dur);
        }

        addName(link, name);
        link.dataset.favkey = FavMedia.key("video", v.file);
        link.appendChild(FavMedia.el("video", v.file));
        target.appendChild(link);
    }

    // Mixed: videos come in three sizes. "big" takes a whole row alone,
    // "pair" is two side by side, and "half" is sized for two-per-row but sits
    // beside pictures. Everything is spread evenly and packed into rows.
    function addMixedBlocks(list){
        const imgs = list.filter(i => i.kind === "image");
        const vids = list.filter(i => i.kind === "video");

        const holder = document.createElement("div");
        const all = [];

        function make(it){
            target = holder;
            if(it.kind === "video") addVideo(it.v, it.paperLabel);
            else addImage(it.src, it.paperTitle);
            target = fragment;
            const t = holder.lastElementChild;
            all.push(t);
            return t;
        }

        const cycle = ["pair", "half", "pair", "big", "half", "pair", "half"];
        const units = [];
        let vi = 0, ci = 0;

        while(vi < vids.length){
            const rem = vids.length - vi;
            let type = cycle[ci++ % cycle.length];
            if(type === "pair" && rem < 2) type = "big";
            if(rem === 1) type = "big";
            const count = type === "pair" ? 2 : 1;
            units.push({ type, vids: vids.slice(vi, vi + count) });
            vi += count;
        }

        const order = [];
        let a = 0, b = 0;

        while(a < imgs.length || b < units.length){
            const pa = imgs.length ? (a + 0.5) / imgs.length : Infinity;
            const pb = units.length ? (b + 0.5) / units.length : Infinity;

            if(a < imgs.length && (b >= units.length || pa <= pb)){
                order.push({ flow: make(imgs[a++]) });
            }else{
                const u = units[b++];
                const tiles = u.vids.map(make);
                if(u.type === "half") order.push({ flow: tiles[0] });
                else order.push({ tiles });
            }
        }

        const el = document.createElement("div");
        el.className = "mixsec";
        fragment.appendChild(el);
        mixSections.push({ el, all, order, sig: null });
    }

    // Videos tab: a fixed pattern of two pairs then one full-row video, over and
    // over (never random). A lone leftover video is always a full row.
    function bigFlags(count){
        const set = new Set();
        const pattern = [2, 2, 1];
        let i = 0, k = 0;
        while(i < count){
            const rem = count - i;
            let unit = pattern[k++ % pattern.length];
            if(rem === 1) unit = 1;
            else if(unit === 1 && rem === 2) unit = 2;   // no two full rows in a row
            if(unit === 1) set.add(i);
            i += unit;
        }
        return set;
    }

    let vidIdx = 0;
    const flatBig = (mode === "videos" && !paperBreaks) ? bigFlags(total) : new Set();

    groups.forEach(({paper, items}, index) => {

        if(paperBreaks){
            if(index > 0 && mode !== "mixed"){
                const fill = document.createElement("div");
                fill.className = "gallery-fill";
                fragment.appendChild(fill);
            }

            const brk = document.createElement("div");
            brk.className = "paper-break";

            const name = document.createElement("span");
            name.className = "paper-break-title";
            name.textContent = paper.label || paper.title;

            const count = document.createElement("span");
            count.className = "paper-break-count";
            count.textContent =
                items.length + " " + (items.length === 1 ? one : many).toLowerCase();

            brk.append(name, count);
            fragment.appendChild(brk);
        }

        if(mode === "mixed"){
            if(paperBreaks) addMixedBlocks(items);
            return;
        }

        const localBig = (mode === "videos" && paperBreaks) ? bigFlags(items.length) : null;

        items.forEach((item, i) => {
            if(mode === "videos"){
                const big = localBig ? localBig.has(i) : flatBig.has(vidIdx++);
                addVideo(item, paper.label || paper.title, big);
            }else{
                addImage(item, paper.title);
            }
        });
    });

    // Without paper headings, everything is mixed together across papers.
    if(mode === "mixed" && !paperBreaks){
        addMixedBlocks(groups.flatMap(g => g.items));
    }

    gallery.appendChild(fragment);
    container.appendChild(gallery);

    if(mode === "mixed") settleSoon();

    const end = document.createElement("p");
    end.className = "end-of-list";
    end.textContent = "— No more " + many.toLowerCase() + " —";
    container.appendChild(end);

    if(favoritesOnly){
        const hidden = hiddenFavoriteCount();
        if(hidden) container.appendChild(favHiddenNote(hidden));
    }
}

function favHiddenNote(n){
    const note = document.createElement("div");
    note.className = "fav-note";
    const msg = document.createElement("span");
    msg.textContent = n + (n === 1 ? " favorite is" : " favorites are") + " in papers that are switched off.";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Show all papers";
    btn.addEventListener("click", selectAll);
    note.append(msg, btn);
    return note;
}

let ratioSaveTimer = null;

function scheduleRatioSave(){
    clearTimeout(ratioSaveTimer);
    ratioSaveTimer = setTimeout(() => saveJson(localStorage, RATIO_KEY, ratios), 400);
}

/* ---------- Remember scroll position when opening an image ---------- */

container.addEventListener("click", (e) => {
    if(e.target.closest(".gallery-image")){
        try{
            sessionStorage.setItem(SCROLL_KEY, window.scrollY);
            sessionStorage.setItem(RETURN_FLAG, "yes");
        }catch(err){}
    }
});

function returningFromViewer(){
    let saved = null;
    let flag = null;

    try{
        saved = sessionStorage.getItem(SCROLL_KEY);
        flag = sessionStorage.getItem(RETURN_FLAG);
        sessionStorage.removeItem(RETURN_FLAG);
    }catch(e){}

    if(saved === null) return null;

    const ref = document.referrer || "";
    const navEntry = performance.getEntriesByType("navigation")[0];
    const cameFromViewer =
        (navEntry && navEntry.type === "back_forward")
            ? true
            : (ref ? /(image|video)\.html/.test(ref) : flag === "yes");

    if(!cameFromViewer){
        try{ sessionStorage.removeItem(SCROLL_KEY); }catch(e){}
        return null;
    }

    return parseInt(saved, 10) || 0;
}

/* ---------- Images / Videos switch ---------- */

let ready = false;

function applyModeUI(){
    modeSwitch.dataset.mode = mode;

    modeSwitch.querySelectorAll("button").forEach(btn => {
        btn.setAttribute("aria-selected", btn.dataset.mode === mode ? "true" : "false");
    });
}

function setMode(next){

    if(!ready || next === mode) return;

    // Only the sorting is separate for Images and Videos; the other settings
    // (paper breaks, file names) are shared and stay as they are.
    settingsBy[mode] = { sortType, paperBreaks, showNames };

    mode = next;

    try{ localStorage.setItem(MODE_KEY, mode); }catch(e){}
    try{ sessionStorage.setItem(MODE_KEY, mode); }catch(e){}

    const st = settingsBy[mode];
    sortType = st.sortType;

    papers = lists[mode];
    enabled = enabledBy[mode];

    closeMenus();
    buildOptions();
    updateButtonLabel();
    modeSwitch.classList.add("animate");
    applyModeUI();
    applySettingsUI();

    window.scrollTo({top: 0, behavior: "instant"});

    render();
}

modeSwitch.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", (e) => {
        e.stopPropagation();
        setMode(btn.dataset.mode);
    });
});

/* ---------- Swipe left / right to change tabs ----------
   Deliberately hard to trigger by accident: a long, fast, mostly-horizontal
   swipe, started away from the screen edges (which phones use for Back),
   and never while a menu or popup is open. */

(function(){
    const ORDER = ["images", "mixed", "videos"];
    const MIN_DX = 110;        // px of horizontal travel
    const MAX_MS = 700;        // must be quick
    const EDGE = 28;           // ignore swipes that start at the screen edge
    let st = null;

    function blocked(target){
        if(target.closest && target.closest("input, textarea, select, .top-settings, #settingsPanel, #sortPanel, #warningOverlay")) return true;
        if(document.getElementById("warningOverlay").style.display === "flex") return true;
        if(settingsPanel.classList.contains("open") || sortPanel.classList.contains("open")) return true;
        return false;
    }

    document.addEventListener("touchstart", (e) => {
        st = null;
        if(e.touches.length !== 1 || !ready) return;
        const t = e.touches[0];
        if(t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) return;
        if(blocked(e.target)) return;
        st = { x: t.clientX, y: t.clientY, time: Date.now(), bad: false };
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
        if(!st) return;
        if(e.touches.length !== 1){ st = null; return; }
        const t = e.touches[0];
        // A mostly-vertical drag is a scroll, never a swipe.
        if(Math.abs(t.clientY - st.y) > 60 && Math.abs(t.clientY - st.y) > Math.abs(t.clientX - st.x) * 0.5) st.bad = true;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
        const s0 = st;
        st = null;
        if(!s0 || s0.bad) return;

        const t = e.changedTouches[0];
        const dx = t.clientX - s0.x;
        const dy = t.clientY - s0.y;

        if(Date.now() - s0.time > MAX_MS) return;
        if(Math.abs(dx) < MIN_DX) return;
        if(Math.abs(dy) > Math.abs(dx) * 0.4) return;

        const i = ORDER.indexOf(mode) + (dx < 0 ? 1 : -1);
        if(i < 0 || i >= ORDER.length) return;

        setMode(ORDER[i]);
    }, { passive: true });
})();

/* ---------- Favorites view ---------- */

// Opened only from the home page's Media button, like the Papers favorites
// page: it is its own page, with no toggle to switch it on or off here.
document.getElementById("pageHeading").textContent = favoritesOnly ? "Favorite Media" : "Gallery";
document.title = favoritesOnly ? "Favorite Media" : "Gallery";

// Un-hearting inside the favorites view dims the tile instead of yanking it
// out from under your finger; the count follows.
FavMedia.onChange(() => {
    if(!favoritesOnly) return;

    let live = 0;
    container.querySelectorAll(".gallery-image[data-favkey]").forEach(t => {
        const on = FavMedia.has(t.dataset.favkey);
        t.classList.toggle("fav-gone", !on);
        if(on && !t.dataset.dead) live++;
    });

    const [one, many] = WORDS[mode];
    countEl.textContent = live + " " + (live === 1 ? one : many);
    refreshOptionStates();
});

/* ---------- Load ---------- */

Promise.all([
    fetch("descriptions.json", { cache: "no-cache" }).then(response => {
        if(!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
    }),
    fetch("page-counts.json").then(r => r.json()).catch(() => ({})),
    fetch("content-pages.json").then(r => r.json()).catch(() => ({}))
])
    .then(([data, counts, contentCounts]) => {

        pageCounts = counts || {};
        contentPageCounts = contentCounts || {};

        const entries = Object.entries(data);

        lists.images = entries
            .map(([key, paper]) => ({key, paper, items: visibleImages(paper)}))
            .filter(p => p.items.length)
            .sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        // A video with a "group" (for example "Other") isn't listed under its
        // paper; it goes into that group in the Papers list instead, shown
        // under "groupLabel" (for example "Featured") where its name appears.
        const videoGroups = {};

        lists.videos = [];

        entries.forEach(([key, paper]) => {

            const normal = [];

            visibleVideos(paper).forEach(v => {
                if(v.group){
                    const g = videoGroups[v.group] || (videoGroups[v.group] = {
                        key: "group:" + v.group,
                        paper: { title: v.group, label: v.groupLabel || v.group, warning: false },
                        items: []
                    });
                    g.items.push(v);
                }else{
                    normal.push(v);
                }
            });

            if(normal.length) lists.videos.push({key, paper, items: normal});
        });

        lists.videos.sort((a, b) => a.paper.title.localeCompare(b.paper.title));

        Object.values(videoGroups).forEach(g => lists.videos.push(g));

        // Everything is on by default, except graphic papers, which stay
        // off until you opt in to them from the menu. (Images and Videos
        // remember their own choices.)
        // Mixed: every paper's images and videos together.
        {
            const byKey = {};
            const add = (e, kind) => {
                const g = byKey[e.key] || (byKey[e.key] = { key: e.key, paper: e.paper, items: [] });
                e.items.forEach(it => g.items.push(kind === "video"
                    ? { kind, v: it, paperLabel: e.paper.label || e.paper.title }
                    : { kind, src: it, paperTitle: e.paper.title }));
            };
            lists.images.forEach(e => add(e, "image"));
            lists.videos.forEach(e => add(e, "video"));
            lists.mixed = Object.values(byKey)
                .sort((a, b) => a.paper.title.localeCompare(b.paper.title));
        }

        ["images", "videos", "mixed"].forEach(m => {

            const stored = loadJson(localStorage, KEYS[m].enabled, {});

            lists[m].forEach(({key, paper}) => {
                if(typeof stored[key] === "boolean"){
                    enabledBy[m][key] = stored[key];
                }else{
                    enabledBy[m][key] = !paper.warning;
                }

                // A remembered "on" for a graphic paper only counts once it
                // has been confirmed again this session.
                if(paper.warning && enabledBy[m][key] && !warningAccepted(key)){
                    enabledBy[m][key] = false;
                }
            });
        });

        papers = lists[mode];
        enabled = enabledBy[mode];
        ready = true;

        buildOptions();
        updateButtonLabel();
        applyModeUI();
        applySettingsUI();

        const restoreTo = returningFromViewer();

        render();

        if(restoreTo !== null){
            const restore = () => window.scrollTo({top: restoreTo, behavior: "instant"});
            requestAnimationFrame(() => requestAnimationFrame(restore));
            window.addEventListener("load", restore, {once: true});
        }
    })
    .catch(error => {
        console.error(error);
        container.innerHTML = '<div class="status">Could not load descriptions.json.</div>';
    });

/* ---------- Back to top ---------- */

const topButton = document.getElementById("topButton");

function updateTopButton(){
    topButton.style.display = window.scrollY > 10 ? "flex" : "none";
}

topButton.addEventListener("click", (e) => {
    e.preventDefault();
    window.scrollTo({top: 0, behavior: "smooth"});
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);

</script>
