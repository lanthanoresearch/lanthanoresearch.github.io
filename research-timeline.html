<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Lanthano Research - Timeline</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;
}
main{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:28px 18px 85px;
  box-sizing:border-box;
  overflow-x:clip;
}

.top-nav{
  margin-bottom:14px;
}

.home-button{
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-bottom:20px;
}

.home-button:hover{
  text-decoration:underline;
}
h1{text-align:center;margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.7rem)}
.subtitle{text-align:center;color:#999;max-width:760px;margin:0 auto 30px;line-height:1.6}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
.controls button{
  padding:9px 14px;border:1px solid #333;border-radius:999px;
  background:#1d1d1d;color:#bbb;cursor:pointer;font-size:.9rem
}
.controls button:hover,.controls button.active{background:#2a2a2a;color:#fff;border-color:#666}
.timeline-wrap{position:relative}
.axis-labels{display:flex;justify-content:space-between;color:#777;font-size:.8rem;margin:0 4% 8px}
.timeline{
  position:relative;min-height:560px;margin:0 2%;
  border-top:1px solid rgba(255,255,255,.18);
  background:
    linear-gradient(to bottom, transparent 0, transparent 100%);
}
.year{
  position:absolute;top:-29px;transform:translateX(-50%);
  color:#777;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  white-space:nowrap;z-index:1
}
.year:after{
  content:"";position:absolute;top:29px;left:50%;width:1px;height:1000px;
  background:linear-gradient(to bottom,rgba(255,255,255,.14),rgba(255,255,255,.025));
  z-index:0
}
.paper{
  position:absolute;width:206px;transform:translateX(-50%);
  z-index:2;
}
.connector{
  position:absolute;left:50%;bottom:100%;width:1px;height:16px;
  transform:translateX(-50%);
  background:linear-gradient(to top,var(--paper-color),transparent);
  opacity:.65;
}
.dot{
  position:absolute;left:50%;top:-9px;width:14px;height:14px;
  transform:translateX(-50%);border-radius:50%;
  background:#111;border:3px solid var(--paper-color);
  box-shadow:0 0 0 3px #111,0 0 0 4px rgba(255,255,255,.05);
  z-index:4;
}
.paper-card{
  position:relative;background:linear-gradient(145deg,#202020,#1a1a1a);
  border:1px solid #353535;border-left:3px solid var(--paper-color);
  border-radius:10px;padding:10px 11px;cursor:pointer;
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
  min-height:76px;
}
.paper-card.has-two-badges{
  min-height:88px;
}
.paper-card.has-two-badges .paper-badge{
  font-size:.5rem;
  padding:3px 5px;
}
.paper-card:hover,.paper-card:focus-within{
  background:#252525;transform:translateY(-3px);
  border-color:#4a4a4a;
}
.paper-title{
  font-weight:700;
  line-height:1.25;
  margin:4px 0 6px;
  color:#f5f5f5;
  font-size:.9rem;
  padding-right:2px;
}

.paper-topline{
  display:block;
  min-height:0;
  padding-right:31px;
  min-width:0;
}
.paper-badges{
  display:none;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  width:100%;
  max-width:calc(100% - 31px);
  min-height:12px;
  margin:2px 0 0;
  pointer-events:none;
  white-space:nowrap;
  overflow:visible;
}
.paper-badges.has-badges{display:flex !important}
.paper-badge{
  color:#fff;
  font-size:.55rem;
  font-weight:700;
  padding:3px 6px;
  border-radius:999px;
  letter-spacing:.04em;
  text-transform:uppercase;
  white-space:nowrap;
}
.paper-badge.featured{background:#2f7cff}
.paper-badge.newest{background:#00b050}

.paper-card{
  position:relative;
  z-index:1;
}

.favorite-star{
  position:absolute;
  top:8px;
  right:7px;
  width:28px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.35rem;
  line-height:1;
  color:#777;
  background:transparent;
  border:0;
  padding:0;
  margin:0;
  cursor:pointer;
  user-select:none;
  z-index:1000;
  pointer-events:auto;
  transition:transform .12s ease,color .12s ease;
}
.favorite-star:hover{
  transform:scale(1.12);
  color:#aaa;
}
.favorite-star:focus-visible{
  outline:2px solid #6fa8ff;
  outline-offset:2px;
  border-radius:6px;
}
.favorite-star.active{
  color:#FFD700;
  text-shadow:0 0 10px rgba(255,215,0,.55);
}
.paper-date{
  display:block;
  color:var(--paper-color);
  font-size:.68rem;
  font-weight:bold;
  line-height:14px;
  white-space:nowrap;
}
.paper-category{color:#888;font-size:.7rem;line-height:1.4}
.paper-description::after{
  content:"";position:absolute;left:0;right:0;bottom:-18px;height:20px;
}
.description-label{
  color:#888;text-transform:uppercase;letter-spacing:.08em;font-size:.64rem;font-weight:700;margin-bottom:7px;
}
.paper-link{
  display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding:9px 11px;border-radius:7px;
  background:#242424;border:1px solid #3c3c3c;color:#fff;text-decoration:none;font-size:.76rem;font-weight:700;
  transition:background .15s,border-color .15s,transform .15s;
}
.paper-link:hover,.paper-link:focus{background:#303030;border-color:var(--paper-color);transform:translateX(1px);outline:none}
.paper-link span{color:var(--paper-color);font-size:1rem}
.paper-description{
  position:absolute;left:50%;bottom:calc(100% - 1px);width:310px;
  transform:translateX(-50%) translateY(6px);
  padding:15px 16px;background:#151515;border:1px solid #444;
  border-left:3px solid var(--paper-color);border-radius:10px;
  color:#ccc;font-size:.8rem;line-height:1.55;
  opacity:0;visibility:hidden;pointer-events:none;z-index:100;
  box-shadow:0 12px 30px rgba(0,0,0,.65);
  transition:.15s ease;
}
.paper:hover{z-index:100}
.paper:hover .paper-description,
.paper-description:hover{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}
.timeline-meta{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:13px;
  flex-wrap:wrap;
  margin:0 auto 16px;
  color:#777;
  font-size:.75rem;
  line-height:1.4;
}
.timeline-meta strong{
  color:#ccc;
  font-weight:600;
}
.meta-divider{
  width:1px;
  height:12px;
  background:rgba(255,255,255,.16);
}
.status{text-align:center;color:#888;padding:40px}
.legend{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:2147483647;
  isolation:isolate;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  padding:7px 12px;
  color:#aaa;
  font-size:.7rem;
  background:rgba(17,17,17,.82);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Upright / portrait: compact vertical archive */

/* Layout is primarily orientation-driven:
   taller-than-wide screens use the compact vertical archive;
   wider-than-tall screens use the horizontal chronological timeline. */


@media (orientation: portrait){
  main{padding:22px 12px 72px}
  .timeline{
    border-top:0;border-left:1px solid #333;
    margin:0 0 0 12px;padding:6px 0;min-height:0;
  }
  .year{display:none}
  .paper,.paper:nth-child(n){
    position:relative!important;left:auto!important;top:auto!important;
    width:calc(100% - 18px)!important;max-width:calc(100% - 18px)!important;
    min-width:0;margin:0 0 7px 18px!important;
    transform:none!important;box-sizing:border-box;
  }
  .paper-card{
    width:100%;min-width:0;box-sizing:border-box;
    min-height:0;padding:7px 9px;border-radius:8px;
  }
  .paper-card.has-two-badges{min-height:0}
  .paper-topline{
    display:grid;
    grid-template-rows:auto auto;
    gap:2px;
    min-height:32px;
    padding-right:30px;
    overflow:visible;
  }
  .paper-date{
    display:block;
    font-size:.61rem;
    line-height:13px;
  }
  .paper-badges{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:3px;
    margin-left:0;
    margin-right:auto;
    width:calc(100% - 30px);
    max-width:none;
    margin-top:2px;
    min-height:11px;
    overflow:visible;
  }
  .paper-badge{
    font-size:.46rem;
    padding:2px 5px;
    flex-shrink:0;
  }
  .paper-title{
    font-size:.78rem;
    margin:3px 0 4px;
    overflow-wrap:anywhere;
  }
  .paper-badges.has-badges + .paper-title{margin-top:4px;}
  .paper-category{font-size:.6rem}
  .favorite-star{top:5px;right:4px;width:27px;height:27px;font-size:1.18rem}
  .paper-badges{
    gap:3px;
    width:calc(100% - 30px);
    max-width:calc(100% - 30px);
    margin:2px 0 0;
  }
  .paper-badge{
    font-size:.46rem;
    padding:2px 5px;
    flex-shrink:0;
  }
  .paper .dot{left:-30px;top:20px}
  .paper .connector{display:none}

  .paper .paper-description,
  .paper-card.expanded .paper-description{
    position:relative!important;left:auto!important;right:auto!important;
    top:auto!important;bottom:auto!important;
    width:100%!important;max-width:100%!important;
    margin:0!important;box-sizing:border-box!important;
    transform:none!important;box-shadow:none;
  }
  .paper .paper-description{
    display:none;opacity:0;visibility:hidden;pointer-events:none;
  }
  .paper-card.expanded .paper-description{
    display:block;opacity:1;visibility:visible;pointer-events:auto;
    margin-top:6px!important;padding:8px 9px!important;
    border-radius:7px!important;font-size:.68rem!important;
    line-height:1.35!important;overflow-wrap:anywhere;
  }
  .paper-card.expanded .description-label{
    font-size:.54rem!important;margin-bottom:4px!important;
  }
  .paper-card.expanded .paper-link{
    width:100%;box-sizing:border-box;margin-top:7px!important;
    padding:7px 9px!important;font-size:.66rem!important;
  }
  .paper:hover .paper-description{display:none}
  .paper-card.expanded:hover .paper-description{
    display:block;opacity:1;visibility:visible;pointer-events:auto;
  }

  .stats{gap:14px;margin-bottom:14px}
  .stat{background:none;border:0;padding:0;min-width:0}
  .stat-number{font-size:.9rem}.stat-label{font-size:.62rem}
  .legend{padding:6px 8px;gap:8px;font-size:.62rem}
}

@media (orientation:landscape){
  main{padding:24px 14px 82px}
  .timeline{
    position:relative;
    border-top:1px solid rgba(255,255,255,.18);
    border-left:0;margin:0;width:100%;max-width:100%;
    min-height:560px;padding:0;box-sizing:border-box;
    overflow:visible;
  }
  .year{display:block}
  .paper,.paper:nth-child(n){
    position:absolute;width:206px;max-width:206px;margin:0;
    box-sizing:border-box;
  }
  .paper-card{min-height:76px}
    .paper.edge-left,
  .paper.edge-right{
    transform:translateX(var(--edge-shift, 0px));
  }

  .paper.edge-left:hover,
  .paper.edge-right:hover{
    transform:translateX(var(--edge-shift, 0px)) translateY(-3px);
  }
  .paper .dot{left:50%;top:-9px}
  .paper .connector{display:block}

  /* Default landscape popup. It is centered on the card, but JS clamps it
     horizontally when the card is near an edge. */
  .paper .paper-description{
    position:absolute;left:50%;bottom:calc(100% - 1px);
    width:310px;max-width:none;
    transform:translateX(-50%) translateY(8px);
    margin:0;display:block;opacity:0;visibility:hidden;
    pointer-events:none;z-index:50;
  }
  .paper.popup-open .paper-description,
  .paper:hover .paper-description,
  .paper-description:hover{
    display:block!important;
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
    transform:translateX(var(--popup-x, -50%)) translateY(0);
  }
  .paper.popup-right .paper-description{
    left:auto;right:0;
    transform:translateY(8px);
  }
  .paper.popup-right:hover .paper-description,
  .paper.popup-right.popup-open .paper-description,
  .paper.popup-right .paper-description:hover{
    transform:translateY(0);
  }
  .paper.popup-left .paper-description{
    left:0;right:auto;
    transform:translateY(8px);
  }
  .paper.popup-left:hover .paper-description,
  .paper.popup-left.popup-open .paper-description,
  .paper.popup-left .paper-description:hover{
    transform:translateY(0);
  }

  .stats{margin-bottom:14px}
}

/* Short landscape: same horizontal timeline, smaller cards and a dedicated
   badge row under the date so NEW/FEATURED can never collide with titles. */
@media (orientation:landscape) and (max-height:600px){

  main{padding:16px 10px 70px}
  h1{font-size:1.7rem;margin-bottom:4px}
  .subtitle{font-size:.72rem;margin-bottom:10px}
  .stats{margin-bottom:10px;gap:12px}
  .stat{padding:4px 8px}.stat-number{font-size:.78rem}.stat-label{font-size:.55rem}
  .timeline{min-height:620px}

  .paper,.paper:nth-child(n){width:118px;max-width:118px}
  .paper-card{min-height:58px;padding:6px 7px;border-radius:7px}
  .paper-card.has-two-badges{min-height:76px}
  .paper-topline{
    display:block;
    min-height:34px;
    padding-right:23px;
    overflow:visible;
  }
  .paper-date{display:block;font-size:.48rem;line-height:13px}
  .paper-badges{
    display:none;justify-content:flex-start;align-items:center;
    gap:2px;width:calc(100% - 23px);max-width:none;
    margin-top:2px;min-height:10px;overflow:visible;
  }
  .paper-badges.has-badges{display:flex !important}
  .paper-badge{font-size:.31rem;padding:2px 3px;flex-shrink:0}
  .paper-title{
    font-size:.6rem;line-height:1.16;margin:3px 0 3px;
    overflow-wrap:anywhere;
  }
  .paper-category{font-size:.48rem;line-height:1.15}
  .favorite-star{top:3px;right:2px;width:21px;height:21px;font-size:.9rem}

  .paper .paper-description{
    width:190px;max-width:calc(100vw - 20px);
    padding:9px 10px;font-size:.68rem;line-height:1.35;
    box-sizing:border-box;
  }
  .paper .description-label{font-size:.54rem;margin-bottom:4px}
  .paper .paper-link{margin-top:7px;padding:7px 9px;font-size:.66rem}
  .legend{padding:5px 7px;gap:7px;font-size:.58rem}
}

</style>
</head>
<body>
<main>
<div class="top-nav">
  <a class="home-button" href="index.html">◀ Home</a>
</div>
<h1>Research Timeline</h1>
<p class="subtitle">
A chronologically scaled timeline of the research archive. Hover over a paper to read its description.
</p>

<div class="timeline-meta" id="stats" aria-live="polite">
  <span><strong id="paperCount">—</strong> papers</span>
  <span class="meta-divider"></span>
  <span>Earliest <strong id="earliestPaper">—</strong></span>
  <span class="meta-divider"></span>
  <span>Latest <strong id="latestPaper">—</strong></span>
</div>

<div class="controls" id="controls"></div>

<div class="timeline-wrap">
  <div class="axis-labels" id="axisLabels"></div>
  <div class="timeline" id="timeline">
    <div class="status">Loading research timeline...</div>
  </div>
</div>

<div class="legend" id="legend"></div>
</main>

<script>
const DATA_FILE = "./descriptions.json";
const timeline = document.getElementById("timeline");
const controls = document.getElementById("controls");
const legend = document.getElementById("legend");
const stats = document.getElementById("stats");
const axisLabels = document.getElementById("axisLabels");

let papers = [];
let activeFilter = "all";
let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;

function loadFavorites(){
  try{
    favoritePapers = JSON.parse(
      localStorage.getItem("favoritePapers") || "[]"
    );
    if(!Array.isArray(favoritePapers)) favoritePapers = [];
  }catch{
    favoritePapers = [];
  }
}

function isFavorite(key){
  return favoritePapers.includes(key);
}

function toggleFavorite(key){
  if(isFavorite(key)){
    favoritePapers = favoritePapers.filter(item => item !== key);
  }else{
    favoritePapers.push(key);
  }

  localStorage.setItem(
    "favoritePapers",
    JSON.stringify(favoritePapers)
  );

  render();
}

const categoryColors = {
  biblical: "#b58cff",
  historical: "#d7a85b",
  scientific: "#55c7a0",
  medical: "#e77b91",
  political: "#d66a6a",
  astronomy: "#6fa8ff",
  technology: "#58b6d9",
  philosophy: "#c48bd8",
  geographic: "#78b85a",
  economic: "#d9b44a"
};

function categoryLabel(category){
  return String(category || "")
    .charAt(0).toUpperCase() + String(category || "").slice(1);
}

function colorForCategory(category){
  const key = String(category || "").toLowerCase();
  if(categoryColors[key]) return categoryColors[key];

  // Stable fallback color for categories not explicitly mapped.
  let hash = 0;
  for(const c of key) hash = ((hash << 5) - hash) + c.charCodeAt(0) | 0;
  return `hsl(${Math.abs(hash) % 360} 58% 62%)`;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function dateValue(p){
  return new Date(`${p.updated}T00:00:00`);
}

function formatYear(value){
  const d = value instanceof Date ? value : new Date(value);
  return Number.isNaN(d.getTime()) ? "" : String(d.getFullYear());
}

function formatDate(p){
  return dateValue(p).toLocaleDateString(undefined,{
    year:"numeric",month:"short",day:"numeric"
  });
}

function positionFor(date,min,max){
  const value = dateValue({updated:date}).getTime();
  const a = min.getTime(), b = max.getTime();
  return 3 + ((value-a)/(b-a || 1))*94;
}

function getPaperBadges(paper){
  const isNewest = showNewestBadge && paper.key === newestKey;
  const badges=[];

  if(isNewest){
    badges.push('<span class="paper-badge newest">NEW</span>');
  }
  if(paper.featured){
    badges.push('<span class="paper-badge featured">FEATURED</span>');
  }

  return badges.length
    ? `<div class="paper-badges has-badges">${badges.join("")}</div>`
    : "";
}

function buildLanes(items){
  const landscape = window.matchMedia("(orientation: landscape)").matches;
  if(!landscape){
    items.forEach((paper,i)=>paper._lane=i);
    return items.length;
  }

  const shortLandscape = window.innerHeight <= 600;
  const cardWidth = shortLandscape ? 118 : 206;
  const gap = shortLandscape ? 10 : 14;
  const timelineWidth = Math.max(timeline.clientWidth, 1);
  const lanes=[];

  for(const paper of items){
    let x=(paper._x/100)*timelineWidth;

    /* Clamp the visual center so edge cards stay completely inside the
       timeline. The same center is used for collision detection. */
    const half=cardWidth/2;
    const edgePad=12;
    x=Math.max(half+edgePad, Math.min(timelineWidth-half-edgePad, x));

    let lane=0;

    while(lanes[lane] !== undefined){
      const previousRight=lanes[lane] + half;
      const currentLeft=x - half;
      if(currentLeft >= previousRight + gap) break;
      lane++;
    }

    lanes[lane]=x;
    paper._visualX=x;
    paper._lane=lane;
  }

  return Math.max(lanes.length,1);
}

function render(){
  resetTimelineInteraction();
  const visible = papers
    .filter(p=>activeFilter==="all" || p.category.includes(activeFilter))
    .sort((a,b)=>dateValue(a)-dateValue(b) || a.title.localeCompare(b.title));

  if(!visible.length){
    document.getElementById("paperCount").textContent = "0";
    document.getElementById("earliestPaper").textContent = "—";
    document.getElementById("latestPaper").textContent = "—";
    timeline.innerHTML='<div class="status">No papers in this category.</div>';
    return;
  }

  const min = dateValue(visible[0]);
  const max = dateValue(visible[visible.length-1]);

  document.getElementById("paperCount").textContent = visible.length;
  document.getElementById("earliestPaper").textContent = formatDate(visible[0]);
  document.getElementById("latestPaper").textContent = formatDate(visible[visible.length-1]);

  visible.forEach(p=>p._x=positionFor(p.updated,min,max));

  // Let the browser calculate the timeline width before assigning lanes.
  timeline.style.minHeight = "760px";
  const laneCount = buildLanes(visible);

  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  const isShortLandscape = isLandscape && window.innerHeight <= 600;
  const laneHeight = isShortLandscape ? 145 : 112;
  const topPadding = isShortLandscape ? 34 : 40;
  timeline.style.minHeight = Math.max(560, topPadding + laneCount * laneHeight + 55) + "px";
  timeline.innerHTML="";

  // Year guide lines.
  const years=[...new Set(visible.map(p=>p.updated.slice(0,4)))];
  years.forEach(year=>{
    const yearDate = `${year}-01-01`;
    const y = positionFor(yearDate,min,max);
    const guide=document.createElement("div");
    guide.className="year";
    guide.style.left=y+"%";
    guide.textContent=year;
    timeline.appendChild(guide);
  });

  visible.forEach(p=>{
    const el=document.createElement("article");
    el.className="paper";
    el.style.left=(isLandscape && p._visualX != null)
      ? ((p._visualX / Math.max(1,timeline.clientWidth))*100) + "%"
      : p._x + "%";
    el.style.top=(topPadding + p._lane*laneHeight)+"px";


    el.style.setProperty("--paper-color",colorForCategory(p.category[0]));

    const cats=p.category.map(categoryLabel).join(" • ");

    el.innerHTML=`
      <div class="connector" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
      <div class="paper-card ${((showNewestBadge && p.key === newestKey) && p.featured) ? "has-two-badges" : ""}" tabindex="0">
        <div class="paper-topline">
          <div class="paper-date">${escapeHtml(formatDate(p))}</div>
          ${getPaperBadges(p)}
        </div>
        <button type="button"
                class="favorite-star ${isFavorite(p.key) ? "active" : ""}"
                data-favorite-key="${escapeHtml(p.key)}"
                aria-label="${isFavorite(p.key) ? "Remove from favorites" : "Add to favorites"}"
                title="${isFavorite(p.key) ? "Remove from favorites" : "Add to favorites"}">${isFavorite(p.key) ? "★" : "☆"}</button>
        <div class="paper-title">${escapeHtml(p.title)}</div>
        <div class="paper-category">${escapeHtml(cats)}</div>
        <div class="paper-description">
          <div class="description-label">About this paper</div>
          <div>${escapeHtml(p.description || "No description available.")}</div>
          ${p.url ? `<a class="paper-link" href="${escapeHtml(p.url)}" data-paper-title="${escapeHtml(p.title)}">Read Research <span>→</span></a>` : ""}
        </div>
      </div>
    `;
    timeline.appendChild(el);
  });

  axisLabels.innerHTML=`
    <span>${min.toLocaleDateString(undefined,{year:"numeric",month:"short"})}</span>
    <span>${max.toLocaleDateString(undefined,{year:"numeric",month:"short"})}</span>
  `;
}


function resetTimelineInteraction(){
  document.querySelectorAll(".paper.popup-open").forEach(p=>p.classList.remove("popup-open"));
  document.querySelectorAll(".paper-card.expanded").forEach(c=>c.classList.remove("expanded"));
  document.querySelectorAll(".paper.popup-left,.paper.popup-right").forEach(p=>{
    p.classList.remove("popup-left","popup-right");
  });
  document.querySelectorAll(".paper").forEach(p=>{
    p.style.removeProperty("--popup-x");
  });
}

let lastOrientation = window.matchMedia("(orientation: landscape)").matches
  ? "landscape"
  : "portrait";

function handleOrientationChange(){
  const current = window.matchMedia("(orientation: landscape)").matches
    ? "landscape"
    : "portrait";

  if(current !== lastOrientation){
    lastOrientation = current;
    resetTimelineInteraction();
    render();
  }
}

function positionLandscapePopup(paperEl){
  if(!window.matchMedia("(orientation: landscape)").matches) return;
  paperEl.classList.remove("popup-left","popup-right");
  const popup=paperEl.querySelector(".paper-description");
  if(!popup) return;

  const paperRect=paperEl.getBoundingClientRect();
  const popupWidth=Math.min(310, window.innerWidth-20);
  const center=paperRect.left + paperRect.width/2;
  if(center - popupWidth/2 < 10) paperEl.classList.add("popup-left");
  else if(center + popupWidth/2 > window.innerWidth-10) paperEl.classList.add("popup-right");
}

document.addEventListener("click", e=>{
  const paper=e.target.closest(".paper");
  if(!paper || e.target.closest(".favorite-star") || e.target.closest(".paper-link")) return;

  if(window.matchMedia("(orientation: landscape)").matches){
    document.querySelectorAll(".paper.popup-open").forEach(x=>x!==paper && x.classList.remove("popup-open"));
    paper.classList.toggle("popup-open");
    positionLandscapePopup(paper);
  }
});

document.addEventListener("mouseenter", e=>{
  const paper=e.target.closest(".paper");
  if(paper) positionLandscapePopup(paper);
}, true);

window.addEventListener("resize",()=>{
  handleOrientationChange();
  document.querySelectorAll(".paper").forEach(positionLandscapePopup);
});

const orientationQuery = window.matchMedia("(orientation: landscape)");
if(orientationQuery.addEventListener){
  orientationQuery.addEventListener("change", handleOrientationChange);
}else if(orientationQuery.addListener){
  orientationQuery.addListener(handleOrientationChange);
}
document.addEventListener("click", e=>{
  if(!window.matchMedia("(orientation: portrait)").matches && !(window.matchMedia("(orientation: landscape)").matches && window.innerHeight <= 600)) return;

  const card = e.target.closest(".paper-card");
  if(!card) return;

  if(e.target.closest(".favorite-star, .paper-link")) return;

  const willExpand = !card.classList.contains("expanded");

  document.querySelectorAll(".paper-card.expanded").forEach(other=>{
    if(other !== card) other.classList.remove("expanded");
  });

  card.classList.toggle("expanded");

  if(willExpand){
    // Let the description render first, then keep the whole expanded card
    // inside the viewport instead of leaving its lower half off-screen.
    const keepExpandedVisible = ()=>{
      const target = card.querySelector(".paper-description") || card;
      const rect = target.getBoundingClientRect();
      const bottomClearance = 78;
      const sideClearance = 8;
      const topClearance = 10;

      let left = rect.left;
      let right = rect.right;
      let top = rect.top;
      let bottom = rect.bottom;

      let dx = 0;
      let dy = 0;

      if(left < sideClearance) dx = left - sideClearance;
      else if(right > window.innerWidth - sideClearance)
        dx = right - (window.innerWidth - sideClearance);

      if(bottom > window.innerHeight - bottomClearance)
        dy = bottom - (window.innerHeight - bottomClearance);
      else if(top < topClearance)
        dy = top - topClearance;

      if(dx || dy){
        window.scrollBy({left:dx, top:dy, behavior:"smooth"});
      }

      /* Re-check after the browser has applied the scroll. */
      requestAnimationFrame(()=>{
        const r=card.getBoundingClientRect();
        let dx2=0,dy2=0;
        if(r.left<8) dx2=r.left-8;
        else if(r.right>window.innerWidth-8) dx2=r.right-(window.innerWidth-8);
        if(r.bottom>window.innerHeight-78) dy2=r.bottom-(window.innerHeight-78);
        if(r.top<10) dy2=r.top-10;
        if(dx2 || dy2) window.scrollBy({left:dx2,top:dy2,behavior:"smooth"});
      });
    };

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
          requestAnimationFrame(keepExpandedVisible);
        });
      setTimeout(keepExpandedVisible,120);
    });
  }
});

document.addEventListener("pointerdown", e=>{
  const star=e.target.closest(".favorite-star");
  if(star) e.stopPropagation();
});

document.addEventListener("click", e=>{
  const star=e.target.closest(".favorite-star");
  if(star){
    e.stopPropagation();
  }
  if(!star) return;

  e.preventDefault();
  e.stopPropagation();

  const key = star.dataset.favoriteKey;
  if(isFavorite(key)){
    favoritePapers = favoritePapers.filter(item => item !== key);
  }else{
    favoritePapers.push(key);
  }
  localStorage.setItem("favoritePapers", JSON.stringify(favoritePapers));

  const active = isFavorite(key);
  star.classList.toggle("active", active);
  star.textContent = active ? "★" : "☆";
  star.setAttribute("aria-label", active ? "Remove from favorites" : "Add to favorites");
  star.title = active ? "Remove from favorites" : "Add to favorites";
});

document.addEventListener("click", e=>{
  const link=e.target.closest(".paper-link");
  if(!link) return;
  e.preventDefault();
  const paperUrl=link.getAttribute("href");
  const paperTitle=link.dataset.paperTitle || "PDF";
  const returnUrl=window.location.href;
  const viewerUrl="pdf.html?file="+encodeURIComponent(paperUrl)+"&paper="+encodeURIComponent(paperTitle)+"&return="+encodeURIComponent(returnUrl);
  window.location.href=viewerUrl;
});

function buildControls(){
  const categories=[...new Set(papers.flatMap(p=>p.category))].sort();
  controls.innerHTML =
    `<button class="active" data-filter="all">All</button>` +
    categories.map(c=>`<button data-filter="${escapeHtml(c)}">${escapeHtml(categoryLabel(c))}</button>`).join("");

  controls.addEventListener("click",e=>{
    if(!e.target.matches("button")) return;
    activeFilter=e.target.dataset.filter;
    document.querySelectorAll("#controls button").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    render();
  });

  legend.innerHTML=categories.map(c=>`
    <span><i style="background:${colorForCategory(c)}"></i>${escapeHtml(categoryLabel(c))}</span>
  `).join("");
}

async function load(){
  try{
    // descriptions.json is in the website's main tree, alongside this page.
    const response=await fetch(DATA_FILE,{cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();

    const entries = Array.isArray(data)
      ? data.map((paper, index) => [String(index), paper])
      : Object.entries(data);

    papers=entries
      .filter(([key,p])=>p && p.title && p.updated && Array.isArray(p.category))
      .map(([key,p])=>({
        key,
        title:p.title,
        updated:p.updated,
        category:p.category,
        description:p.description || "",
        url:p.url || "",
        featured:Boolean(p.featured),
        featuredOrder:Number(p.featuredOrder) || 999999
      }));

    if(!papers.length) throw new Error("No timeline records found.");

    const newestPaper = [...papers].sort(
      (a,b) => dateValue(b) - dateValue(a)
    )[0];

    newestKey = newestPaper.key;

    const newestDate = dateValue(newestPaper);
    const today = new Date();
    const oneYearAgo = new Date(today);
    oneYearAgo.setFullYear(today.getFullYear() - 1);

    showNewestBadge = newestDate >= oneYearAgo;

    loadFavorites();
    buildControls();
    render();
  }catch(error){
    console.error("Timeline error:",error);
    timeline.innerHTML='<div class="status">Unable to load descriptions.json. Check that timeline.html and descriptions.json are in the same directory.</div>';
  }
}

load();

window.addEventListener("resize",()=>{
  if(papers.length && window.innerWidth > 900) render();
});
</script>
</body>
