<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Lanthano Research - Timeline</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  margin:0;
  background:#111;
  color:#eee;
  font-family:Arial,sans-serif;
}

main{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
  box-sizing:border-box;
  overflow-x:clip;
}

.top-nav{
  margin-bottom:14px;
}

.home-button{
  color:white;
  text-decoration:none;
  display:inline-block;
  margin-bottom:20px;
}

.home-button:hover{
  text-decoration:underline;
}

h1{
  text-align:center;
  margin:0 0 40px;
  font-size:2em;
}

.subtitle{
  text-align:center;
  color:#999;
  max-width:760px;
  margin:-20px auto 28px;
  line-height:1.6;
  font-size:1em;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:0;
  margin-bottom:52px;
  gap:18px;
}

.paper-count{
  margin:0;
  color:#777;
  font-size:1em;
}

#categoryFilter{
  background:#222;
  color:#eee;
  border:none;
  border-radius:8px;
  padding:10px 18px;
  font-size:.95em;
  cursor:pointer;
  min-height:40px;
}

#categoryFilter:hover{
  background:#262626;
}

#categoryFilter:focus{
  outline:none;
}

@media (max-width:600px){
  .controls{
    gap:14px;
  }
}

.timeline-wrap{
  position:relative;
}

.axis-labels{
  display:none;
  height:0;
  margin:0;
}

.timeline{
  position:relative;
  min-height:560px;
  margin:0 2%;
  border-top:1px solid rgba(255,255,255,.18);
  background:
    linear-gradient(to bottom,transparent 0,transparent 100%);
}

.year{
  position:absolute;
  top:-29px;
  transform:translateX(-50%);
  color:#777;
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.04em;
  white-space:nowrap;
  z-index:1;
}

.year:after{
  content:"";
  position:absolute;
  top:29px;
  left:50%;
  width:1px;
  height:1000px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.14),
    rgba(255,255,255,.025)
  );
  z-index:0;
}

.paper{
  position:absolute;
  width:206px;
  transform:translateX(-50%);
  z-index:2;
}

.connector{
  position:absolute;
  left:50%;
  bottom:100%;
  width:1px;
  height:16px;
  transform:translateX(-50%);
  background:linear-gradient(
    to top,
    var(--paper-color),
    transparent
  );
  opacity:.65;
}

.dot{
  position:absolute;
  left:50%;
  top:-9px;
  width:14px;
  height:14px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#111;
  border:3px solid var(--paper-color);
  box-shadow:
    0 0 0 3px #111,
    0 0 0 4px rgba(255,255,255,.05);
  z-index:4;
}

.paper-card{
  position:relative;
  z-index:1;
  background:linear-gradient(145deg,#202020,#1a1a1a);
  border:1px solid #353535;
  border-left:3px solid var(--paper-color);
  border-radius:10px;
  padding:10px 11px;
  cursor:pointer;
  transition:
    transform .16s ease,
    background .16s ease,
    border-color .16s ease;
  min-height:76px;
}

.paper-card.has-two-badges{
  min-height:88px;
}

.paper-card.has-two-badges .paper-badge{
  font-size:.5rem;
  padding:3px 5px;
}

.paper-card:hover,
.paper-card:focus-within{
  background:#252525;
  transform:translateY(-3px);
  border-color:#4a4a4a;
}

.paper-title{
  font-weight:700;
  line-height:1.25;
  margin:4px 0 6px;
  color:#f5f5f5;
  font-size:.9rem;
  padding-right:2px;
}

.paper-topline{
  display:block;
  min-height:0;
  padding-right:31px;
  min-width:0;
}

.paper-badges{
  display:none;
  align-items:center;
  justify-content:flex-start;
  gap:4px;
  margin:2px 0 0;
  pointer-events:none;
  white-space:nowrap;
  max-width:calc(100% - 31px);
}

.paper-badges.has-badges{
  display:flex !important;
}

.paper-badge{
  color:#fff;
  font-size:.55rem;
  font-weight:700;
  padding:3px 6px;
  border-radius:999px;
  letter-spacing:.04em;
  text-transform:uppercase;
  white-space:nowrap;
}

.paper-badge.featured{
  background:#2f7cff;
}

.paper-badge.newest{
  background:#00b050;
}

.favorite-star{
  position:absolute;
  top:8px;
  right:7px;
  width:28px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.35rem;
  line-height:1;
  color:#777;
  background:transparent;
  border:0;
  padding:0;
  margin:0;
  cursor:pointer;
  user-select:none;
  z-index:1000;
  pointer-events:auto;
  transition:
    transform .12s ease,
    color .12s ease;
}

.favorite-star:hover{
  transform:scale(1.12);
  color:#aaa;
}

.favorite-star:focus-visible{
  outline:2px solid #6fa8ff;
  outline-offset:2px;
  border-radius:6px;
}

.favorite-star.active{
  color:#FFD700;
  text-shadow:0 0 10px rgba(255,215,0,.55);
}

.paper-date{
  display:block;
  color:var(--paper-color);
  font-size:.68rem;
  font-weight:bold;
  line-height:14px;
  white-space:nowrap;
}

.paper-category{
  color:#888;
  font-size:.7rem;
  line-height:1.4;
}

.paper-description::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-18px;
  height:20px;
}

.description-label{
  color:#888;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:.64rem;
  font-weight:700;
  margin-bottom:7px;
}

.paper-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:13px;
  padding:9px 11px;
  border-radius:7px;
  background:#242424;
  border:1px solid #3c3c3c;
  color:#fff;
  text-decoration:none;
  font-size:.76rem;
  font-weight:700;
  transition:
    background .15s,
    border-color .15s,
    transform .15s;
}

.paper-link:hover,
.paper-link:focus{
  background:#303030;
  border-color:var(--paper-color);
  transform:translateX(1px);
  outline:none;
}

.paper-link span{
  color:var(--paper-color);
  font-size:1rem;
}

.paper-description{
  position:absolute;
  left:50%;
  bottom:calc(100% - 1px);
  width:310px;
  transform:translateX(-50%) translateY(6px);
  padding:15px 16px;
  background:#151515;
  border:1px solid #444;
  border-left:3px solid var(--paper-color);
  border-radius:10px;
  color:#ccc;
  font-size:.8rem;
  line-height:1.55;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  z-index:100;
  box-shadow:0 12px 30px rgba(0,0,0,.65);
  transition:.15s ease;
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.paper-cover{
  flex:0 0 auto;
  width:64px;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:6px;
  background:#000;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}

.paper-description-body{
  flex:1 1 auto;
  min-width:0;
}

.paper:hover{
  z-index:100;
}

.paper:hover .paper-description,
.paper-description:hover{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:translateX(-50%) translateY(0);
}

.timeline-meta{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:13px;
  flex-wrap:wrap;
  margin:0 auto 30px;
  color:#777;
  font-size:.9em;
  line-height:1.4;
}

.timeline-meta strong{
  color:#ccc;
  font-weight:600;
}

.meta-divider{
  width:1px;
  height:12px;
  background:rgba(255,255,255,.16);
}

.status{
  text-align:center;
  color:#888;
  padding:40px;
}

.legend{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:2147483647;
  isolation:isolate;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  padding:7px 12px;
  color:#aaa;
  font-size:.7rem;
  background:rgba(17,17,17,.82);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.legend span{
  display:inline-flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}

.legend i{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
}


/* =========================================================
   PORTRAIT
   ========================================================= */

@media (orientation:portrait){

  main{
    padding:40px 20px 72px;
  }

  h1{
    margin-bottom:40px;
  }

  .subtitle{
    margin:-20px auto 28px;
  }

  .timeline-meta{
    margin-bottom:30px;
  }

  .controls{
    margin-bottom:52px;
  }

  .timeline{
    border-top:0;
    border-left:1px solid #333;
    margin:0 0 0 12px;
    padding:6px 0;
    min-height:0;
  }

  .year{
    display:none;
  }

  .paper,
  .paper:nth-child(n){
    position:relative !important;
    left:auto !important;
    top:auto !important;
    width:calc(100% - 18px) !important;
    max-width:calc(100% - 18px) !important;
    min-width:0;
    margin:0 0 7px 18px !important;
    transform:none !important;
    box-sizing:border-box;
  }

  .paper-card{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    min-height:0;

    border-radius:8px;
  }

  .paper-card.has-two-badges{
    min-height:0;
  }

  .paper-topline{
    display:block;
    min-height:0;
    padding-right:30px;
    overflow:visible;
  }

  .paper-date{
    display:block;
    line-height:13px;
  }

  .paper-badges{
    display:none;
  }

  .paper-badges.has-badges{
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:3px;
    margin-left:0;
    margin-right:auto;
    width:calc(100% - 30px);
    max-width:none;
    margin-top:2px;
    min-height:11px;
    overflow:visible;
  }

  .paper-badge{
    padding:2px 5px;
    flex-shrink:0;
  }

  .paper-title{
    margin:3px 0 4px;
    overflow-wrap:anywhere;
  }

  .paper-badges.has-badges + .paper-title{
    margin-top:4px;
  }

  .favorite-star{
    top:2px;
    right:4px;
    width:27px;
    height:27px;
  }

  .paper-badges{
    gap:3px;
    width:calc(100% - 30px);
    max-width:calc(100% - 30px);
    margin:2px 0 0;
  }

  .paper .dot{
    left:-30px;
    top:20px;
  }

  .paper .connector{
    display:none;
  }

  .list-year{
    position:relative;
    margin:14px 0 7px 18px;

    color:#777;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.08em;
    line-height:1;
    border-left:2px solid #444;
  }

  .list-year:first-child{

  }

  .paper .paper-description,
  .paper-card.expanded .paper-description{
    position:relative !important;
    left:auto !important;
    right:auto !important;
    top:auto !important;
    bottom:auto !important;
    width:100% !important;
    max-width:100% !important;
    margin:0 !important;
    box-sizing:border-box !important;
    transform:none !important;
    box-shadow:none;
  }

  .paper .paper-description{
    display:none;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  .paper-card.expanded .paper-description{
    display:flex;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    margin-top:6px !important;
    padding:8px 9px !important;
    border-radius:7px !important;
    line-height:1.35 !important;
    overflow-wrap:anywhere;
  }

  .paper-card.expanded .description-label{
    margin-bottom:4px !important;
  }

  .paper-card.expanded .paper-link{
    width:100%;
    box-sizing:border-box;
    margin-top:7px !important;

  }

  .paper:hover .paper-description{

  }

  .paper-card.expanded:hover .paper-description{

    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  .stats{
    gap:14px;
    margin-bottom:14px;
  }

  .stat{
    background:none;
    border:0;
    padding:0;
    min-width:0;
  }

  .stat-number{
    font-size:.9rem;
  }

  .stat-label{
    font-size:.62rem;
  }

  .legend{
    padding:6px 8px;
    gap:8px;
  }
}


/* =========================================================
   LANDSCAPE
   ========================================================= */

@media (orientation:landscape){

  .favorite-star{
    top:-1px;
  }

    padding:40px 20px 82px;
  }

  .timeline{
    position:relative;
    border-top:1px solid rgba(255,255,255,.18);

  }

  .paper .paper-description{

    pointer-events:none;

  }

  .paper:hover .paper-description,

    margin-bottom:14px;
  }
}

   SHORT LANDSCAPE

<body>

<main>

<div class="top-nav">
  <a class="home-button" href="index.html">◀ Home</a>
</div>

<h1>Research Timeline</h1>

<p class="subtitle">
  A chronologically timeline of the research archive. Hover over a paper to read its description.
</p>

<div class="timeline-meta" id="stats" aria-live="polite">
  <span>Earliest <strong id="earliestPaper">—</strong></span>
  <span class="meta-divider"></span>
  <span>Latest <strong id="latestPaper">—</strong></span>
</div>

<div class="controls">
  <p id="paperCount" class="paper-count">—</p>
  <select id="categoryFilter" aria-label="Filter research by category"></select>
</div>

<div class="timeline-wrap">

  <div class="axis-labels" id="axisLabels"></div>

  <div class="timeline" id="timeline">
    <div class="status">Loading research timeline...</div>
  </div>

</div>

<div class="legend" id="legend"></div>

</main>


<script>
const DATA_FILE = "./descriptions.json";

const timeline = document.getElementById("timeline");
const categoryFilter = document.getElementById("categoryFilter");
const legend = document.getElementById("legend");
const stats = document.getElementById("stats");
const axisLabels = document.getElementById("axisLabels");

let papers = [];
let activeFilter = "all";
let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;


function loadFavorites(){
  try{
    favoritePapers = JSON.parse(
      localStorage.getItem("favoritePapers") || "[]"
    );

    if(!Array.isArray(favoritePapers)){
      favoritePapers = [];
    }

  }catch{
    favoritePapers = [];
  }
}


function isFavorite(key){
  return favoritePapers.includes(key);
}


function toggleFavorite(key){

  if(isFavorite(key)){
    favoritePapers = favoritePapers.filter(
      item => item !== key
    );
  }else{
    favoritePapers.push(key);
  }

  localStorage.setItem(
    "favoritePapers",
    JSON.stringify(favoritePapers)
  );

  render();
}


const categoryColors = {
  biblical:"#b58cff",
  historical:"#d7a85b",
  scientific:"#55c7a0",
  medical:"#e77b91",
  political:"#d66a6a",
  astronomy:"#6fa8ff",
  technology:"#58b6d9",
  philosophy:"#c48bd8",
  geographic:"#78b85a",
  economic:"#d9b44a"
};


function categoryLabel(category){
  return String(category || "")
    .charAt(0)
    .toUpperCase()
    +
    String(category || "").slice(1);
}


function colorForCategory(category){

  const key = String(category || "").toLowerCase();

  if(categoryColors[key]){
    return categoryColors[key];
  }

  let hash = 0;

  for(const c of key){
    hash =
      ((hash << 5) - hash)
      +
      c.charCodeAt(0)
      |
      0;
  }

  return `hsl(${Math.abs(hash) % 360} 58% 62%)`;
}


function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}


function dateValue(p){
  return new Date(`${p.updated}T00:00:00`);
}


function formatYear(value){

  const d =
    value instanceof Date
      ? value
      : new Date(value);

  return Number.isNaN(d.getTime())
    ? ""
    : String(d.getFullYear());
}


function formatDate(p){

  return dateValue(p).toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );
}


function positionFor(date,min,max){

  const value =
    dateValue({updated:date}).getTime();

  const a = min.getTime();
  const b = max.getTime();

  return 3 +
    ((value-a)/(b-a || 1))*94;
}


function getPaperBadges(paper){

  const isNewest =
    showNewestBadge &&
    paper.key === newestKey;

  const badges = [];

  if(isNewest){
    badges.push(
      '<span class="paper-badge newest">NEW</span>'
    );
  }

  if(paper.featured){
    badges.push(
      '<span class="paper-badge featured">FEATURED</span>'
    );
  }

  return badges.length
    ? `<div class="paper-badges has-badges">${badges.join("")}</div>`
    : "";
}


function buildLanes(items){

  const landscape =
    window.matchMedia(
      "(orientation: landscape)"
    ).matches;

  if(!landscape){

    items.forEach(
      (paper,i) => paper._lane = i
    );

    return items.length;
  }

  const shortLandscape =
    window.innerHeight <= 600;

  const cardWidth =
    shortLandscape ? 118 : 206;

  const gap =
    shortLandscape ? 10 : 14;

  const timelineWidth =
    Math.max(timeline.clientWidth,1);

  const lanes = [];

  for(const paper of items){

    let x =
      (paper._x/100) *
      timelineWidth;

    const half =
      cardWidth/2;

    const edgePad = 12;

    x = Math.max(
      half + edgePad,
      Math.min(
        timelineWidth - half - edgePad,
        x
      )
    );

    let lane = 0;

    while(lanes[lane] !== undefined){

      const previousRight =
        lanes[lane] + half;

      const currentLeft =
        x - half;

      if(
        currentLeft >=
        previousRight + gap
      ){
        break;
      }

      lane++;
    }

    lanes[lane] = x;

    paper._visualX = x;
    paper._lane = lane;
  }

  return Math.max(lanes.length,1);
}


/*
 * Only correct genuine vertical collisions.
 *
 * The normal lane positions are left alone. After the cards have
 * rendered, their actual heights are measured. If two cards occupy
 * overlapping horizontal space and their vertical rectangles overlap,
 * only the lower card is moved down far enough to clear the card above.
 *
 * This prevents the larger text from causing selective overlaps without
 * globally increasing the spacing between every lane.
 */
function resolveVerticalOverlaps(){

  if(
    !window.matchMedia(
      "(orientation: landscape)"
    ).matches
  ){
    return;
  }

  const papersOnTimeline =
    [...timeline.querySelectorAll(".paper")];

  if(!papersOnTimeline.length){
    return;
  }

  const gap = 8;
  const maxPasses = papersOnTimeline.length + 2;

  for(let pass = 0; pass < maxPasses; pass++){

    let changed = false;

    const ordered =
      [...papersOnTimeline].sort(
        (a,b) =>
          a.getBoundingClientRect().top -
          b.getBoundingClientRect().top
      );

    for(let i = 0; i < ordered.length; i++){

      const current = ordered[i];
      const currentRect =
        current.getBoundingClientRect();

      let requiredTop =
        currentRect.top;

      for(let j = 0; j < i; j++){

        const previous = ordered[j];
        const previousRect =
          previous.getBoundingClientRect();

        const horizontalOverlap =
          currentRect.left <
            previousRect.right &&
          currentRect.right >
            previousRect.left;

        if(!horizontalOverlap){
          continue;
        }

        const verticalOverlap =
          currentRect.top <
            previousRect.bottom + gap &&
          currentRect.bottom >
            previousRect.top;

        if(!verticalOverlap){
          continue;
        }

        requiredTop =
          Math.max(
            requiredTop,
            previousRect.bottom + gap
          );
      }

      if(
        requiredTop >
        currentRect.top + 0.5
      ){

        const delta =
          requiredTop -
          currentRect.top;

        const currentTop =
          parseFloat(
            current.style.top
          ) || 0;

        current.style.top =
          (currentTop + delta) + "px";

        changed = true;
      }
    }

    if(!changed){
      break;
    }
  }
}


function render(){

  resetTimelineInteraction();

  const visible =
    papers
      .filter(
        p =>
          activeFilter === "all" ||
          p.category.includes(activeFilter)
      )
      .sort(
        (a,b) =>
          dateValue(a)-dateValue(b) ||
          a.title.localeCompare(b.title)
      );

  if(!visible.length){

    document.getElementById(
      "paperCount"
    ).textContent = "0";

    document.getElementById(
      "earliestPaper"
    ).textContent = "—";

    document.getElementById(
      "latestPaper"
    ).textContent = "—";

    timeline.innerHTML =
      '<div class="status">No papers in this category.</div>';

    return;
  }

  const min = dateValue(visible[0]);
  const max = dateValue(
    visible[visible.length-1]
  );

  document.getElementById(
    "paperCount"
  ).textContent =
    visible.length +
    (
      visible.length === 1
        ? " Paper"
        : " Papers"
    );

  document.getElementById(
    "earliestPaper"
  ).textContent =
    formatDate(visible[0]);

  document.getElementById(
    "latestPaper"
  ).textContent =
    formatDate(
      visible[visible.length-1]
    );

  visible.forEach(
    p =>
      p._x =
        positionFor(
          p.updated,
          min,
          max
        )
  );

  const isLandscape =
    window.matchMedia(
      "(orientation: landscape)"
    ).matches;

  const isShortLandscape =
    isLandscape &&
    window.innerHeight <= 600;

  const laneCount =
    buildLanes(visible);

  /*
   * Keep the original lane spacing.
   * Actual overlaps are corrected afterward by
   * resolveVerticalOverlaps().
   */
  const laneHeight =
    isShortLandscape ? 82 : 112;

  const topPadding =
    isShortLandscape ? 20 : 40;

  if(isLandscape){

    const minimumTimelineHeight =
      isShortLandscape ? 210 : 360;

    timeline.style.minHeight =
      Math.max(
        minimumTimelineHeight,
        topPadding +
        laneCount * laneHeight +
        35
      ) + "px";

  }else{

    timeline.style.removeProperty(
      "min-height"
    );
  }

  timeline.innerHTML = "";

  const years = [
    ...new Set(
      visible.map(
        p => p.updated.slice(0,4)
      )
    )
  ];

  years.forEach(year => {

    const yearDate =
      `${year}-01-01`;

    const y =
      positionFor(
        yearDate,
        min,
        max
      );

    const guide =
      document.createElement("div");

    guide.className = "year";

    guide.style.left =
      y + "%";

    guide.textContent = year;

    timeline.appendChild(guide);
  });

  let lastListYear = "";

  visible.forEach(p => {

    const year =
      String(p.updated).slice(0,4);

    if(
      !isLandscape &&
      year !== lastListYear
    ){

      const yearMarker =
        document.createElement("div");

      yearMarker.className =
        "list-year";

      yearMarker.textContent =
        year;

      timeline.appendChild(
        yearMarker
      );

      lastListYear = year;
    }

    const el =
      document.createElement("article");

    el.className = "paper";

    el.style.left =
      (
        isLandscape &&
        p._visualX != null
      )
        ?
        (
          (
            p._visualX /
            Math.max(
              1,
              timeline.clientWidth
            )
          ) * 100
        ) + "%"
        :
        p._x + "%";

    el.style.top =
      (
        topPadding +
        p._lane * laneHeight
      ) + "px";

    el.style.setProperty(
      "--paper-color",
      colorForCategory(
        p.category[0]
      )
    );

    const cats =
      p.category
        .map(categoryLabel)
        .join(" • ");

    el.innerHTML = `
      <div class="connector" aria-hidden="true"></div>

      <div class="dot" aria-hidden="true"></div>

      <div class="paper-card ${
        (
          showNewestBadge &&
          p.key === newestKey &&
          p.featured
        )
          ? "has-two-badges"
          : ""
      }" tabindex="0">

        <div class="paper-topline">

          <div class="paper-date">
            ${escapeHtml(formatDate(p))}
          </div>

          ${getPaperBadges(p)}

        </div>

        <button
          type="button"
          class="favorite-star ${
            isFavorite(p.key)
              ? "active"
              : ""
          }"
          data-favorite-key="${escapeHtml(p.key)}"
          aria-label="${
            isFavorite(p.key)
              ? "Remove from favorites"
              : "Add to favorites"
          }"
          title="${
            isFavorite(p.key)
              ? "Remove from favorites"
              : "Add to favorites"
          }"
        >${
          isFavorite(p.key)
            ? "★"
            : "☆"
        }</button>

        <div class="paper-title">
          ${escapeHtml(p.title)}
        </div>

        <div class="paper-category">
          ${escapeHtml(cats)}
        </div>

        <div class="paper-description">

          <img
            class="paper-cover"
            src="covers/${escapeHtml(p.key)}.png"
            alt=""
            loading="lazy"
            onerror="this.remove()">

          <div class="paper-description-body">

            <div class="description-label">
              About this paper
            </div>

            <div>
              ${escapeHtml(
                p.description ||
                "No description available."
              )}
            </div>

            ${
              p.url
                ?
                `<a
                  class="paper-link"
                  href="${escapeHtml(p.url)}"
                  data-paper-title="${escapeHtml(p.title)}"
                >
                  Read Research
                  <span>→</span>
                </a>`
                :
                ""
            }

          </div>

        </div>

      </div>
    `;

    timeline.appendChild(el);
  });

  axisLabels.innerHTML = "";

  /*
   * Wait until the browser has calculated the actual card heights,
   * then correct only real collisions.
   */
  if(isLandscape){

    requestAnimationFrame(() => {

      resolveVerticalOverlaps();

    });
  }
}


function resetTimelineInteraction(){

  document
    .querySelectorAll(
      ".paper.popup-open"
    )
    .forEach(
      p =>
        p.classList.remove(
          "popup-open"
        )
    );

  document
    .querySelectorAll(
      ".paper-card.expanded"
    )
    .forEach(
      c =>
        c.classList.remove(
          "expanded"
        )
    );

  document
    .querySelectorAll(
      ".paper.popup-left,.paper.popup-right"
    )
    .forEach(p => {

      p.classList.remove(
        "popup-left",
        "popup-right"
      );

    });

  document
    .querySelectorAll(".paper")
    .forEach(p => {

      p.style.removeProperty(
        "--popup-x"
      );

      p.style.removeProperty(
        "--popup-left"
      );

    });
}


let lastOrientation =
  window.matchMedia(
    "(orientation: landscape)"
  ).matches
    ? "landscape"
    : "portrait";


function handleOrientationChange(){

  const current =
    window.matchMedia(
      "(orientation: landscape)"
    ).matches
      ? "landscape"
      : "portrait";

  if(current !== lastOrientation){

    lastOrientation = current;

    resetTimelineInteraction();

    render();
  }
}


function positionLandscapePopup(paperEl){

  if(
    !window.matchMedia(
      "(orientation: landscape)"
    ).matches
  ){
    return;
  }

  const popup =
    paperEl.querySelector(
      ".paper-description"
    );

  if(!popup){
    return;
  }

  const paperRect =
    paperEl.getBoundingClientRect();

  const timelineRect =
    timeline.getBoundingClientRect();

  const isShortLandscape =
    window.innerHeight <= 600;

  const popupWidth =
    isShortLandscape
      ? Math.min(
          190,
          window.innerWidth - 20
        )
      : Math.min(
          310,
          window.innerWidth - 20
        );

  const edgeGap =
    isShortLandscape ? 5 : 8;

  const desiredLeft =
    paperRect.left +
    (paperRect.width / 2) -
    (popupWidth / 2);

  const minLeft =
    timelineRect.left +
    edgeGap;

  const maxLeft =
    Math.max(
      minLeft,
      timelineRect.right -
      popupWidth -
      edgeGap
    );

  const viewportLeft =
    Math.max(
      minLeft,
      Math.min(
        maxLeft,
        desiredLeft
      )
    );

  paperEl.style.setProperty(
    "--popup-left",
    (
      viewportLeft -
      paperRect.left
    ) + "px"
  );
}


document.addEventListener(
  "click",
  e => {

    const paper =
      e.target.closest(".paper");

    if(
      window.matchMedia(
        "(orientation: landscape)"
      ).matches
    ){

      const openPapers =
        document.querySelectorAll(
          ".paper.popup-open"
        );

      if(!paper){

        openPapers.forEach(
          x =>
            x.classList.remove(
              "popup-open"
            )
        );

        return;
      }

      if(
        e.target.closest(
          ".favorite-star"
        ) ||
        e.target.closest(
          ".paper-link"
        )
      ){
        return;
      }

      openPapers.forEach(x => {

        if(x !== paper){

          x.classList.remove(
            "popup-open"
          );

        }

      });

      paper.classList.toggle(
        "popup-open"
      );

      if(
        paper.classList.contains(
          "popup-open"
        )
      ){

        positionLandscapePopup(
          paper
        );
      }
    }
  }
);


document.addEventListener(
  "mouseenter",
  e => {

    const paper =
      e.target.closest(".paper");

    if(paper){
      positionLandscapePopup(
        paper
      );
    }

  },
  true
);


window.addEventListener(
  "resize",
  () => {

    handleOrientationChange();

    document
      .querySelectorAll(
        ".paper.popup-open, .paper:hover"
      )
      .forEach(
        positionLandscapePopup
      );

  }
);


const orientationQuery =
  window.matchMedia(
    "(orientation: landscape)"
  );

if(
  orientationQuery.addEventListener
){

  orientationQuery.addEventListener(
    "change",
    handleOrientationChange
  );

}else if(
  orientationQuery.addListener
){

  orientationQuery.addListener(
    handleOrientationChange
  );
}


document.addEventListener(
  "click",
  e => {

    const listMode =
      window.matchMedia(
        "(orientation: portrait)"
      ).matches
      ||
      (
        window.matchMedia(
          "(orientation: landscape)"
        ).matches &&
        window.innerHeight <= 600
      );

    if(!listMode){
      return;
    }

    const card =
      e.target.closest(
        ".paper-card"
      );

    if(!card){

      document
        .querySelectorAll(
          ".paper-card.expanded"
        )
        .forEach(
          other =>
            other.classList.remove(
              "expanded"
            )
        );

      return;
    }

    if(
      e.target.closest(
        ".favorite-star, .paper-link"
      )
    ){
      return;
    }

    const willExpand =
      !card.classList.contains(
        "expanded"
      );

    document
      .querySelectorAll(
        ".paper-card.expanded"
      )
      .forEach(other => {

        if(other !== card){

          other.classList.remove(
            "expanded"
          );

        }

      });

    card.classList.toggle(
      "expanded"
    );

    if(willExpand){

      const keepExpandedVisible =
        () => {

          const target =
            card.querySelector(
              ".paper-description"
            ) || card;

          const rect =
            target.getBoundingClientRect();

          const bottomClearance = 78;
          const sideClearance = 8;
          const topClearance = 10;

          let left = rect.left;
          let right = rect.right;
          let top = rect.top;
          let bottom = rect.bottom;

          let dx = 0;
          let dy = 0;

          if(
            left < sideClearance
          ){

            dx =
              left -
              sideClearance;

          }else if(
            right >
            window.innerWidth -
            sideClearance
          ){

            dx =
              right -
              (
                window.innerWidth -
                sideClearance
              );
          }

          if(
            bottom >
            window.innerHeight -
            bottomClearance
          ){

            dy =
              bottom -
              (
                window.innerHeight -
                bottomClearance
              );

          }else if(
            top < topClearance
          ){

            dy =
              top -
              topClearance;
          }

          if(dx || dy){

            window.scrollBy({
              left:dx,
              top:dy,
              behavior:"smooth"
            });

          }

          requestAnimationFrame(
            () => {

              const r =
                card.getBoundingClientRect();

              let dx2 = 0;
              let dy2 = 0;

              if(r.left < 8){

                dx2 = r.left - 8;

              }else if(
                r.right >
                window.innerWidth - 8
              ){

                dx2 =
                  r.right -
                  (
                    window.innerWidth -
                    8
                  );
              }

              if(
                r.bottom >
                window.innerHeight - 78
              ){

                dy2 =
                  r.bottom -
                  (
                    window.innerHeight -
                    78
                  );
              }

              if(
                r.top < 10
              ){

                dy2 =
                  r.top - 10;
              }

              if(dx2 || dy2){

                window.scrollBy({
                  left:dx2,
                  top:dy2,
                  behavior:"smooth"
                });

              }

            }
          );
        };

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              requestAnimationFrame(
                keepExpandedVisible
              );

            }
          );

          setTimeout(
            keepExpandedVisible,
            120
          );

        }
      );
    }
  }
);


document.addEventListener(
  "pointerdown",
  e => {

    const star =
      e.target.closest(
        ".favorite-star"
      );

    if(star){
      e.stopPropagation();
    }

  }
);


document.addEventListener(
  "click",
  e => {

    const star =
      e.target.closest(
        ".favorite-star"
      );

    if(star){

      e.stopPropagation();

    }

    if(!star){
      return;
    }

    e.preventDefault();
    e.stopPropagation();

    const key =
      star.dataset.favoriteKey;

    if(isFavorite(key)){

      favoritePapers =
        favoritePapers.filter(
          item => item !== key
        );

    }else{

      favoritePapers.push(key);

    }

    localStorage.setItem(
      "favoritePapers",
      JSON.stringify(
        favoritePapers
      )
    );

    const active =
      isFavorite(key);

    star.classList.toggle(
      "active",
      active
    );

    star.textContent =
      active ? "★" : "☆";

    star.setAttribute(
      "aria-label",
      active
        ? "Remove from favorites"
        : "Add to favorites"
    );

    star.title =
      active
        ? "Remove from favorites"
        : "Add to favorites";
  }
);


document.addEventListener(
  "click",
  e => {

    const link =
      e.target.closest(
        ".paper-link"
      );

    if(!link){
      return;
    }

    e.preventDefault();

    const paperUrl =
      link.getAttribute("href");

    const paperTitle =
      link.dataset.paperTitle ||
      "PDF";

    const returnUrl =
      window.location.href;

    const viewerUrl =
      "pdf.html?file=" +
      encodeURIComponent(paperUrl) +
      "&paper=" +
      encodeURIComponent(paperTitle) +
      "&return=" +
      encodeURIComponent(returnUrl);

    window.location.href =
      viewerUrl;
  }
);


function buildControls(){

  const categories =
    [
      ...new Set(
        papers.flatMap(
          p => p.category
        )
      )
    ].sort();

  categoryFilter.innerHTML =
    `<option value="all">All Research</option>` +
    categories
      .map(
        c =>
          `<option value="${escapeHtml(c)}">${escapeHtml(categoryLabel(c))}</option>`
      )
      .join("");

  const savedFilter =
    localStorage.getItem(
      "timelineFilter"
    );

  if(
    savedFilter &&
    (
      savedFilter === "all" ||
      categories.includes(
        savedFilter
      )
    )
  ){

    activeFilter =
      savedFilter;
  }

  categoryFilter.value =
    activeFilter;

  categoryFilter.addEventListener(
    "change",
    () => {

      activeFilter =
        categoryFilter.value;

      localStorage.setItem(
        "timelineFilter",
        activeFilter
      );

      render();
    }
  );

  legend.innerHTML =
    categories
      .map(
        c =>
          `
          <span>
            <i style="background:${colorForCategory(c)}"></i>
            ${escapeHtml(categoryLabel(c))}
          </span>
          `
      )
      .join("");
}


async function load(){

  try{

    const response =
      await fetch(
        DATA_FILE,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    const entries =
      Array.isArray(data)
        ?
        data.map(
          (paper,index) =>
            [
              String(index),
              paper
            ]
        )
        :
        Object.entries(data);

    papers =
      entries
        .filter(
          ([key,p]) =>
            p &&
            p.title &&
            p.updated &&
            Array.isArray(
              p.category
            )
        )
        .map(
          ([key,p]) => ({
            key,
            title:p.title,
            updated:p.updated,
            category:p.category,
            description:
              p.description || "",
            url:p.url || "",
            featured:
              Boolean(p.featured),
            featuredOrder:
              Number(
                p.featuredOrder
              ) || 999999
          })
        );

    if(!papers.length){

      throw new Error(
        "No timeline records found."
      );
    }

    const newestPaper =
      [...papers].sort(
        (a,b) =>
          dateValue(b) -
          dateValue(a)
      )[0];

    newestKey =
      newestPaper.key;

    const newestDate =
      dateValue(newestPaper);

    const today =
      new Date();

    const oneYearAgo =
      new Date(today);

    oneYearAgo.setFullYear(
      today.getFullYear() - 1
    );

    showNewestBadge =
      newestDate >= oneYearAgo;

    loadFavorites();

    buildControls();

    render();

  }catch(error){

    console.error(
      "Timeline error:",
      error
    );

    timeline.innerHTML =
      '<div class="status">Unable to load descriptions.json. Check that timeline.html and descriptions.json are in the same directory.</div>';
  }
}


load();


window.addEventListener(
  "resize",
  () => {

    if(
      papers.length &&
      window.innerWidth > 900
    ){

      render();

    }

  }
);
