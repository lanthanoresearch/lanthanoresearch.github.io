<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* A refresh starts this page fresh, from the top, like a normal new visit.
   Only this page's remembered "where I was" is forgotten - saved settings,
   favorites and other saved data are never touched. (Coming back from a
   paper/image/video/other page still restores your spot; only a reload
   resets it.) */
(function(){
  try{
    var keys = ["timelineScroll", "timelineOpenKey"];
    var prefixes = [];

    function forget(){
      keys.forEach(function(k){ sessionStorage.removeItem(k); });
      Object.keys(sessionStorage).forEach(function(k){
        for(var i = 0; i < prefixes.length; i++){
          if(k.indexOf(prefixes[i]) === 0){ sessionStorage.removeItem(k); break; }
        }
      });
    }

    // Page restored whole from the browser's back/forward cache: it is
    // already exactly as it was, so drop any leftover "restore me" notes.
    window.addEventListener("pageshow", function(e){
      if(e.persisted){ try{ forget(); }catch(err){} }
    });

    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var isReload = nav ? nav.type === "reload"
      : (performance.navigation && performance.navigation.type === 1);
    if(!isReload) return;

    forget();

    if("scrollRestoration" in history) history.scrollRestoration = "manual";

    var top = function(){ window.scrollTo({top:0, behavior:"instant"}); };
    top();
    window.addEventListener("load", function(){
      top();
      requestAnimationFrame(function(){
        top();
        if("scrollRestoration" in history) history.scrollRestoration = "auto";
      });
    });
  }catch(e){}
})();
</script>
<script>
/* Home / Back links: when the page you came from is the one just before
   this one in the browser's history, step back through the history (the
   page comes back exactly as you left it and the phone's own back button
   stays consistent). Otherwise just open the page. */
(function(){
  function norm(p){ return p.replace(/index\.html$/, ""); }

  window.__goHome = function(){
    var dest = "index.html";
    var canStep = false;
    try{
      if(history.length > 1 && document.referrer){
        var r = new URL(document.referrer), t = new URL(dest, location.href);
        canStep = r.origin === t.origin && norm(r.pathname) === norm(t.pathname);
      }
    }catch(e){}

    if(!canStep){ location.assign(dest); return; }

    var fallback = setTimeout(function(){ location.assign(dest); }, 1200);
    window.addEventListener("pagehide", function(){ clearTimeout(fallback); }, {once:true});
    history.back();
  };

  document.addEventListener("click", function(e){
    if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href="index.html"]') : null;
    if(!a || (a.target && a.target !== "_self")) return;
    e.preventDefault();
    window.__goHome();
  });
})();
</script>

/* Anchored via JS (positionCategoryPanel) exactly like pdf.html's
   #readAloudSpeedPopup / video.html's #videoSpeedPopup: fixed
   positioning so it can float above or below the button depending
   on available room, a natural width capped so it never runs off a
   narrow screen, and a height ceiling that positionAnchoredPopup
   will shrink further (down to a floor) if neither side of the
   button has enough room - overflow-y:auto here then picks up the
   slack with an internal scrollbar instead of clipping options. */
.category-panel{
  box-sizing:border-box;

  display:none;
  position:fixed;
  width:190px;
  max-width:calc(100vw - 24px);
  max-height:min(60vh, 420px);
  overflow-y:auto;
  background:#1d1d1d;
  border:1px solid #2c2c2c;
  border-radius:10px;
  padding:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
  z-index:1600;
  text-align:left;
}

}

/* The same little jump the heart gives on images and videos. */

   BACK TO TOP BUTTON

   Sits above the fixed legend bar rather than at a flat
   bottom:20px, since the legend already occupies that space.

   measured height, so it always clears the legend regardless
   of how many categories are in it or how the layout wraps.
   ========================================================= */

  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  width:50px;
  height:50px;
  background:#2a2a2a;

  text-decoration:none;
  border-radius:50%;
  display:none;

}

<body>

<main>

<div class="top-nav">
  <a class="home-button" href="index.html"><svg class="back-arrow" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1em;height:1em;vertical-align:-.12em;margin-right:.35em;flex-shrink:0"><path d="M18 4.5v15L5.5 12z"/></svg> Home</a>
</div>

<div class="hero"><div class="hero-badge pv-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 15.2h7"/><circle cx="8.5" cy="15.2" r="1.1"/><circle cx="15.5" cy="15.2" r="1.1"/></svg></div></div>
<h1 style="margin-bottom:20px">Research Timeline</h1>

<p class="subtitle">
  A chronologically timeline of the research archive. Hover over a paper to read its description.
</p>

<div class="timeline-meta" id="stats" aria-live="polite">
  <span>Earliest <strong id="earliestPaper">—</strong></span>
  <span class="meta-divider"></span>
  <span>Latest <strong id="latestPaper">—</strong></span>
</div>

  <p id="paperCount" class="paper-count">—</p>

  <div class="category-dropdown" id="categoryDropdown">

    <button
      class="category-btn"
      id="categoryButton"
      type="button"
      aria-label="Filter research by category"
    >
      <span class="category-btn-label" id="categoryButtonLabel">All Research</span>
      <span class="category-caret" aria-hidden="true"></span>
    </button>

  </div>
</div>

  <div class="axis-labels" id="axisLabels"></div>

    <div class="status">Loading research timeline...</div>
  </div>

</div>

</main>

<a href="#" class="top-button" id="topButton">
  <span style="position:relative; top:-3px;">▲</span>
</a>


<script>
const DATA_FILE = "./descriptions.json";

const timeline = document.getElementById("timeline");
const legend = document.getElementById("legend");
const stats = document.getElementById("stats");
const axisLabels = document.getElementById("axisLabels");

const categoryDropdown = document.getElementById("categoryDropdown");
const categoryButton = document.getElementById("categoryButton");
const categoryButtonLabel = document.getElementById("categoryButtonLabel");
const categoryPanel = document.getElementById("categoryPanel");

let papers = [];
let activeFilter = "all";
let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;


function loadFavorites(){
  try{
    favoritePapers = JSON.parse(
      localStorage.getItem("favoritePapers") || "[]"
    );

    if(!Array.isArray(favoritePapers)){
      favoritePapers = [];
    }

  }catch{
    favoritePapers = [];
  }
}


function isFavorite(key){
  return favoritePapers.includes(key);
}


function toggleFavorite(key){

  if(isFavorite(key)){
    favoritePapers = favoritePapers.filter(
      item => item !== key
    );
  }else{
    favoritePapers.push(key);
  }

  localStorage.setItem(
    "favoritePapers",
    JSON.stringify(favoritePapers)
  );

  render();
}


const categoryColors = {
  biblical:"#b58cff",
  historical:"#d7a85b",
  scientific:"#55c7a0",
  medical:"#e77b91",
  political:"#d66a6a",
  astronomy:"#6fa8ff",
  technology:"#58b6d9",
  philosophy:"#c48bd8",
  geographic:"#78b85a",
  economic:"#d9b44a"
};


function categoryLabel(category){
  return String(category || "")
    .charAt(0)
    .toUpperCase()
    +
    String(category || "").slice(1);
}


function colorForCategory(category){

  const key = String(category || "").toLowerCase();

  if(categoryColors[key]){
    return categoryColors[key];
  }

  let hash = 0;

  for(const c of key){
    hash =
      ((hash << 5) - hash)
      +
      c.charCodeAt(0)
      |
      0;
  }

  return `hsl(${Math.abs(hash) % 360} 58% 62%)`;
}


function escapeHtml(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}


function dateValue(p){
  return new Date(`${p.updated}T00:00:00`);
}


function formatYear(value){

  const d =
    value instanceof Date
      ? value
      : new Date(value);

  return Number.isNaN(d.getTime())
    ? ""
    : String(d.getFullYear());
}


function formatDate(p){

  return dateValue(p).toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );
}


function positionFor(date,min,max){

  const value =
    dateValue({updated:date}).getTime();

  const a = min.getTime();
  const b = max.getTime();

  return 3 +
    ((value-a)/(b-a || 1))*94;
}


function getPaperBadges(paper){

  const isNewest =
    showNewestBadge &&
    paper.key === newestKey;

  const badges = [];

  if(isNewest){
    badges.push(
      '<span class="paper-badge newest">NEW</span>'
    );
  }

  if(paper.featured){
    badges.push(
      '<span class="paper-badge featured">FEATURED</span>'
    );
  }

  return badges.length
    ? `<div class="paper-badges has-badges">${badges.join("")}</div>`
    : "";
}


function buildLanes(items){

  const landscape =
    window.matchMedia(
      "(orientation: landscape)"
    ).matches;

  if(!landscape){

    items.forEach(
      (paper,i) => paper._lane = i
    );

    return items.length;
  }

  const shortLandscape =
    window.innerHeight <= 600;

  const cardWidth =
    shortLandscape ? 118 : 206;

  const gap =
    shortLandscape ? 10 : 14;

  const timelineWidth =
    Math.max(timeline.clientWidth,1);

  const lanes = [];

  for(const paper of items){

    let x =
      (paper._x/100) *
      timelineWidth;

    const half =
      cardWidth/2;

    const edgePad = 12;

    x = Math.max(
      half + edgePad,
      Math.min(
        timelineWidth - half - edgePad,
        x
      )
    );

    let lane = 0;

    while(lanes[lane] !== undefined){

      const previousRight =
        lanes[lane] + half;

      const currentLeft =
        x - half;

      if(
        currentLeft >=
        previousRight + gap
      ){
        break;
      }

      lane++;
    }

    lanes[lane] = x;

    paper._visualX = x;
    paper._lane = lane;
  }

  return Math.max(lanes.length,1);
}


/*
 * Only correct genuine vertical collisions.
 *
 * The normal lane positions are left alone. After the cards have
 * rendered, their actual heights are measured. If two cards occupy
 * overlapping horizontal space and their vertical rectangles overlap,
 * only the lower card is moved down far enough to clear the card above.
 *
 * This prevents the larger text from causing selective overlaps without
 * globally increasing the spacing between every lane.
 */
function resolveVerticalOverlaps(){

  if(
    !window.matchMedia(
      "(orientation: landscape)"
    ).matches
  ){
    return;
  }

  const papersOnTimeline =
    [...timeline.querySelectorAll(".paper")];

  if(!papersOnTimeline.length){
    return;
  }

  const gap = 8;
  const maxPasses = papersOnTimeline.length + 2;

  for(let pass = 0; pass < maxPasses; pass++){

    let changed = false;

    const ordered =
      [...papersOnTimeline].sort(
        (a,b) =>
          a.getBoundingClientRect().top -
          b.getBoundingClientRect().top
      );

    for(let i = 0; i < ordered.length; i++){

      const current = ordered[i];
      const currentRect =
        current.getBoundingClientRect();

      let requiredTop =
        currentRect.top;

      for(let j = 0; j < i; j++){

        const previous = ordered[j];
        const previousRect =
          previous.getBoundingClientRect();

        const horizontalOverlap =
          currentRect.left <
            previousRect.right &&
          currentRect.right >
            previousRect.left;

        if(!horizontalOverlap){
          continue;
        }

        const verticalOverlap =
          currentRect.top <
            previousRect.bottom + gap &&
          currentRect.bottom >
            previousRect.top;

        if(!verticalOverlap){
          continue;
        }

        requiredTop =
          Math.max(
            requiredTop,
            previousRect.bottom + gap
          );
      }

      if(
        requiredTop >
        currentRect.top + 0.5
      ){

        const delta =
          requiredTop -
          currentRect.top;

        const currentTop =
          parseFloat(
            current.style.top
          ) || 0;

        current.style.top =
          (currentTop + delta) + "px";

        changed = true;
      }
    }

    if(!changed){
      break;
    }
  }
}


function render(){

  resetTimelineInteraction();

  const visible =
    papers
      .filter(
        p =>
          activeFilter === "all" ||
          p.category.includes(activeFilter)
      )
      .sort(
        (a,b) =>
          dateValue(a)-dateValue(b) ||
          a.title.localeCompare(b.title)
      );

  if(!visible.length){

    document.getElementById(
      "paperCount"
    ).textContent = "0";

    document.getElementById(
      "earliestPaper"
    ).textContent = "—";

    document.getElementById(
      "latestPaper"
    ).textContent = "—";

    timeline.innerHTML =
      '<div class="status">No papers in this category.</div>';

    return;
  }

  const min = dateValue(visible[0]);
  const max = dateValue(
    visible[visible.length-1]
  );

  document.getElementById(
    "paperCount"
  ).textContent =
    visible.length +
    (
      visible.length === 1
        ? " Paper"
        : " Papers"
    );

  document.getElementById(
    "earliestPaper"
  ).textContent =
    formatDate(visible[0]);

  document.getElementById(
    "latestPaper"
  ).textContent =
    formatDate(
      visible[visible.length-1]
    );

  visible.forEach(
    p =>
      p._x =
        positionFor(
          p.updated,
          min,
          max
        )
  );

  const isLandscape =
    window.matchMedia(
      "(orientation: landscape)"
    ).matches;

  const isShortLandscape =
    isLandscape &&
    window.innerHeight <= 600;

  const laneCount =
    buildLanes(visible);

  /*
   * Keep the original lane spacing.
   * Actual overlaps are corrected afterward by
   * resolveVerticalOverlaps().
   */
  const laneHeight =
    isShortLandscape ? 82 : 112;

  const topPadding =
    isShortLandscape ? 20 : 40;

  if(isLandscape){

    const minimumTimelineHeight =
      isShortLandscape ? 210 : 360;

    timeline.style.minHeight =
      Math.max(
        minimumTimelineHeight,
        topPadding +
        laneCount * laneHeight +
        35
      ) + "px";

  }else{

    timeline.style.removeProperty(
      "min-height"
    );
  }

  timeline.innerHTML = "";

  const years = [
    ...new Set(
      visible.map(
        p => p.updated.slice(0,4)
      )
    )
  ];

  years.forEach(year => {

    const yearDate =
      `${year}-01-01`;

    const y =
      positionFor(
        yearDate,
        min,
        max
      );

    const guide =
      document.createElement("div");

    guide.className = "year";

    guide.style.left =
      y + "%";

    guide.textContent = year;

    timeline.appendChild(guide);
  });

  let lastListYear = "";

  visible.forEach(p => {

    const year =
      String(p.updated).slice(0,4);

    if(
      !isLandscape &&
      year !== lastListYear
    ){

      const yearMarker =
        document.createElement("div");

      yearMarker.className =
        "list-year";

      yearMarker.textContent =
        year;

      timeline.appendChild(
        yearMarker
      );

      lastListYear = year;
    }

    const el =
      document.createElement("article");

    el.className = "paper";

    el.style.left =
      (
        isLandscape &&
        p._visualX != null
      )
        ?
        (
          (
            p._visualX /
            Math.max(
              1,
              timeline.clientWidth
            )
          ) * 100
        ) + "%"
        :
        p._x + "%";

    el.style.top =
      (
        topPadding +
        p._lane * laneHeight
      ) + "px";

    el.style.setProperty(
      "--paper-color",
      colorForCategory(
        p.category[0]
      )
    );

    const cats =
      p.category
        .map(categoryLabel)
        .join(" • ");

    el.innerHTML = `
      <div class="connector" aria-hidden="true"></div>

      <div class="dot" aria-hidden="true"></div>

      <div class="paper-card ${
        (
          showNewestBadge &&
          p.key === newestKey &&
          p.featured
        )
          ? "has-two-badges"
          : ""
      }" tabindex="0">

        <div class="paper-topline">

          <div class="paper-date">
            ${escapeHtml(formatDate(p))}
          </div>

          ${getPaperBadges(p)}

        </div>

        <button
          type="button"
          class="favorite-star ${
            isFavorite(p.key)
              ? "active"
              : ""
          }"
          data-favorite-key="${escapeHtml(p.key)}"
          aria-label="${
            isFavorite(p.key)
              ? "Remove from favorite papers"
              : "Add to favorite papers"
          }"
          title="${
            isFavorite(p.key)
              ? "Remove from favorite papers"
              : "Add to favorite papers"
          }"
        >${
          isFavorite(p.key)
            ? "★"
            : "☆"
        }</button>

        <div class="paper-title">
          ${escapeHtml(p.title)}
        </div>

        <div class="paper-category">
          ${escapeHtml(cats)}
        </div>

        <div class="paper-description">

          <div class="description-label">
            About this paper
          </div>

          <img
            class="paper-cover"
            src="covers/${escapeHtml(p.key)}.png"
            alt=""
            loading="lazy"
            onerror="this.remove()">

          <div>
            ${escapeHtml(
              p.description ||
              "No description available."
            )}
          </div>

          ${
            p.url
              ?
              `<a
                class="paper-link"
                href="${escapeHtml(p.url)}"
                data-paper-title="${escapeHtml(p.title)}"
              >
                Read Research
                <span>→</span>
              </a>`
              :
              ""
          }

        </div>

      </div>
    `;

    timeline.appendChild(el);
  });

  axisLabels.innerHTML = "";

  /*
   * Wait until the browser has calculated the actual card heights,
   * then correct only real collisions.
   */
  if(isLandscape){

    requestAnimationFrame(() => {

      resolveVerticalOverlaps();

    });
  }
}


function resetTimelineInteraction(){

  document
    .querySelectorAll(
      ".paper.popup-open"
    )
    .forEach(
      p =>
        p.classList.remove(
          "popup-open"
        )
    );

  document
    .querySelectorAll(
      ".paper-card.expanded"
    )
    .forEach(
      c =>
        c.classList.remove(
          "expanded"
        )
    );

  document
    .querySelectorAll(
      ".paper.popup-left,.paper.popup-right"
    )
    .forEach(p => {

      p.classList.remove(
        "popup-left",
        "popup-right"
      );

    });

  document
    .querySelectorAll(".paper")
    .forEach(p => {

      p.style.removeProperty(
        "--popup-x"
      );

      p.style.removeProperty(
        "--popup-left"
      );

    });
}


let lastOrientation =
  window.matchMedia(
    "(orientation: landscape)"
  ).matches
    ? "landscape"
    : "portrait";


function handleOrientationChange(){

  const current =
    window.matchMedia(
      "(orientation: landscape)"
    ).matches
      ? "landscape"
      : "portrait";

  if(current !== lastOrientation){

    lastOrientation = current;

    resetTimelineInteraction();

    render();
  }
}


function positionLandscapePopup(paperEl){

  if(
    !window.matchMedia(
      "(orientation: landscape)"
    ).matches
  ){
    return;
  }

  const popup =
    paperEl.querySelector(
      ".paper-description"
    );

  if(!popup){
    return;
  }

  const paperRect =
    paperEl.getBoundingClientRect();

  const timelineRect =
    timeline.getBoundingClientRect();

  const isShortLandscape =
    window.innerHeight <= 600;

  const popupWidth =
    isShortLandscape
      ? Math.min(
          190,
          window.innerWidth - 20
        )
      : Math.min(
          310,
          window.innerWidth - 20
        );

  const edgeGap =
    isShortLandscape ? 5 : 8;

  const desiredLeft =
    paperRect.left +
    (paperRect.width / 2) -
    (popupWidth / 2);

  const minLeft =
    timelineRect.left +
    edgeGap;

  const maxLeft =
    Math.max(
      minLeft,
      timelineRect.right -
      popupWidth -
      edgeGap
    );

  const viewportLeft =
    Math.max(
      minLeft,
      Math.min(
        maxLeft,
        desiredLeft
      )
    );

  paperEl.style.setProperty(
    "--popup-left",
    (
      viewportLeft -
      paperRect.left
    ) + "px"
  );
}

document.addEventListener(
  "click",
  e => {

    const listMode =
      window.matchMedia(
        "(orientation: portrait)"
      ).matches
      ||
      (
        window.matchMedia(
          "(orientation: landscape)"
        ).matches &&
        window.innerHeight <= 600
      );

    if(!listMode){
      return;
    }

    const card =
      e.target.closest(
        ".paper-card"
      );

    if(!card){

      document
        .querySelectorAll(
          ".paper-card.expanded"
        )
        .forEach(
          other =>
            other.classList.remove(
              "expanded"
            )
        );

      return;
    }

    if(
      e.target.closest(
        ".favorite-star, .paper-link"
      )
    ){
      return;
    }

    const willExpand =
      !card.classList.contains(
        "expanded"
      );

    document
      .querySelectorAll(
        ".paper-card.expanded"
      )
      .forEach(other => {

        if(other !== card){

          other.classList.remove(
            "expanded"
          );

        }

      });

    card.classList.toggle(
      "expanded"
    );

    if(willExpand){

      const keepExpandedVisible =
        () => {

          const target =
            card.querySelector(
              ".paper-description"
            ) || card;

          const rect =
            target.getBoundingClientRect();

          const bottomClearance = 78;
          const sideClearance = 8;
          const topClearance = 10;

          let left = rect.left;
          let right = rect.right;
          let top = rect.top;
          let bottom = rect.bottom;

          let dx = 0;
          let dy = 0;

          if(
            left < sideClearance
          ){

            dx =
              left -
              sideClearance;

          }else if(
            right >
            window.innerWidth -
            sideClearance
          ){

            dx =
              right -
              (
                window.innerWidth -
                sideClearance
              );
          }

          if(
            bottom >
            window.innerHeight -
            bottomClearance
          ){

            dy =
              bottom -
              (
                window.innerHeight -
                bottomClearance
              );

          }else if(
            top < topClearance
          ){

            dy =
              top -
              topClearance;
          }

          if(dx || dy){

            window.scrollBy({
              left:dx,
              top:dy,
              behavior:"smooth"
            });

          }

          requestAnimationFrame(
            () => {

              const r =
                card.getBoundingClientRect();

              let dx2 = 0;
              let dy2 = 0;

              if(r.left < 8){

                dx2 = r.left - 8;

              }else if(
                r.right >
                window.innerWidth - 8
              ){

                dx2 =
                  r.right -
                  (
                    window.innerWidth -
                    8
                  );
              }

              if(
                r.bottom >
                window.innerHeight - 78
              ){

                dy2 =
                  r.bottom -
                  (
                    window.innerHeight -
                    78
                  );
              }

              if(
                r.top < 10
              ){

                dy2 =
                  r.top - 10;
              }

              if(dx2 || dy2){

                window.scrollBy({
                  left:dx2,
                  top:dy2,
                  behavior:"smooth"
                });

              }

            }
          );
        };

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              requestAnimationFrame(
                keepExpandedVisible
              );

            }
          );

          setTimeout(
            keepExpandedVisible,
            120
          );

        }
      );
    }
  }
);

document.addEventListener(
  "click",
  e => {

      e.target.closest(
        ".favorite-star"
      );

    if(star){

      e.stopPropagation();

    }

    if(!star){
      return;
    }

    e.preventDefault();
    e.stopPropagation();

    const key =
      star.dataset.favoriteKey;

    if(isFavorite(key)){

      favoritePapers =
        favoritePapers.filter(
          item => item !== key
        );

    }else{

      favoritePapers.push(key);

    }

    localStorage.setItem(
      "favoritePapers",
      JSON.stringify(
        favoritePapers
      )
    );

    const active =
      isFavorite(key);

    star.classList.toggle(
      "active",
      active
    );

    star.textContent =
      active ? "★" : "☆";

    star.setAttribute(
      "aria-label",
      active
        ? "Remove from favorite papers"
        : "Add to favorite papers"
    );

    star.title =
      active
        ? "Remove from favorite papers"
        : "Add to favorite papers";

    // Same tiny buzz (on phones that allow it) and jump as the heart.
    try{
      if(navigator.vibrate) navigator.vibrate(10);
    }catch(err){}

    star.classList.remove("pop");

    if(active){
      void star.offsetWidth;
      star.classList.add("pop");
    }
  }
);


document.addEventListener(

      e.target.closest(
        ".paper-link"

      const openedStar =

  }
);


function buildControls(){

  const categories =
    [
      ...new Set(
        papers.flatMap(
          p => p.category
        )
      )
    ].sort();

  const options = [
    { value:"all", label:"All Research" },
    ...categories.map(c => ({
      value:c,
      label:categoryLabel(c)
    }))
  ];

  categoryPanel.innerHTML =
    options
      .map(
        opt =>
          `
          <button
            type="button"
            class="category-option"
            data-value="${escapeHtml(opt.value)}"
            role="menuitemradio"
            aria-checked="false"
          >
            <span class="category-option-label">${escapeHtml(opt.label)}</span>
            <span class="category-option-check" aria-hidden="true">✓</span>
          </button>
          `
      )
      .join("");

  const savedFilter =
    localStorage.getItem(
      "timelineFilter"
    );

  if(
    savedFilter &&
    (
      savedFilter === "all" ||
      categories.includes(
        savedFilter
      )
    )
  ){

    activeFilter =
      savedFilter;
  }

  function applyCategoryUI(){

    const selected =
      options.find(
        opt => opt.value === activeFilter
      ) || options[0];

    categoryButtonLabel.textContent =
      selected.label;

    categoryPanel
      .querySelectorAll(
        ".category-option"
      )
      .forEach(btn => {

        const isActive =
          btn.dataset.value === activeFilter;

        btn.classList.toggle(
          "active",
          isActive
        );

        btn.setAttribute(
          "aria-checked",
          isActive ? "true" : "false"
        );

      });
  }

  applyCategoryUI();

  categoryPanel
    .querySelectorAll(
      ".category-option"
    )
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => {

          activeFilter =
            btn.dataset.value;

          localStorage.setItem(
            "timelineFilter",
            activeFilter
          );

          applyCategoryUI();

          closeCategoryDropdown();

          render();
        }
      );
    });

  legend.innerHTML =
    categories
      .map(
        c =>
          `
          <span>
            <i style="background:${colorForCategory(c)}"></i>
            ${escapeHtml(categoryLabel(c))}
          </span>
          `
      )
      .join("");

  positionTopButtonAboveLegend();
}


/* ------------------------------------------------------------
   SHARED ANCHORED-POPUP POSITIONING

   Same helper used by video.html's #videoSpeedPopup and pdf.html's
   #readAloudSpeedPopup: centers the popup horizontally on its
   anchor button, clamped so neither edge ever runs off either side
   of the screen; picks whichever side (above or below the anchor)
   has more room, so it works whether the button ends up near the
   top or bottom of the screen; and if the popup's natural size
   doesn't fit whichever side gets chosen, shrinks it to fit (down
   to a small floor) rather than letting it run off the top or
   bottom of the screen - its own overflow-y:auto content area then
   picks up the slack with an internal scrollbar instead of
   clipping anything. A final clamp on both axes guarantees the
   popup is fully on-screen even in edge cases neither branch
   accounted for.
------------------------------------------------------------ */
function positionAnchoredPopup(popupEl, anchorRect, opts){

  opts = opts || {};

  const gap = opts.gap || 8;
  const edgeMargin = opts.edgeMargin || 10;
  const minHeight = opts.minHeight || 100;

  // Reset any shrink applied on a previous open (at a possibly
  // different viewport size / anchor position) so this measures
  // the popup's real, natural, CSS-capped size.
  popupEl.style.maxHeight = "";

  const popupRect = popupEl.getBoundingClientRect();

  /* ---- Horizontal ---- */

  let left = anchorRect.left + (anchorRect.width / 2) - (popupRect.width / 2);
  const maxLeft = window.innerWidth - popupRect.width - edgeMargin;
  left = Math.max(edgeMargin, Math.min(left, maxLeft));

  /* ---- Vertical ---- */

  const spaceAbove = anchorRect.top - gap - edgeMargin;
  const spaceBelow = window.innerHeight - anchorRect.bottom - gap - edgeMargin;

  const openAbove = spaceAbove >= popupRect.height || spaceAbove >= spaceBelow;

  // The floor is a soft preference, not a hard demand - never ask
  // for more height than the viewport could ever offer (minus
  // margins), or the final clamp below would have to overlap the
  // popup onto its own anchor button just to keep it on-screen.
  const available = Math.min(
    Math.max(minHeight, openAbove ? spaceAbove : spaceBelow),
    window.innerHeight - (edgeMargin * 2)
  );

  if(popupRect.height > available){
    popupEl.style.maxHeight = `${available}px`;
  }

  const finalHeight = Math.min(popupRect.height, available);

  let top = openAbove ?
    anchorRect.top - gap - finalHeight :
    anchorRect.bottom + gap;

  top = Math.max(edgeMargin, Math.min(top, window.innerHeight - finalHeight - edgeMargin));

  popupEl.style.left = `${left}px`;
  popupEl.style.top = `${top}px`;
  popupEl.style.bottom = "";
}

// Anchors #categoryPanel to #categoryButton, same treatment as
// positionVideoSpeedPopup / positionReadAloudPickerPopup.
function positionCategoryPanel(){
  positionAnchoredPopup(
    categoryPanel,
    categoryButton.getBoundingClientRect(),
    { minHeight:100 }
  );
}

function openCategoryDropdown(){
  categoryDropdown.classList.add("open");
  // Unhide before measuring/positioning - a display:none element
  // always measures as zero-size, so this order matters for
  // positionAnchoredPopup's size-based logic.
  categoryPanel.classList.add("open");
  positionCategoryPanel();
}

function closeCategoryDropdown(){
  categoryDropdown.classList.remove("open");
  categoryPanel.classList.remove("open");
}

categoryButton.addEventListener("click", (e) => {
  e.stopPropagation();
  if(categoryPanel.classList.contains("open")){
    closeCategoryDropdown();
  }else{
    openCategoryDropdown();
  }
});

// Tapping anywhere outside the panel closes it.
document.addEventListener("click", (e) => {
  if(
    categoryPanel.classList.contains("open") &&
    !categoryPanel.contains(e.target) &&
    e.target !== categoryButton &&
    !categoryButton.contains(e.target)
  ){
    closeCategoryDropdown();
  }
});

// Scrolling the page also closes it, same as tapping outside.
window.addEventListener(
  "scroll",
  () => closeCategoryDropdown(),
  { passive:true }
);

// Resizing (rotating a phone, resizing a desktop window) can change
// how much room is above/below the button - re-run the same
// anchor+shrink logic so the panel stays correctly sized and
// on-screen, same as pdf.html/video.html do for their own popups.
window.addEventListener("resize", () => {
  if(categoryPanel.classList.contains("open")){
    positionCategoryPanel();
  }
});


/*
 * BACK TO TOP BUTTON
 *
 * The legend bar is fixed to the bottom of the viewport and its
 * height changes with orientation/category count/text wrapping,
 * so the button's position is measured from the legend's actual
 * rendered height rather than a hardcoded offset - this is what
 * keeps the two from ever overlapping.
 */

const topButton = document.getElementById("topButton");

function positionTopButtonAboveLegend(){

  const legendHeight =
    legend.offsetHeight || 0;

  topButton.style.bottom =
    (legendHeight + 14) + "px";

}

function updateTopButton(){
  if(window.scrollY > 10){
    topButton.style.display = "flex";
  }else{
    topButton.style.display = "none";
  }
}

topButton.addEventListener("click", function(e){
  e.preventDefault();
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

window.addEventListener("scroll", updateTopButton);

window.addEventListener("load", function(){
  positionTopButtonAboveLegend();
  updateTopButton();
});

window.addEventListener("resize", function(){
  positionTopButtonAboveLegend();
  updateTopButton();
});


async function load(){

  try{

    const response =
      await fetch(
        DATA_FILE,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    const entries =
      Array.isArray(data)
        ?
        data.map(
          (paper,index) =>
            [
              String(index),
              paper
            ]
        )
        :
        Object.entries(data);

    papers =
      entries
        .filter(
          ([key,p]) =>
            p &&
            p.title &&
            p.updated &&
            Array.isArray(
              p.category
            )
        )
        .map(
          ([key,p]) => ({
            key,
            title:p.title,
            updated:p.updated,
            category:p.category,
            description:
              p.description || "",
            url:p.url || "",
            featured:
              Boolean(p.featured),
            featuredOrder:
              Number(
                p.featuredOrder
              ) || 999999
          })
        );

    if(!papers.length){

      throw new Error(
        "No timeline records found."
      );
    }

    const newestPaper =
      [...papers].sort(
        (a,b) =>
          dateValue(b) -
          dateValue(a)
      )[0];

    newestKey =
      newestPaper.key;

    const newestDate =
      dateValue(newestPaper);

    const today =
      new Date();

    const oneYearAgo =
      new Date(today);

    oneYearAgo.setFullYear(
      today.getFullYear() - 1
    );

    showNewestBadge =
      newestDate >= oneYearAgo;

    loadFavorites();

    buildControls();

    render();

    // Coming back from a paper: return to the same spot on the page.
    try{
      const savedScroll =
        sessionStorage.getItem("timelineScroll");
      const savedOpenKey =
        sessionStorage.getItem("timelineOpenKey");
      sessionStorage.removeItem("timelineScroll");
      sessionStorage.removeItem("timelineOpenKey");

      if(
        savedScroll !== null &&
        (
          (function(){
            const e = performance.getEntriesByType("navigation")[0];
            return !!(e && e.type === "back_forward");
          })()
          ||
          /pdf\.html/.test(document.referrer || "")
        )
      ){
        const y = parseInt(savedScroll, 10) || 0;
        const jump = () => window.scrollTo({
          top: y,
          behavior: "instant"
        });

        // Re-open the paper you had tapped (same as tapping it again).
        if(savedOpenKey){
          const star = Array.from(
            document.querySelectorAll("[data-favorite-key]")
          ).find(s => s.dataset.favoriteKey === savedOpenKey);

          const card = star?.closest(".paper-card");

          if(card){
            jump();
            card.click();
          }
        }

        requestAnimationFrame(() => requestAnimationFrame(jump));
        setTimeout(jump, 350);
        window.addEventListener("load", jump, { once: true });
      }
    }catch(err){}

  }catch(error){

    console.error(
      "Timeline error:",
      error
    );

    timeline.innerHTML =
      '<div class="status">Unable to load descriptions.json. Check that timeline.html and descriptions.json are in the same directory.</div>';
  }
}


load();


window.addEventListener(
  "resize",
  () => {

    if(
      papers.length &&
      window.innerWidth > 900
    ){

      render();

    }

  }
);

</script>
