<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Lanthano Research — Timeline</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;
}
main{max-width:1200px;margin:auto;padding:45px 20px 80px}
h1{text-align:center;margin:0 0 10px;font-size:clamp(2rem,5vw,3.2rem)}
.subtitle{text-align:center;color:#999;max-width:760px;margin:0 auto 30px;line-height:1.6}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:25px 0 35px}
.controls button{
  padding:9px 14px;border:1px solid #333;border-radius:999px;
  background:#1d1d1d;color:#bbb;cursor:pointer;font-size:.9rem
}
.controls button:hover,.controls button.active{background:#2a2a2a;color:#fff;border-color:#666}
.timeline-wrap{position:relative}
.axis-labels{display:flex;justify-content:space-between;color:#777;font-size:.8rem;margin:0 4% 8px}
.timeline{
  position:relative;min-height:760px;margin:0 2%;
  border-top:1px solid #353535;
  background:
    linear-gradient(to bottom, transparent 0, transparent 100%);
}
.year{
  position:absolute;top:-29px;transform:translateX(-50%);
  color:#777;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  white-space:nowrap;z-index:1
}
.year:after{
  content:"";position:absolute;top:29px;left:50%;width:1px;height:1000px;
  background:linear-gradient(to bottom,#292929,rgba(41,41,41,.15));
  z-index:0
}
.paper{
  position:absolute;width:206px;transform:translateX(-50%);
  z-index:2;
}
.connector{
  position:absolute;left:50%;bottom:100%;width:1px;height:16px;
  transform:translateX(-50%);
  background:linear-gradient(to top,var(--paper-color),transparent);
  opacity:.65;
}
.dot{
  position:absolute;left:50%;top:-9px;width:14px;height:14px;
  transform:translateX(-50%);border-radius:50%;
  background:#111;border:3px solid var(--paper-color);
  box-shadow:0 0 0 3px #111,0 0 0 4px rgba(255,255,255,.05);
  z-index:4;
}
.paper-card{
  position:relative;background:linear-gradient(145deg,#202020,#1a1a1a);
  border:1px solid #353535;border-left:3px solid var(--paper-color);
  border-radius:10px;padding:13px 14px;cursor:pointer;
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
  min-height:92px;
}
.paper-card:hover,.paper-card:focus-within{
  background:#252525;transform:translateY(-3px);
  border-color:#4a4a4a;
}
.paper-title{font-weight:700;line-height:1.28;margin:6px 0 8px;color:#f5f5f5;font-size:.98rem}

.paper-date{color:var(--paper-color);font-size:.75rem;font-weight:bold}
.paper-category{color:#888;font-size:.7rem;line-height:1.4}
.description-label{
  color:#888;text-transform:uppercase;letter-spacing:.08em;font-size:.64rem;font-weight:700;margin-bottom:7px;
}
.paper-link{
  display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding:9px 11px;border-radius:7px;
  background:#242424;border:1px solid #3c3c3c;color:#fff;text-decoration:none;font-size:.76rem;font-weight:700;
  transition:background .15s,border-color .15s,transform .15s;
}
.paper-link:hover,.paper-link:focus{background:#303030;border-color:var(--paper-color);transform:translateX(1px);outline:none}
.paper-link span{color:var(--paper-color);font-size:1rem}
.paper-description{
  position:absolute;left:50%;bottom:calc(100% + 18px);width:310px;
  transform:translateX(-50%) translateY(6px);
  padding:15px 16px;background:#151515;border:1px solid #444;
  border-left:3px solid var(--paper-color);border-radius:10px;
  color:#ccc;font-size:.8rem;line-height:1.55;
  opacity:0;visibility:hidden;pointer-events:none;z-index:100;
  box-shadow:0 12px 30px rgba(0,0,0,.65);
  transition:.15s ease;
}
.paper:hover{z-index:1000}
.paper:hover .paper-description,.paper:focus-within .paper-description{
  opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)
}
.stats{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  margin:0 0 30px
}
.stat{
  min-width:100px;text-align:center;background:#181818;
  border:1px solid #2b2b2b;border-radius:10px;padding:12px 18px
}
.stat-number{display:block;font-size:1.35rem;font-weight:bold}
.stat-label{display:block;color:#888;font-size:.72rem;margin-top:3px;text-transform:uppercase}
.status{text-align:center;color:#888;padding:40px}
.legend{
  max-width:900px;margin:25px auto 0;display:flex;justify-content:center;
  gap:10px;flex-wrap:wrap;color:#aaa;font-size:.75rem
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
@media(max-width:900px){
  .timeline{border-top:0;border-left:1px solid #333;margin:0 0 0 20px;min-height:0;padding:10px 0}
  .axis-labels,.year{display:none}
  .paper,.paper:nth-child(n){
    position:relative;left:auto!important;top:auto!important;
    transform:none;width:auto;margin:0 0 18px 30px;
  }
  .connector{display:none}
  .dot{left:-38px;top:23px}
  .paper-description{
    position:static;width:auto;margin-top:10px;
    transform:none;opacity:1;visibility:visible;
    box-shadow:none;display:block
  }
  .paper-link{margin-top:12px}
  .paper-card:hover,.paper-card:focus-within{transform:none}
  main{padding:30px 14px 60px}
}
</style>
</head>
<body>
<main>
<h1>Research Timeline</h1>
<p class="subtitle">
A chronologically scaled timeline of the research archive. Hover over a paper to read its description.
</p>

<div class="stats" id="stats">
  <div class="stat"><span class="stat-number">—</span><span class="stat-label">Papers</span></div>
  <div class="stat"><span class="stat-number">—</span><span class="stat-label">First</span></div>
  <div class="stat"><span class="stat-number">—</span><span class="stat-label">Latest</span></div>
</div>

<div class="controls" id="controls"></div>

<div class="timeline-wrap">
  <div class="axis-labels" id="axisLabels"></div>
  <div class="timeline" id="timeline">
    <div class="status">Loading research timeline...</div>
  </div>
</div>

<div class="legend" id="legend"></div>
</main>

<script>
const DATA_FILE = "descriptions.json";
const timeline = document.getElementById("timeline");
const controls = document.getElementById("controls");
const legend = document.getElementById("legend");
const stats = document.getElementById("stats");
const axisLabels = document.getElementById("axisLabels");

let papers = [];
let activeFilter = "all";

const categoryColors = {
  biblical: "#b58cff",
  historical: "#d7a85b",
  scientific: "#55c7a0",
  medical: "#e77b91",
  political: "#d66a6a",
  astronomy: "#6fa8ff",
  technology: "#58b6d9",
  philosophy: "#c48bd8",
  geographic: "#78b85a",
  economic: "#d9b44a"
};

function categoryLabel(category){
  return String(category || "")
    .charAt(0).toUpperCase() + String(category || "").slice(1);
}

function colorForCategory(category){
  const key = String(category || "").toLowerCase();
  if(categoryColors[key]) return categoryColors[key];

  // Stable fallback color for categories not explicitly mapped.
  let hash = 0;
  for(const c of key) hash = ((hash << 5) - hash) + c.charCodeAt(0) | 0;
  return `hsl(${Math.abs(hash) % 360} 58% 62%)`;
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function dateValue(p){
  return new Date(`${p.updated}T00:00:00`);
}

function formatDate(p){
  return dateValue(p).toLocaleDateString(undefined,{
    year:"numeric",month:"short",day:"numeric"
  });
}

function positionFor(date,min,max){
  const value = dateValue({updated:date}).getTime();
  const a = min.getTime(), b = max.getTime();
  return 3 + ((value-a)/(b-a || 1))*94;
}

function buildLanes(items){
  /*
    Collision-safe placement uses the actual timeline width and card width,
    rather than a percentage approximation. Each card is treated as an
    interval on the horizontal axis; it is placed in the first lane whose
    previous card does not intersect it.
  */
  const cardWidth = window.innerWidth <= 900 ? 0 : 206;
  const gap = 18;
  const timelineWidth = Math.max(timeline.clientWidth, 1);
  const lanes = [];

  for(const paper of items){
    const x = (paper._x / 100) * timelineWidth;
    let lane = 0;

    while(lanes[lane] !== undefined){
      const previousRight = lanes[lane] + cardWidth / 2;
      const currentLeft = x - cardWidth / 2;

      if(currentLeft >= previousRight + gap) break;
      lane++;
    }

    lanes[lane] = x;
    paper._lane = lane;
  }

  return lanes.length;
}

function render(){
  const visible = papers
    .filter(p=>activeFilter==="all" || p.category.includes(activeFilter))
    .sort((a,b)=>dateValue(a)-dateValue(b) || a.title.localeCompare(b.title));

  if(!visible.length){
    timeline.innerHTML='<div class="status">No papers in this category.</div>';
    return;
  }

  const min = dateValue(visible[0]);
  const max = dateValue(visible[visible.length-1]);

  visible.forEach(p=>p._x=positionFor(p.updated,min,max));

  // Let the browser calculate the timeline width before assigning lanes.
  timeline.style.minHeight = "760px";
  const laneCount = buildLanes(visible);

  const laneHeight = 152;
  const topPadding = 54;
  timeline.style.minHeight = Math.max(760, topPadding + laneCount * laneHeight + 70) + "px";
  timeline.innerHTML="";

  // Year guide lines.
  const years=[...new Set(visible.map(p=>p.updated.slice(0,4)))];
  years.forEach(year=>{
    const yearDate = `${year}-01-01`;
    const y = positionFor(yearDate,min,max);
    const guide=document.createElement("div");
    guide.className="year";
    guide.style.left=y+"%";
    guide.textContent=year;
    timeline.appendChild(guide);
  });

  visible.forEach(p=>{
    const el=document.createElement("article");
    el.className="paper";
    el.style.left=p._x+"%";
    el.style.top=(topPadding + p._lane*laneHeight)+"px";
    el.style.setProperty("--paper-color",colorForCategory(p.category[0]));

    const cats=p.category.map(categoryLabel).join(" • ");

    el.innerHTML=`
      <div class="connector" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
      <div class="paper-card" tabindex="0">
        <div class="paper-date">${escapeHtml(formatDate(p))}</div>
        <div class="paper-title">${escapeHtml(p.title)}</div>
        <div class="paper-category">${escapeHtml(cats)}</div>
        <div class="paper-description">
          <div class="description-label">About this paper</div>
          <div>${escapeHtml(p.description || "No description available.")}</div>
          ${p.url ? `<a class="paper-link" href="${escapeHtml(p.url)}" data-paper-title="${escapeHtml(p.title)}">Open Paper <span>→</span></a>` : ""}
        </div>
      </div>
    `;
    timeline.appendChild(el);
  });

  axisLabels.innerHTML=`
    <span>${min.toLocaleDateString(undefined,{year:"numeric",month:"short"})}</span>
    <span>${max.toLocaleDateString(undefined,{year:"numeric",month:"short"})}</span>
  `;
}

document.addEventListener("click", e=>{
  const link=e.target.closest(".paper-link");
  if(!link) return;
  e.preventDefault();
  const paperUrl=link.getAttribute("href");
  const paperTitle=link.dataset.paperTitle || "PDF";
  const viewerUrl="pdf.html?file="+encodeURIComponent(paperUrl)+"&paper="+encodeURIComponent(paperTitle)+"&return="+encodeURIComponent("timeline.html");
  window.location.href=viewerUrl;
});

function buildControls(){
  const categories=[...new Set(papers.flatMap(p=>p.category))].sort();
  controls.innerHTML =
    `<button class="active" data-filter="all">All</button>` +
    categories.map(c=>`<button data-filter="${escapeHtml(c)}">${escapeHtml(categoryLabel(c))}</button>`).join("");

  controls.addEventListener("click",e=>{
    if(!e.target.matches("button")) return;
    activeFilter=e.target.dataset.filter;
    document.querySelectorAll("#controls button").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    render();
  });

  legend.innerHTML=categories.map(c=>`
    <span><i style="background:${colorForCategory(c)}"></i>${escapeHtml(categoryLabel(c))}</span>
  `).join("");
}

async function load(){
  try{
    // descriptions.json is in the website's main tree, alongside this page.
    const response=await fetch(DATA_FILE,{cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();

    papers=Object.values(data)
      .filter(p=>p && p.title && p.updated && Array.isArray(p.category))
      .map(p=>({
        title:p.title,
        updated:p.updated,
        category:p.category,
        description:p.description || "",
        url:p.url || ""
      }));

    if(!papers.length) throw new Error("No timeline records found.");

    const dates=papers.map(dateValue).sort((a,b)=>a-b);
    stats.innerHTML=`
      <div class="stat"><span class="stat-number">${papers.length}</span><span class="stat-label">Papers</span></div>
      <div class="stat"><span class="stat-number">${dates[0].getFullYear()}</span><span class="stat-label">First</span></div>
      <div class="stat"><span class="stat-number">${dates.at(-1).getFullYear()}</span><span class="stat-label">Latest</span></div>
    `;

    buildControls();
    render();
  }catch(error){
    console.error("Timeline error:",error);
    timeline.innerHTML='<div class="status">Unable to load descriptions.json.</div>';
  }
}

load();

window.addEventListener("resize",()=>{
  if(papers.length && window.innerWidth > 900) render();
});
</script>
</body>
</html>
