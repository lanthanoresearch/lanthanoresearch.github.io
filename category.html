/* Picker row: label on the left, current value + chevron on the

/* Bare "mere popup" - no header/back button, just the option

<script>
const params =
    new URLSearchParams(window.location.search);

const currentCategory =
    params.get("category");

    let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;

    
function loadFavorites(){

    favoritePapers =
        JSON.parse(
            localStorage.getItem(
                "favoritePapers"
            ) || "[]"
        );

}

function isFavorite(key){

    return favoritePapers.includes(key);

}

// ---- Settings (view mode + default image state) ----

let viewMode =
    localStorage.getItem("viewMode") || "detailed";

let imagesDefaultOpen =
    localStorage.getItem("imagesDefaultOpen") === "true";

// Assigned once papers finish loading; declared here (outer scope)
// so the settings controls below can call it immediately on change.
let renderPapers = function(){};

let readingLevel =
    localStorage.getItem("readingLevel") || "average";

const sortLabels = {
    az: "A-Z",
    za: "Z-A",
    newest: "Newest",
    oldest: "Oldest",
    mostimages: "Most Images",
    leastimages: "Least Images",
    mostreadtime: "Longest Read",
    leastreadtime: "Shortest Read"
};

// Each group pairs an ascending and descending sort value. Clicking
// a group's button in the sort panel toggles between the two instead
// of needing two separate list entries.
const SORT_GROUPS = {
    title:    { label: "Title",        asc: "az",           desc: "za" },
    date:     { label: "Date",         asc: "oldest",        desc: "newest" },
    images:   { label: "Images",       asc: "leastimages",   desc: "mostimages" },
    readtime: { label: "Reading Time", asc: "leastreadtime", desc: "mostreadtime" }
};

function getActiveSortGroup(){

    for(const [key, group] of Object.entries(SORT_GROUPS)){
        if(sortType === group.asc) return { key, direction: "asc" };
        if(sortType === group.desc) return { key, direction: "desc" };
    }

    return { key: null, direction: null };

}

let sortType =
    localStorage.getItem("paperSort") || "az";

// Re-runs a render while keeping the current scroll position and
// which "Supporting Images" panels were open (e.g. after starring
// a paper), instead of jumping back to the top with everything closed.
function withPreservedState(fn){

    const openKeys = Array.from(
        document.querySelectorAll(".image-details")
    ).filter(details => details.open)
     .map(details => details.dataset.paper);

    const scrollY = window.scrollY;

    fn();

    document.querySelectorAll(".image-details").forEach(details => {
        details.open = openKeys.includes(details.dataset.paper);
    });

    window.scrollTo(0, scrollY);

}

// Picker rows in the Settings panel (View, Reading Speed) - each
// backed by a small popup of checkmarked options, exactly like
// video.html's Speed picker. One shared popup (#optionPopup) is
// reused for whichever row was tapped, rather than a separate
// popup per row.
const PICKER_GROUPS = {
    viewMode: {
        options: [
            { value:"compact", label:"Compact" },
            { value:"comfy", label:"Comfy" },
            { value:"detailed", label:"Detailed" }
        ],
        get(){ return viewMode; },
        set(value){
            viewMode = value;
            localStorage.setItem("viewMode", viewMode);
        }
    },
    readingLevel: {
        options: [
            { value:"slow", label:"Slow" },
            { value:"average", label:"Average" },
            { value:"fast", label:"Fast" }
        ],
        get(){ return readingLevel; },
        set(value){
            readingLevel = value;
            localStorage.setItem("readingLevel", readingLevel);
        }
    }
};

function pickerValueLabel(key){

    const group = PICKER_GROUPS[key];
    const current = group.options.find(opt => opt.value === group.get());

    return current ? current.label : "";

}

function applySettingsUI(){

// Anchors the popup to the picker row that opened it - preferring
// to open just below the row (since the Settings panel itself
// drops down from the gear button), but flipping upward if there
// genuinely isn't room below, then clamping on-screen as a final
// safety net. Mirrors video.html's positionVideoSpeedPopup.
function positionOptionPopup(rowEl){

    const rect =
        rowEl.getBoundingClientRect();

    const popupWidth =
        Math.min(190, window.innerWidth - 24);

    const margin =
        12;

    let left =
        rect.left + (rect.width / 2) - (popupWidth / 2);

    left =
        Math.max(margin, Math.min(left, window.innerWidth - popupWidth - margin));

    optionPopup.style.left =
        left + "px";

    const spaceBelow =
        window.innerHeight - rect.bottom - 8;

    const spaceAbove =
        rect.top - 8;

    if(spaceBelow >= 160 || spaceBelow >= spaceAbove){

        optionPopup.style.top = (rect.bottom + 8) + "px";
        optionPopup.style.bottom = "auto";

    }else{

        optionPopup.style.bottom = (window.innerHeight - rect.top + 8) + "px";
        optionPopup.style.top = "auto";

    }

}

// Pages to count toward reading time: everything before the Sources
// section. Computed ahead of time from each PDF's extracted text and
// served as content-pages.json, keyed by the paper's PDF filename
// (paper.url) since that's stable regardless of the descriptions.json
// key. A per-paper `contentPages` field in descriptions.json can
// override it manually; if neither is available, this falls back to
// the paper's total page count from page-counts.json.
function getContentPageCount(key, paper){

    if(typeof paper.contentPages === "number"){
        return paper.contentPages;
    }

    if(
        paper.url &&
        typeof contentPageCounts[paper.url] === "number"
    ){
        return contentPageCounts[paper.url];
    }

    return Number(pageCounts[key]) || 0;

}

// Reading time is estimated from an approximate word count rather
// than a flat "minutes per page" guess, so it scales the same way
// real reading speed does (word-by-word) instead of just being an
// arbitrary per-page number.
//
// WORDS_PER_PAGE: a standard estimate for a single-spaced,
// 12-point page of body text with normal margins - the same figure
// commonly used by word-count-to-page conversions. Research PDFs
// vary (dense two-column layouts run higher, pages heavy with
// figures/tables run lower), but this is a reasonable average
// across a typical paper's content pages.
const WORDS_PER_PAGE = 500;

// READING_WPM: silent reading speed in words per minute. "Average"
// reflects the commonly cited adult silent-reading rate for
// nonfiction/technical text (~200 wpm); "slow" reflects careful,
// close reading of dense academic material; "fast" reflects a
// fluent reader moving efficiently through familiar material while
// still reading every word (not skimming).
const READING_WPM = {
    slow: 150,
    average: 200,
    fast: 300
};

// Formats a minute count as "18 min", "59 min", "1 hr 30 min",
// or "2 hrs 1 min" as appropriate.
function formatReadTime(totalMinutes){

    if(totalMinutes < 60){
        return totalMinutes + " min";
    }

    const hrs = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;

    const hrLabel = hrs + (hrs === 1 ? " hr" : " hrs");

    return mins > 0 ? `${hrLabel} ${mins} min` : hrLabel;

}

function getReadMinutes(key, paper){

    const pages = getContentPageCount(key, paper);

    if(pages <= 0){
        return 0;
    }

    const wordsPerMinute =
        READING_WPM[readingLevel] ||
        READING_WPM.average;

    const estimatedWords =
        pages * WORDS_PER_PAGE;

    return Math.max(1, Math.round(estimatedWords / wordsPerMinute));

}

function buildReadTimeHtml(key, paper){

    const minutes = getReadMinutes(key, paper);

    if(!minutes) return "";

    return `<p class="read-time-line">Read time: ${formatReadTime(minutes)}</p>`;

}
