<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Research</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

    
html{
    scroll-behavior:smooth;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

.top-button:hover{
    opacity:.6;
    background:#2a2a2a;
}
    .favorite-star{

    position:absolute;

    top:10px;
    right:14px;

    font-size:2rem;
    line-height:1;

    color:#666;

    cursor:pointer;

    user-select:none;

    visibility:hidden;
    pointer-events:none;

    transition:.2s;
}

.favorite-star.ready{

    visibility:visible;
    pointer-events:auto;

}

.favorite-star.active{

    color:#FFD700;
    text-shadow:0 0 10px rgba(255,215,0,.55);

}

.favorite-star:hover{

    transform:scale(1.15);

}




    
section{
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}
.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:-20px;
    margin-bottom:35px;
    gap:10px;
    flex-wrap:wrap;
}

#paperCount{
    margin:0;
    color:#777;
}

.info-bar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.top-settings{
    position:fixed;
    top:28px;
    right:20px;
    z-index:1600;
}

#sortSelect{
    background:#222;
    color:#eee;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    font-size:.95em;
    cursor:pointer;
}

#sortSelect:hover{
    background:#262626;
}

#sortSelect:focus{
    outline:none;
    border-color:#555;
}

.settings-btn{
    background:#222;
    color:#eee;
    border:none;
    border-radius:50%;
    width:44px;
    height:44px;
    padding:0;
    font-size:1.15em;
    cursor:pointer;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.settings-btn:hover{
    background:#262626;
}

.settings-panel{
    display:none;
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    background:#1d1d1d;
    border:1px solid #2c2c2c;
    border-radius:10px;
    padding:18px;
    width:230px;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    z-index:1600;
    text-align:left;
}

.settings-panel.open{
    display:block;
}

.settings-panel h3{
    margin:0 0 12px 0;
    font-size:.95em;
    color:#ccc;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.settings-group{
    margin-bottom:16px;
}

.settings-group:last-child{
    margin-bottom:0;
}

.settings-option{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 0;
    font-size:.92em;
    color:#ddd;
    cursor:pointer;
}

.settings-option input{
    cursor:pointer;
}

.settings-divider{
    border:none;
    border-top:1px solid #2c2c2c;
    margin:14px 0;
}

    
.back{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}
.card{
    position:relative;

    background:#1d1d1d;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
}

.card-cover{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:6px;
    background:#141414;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
}

.card-body{
    min-width:0;
}

.card-clear{
    clear:both;
}


    
    .paper-badge{
    position:absolute;
    top:14px;
    right:52px;
    color:#fff;
    font-size:.72em;
    font-weight:bold;
    padding:5px 10px;
    border-radius:999px;
    letter-spacing:.5px;
    text-transform:uppercase;
}

.paper-badge.featured{
    background:#2f7cff;
}

.paper-badge.newest{
    background:#00b050;
}

.paper-badge.newest.with-featured{
    right:150px;
}


    
.card-description{
    color:#aaa;
    font-size:0.9em;
    margin-top:10px;
    line-height:1.4;
}

.card-date{
    color:#777;
    font-size:0.8em;
    margin-top:10px;
    margin-bottom:1px;
}

    .card-pages{
    color:#777;
    font-size:0.8em;
    margin-top:1px;
}
    
.button{
    display:inline-block;
    background:#333;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:6px;
    margin-right:10px;
    margin-top:10px;
}

.button:hover{
    background:#444;
}

.read-btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    margin-right:0;
    cursor:pointer;
}

.card-cover-link{
    display:block;
    float:right;
    width:clamp(80px, 28vw, 130px);
    aspect-ratio:3/4;
    margin:4px 0 6px 14px;
    cursor:pointer;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
}

details{
    margin-top:20px;
}

summary{
    cursor:pointer;
    font-size:1em;
    font-weight:normal;
    font-style:italic;
    font-family:Arial,sans-serif;
    color:#888;
    padding:10px 12px;
    background:#1a1a1a;
    border-radius:6px;
}

summary:hover{
    color:#999;
    background:#1a1a1a;
}

/* ---- Compact view ---- */

.view-compact .card{
    padding:10px 14px 12px 14px;
    padding-top:34px;
}

.compact-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.compact-title{
    margin:0;
    font-size:1.05em;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
    flex:1;
}

.compact-read-btn{
    flex-shrink:0;
    margin:0;
    padding:6px 10px;
    font-size:0.8em;
}

/* ---- Comfy view ---- */

.view-comfy .card{
    padding:12px 16px 14px 16px;
    padding-top:34px;
}

.view-comfy .card h2{
    font-size:0.98em;
    margin:0 0 2px 0;
}

.view-comfy .card-description{
    font-size:0.78em;
    margin-top:5px;
    line-height:1.32;
}

.view-comfy .card-cover-link{
    width:clamp(50px, 18vw, 78px);
    margin:2px 0 4px 10px;
}

.view-comfy .button{
    padding:6px 10px;
    font-size:0.8em;
}

/* ---- Shared: keep the favorite star & badges clear of the
   compact/comfy header line instead of overlapping it ---- */

.view-compact .favorite-star,
.view-comfy .favorite-star{
    font-size:1.35rem;
    top:7px;
    right:10px;
}

.view-compact .paper-badge,
.view-comfy .paper-badge{
    font-size:0.6em;
    padding:4px 8px;
    top:9px;
    right:36px;
}

.view-compact .paper-badge.newest.with-featured,
.view-comfy .paper-badge.newest.with-featured{
    right:104px;
}

.view-compact details,
.view-comfy details{
    margin-top:10px;
}

.view-compact summary,
.view-comfy summary{
    font-size:0.82em;
    padding:7px 10px;
}

/* Comfy: one extra column, smaller images */
.view-comfy .gallery{
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-top:10px;
}

/* Compact: even more columns, even smaller images */
.view-compact .gallery{
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin-top:10px;
}
</style>
</head>


<body>

<section>

<div class="top-settings">

<button class="settings-btn" id="settingsButton" type="button" aria-label="Settings">⚙</button>

<div class="settings-panel" id="settingsPanel">

    <div class="settings-group">
        <h3>Viewing Option</h3>

        <label class="settings-option">
            <input type="radio" name="viewMode" value="compact">
            Compact
        </label>

        <label class="settings-option">
            <input type="radio" name="viewMode" value="comfy">
            Comfy
        </label>

        <label class="settings-option">
            <input type="radio" name="viewMode" value="detailed">
            Detailed
        </label>
    </div>

    <hr class="settings-divider">

    <div class="settings-group">
        <h3>Supporting Images</h3>

        <label class="settings-option">
            <input type="checkbox" id="imagesDefaultOpen">
            Show supporting images by default
        </label>
    </div>

</div>

</div>

<a class="back" href="index.html">◀ Home</a>

    <h1 id="pageTitle">Loading...</h1>

<div class="info-bar">

<p id="paperCount"></p>

<div class="info-bar-right">

<select id="sortSelect">

<option value="az">A-Z</option>
<option value="za">Z-A</option>

<option value="newest">Newest</option>
<option value="oldest">Oldest</option>

<option value="mostimages">Most Images</option>
<option value="leastimages">Least Images</option>

</select>

</div>

</div>



<div id="research-container"></div>

</section>
<a href="#" class="top-button" id="topButton">
    <span style="position:relative; top:-3px;">▲</span>
</a>
<script>
const params =
    new URLSearchParams(window.location.search);

const currentCategory =
    params.get("category");

    let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;

    
function loadFavorites(){

    favoritePapers =
        JSON.parse(
            localStorage.getItem(
                "favoritePapers"
            ) || "[]"
        );

}

function isFavorite(key){

    return favoritePapers.includes(key);

}

// ---- Settings (view mode + default image state) ----

let viewMode =
    localStorage.getItem("viewMode") || "detailed";

let imagesDefaultOpen =
    localStorage.getItem("imagesDefaultOpen") === "true";

// Assigned once papers finish loading; declared here (outer scope)
// so the settings controls below can call it immediately on change.
let renderPapers = function(){};

function applySettingsUI(){

    document
        .querySelectorAll('input[name="viewMode"]')
        .forEach(input => {
            input.checked = input.value === viewMode;
        });

    document.getElementById("imagesDefaultOpen").checked =
        imagesDefaultOpen;

}

const settingsButton =
    document.getElementById("settingsButton");
const settingsPanel =
    document.getElementById("settingsPanel");

settingsButton.addEventListener("click", (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle("open");
});

document.addEventListener("click", (e) => {
    if(
        settingsPanel.classList.contains("open") &&
        !settingsPanel.contains(e.target) &&
        e.target !== settingsButton
    ){
        settingsPanel.classList.remove("open");
    }
});

document
    .querySelectorAll('input[name="viewMode"]')
    .forEach(input => {
        input.addEventListener("change", () => {
            if(input.checked){
                viewMode = input.value;
                localStorage.setItem("viewMode", viewMode);
                renderPapers();
            }
        });
    });

document
    .getElementById("imagesDefaultOpen")
    .addEventListener("change", (e) => {
        imagesDefaultOpen = e.target.checked;
        localStorage.setItem(
            "imagesDefaultOpen",
            imagesDefaultOpen
        );
        renderPapers();
    });

applySettingsUI();



    const scrollKey =
    "categoryScroll-" + currentCategory;
    const returning =
    sessionStorage.getItem("returnFromPage") === "yes";
if(!returning){

    sessionStorage.removeItem(scrollKey);

    sessionStorage.removeItem(
        "openDetails-" + currentCategory
    );

}
    

let pageTitle = "";

if(currentCategory === "all"){

    pageTitle = "All Research";

}else if(currentCategory === "favorites"){

    pageTitle = "Favorites";

}else{

    pageTitle =
        currentCategory.charAt(0).toUpperCase() +
        currentCategory.slice(1);

}

document.querySelector("h1").textContent = pageTitle;
document.title = `Lanthano Research - ${pageTitle}`;


    
Promise.all([
    fetch("descriptions.json").then(response => response.json()),
    fetch("page-counts.json").then(response => response.json())
])
.then(([data, pageCounts]) => {


    
    const container =
        document.getElementById("research-container");

    let papers =
    Object.entries(data);

    papers.sort((a,b)=>
        a[1].title.localeCompare(b[1].title)
    );

    const newestEntry = [...papers].sort(
    (a, b) =>
        new Date(b[1].updated) - new Date(a[1].updated)
)[0];

newestKey = newestEntry[0];

const newestDate = new Date(newestEntry[1].updated);

const today = new Date();

const oneYearAgo = new Date(today);
oneYearAgo.setFullYear(today.getFullYear() - 1);

showNewestBadge = newestDate >= oneYearAgo;

    
    function toggleFavorite(key){

    if(isFavorite(key)){

        favoritePapers =
            favoritePapers.filter(
                item => item !== key
            );

    }else{

        favoritePapers.push(key);

    }

    localStorage.setItem(
        "favoritePapers",
        JSON.stringify(favoritePapers)
    );

    renderPapers();

}

window.toggleFavorite = toggleFavorite;
    function getVisibleImageCount(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    ).length;
}

    
function getPaperBadge(key, paper){

    const isNewest =
        showNewestBadge &&
        key === newestKey;

    let html = "";

    if (isNewest){

        html += `
        <div class="paper-badge newest${paper.featured ? " with-featured" : ""}">
            New
        </div>`;
    }

    if (paper.featured){

        html += `
        <div class="paper-badge featured">
            Featured
        </div>`;
    }

    return html;
}

// Builds the gallery markup for a paper (used across all view modes)
function buildGalleryHtml(key, paper){

    const visibleImages = (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );

    if(!visibleImages.length) return "";

    const openAttr = imagesDefaultOpen ? " open" : "";

    return `
        <details class="image-details" data-paper="${key}"${openAttr}>
            <summary>Supporting Images (${visibleImages.length})</summary>

            <div class="gallery">

             ${visibleImages.map(image => `
<a
    href="image.html?image=${encodeURIComponent(image)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}"
    class="gallery-image"
    data-scroll-key="${scrollKey}"
>
    <img
        src="${image}"
        loading="lazy">
</a>
`).join("")}

            </div>
        </details>
    `;
}

    
renderPapers = function(){
loadFavorites();
container.className = "view-" + viewMode;
container.innerHTML = "";

let filteredPapers = papers.filter(([key,paper]) =>

    currentCategory === "all"

    ||

    (

        currentCategory === "favorites"

        &&

        favoritePapers.includes(key)

    )

    ||

    (

        paper.category &&
        paper.category.includes(currentCategory)

    )

);

const sortType =
    document.getElementById("sortSelect").value;

if(sortType === "az"){

    filteredPapers.sort((a,b)=>
        a[1].title.localeCompare(b[1].title)
    );

}
else if(sortType === "za"){

    filteredPapers.sort((a,b)=>
        b[1].title.localeCompare(a[1].title)
    );

}
else if(sortType === "newest"){

    filteredPapers.sort((a,b)=>
        b[1].updated.localeCompare(a[1].updated)
    );

}
else if(sortType === "oldest"){

    filteredPapers.sort((a,b)=>
        a[1].updated.localeCompare(b[1].updated)
    );

}
else if(sortType === "mostimages"){

    filteredPapers.sort((a,b)=>
        getVisibleImageCount(b[1]) -
        getVisibleImageCount(a[1])
    );

}
else if(sortType === "leastimages"){

    filteredPapers.sort((a,b)=>
        getVisibleImageCount(a[1]) -
        getVisibleImageCount(b[1])
    );

}

document.getElementById("paperCount").textContent =
    filteredPapers.length +
    (filteredPapers.length === 1 ? " Paper" : " Papers");

    if(
    currentCategory === "favorites"
    &&
    filteredPapers.length === 0
){

    container.innerHTML = `

    <div style="
        text-align:center;
        padding:70px 20px;
    ">

        <h2>No Favorite Papers</h2>

        <p style="color:#888;">
            Tap the ☆ on any paper to save it here.
        </p>

    </div>

    `;

    return;

}

filteredPapers.forEach(([key,paper]) => {

        const galleryHtml = buildGalleryHtml(key, paper);

        const starHtml = `
<span
class="favorite-star
${isFavorite(key) ? " active" : ""}"
onclick="
event.stopPropagation();
toggleFavorite('${key}');
">
${isFavorite(key) ? "★" : "☆"}
</span>`;

        const coverHtml = `
                <a
                    class="card-cover-link pdf-link"
                    href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
                <img
                    class="card-cover"
                    src="covers/${key}.png"
                    alt="${paper.title} cover"
                    loading="lazy"
                    onerror="this.closest('a').remove()">
                </a>`;

        const descHtml = `
                <p class="card-description">
                    ${paper.description}
                </p>`;

        const dateHtml = `
                <p class="card-date">
    Created: ${parseInt(paper.updated.split("-")[1])}-${
parseInt(paper.updated.split("-")[2])}-${
paper.updated.split("-")[0]}
</p>`;

        const pagesHtml = `
<p class="card-pages">
    ${Number(pageCounts[key]) || 0} ${(Number(pageCounts[key]) || 0) === 1 ? "page" : "pages"}
</p>`;

        const readBtnHtml = `
                  <a class="button pdf-link read-btn"
   href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
   Read Research
</a>`;

        const readBtnInlineHtml = `
<a class="button pdf-link compact-read-btn"
   href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
   Read Research
</a>`;

        const titleHtml = `<h2>${paper.title}</h2>`;
        const titleCompactHtml = `<h2 class="compact-title">${paper.title}</h2>`;

        // Header markup (title + whatever the view mode includes),
        // always visible regardless of the warning gate.
        // Compact handles its title separately (merged on the same
        // line as the Read button), so headerHtml stays empty there.
        let headerHtml = "";

        if(viewMode === "comfy"){

            headerHtml = titleHtml + coverHtml + descHtml + `<div class="card-clear"></div>`;

        }else if(viewMode === "detailed"){

            headerHtml = titleHtml + coverHtml + descHtml + dateHtml + pagesHtml + `<div class="card-clear"></div>`;

        }

        let cardHtml = "";
const warningAccepted =
    sessionStorage.getItem(
        "warning-" + key
    ) === "accepted";
       

if(
    paper.warning &&
    !warningAccepted
){
            cardHtml = `
            <div class="card">
            ${starHtml}
${getPaperBadge(key, paper)}

                <div class="card-body">

                ${viewMode === "compact" ? titleCompactHtml : headerHtml}

                   <div id="warning-${key}">

                   <div style="
    text-align:center;
    padding:15px 10px;
">

    <div style="
        font-size:4.5rem;
        line-height:1;
        margin-bottom:15px;
        filter:drop-shadow(0 0 8px rgba(255,200,0,.35));
    ">
        ⚠️
    </div>

    <p style="
        margin:0 0 20px 0;
        line-height:1.5;
        color:#ddd;
    ">
        This paper and/or its supporting images contain graphic material,
        including depictions of severe injuries, death, or war casualties.
    </p>

    <a class="button"
       href="#"
       onclick="showWarningContent('${key}'); return false;">
       I Understand, Show Content
    </a>

</div>

                </div>

                <div id="content-${key}"
     style="display:none;">

                  ${readBtnHtml}

                    ${galleryHtml}

                </div>

                </div>

            </div>
            `;

        }else if(viewMode === "compact"){

            cardHtml = `
            <div class="card">
            ${starHtml}
${getPaperBadge(key, paper)}

                <div class="card-body">

                <div class="compact-row">
                ${titleCompactHtml}
                ${readBtnInlineHtml}
                </div>

                ${galleryHtml}

                </div>

            </div>
            `;

        }else{

            cardHtml = `
            <div class="card">
            ${starHtml}
${getPaperBadge(key, paper)}

                <div class="card-body">

                ${headerHtml}

              ${readBtnHtml}

                ${galleryHtml}

                </div>

            </div>
            `;

        }

        container.innerHTML += cardHtml;
    

});
   if(returning){

    const openDetails =
        JSON.parse(
            sessionStorage.getItem(
                "openDetails-" + currentCategory
            ) || "[]"
        );

    document
        .querySelectorAll(".image-details")
        .forEach(details=>{

            if(openDetails.includes(details.dataset.paper)){

                details.open = true;

            }

        });

}
    
    
    document.querySelectorAll(".gallery-image").forEach(link=>{

  link.addEventListener("click",()=>{

    saveOpenDetails();

    sessionStorage.setItem(
        scrollKey,
        window.scrollY
    );

    sessionStorage.setItem(
    "returnFromPage",
    "yes"
);

});
});
document.querySelectorAll(".pdf-link").forEach(link=>{

    link.addEventListener("click",()=>{

        saveCategoryState();

    });

});
    document
.querySelectorAll(".favorite-star")
.forEach(star=>{

    star.classList.add("ready");

});
}

    

const sortSelect =
    document.getElementById("sortSelect");

const savedSort =
    localStorage.getItem("paperSort");

if(savedSort){
    sortSelect.value = savedSort;
}

loadFavorites();

renderPapers();



sortSelect.addEventListener("change", () => {

    localStorage.setItem(
        "paperSort",
        sortSelect.value
    );

    renderPapers();

});
    



if(returning){

    

    const savedScroll =
        sessionStorage.getItem(scrollKey);

    if(savedScroll){

        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                window.scrollTo(
                    0,
                    parseInt(savedScroll)
                );
               sessionStorage.removeItem(
    "returnFromPage"
);

            });

        });

    }

}


       
function saveOpenDetails(){

    const open = [];

    document.querySelectorAll(".image-details").forEach(details=>{

        if(details.open){

            open.push(details.dataset.paper);

        }

    });

    sessionStorage.setItem(
        "openDetails-" + currentCategory,
        JSON.stringify(open)
    );

}
    function saveCategoryState(){

    saveOpenDetails();

    sessionStorage.setItem(
        scrollKey,
        window.scrollY
    );

    sessionStorage.setItem(
        "returnFromPage",
        "yes"
    );

}
window.showWarningContent = function(key){

    sessionStorage.setItem(
        "warning-" + key,
        "accepted"
    );

    document.getElementById(
        "warning-" + key
    ).style.display = "none";

    document.getElementById(
        "content-" + key
    ).style.display = "block";

};
    });
    
const topButton = document.getElementById("topButton");

function updateTopButton(){
    if(window.scrollY > 10){
        topButton.style.display = "flex";
    }else{
        topButton.style.display = "none";
    }
}

topButton.addEventListener("click", function(e){
    e.preventDefault();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);
</script>
