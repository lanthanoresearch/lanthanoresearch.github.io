<!DOCTYPE html>

<script>
/* A refresh starts this page fresh, from the top, like a normal new visit.
   Only this page's remembered "where I was" is forgotten - saved settings,
   favorites and other saved data are never touched. (Coming back from a
   paper/image/video/other page still restores your spot; only a reload
   resets it.) */
(function(){
  try{
    var keys = ["returnFromPage"];
    var prefixes = ["categoryScroll-", "openDetails-"];

    function forget(){
      keys.forEach(function(k){ sessionStorage.removeItem(k); });
      Object.keys(sessionStorage).forEach(function(k){
        for(var i = 0; i < prefixes.length; i++){
          if(k.indexOf(prefixes[i]) === 0){ sessionStorage.removeItem(k); break; }
        }
      });
    }

    // Page restored whole from the browser's back/forward cache: it is
    // already exactly as it was, so drop any leftover "restore me" notes.
    window.addEventListener("pageshow", function(e){
      if(e.persisted){ try{ forget(); }catch(err){} }
    });

    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    var isReload = nav ? nav.type === "reload"
      : (performance.navigation && performance.navigation.type === 1);
    if(!isReload) return;

    forget();

    if("scrollRestoration" in history) history.scrollRestoration = "manual";

    var top = function(){ window.scrollTo({top:0, behavior:"instant"}); };
    top();
    window.addEventListener("load", function(){
      top();
      requestAnimationFrame(function(){
        top();
        if("scrollRestoration" in history) history.scrollRestoration = "auto";
      });
    });
  }catch(e){}
})();
</script>
<script>
/* Home / Back links: when the page you came from is the one just before
   this one in the browser's history, step back through the history (the
   page comes back exactly as you left it and the phone's own back button
   stays consistent). Otherwise just open the page. */
(function(){
  function norm(p){ return p.replace(/index\.html$/, ""); }

  window.__goHome = function(){
    var dest = "index.html";
    var canStep = false;
    try{
      if(history.length > 1 && document.referrer){
        var r = new URL(document.referrer), t = new URL(dest, location.href);
        canStep = r.origin === t.origin && norm(r.pathname) === norm(t.pathname);
      }
    }catch(e){}

    if(!canStep){ location.assign(dest); return; }

    var fallback = setTimeout(function(){ location.assign(dest); }, 1200);
    window.addEventListener("pagehide", function(){ clearTimeout(fallback); }, {once:true});
    history.back();
  };

  document.addEventListener("click", function(e){
    if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href="index.html"]') : null;
    if(!a || (a.target && a.target !== "_self")) return;
    e.preventDefault();
    window.__goHome();
  });
})();
</script>

<script id="favMediaJs">
/* Favorite media: one small shared helper (the same copy lives on the
   gallery, category and home pages). Keys look like "i:<image path>" or
   "v:<video file>" and are saved as a list under "favoriteMedia". */
(function(){
  if(window.FavMedia) return;

  var KEY = "favoriteMedia";
  var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  var mem = null, raw = null, set = new Set(), listeners = [];

  function read(){
    var r = null;
    try{ r = localStorage.getItem(KEY); }catch(e){ r = mem; }
    if(r === raw) return set;
    raw = r;
    set = new Set();
    try{
      var a = JSON.parse(r || "[]");
      if(Array.isArray(a)) a.forEach(function(k){ if(typeof k === "string" && k) set.add(k); });
    }catch(e){}
    return set;
  }

  function write(){
    var s = JSON.stringify(Array.from(set));
    mem = s;
    try{ localStorage.setItem(KEY, s); }catch(e){}
    raw = s;
  }

  function key(kind, path){
    return (kind === "video" ? "v:" : "i:") + String(path == null ? "" : path).trim();
  }

  function esc(t){
    return String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function has(k){ return read().has(k); }

  function toggle(k){
    read();
    var on = !set.has(k);
    if(on) set.add(k); else set.delete(k);
    write();
    return on;
  }

  function paint(el){
    var on = has(el.getAttribute("data-fav"));
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    var label = on ? "Remove from favorite media" : "Add to favorite media";
    el.setAttribute("aria-label", label);
    el.setAttribute("title", label);
  }

  function sync(root){
    (root || document).querySelectorAll(".fav-heart").forEach(paint);
  }

  function notify(){
    listeners.slice().forEach(function(fn){ try{ fn(); }catch(e){} });
  }

  function heart(kind, path, extra){
    var k = key(kind, path), on = has(k);
    var label = on ? "Remove from favorite media" : "Add to favorite media";
    return '<span class="fav-heart' + (on ? " active" : "") + (extra ? " " + extra : "") +
      '" role="button" tabindex="0" data-fav="' + esc(k) + '" aria-pressed="' + (on ? "true" : "false") +
      '" aria-label="' + label + '" title="' + label + '">' + HEART + '</span>';
  }

  function el(kind, path, extra){
    var d = document.createElement("div");
    d.innerHTML = heart(kind, path, extra);
    return d.firstChild;
  }

  // The little jump + tiny buzz (phones that support it) when something is
  // saved. Used by hearts and by the paper star, so they feel identical.
  function buzz(){
    try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){}
  }

  function pop(el){
    if(!el) return;
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
  }

  function flip(h){
    var on = toggle(h.getAttribute("data-fav"));
    sync();
    h.classList.remove("pop");
    if(on) pop(h);
    buzz();
    notify();
  }

  // Captured first, so tapping a heart never opens the image or video under it.
  document.addEventListener("click", function(e){
    var h = e.target && e.target.closest ? e.target.closest(".fav-heart") : null;
    if(!h) return;
    e.preventDefault();
    e.stopPropagation();
    flip(h);
  }, true);

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var h = e.target && e.target.closest ? e.target.closest(".fav-heart") : null;
    if(!h) return;
    e.preventDefault();
    e.stopPropagation();
    flip(h);
  }, true);

  function refresh(){ sync(); notify(); }

  window.addEventListener("storage", function(e){
    if(e.key === KEY || e.key === null) refresh();
  });
  window.addEventListener("pageshow", function(e){ if(e.persisted) refresh(); });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) refresh();
  });

  window.FavMedia = {
    key: key,
    has: has,
    toggle: toggle,
    heart: heart,
    el: el,
    sync: sync,
    pop: pop,
    buzz: buzz,
    count: function(){ return read().size; },
    onChange: function(fn){ listeners.push(fn); }
  };
})();
</script>
</head>

<script>
const params =
    new URLSearchParams(window.location.search);

const currentCategory =
    params.get("category") || "all";

    let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;

    
function loadFavorites(){

    favoritePapers =
        JSON.parse(
            localStorage.getItem(
                "favoritePapers"
            ) || "[]"
        );

}

function isFavorite(key){

    return favoritePapers.includes(key);

}

// ---- Settings (view mode + default image state) ----

let viewMode =
    localStorage.getItem("viewMode") || "detailed";

let imagesDefaultOpen =
    localStorage.getItem("imagesDefaultOpen") === "true";

let videosDefaultOpen =
    localStorage.getItem("videosDefaultOpen") === "true";

// "Show file names": names on every image and video tile, cut off with
// "..." when too long. A saved setting (kept across refreshes).
let showFileNames = false;

try{
    showFileNames = localStorage.getItem("showFileNames") === "true";
}catch(e){}

document.documentElement.classList.toggle("show-file-names", showFileNames);

// Assigned once papers finish loading; declared here (outer scope)
// so the settings controls below can call it immediately on change.
let renderPapers = function(){};

let readingLevel =
    localStorage.getItem("readingLevel") || "average";

const sortLabels = {
    az: "A-Z",
    za: "Z-A",
    newest: "Newest",
    oldest: "Oldest",
    mostimages: "Most Images",
    leastimages: "Least Images",
    mostvideos: "Most Videos",
    leastvideos: "Least Videos",
    mostreadtime: "Longest Read",
    leastreadtime: "Shortest Read"
};

// Each group pairs an ascending and descending sort value. Clicking
// a group's button in the sort panel toggles between the two instead
// of needing two separate list entries.
const SORT_GROUPS = {
    title:    { label: "Title",        asc: "az",           desc: "za" },
    date:     { label: "Date",         asc: "oldest",        desc: "newest" },
    images:   { label: "Images",       asc: "leastimages",   desc: "mostimages" },
    videos:   { label: "Videos",       asc: "leastvideos",   desc: "mostvideos" },
    readtime: { label: "Reading Time", asc: "leastreadtime", desc: "mostreadtime" }
};

function getActiveSortGroup(){

    for(const [key, group] of Object.entries(SORT_GROUPS)){
        if(sortType === group.asc) return { key, direction: "asc" };
        if(sortType === group.desc) return { key, direction: "desc" };
    }

    return { key: null, direction: null };

}

let sortType =
    localStorage.getItem("paperSort") || "az";

// Re-runs a render while keeping the current scroll position and
// which "Supporting Images" panels were open (e.g. after starring
// a paper), instead of jumping back to the top with everything closed.
function withPreservedState(fn){

    const openKeys = Array.from(
        document.querySelectorAll(".image-details")
    ).filter(details => details.open)
     .map(details => details.dataset.paper);

    const scrollY = window.scrollY;

    fn();

    document.querySelectorAll(".image-details").forEach(details => {
        details.open = openKeys.includes(details.dataset.paper);
    });

    window.scrollTo(0, scrollY);

}

// Picker rows in the Settings panel (View, Reading Speed) - each
// backed by a small popup of checkmarked options, exactly like
// video.html's Speed picker. One shared popup (#optionPopup) is
// reused for whichever row was tapped, rather than a separate
// popup per row.
const PICKER_GROUPS = {
    viewMode: {
        options: [
            { value:"compact", label:"Compact" },
            { value:"comfy", label:"Comfy" },
            { value:"detailed", label:"Detailed" }
        ],
        get(){ return viewMode; },
        set(value){
            viewMode = value;
            localStorage.setItem("viewMode", viewMode);
        }
    },
    readingLevel: {
        options: [
            { value:"slow", label:"Slow" },
            { value:"average", label:"Average" },
            { value:"fast", label:"Fast" }
        ],
        get(){ return readingLevel; },
        set(value){
            readingLevel = value;
            localStorage.setItem("readingLevel", readingLevel);
        }
    }
};

function pickerValueLabel(key){

    const group = PICKER_GROUPS[key];
    const current = group.options.find(opt => opt.value === group.get());

    return current ? current.label : "";

}

function applySettingsUI(){

    document.getElementById("viewModeValueLabel").textContent =
        pickerValueLabel("viewMode");

    document.getElementById("readingLevelValueLabel").textContent =
        pickerValueLabel("readingLevel");

    imagesDefaultOpenToggle.classList.toggle("active", imagesDefaultOpen);
    imagesDefaultOpenToggle.setAttribute(
        "aria-checked",
        imagesDefaultOpen ? "true" : "false"
    );

    videosDefaultOpenToggle.classList.toggle("active", videosDefaultOpen);

// Anchors the popup to the picker row that opened it - preferring
// to open just below the row (since the Settings panel itself
// drops down from the gear button), but flipping upward if there
// genuinely isn't room below, then clamping on-screen as a final
// safety net. Mirrors video.html's positionVideoSpeedPopup.
function positionOptionPopup(rowEl){

    // the text-size setting zooms the page, so measure in the page's own pixels
    const Z = (window.LT && LT.zoom) ? LT.zoom() : 1;
    const vw = window.innerWidth / Z, vh = window.innerHeight / Z;
    const r0 = rowEl.getBoundingClientRect();
    const rect = { left:r0.left / Z, top:r0.top / Z, right:r0.right / Z, bottom:r0.bottom / Z, width:r0.width / Z, height:r0.height / Z };

    const popupWidth =
        Math.min(190, vw - 24);

    const margin =
        12;

    let left =
        rect.left + (rect.width / 2) - (popupWidth / 2);

    left =
        Math.max(margin, Math.min(left, vw - popupWidth - margin));

    optionPopup.style.left =
        left + "px";

    const spaceBelow =
        vh - rect.bottom - 8;

    const spaceAbove =
        rect.top - 8;

    if(spaceBelow >= 160 || spaceBelow >= spaceAbove){

        optionPopup.style.top = (rect.bottom + 8) + "px";
        optionPopup.style.bottom = "auto";

    }else{

        optionPopup.style.bottom = (vh - rect.top + 8) + "px";
        optionPopup.style.top = "auto";

    }

}

// .jpeg once each, then give up and keep the plain dark tile.
function videoThumbFallback(img){

    const exts = ["png", "webp", "jpeg"];
    const tried = Number(img.dataset.tried || 0);

    if(tried >= exts.length || !/\.[a-z]+$/i.test(img.src)){
        img.remove();
        return;
    }

    img.dataset.tried = tried + 1;
    img.src = img.src.replace(/\.[a-z]+$/i, "." + exts[tried]);

}

}

// Pages to count toward reading time: everything before the Sources
// section. Computed ahead of time from each PDF's extracted text and
// served as content-pages.json, keyed by the paper's PDF filename
// (paper.url) since that's stable regardless of the descriptions.json
// key. A per-paper `contentPages` field in descriptions.json can
// override it manually; if neither is available, this falls back to
// the paper's total page count from page-counts.json.
function getContentPageCount(key, paper){

    if(typeof paper.contentPages === "number"){
        return paper.contentPages;
    }

    if(
        paper.url &&
        typeof contentPageCounts[paper.url] === "number"
    ){
        return contentPageCounts[paper.url];
    }

    return Number(pageCounts[key]) || 0;

}

// Reading time is estimated from an approximate word count rather
// than a flat "minutes per page" guess, so it scales the same way
// real reading speed does (word-by-word) instead of just being an
// arbitrary per-page number.
//
// WORDS_PER_PAGE: a standard estimate for a single-spaced,
// 12-point page of body text with normal margins - the same figure
// commonly used by word-count-to-page conversions. Research PDFs
// vary (dense two-column layouts run higher, pages heavy with
// figures/tables run lower), but this is a reasonable average
// across a typical paper's content pages.
const WORDS_PER_PAGE = 500;

// READING_WPM: silent reading speed in words per minute. "Average"
// reflects the commonly cited adult silent-reading rate for
// nonfiction/technical text (~200 wpm); "slow" reflects careful,
// close reading of dense academic material; "fast" reflects a
// fluent reader moving efficiently through familiar material while
// still reading every word (not skimming).
const READING_WPM = {
    slow: 150,
    average: 200,
    fast: 300
};

// Formats a minute count as "18 min", "59 min", "1 hr 30 min",
// or "2 hrs 1 min" as appropriate.
function formatReadTime(totalMinutes){

    if(totalMinutes < 60){
        return totalMinutes + " min";
    }

    const hrs = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;

    const hrLabel = hrs + (hrs === 1 ? " hr" : " hrs");

    return mins > 0 ? `${hrLabel} ${mins} min` : hrLabel;

}

function getReadMinutes(key, paper){

    const pages = getContentPageCount(key, paper);

    if(pages <= 0){
        return 0;
    }

    const wordsPerMinute =
        READING_WPM[readingLevel] ||
        READING_WPM.average;

    const estimatedWords =
        pages * WORDS_PER_PAGE;

    return Math.max(1, Math.round(estimatedWords / wordsPerMinute));

}

function buildReadTimeHtml(key, paper){

    const minutes = getReadMinutes(key, paper);

    if(!minutes) return "";

    return `<p class="read-time-line">${formatReadTime(minutes)}</p>`;

}

    if(savedScroll){

        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                // Images inside the open panels fill in after the page
                // appears, so keep nudging to the saved spot until it
                // holds (stops the moment you touch or scroll yourself).
                (function restoreSpot(target){

                    const events = ["wheel","touchstart","mousedown","keydown"];
                    let done = false;
                    let stableSince = 0;
                    const startedAt = performance.now();

                    function finish(){
                        if(done) return;
                        done = true;
                        events.forEach(ev => window.removeEventListener(ev, finish));
                    }

                    events.forEach(ev =>
                        window.addEventListener(ev, finish, {passive:true})
                    );

                    function step(){

                        if(done) return;

                        window.scrollTo({ top: target, behavior: "instant" });

                        const now = performance.now();

                        if(Math.abs(window.scrollY - target) <= 2){
                            if(!stableSince) stableSince = now;
                            if(now - stableSince > 700) return finish();
                        }else{
                            stableSince = 0;
                        }

                        if(now - startedAt > 4000) return finish();

                        requestAnimationFrame(step);

                    }

                    step();

                })(parseInt(savedScroll));

               sessionStorage.removeItem(
    "returnFromPage"
);

            });

        });

    }

}
