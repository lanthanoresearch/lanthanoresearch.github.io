<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Research</title>

<style>
body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
}

    
html{
    scroll-behavior:smooth;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

.top-button:hover{
    opacity:.6;
    background:#2a2a2a;
}
    .favorite-star{

    position:absolute;

    top:10px;
    right:14px;

    font-size:2rem;
    line-height:1;

    color:#666;

    cursor:pointer;

    user-select:none;

    visibility:hidden;
    pointer-events:none;

    transition:.2s;
}

.favorite-star.ready{

    visibility:visible;
    pointer-events:auto;

}

.favorite-star.active{

    color:#FFD700;
    text-shadow:0 0 10px rgba(255,215,0,.55);

}

.favorite-star:hover{

    transform:scale(1.15);

}




    
section{
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:40px;
}
.info-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:-20px;
    margin-bottom:35px;
}

#paperCount{
    margin:0;
    color:#777;
}
.sort-container{
    text-align:center;
    margin-bottom:30px;
}

#sortSelect{
    background:#222;
    color:#eee;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    font-size:.95em;
    cursor:pointer;
}

#sortSelect:hover{
    background:#262626;
}

#sortSelect:focus{
    outline:none;
    border-color:#555;
}

    
.back{
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:20px;
}
.card{
    position:relative;

    background:#1d1d1d;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
}

.card-cover{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:6px;
    background:#141414;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
}

.card-body{
    min-width:0;
}

.card-clear{
    clear:both;
}


    
    .paper-badge{
    position:absolute;
    top:14px;
    right:52px;
    color:#fff;
    font-size:.72em;
    font-weight:bold;
    padding:5px 10px;
    border-radius:999px;
    letter-spacing:.5px;
    text-transform:uppercase;
}

.paper-badge.featured{
    background:#2f7cff;
}

.paper-badge.newest{
    background:#00b050;
}

.paper-badge.newest.with-featured{
    right:150px;
}


    
.card-description{
    color:#aaa;
    font-size:0.9em;
    margin-top:10px;
    line-height:1.4;
}

.card-date{
    color:#777;
    font-size:0.8em;
    margin-top:10px;
}

    .card-pages{
    color:#777;
    font-size:0.8em;
    margin-top:4px;
}
    
.button{
    display:inline-block;
    background:#333;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:6px;
    margin-right:10px;
    margin-top:10px;
}

.button:hover{
    background:#444;
}

.read-btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    margin-right:0;
    cursor:pointer;
}

.card-cover-link{
    display:block;
    float:right;
    width:clamp(80px, 28vw, 130px);
    aspect-ratio:3/4;
    margin:4px 0 6px 14px;
    cursor:pointer;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.gallery img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
}

details{
    margin-top:20px;
}

summary{
    cursor:pointer;
    font-size:1.1em;
    font-weight:bold;
    padding:12px;
    background:#222;
    border-radius:8px;
}

summary:hover{
    background:#2a2a2a;
}
</style>
</head>

<body>

<section>

<a class="back" href="index.html">◀ Home</a>

    <h1 id="pageTitle">Loading...</h1>

<div class="info-bar">

<p id="paperCount"></p>

<select id="sortSelect">

<option value="az">A-Z</option>
<option value="za">Z-A</option>

<option value="newest">Newest</option>
<option value="oldest">Oldest</option>

<option value="mostimages">Most Images</option>
<option value="leastimages">Least Images</option>

</select>

</div>



<div id="research-container"></div>

</section>
<a href="#" class="top-button" id="topButton">
    <span style="position:relative; top:-3px;">▲</span>
</a>
<script>
const params =
    new URLSearchParams(window.location.search);

const currentCategory =
    params.get("category");

    let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;

    
function loadFavorites(){

    favoritePapers =
        JSON.parse(
            localStorage.getItem(
                "favoritePapers"
            ) || "[]"
        );

}

function isFavorite(key){

    return favoritePapers.includes(key);

}



    const scrollKey =
    "categoryScroll-" + currentCategory;
    const returning =
    sessionStorage.getItem("returnFromPage") === "yes";
if(!returning){

    sessionStorage.removeItem(scrollKey);

    sessionStorage.removeItem(
        "openDetails-" + currentCategory
    );

}
    

let pageTitle = "";

if(currentCategory === "all"){

    pageTitle = "All Research";

}else if(currentCategory === "favorites"){

    pageTitle = "Favorites";

}else{

    pageTitle =
        currentCategory.charAt(0).toUpperCase() +
        currentCategory.slice(1);

}

document.querySelector("h1").textContent = pageTitle;
document.title = `Lanthano Research - ${pageTitle}`;


    
Promise.all([
    fetch("descriptions.json").then(response => response.json()),
    fetch("page-counts.json").then(response => response.json())
])
.then(([data, pageCounts]) => {


    
    const container =
        document.getElementById("research-container");

    let papers =
    Object.entries(data);

    papers.sort((a,b)=>
        a[1].title.localeCompare(b[1].title)
    );

    const newestEntry = [...papers].sort(
    (a, b) =>
        new Date(b[1].updated) - new Date(a[1].updated)
)[0];

newestKey = newestEntry[0];

const newestDate = new Date(newestEntry[1].updated);

const today = new Date();

const oneYearAgo = new Date(today);
oneYearAgo.setFullYear(today.getFullYear() - 1);

showNewestBadge = newestDate >= oneYearAgo;

    
    function toggleFavorite(key){

    if(isFavorite(key)){

        favoritePapers =
            favoritePapers.filter(
                item => item !== key
            );

    }else{

        favoritePapers.push(key);

    }

    localStorage.setItem(
        "favoritePapers",
        JSON.stringify(favoritePapers)
    );

    renderPapers();

}

window.toggleFavorite = toggleFavorite;
    function getVisibleImageCount(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    ).length;
}

    
function getPaperBadge(key, paper){

    const isNewest =
        showNewestBadge &&
        key === newestKey;

    let html = "";

    if (isNewest){

        html += `
        <div class="paper-badge newest${paper.featured ? " with-featured" : ""}">
            New
        </div>`;
    }

    if (paper.featured){

        html += `
        <div class="paper-badge featured">
            Featured
        </div>`;
    }

    return html;
}
    
function renderPapers(){
loadFavorites();
container.innerHTML = "";

let filteredPapers = papers.filter(([key,paper]) =>

    currentCategory === "all"

    ||

    (

        currentCategory === "favorites"

        &&

        favoritePapers.includes(key)

    )

    ||

    (

        paper.category &&
        paper.category.includes(currentCategory)

    )

);

const sortType =
    document.getElementById("sortSelect").value;

if(sortType === "az"){

    filteredPapers.sort((a,b)=>
        a[1].title.localeCompare(b[1].title)
    );

}
else if(sortType === "za"){

    filteredPapers.sort((a,b)=>
        b[1].title.localeCompare(a[1].title)
    );

}
else if(sortType === "newest"){

    filteredPapers.sort((a,b)=>
        b[1].updated.localeCompare(a[1].updated)
    );

}
else if(sortType === "oldest"){

    filteredPapers.sort((a,b)=>
        a[1].updated.localeCompare(b[1].updated)
    );

}
else if(sortType === "mostimages"){

    filteredPapers.sort((a,b)=>
        getVisibleImageCount(b[1]) -
        getVisibleImageCount(a[1])
    );

}
else if(sortType === "leastimages"){

    filteredPapers.sort((a,b)=>
        getVisibleImageCount(a[1]) -
        getVisibleImageCount(b[1])
    );

}

document.getElementById("paperCount").textContent =
    filteredPapers.length +
    (filteredPapers.length === 1 ? " Paper" : " Papers");

    if(
    currentCategory === "favorites"
    &&
    filteredPapers.length === 0
){

    container.innerHTML = `

    <div style="
        text-align:center;
        padding:70px 20px;
    ">

        <h2>No Favorite Papers</h2>

        <p style="color:#888;">
            Tap the ☆ on any paper to save it here.
        </p>

    </div>

    `;

    return;

}

filteredPapers.forEach(([key,paper]) => {

        let galleryHtml = "";

       const visibleImages = (paper.images || []).filter(image =>
    typeof image === "string" &&
    !image.trim().startsWith("#$")
);

if(visibleImages.length){
    galleryHtml = `
        <details class="image-details" data-paper="${key}">
            <summary>Supporting Images (${visibleImages.length})</summary>

            <div class="gallery">

             ${visibleImages.map(image => `
<a
    href="image.html?image=${encodeURIComponent(image)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}"
    class="gallery-image"
    data-scroll-key="${scrollKey}"
>
    <img
        src="${image}"
        loading="lazy">
</a>
`).join("")}

            </div>
        </details>
    `;
}
        let cardHtml = "";
const warningAccepted =
    sessionStorage.getItem(
        "warning-" + key
    ) === "accepted";
       

if(
    paper.warning &&
    !warningAccepted
){
            cardHtml = `
            <div class="card">
            <span
class="favorite-star
${isFavorite(key) ? " active" : ""}"
onclick="
event.stopPropagation();
toggleFavorite('${key}');
">
${isFavorite(key) ? "★" : "☆"}
</span>
${getPaperBadge(key, paper)}

                <div class="card-body">

                <h2>${paper.title}</h2>

                <a
                    class="card-cover-link pdf-link"
                    href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
                <img
                    class="card-cover"
                    src="covers/${key}.png"
                    alt="${paper.title} cover"
                    loading="lazy"
                    onerror="this.closest('a').remove()">
                </a>

                <p class="card-description">
                    ${paper.description}
                </p>

                <p class="card-date">
    Created: ${parseInt(paper.updated.split("-")[1])}-${
parseInt(paper.updated.split("-")[2])}-${
paper.updated.split("-")[0]}
</p>

<p class="card-pages">
    ${Number(pageCounts[key]) || 0} ${(Number(pageCounts[key]) || 0) === 1 ? "page" : "pages"}
</p>

                <div class="card-clear"></div>

                   <div id="warning-${key}">

                   <div style="
    text-align:center;
    padding:15px 10px;
">

    <div style="
        font-size:4.5rem;
        line-height:1;
        margin-bottom:15px;
        filter:drop-shadow(0 0 8px rgba(255,200,0,.35));
    ">
        ⚠️
    </div>

    <p style="
        margin:0 0 20px 0;
        line-height:1.5;
        color:#ddd;
    ">
        This paper and/or its supporting images contain graphic material,
        including depictions of severe injuries, death, or war casualties.
    </p>

    <a class="button"
       href="#"
       onclick="showWarningContent('${key}'); return false;">
       I Understand, Show Content
    </a>

</div>

                </div>

                <div id="content-${key}"
     style="display:none;">

                  <a class="button pdf-link read-btn"
   href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
   Read Research
</a>

                    ${galleryHtml}

                </div>

                </div>

            </div>
            `;

        }else{

            cardHtml = `
            <div class="card">
            <span
class="favorite-star
${isFavorite(key) ? " active" : ""}"
onclick="
event.stopPropagation();
toggleFavorite('${key}');
">
${isFavorite(key) ? "★" : "☆"}
</span>
${getPaperBadge(key, paper)}

                <div class="card-body">

                <h2>${paper.title}</h2>

                <a
                    class="card-cover-link pdf-link"
                    href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
                <img
                    class="card-cover"
                    src="covers/${key}.png"
                    alt="${paper.title} cover"
                    loading="lazy"
                    onerror="this.closest('a').remove()">
                </a>

                <p class="card-description">
                    ${paper.description}
                </p>

                <p class="card-date">
    Created: ${parseInt(paper.updated.split("-")[1])}-${
parseInt(paper.updated.split("-")[2])}-${
paper.updated.split("-")[0]}
</p>

<p class="card-pages">
    ${Number(pageCounts[key]) || 0} ${(Number(pageCounts[key]) || 0) === 1 ? "page" : "pages"}
</p>

                <div class="card-clear"></div>

              <a class="button pdf-link read-btn"
   href="pdf.html?file=${encodeURIComponent(paper.url)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}">
   Read Research
</a>

                ${galleryHtml}

                </div>

            </div>
            `;

        }

        container.innerHTML += cardHtml;
    

});
   if(returning){

    const openDetails =
        JSON.parse(
            sessionStorage.getItem(
                "openDetails-" + currentCategory
            ) || "[]"
        );

    document
        .querySelectorAll(".image-details")
        .forEach(details=>{

            if(openDetails.includes(details.dataset.paper)){

                details.open = true;

            }

        });

}
    
    
    document.querySelectorAll(".gallery-image").forEach(link=>{

  link.addEventListener("click",()=>{

    saveOpenDetails();

    sessionStorage.setItem(
        scrollKey,
        window.scrollY
    );

    sessionStorage.setItem(
    "returnFromPage",
    "yes"
);

});
});
document.querySelectorAll(".pdf-link").forEach(link=>{

    link.addEventListener("click",()=>{

        saveCategoryState();

    });

});
    document
.querySelectorAll(".favorite-star")
.forEach(star=>{

    star.classList.add("ready");

});
}

    

const sortSelect =
    document.getElementById("sortSelect");

const savedSort =
    localStorage.getItem("paperSort");

if(savedSort){
    sortSelect.value = savedSort;
}

loadFavorites();

renderPapers();



sortSelect.addEventListener("change", () => {

    localStorage.setItem(
        "paperSort",
        sortSelect.value
    );

    renderPapers();

});
    



if(returning){

    

    const savedScroll =
        sessionStorage.getItem(scrollKey);

    if(savedScroll){

        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                window.scrollTo(
                    0,
                    parseInt(savedScroll)
                );
               sessionStorage.removeItem(
    "returnFromPage"
);

            });

        });

    }

}


       
function saveOpenDetails(){

    const open = [];

    document.querySelectorAll(".image-details").forEach(details=>{

        if(details.open){

            open.push(details.dataset.paper);

        }

    });

    sessionStorage.setItem(
        "openDetails-" + currentCategory,
        JSON.stringify(open)
    );

}
    function saveCategoryState(){

    saveOpenDetails();

    sessionStorage.setItem(
        scrollKey,
        window.scrollY
    );

    sessionStorage.setItem(
        "returnFromPage",
        "yes"
    );

}
window.showWarningContent = function(key){

    sessionStorage.setItem(
        "warning-" + key,
        "accepted"
    );

    document.getElementById(
        "warning-" + key
    ).style.display = "none";

    document.getElementById(
        "content-" + key
    ).style.display = "block";

};
    });
    
const topButton = document.getElementById("topButton");

function updateTopButton(){
    if(window.scrollY > 10){
        topButton.style.display = "flex";
    }else{
        topButton.style.display = "none";
    }
}

topButton.addEventListener("click", function(e){
    e.preventDefault();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);
</script>

    

</body>
</html>
