<script>
const params =
    new URLSearchParams(window.location.search);

const currentCategory =
    params.get("category");

    let favoritePapers = [];
let newestKey = "";
let showNewestBadge = false;

    
function loadFavorites(){

    favoritePapers =
        JSON.parse(
            localStorage.getItem(
                "favoritePapers"
            ) || "[]"
        );

}

function isFavorite(key){

    return favoritePapers.includes(key);

}

// ---- Settings (view mode + default image state) ----

let viewMode =
    localStorage.getItem("viewMode") || "detailed";

let imagesDefaultOpen =
    localStorage.getItem("imagesDefaultOpen") === "true";

// Assigned once papers finish loading; declared here (outer scope)
// so the settings controls below can call it immediately on change.
let renderPapers = function(){};

let readingLevel =
    localStorage.getItem("readingLevel") || "average";

const sortLabels = {
    az: "A-Z",
    za: "Z-A",
    newest: "Newest",
    oldest: "Oldest",
    mostimages: "Most Images",
    leastimages: "Least Images"
};

let sortType =
    localStorage.getItem("paperSort") || "az";

// Re-runs a render while keeping the current scroll position and
// which "Supporting Images" panels were open (e.g. after starring
// a paper), instead of jumping back to the top with everything closed.
function withPreservedState(fn){

    const openKeys = Array.from(
        document.querySelectorAll(".image-details")
    ).filter(details => details.open)
     .map(details => details.dataset.paper);

    const scrollY = window.scrollY;

    fn();

    document.querySelectorAll(".image-details").forEach(details => {
        details.open = openKeys.includes(details.dataset.paper);
    });

    window.scrollTo(0, scrollY);

}

function applySettingsUI(){

    document
        .querySelectorAll('input[name="viewMode"]')
        .forEach(input => {
            input.checked = input.value === viewMode;
        });

    document.getElementById("imagesDefaultOpen").checked =
        imagesDefaultOpen;

    document
        .querySelectorAll('input[name="readingLevel"]')
        .forEach(input => {
            input.checked = input.value === readingLevel;
        });

    document
        .querySelectorAll('input[name="sortType"]')
        .forEach(input => {
            input.checked = input.value === sortType;
        });

    document.getElementById("sortButtonLabel").textContent =
        sortLabels[sortType] || "Sort";

}

const settingsButton =
    document.getElementById("settingsButton");
const settingsPanel =
    document.getElementById("settingsPanel");

const sortButton =
    document.getElementById("sortButton");
const sortPanel =
    document.getElementById("sortPanel");
const sortDropdown =
    document.getElementById("sortDropdown");

function closeMenus(){
    settingsPanel.classList.remove("open");
    sortPanel.classList.remove("open");
    sortDropdown.classList.remove("open");
}

settingsButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !settingsPanel.classList.contains("open");
    closeMenus();
    if(willOpen) settingsPanel.classList.add("open");
});

sortButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !sortPanel.classList.contains("open");
    closeMenus();
    if(willOpen){
        sortPanel.classList.add("open");
        sortDropdown.classList.add("open");
    }
});

// Tapping/clicking anywhere outside either menu closes whichever
// one is open.
document.addEventListener("click", (e) => {
    if(
        settingsPanel.classList.contains("open") &&
        !settingsPanel.contains(e.target) &&
        e.target !== settingsButton
    ){
        settingsPanel.classList.remove("open");
    }
    if(
        sortPanel.classList.contains("open") &&
        !sortPanel.contains(e.target) &&
        e.target !== sortButton
    ){
        sortPanel.classList.remove("open");
        sortDropdown.classList.remove("open");
    }
});

// Scrolling the page also closes either open menu, matching the
// tap-outside-to-close behavior.
window.addEventListener("scroll", () => {
    closeMenus();
}, { passive: true });

document
    .querySelectorAll('input[name="viewMode"]')
    .forEach(input => {
        input.addEventListener("change", () => {
            if(input.checked){
                viewMode = input.value;
                localStorage.setItem("viewMode", viewMode);
                withPreservedState(renderPapers);
            }
        });
    });

document
    .getElementById("imagesDefaultOpen")
    .addEventListener("change", (e) => {
        imagesDefaultOpen = e.target.checked;
        localStorage.setItem(
            "imagesDefaultOpen",
            imagesDefaultOpen
        );
        withPreservedState(renderPapers);
    });

document
    .querySelectorAll('input[name="readingLevel"]')
    .forEach(input => {
        input.addEventListener("change", () => {
            if(input.checked){
                readingLevel = input.value;
                localStorage.setItem("readingLevel", readingLevel);
                withPreservedState(renderPapers);
            }
        });
    });

document
    .querySelectorAll('input[name="sortType"]')
    .forEach(input => {
        input.addEventListener("change", () => {
            if(input.checked){
                sortType = input.value;
                localStorage.setItem("paperSort", sortType);
                document.getElementById("sortButtonLabel").textContent =
                    sortLabels[sortType] || "Sort";
                sortPanel.classList.remove("open");
                sortDropdown.classList.remove("open");
                withPreservedState(renderPapers);
            }
        });
    });

applySettingsUI();



    const scrollKey =
    "categoryScroll-" + currentCategory;
    const returning =
    sessionStorage.getItem("returnFromPage") === "yes";
if(!returning){

    sessionStorage.removeItem(scrollKey);

    sessionStorage.removeItem(
        "openDetails-" + currentCategory
    );

}
    

let pageTitle = "";

if(currentCategory === "all"){

    pageTitle = "All Research";

}else if(currentCategory === "favorites"){

    pageTitle = "Favorites";

}else{

    pageTitle =
        currentCategory.charAt(0).toUpperCase() +
        currentCategory.slice(1);

}

document.querySelector("h1").textContent = pageTitle;
document.title = `Lanthano Research - ${pageTitle}`;


    
Promise.all([
    fetch("descriptions.json").then(response => response.json()),
    fetch("page-counts.json").then(response => response.json()),
    fetch("content-pages.json").then(response => response.json()).catch(() => ({}))
])
.then(([data, pageCounts, contentPageCounts]) => {


    
    const container =
        document.getElementById("research-container");

    let papers =
    Object.entries(data);

    papers.sort((a,b)=>
        a[1].title.localeCompare(b[1].title)
    );

    const newestEntry = [...papers].sort(
    (a, b) =>
        new Date(b[1].updated) - new Date(a[1].updated)
)[0];

newestKey = newestEntry[0];

const newestDate = new Date(newestEntry[1].updated);

const today = new Date();

const oneYearAgo = new Date(today);
oneYearAgo.setFullYear(today.getFullYear() - 1);

showNewestBadge = newestDate >= oneYearAgo;

    
    function toggleFavorite(key){

    if(isFavorite(key)){

        favoritePapers =
            favoritePapers.filter(
                item => item !== key
            );

    }else{

        favoritePapers.push(key);

    }

    localStorage.setItem(
        "favoritePapers",
        JSON.stringify(favoritePapers)
    );

    withPreservedState(renderPapers);

}

window.toggleFavorite = toggleFavorite;
    function getVisibleImageCount(paper){
    return (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    ).length;
}

    
function getPaperBadge(key, paper){

    const isNewest =
        showNewestBadge &&
        key === newestKey;

    let html = "";

    if (isNewest){

        html += `
        <div class="paper-badge newest${paper.featured ? " with-featured" : ""}">
            New
        </div>`;
    }

    if (paper.featured){

        html += `
        <div class="paper-badge featured">
            Featured
        </div>`;
    }

    return html;
}

// Builds the gallery markup for a paper (used across all view modes)
function buildGalleryHtml(key, paper){

    const visibleImages = (paper.images || []).filter(image =>
        typeof image === "string" &&
        !image.trim().startsWith("#$")
    );

    if(!visibleImages.length) return "";

    const openAttr = imagesDefaultOpen ? " open" : "";

    return `
        <details class="image-details" data-paper="${key}"${openAttr}>
            <summary>Supporting Images (${visibleImages.length})</summary>

            <div class="gallery">

             ${visibleImages.map(image => `
<a
    href="image.html?image=${encodeURIComponent(image)}&paper=${encodeURIComponent(paper.title)}&return=${encodeURIComponent(window.location.href)}"
    class="gallery-image"
    data-scroll-key="${scrollKey}"
>
    <img
        src="${image}"
        loading="lazy">
</a>
`).join("")}

            </div>
        </details>
    `;
}

// Pages to count toward reading time: everything before the Sources
// section. Computed ahead of time from each PDF's extracted text and
// served as content-pages.json, keyed by the paper's PDF filename
// (paper.url) since that's stable regardless of the descriptions.json
// key. A per-paper `contentPages` field in descriptions.json can
// override it manually; if neither is available, this falls back to
// the paper's total page count from page-counts.json.
function getContentPageCount(key, paper){

    if(typeof paper.contentPages === "number"){
        return paper.contentPages;
    }

    if(
        paper.url &&
        typeof contentPageCounts[paper.url] === "number"
    ){
        return contentPageCounts[paper.url];
    }

    return Number(pageCounts[key]) || 0;

}

// Rough reading pace for a research paper, in minutes per page.
const READING_MINUTES_PER_PAGE = {
    slow: 3.5,
    average: 2.5,
    fast: 1.5
};

// Formats a minute count as "18 min", "59 min", "1 hr 30 min",
// or "2 hrs 1 min" as appropriate.
function formatReadTime(totalMinutes){

    if(totalMinutes < 60){
        return totalMinutes + " min";
    }

    const hrs = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;

    const hrLabel = hrs + (hrs === 1 ? " hr" : " hrs");

    return mins > 0 ? `${hrLabel} ${mins} min` : hrLabel;

}

function buildReadTimeHtml(key, paper){

    const pages = getContentPageCount(key, paper);

    const minutesPerPage =
        READING_MINUTES_PER_PAGE[readingLevel] ||
        READING_MINUTES_PER_PAGE.average;

    const minutes =
        pages > 0
            ? Math.max(1, Math.round(pages * minutesPerPage))
            : 0;

    if(!minutes) return "";

    return `<p class="read-time-line">Read time: ${formatReadTime(minutes)}</p>`;

}

function saveOpenDetails(){

    const open = [];

    document.querySelectorAll(".image-details").forEach(details=>{

        if(details.open){

            open.push(details.dataset.paper);

        }

    });

    sessionStorage.setItem(
        "openDetails-" + currentCategory,
        JSON.stringify(open)
    );

}
    function saveCategoryState(){

    saveOpenDetails();

    sessionStorage.setItem(
        scrollKey,
        window.scrollY
    );

    sessionStorage.setItem(
        "returnFromPage",
        "yes"
    );

}
window.showWarningContent = function(key){

    sessionStorage.setItem(
        "warning-" + key,
        "accepted"
    );

    document.getElementById(
        "warning-" + key
    ).style.display = "none";

    document.getElementById(
        "content-" + key
    ).style.display = "block";

};
    });
    
const topButton = document.getElementById("topButton");

function updateTopButton(){
    if(window.scrollY > 10){
        topButton.style.display = "flex";
    }else{
        topButton.style.display = "none";
    }
}

topButton.addEventListener("click", function(e){
    e.preventDefault();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

window.addEventListener("scroll", updateTopButton);
window.addEventListener("load", updateTopButton);
