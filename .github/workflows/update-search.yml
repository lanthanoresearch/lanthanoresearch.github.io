name: Update Search Index

on:
  schedule:
    # Runs every day at 12:00 AM UTC
    - cron: "0 0 * * *"

  # Allows you to manually run it from the GitHub Actions page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          

      - name: Install dependencies
        run: npm install

      - name: Show what is in the repository
        # Only prints information, so a failure below can be understood from this log.
        run: |
          echo "--- files in the repository root ---"
          ls -la
          echo "--- package.json ---"
          cat package.json || echo "(no package.json in the root)"
          echo "--- scripts that mention search ---"
          ls | grep -i search || echo "(no file with 'search' in its name)"

      - name: Install what the search script needs
        # build-search.js needs 'pdf-parse' (and maybe others) that package.json does not list.
        # This finds every outside module the script asks for and installs any that are missing.
        run: |
          if [ -f build-search.js ]; then
            node -e "
              const fs = require('fs');
              const { builtinModules } = require('module');
              const src = fs.readFileSync('build-search.js', 'utf8');
              const pinned = { 'pdf-parse': '1.1.1' };
              const need = new Set();
              for (const m of src.matchAll(/require\\(\\s*['\"]([^'\".][^'\"]*)['\"]\\s*\\)/g)) {
                let name = m[1];
                if (name.startsWith('node:') || builtinModules.includes(name.split('/')[0])) continue;
                name = name.startsWith('@') ? name.split('/').slice(0, 2).join('/') : name.split('/')[0];
                try { require.resolve(name); } catch (e) { need.add(name); }
              }
              const list = [...need].map(n => pinned[n] ? n + '@' + pinned[n] : n);
              fs.writeFileSync('/tmp/missing.txt', list.join(' '));
              console.log('Missing modules:', list.join(' ') || '(none)');
            "
            MISSING=$(cat /tmp/missing.txt)
            if [ -n "$MISSING" ]; then
              npm install --no-save $MISSING
            fi
          fi

      - name: Build search index
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['build-search'] ? 0 : 1)"; then
            npm run build-search
          elif [ -f build-search.js ]; then
            node build-search.js
          else
            echo "::error::There is no 'build-search' script in package.json and no build-search.js file in the repository root. See the file list above."
            exit 1
          fi

      - name: Commit updated search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add search-index.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatic daily search index update"
            git push
          fi
