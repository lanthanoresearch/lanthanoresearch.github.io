name: Android app

# Builds the Android app (an .apk file that installs like any other app) with
# the whole website inside it, and publishes it as the "android-latest"
# release. The Install page (install.html) finds it there on its own.
#
# Put this file in .github/workflows/ next to app.yml. It runs on every push
# and can also be started by hand from the Actions tab.
#
# The app is signed with a key that is created once and remembered between
# runs, so a new version installs over the old one. If that remembered key is
# ever lost (GitHub clears unused caches after a week without a push), Android
# asks people to uninstall the old app once before installing the new one.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remember the signing key between runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-key-v1

      - id: vkey
        run: echo "key=$(node fetch-videos.js --key)" >> "$GITHUB_OUTPUT"

      - name: Remember the downloaded videos between runs
        uses: actions/cache@v4
        with:
          path: .video-cache
          key: site-videos-${{ steps.vkey.outputs.key }}
          restore-keys: site-videos-
          enableCrossOsArchive: true

      - name: Download the videos that live on the video server
        run: node fetch-videos.js .video-cache

      - name: Bundle the whole website, videos included, into the app
        run: |
          mkdir -p android-app
          node build-site-manifest.js --copy android-app/www
          # Storage and Install only belong on the website, not inside the app. The app also
          # never goes to the internet for its own pages, and handles the Back button.
          node prepare-app-bundle.js android-app/www --local-only --videos .video-cache

      - name: Create the Android project
        working-directory: android-app
        run: |
          cat > package.json <<'EOF'
          {
            "name": "lanthano-research-android",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/app": "^6.0.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            }
          }
          EOF
          # "hostname" makes the app open the bundled site as lanthanoresearch.com,
          # so the video server and every link behave exactly as on the website.
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lanthanoresearch.app",
            "appName": "Lanthano Research Offline",
            "webDir": "www",
            "server": {
              "hostname": "lanthanoresearch.com",
              "androidScheme": "https"
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Use the site icon
        working-directory: android-app
        run: |
          # The app icon is your picture centred on a dark square. It is added as a
          # brand-new icon (own file names) and the app is pointed at it, so it does
          # not matter what the Capacitor template's own icon files look like.
          RES=android/app/src/main/res
          MANIFEST=android/app/src/main/AndroidManifest.xml
          ICON="$GITHUB_WORKSPACE/file_000000000c40722f92b1fe6758cb4855.png"
          BG="#111111"
          if [ ! -f "$ICON" ]; then
            echo "::error::Icon picture not found at $ICON"
            exit 1
          fi
          IM=convert; command -v magick >/dev/null 2>&1 && IM=magick
          echo "Using $IM on $(identify "$ICON" 2>/dev/null | head -1)"
          # adaptive icon layer (108dp): the picture takes about 60% of the square
          for pair in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            dir="${pair%%:*}"; px="${pair##*:}"; inner=$(( px * 60 / 100 ))
            mkdir -p "$RES/mipmap-$dir"
            $IM "$ICON" -background none -resize "${inner}x${inner}" -gravity center -extent "${px}x${px}" "$RES/mipmap-$dir/lanthano_icon_foreground.png"
          done
          # older phones: the same picture on the dark square (plain and round)
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="${pair%%:*}"; px="${pair##*:}"; inner=$(( px * 78 / 100 ))
            for name in lanthano_icon lanthano_icon_round; do
              $IM "$ICON" -background none -resize "${inner}x${inner}" -gravity center -background "$BG" -extent "${px}x${px}" -flatten "$RES/mipmap-$dir/$name.png"
            done
          done
          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          cat > "$RES/values/lanthano_icon_colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="lanthano_icon_background">#111111</color>
          </resources>
          EOF
          for name in lanthano_icon lanthano_icon_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/lanthano_icon_background"/>
              <foreground android:drawable="@mipmap/lanthano_icon_foreground"/>
          </adaptive-icon>
          EOF
          done
          # Point the app at the new icon.
          sed -i -E 's#android:icon="[^"]*"#android:icon="@mipmap/lanthano_icon"#; s#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/lanthano_icon_round"#' "$MANIFEST"
          grep -n "android:icon\|android:roundIcon" "$MANIFEST"
          if ! grep -q 'android:icon="@mipmap/lanthano_icon"' "$MANIFEST"; then
            echo "::error::The app icon could not be set in AndroidManifest.xml"
            cat "$MANIFEST"
            exit 1
          fi
          if ! grep -q 'android:roundIcon="@mipmap/lanthano_icon_round"' "$MANIFEST"; then
            # No round icon line in the template: add one next to the icon.
            sed -i 's#android:icon="@mipmap/lanthano_icon"#android:icon="@mipmap/lanthano_icon" android:roundIcon="@mipmap/lanthano_icon_round"#' "$MANIFEST"
          fi
          ls -l "$RES"/mipmap-xxxhdpi "$RES/mipmap-anydpi-v26"

      - name: Name the app
        working-directory: android-app
        run: |
          STR=android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Lanthano Research Offline</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Lanthano Research Offline</string>#' "$STR"
          cat "$STR"

      - name: Number this version
        working-directory: android-app/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle
          grep -n "versionCode" build.gradle

      - name: Build the app
        working-directory: android-app/android
        run: |
          # The app holds the videos, so it is large: give the build room.
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Lanthano-Research.apk
          ls -l Lanthano-Research.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest Lanthano-Research.apk \
            --title "Android app (latest)" \
            --notes "The Lanthano Research Android app. Built automatically. Install it from the Install page on the website." \
            --target "${{ github.sha }}"
