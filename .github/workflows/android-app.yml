name: Android app

# Builds the Android app (an .apk file that installs like any other app) with
# the whole website inside it, and publishes it as the "android-latest"
# release. The Install page (install.html) finds it there on its own.
#
# Put this file in .github/workflows/ next to app.yml. It runs on every push
# and can also be started by hand from the Actions tab.
#
# The app is signed with a key that is created once and remembered between
# runs, so a new version installs over the old one. If that remembered key is
# ever lost (GitHub clears unused caches after a week without a push), Android
# asks people to uninstall the old app once before installing the new one.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remember the signing key between runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-key-v1

      - name: Bundle the whole website into the app
        run: |
          mkdir -p android-app
          node build-site-manifest.js --copy android-app/www

      - name: Create the Android project
        working-directory: android-app
        run: |
          cat > package.json <<'EOF'
          {
            "name": "lanthano-research-android",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            }
          }
          EOF
          # "hostname" makes the app open the bundled site as lanthanoresearch.com,
          # so the video server and every link behave exactly as on the website.
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lanthanoresearch.app",
            "appName": "Lanthano Research",
            "webDir": "www",
            "server": {
              "hostname": "lanthanoresearch.com",
              "androidScheme": "https"
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Use the site icon
        continue-on-error: true
        working-directory: android-app
        run: |
          RES=android/app/src/main/res
          ICON="$GITHUB_WORKSPACE/file_000000000c40722f92b1fe6758cb4855.png"
          rm -rf "$RES/mipmap-anydpi-v26"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="${pair%%:*}"; px="${pair##*:}"
            for name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              if command -v magick >/dev/null 2>&1; then
                magick "$ICON" -resize "${px}x${px}" "$RES/mipmap-$dir/$name.png"
              else
                convert "$ICON" -resize "${px}x${px}" "$RES/mipmap-$dir/$name.png"
              fi
            done
          done

      - name: Number this version
        working-directory: android-app/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle
          grep -n "versionCode" build.gradle

      - name: Build the app
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Lanthano-Research.apk
          ls -l Lanthano-Research.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest Lanthano-Research.apk \
            --title "Android app (latest)" \
            --notes "The Lanthano Research Android app. Built automatically. Install it from the Install page on the website." \
            --target "${{ github.sha }}"
