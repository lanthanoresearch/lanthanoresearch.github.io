# Builds the offline Android app (android/) from this repository.
#
# The APK contains the whole site - every page, image, PDF and PDF.js - and
# needs no network at run time. Only the build itself downloads tools.
#
# Output: workflow artifacts "lanthano-research-debug-apk" and, when signing
# secrets are configured, "lanthano-research-release-apk".
#
# Optional repository secrets for a signed release APK:
#   LANTHANO_KEYSTORE_BASE64   base64 of the .jks keystore file
#   LANTHANO_KEYSTORE_PASSWORD
#   LANTHANO_KEY_ALIAS
#   LANTHANO_KEY_PASSWORD
# The keystore is written to the runner's temp folder and deleted afterwards;
# it is never committed.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths-ignore:
      - "README.md"
      - ".github/workflows/extract-covers.yml"
      - ".github/workflows/update-pages.yml"
      - ".github/workflows/update-search.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_RELEASE_KEY: ${{ secrets.LANTHANO_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.LANTHANO_KEYSTORE_BASE64 }}
          LANTHANO_KEYSTORE_PASSWORD: ${{ secrets.LANTHANO_KEYSTORE_PASSWORD }}
          LANTHANO_KEY_ALIAS: ${{ secrets.LANTHANO_KEY_ALIAS }}
          LANTHANO_KEY_PASSWORD: ${{ secrets.LANTHANO_KEY_PASSWORD }}
        run: |
          export LANTHANO_KEYSTORE_FILE="$RUNNER_TEMP/lanthano-release.jks"
          trap 'rm -f "$LANTHANO_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LANTHANO_KEYSTORE_FILE"
          gradle assembleRelease --stacktrace

      - name: Verify the APK (exists, offline, contains every PDF)
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          mkdir -p dist
          for apk in android/app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            badging="$("$AAPT2" dump badging "$apk")"
            grep -E "^(package|application-label|sdkVersion|targetSdkVersion|uses-permission)" <<< "$badging" || true
            permissions="$("$AAPT2" dump permissions "$apk")"
            echo "$permissions"
            if grep -q "android.permission.INTERNET" <<< "$permissions"; then
              echo "::error::$apk requests the INTERNET permission"; exit 1
            fi
            unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
            expected=$(find . -maxdepth 1 -type f -iname '*.pdf' | wc -l)
            packaged=$(grep -ciE '^assets/www/[^/]+\.pdf$' "$RUNNER_TEMP/apk-files.txt" || true)
            echo "PDFs in repository: $expected, PDFs in APK: $packaged"
            if [ "${packaged:-0}" -lt "$expected" ]; then
              echo "::error::$apk is missing PDFs"; exit 1
            fi
            for required in assets/www/index.html assets/www/pdf.html assets/www/pdfjs/build/pdf.mjs \
                assets/www/pdfjs/build/pdf.worker.mjs assets/lanthano-app/polyfills.js assets/lanthano-app/android-shim.js; do
              grep -qx "$required" "$RUNNER_TEMP/apk-files.txt" || { echo "::error::$apk is missing $required"; exit 1; }
            done
            name="LanthanoResearch-$(basename "$apk" .apk | sed 's/^app-//').apk"
            cp "$apk" "dist/$name"
          done
          ls -la dist
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lanthano-research-debug-apk
          path: |
            dist/*debug*.apk
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lanthano-research-release-apk
          path: |
            dist/*release*.apk
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

  offline-test:
    name: Offline web-content test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: android/tools/offline-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the app's pages with all network access blocked
        working-directory: android/tools/offline-test
        run: node offline-test.cjs --web-root ../../..

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-report
          path: android/tools/test-output
          if-no-files-found: warn
