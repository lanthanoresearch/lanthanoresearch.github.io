name: Read Aloud voices

# Puts Read Aloud's two built-in voices into the website itself (a "voice"
# folder), so the website and both apps carry them and need no internet.
# It runs by itself when this file or fetch-voice.cjs is uploaded, and does
# nothing if the voices are already there. It can also be run by hand from
# the Actions page.

on:
  push:
    paths:
      - ".github/workflows/voice-pack.yml"
      - "fetch-voice.cjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get the voices
        run: |
          if [ ! -f fetch-voice.cjs ]; then
            echo "::error::fetch-voice.cjs is not in the main folder. Upload it there."
            exit 1
          fi
          node fetch-voice.cjs .
          if [ ! -f voice/voice-pack.json ]; then
            echo "::error::The voices could not be downloaded just now (see the lines above). Run this again from the Actions page in a few minutes."
            exit 1
          fi
          du -sh voice

      - name: Save them in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add voice

          if git diff --cached --quiet; then
            echo "The voices are already in the repository."
          else
            git commit -m "Add Read Aloud's built-in voices"
            git pull --rebase
            git push
          fi
