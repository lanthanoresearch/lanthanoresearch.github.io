name: Site list and apps

# One workflow for everything:
#  1. Builds the Windows, Mac and Linux installers (only when desktop-app or
#     any page / script of the site changes, when this file changes, when no
#     installer exists yet, or when you run it by hand from the Actions tab).
#     The installers hold a full copy of the site, so they must be rebuilt
#     whenever the site changes.
#  2. Rebuilds site-files.json on every push, so the phone app, the
#     computer app and the installers always know about every file.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-and-apps
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.check.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=false
          before="${{ github.event.before }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build=true
          elif ! gh release view desktop-latest >/dev/null 2>&1; then
            build=true
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            build=true
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(desktop-app/|\.github/workflows/app\.yml|prepare-app-bundle\.js|build-site-manifest\.js)|\.(html|js|mjs|css)$|^(descriptions|manifest)\.json$'; then
            build=true
          fi

          echo "desktop=$build" >> "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle the whole website into the app
        run: |
          node build-site-manifest.js --copy desktop-app/site
          node prepare-app-bundle.js desktop-app/site --local-only --no-back
          mkdir -p desktop-app/build
          cp file_000000000c40722f92b1fe6758cb4855.png desktop-app/build/icon.png

      - name: Build installer
        working-directory: desktop-app
        run: |
          npm install
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop-app/dist/Lanthano-Research-Setup.exe
            desktop-app/dist/Lanthano-Research.dmg
            desktop-app/dist/Lanthano-Research.AppImage
          if-no-files-found: error

  release:
    needs: [changes, desktop]
    if: needs.changes.outputs.desktop == 'true' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release delete desktop-latest --cleanup-tag --yes || true
          gh release create desktop-latest installers/* \
            --title "Desktop app (latest)" \
            --notes "Installers for the Lanthano Research desktop app. Built automatically." \
            --target "${{ github.sha }}"

  # Keeps site-files.json and the transcripts up to date. It does not wait for
  # (or care about) the app builds above, so a failed or slow installer build
  # can never stop this commit from happening.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build transcripts.json (video transcripts for search)
        run: node build-transcripts.js

      - name: Build site-files.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view desktop-latest >/dev/null 2>&1; then
            export DESKTOP_BASE="https://github.com/${{ github.repository }}/releases/download/desktop-latest/"
          fi
          node build-site-manifest.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site-files.json
          for f in transcripts.json transcripts-list.json; do [ -f "$f" ] && git add "$f"; done
          git diff --staged --quiet || (git commit -m "Update site-files.json and transcripts" && git pull --rebase && git push)
