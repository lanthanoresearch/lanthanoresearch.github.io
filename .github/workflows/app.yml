name: Desktop apps

# One workflow for everything:
#  1. Builds the Windows, Mac and Linux installers (only when desktop-app or
#     any page / script of the site changes, when this file changes, when no
#     installer exists yet, or when you run it by hand from the Actions tab).
#     The installers hold a full copy of the site, so they must be rebuilt
#     whenever the site changes.
#  (site-files.json and the transcripts are kept up to date by the separate
#  workflow site-files.yml, so a slow installer build can never hold that up.)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-and-apps
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.check.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that every file in the repository is the newest version
        run: |
          fail=0
          need() {
            if [ ! -f "$1" ]; then
              echo "::error title=File missing::$1 is not in the repository (it belongs in $2)."
              fail=1
            elif ! grep -q -- "$3" "$1"; then
              echo "::error title=Old file in the repository::$1 is an old version. Upload the newest one to $2."
              fail=1
            fi
          }
          need prepare-app-bundle.js "the main folder" "REQUIRE_VIDEOS"
          need fetch-videos.js "the main folder" "useCurl"
          need app-update.js "the main folder" "Install the newest version of the app to get"
          need app-transform.js "the main folder" "settingsCards"
          need site-tools.js "the main folder" "LT_IN_APP"
          need video.html "the main folder" "inAppVideos"
          need pdf.html "the main folder" "pdf-lib.mjs"
          need pdf-compat.js "the main folder" "Uint8Array"
          need pdf-lib.mjs "the main folder" "pdf-compat"
          need pdf-worker.mjs "the main folder" "pdf-compat"
          need offline-app.js "the main folder" "findInstallers"
          need install.html "the main folder" "appWarn"
          need sw.js "the main folder" "lt-overlay-changed"
          need desktop-app/main.js "the desktop-app folder (the file is named main.js)" "applyLockdown"
          if [ "$fail" != "0" ]; then
            echo "The app was not built, so the apps already published stay as they are."
            exit 1
          fi

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=false
          before="${{ github.event.before }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build=true
          elif ! gh release view desktop-latest >/dev/null 2>&1; then
            build=true
          elif ! gh release view desktop-latest --json body -q .body | grep -q "all-videos-v1"; then
            # The published installer was not built under the "every video is inside" rule.
            build=true
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            build=true
          elif git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(desktop-app/|\.github/workflows/app\.yml|prepare-app-bundle\.js|build-site-manifest\.js)|\.(html|js|mjs|css)$|^(descriptions|manifest)\.json$'; then
            build=true
          fi

          echo "desktop=$build" >> "$GITHUB_OUTPUT"

  # Downloads the videos from the video server once, so they can be put inside
  # the installers (the apps then work with no internet). They are remembered
  # between runs, so only new videos are downloaded.
  videos:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.vkey.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: vkey
        run: echo "key=$(node fetch-videos.js --key)" >> "$GITHUB_OUTPUT"

      # Whatever was downloaded is remembered even when the download fails, so the
      # next run only has to fetch what is still missing.
      - uses: actions/cache/restore@v4
        with:
          path: .video-cache
          key: site-videos-${{ steps.vkey.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-videos-
          enableCrossOsArchive: true

      # Every video must come down, or the apps are not built (and the apps already
      # published stay as they are).
      - name: Download the videos
        run: STRICT=1 node fetch-videos.js .video-cache

      - name: Remember the videos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .video-cache
          key: site-videos-${{ steps.vkey.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  desktop:
    needs: [changes, videos]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the videos
        uses: actions/cache/restore@v4
        with:
          path: .video-cache
          key: site-videos-${{ needs.videos.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-videos-
          enableCrossOsArchive: true

      - name: Bundle the whole website, videos included, into the app
        run: |
          # Any video that is still missing is downloaded now (normally none).
          STRICT=1 node fetch-videos.js .video-cache
          node build-site-manifest.js --copy desktop-app/site
          node prepare-app-bundle.js desktop-app/site --local-only --no-back --videos .video-cache --require-videos
          mkdir -p desktop-app/build
          cp file_000000000c40722f92b1fe6758cb4855.png desktop-app/build/icon.png

      - name: Build installer
        working-directory: desktop-app
        run: |
          npm install
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop-app/dist/Lanthano-Research-Setup.exe
            desktop-app/dist/Lanthano-Research.dmg
            desktop-app/dist/Lanthano-Research.AppImage
          if-no-files-found: error

  release:
    needs: [changes, videos, desktop]
    # Publishes whichever installers were built, even if one of the three failed,
    # as long as the videos were all downloaded (the build needs them first).
    if: always() && needs.changes.outputs.desktop == 'true' && needs.videos.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          # The newest installers replace the old ones' files. The old release is never
          # deleted first, so if anything goes wrong the Install page keeps working.
          # Only the installers that were built are published. The release is marked as
          # complete only when all three were built, so an incomplete one is rebuilt
          # on the next push.
          NOTES="Installers for the Lanthano Research desktop app. Built automatically."
          if [ -f installers/Lanthano-Research-Setup.exe ] && [ -f installers/Lanthano-Research.dmg ] && [ -f installers/Lanthano-Research.AppImage ]; then
            NOTES="$NOTES Every video is inside (all-videos-v1)."
          else
            echo "::warning::Not every installer was built, so the release is not marked as complete."
          fi
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest installers/* --clobber
            gh release edit desktop-latest --notes "$NOTES"
          else
            gh release create desktop-latest installers/* \
              --title "Desktop app (latest)" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
