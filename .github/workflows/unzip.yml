name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf temp
          mkdir temp
          unzip -o lanthano-android-project.zip -d temp

      - name: Copy project files
        run: |
          rsync -av --exclude='.github/workflows/' temp/ ./

          if [ -d "temp/.github/workflows" ]; then
            mkdir -p workflows-to-add
            cp -r temp/.github/workflows/. workflows-to-add/
          fi

          rm -rf temp
          rm -f lanthano-android-project.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Android project" || true
          git push
