<div class="featured-video-section">

    <div class="featured-video-label">
        Featured Video
    </div>

    <div class="featured-video-card" id="featuredVideoCard">

        <div
            class="featured-video-preview"
            onclick="openFeaturedVideo()"
        >

            <div class="featured-video-thumbnail">

                <video
                    class="featured-video-preview-image"
                    muted
                    preload="metadata"
                    poster="prediction.jpg"
                >
                    <source src="prediction.mp4" type="video/mp4">
                </video>

                <div class="featured-video-play">
                    ▶
                </div>

            </div>

            <div class="featured-video-info">

                <div class="featured-video-title">
                    Prediction
                </div>

                <div class="featured-video-description">
                    A 2-minute presentation exploring the predictions,
                    evidence, and ideas presented by Lanthano.
                </div>

                <div class="featured-video-meta">
                    2 minutes • Lanthano Research
                </div>

            </div>

        </div>


        <div
            class="featured-video-expanded"
            id="featuredVideoExpanded"
        >

            <div class="featured-video-expanded-inner">

                <button
                    class="featured-video-close"
                    onclick="closeFeaturedVideo(event)"
                    aria-label="Close video"
                >
                    ×
                </button>

                <div class="featured-video-player">

                    <video
                        id="featuredVideoPlayer"
                        controls
                        playsinline
                        preload="metadata"
                    >
                        <source
                            src="prediction.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support HTML5 video.
                    </video>

                </div>

                <div class="featured-video-expanded-content">

                    <div class="featured-video-expanded-title">
                        Prediction
                    </div>

                    <div class="featured-video-expanded-description">
                        A 2-minute presentation exploring the predictions,
                        evidence, and ideas presented by Lanthano.
                    </div>

                    <div class="featured-video-expanded-meta">
                        2 minutes • Lanthano Research
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
