
<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lanthano Store</title>

<style>

html{
    scroll-behavior:smooth;
    background:#111;
}

body{
    margin:0;
    background:#111;
    color:#eee;
    font-family:Arial, sans-serif;
    text-align:center;
}
.store-preview{
    cursor:pointer;
    transition:transform .25s ease,
               box-shadow .25s ease;
}

.store-preview:hover{
    transform:scale(1.02);

    box-shadow:
        0 20px 55px rgba(0,0,0,.55),
        0 0 25px rgba(255,122,0,.18);
}
.container{
    max-width:1100px;
    margin:auto;
    padding:24px 20px 30px;
}

.container.extra-scroll-padding{
    padding-bottom:100px;
}

.back{
    display:block;
    text-align:left;
    color:#fff;
    text-decoration:none;
    margin-bottom:20px;
    font-size:1rem;
}

.back:hover{
    color:#fff;
}

h1{
    font-size:2.3em;
    margin:0 0 10px;
}

.subtitle{
    color:#bdbdbd;
    font-size:1rem;
    line-height:1.5;
    max-width:650px;
    margin:0 auto 22px;
}

.store-preview{
    width:100%;
    max-width:420px;
    border-radius:14px;
    border:2px solid #2b2b2b;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
    margin-bottom:22px;
}

.shop-button{
    display:inline-block;
    padding:14px 45px;

    color:white;
    text-decoration:none;
    font-size:1.1rem;
    font-weight:bold;

    border-radius:999px;

    background:linear-gradient(135deg,#ff7a00,#ff5400);

    box-shadow:
        0 0 20px rgba(255,122,0,.45),
        0 0 45px rgba(255,122,0,.25);

    transition:
        transform .25s,
        box-shadow .25s,
        filter .25s;
}

.shop-button:hover{

    transform:translateY(-4px) scale(1.03);

    filter:brightness(1.08);

    box-shadow:
        0 0 35px rgba(255,122,0,.75),
        0 0 65px rgba(255,122,0,.35);
}

.footer{
    margin-top:20px;
    color:#777;
    font-size:.95rem;
}

.top-button{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:50px;
    height:50px;
    background:#2a2a2a;
    color:white;
    text-decoration:none;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:24px;
    z-index:1000;
    opacity:.6;
}

.top-button:hover{
    opacity:.6;
    background:#2a2a2a;
}

@media (max-width:700px){

    h1{
        font-size:2em;
    }

    .subtitle{
        font-size:.95rem;
    }

    .shop-button{
        width:90%;
        max-width:340px;
        padding:15px 0;
    }

}

</style>

</head>

<body>

<div class="container">

<a class="back" href="index.html">◀ Home</a>

<h1>Lanthano Store</h1>

<p class="subtitle">
If you enjoy the research, music, or other projects from Lanthano, the official merchandise collection is one way to support what we do while representing the ideas behind the project.

</p>

<a
    href="https://lanthanostore.printful.me/"
    target="_blank">

    <img
        class="store-preview"
        src="shirtimage.png"
        alt="Lanthano Store Preview">

</a>

<br>

<a
    class="shop-button"
    href="https://lanthanostore.printful.me/"
    target="_blank">
    Browse the Collection →
</a>

<p class="footer">
Ideas Worth Representing.
</p>

</div>

<a href="#" class="top-button" id="topButton">
    <span style="position:relative; top:-3px;">▲</span>
</a>

<script>

const topButton = document.getElementById("topButton");
const pageContainer = document.querySelector(".container");

function updateTopButton(){
    if(window.scrollY > 10){
        topButton.style.display = "flex";
    }else{
        topButton.style.display = "none";
    }
}

function adjustForScrollButton(){

    // Reset first so we measure the page's natural height,
    // not the height inflated by our own extra padding.
    pageContainer.classList.remove("extra-scroll-padding");

    // Force a reflow so the browser recalculates height
    // before we measure it.
    void pageContainer.offsetHeight;

    const pageScrolls =
        document.documentElement.scrollHeight >
        window.innerHeight;

    if(pageScrolls){
        pageContainer.classList.add("extra-scroll-padding");
    }

}

topButton.addEventListener("click", function(e){
    e.preventDefault();
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

window.addEventListener("scroll", updateTopButton);

window.addEventListener("load", function(){
    adjustForScrollButton();
    updateTopButton();
});

window.addEventListener("resize", function(){
    adjustForScrollButton();
    updateTopButton();
});

</script>

</body>

</html>
