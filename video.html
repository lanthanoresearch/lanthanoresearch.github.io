<!DOCTYPE html>
<html lang="en">

<head>

    <link
        rel="icon"
        type="image/png"
        href="file_000000000c40722f92b1fe6758cb4855.png"
    >

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Video Viewer</title>

    <style>

        *{
            box-sizing:border-box;
        }

        html,
        body{
            margin:0;
            height:100%;
            background:#111;
            color:#eee;
            font-family:Arial,sans-serif;
            overflow:hidden;
        }

        body{
            display:flex;
            flex-direction:column;
        }


        /* ---------- Header ---------- */

        header{
            background:#1b1b1b;
            border-bottom:1px solid #333;
            padding:8px;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:8px;
        }


        /* ---------- Buttons ---------- */

        .controls{
            display:flex;
            gap:6px;
            flex-wrap:wrap;
        }

        .btn{
            background:#333;
            color:#fff;
            border:none;
            border-radius:7px;
            padding:9px 12px;
            text-decoration:none;
            cursor:pointer;
            font-size:14px;
        }

        .btn:hover{
            background:#444;
        }


        /* ---------- Menu ---------- */

        #menu{

            position:absolute;

            right:10px;
            top:58px;

            background:#222;

            border:1px solid #333;

            border-radius:10px;

            padding:8px;

            display:none;

            min-width:220px;

            z-index:1000;
        }

        #menu button{

            width:100%;

            text-align:left;

            margin:3px 0;

            background:#333;

            color:#fff;

            border:none;

            border-radius:7px;

            padding:9px 12px;

            cursor:pointer;

            font-size:14px;
        }

        #menu button:hover{
            background:#444;
        }


        /* ---------- Video Area ---------- */

        #viewer{

            flex:1;

            position:relative;

            overflow:hidden;

            display:flex;

            align-items:center;

            justify-content:center;

            background:#111;

            padding:15px;
        }

        #video{

            display:block;

            width:auto;

            height:auto;

            max-width:100%;

            max-height:100%;

            background:#000;

            object-fit:contain;
        }


        /* ---------- Title ---------- */

        .title{

            padding:8px 15px;

            text-align:center;

            font-weight:bold;

            font-size:1rem;

            white-space:nowrap;

            overflow:hidden;

            text-overflow:ellipsis;

            background:#181818;

            border-top:1px solid #2b2b2b;
        }


        /* ---------- Bottom Controls ---------- */

        #videoControls{

            display:flex;

            justify-content:center;

            align-items:center;

            gap:8px;

            padding:8px;

            background:#181818;
        }


        /* ---------- Speed ---------- */

        #speed{

            background:#333;

            color:#fff;

            border:none;

            border-radius:7px;

            padding:9px 12px;

            cursor:pointer;

            font-size:14px;
        }

        #speed:hover{
            background:#444;
        }


        /* ---------- Status ---------- */

        #status{

            position:absolute;

            left:50%;

            top:50%;

            transform:translate(-50%,-50%);

            color:#888;

            font-size:.95rem;

            text-align:center;

            pointer-events:none;

            display:none;
        }


        /* ---------- Mobile ---------- */

        @media(max-width:700px){

            .top{
                align-items:flex-start;
            }

            .controls .btn{
                padding:8px 10px;
                font-size:.9rem;
            }

            .title{
                font-size:.95rem;
            }

            #viewer{
                padding:5px;
            }

            #videoControls{
                gap:6px;
                padding:7px;
            }

            #speed{
                padding:8px 10px;
                font-size:.9rem;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="top">

        <a
            class="btn"
            id="homeButton"
            href="index.html"
        >
            ◀ Back
        </a>

        <div class="controls">

            <button
                class="btn"
                id="menuBtn"
            >
                ☰
            </button>

        </div>

    </div>

</header>


<!-- ---------- Menu ---------- -->

<div id="menu">

    <button id="downloadBtn">
        Download Video
    </button>

    <button id="newTabBtn">
        Open in New Tab
    </button>

    <button id="shareBtn">
        Share
    </button>

    <button id="fullscreenBtn">
        Fullscreen
    </button>

</div>


<!-- ---------- Video Viewer ---------- -->

<div id="viewer">

    <video
        id="video"
        controls
        playsinline
        preload="metadata"
        poster="prediction.jpg"
    >

        Your browser does not support HTML5 video.

    </video>

    <div id="status">
        Loading video...
    </div>

</div>


<!-- ---------- File Name ---------- -->

<div
    class="title"
    id="title"
>
    Loading...
</div>


<!-- ---------- Speed Controls ---------- -->

<div id="videoControls">

    <select id="speed">

        <option value="0.1">
            0.1×
        </option>

        <option value="0.25">
            0.25×
        </option>

        <option value="0.5">
            0.5×
        </option>

        <option value="0.75">
            0.75×
        </option>
        <option value="1" selected>
            1×
        </option>

        <option value="1.5">
            1.5×
        </option>

        <option value="2">
            2×
        </option>

        <option value="2.5">
            2.5×
        </option>

        <option value="3">
            3×
        </option>

    </select>

</div>


<script>


/* =========================================================
   VIDEO VIEWER
   ========================================================= */


/* ---------- URL Parameters ---------- */

const params =
    new URLSearchParams(
        window.location.search
    );


const src =
    params.get("video") || "";


const returnPage =
    params.get("return") || "index.html";


/* ---------- Elements ---------- */

const video =
    document.getElementById("video");

const title =
    document.getElementById("title");

const status =
    document.getElementById("status");

const menu =
    document.getElementById("menu");

const menuButton =
    document.getElementById("menuBtn");

const homeButton =
    document.getElementById("homeButton");

const downloadButton =
    document.getElementById("downloadBtn");

const newTabButton =
    document.getElementById("newTabBtn");

const shareButton =
    document.getElementById("shareBtn");

const fullscreenButton =
    document.getElementById("fullscreenBtn");

const speed =
    document.getElementById("speed");


/* ---------- Back Button ---------- */

homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        location.href =
            returnPage;

    }
);


/* ---------- Video Source ---------- */

if(!src){

    status.textContent =
        "No video specified.";

    status.style.display =
        "block";

}else{

    video.src =
        src;

    video.load();

}


/* ---------- File Name ---------- */

if(src){

    const filename =
        src
            .split("/")
            .pop();


    const displayName =
        decodeURIComponent(filename)
            .replace(/\.[^/.]+$/, "")
            .replace(/[-_]+/g, " ")
            .replace(/\b\w/g, function(char){

                return char.toUpperCase();

            });


    title.textContent =
        displayName;


    document.title =
        displayName;

}


/* ---------- Loading ---------- */

video.addEventListener(
    "loadstart",
    function(){

        status.textContent =
            "Loading video...";

        status.style.display =
            "block";

    }
);


video.addEventListener(
    "loadedmetadata",
    function(){

        status.style.display =
            "none";

    }
);


video.addEventListener(
    "canplay",
    function(){

        status.style.display =
            "none";

    }
);


video.addEventListener(
    "error",
    function(){

        status.textContent =
            "Unable to load video.";

        status.style.display =
            "block";

    }
);


/* ---------- Playback Speed ---------- */

speed.addEventListener(
    "change",
    function(){

        video.playbackRate =
            parseFloat(
                speed.value
            );

    }
);


/* ---------- Menu ---------- */

menuButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        menu.style.display =
            menu.style.display === "block"
                ? "none"
                : "block";

    }
);


menu.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";

    }
);


/* ---------- Download ---------- */

downloadButton.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";

        if(!src){
            return;
        }


        const link =
            document.createElement("a");


        link.href =
            src;


        link.download =
            decodeURIComponent(
                src.split("/").pop()
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }
);


/* ---------- Open in New Tab ---------- */

newTabButton.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";

        if(!src){
            return;
        }


        window.open(
            src,
            "_blank"
        );

    }
);


/* ---------- Share ---------- */

shareButton.addEventListener(
    "click",
    async function(){

        const url =
            window.location.href;


        menu.style.display =
            "none";


        /*
            FIRST:
            Use the device/browser's native
            sharing system.
        */

        if(
            navigator.share &&
            typeof navigator.share === "function"
        ){

            try{

                await navigator.share({

                    title:
                        title.textContent,

                    text:
                        title.textContent,

                    url:
                        url

                });

                return;

            }catch(error){

                /*
                    If the user cancelled the
                    native share dialog, stop.
                */

                if(
                    error &&
                    error.name === "AbortError"
                ){

                    return;

                }

            }

        }


        /*
            SECOND:
            Try automatic clipboard copying.
        */

        if(
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
        ){

            try{

                await navigator.clipboard.writeText(
                    url
                );

                return;

            }catch(error){

                /*
                    Continue to manual fallback.
                */

            }

        }


        /*
            THIRD:
            Let the user manually copy the URL.
        */

        window.prompt(
            "Copy this link:",
            url
        );

    }
);


/* ---------- Fullscreen ---------- */

fullscreenButton.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";


        if(document.fullscreenElement){

            document.exitFullscreen();

            return;

        }


        if(
            video.requestFullscreen
        ){

            video.requestFullscreen();

        }else if(
            document.documentElement.requestFullscreen
        ){

            document.documentElement.requestFullscreen();

        }

    }
);


/* ---------- Keyboard Shortcuts ---------- */

document.addEventListener(
    "keydown",
    function(event){

        /*
            Space = play/pause
        */

        if(
            event.code === "Space" &&
            document.activeElement.tagName !== "SELECT"
        ){

            event.preventDefault();


            if(video.paused){

                video.play();

            }else{

                video.pause();

            }

        }


        /*
            Escape = exit fullscreen
        */

        if(
            event.key === "Escape" &&
            document.fullscreenElement
        ){

            document.exitFullscreen();

        }

    }
);


/* ---------- Initialize ---------- */

video.playbackRate = 1;


</script>


</body>

</html>
