<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" type="image/png" href="file_000000000c40722f92b1fe6758cb4855.png">

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Video Viewer</title>

<style>

/* ============================================================
   GLOBAL
============================================================ */

:root{
  --bg:#111;
  --panel:#1b1b1b;
  --panel2:#242424;
  --text:#eee;
  --muted:#aaa;
  --viewer-top:106px;
  --titlebar-h:56px;
  --float-gap:18px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ============================================================
   HEADER
============================================================ */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  min-height:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:#181818;

  border-bottom:1px solid #2d2d2d;

  z-index:6000;
}

/* ============================================================
   TOOLBAR
============================================================ */

#toolbar{
  position:fixed;

  top:58px;
  left:0;
  right:0;

  min-height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 8px;

  background:#1b1b1b;

  border-bottom:1px solid #2d2d2d;

  flex-wrap:wrap;

  z-index:5500;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */

#layout{
  position:absolute;

  top:var(--viewer-top);

  left:0;
  right:0;
  bottom:0;

  height:auto;
}

/* ============================================================
   VIEWER
============================================================ */

#viewer{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#111;

  padding:15px;
}

#video{

  display:block;

  width:auto;

  height:auto;

  max-width:100%;

  max-height:100%;

  background:#000;

  object-fit:contain;
}

/* ============================================================
   BUTTONS
============================================================ */

.btn{
  background:#333;

  color:#fff;

  border:none;

  border-radius:7px;

  padding:9px 12px;

  text-decoration:none;

  cursor:pointer;

  display:inline-flex;

  align-items:center;

  white-space:nowrap;
}

.btn:hover{
  background:#3a3a3a;
}

button,
input,
select{
  background:#292929;

  color:#fff;

  border:1px solid #383838;

  border-radius:6px;

  padding:6px 9px;

  font:inherit;

  outline:none;
}

button:hover,
select:hover{
  background:#353535;

  cursor:pointer;
}

button:active{
  background:#414141;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
  border-color:#666;

  outline:1px solid #555;
}

/* ============================================================
   COMPACT TOOLBAR CONTROLS
============================================================ */

.toolButton{
  height:32px;

  padding:0 10px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  white-space:nowrap;

  font-size:13px;

  border-radius:6px;

  text-decoration:none;
}

.iconButton{
  width:32px;
  height:32px;

  padding:0;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  font-size:16px;

  border-radius:6px;
}

/* ============================================================
   SPEED CONTROL
============================================================ */

.speedControl{
  display:flex;

  align-items:center;

  gap:6px;

  height:32px;

  padding:0 10px;

  background:#242424;

  border:1px solid #353535;

  border-radius:7px;
}

.speedControl label{
  color:#aaa;

  font-size:12px;

  white-space:nowrap;
}

#speed{

  height:26px;

  padding:0 6px;

  background:#1d1d1d;

  border:0;

  border-radius:4px;

  font-size:12px;
}

/* ============================================================
   TOOLBAR DIVIDER
============================================================ */

.toolbarDivider{
  width:1px;

  height:22px;

  background:#383838;

  margin:0 2px;
}

/* ============================================================
   TITLE BAR
============================================================ */

#titleBar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  background:rgba(24,24,24,.92);

  padding:12px 18px;

  text-align:center;

  z-index:3000;

  border-top:1px solid #333;

  backdrop-filter:blur(6px);
}

#title{
  width:100%;

  text-align:center;

  font-size:1.2rem;

  font-weight:bold;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;
}

/* ============================================================
   MENU
============================================================ */

#menu{

  position:fixed;

  right:10px;
  top:58px;

  background:#222;

  border:1px solid #333;

  border-radius:10px;

  padding:8px;

  display:none;

  min-width:220px;

  z-index:7000;
}

#menu button{

  width:100%;

  text-align:left;

  margin:3px 0;
}

/* ============================================================
   FLOATING READING MODE
============================================================ */

#readingModeFloat{

  position:fixed;

  right:var(--float-gap);

  bottom:calc(var(--titlebar-h) + var(--float-gap));

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border-radius:50%;

  background:
    rgba(40,40,40,.94);

  border:1px solid #555;

  color:#fff;

  font-size:18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.45);

  z-index:9000;

  cursor:pointer;

  backdrop-filter:blur(6px);

  transition:
    transform .15s ease,
    background .15s ease;
}

#readingModeFloat:hover{
  background:#3a3a3a;

  transform:scale(1.05);
}

#readingModeFloat:active{
  transform:scale(.96);
}

/* ============================================================
   STATUS / LOADING
============================================================ */

#loadingOverlay{
  position:fixed;

  inset:var(--viewer-top) 0 0 0;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  background:#111;

  z-index:8000;

  pointer-events:none;
}

.spinner{
  width:60px;
  height:60px;

  border:6px solid #333;

  border-top:6px solid #fff;

  border-radius:50%;

  animation:
    spin .9s linear infinite;
}

.loadingText{
  margin-top:18px;

  color:#ddd;

  font-size:18px;
}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* ============================================================
   READING MODE
============================================================ */

body.reading-mode header,
body.reading-mode #toolbar,
body.reading-mode #titleBar,
body.reading-mode #menu{

  display:none !important;

  height:0 !important;

  min-height:0 !important;

  max-height:0 !important;

  margin:0 !important;

  padding:0 !important;

  border:0 !important;

  overflow:hidden !important;
}

body.reading-mode #layout{

  top:0 !important;

  height:100% !important;

  position:absolute;
}

body.reading-mode #loadingOverlay{

  inset:0;
}

body.reading-mode #readingModeFloat{

  right:16px;

  bottom:16px;

  background:
    rgba(40,40,40,.88);
}

/* ============================================================
   MOBILE
============================================================ */

@media (max-width:768px){

  #toolbar{
    justify-content:center;

    gap:4px;

    padding:5px;
  }

  .toolButton{
    height:30px;

    padding:0 8px;

    font-size:12px;
  }

  .speedControl{
    height:30px;
  }

  .speedControl label{
    display:none;
  }

  #speed{
    height:25px;
  }

  #readingModeFloat{

    right:14px;

    bottom:calc(var(--titlebar-h) + 14px);

    width:46px;
    height:46px;

    font-size:16px;
  }

  body.reading-mode #readingModeFloat{

    right:12px;

    bottom:12px;
  }

  #title{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }

}

</style>
</head>

<body>

<!-- ==========================================================
     HEADER
========================================================== -->

<header>

  <a
    class="btn"
    id="homeButton"
    href="index.html"
  >
    ◀ Back
  </a>

  <div style="flex:1"></div>

  <button id="menuBtn">
    ☰
  </button>

</header>

<!-- ==========================================================
     TOOLBAR
========================================================== -->

<div id="toolbar">

  <div class="speedControl">

    <label for="speed">
      Speed
    </label>

    <select id="speed">

      <option value="0.1">
        0.1×
      </option>

      <option value="0.25">
        0.25×
      </option>

      <option value="0.5">
        0.5×
      </option>

      <option value="0.75">
        0.75×
      </option>

      <option value="1" selected>
        1×
      </option>

      <option value="1.25">
        1.25×
      </option>

      <option value="1.5">
        1.5×
      </option>

      <option value="1.75">
        1.75×
      </option>

      <option value="2">
        2×
      </option>

      <option value="2.5">
        2.5×
      </option>

      <option value="3">
        3×
      </option>

      <option value="4">
        4×
      </option>

    </select>

  </div>

</div>

<!-- ==========================================================
     LAYOUT
========================================================== -->

<div id="layout">

  <div id="loadingOverlay">

    <div class="spinner"></div>

    <div class="loadingText" id="statusText">
      Loading video...
    </div>

  </div>

  <div id="viewer">

    <video
      id="video"
      controls
      playsinline
      preload="metadata"
      poster="prediction.jpg"
    >

      Your browser does not support HTML5 video.

    </video>

  </div>

</div>

<!-- ==========================================================
     TITLE BAR
========================================================== -->

<div
  id="titleBar"
>

  <div id="title">
    Loading...
  </div>

</div>

<!-- ==========================================================
     MENU
========================================================== -->

<div id="menu">

  <button id="downloadBtn">
    Download Video
  </button>

  <button id="newTabBtn">
    Open in New Tab
  </button>

  <button id="shareBtn">
    Share Video
  </button>

  <button id="fullscreenBtn">
    Fullscreen
  </button>

</div>

<!-- ==========================================================
     FLOATING READING MODE
========================================================== -->

<button
  id="readingModeFloat"
  aria-label="Toggle Reading Mode"
  title="Reading Mode"
>
  ▣
</button>

<script>


/* =========================================================
   VIDEO VIEWER
   ========================================================= */


/* ---------- URL Parameters ---------- */

const params =
    new URLSearchParams(
        window.location.search
    );


const src =
    params.get("video") || "";


const returnPage =
    params.get("return") || "index.html";


/* ---------- Elements ---------- */

const video =
    document.getElementById("video");

const title =
    document.getElementById("title");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const statusText =
    document.getElementById("statusText");

const menu =
    document.getElementById("menu");

const menuButton =
    document.getElementById("menuBtn");

const homeButton =
    document.getElementById("homeButton");

const downloadButton =
    document.getElementById("downloadBtn");

const newTabButton =
    document.getElementById("newTabBtn");

const shareButton =
    document.getElementById("shareBtn");

const fullscreenButton =
    document.getElementById("fullscreenBtn");

const speed =
    document.getElementById("speed");

const header =
    document.querySelector("header");

const toolbar =
    document.getElementById("toolbar");

const layout =
    document.getElementById("layout");

const titleBar =
    document.getElementById("titleBar");

const readingModeFloat =
    document.getElementById("readingModeFloat");


/* ---------- Chrome Height Sync ---------- */

function syncViewerTop(){

    if(
        document.body.classList.contains(
            "reading-mode"
        )
    ){

        return;

    }

    const headerHeight =
        header.getBoundingClientRect()
            .height;

    const toolbarHeight =
        toolbar.getBoundingClientRect()
            .height;

    const total =
        Math.ceil(
            headerHeight +
            toolbarHeight
        );

    document.documentElement.style.setProperty(
        "--viewer-top",
        `${total}px`
    );

    layout.style.top =
        `${total}px`;

    loadingOverlay.style.top =
        `${total}px`;

}


function syncTitleBarHeight(){

    const height =
        titleBar.getBoundingClientRect()
            .height;

    document.documentElement.style.setProperty(
        "--titlebar-h",
        `${Math.ceil(height)}px`
    );

}


/* ---------- Back Button ---------- */

homeButton.href =
    returnPage;


homeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        location.href =
            returnPage;

    }
);


/* ---------- Video Source ---------- */

if(!src){

    statusText.textContent =
        "No video specified.";

    loadingOverlay.style.display =
        "flex";

}else{

    video.src =
        src;

    video.load();

}


/* ---------- File Name ---------- */

if(src){

    const filename =
        src
            .split("/")
            .pop();


    const displayName =
        decodeURIComponent(filename)
            .replace(/\.[^/.]+$/, "")
            .replace(/[-_]+/g, " ")
            .replace(/\b\w/g, function(char){

                return char.toUpperCase();

            });


    title.textContent =
        displayName;


    document.title =
        displayName;

}


/* ---------- Loading ---------- */

video.addEventListener(
    "loadstart",
    function(){

        statusText.textContent =
            "Loading video...";

        loadingOverlay.style.display =
            "flex";

    }
);


video.addEventListener(
    "loadedmetadata",
    function(){

        loadingOverlay.style.display =
            "none";

    }
);


video.addEventListener(
    "canplay",
    function(){

        loadingOverlay.style.display =
            "none";

    }
);


video.addEventListener(
    "error",
    function(){

        statusText.textContent =
            "Unable to load video.";

        loadingOverlay.style.display =
            "flex";

    }
);


/* ---------- Playback Speed ---------- */

speed.addEventListener(
    "change",
    function(){

        video.playbackRate =
            parseFloat(
                speed.value
            );

    }
);


/* ---------- Menu ---------- */

menuButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        menu.style.display =
            menu.style.display === "block"
                ? "none"
                : "block";

    }
);


menu.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";

    }
);


/* ---------- Download ---------- */

downloadButton.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";

        if(!src){
            return;
        }


        const link =
            document.createElement("a");


        link.href =
            src;


        link.download =
            decodeURIComponent(
                src.split("/").pop()
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }
);


/* ---------- Open in New Tab ---------- */

newTabButton.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";

        if(!src){
            return;
        }


        window.open(
            src,
            "_blank"
        );

    }
);


/* ---------- Share ---------- */

shareButton.addEventListener(
    "click",
    async function(){

        const url =
            window.location.href;


        menu.style.display =
            "none";


        /* Native device/browser sharing */

        if(
            navigator.share &&
            typeof navigator.share === "function"
        ){

            try{

                await navigator.share({

                    title:
                        title.textContent,

                    text:
                        title.textContent,

                    url:
                        url

                });

                return;

            }catch(error){

                /*
                    If the user cancelled the
                    native share dialog, stop.
                */

                if(
                    error &&
                    error.name === "AbortError"
                ){

                    return;

                }

            }

        }


        /* Automatic clipboard fallback */

        if(
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
        ){

            try{

                await navigator.clipboard.writeText(
                    url
                );

                alert(
                    "Link copied to clipboard!"
                );

                return;

            }catch(error){

                /*
                    Continue to manual fallback.
                */

            }

        }


        /* Manual fallback */

        window.prompt(
            "Copy this link:",
            url
        );

    }
);


/* ---------- Fullscreen ---------- */

fullscreenButton.addEventListener(
    "click",
    function(){

        menu.style.display =
            "none";


        if(document.fullscreenElement){

            document.exitFullscreen();

            return;

        }


        if(
            video.requestFullscreen
        ){

            video.requestFullscreen();

        }else if(
            document.documentElement.requestFullscreen
        ){

            document.documentElement.requestFullscreen();

        }

    }
);


/* ---------- Keyboard Shortcuts ---------- */

document.addEventListener(
    "keydown",
    function(event){

        /* Space = play/pause */

        if(
            event.code === "Space" &&
            document.activeElement.tagName !== "SELECT"
        ){

            event.preventDefault();


            if(video.paused){

                video.play();

            }else{

                video.pause();

            }

        }


        /* Escape = exit fullscreen */

        if(
            event.key === "Escape" &&
            document.fullscreenElement
        ){

            document.exitFullscreen();

        }

    }
);


/* =========================================================
   READING MODE
   ========================================================= */

let readingMode =
    false;


function setReadingMode(
    enabled
){

    readingMode =
        Boolean(
            enabled
        );

    if(
        readingMode
    ){

        document.body.classList.add(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "×";

        readingModeFloat.title =
            "Exit Reading Mode";

        menu.style.display =
            "none";

        layout.style.top =
            "0px";

        loadingOverlay.style.top =
            "0px";

    }else{

        document.body.classList.remove(
            "reading-mode"
        );

        readingModeFloat.textContent =
            "▣";

        readingModeFloat.title =
            "Reading Mode";

        syncViewerTop();

    }

}


readingModeFloat.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        setReadingMode(
            !readingMode
        );

    }
);


/* =========================================================
   CHROME RESIZE OBSERVER
   ========================================================= */

if(
    "ResizeObserver" in window
){

    const chromeObserver =
        new ResizeObserver(
            function(){

                syncViewerTop();

                syncTitleBarHeight();

            }
        );

    chromeObserver.observe(
        header
    );

    chromeObserver.observe(
        toolbar
    );

    chromeObserver.observe(
        titleBar
    );

}


window.addEventListener(
    "resize",
    syncViewerTop
);


syncViewerTop();

syncTitleBarHeight();


/* ---------- Initialize ---------- */

video.playbackRate = 1;


</script>


</body>

</html>
